<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>护理学自考刷题</title>
<meta name="theme-color" content="#0c7c8c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%230c7c8c'/><text x='12' y='17' font-size='13' fill='white' text-anchor='middle'>护</text></svg>">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --primary:#0c7c8c; --primary-d:#095f6b; --primary-l:#e2f2f4;
  --bg:#f3f7f7; --card:#ffffff; --text:#1f2d2e; --muted:#6b7c7d;
  --line:#e1e9e9; --ok:#1a9e5c; --ok-bg:#e7f6ee; --bad:#d94848; --bad-bg:#fdecec;
  --amber:#f4a259; --amber-bg:#fef3e6;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:16px}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:10;background:var(--primary);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:10px;
}
.topbar .title{font-size:17px;font-weight:600;flex:1;text-align:center}
.topbar .back{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.topbar .back:active{background:rgba(255,255,255,.18)}
.topbar .right{width:36px;display:flex;align-items:center;justify-content:center}
.timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:8px;font-size:14px;font-weight:600}
.timer.warn{background:#d94848}

.hero{
  background:linear-gradient(160deg,#0c7c8c 0%,#095f6b 100%);color:#fff;
  padding:calc(28px + env(safe-area-inset-top)) 20px 28px;
  border-radius:0 0 24px 24px;
}
.hero h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.hero .sub{margin-top:6px;font-size:14px;opacity:.9}
.hero .stats{display:flex;gap:14px;margin-top:18px}
.hero .stat{background:rgba(255,255,255,.16);border-radius:12px;padding:10px 14px;flex:1}
.hero .stat .n{font-size:22px;font-weight:700}
.hero .stat .l{font-size:12px;opacity:.9}

.menu{padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.menu-card{
  background:var(--card);border-radius:var(--r);padding:18px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(12,124,140,.06);
  border:1px solid var(--line);
}
.menu-card .ic{width:46px;height:46px;border-radius:12px;background:var(--primary-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.menu-card .tx{flex:1}
.menu-card .tx .t{font-size:16px;font-weight:600}
.menu-card .tx .d{font-size:13px;color:var(--muted);margin-top:2px}
.menu-card .arrow{color:#b8c4c5;font-size:20px}
.menu-card:active{transform:scale(.99)}
.menu-card.warn .ic{background:var(--bad-bg)} .menu-card.amber .ic{background:var(--amber-bg)}

.subj-card{
  background:var(--card);border-radius:var(--r);padding:18px 16px;
  display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);
  border:1px solid var(--line);margin-bottom:10px;
}
.subj-card .badge-code{font-size:12px;color:var(--primary);background:var(--primary-l);padding:2px 8px;border-radius:6px;font-weight:600}
.subj-card:active{transform:scale(.99)}

.list{padding:16px;display:flex;flex-direction:column;gap:10px}
.list-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;display:flex;align-items:center;gap:12px;
}
.list-item:active{background:#eef4f4}
.list-item .li-t{flex:1}
.list-item .li-t .name{font-size:16px;font-weight:600}
.list-item .li-t .meta{font-size:13px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--primary-l);color:var(--primary);font-weight:600}
.badge.multi{background:#eef0fb;color:#4a5aa8}
.badge.fill{background:#e6f4f6;color:#0e7c8c}
.badge.term{background:#fef3e2;color:#b4691a}
.badge.short{background:#e7f6ee;color:#1a9e5c}
.badge.essay{background:#fef3e6;color:#c77a2e}
.badge.case{background:#fdecec;color:#d94848}
.badge.wrong{background:var(--bad-bg);color:var(--bad)}
.badge.application{background:#f0e6f6;color:#8b4aa8}

.picker{padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.picker h2{font-size:18px;margin-bottom:4px}
.btn{
  display:block;width:100%;padding:15px;border-radius:12px;font-size:16px;font-weight:600;
  text-align:center;transition:opacity .15s;
}
.btn:active{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}

.quiz-body{flex:1;display:flex;flex-direction:column;padding:14px 16px 20px}
.prog-wrap{margin-bottom:12px}
.prog-text{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.prog-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);width:0;transition:width .3s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chapter-tag{font-size:12px;color:var(--muted);background:#eef4f4;padding:2px 9px;border-radius:6px}
.score-tag{font-size:12px;color:var(--primary-d);background:var(--primary-l);padding:2px 9px;border-radius:6px;font-weight:600}
.stem{font-size:17px;line-height:1.65;font-weight:500;white-space:pre-wrap}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:#fafcfc;text-align:left;width:100%;
}
.opt .ol{
  width:26px;height:26px;border-radius:50%;border:1.5px solid #b8c4c5;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted);
}
.opt .ot{flex:1;font-size:15px;line-height:1.5}
.opt.sel{border-color:var(--primary);background:var(--primary-l)}
.opt.sel .ol{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .ol{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .ol{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt:not(.locked):active{transform:scale(.99)}

.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px}
.feedback.ok{background:var(--ok-bg);color:#0e6b3c}
.feedback.bad{background:var(--bad-bg);color:#a83232}
.feedback .ans{font-weight:600;margin-bottom:4px}
.feedback .exp{color:#445}
.subj-ans{margin-top:14px;background:var(--primary-l);border-radius:10px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;color:#153e44}
.subj-ans .lab{font-weight:700;color:var(--primary-d);margin-bottom:6px;display:block}

.quiz-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.self-assess{display:flex;gap:10px;margin-top:14px}
.self-assess .btn{flex:1;padding:13px}

.result-wrap{padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.score-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.score-card .big{font-size:48px;font-weight:700;color:var(--primary)}
.score-card .big small{font-size:18px;color:var(--muted);font-weight:500}
.score-row{display:flex;gap:10px;margin-top:16px}
.score-row .sc{flex:1;background:var(--bg);border-radius:10px;padding:12px}
.score-row .sc .n{font-size:20px;font-weight:700}
.score-row .sc .l{font-size:12px;color:var(--muted)}

.wrong-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.wrong-item .ws{font-size:15px;line-height:1.5;margin:8px 0 10px;white-space:pre-wrap}
.wrong-item .wfoot{display:flex;justify-content:space-between;align-items:center}
.link-btn{color:var(--bad);font-size:14px;padding:6px 10px}

.about{padding:20px 18px;font-size:14px;color:#334442}
.about h2{font-size:17px;margin:18px 0 8px;color:var(--primary-d)}
.about p{margin-bottom:10px;line-height:1.7}
.note{background:var(--amber-bg);border-radius:10px;padding:12px 14px;font-size:13px;color:#8a5a1e}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:12px}

.mock-sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.mock-sheet .cell{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:#fafcfc;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
.mock-sheet .cell.answered{background:var(--primary-l);border-color:var(--primary);color:var(--primary)}
.mock-sheet .cell.current{outline:2.5px solid var(--primary)}
.mock-subj-note{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--amber-bg);color:#8a5a1e;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUBJECTS=[{"id":"emergency","name":"急救护理学","code":"03007","color":"#0c7c8c","icon":"🚑","wrongKey":"nursing_emergency_wrong_v1","papers":[{"key":"2017_04","name":"2017年4月","qs":[{"i":"2017_04_single_1","t":"single","s":"理想的急救反应时间是","c":"绪论","sc":1,"o":{"A":"4~5分钟","B":"6~8分钟","C":"9~10分钟","D":"15分钟以内"},"a":"A","e":"教材指出现场急救的理想反应时间（急救中心接到呼救至救护车到达现场）为4~5min。"},{"i":"2017_04_single_2","t":"single","s":"机械性损害如大手术后组织损伤所引起的发热是由于","c":"常见急性症状的评估","sc":1,"o":{"A":"皮肤散热减少","B":"抗原抗体反应","C":"无菌性坏死物质吸收","D":"体温调节中枢功能失常"},"a":"C","e":"大手术后组织损伤、内出血血肿、内脏梗死等属无菌性组织损伤，其发热由无菌性坏死物质吸收引起。"},{"i":"2017_04_single_3","t":"single","s":"下列疾病可导致咯血的是","c":"常见急性症状的评估","sc":1,"o":{"A":"消化性溃疡","B":"肺结核","C":"肝硬化","D":"胆道出血"},"a":"B","e":"肺结核是咯血最常见病因之一；消化性溃疡、肝硬化、胆道出血主要引起呕血或便血。"},{"i":"2017_04_single_4","t":"single","s":"强直阵挛型持续发作的抽搐患者，急救中不应","c":"神经系统急症患者的护理","sc":1,"o":{"A":"放置牙垫","B":"静脉注射地西泮","C":"保留灌肠","D":"强力按压抽搐的肢体"},"a":"D","e":"抽搐发作时不可强力按压抽搐肢体，以免造成骨折、脱臼；应放置牙垫防舌咬伤、保持呼吸道通畅并遵医嘱用地西泮止惊。"},{"i":"2017_04_single_5","t":"single","s":"评估患者氧合状况的指标是","c":"危重症患者的护理","sc":1,"o":{"A":"尿量","B":"心率","C":"呼吸频率","D":"血氧饱和度"},"a":"D","e":"脉搏血氧饱和度(SpO2)是无创评估机体氧合状况的常用指标。"},{"i":"2017_04_single_6","t":"single","s":"下列指标中可反映中枢神经系统功能的是","c":"常见急性症状的评估","sc":1,"o":{"A":"瞳孔","B":"皮肤温湿度","C":"血压","D":"心率"},"a":"A","e":"瞳孔的大小、对称及对光反射可直接反映中枢神经系统功能状态。"},{"i":"2017_04_single_7","t":"single","s":"下列患者中严禁转运的是","c":"绪论","sc":1,"o":{"A":"颈椎骨折","B":"气胸","C":"呼吸心跳骤停","D":"肠梗阻"},"a":"C","e":"呼吸心跳骤停未行初期复苏、生命体征极不稳定者严禁转运，须先就地抢救。"},{"i":"2017_04_single_8","t":"single","s":"专业急救人员判断患者是否有大动脉搏动消失，触诊颈动脉的时间不应超过","c":"心肺复苏","sc":1,"o":{"A":"5秒","B":"10秒","C":"15秒","D":"20秒"},"a":"B","e":"判断颈动脉搏动时间不能超过10s，10s内仍不能确定者应立即开始胸外按压。"},{"i":"2017_04_single_9","t":"single","s":"除颤与CPR配合时，允许胸外按压中断的时间不超过","c":"心肺复苏","sc":1,"o":{"A":"5秒","B":"10秒","C":"15秒","D":"20秒"},"a":"A","e":"除颤与CPR配合时应尽量缩短胸外按压中断时间，旧版教材要求按压中断不超过5秒。"},{"i":"2017_04_single_10","t":"single","s":"某急性心肌梗死患者突发室颤，在除颤和CPR过程中应选用的抗心律失常药物是","c":"心肺复苏","sc":1,"o":{"A":"利多卡因","B":"肾上腺素","C":"血管加压素","D":"阿托品"},"a":"A","e":"顽固性室颤/室速在除颤后仍反复发作者，旧版首选胺碘酮之前常用利多卡因静脉注射。"},{"i":"2017_04_single_11","t":"single","s":"高级生命支持中后续ABCD的内容不包括","c":"心肺复苏","sc":1,"o":{"A":"气管内插管","B":"给氧","C":"开通静脉","D":"除颤"},"a":"D","e":"后续(进一步)ABCD指气道管理(A气管插管)、呼吸支持(B给氧/机械通气)、循环支持(C开通静脉用药)和鉴别诊断(D)；除颤属初始处置。"},{"i":"2017_04_single_12","t":"single","s":"下列灾难致伤的检伤分类中，应给予黑色标志的是","c":"绪论","sc":1,"o":{"A":"非常严重的创伤，但及时治疗有生存机会","B":"可自行走动及没有严重创伤，可延迟处理","C":"无可救治的创伤","D":"有重大创伤，但短暂等候不危及生命"},"a":"C","e":"检伤分类黑标(死亡/濒死)指无可救治、存活希望极小的创伤，暂缓救治以集中资源于可救活者。"},{"i":"2017_04_single_13","t":"single","s":"患者，男性，65岁，因外伤大出血急诊抢救，患者既往心肾功能佳。在补液扩容过程中，护士监测发现患者T37.5℃，P132次/分，R22次/分，BP 80/60mmHg，HR 132次/分，CVP 5cmH2O。于是，护士加快输液速度、在5分钟内给患者输入了9%盐水250ml，其后监测显示：BP 80/60mmHg，HR 135次/分，CVP 8cmH2O。患者血流动力学监测的变化提示","c":"危重症患者的护理","sc":1,"o":{"A":"心功能不全","B":"血容量不足","C":"肾功能不全","D":"容量血管过度收缩"},"a":"A","e":"补液试验后血压仍低而CVP由5升至8cmH2O，提示补液后血容量已回心但不能有效搏出，为心功能不全(心衰)。"},{"i":"2017_04_single_14","t":"single","s":"患者，男性，48岁，因腹部损伤引起肠瘘，予禁食。主诉四肢无力，心电图出现ST段降低和U波，应检测","c":"危重症患者的护理","sc":1,"o":{"A":"血清钾","B":"血常规","C":"血清钙","D":"血清钠"},"a":"A","e":"肠瘘禁食致钾丢失摄入不足，四肢无力伴ST段降低、出现U波是低钾血症典型心电图改变，应检测血清钾。"},{"i":"2017_04_single_15","t":"single","s":"代谢性碱中毒患者易出现","c":"危重症患者的护理","sc":1,"o":{"A":"高钾血症","B":"低钾血症","C":"低钠血症","D":"高镁血症"},"a":"B","e":"代谢性碱中毒时H+-K+交换及肾小管排钾增加，易合并低钾血症。"},{"i":"2017_04_single_16","t":"single","s":"下列致伤原因中，可导致复合伤的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"坠楼","B":"刀刺伤","C":"爆炸伤","D":"烧伤"},"a":"C","e":"复合伤指由两种或两种以上不同性质致伤因素造成的损伤，爆炸伤常同时引起冲击伤、烧伤和挤压伤等。"},{"i":"2017_04_single_17","t":"single","s":"诊断泌尿系统损伤的重要临床依据是","c":"损伤急症患者的护理","sc":1,"o":{"A":"尿频","B":"尿急","C":"尿痛","D":"血尿"},"a":"D","e":"血尿是泌尿系统(肾、输尿管、膀胱、尿道)损伤最重要、最常见的临床依据。"},{"i":"2017_04_single_18","t":"single","s":"竹叶青蛇、蝰蛇和龟壳花蛇等血循毒性毒蛇，一般不会引起被咬伤者","c":"损伤急症患者的护理","sc":1,"o":{"A":"溶血和出血","B":"肌肉和呼吸麻痹","C":"急性肾功能衰竭","D":"急性循环衰竭"},"a":"B","e":"血循毒(竹叶青、蝰蛇)主要引起溶血、出血、急性肾衰及循环衰竭；肌肉和呼吸麻痹是神经毒素的表现。"},{"i":"2017_04_single_19","t":"single","s":"下列不属于阿片类镇痛药戒断症状的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"便秘","B":"瞳孔散大","C":"流涕、出汗","D":"打哈欠"},"a":"A","e":"瞳孔散大、流涕出汗、打哈欠、腹泻、全身酸痛等为阿片类戒断症状；便秘是阿片类药物治疗时的副作用，不属于戒断症状。"},{"i":"2017_04_single_20","t":"single","s":"某急性呼吸衰竭患者，收入急诊后监测其脉搏氧饱和度70%，估计其氧分压不高于","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"80mmHg","B":"60mmHg","C":"50mmHg","D":"40mmHg"},"a":"D","e":"按氧解离曲线，SpO2约70%时对应的PaO2约40mmHg。"},{"i":"2017_04_single_21","t":"single","s":"肝脓肿患者典型的热型是","c":"常见急性症状的评估","sc":1,"o":{"A":"间歇热","B":"稽留热","C":"弛张热","D":"回归热"},"a":"C","e":"肝脓肿、脓毒症等感染常表现为弛张热(24h体温差超过1℃且最低仍高于正常)。"},{"i":"2017_04_single_22","t":"single","s":"下列血气分析结果提示I型呼吸衰竭的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"PaO2 45mmHg，PaCO2 30mmHg","B":"PaO2 45mmHg，PaCO2 70mmHg","C":"PaO2 65mmHg，PaCO2 70mmHg","D":"PaO2 65mmHg，PaCO2 30mmHg"},"a":"A","e":"I型(低氧血症型)呼衰PaO2<60mmHg而PaCO2正常或降低；A项PaO2 45、PaCO2 30符合。"},{"i":"2017_04_single_23","t":"single","s":"溶栓治疗过程中，能提示血管再通的指标不包括","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"缺血性胸痛完全消失","B":"ST段回落50%","C":"再灌注心律失常","D":"CK-MB酶峰推迟出现"},"a":"D","e":"冠脉再通指标包括胸痛迅速缓解、ST段回落>50%、出现再灌注心律失常及CK-MB酶峰提前(而非推迟)。"},{"i":"2017_04_single_24","t":"single","s":"发生急性心肌梗死时，最常见的症状是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"呼吸困难","B":"胸痛","C":"恶心、呕吐","D":"乏力"},"a":"B","e":"胸痛(胸骨后剧烈持续疼痛)是急性心肌梗死最常见、最突出的最先出现症状。"},{"i":"2017_04_single_25","t":"single","s":"下列关于血清淀粉酶的描述，正确的是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"是排除急性胰腺炎常用的方法","B":"其升高程度标志急性胰腺炎严重程度","C":"多种疾病可引起其升高","D":"其在症状出现后1周内持续升高"},"a":"C","e":"血清淀粉酶升高程度不一定反映胰腺炎轻重，且腮腺炎、胆石症、消化性溃疡穿孔等多种疾病均可使其升高。"},{"i":"2017_04_fill_26","t":"fill","s":"为高热患者进行冰水浸浴物理降温时，每15分钟测肛温一次，体温降至______℃左右停止浸浴。","c":"物理与环境因素所致的急症患者的护理","sc":1,"at":"参考答案：38（℃）。","e":""},{"i":"2017_04_fill_27","t":"fill","s":"感染性疾病以______引起的感染性发热最常见。","c":"常见急性症状的评估","sc":1,"at":"参考答案：细菌感染。","e":""},{"i":"2017_04_fill_28","t":"fill","s":"心脏骤停的直接原因是______。","c":"心肺复苏","sc":1,"at":"参考答案：心室颤动(室颤)。","e":""},{"i":"2017_04_fill_29","t":"fill","s":"除颤适用于______和无脉性室性心动过速。","c":"心肺复苏","sc":1,"at":"参考答案：心室颤动(室颤)。","e":""},{"i":"2017_04_fill_30","t":"fill","s":"血清钠的增高或降低可引起血清______的急性升高或降低。","c":"危重症患者的护理","sc":1,"at":"参考答案：渗透压(血浆渗透压)。","e":""},{"i":"2017_04_fill_31","t":"fill","s":"按损伤是否破坏体表结构的完整性，将创伤分为______和闭合性两大类。","c":"损伤急症患者的护理","sc":1,"at":"参考答案：开放性。","e":""},{"i":"2017_04_fill_32","t":"fill","s":"大量气胸指肺萎陷大于______%，患者出现胸闷、气急等低氧血症表现。","c":"呼吸系统急症患者的护理","sc":1,"at":"参考答案：50(%)。","e":""},{"i":"2017_04_fill_33","t":"fill","s":"热射病临床上以高热、无汗和______为主要特征。","c":"物理与环境因素所致的急症患者的护理","sc":1,"at":"参考答案：意识障碍(昏迷)。","e":""},{"i":"2017_04_fill_34","t":"fill","s":"强酸烧伤的特点是组织______、蛋白沉淀、凝固，迅速结痂。","c":"损伤急症患者的护理","sc":1,"at":"参考答案：脱水。","e":""},{"i":"2017_04_fill_35","t":"fill","s":"毒蛇咬伤后，局部除可有牙痕外，其前端还可有1~4个粗牙痕，是______之处。","c":"损伤急症患者的护理","sc":1,"at":"参考答案：毒牙刺入(咬伤)。","e":""},{"i":"2017_04_fill_36","t":"fill","s":"淹溺急救与护理中，清除气道内的液体推荐采用______的方法。","c":"物理与环境因素所致的急症患者的护理","sc":1,"at":"参考答案：膝顶法倒水(头低俯卧位体位引流)。","e":""},{"i":"2017_04_fill_37","t":"fill","s":"有机磷杀虫药中毒患者在急性中毒症状缓解后3天突然出现呼吸肌麻痹等症状群，应考虑患者出现了______。","c":"急性中毒患者的护理","sc":1,"at":"参考答案：中间综合征(中间期肌无力综合征)。","e":""},{"i":"2017_04_fill_38","t":"fill","s":"抗凝血类杀鼠剂的特异性解毒药为______。","c":"急性中毒患者的护理","sc":1,"at":"参考答案：维生素K1。","e":""},{"i":"2017_04_fill_39","t":"fill","s":"能够间接评价右室功能的有创性监测指标是______。","c":"危重症患者的护理","sc":1,"at":"参考答案：中心静脉压(CVP)。","e":""},{"i":"2017_04_fill_40","t":"fill","s":"急性一氧化碳中毒的临床表现与______浓度、患者中毒前的健康状况及中毒时的体力活动有关。","c":"急性中毒患者的护理","sc":1,"at":"参考答案：血液中碳氧血红蛋白(COHb)。","e":""},{"i":"2017_04_term_41","t":"term","s":"水中毒","c":"危重症患者的护理","sc":3,"at":"参考答案（要点）：又称稀释性低钠血症，指机体摄入或输入水总量过多，致水在体内潴留，引起血浆渗透压下降和循环血量增多的病理状态，表现为细胞内水肿(尤其脑水肿)。","e":""},{"i":"2017_04_term_42","t":"term","s":"回归热","c":"常见急性症状的评估","sc":3,"at":"参考答案（要点）：指体温急骤升高至39℃以上，持续数日后又骤然下降至正常水平，高热与无热期各持续若干天规律性交替一次的热型，可见于回归热、霍奇金淋巴瘤等。","e":""},{"i":"2017_04_term_43","t":"term","s":"急性心力衰竭","c":"心血管系统急症患者的护理","sc":3,"at":"参考答案（要点）：指急性心脏病变引起心排血量急骤显著降低，导致组织器官灌注不足和急性淤血综合征，以急性左心衰(急性肺水肿)最常见，表现为突发严重呼吸困难、端坐呼吸、咳粉红色泡沫痰等。","e":""},{"i":"2017_04_term_44","t":"term","s":"急性肾衰竭","c":"危重症患者的护理","sc":3,"at":"参考答案（要点）：指由各种原因引起的肾功能在短时间(数小时至数天)内急骤减退，以肾小球滤过率明显下降、水电解质酸碱失衡及氮质血症为特征的临床综合征，表现为少尿或无尿、进行性氮质血症。","e":""},{"i":"2017_04_term_45","t":"term","s":"脓毒性休克","c":"危重症患者的护理","sc":3,"at":"参考答案（要点）：指由感染(革兰阴性菌为主)引起的、以脓毒症为基础的循环功能衰竭，表现为组织灌注不足，出现低血压、四肢湿冷、尿量减少等，属分布性休克。","e":""},{"i":"2017_04_short_46","t":"short","s":"简述呼吸困难患者病情危重的征象。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：①呼吸频率>30次/分或<8次/分、节律不规则；②辅助呼吸肌参与、出现三凹征或点头/提肩呼吸；③明显发绀、SpO2进行性下降；④意识改变(烦躁、嗜睡、昏迷)；⑤大汗淋漓、不能平卧、说话断续；⑥心率增快、血压下降。","e":""},{"i":"2017_04_short_47","t":"short","s":"简述危重患者转运过程中的监护措施。","c":"绪论","sc":5,"at":"参考答案（要点）：①转运前评估病情、备好监护抢救设备与药品，保证气道通畅并固定好各种管路；②连续监测心电、血压、呼吸、SpO2及意识、瞳孔；③保持静脉通路通畅，合理体位(休克体位、颈椎/颅脑损伤者轴线翻身)；④注意保暖、吸氧，观察输液速度与引流情况；⑤做好途中记录及与接收科室的交接。","e":""},{"i":"2017_04_short_48","t":"short","s":"简述多发伤急救VIPCO原则的主要内容。","c":"损伤急症患者的护理","sc":5,"at":"参考答案（要点）：V(Ventilation)保持呼吸道通畅、给氧；I(Infusion)快速建立静脉通路扩容输血输液；P(Pulsation)控制出血、监测循环；C(Control bleeding)紧急控制可见大出血；O(Operation)紧急行确定性手术(如胸腔/腹腔探查止血)。","e":""},{"i":"2017_04_short_49","t":"short","s":"简述常见药物中毒后毒物清除的注意事项。","c":"急性中毒患者的护理","sc":5,"at":"参考答案（要点）：①口服中毒者尽早催吐、洗胃(服毒6h内效果最佳，部分情况可延长)，洗胃液温度适宜、反复灌洗直至清亮；②吞服强腐蚀剂、食管静脉曲张者禁忌洗胃；③正确选用洗胃液与解毒沉淀剂，由胃管注入后反复抽吸；④导泻与灌肠促进已吸收毒物排出；⑤皮肤黏膜接触中毒者立即脱去污染衣物、用清水彻底冲洗；⑥吸入中毒者迅速撤离现场、吸氧。","e":""},{"i":"2017_04_essay_50","t":"essay","s":"试述休克患者中心静脉压和动脉压变化的意义。","c":"危重症患者的护理","sc":10,"at":"参考答案（要点）：中心静脉压(CVP，正常5~12cmH2O)反映右心前负荷与血容量，动脉压(BP)反映心排血与外周阻力，二者结合判断：①CVP低、BP低→血容量严重不足，应充分补液；②CVP低、BP正常→血容量相对不足，适当补液；③CVP高、BP低→心功能不全(或血容量相对过多)，应减慢/暂停补液、给强心药、纠酸扩血管；④CVP高、BP正常→容量血管过度收缩，宜扩血管；⑤CVP正常、BP低→心功能不全或血容量不足，可行补液试验鉴别。动态监测以指导补液量与速度。","e":""},{"i":"2017_04_case_51","t":"case","s":"患者，男性，55岁，2小时前睡眠时突感心前区剧烈疼痛，伴左侧上肢麻木感，自服硝酸甘油半小时疼痛仍不能缓解，并伴有恶心、呕吐、大汗淋漓及濒死感，急诊入院。心电图示：V1-5导联ST段弓背向上抬高。查体：神志清楚，痛苦面容，T37.9℃，P90次/分，R18次/分，BP 120/80mmHg，心、肺、腹部及各系统检查未见异常。急诊考虑为ST段抬高的急性心肌梗死，拟行急诊冠状动脉介入治疗。\n请写出：该患者目前急救护理的主要措施。","c":"心血管系统急症患者的护理","sc":15,"at":"参考答案（要点）：①立即绝对卧床休息、持续心电监护，吸氧，建立静脉通路；②镇痛：遵医嘱吗啡/哌替啶止痛，持续观察胸痛及心电图变化；③迅速完善准备：抽血查心肌损伤标志物、凝血、血型配血，备皮、碘过敏试验等PCI术前准备，争取再灌注时间窗；④遵医嘱嚼服阿司匹林+氯吡格雷抗血小板、抗凝，控制输液速度；⑤严密监测生命体征、意识、心电变化，警惕再灌注心律失常、心衰、心源性休克；⑥心理护理、解除濒死恐惧，做好抢救记录与交接。","e":""}]},{"key":"2018_04","name":"2018年4月","qs":[{"i":"2018_04_single_1","t":"single","s":"急救医疗服务体系包括","c":"绪论","sc":1,"o":{"A":"院前急救、急诊科急救、危重症监护","B":"现场急救、途中急救、安全转运","C":"评估、急救、诊治、处置与预防","D":"通讯指挥系统、监护和急救转运系统"},"a":"A","e":"急救医疗服务体系(EMSS)由院前急救、医院急诊科急救和危重症监护(ICU)三部分有机组成。"},{"i":"2018_04_single_2","t":"single","s":"急诊患者及家属的心理特点一般不包括","c":"急诊分诊","sc":1,"o":{"A":"恐惧感","B":"优越感","C":"陌生感","D":"无助感"},"a":"B","e":"急诊患者及家属常见焦虑、恐惧、陌生感、无助感等心理，优越感不是其心理特点。"},{"i":"2018_04_single_3","t":"single","s":"院前急救的首要和经常性任务是","c":"绪论","sc":1,"o":{"A":"日常院前急救","B":"紧急医疗救援","C":"特殊任务保障","D":"通讯网络枢纽"},"a":"A","e":"日常院外急救是院前急救机构最首要、最经常性的任务。"},{"i":"2018_04_single_4","t":"single","s":"患者，男性，53岁，主因“持续性腹痛伴阵发性加重4小时”就急诊。体格检查：T37.5℃，P104次/分，R20次/分，BP110/70mmHg，神清，痛苦面容，面色苍白，大汗，HR104次/分，余心肺(-)，腹部平坦，肠鸣音3次/分，上腹部压痛明显，不伴反跳痛，肝脾肋下未及，全腹未及包块。按照我国四级病情分级标准，该患者病情属于","c":"急诊分诊","sc":1,"o":{"A":"1级","B":"2级","C":"3级","D":"4级"},"a":"C","e":"患者生命体征尚平稳、意识清楚，仅有急性腹痛而无生命危险及腹膜刺激征，属3级(急症，可在30~60min内处置)。"},{"i":"2018_04_single_5","t":"single","s":"患者，女性，68岁，慢性阻塞性肺疾病(COPD)病史20年，2年来下肢浮肿。近1周来咳喘加重，并逐渐出现意识模糊、躁动不安，由家人送至急诊。按照我国四级病情分级标准，该患者病情属于","c":"急诊分诊","sc":1,"o":{"A":"1级","B":"2级","C":"3级","D":"4级"},"a":"B","e":"COPD患者咳喘加重并出现意识模糊、躁动，提示呼吸衰竭/肺性脑病、病情危重可能迅速恶化，应在10min内处置，属2级(危重)。"},{"i":"2018_04_single_6","t":"single","s":"正常人体在静息状态下腋窝温度不超过","c":"常见急性症状的评估","sc":1,"o":{"A":"37.6℃","B":"37.5℃","C":"37.2℃","D":"37.0℃"},"a":"C","e":"腋温正常范围约36~37℃，静息状态下不超过37.2℃。"},{"i":"2018_04_single_7","t":"single","s":"高质量心外按压的频率应为","c":"心肺复苏","sc":1,"o":{"A":"<100次","B":"80~100次","C":"100~120次","D":">100次"},"a":"C","e":"高质量胸外按压频率为100~120次/分。"},{"i":"2018_04_single_8","t":"single","s":"在心肺复苏过程中，为有效终止尖端扭转型室速，应选择的抗心律失常药为","c":"心肺复苏","sc":1,"o":{"A":"硫酸镁","B":"利多卡因","C":"碳酸氢钠","D":"阿托品"},"a":"A","e":"硫酸镁是治疗尖端扭转型室速的首选药物。"},{"i":"2018_04_single_9","t":"single","s":"某心搏骤停患者，在自主循环恢复后仍处于昏迷状态，医嘱给予亚低温治疗。该患者的核心体温应控制在","c":"心肺复苏","sc":1,"o":{"A":"30~32℃","B":"32~34℃","C":"34~36℃","D":"36~38℃"},"a":"B","e":"ROSC后昏迷患者行治疗性亚低温(低温)治疗，核心体温目标多为32~34℃。"},{"i":"2018_04_single_10","t":"single","s":"使用简易呼吸器进行人工通气时的正确操作是","c":"急救技术","sc":1,"o":{"A":"成人每次送气量为300~400ml","B":"成人每次送气量为500~600ml","C":"高级气道建立后，送气频率为12~15次/分","D":"未建立人工气道时，送气频率为15~20次/分"},"a":"B","e":"简易呼吸器成人每次送气潮气量约500~600ml，以见到胸廓起伏为宜。"},{"i":"2018_04_single_11","t":"single","s":"下列关于除颤电量的选择，正确的是","c":"心肺复苏","sc":1,"o":{"A":"单相波除颤仪选择200J","B":"双相波除颤仪选择200J","C":"单相波除颤仪选择300J","D":"双相波除颤仪选择360J"},"a":"B","e":"双相波除颤仪首次电击能量常选150~200J；单相波则统一用360J。"},{"i":"2018_04_single_12","t":"single","s":"下列关于骨折固定的原则，错误的是","c":"急救技术","sc":1,"o":{"A":"先止血包扎，再固定骨折部位","B":"夹板下加垫衬","C":"开放性骨折的断端应先回纳伤口内再固定","D":"夹板固定时长度必须超过上、下两个关节"},"a":"C","e":"开放性骨折外露的断端不可现场回纳伤口内，以免将污染带入深部组织；其余各项均为骨折固定原则。"},{"i":"2018_04_single_13","t":"single","s":"下列心力衰竭患者，最可能发生心源性猝死的是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"左室射血分数(LVEF)为65%","B":"左室射血分数(LVEF)为50%","C":"左室射血分数(LVEF)为45%","D":"左室射血分数(LVEF)为30%"},"a":"D","e":"LVEF越低(心功能越差)，发生恶性心律失常及心源性猝死的风险越高，30%最低。"},{"i":"2018_04_single_14","t":"single","s":"急性胰腺炎最早出现的症状是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"呕血","B":"黑便","C":"腹痛","D":"发热"},"a":"C","e":"腹痛是急性胰腺炎最早出现、最主要的症状，常在饱餐或饮酒后突发。"},{"i":"2018_04_single_15","t":"single","s":"休克指数是","c":"危重症患者的护理","sc":1,"o":{"A":"脉率/收缩压","B":"脉压差/收缩压","C":"脉率/舒张压","D":"脉压差/舒张压"},"a":"A","e":"休克指数=脉率/收缩压(mmHg)，正常约0.5，指数越大提示失血/休克越重。"},{"i":"2018_04_single_16","t":"single","s":"患者，男性，因食管胃底静脉曲张破裂大出血入院。实验室检查示肌酐76μmmol/L，血尿素氮18mmol/L，提示该患者的出血量至少为","c":"消化系统急症患者的护理","sc":1,"o":{"A":"400ml","B":"600ml","C":"800ml","D":"1000ml"},"a":"D","e":"上消化道大出血时血尿素氮升高而肌酐正常(肠源性氮质血症)，提示出血量至少达1000ml。"},{"i":"2018_04_single_17","t":"single","s":"可引起尿潴留的药物不包括","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"麻黄碱","B":"阿托品","C":"山莨菪碱","D":"卡巴胆碱"},"a":"D","e":"阿托品、山莨菪碱等抗胆碱药及麻黄碱可致尿潴留；卡巴胆碱为拟胆碱药，可促进膀胱收缩排尿，不引起尿潴留。"},{"i":"2018_04_single_18","t":"single","s":"膀胱结石的典型症状是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"排尿中断","B":"血尿","C":"肾绞痛","D":"点滴状排尿"},"a":"A","e":"排尿突然中断并感疼痛是膀胱结石的典型症状。"},{"i":"2018_04_single_19","t":"single","s":"抢救糖尿病酮症酸中毒首要的关键措施是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"胰岛素治疗","B":"补液","C":"补钾","D":"抗感染"},"a":"B","e":"补液是抢救DKA首要、关键的措施，可迅速恢复血容量、降低血糖、清除酮体。"},{"i":"2018_04_single_20","t":"single","s":"糖尿病酮症酸中毒治疗中最常见的电解质紊乱是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"低血钾","B":"低血钙","C":"低血镁","D":"低血钠"},"a":"A","e":"DKA治疗中随补液、胰岛素应用钾向细胞内转移及多尿排钾，最常见低血钾。"},{"i":"2018_04_single_21","t":"single","s":"机体维持血糖稳定的生理意义在于保障","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"肾脏的供能","B":"心脏的供能","C":"大脑的供能","D":"微循环的供能"},"a":"C","e":"脑组织几乎无糖原储备、主要依赖葡萄糖供能，故维持血糖稳定主要保障大脑供能。"},{"i":"2018_04_single_22","t":"single","s":"蛛网膜下腔出血最常见的病因是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"血液病","B":"颅内肿瘤","C":"脑血管畸形","D":"颅内动脉瘤破裂"},"a":"D","e":"颅内动脉瘤破裂是自发性蛛网膜下腔出血最常见的病因。"},{"i":"2018_04_single_23","t":"single","s":"诊断异位妊娠的金标准是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"妊娠试验","B":"B超检查","C":"阴道后穹窿穿刺","D":"腹腔镜检查"},"a":"D","e":"腹腔镜检查可直视病灶并同时手术，是诊断异位妊娠的金标准。"},{"i":"2018_04_single_24","t":"single","s":"对眼部化学伤患者的急救处理，正确的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"立即局部滴抗菌素滴眼液","B":"立即大量生理盐水反复冲洗伤眼","C":"立即无菌纱布遮盖伤眼","D":"应在伤后8小时后进行前房穿刺"},"a":"B","e":"眼部化学伤最关键的急救是立即就地用大量清水或生理盐水反复彻底冲洗伤眼。"},{"i":"2018_04_single_25","t":"single","s":"患者，女性，25岁，因“咽痛1天，憋气1小时”就诊。患者自诉2小时前咽痛加剧，1小时前感咽部阻塞感，无声嘶，轻度吸气性呼吸困难，进食正常。查体：脉搏85次/分。该患者目前喉阻塞程度为","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"I度","B":"II度","C":"III度","D":"IV度"},"a":"B","e":"安静时即有轻度吸气性呼吸困难、喉喘鸣及胸廓周围软组织轻度凹陷，进食正常、脉搏平稳，属II度喉阻塞。"},{"i":"2018_04_single_26","t":"single","s":"热射病典型的三联征表现为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"高热、大汗、意识障碍","B":"体温正常、大汗、意识障碍","C":"高热、无汗、意识障碍","D":"体温正常、无汗、意识障碍"},"a":"C","e":"热射病以高热(>40℃)、无汗和意识障碍为典型三联征。"},{"i":"2018_04_single_27","t":"single","s":"冻僵患者损害最严重的器官是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"肺脏","B":"心脏","C":"肾脏","D":"脑"},"a":"B","e":"严重冻僵(体温<28℃)最易发生心室颤动、心搏停止，心脏是冻僵中损害最严重、致死的主要器官。"},{"i":"2018_04_single_28","t":"single","s":"下列对高压电所致损伤的描述，不正确的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"创面常见于电流进出部位","B":"皮肤出口灼伤比入口严重","C":"灼伤可深达肌肉","D":"可引起空腔脏器穿孔"},"a":"B","e":"电损伤入口(进口)处组织损伤比出口更严重，故“出口比入口严重”错误。"},{"i":"2018_04_single_29","t":"single","s":"中度有机磷农药中毒时，血胆碱酯酶的活力一般为","c":"急性中毒患者的护理","sc":1,"o":{"A":"70%~90%","B":"50%~70%","C":"30%~50%","D":"<30%"},"a":"C","e":"轻度中毒胆碱酯酶活力50%~70%，中度30%~50%，重度<30%。"},{"i":"2018_04_single_30","t":"single","s":"用于解除急性酒精中毒引起的中枢抑制的药物是","c":"急性中毒患者的护理","sc":1,"o":{"A":"纳洛酮","B":"美他多辛","C":"阿托品","D":"氟马西尼"},"a":"A","e":"纳洛酮为阿片受体拮抗剂，可促醒、解除急性酒精中毒所致中枢抑制和呼吸抑制。"},{"i":"2018_04_multi_31","t":"multi","s":"院前急救负责","c":"绪论","sc":2,"o":{"A":"现场急救","B":"途中急救","C":"安全输送患者","D":"对患者的全面评估","E":"明确患者最终诊断"},"a":"ABC","e":"院前急救主要负责现场急救、途中监护急救和安全转运患者；全面评估与明确最终诊断属院内急诊科/专科职责。"},{"i":"2018_04_multi_32","t":"multi","s":"人体体温升高的机制包括","c":"常见急性症状的评估","sc":2,"o":{"A":"垂体功能紊乱","B":"体温调节中枢功能紊乱","C":"致热源的作用","D":"变应原的作用","E":"遗传因素的作用"},"a":"BC","e":"教材指出当体温调节中枢本身功能紊乱或受致热原作用、产热大于散热时体温升高；垂体功能紊乱、变应原、遗传非其基本机制。"},{"i":"2018_04_multi_33","t":"multi","s":"判断心脏停搏的主要诊断依据包括","c":"心肺复苏","sc":2,"o":{"A":"意识丧失","B":"叹气样呼吸","C":"大小便失禁","D":"双侧瞳孔散大","E":"大动脉搏动消失"},"a":"ABE","e":"心搏骤停主要依据为突然意识丧失、大动脉(颈动脉/股动脉)搏动消失、叹息样(无效)呼吸或呼吸停止；瞳孔散大、大小便失禁非主要诊断依据。"},{"i":"2018_04_multi_34","t":"multi","s":"气管插管术的适应证包括","c":"急救技术","sc":2,"o":{"A":"各种全麻手术","B":"预防或处理误吸和呼吸道梗阻","C":"癫痫发作或痉挛抽搐","D":"连接人工呼吸机","E":"心跳呼吸停止，需要高级生命支持"},"a":"ABDE","e":"气管插管适用于全麻手术、需预防或处理误吸/呼吸道梗阻、需接呼吸机机械通气、心搏骤停需高级生命支持者；单纯癫痫发作/抽搐不是其适应证。"},{"i":"2018_04_multi_35","t":"multi","s":"对机械性眼外伤患者的急救措施，正确的是","c":"眼科急症患者的护理","sc":2,"o":{"A":"无菌纱布遮盖双眼","B":"遵医嘱予抗菌素滴眼液","C":"眼内异物取出手术前剪眼睫毛","D":"眼内异物取出手术前进行结膜囊冲洗","E":"伤后24小时内是修复手术最好时机"},"a":"ABE","e":"机械性眼外伤应无菌纱布遮盖双眼、遵医嘱用抗生素眼药、争取伤后24h内修复；术前禁忌剪眼睫毛和结膜囊冲洗，故C、D错误。"},{"i":"2018_04_short_36","t":"short","s":"简述致命性呼吸困难的指征。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：①呼吸频率>30次/分或<8次/分、节律异常；②明显三凹征、辅助呼吸肌参与、点头/提肩样呼吸；③发绀明显、SpO2进行性下降；④烦躁不安、意识障碍、大汗淋漓、不能平卧；⑤伴心率增快、血压下降。出现上述征象提示随时可能发生呼吸心搏骤停。","e":""},{"i":"2018_04_short_37","t":"short","s":"简述院外心搏骤停生存链的组成。","c":"心肺复苏","sc":5,"at":"参考答案（要点）：①立即识别心搏骤停并启动急救系统；②尽早进行心肺复苏(着重胸外按压)；③快速除颤；④有效的高级心血管生命支持；⑤心搏骤停后的综合处理(复苏后监护与救治)。","e":""},{"i":"2018_04_short_38","t":"short","s":"简述机械通气患者人工气道的护理要点。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：①妥善固定气管插管/套管，记录外露长度，防止脱出、移位；②保持气道湿化和通畅，及时无菌吸痰；③气囊压力维持适宜(约25~30cmH2O)，间隙管理防止误吸；④口腔护理、预防VAP(抬高床头、声门下吸引)；⑤监测呼吸机参数及人机同步，观察病情变化。","e":""},{"i":"2018_04_short_39","t":"short","s":"简述轻度急性一氧化碳中毒的临床特点。","c":"急性中毒患者的护理","sc":5,"at":"参考答案（要点）：血液COHb约10%~20%。表现为头痛、头晕、心悸、恶心、呕吐、四肢无力、嗜睡、耳鸣、视物模糊等，口唇黏膜可呈樱桃红色，脱离中毒环境、吸入新鲜空气或吸氧后症状可较快缓解。","e":""},{"i":"2018_04_essay_40","t":"essay","s":"试述休克患者病情监测的指标和临床意义。","c":"危重症患者的护理","sc":10,"at":"参考答案（要点）：①意识与精神状态：反映脑组织灌注；②皮肤色泽、温度、湿度：反映体表灌注，苍白湿冷提示休克；③血压与脉压：收缩压<90mmHg、脉压<20mmHg提示休克，动态观察；④脉搏：率快、细弱，休克指数=脉率/收缩压判断失血程度；⑤呼吸：观察有无呼吸困难、呼衰；⑥尿量：反映肾灌注，是判断休克好转的重要指标(>30ml/h为好转)；⑦CVP：反映右心前负荷与血容量，指导补液；⑧必要时监测血气、血乳酸、电解质及凝血。综合判断休克程度、治疗反应及预后。","e":""},{"i":"2018_04_case_41","t":"case","s":"患者，男性，67岁，慢性阻塞性肺疾病病史5年。近日受凉后咳嗽加剧，30分钟前剧咳后突感右上胸刺痛，伴明显呼吸困难，不能平卧，遂至急诊。查体：T37.3℃，P100次/分，R28次/分，BP130/80mmHg，口唇发绀，右侧胸部膨隆，肋间隙增宽，叩诊呈鼓音，听诊右肺呼吸音明显减弱。\n请写出：（1）该患者可能发生的急症及判断依据；（2）为明确诊断必做的一项辅助检查；（3）该急症发生的可能原因；（4）目前可采取的急救护理措施。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)可能急症：右侧自发性气胸。依据：①COPD(肺大疱)基础+剧咳诱因；②突发右上胸刺痛伴明显呼吸困难、不能平卧；③患侧胸廓饱满膨隆、肋间隙增宽、叩诊鼓音、右肺呼吸音明显减弱。(2)必做检查：胸部X线(胸片)。(3)可能原因：COPD致胸膜下肺大疱在剧咳时破裂，空气进入胸膜腔。(4)急救护理：①取半卧位、吸氧；②配合医生行胸腔穿刺抽气或胸腔闭式引流排气；③严密监测呼吸、SpO2、生命体征及气管位置；④镇咳、避免用力咳嗽屏气；⑤做好病情观察及引流管护理。","e":""},{"i":"2018_04_case_42","t":"case","s":"患者，男性，40岁，1小时前因车祸腹部撞伤人急诊。患者车祸后当即感到腹部疼痛，腹痛逐渐加剧，怀疑有腹内脏器损伤。查体：BP80/60mmHg，P125次/分，神志清，面色苍白，急性病容，肢端皮肤湿冷，腹稍胀，腹肌中度紧张。腹腔穿刺抽得不凝固血液，X线腹透未见膈下游离气体。\n请写出：（1）目前该患者的诊断及诊断依据；（2）目前该患者的急救护理措施。","c":"损伤急症患者的护理","sc":15,"at":"参考答案（要点）：(1)诊断：腹部损伤(腹腔实质性脏器破裂)并失血性休克。依据：①腹部外伤史、腹痛进行性加重；②休克表现BP80/60mmHg、P125次/分、面色苍白、肢端湿冷；③腹腔抽出不凝固血液(实质性脏器出血)；④X线无膈下游离气体，排除胃肠道(空腔脏器)穿孔。(2)急救护理：①取休克体位、保暖、保持呼吸道通畅并吸氧；②迅速建立两条以上静脉通路快速扩容、交叉配血尽早输血；③禁食、胃肠减压，严密监测生命体征、意识、腹部体征及尿量；④尽快做好术前准备(备皮、皮试、备血)，紧急手术止血；⑤准确记录出入量及抢救记录。","e":""}]},{"key":"2018_10","name":"2018年10月","qs":[{"i":"2018_10_single_1","t":"single","s":"下列符合等渗性缺水临床表现的是","c":"危重症患者的护理","sc":1,"o":{"A":"尿少","B":"明显口渴","C":"尿比重降低","D":"血清钠＜135mmol/L"},"a":"A","e":"等渗性缺水水钠成比例丢失、血清钠正常，患者口渴不明显而表现为尿少、尿比重增高。"},{"i":"2018_10_single_2","t":"single","s":"予高钾血症患者静脉滴注葡萄糖溶液加胰岛素的主要目的是","c":"危重症患者的护理","sc":1,"o":{"A":"对抗心律失常","B":"促进K+向细胞内转移","C":"促进K+排出体外","D":"补充体液"},"a":"B","e":"葡萄糖加胰岛素可促使K+转入细胞内，从而降低血钾。"},{"i":"2018_10_single_3","t":"single","s":"患者，男性，60岁，测得其中心静脉压3cmH2O，血压90/60mmHg，尿少，提示该患者存在","c":"危重症患者的护理","sc":1,"o":{"A":"心功能不全","B":"血容量过多","C":"心力衰竭","D":"血容量不足"},"a":"D","e":"CVP低(3cmH2O)伴低血压、尿少提示血容量不足。"},{"i":"2018_10_single_4","t":"single","s":"适于癫痫发作患者的辅助通气方法是","c":"急救技术","sc":1,"o":{"A":"口咽通气道","B":"环甲膜穿刺","C":"气管插管","D":"喉罩"},"a":"A","e":"癫痫发作时为防止舌后坠阻塞气道、便于辅助通气，可放置口咽通气道。"},{"i":"2018_10_single_5","t":"single","s":"下列关于气管插管气囊管理的方法，正确的是","c":"急救技术","sc":1,"o":{"A":"气囊应常规放气","B":"气囊压力保持在20-25mmHg","C":"气囊气体不足时直接补足气体","D":"清除囊上分泌物时，边抽吸边放气囊"},"a":"D","e":"气囊不需常规放气；清除囊上分泌物时应边抽吸边放气囊以防误吸；重新注气前应先抽尽原有气体。"},{"i":"2018_10_single_6","t":"single","s":"使用止血带止血时，正确的做法是","c":"急救技术","sc":1,"o":{"A":"扎止血带时间小于2小时为宜","B":"止血带的压力上肢为350-400mmHg","C":"上臂大出血时，止血带应扎在上臂上1/3处","D":"在肢体上直接扎止血带"},"a":"C","e":"上臂止血带应扎在上臂上1/3处以免损伤桡神经；止血带下应加衬垫、压力上肢约300mmHg、尽量缩短缚扎时间。"},{"i":"2018_10_single_7","t":"single","s":"使用绷带为肘关节外伤患者包扎时，应使用","c":"急救技术","sc":1,"o":{"A":"环形包扎法","B":"“8”字包扎法","C":"回返包扎法","D":"螺旋包扎法"},"a":"B","e":"“8”字包扎法适用于肘、膝等屈曲关节部位。"},{"i":"2018_10_single_8","t":"single","s":"比较深大的出血伤口，应采用的止血方法是","c":"急救技术","sc":1,"o":{"A":"指压法","B":"加压包扎法","C":"止血带止血","D":"填塞止血法"},"a":"D","e":"深大、腔隙性出血伤口常用无菌敷料填塞后再加压包扎，即填塞止血法。"},{"i":"2018_10_single_9","t":"single","s":"某患者心率120次/分，血压80/50mmHg，该患者的休克指数是","c":"危重症患者的护理","sc":1,"o":{"A":"1","B":"1.5","C":"2","D":"2.5"},"a":"B","e":"休克指数=脉率/收缩压=120/80=1.5。"},{"i":"2018_10_single_10","t":"single","s":"下列实验室检查可作为肺血栓栓塞初筛指标的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"白细胞计数","B":"乳酸脱氢酶","C":"红细胞沉降率","D":"血浆D-二聚体"},"a":"D","e":"血浆D-二聚体测定对PTE有较大排除诊断价值，<500μg/L可基本排除急性PTE。"},{"i":"2018_10_single_11","t":"single","s":"诊断上消化道出血病因的首选方法是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"X线钡剂造影","B":"呕吐物潜血检查","C":"胃镜检查","D":"动脉造影"},"a":"C","e":"胃镜检查是目前诊断上消化道出血病因的首选方法，可直接观察并止血。"},{"i":"2018_10_single_12","t":"single","s":"休克指数＞1提示","c":"危重症患者的护理","sc":1,"o":{"A":"血容量正常","B":"失血400-800ml","C":"失血800-1200ml","D":"失血1200-2000ml"},"a":"D","e":"教材载休克指数>1提示失血1200~2000ml(占总血量30%~50%)。"},{"i":"2018_10_single_13","t":"single","s":"急性坏死性胰腺炎诊断的金标准是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"腹部B超","B":"腹部增强CT","C":"血淀粉酶","D":"腹部X片"},"a":"B","e":"腹部增强CT是诊断急性坏死性胰腺炎、判断胰腺坏死范围的金标准。"},{"i":"2018_10_single_14","t":"single","s":"患者，男性，因消化性溃疡出血入院。实验室检查示肌酐92μmmol/L，血尿素氮17.8mmol/L，提示该患者的出血量至少","c":"消化系统急症患者的护理","sc":1,"o":{"A":"400ml","B":"600ml","C":"800ml","D":"1000ml"},"a":"D","e":"上消化道大出血时血尿素氮升高而肌酐正常(肠源性氮质血症)，提示出血量至少达1000ml。"},{"i":"2018_10_single_15","t":"single","s":"急性胰腺炎患者血清脂肪酶开始升高的时间是病后","c":"消化系统急症患者的护理","sc":1,"o":{"A":"2-3小时","B":"6-12小时","C":"12-24小时","D":"24-72小时"},"a":"D","e":"血清脂肪酶于起病后24~72h开始升高，持续7~10天。"},{"i":"2018_10_single_16","t":"single","s":"糖尿病酮症酸中毒患者降糖治疗通常采用","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"胰岛素治疗","B":"口服降糖药物治疗","C":"口服降糖药联合胰岛素治疗","D":"胰高血糖素治疗"},"a":"A","e":"DKA通常采用小剂量短效胰岛素持续静脉滴注降糖。"},{"i":"2018_10_single_17","t":"single","s":"糖尿病酮症酸中毒患者呼气中有烂苹果味是由于其血液中","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖升高","B":"丙酮酸升高","C":"乙酰乙酸升高","D":"β-羟丁酸升高"},"a":"C","e":"DKA时酮体(乙酰乙酸、β-羟丁酸、丙酮)在血中堆积，其中挥发性丙酮经肺呼出产生烂苹果(丙酮)味，血酮体(乙酰乙酸等)升高是其病理基础。"},{"i":"2018_10_single_18","t":"single","s":"对于非糖尿病患者，低血糖的诊断标准是血糖低于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"1.1mmol/L","B":"2.0mmol/L","C":"2.8mmol/L","D":"3.9mmol/L"},"a":"C","e":"非糖尿病患者血糖<2.8mmol/L可诊断低血糖；接受药物治疗的糖尿病患者以≤3.9mmol/L为低血糖。"},{"i":"2018_10_single_19","t":"single","s":"甲亢危象治疗中应用β受体阻滞剂的目的是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"减少甲状腺素合成","B":"抑制甲状腺素的释放","C":"阻断高肾上腺素能活性","D":"改善机体反应性"},"a":"C","e":"甲亢危象时β受体阻滞剂用于阻断高肾上腺素能活性，减慢心率、控制震颤与躁动。"},{"i":"2018_10_single_20","t":"single","s":"癫痫的临床特点不包括","c":"神经系统急症患者的护理","sc":1,"o":{"A":"周期性","B":"发作性","C":"刻板性","D":"短暂性"},"a":"A","e":"癫痫具有发作性、短暂性、刻板性和反复发作性特点，周期性不是其临床特点。"},{"i":"2018_10_single_21","t":"single","s":"下列符合浅昏迷临床表现的是","c":"常见急性症状的评估","sc":1,"o":{"A":"可被唤醒","B":"对疼痛刺激有反应","C":"角膜反射消失","D":"对声光刺激有反应"},"a":"B","e":"浅昏迷时意识大部丧失，对疼痛刺激可有防御反应，角膜、瞳孔等反射仍存在。"},{"i":"2018_10_single_22","t":"single","s":"胸部损伤患者出现“反常呼吸”，提示患者可能有","c":"损伤急症患者的护理","sc":1,"o":{"A":"心包填塞","B":"开放性气胸","C":"张力性气胸","D":"多根多处肋骨骨折"},"a":"D","e":"多根多处肋骨骨折使胸壁失去肋骨支撑而软化，出现吸气时内陷、呼气时外凸的反常呼吸(连枷胸)。"},{"i":"2018_10_single_23","t":"single","s":"某患者被开水烫伤手臂，伤处可见大小不一的水疱，患者剧烈疼痛，该患者的烧伤深度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"一度","B":"浅二度","C":"深二度","D":"三度"},"a":"B","e":"浅二度烧伤伤及真皮浅层，形成水疱、创面红润、剧痛明显。"},{"i":"2018_10_single_24","t":"single","s":"毒蛇咬伤后，符合神经毒素致伤的表现是","c":"损伤急症患者的护理","sc":1,"o":{"A":"伤口红肿不明显","B":"伤口局部剧烈疼痛","C":"全身广泛性出血","D":"高热"},"a":"A","e":"神经毒(金环蛇、银环蛇等)局部症状轻、红肿不明显，而以肌肉麻痹、呼吸抑制为全身主要表现。"},{"i":"2018_10_single_25","t":"single","s":"异位妊娠最常见的部位是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"输卵管","B":"腹腔","C":"卵巢","D":"宫颈"},"a":"A","e":"异位妊娠以输卵管妊娠最常见(约占95%)。"},{"i":"2018_10_single_26","t":"single","s":"机械性眼外伤患者的急救措施，正确的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"对眼睑水肿者伤后立即热敷","B":"无菌纱布遮盖伤眼","C":"眼内异物取出手术前剪眼睫毛","D":"眼内异物取出手术前结膜囊冲洗"},"a":"B","e":"机械性眼外伤应无菌纱布遮盖(双眼)伤眼；术前禁忌剪眼睫毛和结膜囊冲洗。"},{"i":"2018_10_single_27","t":"single","s":"高浓度缩瞳剂2%毛果芸香碱的不良反应不包括","c":"眼科急症患者的护理","sc":1,"o":{"A":"心率减慢","B":"眉弓疼痛","C":"头痛眩晕","D":"视物发暗"},"a":"A","e":"2%毛果芸香碱可引起眉弓疼痛、视物发暗、近视加深及头痛、眩晕、脉搏加快等全身中毒症状，不引起心率减慢。"},{"i":"2018_10_single_28","t":"single","s":"提示意外低体温患者病情危重的指标是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"体温28-32℃","B":"心房颤动","C":"肌肉震颤","D":"昏迷"},"a":"D","e":"意外低体温患者出现昏迷、瞳孔对光反射消失提示病情危重、预后凶险。"},{"i":"2018_10_single_29","t":"single","s":"淡水溺水者一般不会出现","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"低钠","B":"高钠","C":"低蛋白血症","D":"溶血"},"a":"B","e":"淡水为低渗液，吸入后血液稀释，出现低钠、低蛋白血症及溶血；高钠血症见于海水淹溺，故淡水溺水一般不出现。"},{"i":"2018_10_single_30","t":"single","s":"属于苯二氮卓类受体特异性拮抗剂的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"阿托品","B":"纳洛酮","C":"氟马西尼","D":"美他多辛"},"a":"C","e":"氟马西尼是苯二氮卓类受体特异性拮抗剂。"},{"i":"2018_10_multi_31","t":"multi","s":"按休克的始动因素分类，导致分布性休克的常见原因有","c":"危重症患者的护理","sc":2,"o":{"A":"感染","B":"过敏","C":"神经损伤","D":"急性大量失血","E":"急性心肌梗死"},"a":"ABC","e":"分布性休克包括感染性(脓毒性)、过敏性、神经源性休克；急性大量失血属低血容量性，急性心梗属心源性。"},{"i":"2018_10_multi_32","t":"multi","s":"使用简易呼吸器进行人工通气时正确的做法是","c":"急救技术","sc":2,"o":{"A":"送气时间不小于1s","B":"成人每次送气量500-600ml","C":"未建立高级人工气道时送气频率为15-20次/分","D":"建立人工气道后送气频率为8-10次/分","E":"送气过程中观察胸廓的起伏"},"a":"ABDE","e":"简易呼吸器送气时间不小于1s、成人每次约500~600ml、送气时观察胸廓起伏；建立高级气道后约10次/分(8~10)。未建立高级气道时按压与通气按30:2配合，并非固定15~20次/分。"},{"i":"2018_10_multi_33","t":"multi","s":"胸外心脏非同步直流电除颤的适应证包括","c":"心肺复苏","sc":2,"o":{"A":"心室颤动","B":"心房颤动","C":"心室扑动","D":"无脉性室性心动过速","E":"多形性室性心动过速"},"a":"ACDE","e":"非同步除颤适用于QRS与T波无法分辨的室颤、室扑、无脉性室速及多形性室速；心房颤动应行同步电复律。"},{"i":"2018_10_multi_34","t":"multi","s":"小儿急性喉炎的临床表现可行","c":"耳鼻喉科急症患者的护理","sc":2,"o":{"A":"发热","B":"声嘶","C":"呼吸困难","D":"咳嗽","E":"发绀"},"a":"ABCDE","e":"小儿急性喉炎表现为发热、声嘶、犬吠样咳嗽、吸气性呼吸困难，严重者出现三凹征及发绀。"},{"i":"2018_10_multi_35","t":"multi","s":"下列有机磷农药中毒患者的症状中，属于烟碱样症状的是","c":"急性中毒患者的护理","sc":2,"o":{"A":"大汗","B":"瞳孔缩小","C":"面色苍白","D":"血压增高","E":"大小便失禁"},"a":"CD","e":"烟碱样(N样)症状为皮肤血管收缩、面色苍白、心率增快、血压增高及肌束颤动；大汗、瞳孔缩小、大小便失禁属毒蕈碱样(M样)症状。"},{"i":"2018_10_short_36","t":"short","s":"简述评估急危重症患者转运获益及风险的NEWS原则。","c":"绪论","sc":5,"at":"参考答案（要点）：NEWS(英国早期预警评分)主要依据：①呼吸频率；②血氧饱和度；③是否吸氧；④体温；⑤收缩压；⑥心率。按各项分值累加判断病情恶化及需紧急干预的风险，分值越高提示病情越重、转运风险越大，据此权衡转运获益与风险。","e":""},{"i":"2018_10_short_37","t":"short","s":"简述导致多器官功能障碍综合征的常见病因。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：①严重感染、脓毒症及感染性休克；②严重创伤、多发伤、大面积烧伤、大手术；③各型休克(尤其低血容量性、感染性)及心跳呼吸骤停复苏后；④严重感染、坏死性胰腺炎、急性重症胰腺炎；⑤大量输血、输液；⑥心肺复苏后、药物或毒物中毒等。","e":""},{"i":"2018_10_short_38","t":"short","s":"简述给予尿潴留患者诱导排尿的护理措施。","c":"泌尿系统急症患者的护理","sc":5,"at":"参考答案（要点）：①提供隐蔽环境、取适宜体位(坐位或卧位)；②听流水声、温水冲洗会阴部诱导排尿；③热敷或按摩下腹部(膀胱区)放松肌肉；④针刺穴位；⑤条件允许时让患者听流水声、温水坐浴；⑥上述无效时遵医嘱导尿。","e":""},{"i":"2018_10_short_39","t":"short","s":"简述对重症中暑患者进行体内降温的方法。","c":"物理与环境因素所致的急症患者的护理","sc":5,"at":"参考答案（要点）：①用4~10℃的5%葡萄糖盐水经股动脉向心性注入或静脉滴注灌肠；②4~10℃冰盐水进行胃或直肠灌洗；③有条件者行血液净化(体外循环)降温；④同时持续监测肛温，避免降温过低。","e":""},{"i":"2018_10_essay_40","t":"essay","s":"试述成人胸外按压的操作要点。","c":"心肺复苏","sc":10,"at":"参考答案（要点）：①患者仰卧于硬板床/地面，去枕；②部位为两乳头连线中点(胸骨中下1/3交界处)；③一手掌根部置于按压点，另一手平行叠放、手指翘起不贴胸壁；④肘关节伸直，借助上身重力垂直下压，使胸骨下陷5~6cm；⑤频率100~120次/分，按压与放松时间大致相等，保证胸廓充分回弹；⑥尽量减少按压中断，中断<10秒；⑦按压通气比30:2，避免过度通气；⑧观察面色、瞳孔及可触及的大动脉搏动判断效果。","e":""},{"i":"2018_10_case_41","t":"case","s":"患者，男性，18岁，因“发作性呼吸困难2小时”，被同学送至急诊。\n请写出：(1)该患者分诊评估中现病史的问诊要点；(2)该患者生命体征评估内容。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)现病史问诊要点：①呼吸困难发作的诱因(接触过敏原、运动、受凉、情绪)、起病缓急与持续时间；②呼吸困难特点(呼气性、伴哮鸣音)及加重/缓解因素；③既往类似发作史、过敏史、哮喘病史及用药(吸入激素/支气管扩张剂)情况；④伴随症状(咳嗽、咳痰、发绀、大汗)。(2)生命体征评估内容：①体温、脉搏、呼吸频率与节律；②血压；③意识状态；④血氧饱和度(SpO2)；⑤观察有无三凹征、发绀、说话受限等。","e":""},{"i":"2018_10_case_42","t":"case","s":"患者，男，58岁，主因“持续胸痛2小时”来诊。患者晨起无明显诱因突感胸骨后剧烈疼痛，伴有恶心、呕吐、大汗淋漓，自服硝酸甘油30分钟后疼痛仍不缓解，遂至急诊。近2年间断于劳累后出现心前区憋闷，每次持续约数分钟，休息后可缓解。查体：神清，痛苦面容，T37.7℃，P90次/分，R18次/分，BP120/80mmHg。心电图示：V1-V5导联ST段压低0.6mV。患者既往高血压病史10余年，目前无活动性出血。医嘱进一步完善检查，给予对症支持治疗，待确诊后酌情行急诊经皮冠状动脉介入治疗。\n请写出：(1)该患者最可能的诊断；(2)为明确诊断必做的一项辅助检查；(3)目前立即采取的急救护理措施。","c":"心血管系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能诊断：急性冠状动脉综合征(急性非ST段抬高型心肌梗死/NSTEMI)。依据：持续胸骨后剧痛2h不缓解、硝酸甘油无效、大汗恶心呕吐，有劳累后心绞痛史及高血压史，心电图V1-V5 ST段压低。(2)必做辅助检查：抽血查心肌损伤标志物(肌钙蛋白、CK-MB)。(3)急救护理：①绝对卧床、心电监护、吸氧、建立静脉通路；②遵医嘱镇痛、嚼服阿司匹林+P2Y12受体抑制剂抗血小板、抗凝；③严密监测胸痛、心电图变化及有无再灌注心律失常；④做好急诊PCI术前准备与心理护理；⑤记录出入量及病情。","e":""}]},{"key":"2019_04","name":"2019年4月","qs":[{"i":"2019_04_single_1","t":"single","s":"院前急救中理想的急救半径是","c":"绪论","sc":1,"o":{"A":"1～2公里","B":"3～5公里","C":"5～7公里","D":"8～10公里"},"a":"C","e":"院前急救理想的急救半径为5~7公里。"},{"i":"2019_04_single_2","t":"single","s":"按照我国《医院急诊科规范化流程》规定的急诊患者病情分类，1级(A类)患者是指","c":"急诊分诊","sc":1,"o":{"A":"非急症患者","B":"危重患者","C":"急症患者","D":"濒危患者"},"a":"D","e":"四级病情分级中1级(A类)为濒危患者，需立即抢救。"},{"i":"2019_04_single_3","t":"single","s":"心搏骤停患者最常见的病因是","c":"心肺复苏","sc":1,"o":{"A":"创伤","B":"淹溺","C":"冠心病","D":"药物过量"},"a":"C","e":"心搏骤停以心血管疾病(尤其冠心病)为最常见病因。"},{"i":"2019_04_single_4","t":"single","s":"下列急救措施中，不属于基础生命支持的是","c":"心肺复苏","sc":1,"o":{"A":"人工呼吸","B":"胸外按压","C":"电除颤","D":"建立人工气道"},"a":"D","e":"基础生命支持(BLS)包括胸外按压、开放气道、人工呼吸和早期除颤；建立人工气道(气管插管)属高级心血管生命支持(ACLS)。"},{"i":"2019_04_single_5","t":"single","s":"院内心搏骤停患者的生存主要取决于","c":"心肺复苏","sc":1,"o":{"A":"心搏骤停的监测与预防","B":"及时高质量心肺复苏","C":"快速除颤","D":"高级生命维持和骤停后护理"},"a":"A","e":"教材明确院内心搏骤停生存链第一环为心搏骤停的监测和预防，患者生存主要取决于此。"},{"i":"2019_04_single_6","t":"single","s":"高质量胸外按压的频率为","c":"心肺复苏","sc":1,"o":{"A":"＜90次/分","B":"90～100次/分","C":"100～120次/分","D":"＞120次/分"},"a":"C","e":"高质量胸外按压频率为100~120次/分。"},{"i":"2019_04_single_7","t":"single","s":"临床上最常见的水钠代谢紊乱类型是","c":"危重症患者的护理","sc":1,"o":{"A":"等渗性缺水","B":"低渗性缺水","C":"高渗性缺水","D":"水中毒"},"a":"A","e":"等渗性缺水是临床上最常见的水钠代谢紊乱类型。"},{"i":"2019_04_single_8","t":"single","s":"休克体位是","c":"危重症患者的护理","sc":1,"o":{"A":"平卧位","B":"下肢抬高20°～30°","C":"头、躯干抬高20°～30°，下肢抬高15°～20°","D":"头、躯干降低20°～30°，下肢抬高20°～30°"},"a":"C","e":"休克体位为头和躯干抬高20°~30°、下肢抬高15°~20°，以增加回心血量。"},{"i":"2019_04_single_9","t":"single","s":"下列动脉血气分析参数中，用来反映代谢性因素的指标是","c":"危重症患者的护理","sc":1,"o":{"A":"血液酸碱度(pH)","B":"标准碳酸氢盐(SB)","C":"动脉血氧分压(PaO₂)","D":"动脉血二氧化碳分压(PaCO₂)"},"a":"B","e":"标准碳酸氢盐(SB)不受呼吸因素影响，是反映代谢性酸碱平衡的指标；PaCO₂反映呼吸性因素。"},{"i":"2019_04_single_10","t":"single","s":"某哮喘急性发作患者，护士对其进行评估时发现患者不能讲话，哮鸣音消失，可见胸腹反常运动，脉率130次/分。该患者的病情严重度分级是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"危重"},"a":"D","e":"不能讲话、哮鸣音消失、胸腹矛盾运动提示气道严重阻塞，属哮喘危重(致命)发作。"},{"i":"2019_04_single_11","t":"single","s":"急性肺血栓栓塞症患者实施介入治疗后，绝对卧床时间应为","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"4h","B":"6h","C":"12h","D":"24h"},"a":"D","e":"教材载PTE介入治疗术后患者绝对卧床24h，穿刺侧髋关节禁止屈曲。"},{"i":"2019_04_single_12","t":"single","s":"护士为某气胸患者实施胸腔闭式引流的护理，水封瓶的位置约在患者胸腔以下至少","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"4cm","B":"20cm","C":"40cm","D":"60cm"},"a":"D","e":"胸腔闭式引流时水封瓶应低于胸腔(引流口)60cm以上，防止瓶内液体逆流。"},{"i":"2019_04_single_13","t":"single","s":"急性呼吸衰竭患者最早出现的临床表现是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"呼吸困难","B":"发绀","C":"精神-神经症状","D":"皮肤湿暖"},"a":"A","e":"呼吸困难是急性呼吸衰竭最早出现的症状。"},{"i":"2019_04_single_14","t":"single","s":"高血压急症时，血压会突然和明显升高超过","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"140/90mmHg","B":"160/100mmHg","C":"180/120mmHg","D":"220/130mmHg"},"a":"C","e":"高血压急症指血压突然和显著升高(一般超过180/120mmHg)伴进行性靶器官损害。"},{"i":"2019_04_single_15","t":"single","s":"膀胱结石患者排尿异常的典型症状是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"点滴状排尿","B":"排尿突然中断","C":"无尿","D":"活动后镜下血尿"},"a":"B","e":"膀胱结石典型症状为排尿突然中断并感疼痛，因结石嵌于尿道内口所致。"},{"i":"2019_04_single_17","t":"single","s":"确诊脑出血和蛛网膜下腔出血首选的检查是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"MRI","B":"头颅CT","C":"脑血管造影","D":"经颅多普勒超声检查"},"a":"B","e":"头颅CT是确诊脑出血和蛛网膜下腔出血首选、快捷的检查。"},{"i":"2019_04_single_18","t":"single","s":"缺血性脑卒中患者静脉溶栓的时间窗为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"6h","B":"12h","C":"24h","D":"48h"},"a":"A","e":"缺血性脑卒中静脉溶栓时间窗一般为发病6h内(rt-PA 4.5h内)。"},{"i":"2019_04_single_19","t":"single","s":"某癫痫患者，家属述其身体部位不自主抽动，发展顺序为手指-腕部-前臂-肘-肩-口角-面部，护士判断该患者的癫痫发作类型为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"失神发作","B":"失张力发作","C":"局灶性发作","D":"强直阵挛发作"},"a":"C","e":"抽动自手指向口角面部按Jackson顺序扩散为局灶性(部分性)发作。"},{"i":"2019_04_single_20","t":"single","s":"某患者，全身肌肉松弛，对外界各种刺激均无反应，深、浅反射均消失，该患者的意识状态为","c":"常见急性症状的评估","sc":1,"o":{"A":"嗜睡","B":"昏睡","C":"浅昏迷","D":"深昏迷"},"a":"D","e":"深昏迷时全身肌肉松弛、对各种刺激均无反应、深浅反射均消失。"},{"i":"2019_04_single_21","t":"single","s":"多发伤抢救过程中，最主要、最基本的措施是","c":"损伤急症患者的护理","sc":1,"o":{"A":"通气","B":"输液抗休克","C":"心脏泵血功能监测","D":"控制出血"},"a":"A","e":"多发伤急救首先(最基本)是保持呼吸道通畅、维持有效通气(V)。"},{"i":"2019_04_single_22","t":"single","s":"患者，女性，55岁，因“开水烫伤1小时”入院，查体可见四肢、胸腹部大小不等的水疱，创面潮红，疼痛剧烈。该患者的烧伤深度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"一度烧伤","B":"浅二度烧伤","C":"深二度烧伤","D":"三度烧伤"},"a":"B","e":"水疱明显、创面潮红、剧痛为浅二度烧伤。"},{"i":"2019_04_single_23","t":"single","s":"以下关于狂犬病的护理措施中，不正确的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"接触隔离，患者住单人房间","B":"严密观察病情变化","C":"保持病室安静，光线暗淡","D":"教育病人足量饮水，防止脱水"},"a":"D","e":"狂犬病患者恐水、吞咽困难、易激惹，应禁食禁水、减少刺激，不能鼓励足量饮水。"},{"i":"2019_04_single_24","t":"single","s":"异位妊娠中最常见的类型是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"输卵管妊娠","B":"卵巢妊娠","C":"腹腔妊娠","D":"阔韧带妊娠"},"a":"A","e":"输卵管妊娠占异位妊娠约95%，最常见。"},{"i":"2019_04_single_25","t":"single","s":"异常分娩中，急产是指总产程不超过","c":"妇产科急症患者的护理","sc":1,"o":{"A":"2h","B":"3h","C":"4h","D":"5h"},"a":"B","e":"急产指总产程不足3小时。"},{"i":"2019_04_single_26","t":"single","s":"以下关于机械性眼外伤患者的护理措施中正确的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"结膜异物的患者可在表面麻醉后用酒精棉签拭去异物","B":"异物取出手术前剪眼睫毛，做好术前准备","C":"异物取出手术前先行结膜囊冲洗，尽量冲去异物","D":"术后严格遵医嘱使用抗生素，防止眼内感染"},"a":"D","e":"机械性眼外伤术后应遵医嘱用抗生素防眼内感染；术前禁忌剪睫毛和结膜囊冲洗，异物宜用湿棉签而非酒精棉签拭取。"},{"i":"2019_04_single_27","t":"single","s":"某患者，因“右眼胀痛伴头痛4小时”来诊，诊断为急性闭角型青光眼。既往支气管哮喘病史2年，该患者应禁用的药物是","c":"眼科急症患者的护理","sc":1,"o":{"A":"缩瞳剂","B":"β肾上腺受体阻滞剂","C":"碳酸酐酶抑制剂","D":"高渗剂"},"a":"B","e":"β受体阻滞剂(如噻吗洛尔)可诱发或加重支气管哮喘，哮喘患者禁用。"},{"i":"2019_04_single_28","t":"single","s":"对于气管异物患者实施海姆立克急救法，以下说法中不正确的是","c":"心肺复苏","sc":1,"o":{"A":"该方法通过驱使肺内残余气体快速进入气管而排出异物","B":"咳嗽法适用于异物仅造成气道不完全阻塞患者","C":"神智清楚者只能采用自救法进行急救","D":"神智昏迷者只能采用他救法进行急救"},"a":"C","e":"神志清醒者既可自救也可由他人施行立位腹部冲击，并非“只能自救”。"},{"i":"2019_04_single_29","t":"single","s":"患者，女性，32岁，主因“口吐白沫、大小便失禁30分钟”来诊。查体：神清，双侧瞳孔呈针尖样大小，对光反射迟钝，口角可见呕吐物，伴浓烈大蒜味，大汗淋漓。该患者目前出现的症状为","c":"急性中毒患者的护理","sc":1,"o":{"A":"毒蕈碱(M)样症状","B":"烟碱(N)样症状","C":"中间综合征","D":"中枢神经系统症状"},"a":"A","e":"大蒜味、瞳孔针尖样、大汗、口吐白沫、大小便失禁为有机磷中毒的毒蕈碱(M)样症状。"},{"i":"2019_04_single_30","t":"single","s":"患者，女性，48岁，既往体健，同学聚会大量饮酒后出现胡言乱语、精神萎靡。护理评估中提示患者为重度酒精中毒的表现是","c":"急性中毒患者的护理","sc":1,"o":{"A":"嗜睡","B":"血压80/60mmHg","C":"共济失调","D":"吐词不清"},"a":"B","e":"重度酒精中毒(昏睡昏迷期)以昏睡/昏迷、皮肤湿冷、血压下降为特征；吐词不清属兴奋期、共济失调属共济失调期。血压80/60提示循环衰竭。"},{"i":"2019_04_multi_31","t":"multi","s":"心搏骤停典型的临床表现包括","c":"心肺复苏","sc":2,"o":{"A":"意识丧失","B":"大动脉搏动消失","C":"呼吸停止","D":"双侧瞳孔缩小","E":"角弓反张"},"a":"ABC","e":"心搏骤停典型表现为意识突然丧失、大动脉(颈动脉/股动脉)搏动消失、呼吸停止或叹息样；瞳孔多散大而非缩小。"},{"i":"2019_04_multi_32","t":"multi","s":"下列措施中，有助于预防下肢深静脉血栓形成的是","c":"呼吸系统急症患者的护理","sc":2,"o":{"A":"避免久坐","B":"卧床患者做床上主动运动","C":"穿加压弹力袜","D":"治疗高尿酸血症","E":"遵医嘱使用抗凝剂"},"a":"ABCE","e":"下肢DVT预防包括避免久坐久卧、早期床上主动活动、穿弹力袜及遵医嘱抗凝；治疗高尿酸血症与DVT预防无关。"},{"i":"2019_04_multi_33","t":"multi","s":"患者，男性，36岁，主因“持续性中上腹痛1天”就诊。1天前饱餐后出现上腹部正中隐痛，逐渐加重，呈持续性，向腰背部放射，伴低热、恶心、频繁呕吐，呕吐物为胃内容物，吐后腹痛无减轻。既往有胆石症病史2年。体格检查：T38.5℃，R19次/分，BP130/80mmHg，急性病容，被动体位，上腹部压痛明显，无反跳痛。急查血淀粉酶为1056U/L。该患者送检的其它检查指标中可能升高的包括","c":"消化系统急症患者的护理","sc":2,"o":{"A":"白细胞总数","B":"C反应蛋白","C":"血清脂肪酶","D":"尿淀粉酶","E":"血钙"},"a":"ABCD","e":"急性胰腺炎时白细胞总数、CRP、血清脂肪酶、尿淀粉酶均可升高；重症者血钙降低(非升高)。"},{"i":"2019_04_multi_34","t":"multi","s":"对于癫痫发作患者的护理，正确的是","c":"神经系统急症患者的护理","sc":2,"o":{"A":"不可离开患者，边呼叫边抢救","B":"采取仰头提颏法开放气道","C":"将缠有纱布的压舌板置于上下臼齿之间","D":"尽量用力按压抽搐肢体","E":"观察并记录眼球凝视方向"},"a":"ABCE","e":"癫痫发作应守在身边、开放气道、臼齿间放置缠纱布压舌板防舌咬伤，并观察记录眼球凝视方向以定侧；切忌用力按压抽搐肢体以免骨折。"},{"i":"2019_04_multi_35","t":"multi","s":"下列对眼部化学伤患者的急救护理措施中正确的是","c":"眼科急症患者的护理","sc":2,"o":{"A":"用大量生理盐水反复冲洗伤眼","B":"转动眼球，彻底冲洗化学物质","C":"块状化学物质紧贴眼部组织时，可用棉签擦出","D":"禁止滴入眼部表面麻醉剂，以免影响病情观察","E":"局部滴用胶原抑制剂，防止角膜溃疡"},"a":"ABCE","e":"眼部化学伤应立即用大量生理盐水反复冲洗、冲洗时转动眼球，块状物可用棉签拭出，并滴胶原抑制剂防角膜穿孔；表面麻醉剂并非禁用。"},{"i":"2019_04_short_36","t":"short","s":"简述休克的评判标准。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：①有失血、失液、感染、创伤等休克病因；②意识改变(烦躁、淡漠或昏迷)；③皮肤苍白、湿冷、发绀；④脉搏细速、脉压减小、收缩压<90mmHg或较基础值下降>40mmHg；⑤尿量<30ml/h；⑥休克指数(脉率/收缩压)>1。","e":""},{"i":"2019_04_short_37","t":"short","s":"简述恶性心律失常的预防与急救护理。","c":"心血管系统急症患者的护理","sc":5,"at":"参考答案（要点）：预防：①持续心电监护，及时识别室性早搏、Q-T延长等预警心律；②纠正诱因(低钾、低镁、缺氧、酸碱失衡)；③遵医嘱用抗心律失常药并观察疗效。急救：①立即平卧、吸氧、建立静脉通路；②备好除颤仪及抢救药品；③发生室颤/无脉室速立即非同步电除颤并CPR；④遵医嘱静脉推注利多卡因/胺碘酮；⑤严密监测心律、血压、意识并记录。","e":""},{"i":"2019_04_short_38","t":"short","s":"简述小儿急性喉炎的急救护理措施。","c":"耳鼻喉科急症患者的护理","sc":5,"at":"参考答案（要点）：①保持呼吸道通畅，取舒适体位，及时清除分泌物；②遵医嘱吸氧、雾化吸入糖皮质激素减轻喉头水肿；③密切观察呼吸频率、三凹征及发绀，备好气管切开包；④烦躁者适当镇静；⑤保证营养与水分供给；⑥出现严重喉梗阻时配合医生行气管切开。","e":""},{"i":"2019_04_short_39","t":"short","s":"简述冻僵患者体外复温的护理要点。","c":"物理与环境因素所致的急症患者的护理","sc":5,"at":"参考答案（要点）：①将患者迅速移至温暖环境，脱去湿冷衣物；②用毛毯、棉被包裹全身，可用热水袋、电热毯置于大血管处复温(注意防烫伤)；③复温速度适宜，避免过快复温导致心律失常和低血压；④持续监测肛温、心率、心律及血压；⑤室温宜维持在20~25℃；⑥复温过程中注意纠正酸中毒和电解质紊乱。","e":""},{"i":"2019_04_essay_40","t":"essay","s":"试述胸外心脏非同步直流电除颤的操作步骤。","c":"心肺复苏","sc":10,"at":"参考答案（要点）：①确认患者为室颤/无脉性室速，呼救并启动CPR；②暴露胸部，导电糊均匀涂抹于两电极板(或生理盐水纱布)；③选择非同步模式，按医嘱选择能量(成人双相波200J左右)；④电极板分别置于胸骨右缘第2~3肋间和心尖部(左腋中线第5肋间)，紧贴皮肤；⑤所有人离开病床，高喊“离床”，充电后同时按压两放电键放电；⑥放电后立即继续胸外按压，5个循环后评估心律；⑦整理用物、记录。","e":""},{"i":"2019_04_case_41","t":"case","s":"患者，男性，45岁，1小时前排便后晕倒，被同事送至急诊。患者今晨排黑便数次，总量约800ml，粪质稀薄，伴头晕、心慌，无呕血。查体：HR130次/分，BP85/60mmHg，神清，烦躁，皮肤潮湿。\n请结合以上病例写出：(1)按照我国《医院急诊科规范化流程》病情四级分类法，该患者病情分级及其依据；(2)护士对该患者的评估要点。","c":"消化系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)病情分级：2级(危重/B类)。依据：患者上消化道大出血(黑便约800ml)后BP85/60mmHg、HR130次/分、烦躁、皮肤湿冷，已出现失血性休克早期表现，存在生命危险，需在10分钟内处置。(2)评估要点：①意识状态及面色、皮肤温度湿度；②持续监测血压、心率、脉搏、呼吸及尿量；③呕血/黑便的量、颜色、性状与次数，判断出血是否继续；④记录出入量，急查血红蛋白、血型、凝血及电解质；⑤评估有无再出血及休克加重征象，备好补液、输血及内镜止血用物。","e":""},{"i":"2019_04_case_42","t":"case","s":"患者，女性，75岁，2型糖尿病病史30年，目前采用预混胰岛素注射治疗。近日因天气炎热食欲不佳进食减少。今晨在外出活动时突感心慌、手抖、全身无力，伴大汗，由路人送至急诊。查体：神志模糊，不能应答，HR102次/分，BP110/60mmHg。\n请结合以上病例写出：(1)该患者神志模糊最可能的原因以及首要的检查；(2)针对该患者的急救护理措施。","c":"内分泌系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能原因：低血糖昏迷(糖尿病患者进食减少而仍注射胰岛素，出现心慌手抖、大汗、神志模糊)。首要检查：立即测指尖血糖(即刻血糖)。(2)急救护理：①遵医嘱立即静脉推注50%葡萄糖注射液，继以10%葡萄糖静滴维持；②持续监测血糖及意识、瞳孔变化；③取平卧、保持呼吸道通畅、吸氧；④查找并去除诱因(进食减少与胰岛素剂量)，做好健康指导；⑤记录病情及出入量。","e":""}]},{"key":"2020_08","name":"2020年8月","qs":[{"i":"2020_08_single_1","t":"single","s":"关于院前急救的原则，描述错误的是","c":"绪论","sc":1,"o":{"A":"先排险后施救","B":"先急救后呼救","C":"先重伤后轻伤","D":"先施救后运送"},"a":"B","e":"院前急救原则为先排险后施救、先重伤后轻伤、先施救后运送、急救与呼救并重；并非“先急救后呼救”。"},{"i":"2020_08_single_2","t":"single","s":"分诊护士完成简单、系统的护理评估的最长时限是在患者到达后的","c":"急诊分诊","sc":1,"o":{"A":"1min","B":"2min","C":"3min","D":"5min"},"a":"D","e":"预检分诊应在患者到达急诊后2~5分钟内完成评估分级，最长不超过5分钟。"},{"i":"2020_08_single_3","t":"single","s":"分诊护士评估的下列患者中，需立即展开急救的是","c":"急诊分诊","sc":1,"o":{"A":"T37.5℃  R20次/分  P140次/分  BP80/54mmHg","B":"T36.5℃  R12次/分  P120次/分  BP100/64mmHg","C":"T39.5℃  R20次/分  P120次/分  BP130/84mmHg","D":"T38.5℃  R16次/分  P102次/分  BP180/84mmHg"},"a":"A","e":"A组BP80/54mmHg伴P140次/分提示休克、生命体征不稳定，属濒危需立即急救。"},{"i":"2020_08_single_4","t":"single","s":"食管疾病患者胸痛发作的常见诱因是","c":"常见急性症状的评估","sc":1,"o":{"A":"咳嗽","B":"吞咽","C":"深呼吸","D":"劳累"},"a":"B","e":"食管疾病(食管痉挛、反流性食管炎)胸痛常与吞咽相关，多在进食时发作。"},{"i":"2020_08_single_5","t":"single","s":"心搏骤停时可见的心电图是","c":"心肺复苏","sc":1,"o":{"A":"偶发搏动、长间歇","B":"规律窄QRS伴P波","C":"不规则波动(心室颤动)","D":"规律缓慢QRS波群"},"a":"C","e":"图示C为形态、频率、振幅完全不规则的波动，无法辨认QRS-T波群，即心室颤动，是心搏骤停最常见的心电图类型。"},{"i":"2020_08_single_6","t":"single","s":"心肺复苏时成人胸外按压的频率为","c":"心肺复苏","sc":1,"o":{"A":"60～80次/分","B":"80～100次/分","C":"100～120次/分","D":"＞120次/分"},"a":"C","e":"成人胸外按压频率为100~120次/分。"},{"i":"2020_08_single_7","t":"single","s":"高渗性缺水患者缺水量占体重的4%～6%时，其缺水程度为","c":"危重症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"极重度"},"a":"B","e":"高渗性缺水轻度缺水量占体重2%~4%、中度4%~6%、重度>6%。"},{"i":"2020_08_single_8","t":"single","s":"最常见的休克类型是","c":"危重症患者的护理","sc":1,"o":{"A":"低血容量性休克","B":"心源性休克","C":"梗阻性休克","D":"分布性休克"},"a":"A","e":"低血容量性休克(尤其创伤失血性)是临床上最常见的休克类型。"},{"i":"2020_08_single_9","t":"single","s":"成人女性气管插管的深度一般为","c":"急救技术","sc":1,"o":{"A":"18~20cm","B":"20~22cm","C":"22~24cm","D":"24~26cm"},"a":"B","e":"成人经口气管插管深度(门齿)女性约20~22cm、男性约22~24cm。"},{"i":"2020_08_single_10","t":"single","s":"某患者因外伤出血来急诊就诊，护士观察患者出血部位的血色鲜红，呈渗出性，目前已自行凝固止血。按出血部位可判断该患者是","c":"急救技术","sc":1,"o":{"A":"毛细血管出血","B":"静脉出血","C":"混合性出血","D":"动脉出血"},"a":"A","e":"毛细血管出血血色鲜红、呈渗出性、常可自行凝固。"},{"i":"2020_08_single_11","t":"single","s":"某哮喘患者急性发作，上楼时气短，说话连续成句，可平卧休息，不伴大汗。据此可判断该患者病情严重程度分级为","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"危重"},"a":"A","e":"上楼(活动)时气短、能连续说话、可平卧、无大汗为哮喘轻度发作。"},{"i":"2020_08_single_12","t":"single","s":"下列检查中，对不稳定心绞痛和非ST段抬高的心肌梗死具有鉴别意义的是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"心电图","B":"肌钙蛋白","C":"脑钠肽","D":"超声心动图"},"a":"B","e":"不稳定心绞痛与NSTEMI的鉴别关键在于心肌损伤标志物(肌钙蛋白)是否升高。"},{"i":"2020_08_single_13","t":"single","s":"高血压急症是指出现进行性靶器官功能不全及血压急性升高超过","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"140/100mmHg","B":"160/110mmHg","C":"180/120mmHg","D":"200/130mmHg"},"a":"C","e":"高血压急症指血压急性升高超过180/120mmHg并伴进行性靶器官功能损害。"},{"i":"2020_08_single_14","t":"single","s":"主动脉夹层患者疼痛部位与夹层起源部位密切相关，若患者肩胛部位疼痛，提示夹层病变累及","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"近端升主动脉","B":"主动脉弓","C":"降主动脉","D":"腹主动脉"},"a":"C","e":"降主动脉夹层常引起背部、肩胛间区疼痛；升主动脉/弓多引起前胸、颈颌部疼痛。"},{"i":"2020_08_single_15","t":"single","s":"患者出现呕血伴柏油样便提示其出血量约为","c":"消化系统急症患者的护理","sc":1,"o":{"A":"＜50ml","B":"50～100ml","C":"200～500ml","D":"＞500ml"},"a":"C","e":"呕血提示胃内积血约250~300ml，伴柏油样便提示出血量约200~500ml。"},{"i":"2020_08_single_16","t":"single","s":"患儿7岁，剧烈运动后突发一侧阴囊内睾丸持续性疼痛，伴阵发性加剧。该患儿最可能出现的问题是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"腹股沟直疝","B":"肾结石","C":"精索扭转","D":"尿路感染"},"a":"C","e":"儿童青少年剧烈运动后突发一侧阴囊内睾丸持续疼痛为精索扭转(睾丸扭转)。"},{"i":"2020_08_single_17","t":"single","s":"在排除机械性尿路梗阻的情况下，有助于尿潴留患者排尿的药物是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"麻黄碱","B":"卡巴胆碱","C":"山莨菪碱","D":"阿托品"},"a":"B","e":"卡巴胆碱为拟胆碱药，可增强膀胱逼尿肌收缩，有助于非梗阻性尿潴留排尿。"},{"i":"2020_08_single_18","t":"single","s":"尿酸结石患者应避免的食物是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"油菜","B":"牛奶","C":"鸡蛋","D":"猪肝"},"a":"D","e":"尿酸结石应低嘌呤饮食，避免动物内脏(猪肝等高嘌呤食物)。"},{"i":"2020_08_single_19","t":"single","s":"糖尿病酮症酸中毒抢救过程中首要的关键措施是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"胰岛素治疗","B":"禁食","C":"补液","D":"补钾"},"a":"C","e":"DKA首要关键措施是迅速补液恢复有效循环血量。"},{"i":"2020_08_single_20","t":"single","s":"高渗性非酮症糖尿病昏迷的重要特征和诊断依据是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖明显增高","B":"尿糖强阳性","C":"血钾降低","D":"血浆渗透压增高"},"a":"D","e":"高渗性非酮症昏迷以血浆渗透压显著增高(>330mmol/L)为重要特征和诊断依据。"},{"i":"2020_08_single_21","t":"single","s":"甲亢危象治疗中抑制甲状腺激素合成应首选","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"丙硫氧嘧啶","B":"复方碘溶液","C":"普萘洛尔","D":"利血平"},"a":"A","e":"抑制甲状腺激素合成首选丙硫氧嘧啶(PTU)；碘剂抑制激素释放。"},{"i":"2020_08_single_22","t":"single","s":"下列神经系统的临床表现提示为椎-基底动脉梗死的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"对侧偏瘫","B":"同向性偏盲","C":"失语","D":"共济失调"},"a":"D","e":"椎-基底动脉(后循环)供应脑干、小脑，梗死常表现眩晕、共济失调、交叉性瘫痪。"},{"i":"2020_08_single_23","t":"single","s":"下列关于癫痫的共性特征描述正确的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"持续性","B":"稳定性","C":"短暂性","D":"多样性"},"a":"C","e":"癫痫具有发作性、短暂性、刻板性和反复发作的共性特征。"},{"i":"2020_08_single_24","t":"single","s":"原则上犬咬伤患者狂犬疫苗接种的剂次是","c":"损伤急症患者的护理","sc":1,"o":{"A":"3次","B":"4次","C":"5次","D":"6次"},"a":"C","e":"狂犬疫苗暴露后预防现行采用5针法(第0、3、7、14、28天各1剂)。"},{"i":"2020_08_single_25","t":"single","s":"异位妊娠诊断的金标准是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"腹腔镜检查","B":"盆腔检查","C":"B超检查","D":"HCG测定"},"a":"A","e":"腹腔镜检查是异位妊娠诊断的金标准，并可同时手术。"},{"i":"2020_08_single_26","t":"single","s":"为眼部化学伤患者局部反复冲洗伤眼宜采用","c":"眼科急症患者的护理","sc":1,"o":{"A":"5%葡萄糖液","B":"0.2%碳酸氢钠溶液","C":"20%甘露醇","D":"0.9%氯化钠溶液"},"a":"D","e":"眼部化学伤应立即用大量生理盐水(0.9%氯化钠溶液)反复冲洗伤眼。"},{"i":"2020_08_single_27","t":"single","s":"鼻出血患者最直接的检查方法是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"鼻咽部检查","B":"鼻腔检查","C":"凝血功能检查","D":"通气功能检查"},"a":"B","e":"鼻出血最直接的检查是前鼻镜/鼻腔检查寻找出血点。"},{"i":"2020_08_single_28","t":"single","s":"患者，女性，40岁，于夏日正午户外活动时出现头晕、恶心、面色潮红、大汗，伴双侧小腿抽筋，被送至社区中心就诊。查体：神清，体温37℃，血压120/80mmHg，则判断其中暑类型为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"先兆中暑","B":"热痉挛","C":"热衰竭","D":"热射病"},"a":"B","e":"大汗后肌肉(尤其四肢、腓肠肌)对称性痉挛疼痛而体温基本正常为热痉挛。"},{"i":"2020_08_single_29","t":"single","s":"诊断急性坏死性胰腺炎的金标准是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"血清淀粉酶","B":"血清脂肪酶","C":"腹部B超","D":"腹部增强CT"},"a":"D","e":"腹部增强CT是诊断急性坏死性胰腺炎、判断胰腺坏死范围的金标准。"},{"i":"2020_08_single_30","t":"single","s":"百草枯中毒时损伤的最主要靶器官是","c":"急性中毒患者的护理","sc":1,"o":{"A":"心","B":"脑","C":"脾","D":"肺"},"a":"D","e":"百草枯主要蓄积于肺，引起进行性肺纤维化和呼吸衰竭，肺为最主要靶器官。"},{"i":"2020_08_multi_31","t":"multi","s":"下列关于心搏骤停的表现，正确的是","c":"心肺复苏","sc":2,"o":{"A":"意识丧失","B":"大动脉搏动消失","C":"叹气样呼吸","D":"双侧瞳孔缩小","E":"全身肌张力增高"},"a":"ABC","e":"心搏骤停表现为意识丧失、大动脉搏动消失、叹息样或停止呼吸；瞳孔多散大、肌张力降低。"},{"i":"2020_08_multi_32","t":"multi","s":"低血糖危象Whipple三联征包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"低血糖症状","B":"呼吸困难","C":"发作时血糖＜2.8mmol/L","D":"剧烈腹痛","E":"供糖后低血糖症状迅速缓解"},"a":"ACE","e":"Whipple三联征：①低血糖症状；②发作时血糖<2.8mmol/L；③供糖后症状迅速缓解。"},{"i":"2020_08_multi_33","t":"multi","s":"下列关于短暂性脑缺血发作(TIA)的描述，正确的是","c":"神经系统急症患者的护理","sc":2,"o":{"A":"病变呈一过性","B":"局灶性脑或视网膜功能障碍","C":"临床症状多在15分钟内恢复","D":"不遗留神经功能缺损的症状","E":"CT检查无责任病灶"},"a":"ABCDE","e":"TIA为一过性、局灶性脑/视网膜功能障碍，症状多在15分钟内(24h内)完全恢复、不遗留神经缺损，头颅CT无责任病灶。"},{"i":"2020_08_multi_34","t":"multi","s":"下列各种创伤的概念描述中，正确的是","c":"损伤急症患者的护理","sc":2,"o":{"A":"多发伤是指同一致伤因素引起的两个以上部位的损伤","B":"多处伤是同一致伤因素引起同一部位的多处损伤","C":"联合伤是同一致伤因素引起的两个相邻部位的连续性损伤","D":"复合伤是指同一致伤因素作用于人体所引起的多处损伤","E":"复杂伤是指多种致伤因素作用于人体所引起的损伤"},"a":"ABC","e":"教材载多发伤=同一致伤因素两个以上部位损伤，多处伤=同一部位多处损伤，联合伤=两个相邻部位连续性损伤；复合伤指两种以上不同性质致伤因素损伤，故D、E表述错误。"},{"i":"2020_08_multi_35","t":"multi","s":"下列可用于降低急性闭角型青光眼患者眼压的药物有","c":"眼科急症患者的护理","sc":2,"o":{"A":"2%毛果芸香碱","B":"20%甘露醇","C":"左氧氟沙星","D":"异山梨醇","E":"醋甲唑胺"},"a":"ABDE","e":"降眼压药包括缩瞳剂(2%毛果芸香碱)、高渗脱水剂(20%甘露醇、口服异山梨醇)及碳酸酐酶抑制剂(醋甲唑胺)；左氧氟沙星为抗生素，不降眼压。"},{"i":"2020_08_short_36","t":"short","s":"简述呼吸困难严重程度判定的Hugh-Jones分级法。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：Hugh-Jones分级按活动受限程度分为5级：①1级：与同年龄健康者同样活动时不感到气短；②2级：平地快走或爬坡时气短；③3级：平地步行因气短比同龄人慢，或按自己速度走需停步喘气；④4级：平地走百余米即因气短需停步；⑤5级：穿衣、说话等轻微活动即气短，不能外出。","e":""},{"i":"2020_08_short_37","t":"short","s":"简述休克患者血流动力学监测的内容及意义。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：内容：①血压、脉压、心率；②中心静脉压(CVP)；③肺毛细血管楔压(PCWP)；④心排血量(CO)和心脏指数(CI)；⑤体循环血管阻力；⑥尿量。意义：判断休克类型与严重程度、指导补液量与血管活性药物使用、评价治疗反应与预后。","e":""},{"i":"2020_08_short_38","t":"short","s":"简述狂犬病患者急救护理中的病情观察要点。","c":"损伤急症患者的护理","sc":5,"at":"参考答案（要点）：①密切观察生命体征、意识、瞳孔变化；②重点观察呼吸频率节律，有无呼吸肌痉挛、喉痉挛及窒息；③观察有无恐水、恐风、吞咽困难、躁动抽搐；④记录出入量；⑤观察伤口及有无并发症。","e":""},{"i":"2020_08_short_39","t":"short","s":"简述急产对母体的影响。","c":"妇产科急症患者的护理","sc":5,"at":"参考答案（要点）：①软产道(宫颈、阴道、会阴)易发生撕裂伤；②产后子宫收缩乏力致产后出血；③来不及消毒易发生产褥感染；④接产不及可致宫颈、会阴严重裂伤及新生儿产伤。","e":""},{"i":"2020_08_essay_40","t":"essay","s":"试述糖尿病酮症酸中毒治疗过程中并发症的预防与处理。","c":"内分泌系统急症患者的护理","sc":10,"at":"参考答案（要点）：①低血糖：胰岛素用量过大或未及时补糖所致，应遵医嘱匀速滴注、定时监测血糖，血糖下降速度不宜过快，一旦出现低血糖立即补糖。②低血钾/低钾血症：胰岛素及补液后血钾向细胞内转移，应在尿量>40ml/h后见尿补钾，监测血钾与心电图。③脑水肿：多见于血糖下降过快、补碱不当，应控制血糖下降速度，一旦出现神志改变及时脱水。④心力衰竭/肺水肿：补液过快过多，应监测CVP、肺部啰音，控制输液速度和量。⑤碱中毒：不宜过早过多补碱，仅在pH<7.1时少量补等渗碳酸氢钠。","e":""},{"i":"2020_08_case_41","t":"case","s":"患者，男性，47岁，于1小时前排便后晕倒，被家人送至急诊。患者晨起排稀薄黑便数次，总量约800ml，伴头晕、心慌，无呕血。查体：神清，烦躁，皮肤湿冷，HR130次/分，BP85/60mmHg。\n请写出：(1)该患者最可能的诊断及诊断依据；(2)目前为明确病因首要的检查；(3)目前主要的急救护理措施。","c":"消化系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)诊断：上消化道大出血并失血性休克。依据：黑便约800ml、排便后晕倒，BP85/60mmHg、HR130次/分、烦躁、皮肤湿冷，符合上消化道出血致低血容量性休克。(2)明确病因首要检查：急诊胃镜检查。(3)急救护理：①绝对卧床、平卧或休克体位、保持呼吸道通畅、吸氧；②迅速建立两条以上静脉通路，补液、备血输血，纠正休克；③暂禁食；④严密监测血压、心率、意识、尿量及呕血黑便情况；⑤做好胃镜止血及手术准备。","e":""},{"i":"2020_08_case_42","t":"case","s":"患者，男性，66岁，主因“发热、呼吸困难伴胸痛1天”入院。患者因慢性肾炎接受激素治疗，近日受凉后出现咳嗽、咳黄痰，体温38℃～38.5℃，自服抗生素，具体不详，2日后咳嗽加重，体温升至39℃，明显喘憋，呼吸费力，并出现右侧胸痛。查体：T39.4℃，P108次/分，R26次/分，BP118/60mmHg，意识模糊，口唇发绀。胸片示右下肺感染，动脉血气分析示PaO₂55mmHg，PaCO₂40mmHg。\n请写出：(1)该患者在肺炎的基础上最可能出现的并发症及其判断依据；(2)确诊该并发症最重要的辅助检查；(3)该患者的主要护理措施。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)并发症：急性呼吸衰竭(I型)。依据：右下肺炎基础上出现发绀、呼吸费力、意识模糊，动脉血气PaO₂55mmHg(<60mmHg)而PaCO₂40mmHg(正常)，符合I型(低氧性)呼吸衰竭。(2)确诊最重要辅助检查：动脉血气分析。(3)护理措施：①保持呼吸道通畅、协助排痰；②遵医嘱吸氧，必要时配合机械通气；③遵医嘱有效控制感染；④监测生命体征、意识、SpO₂及血气；⑤取半卧位、做好营养与基础护理。","e":""}]},{"key":"2020_10","name":"2020年10月","qs":[{"i":"2020_10_single_1","t":"single","s":"急救医疗服务体系不包括","c":"绪论","sc":1,"o":{"A":"通信指挥系统","B":"现场急救组织","C":"患者运输工具","D":"灾害救援体系"},"a":"D","e":"急救医疗服务体系(EMSS)由院前急救、医院急诊和重症监护及通信、运输、现场急救组织构成，不包括灾害救援体系。"},{"i":"2020_10_single_2","t":"single","s":"PQRST分诊法适用的症状是","c":"急诊分诊","sc":1,"o":{"A":"发热","B":"呼吸困难","C":"腹痛","D":"昏迷"},"a":"C","e":"PQRST分诊法常用于腹痛(及胸痛)的系统问诊评估。"},{"i":"2020_10_single_3","t":"single","s":"分诊护士工作中遇到如下主诉均为发热的患者，其中需立即展开急救的是","c":"急诊分诊","sc":1,"o":{"A":"R32次/分  BP120/74mmHg","B":"R20次/分  BP130/84mmHg","C":"R16次/分  BP160/85mmHg","D":"R12次/分  BP110/60mmHg"},"a":"A","e":"A组呼吸32次/分提示呼吸窘迫，属生命体征不稳定需立即急救。"},{"i":"2020_10_single_4","t":"single","s":"点头呼吸常见于","c":"常见急性症状的评估","sc":1,"o":{"A":"重症哮喘患者","B":"重症肺炎患者","C":"临终患者","D":"尿毒症患者"},"a":"C","e":"点头呼吸(头随呼吸上下点动)是呼吸中枢衰竭、濒死的表现，常见于临终患者。"},{"i":"2020_10_single_5","t":"single","s":"砖红色胶冻样痰多见于","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"大叶性肺炎","B":"克雷伯菌肺炎","C":"病毒性肺炎","D":"肺吸虫病"},"a":"B","e":"砖红色胶冻样痰为克雷伯杆菌肺炎的特征性痰液。"},{"i":"2020_10_single_6","t":"single","s":"晕厥患者意识丧失的特点不包括","c":"常见急性症状的评估","sc":1,"o":{"A":"快速起始","B":"持续时间短","C":"自发完全恢复","D":"不伴抽搐"},"a":"D","e":"晕厥特点为快速起始、持续短暂、可自发完全恢复；部分晕厥(惊厥性晕厥)可伴短暂抽搐，故“不伴抽搐”不是其特点。"},{"i":"2020_10_single_7","t":"single","s":"心搏骤停患者气道管理的“金标准”是","c":"急救技术","sc":1,"o":{"A":"口咽通气道","B":"喉罩","C":"气管插管","D":"环甲膜穿刺"},"a":"C","e":"气管插管是心搏骤停气道管理的金标准，可确保可靠气道并防误吸。"},{"i":"2020_10_single_8","t":"single","s":"休克患者最重要、最基本的监测指标是","c":"危重症患者的护理","sc":1,"o":{"A":"精神状态","B":"脉搏","C":"体温","D":"血压"},"a":"D","e":"血压是休克患者最重要、最基本的监测指标。"},{"i":"2020_10_single_9","t":"single","s":"长期上呼吸机的患者没有明显污染时，更换呼吸机管道的周期为","c":"急救技术","sc":1,"o":{"A":"4天","B":"7天","C":"10天","D":"14天"},"a":"B","e":"无明显污染时呼吸机管道一般每7天更换一次，污染时及时更换。"},{"i":"2020_10_single_10","t":"single","s":"使用简易呼吸器进行人工通气时的手法是","c":"急救技术","sc":1,"o":{"A":"“E-A”法","B":"“E-B”法","C":"“E-C”法","D":"“E-D”法"},"a":"C","e":"简易呼吸器面罩通气采用EC手法(一手E形扣紧面罩、C形托起下颌)。"},{"i":"2020_10_single_11","t":"single","s":"急性自发性气胸患者的护理措施中错误的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"卧床休息","B":"鼓励用力咳嗽","C":"雾化吸入","D":"遵医嘱给予吸氧"},"a":"B","e":"急性自发性气胸应避免用力咳嗽、屏气，以免加重气胸。"},{"i":"2020_10_single_12","t":"single","s":"高血压急症患者若双上肢血压相差大于20mmHg，应警惕","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"主动脉夹层","B":"高血压脑病","C":"急性心力衰竭","D":"有效循环血量不足"},"a":"A","e":"双上肢血压差>20mmHg提示主动脉夹层累及分支。"},{"i":"2020_10_single_13","t":"single","s":"休克指数是指","c":"危重症患者的护理","sc":1,"o":{"A":"脉率/收缩压","B":"脉压/收缩压","C":"脉率/舒张压","D":"脉压/舒张压"},"a":"A","e":"休克指数=脉率/收缩压(mmHg)。"},{"i":"2020_10_single_14","t":"single","s":"消化道出血患者出现黑便，提示其出血量至少为","c":"消化系统急症患者的护理","sc":1,"o":{"A":"＜50ml","B":"50～100ml","C":"200～500ml","D":"＞500ml"},"a":"B","e":"出现黑便提示上消化道出血量至少达50~100ml。"},{"i":"2020_10_single_15","t":"single","s":"下列属于下尿路结石的是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"输尿管结石","B":"膀胱结石","C":"肾盂结石","D":"肾盏结石"},"a":"B","e":"下尿路包括膀胱和尿道，故膀胱结石属下尿路结石。"},{"i":"2020_10_single_16","t":"single","s":"下列属于诱发尿路结石形成的局部因素是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"尿中盐类呈超饱和状态","B":"抑制晶体形成物不足","C":"尿液pH改变","D":"尿路感染"},"a":"D","e":"尿路感染、尿路梗阻、异物属结石形成的局部因素；尿石盐超饱和、pH改变、抑制物不足属代谢/尿液因素。"},{"i":"2020_10_single_17","t":"single","s":"下列属于机械性梗阻的尿潴留是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"尿道狭窄引起的尿潴留","B":"使用麻黄碱引起的尿潴留","C":"低钾血症引起的尿潴留","D":"昏迷患者出现的尿潴留"},"a":"A","e":"尿道狭窄为尿路机械性梗阻；药物、低钾、昏迷属动力性(非梗阻性)尿潴留。"},{"i":"2020_10_single_18","t":"single","s":"下列关于尿潴留患者诱导排尿的护理措施中不正确的是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"安慰患者，消除紧张情绪","B":"提供隐蔽的排尿环境","C":"用力按压膀胱区协助排尿","D":"温水会阴冲洗"},"a":"C","e":"禁忌用力按压膀胱区，以免造成膀胱破裂；可通过心理护理、隐蔽环境、听流水声、温水冲洗会阴等诱导排尿。"},{"i":"2020_10_single_19","t":"single","s":"糖尿病酮症酸中毒患者降糖治疗的方式首选","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"间歇胰岛素肌肉注射","B":"定时胰岛素静脉注射","C":"间断胰岛素皮下注射","D":"小剂量胰岛素持续静脉输注"},"a":"D","e":"DKA首选小剂量(短效)胰岛素持续静脉输注。"},{"i":"2020_10_single_20","t":"single","s":"意识清楚的低血糖患者口服补糖的量宜控制在","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"1~2g","B":"5~10g","C":"15~20g","D":"25~30g"},"a":"C","e":"清醒低血糖患者口服快速吸收糖类约15~20g，15分钟后复测血糖。"},{"i":"2020_10_single_21","t":"single","s":"脑血栓形成最常见的病因是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"脑动脉粥样硬化","B":"先天性脑动脉狭窄","C":"脑动脉炎","D":"血液病"},"a":"A","e":"脑血栓形成最常见病因为脑动脉粥样硬化。"},{"i":"2020_10_single_22","t":"single","s":"缺血性卒中患者发病前的状态多为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"情绪激动","B":"安静休息","C":"用力排便","D":"剧烈活动"},"a":"B","e":"脑血栓形成多在安静或睡眠状态下起病。"},{"i":"2020_10_single_23","t":"single","s":"某患者癫痫发作时身体不自主抽动，发展顺序为手指-腕部-前臂-肘-肩-口角-面部，该患者的癫痫发作类型为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"局灶性发作","B":"失张力发作","C":"失神发作","D":"强直阵挛发作"},"a":"A","e":"抽动按Jackson顺序自手指向口角面部扩散为局灶性发作。"},{"i":"2020_10_single_24","t":"single","s":"发生吸入性损伤的烧伤患者主要的死亡原因是","c":"损伤急症患者的护理","sc":1,"o":{"A":"疼痛","B":"中毒","C":"窒息","D":"失血性休克"},"a":"C","e":"吸入性损伤常因气道阻塞、肺水肿和感染导致窒息(呼吸衰竭)而死亡。"},{"i":"2020_10_single_25","t":"single","s":"多发伤患者抢救中最主要、最基本的措施是","c":"损伤急症患者的护理","sc":1,"o":{"A":"保持呼吸道通畅","B":"输液抗休克","C":"控制出血","D":"手术治疗"},"a":"A","e":"多发伤抢救首先是保持呼吸道通畅、维持有效通气。"},{"i":"2020_10_single_26","t":"single","s":"急产患者病情危重的指标不包括","c":"妇产科急症患者的护理","sc":1,"o":{"A":"新生儿颅内出血","B":"软产道撕裂","C":"子宫肌纤维缩复不良致产后出血","D":"子宫收缩导致的下腹疼痛"},"a":"D","e":"子宫收缩引起的下腹疼痛为正常产程表现；新生儿颅内出血、软产道撕裂、产后出血才是急产危重指标。"},{"i":"2020_10_single_27","t":"single","s":"急性闭角型青光眼患者暗室试验阳性的标准是在暗光下测得的眼压比试验前升高大于","c":"眼科急症患者的护理","sc":1,"o":{"A":"2mmHg","B":"4mmHg","C":"6mmHg","D":"8mmHg"},"a":"D","e":"暗室试验后眼压较试验前升高≥8mmHg为阳性。"},{"i":"2020_10_single_28","t":"single","s":"喉烫伤的患者损伤部位在气管隆嵴水平以上，除声嘶、喉痛外，还有刺激性咳嗽。该患者的病情程度为","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"轻型","B":"中型","C":"重型","D":"危重型"},"a":"A","e":"损伤局限于隆嵴以上、仅表现声嘶、喉痛、刺激性咳嗽为轻型喉烫伤。"},{"i":"2020_10_single_29","t":"single","s":"某失联“驴友”于第2日黎明获救后表现为寒战、多尿。查体：精神尚可，T33℃，P96次/分，R22次/分，BP130/90mmHg。据此可判断其为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"先兆冻僵","B":"轻度冻僵","C":"中度冻僵","D":"严重冻僵"},"a":"B","e":"体温约33℃、寒战、精神尚可为轻度冻僵(直肠温32~35℃)。"},{"i":"2020_10_single_30","t":"single","s":"某有机磷中毒患者血胆碱酯酶活力为68%时，其中毒程度为","c":"急性中毒患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"危重"},"a":"A","e":"血胆碱酯酶活力70%~50%为轻度中毒，50%~30%中度，<30%重度；68%属轻度。"},{"i":"2020_10_multi_31","t":"multi","s":"胸痛伴有呼吸困难常见于","c":"常见急性症状的评估","sc":2,"o":{"A":"带状疱疹","B":"气胸","C":"肺栓塞","D":"胸膜炎","E":"肺炎"},"a":"BCDE","e":"气胸、肺栓塞、胸膜炎、肺炎均可胸痛伴呼吸困难；带状疱疹主要为沿神经走行的疼痛，一般不伴呼吸困难。"},{"i":"2020_10_multi_32","t":"multi","s":"发热伴寒战常见于","c":"常见急性症状的评估","sc":2,"o":{"A":"大叶性肺炎","B":"急性胰腺炎","C":"急性胆囊炎","D":"恶性疟疾","E":"急性心肌梗死"},"a":"ACD","e":"大叶性肺炎、急性胆囊炎、恶性疟疾(间歇热)常伴寒战；急性胰腺炎、急性心肌梗死一般不伴寒战。"},{"i":"2020_10_multi_33","t":"multi","s":"急性肺血栓栓塞症三联征是指","c":"呼吸系统急症患者的护理","sc":2,"o":{"A":"咯血","B":"晕厥","C":"胸痛","D":"咳嗽","E":"不明原因的呼吸困难"},"a":"ACE","e":"PTE典型三联征为不明原因的呼吸困难、胸痛和咯血。"},{"i":"2020_10_multi_34","t":"multi","s":"下列有关心房颤动的心电图特点描述，正确的是","c":"心血管系统急症患者的护理","sc":2,"o":{"A":"P波消失","B":"出现间隔均匀、形状相似的F波","C":"QRS波群间隔绝对不规则","D":"QRS波形态正常","E":"早搏后多出现一个完全代偿间歇"},"a":"ACD","e":"房颤心电图为P波消失、代之以f波，R-R绝对不齐，QRS形态多正常；间隔均匀相似的F波是房扑而非房颤。"},{"i":"2020_10_multi_35","t":"multi","s":"颈内动脉系统脑梗死的典型表现包括","c":"神经系统急症患者的护理","sc":2,"o":{"A":"眩晕","B":"眼颤","C":"失语","D":"共济失调","E":"偏身感觉障碍"},"a":"CE","e":"颈内动脉(前循环)梗死典型表现为偏瘫、偏身感觉障碍及优势半球失语；眩晕、眼颤、共济失调属椎-基底动脉(后循环)表现。"},{"i":"2020_10_short_36","t":"short","s":"简述突发呼吸困难的症状特点及常见疾病。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：症状特点：起病突然、呼吸费力、可伴发绀，重者出现三凹征、端坐呼吸。常见疾病：①呼吸系统：自发性气胸、哮喘急性发作、气道异物、肺栓塞；②心血管系统：急性左心衰、急性心肌梗死；③其他：癔症、重度贫血。","e":""},{"i":"2020_10_short_38","t":"short","s":"简述急性尿潴留患者的急救护理措施。","c":"泌尿系统急症患者的护理","sc":5,"at":"参考答案（要点）：①稳定情绪、提供隐蔽环境取适宜体位；②听流水声、温水冲洗会阴、热敷按摩下腹部诱导排尿；③排除机械梗阻后遵医嘱用拟胆碱药；④上述无效时遵医嘱导尿，必要时留置导尿或膀胱穿刺造瘘；⑤记录尿量并处理原发病。","e":""},{"i":"2020_10_short_39","t":"short","s":"列出至少五个癫痫持续状态的诱因。","c":"神经系统急症患者的护理","sc":5,"at":"参考答案（要点）：常见诱因：①不恰当停用或减量抗癫痫药；②感染、发热；③精神紧张、过度疲劳；④饮酒、熬夜；⑤孕产；⑥水/电解质紊乱、突然停药。","e":""},{"i":"2020_10_essay_40","t":"essay","s":"试述休克患者补充血容量的急救护理措施。","c":"危重症患者的护理","sc":10,"at":"参考答案（要点）：①迅速建立两条以上大口径静脉通路，必要时中心静脉置管；②首选晶体液(平衡盐液、生理盐水)快速输注，必要时胶体液、全血或红细胞；③遵循“先快后慢、先晶后胶、见尿补钾”原则，根据血压、CVP、尿量调整输液速度和量；④输液过程中严密监测血压、心率、CVP、尿量、末梢循环，防止输液过快致肺水肿；⑤准确记录出入量；⑥观察有无输血输液反应。","e":""},{"i":"2020_10_case_41","t":"case","s":"患者，男性，66岁，因大量痰液反复出现呼吸道阻塞紧急行气管插管术。护士应如何对该患者进行气管插管护理？","c":"急救技术","sc":15,"at":"参考答案（要点）：①妥善固定导管，记录插管深度(门齿刻度)，防止脱出移位；②保持气道通畅，及时吸痰，严格无菌操作；③气囊压力维持在25~30cmH₂O，定时监测，清除囊上分泌物时边抽吸边放气囊；④加强口腔护理，定时湿化气道；⑤监测生命体征、SpO₂及通气效果，观察有无皮下气肿、脱管；⑥做好心理护理与拔管准备。","e":""},{"i":"2020_10_case_42","t":"case","s":"患者，女性，27岁，公司职员，诊为1型糖尿病10年，目前采用胰岛素泵注射治疗。近几日加班生活不规律。今日未进早餐，工作中突感心慌、手抖、全身无力，伴大汗，由同事送至急诊。查体：神志模糊，HR120次/分，BP90/61mmHg。\n请结合病例写出：(1)该患者神志模糊最可能的原因及判断依据；(2)进行病情评估必做的一项检查；(3)该患者的治疗原则及急救护理措施。","c":"内分泌系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能原因：低血糖昏迷。依据：1型糖尿病用胰岛素泵治疗、未进早餐，出现心慌、手抖、大汗、神志模糊，符合低血糖表现。(2)必做检查：即刻测指尖血糖。(3)治疗原则及护理：立即暂停胰岛素泵，遵医嘱静脉推注50%葡萄糖注射液，继以10%葡萄糖静滴维持；持续监测血糖及意识变化；平卧、保持气道通畅；查找并去除诱因，做好健康指导。","e":""}]},{"key":"2021_04","name":"2021年4月","qs":[{"i":"2021_04_single_1","t":"single","s":"急救过程的基础环节是","c":"绪论","sc":1,"o":{"A":"院前急救","B":"急诊科急救","C":"危重症监护","D":"患者转运"},"a":"A","e":"院前急救是急救过程中的基础环节，负责现场急救、途中急救、安全输送患者。"},{"i":"2021_04_single_2","t":"single","s":"院前急救理想的急救半径是","c":"绪论","sc":1,"o":{"A":"1～2km","B":"5～7km","C":"10～15km","D":"15～20km"},"a":"B","e":"教材指出现场急救理想的急救半径是5～7km。"},{"i":"2021_04_single_3","t":"single","s":"急诊分诊台宜设置于","c":"急诊分诊","sc":1,"o":{"A":"患者最集中的位置","B":"出入最方便的位置","C":"急诊科入口最明显的位置","D":"距抢救室最近的位置"},"a":"C","e":"分诊台应设在急诊区域明显的位置，一般在急诊科入口处并有明显标识，患者进入即可看到。"},{"i":"2021_04_single_4","t":"single","s":"“PQRST”腹痛分诊法中P是指疼痛的","c":"常见急性症状的评估","sc":1,"o":{"A":"性质","B":"部位","C":"诱因","D":"程度"},"a":"C","e":"P(provokes)指疼痛的诱发因素，Q为性质，R为放射，S为程度，T为时间。"},{"i":"2021_04_single_5","t":"single","s":"深大呼吸可见于","c":"常见急性症状的评估","sc":1,"o":{"A":"慢性支气管炎","B":"支气管哮喘","C":"上呼吸道异物","D":"尿毒症"},"a":"D","e":"深大呼吸(Kussmaul呼吸)见于严重代谢性酸中毒、尿毒症、糖尿病酮症酸中毒等。"},{"i":"2021_04_single_6","t":"single","s":"患者，男性，34岁，2小时前无明显诱因出现上中腹部疼痛，后转移至右下腹，呈持续性疼痛并逐渐加重，伴恶心、呕吐。查体右下腹麦氏点压痛明显。该患者腹痛可能的病因是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"慢性胃炎","B":"急性胆囊炎","C":"急性阑尾炎","D":"急性胰腺炎"},"a":"C","e":"转移性右下腹痛、麦氏点压痛是急性阑尾炎的典型表现。"},{"i":"2021_04_single_7","t":"single","s":"膝关节外伤时适合的包扎方法是","c":"急救技术","sc":1,"o":{"A":"“8”字包扎法","B":"环形包扎法","C":"螺旋包扎法","D":"回返包扎法"},"a":"A","e":"“8”字包扎法适用于包扎屈曲的关节，如肘、膝等关节部位。"},{"i":"2021_04_single_8","t":"single","s":"心搏骤停后，若要使患者存活率提高到50%，则心肺复苏开始的时间应为","c":"心肺复苏","sc":1,"o":{"A":"小于4分钟","B":"4～6分钟","C":"大于6分钟","D":"大于10分钟"},"a":"A","e":"教材指出4min内进行复苏者约有一半人可被救活，即存活率约50%。"},{"i":"2021_04_single_9","t":"single","s":"专业人员做出心搏骤停的判断所需时间不应超过","c":"心肺复苏","sc":1,"o":{"A":"5秒","B":"10秒","C":"20秒","D":"30秒"},"a":"B","e":"判断颈动脉搏动时间不能超过10s，10s内仍不能确定应立即开始胸外按压。"},{"i":"2021_04_single_10","t":"single","s":"关于低渗性缺水，下列说法中正确的是","c":"危重症患者的护理","sc":1,"o":{"A":"是临床最常见的水钠代谢紊乱","B":"水和钠等比例丢失","C":"细胞内容量保持正常","D":"常伴有中枢神经系统功能障碍"},"a":"D","e":"低渗性缺水时细胞外液低渗、水移入细胞内致脑细胞肿胀，常伴中枢神经系统功能障碍；最常见及等比例丢失为等渗性缺水特点。"},{"i":"2021_04_single_11","t":"single","s":"低钾血症患者最早出现的临床表现是","c":"危重症患者的护理","sc":1,"o":{"A":"焦虑易怒","B":"肌肉无力","C":"麻痹性肠梗阻","D":"直立性低血压"},"a":"B","e":"肌肉无力是低钾血症最早出现的症状，一般从下肢开始逐渐到上肢。"},{"i":"2021_04_single_12","t":"single","s":"安置休克患者体位时将其下肢抬高的目的是","c":"危重症患者的护理","sc":1,"o":{"A":"减少压疮的发生","B":"增加肺活量","C":"预防下肢深静脉血栓","D":"增加回心血量"},"a":"D","e":"休克体位抬高下肢有利于增加回心血量，从而增加循环血容量。"},{"i":"2021_04_single_13","t":"single","s":"有创呼吸机参数设置时吸气（I）与呼气（E）的时间比设置为","c":"危重症患者的护理","sc":1,"o":{"A":"1:1","B":"1:2","C":"1:4","D":"2:5"},"a":"B","e":"有创机械通气吸气与呼气时间比通常设置为I:E=1:2。"},{"i":"2021_04_single_14","t":"single","s":"急性肺血栓栓塞症患者溶栓治疗获得最佳效果的时间窗是症状发作的","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"48小时内","B":"72小时内","C":"6天内","D":"10天内"},"a":"A","e":"PTE症状发作48h内溶栓效果最佳。"},{"i":"2021_04_single_15","t":"single","s":"对大量气胸的体征描述正确的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"呼吸运动增强","B":"气管向患侧移位","C":"叩诊呈鼓音","D":"呼吸音增强"},"a":"C","e":"大量气胸患侧呼吸运动减弱、气管向健侧移位、叩诊过清音或鼓音、呼吸音减弱或消失。"},{"i":"2021_04_single_16","t":"single","s":"主动脉夹层患者的疼痛部位与夹层起源部位密切相关，若患者后背、腹部疼痛强烈，提示夹层病变累及","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"近端升主动脉","B":"主动脉弓","C":"腹主动脉","D":"降主动脉"},"a":"C","e":"后背、腹部及下肢疼痛强烈提示腹主动脉夹层形成；前胸疼痛提示近端升主动脉。"},{"i":"2021_04_single_17","t":"single","s":"对Merkel憩室并发出血有较大诊断价值的检查是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"胃镜检查","B":"X线钡餐造影","C":"选择性动脉造影","D":"放射性核素扫描"},"a":"D","e":"放射性核素显像检查法对Merkel憩室并发出血有较大诊断价值。"},{"i":"2021_04_single_19","t":"single","s":"成功治疗精索扭转的关键是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"避免剧烈运动","B":"尽早评估诊断","C":"迅速恢复睾丸血流","D":"解除患者思想负担"},"a":"C","e":"精索扭转救治目的是挽救睾丸，成功的关键是迅速恢复睾丸血流。"},{"i":"2021_04_single_20","t":"single","s":"对于接受药物治疗的糖尿病患者，低血糖的诊断标准为血糖水平≤","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"1.1mmol/L","B":"2.2mmol/L","C":"2.8mmol/L","D":"3.9mmol/L"},"a":"D","e":"接受药物治疗的糖尿病患者血糖水平≤3.9mmol/L即可认为血糖降低。"},{"i":"2021_04_single_22","t":"single","s":"脑出血的诱因不包括","c":"神经系统急症患者的护理","sc":1,"o":{"A":"用力排便","B":"安静休息","C":"饮酒","D":"情绪激动"},"a":"B","e":"出血性脑卒中多在情绪激动、剧烈活动或用力排便等情况下急骤发病；安静休息是缺血性卒中的发病状态。"},{"i":"2021_04_single_23","t":"single","s":"某患者手部不慎浸入石灰水中，就诊时可见手部皮肤焦黄，失去弹性，触之如皮革，创面干燥，针刺无痛觉。该患者的烧伤深度是","c":"损伤急症患者的护理","sc":1,"o":{"A":"一度烧伤","B":"浅二度烧伤","C":"深二度烧伤","D":"三度烧伤"},"a":"D","e":"三度(焦痂性)烧伤伤及皮肤全层，呈焦黄、触之硬如皮革、创面干燥、针刺无痛觉。"},{"i":"2021_04_single_24","t":"single","s":"狂犬病诊断的金标准是","c":"损伤急症患者的护理","sc":1,"o":{"A":"血常规检查","B":"脑脊液生化检查","C":"直接免疫荧光法抗原检测","D":"头颅核磁"},"a":"C","e":"直接免疫荧光法检测抗原是狂犬病诊断的金标准。"},{"i":"2021_04_single_25","t":"single","s":"异位妊娠患者因血液刺激膈肌所引起的肩胛部放射性疼痛称为","c":"妇产科急症患者的护理","sc":1,"o":{"A":"Babinski征","B":"Danforth征","C":"Kernig征","D":"Thomas征"},"a":"B","e":"异位妊娠内出血刺激膈肌可引起肩胛部放射性疼痛，称Danforth征。"},{"i":"2021_04_single_26","t":"single","s":"眼内异物伤患者异物取出前禁忌的措施是","c":"眼科急症患者的护理","sc":1,"o":{"A":"局部冷敷","B":"无菌纱布遮盖伤眼","C":"观察有无角膜溃疡发生","D":"剪眼睫毛"},"a":"D","e":"进行眼内异物取出手术前禁忌剪眼睫毛和结膜囊冲洗，防止增加眼球压力和感染机会。"},{"i":"2021_04_single_27","t":"single","s":"食管异物最常嵌顿的位置是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"食管入口处","B":"食管上段","C":"食管中段","D":"食管下段"},"a":"A","e":"食管异物最常嵌顿于食管入口处(第一狭窄)，其次为食管中段。"},{"i":"2021_04_single_28","t":"single","s":"重症中暑的患者一般应在1小时内将直肠温度降至","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"39℃","B":"38℃","C":"37℃","D":"36℃"},"a":"B","e":"重症中暑一般应在1h内使直肠(肛)温度降至37.8～38.9℃为宜，约38℃。"},{"i":"2021_04_single_29","t":"single","s":"氟马西尼是下列哪类镇静催眠药的特异性拮抗剂？","c":"急性中毒患者的护理","sc":1,"o":{"A":"巴比妥类","B":"苯二氮卓类","C":"非巴比妥非苯二氮卓类","D":"吩噻嗪类"},"a":"B","e":"氟马西尼是苯二氮卓类受体特异性拮抗剂。"},{"i":"2021_04_single_30","t":"single","s":"CO中毒患者典型的口唇颜色为","c":"急性中毒患者的护理","sc":1,"o":{"A":"苍白","B":"发绀","C":"樱桃红","D":"暗红"},"a":"C","e":"CO中毒患者口唇黏膜呈樱桃红色。"},{"i":"2021_04_multi_31","t":"multi","s":"咯血伴有胸痛常见于","c":"常见急性症状的评估","sc":2,"o":{"A":"肺栓塞","B":"大叶性肺炎","C":"肺脓肿","D":"支气管扩张","E":"肺结核"},"a":"ABE","e":"教材指出咯血伴胸痛见于大叶性肺炎、肺栓塞、肺结核、支气管肿瘤等。"},{"i":"2021_04_multi_32","t":"multi","s":"有创机械通气中，气道压力增高的原因有","c":"危重症患者的护理","sc":2,"o":{"A":"呼吸道分泌物过多","B":"呼吸机管道打折","C":"气管插管气囊破损","D":"气道痉挛","E":"压力性气胸"},"a":"ABDE","e":"气道压增高见于分泌物过多、管道打折、导管移位、气道痉挛、压力性气胸、人机对抗；气囊破损致漏气使气道压降低。"},{"i":"2021_04_multi_33","t":"multi","s":"下列检查结果中符合急性重症哮喘急性发作的是","c":"呼吸系统急症患者的护理","sc":2,"o":{"A":"血清IgE降低","B":"支气管反应性测定呈气道高反应性","C":"呼吸性碱中毒","D":"有关呼气流速的指标均显著升高","E":"肺野透亮度增加"},"a":"BCE","e":"哮喘发作血清IgE可增高、呼气流速指标显著下降；重症发作低氧血症伴呼吸性碱中毒，呈气道高反应性，肺过度膨胀透亮度增加。"},{"i":"2021_04_multi_34","t":"multi","s":"急性胰腺炎患者有可能出现降低的指标有","c":"消化系统急症患者的护理","sc":2,"o":{"A":"血清淀粉酶","B":"血清脂肪酶","C":"血钾","D":"血钙","E":"CRP"},"a":"CD","e":"呕吐可引起低血钾，广泛脂肪坏死致低血钙；淀粉酶、脂肪酶、CRP多升高。"},{"i":"2021_04_multi_35","t":"multi","s":"喉阻塞患者四凹征的凹陷部位有","c":"耳鼻喉科急症患者的护理","sc":2,"o":{"A":"鼻翼","B":"锁骨上窝","C":"肋间隙","D":"胸骨上窝","E":"上腹部"},"a":"BCDE","e":"四凹征指胸骨上窝、锁骨上窝、肋间隙及上腹角(上腹部)于吸气时向内凹陷。"},{"i":"2021_04_short_36","t":"short","s":"简述急诊分诊中需要紧急救治患者的生命体征标准。","c":"急诊分诊","sc":5,"at":"参考答案（要点）：①心率<50次/分或>130次/分；②呼吸<10次/分或>30次/分；③脉搏血氧饱和度<90%；④血压：收缩压<85mmHg、舒张压<50mmHg，或收缩压>240mmHg、舒张压>120mmHg。","e":""},{"i":"2021_04_short_37","t":"short","s":"简述Geneva评分对肺血栓栓塞症患者进行初筛的主要参数。","c":"呼吸系统急症患者的护理","sc":5,"at":"参考答案（要点）：①年龄(60～79岁、≥80岁分别计分)；②既往有PTE或DVT病史；③近期手术史；④心率>100次/分；⑤动脉血气分析异常(低氧血症、低碳酸血症等)；⑥X线胸片楔状肺不张、肋膈角抬高；⑦结合临床下肢DVT体征等，按积分判断低、中、高度可能。","e":""},{"i":"2021_04_short_39","t":"short","s":"简述肠梗阻的急救护理原则及措施。","c":"消化系统急症患者的护理","sc":5,"at":"参考答案（要点）：原则为纠正因肠梗阻引起的全身性紊乱和解除梗阻。措施：①胃肠减压、禁食，生命体征稳定者取半卧位，观察并记录引流液性状；②建立静脉通路，记录出入量，纠正水、电解质及酸碱失衡，合理使用抗生素；③对症护理：未绞窄者可用阿托品解痉止痛，忌随意用吗啡类，呕吐时头偏一侧防误吸；④防治感染；⑤严密观察病情，警惕绞窄性肠梗阻(持续性剧烈腹痛、休克、腹膜刺激征、血性呕吐物或引流物等)。","e":""},{"i":"2021_04_essay_40","t":"essay","s":"试述急性冠状动脉综合征患者胸痛的基本特征。","c":"心血管系统急症患者的护理","sc":10,"at":"参考答案（要点）：①部位：多在胸骨后，可向左上臂、下颌、颈、背、肩部或左前臂尺侧放射；②性质：发作性胸骨后闷痛，呈紧缩压榨感、压迫感或烧灼感；③诱因与持续时间：可在休息或夜间发生，持续可达30min甚至数小时；④不稳定特征：静息时发作持续>20min、新近发生(2个月内)且程度严重、近期发作频度/持续时间/程度进行性加重或放射到新部位；⑤伴随症状：可伴出汗、恶心、呼吸困难、窒息感甚至晕厥；⑥缓解因素：休息及含服硝酸甘油不能完全缓解(心肌梗死时)。","e":""},{"i":"2021_04_case_41","t":"case","s":"患者，男性，33岁，因“车祸脾破裂出血半小时”平车收入抢救室。查体：BP 74/56mmHg，HR 118次/分，R 27次/分，T 36.1℃，神志清楚，表情淡漠，面色苍白，四肢皮肤湿冷、发花。\n请结合病例回答：\n（1）该患者目前最主要的并发症及其判断依据；\n（2）应采取的急救措施。","c":"损伤急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最主要并发症：低血容量性(失血性)休克。判断依据：①脾破裂大出血病史；②血压74/56mmHg明显降低；③心率118次/分增快、R 27次/分呼吸急促；④面色苍白、四肢皮肤湿冷发花、表情淡漠等休克表现。(2)急救措施：①取休克体位(头躯干抬高20°～30°、下肢抬高15°～20°)，保暖；②保持呼吸道通畅，高流量吸氧；③迅速建立两条以上静脉通路，快速输注晶体液/胶体液扩容，交叉配血并尽早输血；④紧急做好术前准备，尽快手术止血(脾切除或修补)；⑤严密监测生命体征、意识、尿量、皮肤色泽及末梢循环；⑥准确记录出入量，做好抢救记录。","e":""},{"i":"2021_04_case_42","t":"case","s":"患者，女性，69岁，糖尿病病史20余年，采用胰岛素治疗。1周前受凉后咳嗽、咳痰伴发热，自服感冒药效果不佳，2天前出现恶心呕吐、食欲不佳，2小时前家人发现其神志模糊，急送急诊。体格检查：P 110次/分，R 26次/分，BP 120/70mmHg，身高156cm，体重65kg，神志不清，呼之不应，皮肤弹性差，呼气有烂苹果味，双肺呼吸音粗，双肺底有湿啰音，心率110次/分，律齐，无杂音。实验室检查：血糖23.12mmol/L，尿糖（++++），尿酮（++++）。\n请结合病例回答：\n（1）该患者神志不清最可能的原因；\n（2）病情监测指标；\n（3）目前应采取的治疗原则。","c":"内分泌系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能原因：糖尿病酮症酸中毒(DKA)昏迷。依据：①糖尿病史、胰岛素治疗，有受凉感染诱因；②恶心呕吐、呼气有烂苹果味(丙酮味)、皮肤弹性差(脱水)；③血糖23.12mmol/L显著升高，尿糖(++++)、尿酮(++++)；④神志不清。(2)病情监测指标：①生命体征及SpO2；②血糖、尿糖、尿酮、血酮动态监测；③血气分析、血钾血钠等电解质、CO2结合力、肾功能；④意识状态、瞳孔；⑤出入量及尿量；⑥心电图(警惕低钾所致心律失常)。(3)治疗原则：①尽快补液恢复血容量；②小剂量(短效)胰岛素持续静脉滴注降低血糖；③纠正电解质与酸碱平衡失调，重点补钾，谨慎补碱；④祛除诱因(控制感染)；⑤防治休克、脑水肿、低钾、肾衰竭等并发症；⑥严密监测与护理。","e":""}]},{"key":"2021_10","name":"2021年10月","qs":[{"i":"2021_10_single_1","t":"single","s":"静息状态下人体直肠温度正常值不超过","c":"常见急性症状的评估","sc":1,"o":{"A":"36.5℃","B":"37.0℃","C":"37.2℃","D":"37.6℃"},"a":"D","e":"教材指出静息状态下直肠温度不超过37.6℃。"},{"i":"2021_10_single_2","t":"single","s":"依据院前急救的原则，在急救现场施救者应首先进行的是","c":"绪论","sc":1,"o":{"A":"紧急呼救","B":"快速评估周围环境","C":"立即实施抢救","D":"确定转运方式"},"a":"B","e":"院前急救首先应快速评估周围环境，确保救护者与患者安全，再实施抢救。"},{"i":"2021_10_single_3","t":"single","s":"基于感染管理标准预防的原则，急诊科人员在抢救中根据预期的暴露可选择的防护用品不包括","c":"急诊分诊","sc":1,"o":{"A":"手套","B":"隔离衣","C":"护目镜","D":"防毒面罩"},"a":"D","e":"标准预防用品包括手套、口罩、隔离衣、护目镜/防护面屏等；防毒面罩用于特殊化学/毒气环境，非常规标准预防用品。"},{"i":"2021_10_single_4","t":"single","s":"患者，男性，58岁，吸烟史30年，因胸痛2小时就诊。患者疼痛剧烈，呈压榨样，位于心前区，向左肩部及左上肢放射，伴大汗，口服硝酸甘油不缓解。测双上肢血压一致。该患者胸痛的可能病因是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"胸膜炎","B":"冠心病","C":"带状疱疹","D":"主动脉夹层"},"a":"B","e":"压榨样心前区痛向左肩左上臂放射、硝酸甘油不缓解符合冠心病急性心肌梗死；双上肢血压一致可基本排除主动脉夹层。"},{"i":"2021_10_single_5","t":"single","s":"上消化道出血最常见的临床表现是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"呕血和黑便","B":"恶心和呕吐","C":"腹痛和腹胀","D":"腹泻和粘液脓血便"},"a":"A","e":"呕血和黑便是上消化道出血的特征性、最常见表现。"},{"i":"2021_10_single_6","t":"single","s":"成人心搏骤停最常见的原因是","c":"心肺复苏","sc":1,"o":{"A":"创伤","B":"淹溺","C":"冠心病","D":"药物过量"},"a":"C","e":"成人的心搏骤停最常见的原因是原发性心脏事件，冠心病是心搏骤停最常见的病因。"},{"i":"2021_10_single_7","t":"single","s":"心肺复苏采用简易呼吸器通气的操作，错误的是","c":"心肺复苏","sc":1,"o":{"A":"术者站于患者头侧","B":"面罩尖端指向患者头部","C":"采用E-C手法固定面罩","D":"挤压气囊送气时间应小于1秒"},"a":"D","e":"简易呼吸器挤压送气时间应不小于1s，而非小于1s；术者站头侧、面罩尖端朝头侧、E-C手法固定均正确。"},{"i":"2021_10_single_8","t":"single","s":"下列反映酸碱度的血气指标是","c":"危重症患者的护理","sc":1,"o":{"A":"PaCO₂","B":"PaO₂","C":"pH","D":"SaO₂"},"a":"C","e":"pH是反映体液酸碱度的指标；PaCO₂反映呼吸性因素，PaO₂、SaO₂反映氧合。"},{"i":"2021_10_single_9","t":"single","s":"患者，男性，34岁，十二指肠溃疡病史2年。2小时前突然出现上腹部疼痛，伴上腹压痛、肌紧张及反跳痛，腹部X线平片可见膈下游离气体。该患者腹痛最可能的病因是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"十二指肠溃疡穿孔","B":"急性胆囊炎","C":"急性胃炎","D":"急性盆腔炎"},"a":"A","e":"溃疡病史+突发上腹剧痛、腹膜刺激征+膈下游离气体是胃十二指肠溃疡穿孔的典型表现。"},{"i":"2021_10_single_10","t":"single","s":"使用止血带为患者止血时，错误的是","c":"急救技术","sc":1,"o":{"A":"注明包扎时间","B":"扎止血带时间一般应＜1h","C":"扎止血带的部位应放衬垫","D":"前臂大出血应将止血带扎于上臂中下1/3处"},"a":"D","e":"上臂中下1/3处桡神经紧贴骨面不宜扎止血带；上肢大出血应扎上臂上1/3处。注明时间、<1h、放衬垫均正确。"},{"i":"2021_10_single_11","t":"single","s":"对气胸的影像学特点描述正确的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"气胸线呈水平线状","B":"气胸线外透亮度降低","C":"心脏向健侧移位","D":"肺纹理增强"},"a":"C","e":"气胸时患侧胸腔积气，纵隔(心脏)向健侧移位；气胸线外透亮度增高、无肺纹理。"},{"i":"2021_10_single_12","t":"single","s":"下列动脉血气分析结果，提示为I型呼吸衰竭的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"PaO₂ 55mmHg PaCO₂ 40mmHg","B":"PaO₂ 55mmHg PaCO₂ 60mmHg","C":"PaO₂ 50mmHg PaCO₂ 60mmHg","D":"PaO₂ 50mmHg PaCO₂ 80mmHg"},"a":"A","e":"I型(低氧性)呼衰PaO₂<60mmHg而PaCO₂正常或降低，A符合；其余伴PaCO₂升高为II型呼衰。"},{"i":"2021_10_single_13","t":"single","s":"高血压危象是指血压急性升高超过","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"140/100mmHg","B":"160/110mmHg","C":"180/120mmHg","D":"200/130mmHg"},"a":"C","e":"高血压危象指血压急性升高超过180/120mmHg。"},{"i":"2021_10_single_14","t":"single","s":"休克指数为1时，患者的失血量约为","c":"危重症患者的护理","sc":1,"o":{"A":"200～400ml","B":"400～800ml","C":"800～1200ml","D":"＞1200ml"},"a":"C","e":"休克指数=1大约失血800～1200ml(占总血量20%～30%)。"},{"i":"2021_10_single_15","t":"single","s":"肠梗阻患者呕吐物呈棕褐色或血性提示","c":"消化系统急症患者的护理","sc":1,"o":{"A":"高位肠梗阻","B":"低位肠梗阻","C":"麻痹性肠梗阻","D":"肠管血运障碍"},"a":"D","e":"呕吐物呈棕褐色或血性是肠管血运障碍(绞窄性肠梗阻)的表现。"},{"i":"2021_10_single_16","t":"single","s":"尿石症体外冲击波碎石主要适用于","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"下尿路感染的患者","B":"结石直径小于2.5cm的患者","C":"急性肾衰竭的患者","D":"结石直径大于2.5cm的患者"},"a":"B","e":"体外冲击波碎石(ESWL)主要适用于直径小于2.5cm的结石；感染、肾功能严重受损者不宜。"},{"i":"2021_10_single_17","t":"single","s":"糖尿病酮症酸中毒患者呼气中有烂苹果味是由于其","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖极度升高","B":"丙酮酸水平过高","C":"消化功能急剧减弱","D":"尿糖水平过高"},"a":"B","e":"DKA时酮体(丙酮等)经呼吸道呼出，呈烂苹果(丙酮)味。"},{"i":"2021_10_single_18","t":"single","s":"人体脑细胞所需的能量几乎完全直接来自于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖","B":"血氨基酸","C":"糖原","D":"血脂肪酸"},"a":"A","e":"脑细胞主要靠葡萄糖(血糖)氧化供能，几乎无糖原储备，故低血糖时脑症状出现早。"},{"i":"2021_10_single_19","t":"single","s":"下列表现提示甲亢患者出现先兆危象的是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"体温38.5℃，心率125次/分","B":"频繁便秘与腹泻交替","C":"情绪低落，郁郁寡欢","D":"尿量增多，口渴多食"},"a":"A","e":"先兆(危象前期)表现为体温38～39℃、心率120～159次/分、多汗、烦躁等。"},{"i":"2021_10_single_20","t":"single","s":"癫痫患者发作时的护理措施不正确的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"边抢救边呼叫，切勿离开患者","B":"将患者头转向一侧，保持呼吸道通畅","C":"将缠有纱布的压舌板置于上下臼齿之间，以免舌咬伤","D":"抽搐时尽量用力按压抽搐肢体，以免骨折"},"a":"D","e":"抽搐时不可用力按压肢体，以免骨折、脱臼；应扶持倒地、头偏一侧、臼齿间置压舌板防舌咬伤。"},{"i":"2021_10_single_22","t":"single","s":"临床上最常见的烧伤类型是","c":"损伤急症患者的护理","sc":1,"o":{"A":"电烧伤","B":"化学烧伤","C":"热力烧伤","D":"放射线灼伤"},"a":"C","e":"热力烧伤(火焰、热液等)是临床上最常见的烧伤类型。"},{"i":"2021_10_single_23","t":"single","s":"异位妊娠患者治疗时首选的药物是","c":"妇产科急症患者的护理","sc":1,"o":{
