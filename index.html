"i":"2019_4_multi_22","t":"multi","s":"文献检索方法中的常用法包括","c":"医学信息的获取与利用","sc":2,"o":{"A":"顺查法","B":"倒查法","C":"抽查法","D":"追溯法","E":"循环法"},"a":"ABC","e":"常用法(工具法)包括顺查法、倒查法和抽查法；追溯法、循环法(分段交替法)为另外的检索方法。"},{"i":"2019_4_multi_23","t":"multi","s":"在高血压患者焦虑状况的调查研究中主要涉及的变量为","c":"护理研究的基本程序","sc":2,"o":{"A":"患者","B":"焦虑","C":"状况","D":"调查","E":"高血压"},"a":"BE","e":"研究中主要涉及的变量是高血压(研究对象的特征/分组)和焦虑(拟测量的状态)；患者、状况、调查均非变量。"},{"i":"2019_4_multi_24","t":"multi","s":"理想的理论框架或概念框架图应具备的特征为","c":"确立研究问题","sc":2,"o":{"A":"科学性","B":"逻辑性","C":"指导性","D":"可行性","E":"创新性"},"a":"BC","e":"理论/概念框架应具备逻辑性和指导性两个特征。"},{"i":"2019_4_multi_25","t":"multi","s":"下列有关质性研究设计特点的描述正确的是","c":"护理研究设计","sc":2,"o":{"A":"质性研究仅截取某一个片段深入探索","B":"质性研究往往采取方便取样的方法选取研究对象","C":"质性研究的设计在研究开始时设定好就不允许改动","D":"资料收集和资料分析过程同步进行","E":"质性研究一般综合多种资料收集的方法"},"a":"BDE","e":"质性研究具有整体性、设计灵活，常采取非概率(立意/目的)抽样，一般综合多种资料收集方法，资料收集与分析同步进行；故A、C错误。"},{"i":"2019_4_multi_26","t":"multi","s":"信息性偏倚的控制方法包括","c":"护理研究设计","sc":2,"o":{"A":"采用盲法收集资料","B":"尽量使用客观的指标","C":"随机化","D":"设立多组对照","E":"制定严格的资料收集和质量控制方法"},"a":"ABE","e":"信息性偏倚的控制包括采用盲法、尽量使用客观指标、制定严格的资料收集和质量控制方法；随机化、多组对照主要控制选择性/混杂性偏倚。"},{"i":"2019_4_multi_27","t":"multi","s":"针对收集资料方案进行预试验的目的是","c":"资料收集的方法","sc":2,"o":{"A":"测试资料收集的时间","B":"获取研究工具的某些基本特征","C":"获取研究对象的同意","D":"测试研究工具的文字是否通顺易懂","E":"确认是否要培训调查员"},"a":"ABDE","e":"预试验目的是测试资料收集时间、研究工具应用情况及研究对象反应、工具文字是否通顺、是否需培训调查员，并可获取工具某些基本特征(信效度指标)；获取研究对象同意属知情同意程序。"},{"i":"2019_4_multi_28","t":"multi","s":"效标关联效度包括","c":"研究工具性能的测定","sc":2,"o":{"A":"内容效度","B":"结构效度","C":"同时效度","D":"预测效度","E":"表面效度"},"a":"CD","e":"效标关联效度按效标收集时间不同分为同时效度和预测效度。"},{"i":"2019_4_multi_29","t":"multi","s":"某研究者欲对其获取到的研究数据进行卡方检验，在下列哪些情况下这个研究者需要使用Fisher确切概率法？","c":"研究资料的分析方法","sc":2,"o":{"A":"总例数N≥40","B":"总例数N＜40","C":"理论数T＜1","D":"理论数T≥5","E":"理论数T≥1"},"a":"BC","e":"当总例数N<40或理论数T<1时，应使用Fisher确切概率法。"},{"i":"2019_4_multi_30","t":"multi","s":"访谈法的优点包括","c":"资料收集的方法","sc":2,"o":{"A":"应答率较高","B":"花费小","C":"节省时间","D":"所获资料较为完整、丰富","E":"适合于不能填写问卷的研究对象"},"a":"ADE","e":"访谈法优点为应答率较高、所获资料较完整丰富、适合不能填写问卷者；其缺点为费时、花费大、影响因素较多。"},{"i":"2019_4_multi_31","t":"multi","s":"下列有关研究工具信度和效度关系的描述正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"只要研究工具存在，就势必有它的信度和效度","B":"研究工具的信度和效度是程度上高或低的问题","C":"信度低的工具效度肯定不高","D":"信度高的工具效度肯定高","E":"信度和效度有时是截然孤立的"},"a":"BC","e":"信度和效度都是程度高低的问题；信度低则效度必低，但信度高效度未必高；并非有工具就必然有信效度、二者也非截然孤立。"},{"i":"2019_4_multi_32","t":"multi","s":"下列属于统计推断的统计学方法是","c":"研究资料的分析方法","sc":2,"o":{"A":"t检验","B":"中位数","C":"相关分析","D":"均数","E":"秩和检验"},"a":"ACE","e":"统计推断包括假设检验(t检验、秩和检验)和相关分析等；中位数、均数属统计描述指标。"},{"i":"2019_4_multi_33","t":"multi","s":"下列对于综述论文中引用文献的原则的描述，正确的是","c":"护理论文的撰写","sc":2,"o":{"A":"选用权威、知名学者发表的文献","B":"必须是作者亲自阅读的参考文献","C":"尽量选用权威性期刊发表的文献","D":"可多引用教材或专科书的资料","E":"不选用未公开发表的文献"},"a":"ABCE","e":"综述应引用作者亲自阅读过的、权威知名学者和权威期刊发表的较新文献，不选用未公开发表的文献；不宜多引用教材或专科书。"},{"i":"2019_4_term_35","t":"term","s":"知情同意","c":"绪论","sc":4,"at":"参考答案（要点）：知情同意是指向研究对象充分说明研究的目的、方法、预期益处、潜在风险及可自愿参加并随时退出等情况后，研究对象在完全理解的基础上自主同意参加研究并签署知情同意书的过程。","e":""},{"i":"2019_4_term_36","t":"term","s":"配对对照","c":"护理研究设计","sc":4,"at":"参考答案（要点）：配对对照是在设立对照时，为对照组和实验组研究对象在年龄、性别、病情等可能影响研究结果的重要混杂因素上进行配比，使两组对象齐同可比，从而控制混杂性偏倚的一种对照方法。","e":""},{"i":"2019_4_term_37","t":"term","s":"非结构式访谈","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：非结构式访谈又称开放式访谈，是研究者没有事先设计好的固定问卷和固定程序，只围绕研究主题与研究对象自由交谈、灵活提问，以深入获取研究对象真实想法和感受的访谈方式，常用于质性研究。","e":""},{"i":"2019_4_term_39","t":"term","s":"抽样误差","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：抽样误差是指样本统计量与总体相应指标之间的差别，是由于总体中个体间存在差异、抽样的偶然性所致；抽样研究必然存在、不可避免，但可通过随机抽样、扩大样本量等方法缩小。","e":""},{"i":"2019_4_short_40","t":"short","s":"自变量应具有哪些特征？","c":"护理研究的基本程序","sc":5,"at":"参考答案（要点）：自变量是研究者操纵、选择或观察的、假定为原因的变量，应具有：①可变性：自变量应能取不同的数值或类别，有变化；②可操纵性(可施加)：实验性研究中研究者可人为安排、改变其水平；③有效性：自变量须与研究问题相关，能有效地预测或解释因变量的变化；④客观性：应能客观测量或记录，避免主观臆断。","e":""},{"i":"2019_4_short_41","t":"short","s":"简述护理经验论文的特征。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：护理经验论文的特征：①是护理工作者将临床护理、护理教学、护理管理等实践中的经验、体会总结而成；②写作形式灵活、不受固定格式约束，可写成功经验也可写失败教训；③内容应加强和充实护理内容，突出护理特色；④对实践有指导和借鉴意义，题材来源于实际工作。","e":""},{"i":"2019_4_short_42","t":"short","s":"简述邮寄问卷法回收率低的原因。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：邮寄问卷回收率低的原因主要有：①研究对象对研究内容不感兴趣、不重视；②问卷填写较费时费力、题目过多过难；③缺少提醒、督促和回访机制；④信封、邮资或填写说明等安排不当；⑤研究对象迁移、地址变更等无法投递。一般认为邮寄问卷回收率达60%以上较为满意。","e":""},{"i":"2019_4_short_43","t":"short","s":"简述在国外量表的翻译和应用过程中回译的基本步骤。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：翻译-回译的基本步骤：①翻译：先由精通双语者将原量表翻译成中文；②回译：再由另一译者在不看原文的情况下将中文译稿回译成英文；③比较：将回译文与原量表逐条比较，找出不一致之处并讨论修改；④请双语专家及临床专家对翻译稿进行评议、修订；⑤形成中文版本并进行预试验和信效度检验。","e":""},{"i":"2019_4_application_44","t":"application","s":"某研究者撰写了一篇研究论文，准备对参考文献进行正确的书写。请你根据参考文献的正确书写格式帮助他对下面的两条参考文献进行书写。[1]由姜安丽，朱京慈，刘玮琳三位作者撰写的题目为“临床护理专家综合评价指标的构建研究”的文章，发表在2005年第22卷第3期的解放军护理杂志上，页码为1-3页。[2]由梁万年主编的书籍，名字是“临床医学研究方法”，第1版，由北京的北京科学技术出版社出版，发表时间是2002年。这位研究者在论文中引用的内容来自于该书的第132-157页。","c":"护理论文的撰写","sc":10,"at":"参考答案（要点）：期刊著录格式：[序号] 作者.文题[J].刊名,年,卷(期):起止页码。→ [1] 姜安丽,朱京慈,刘玮琳.临床护理专家综合评价指标的构建研究[J].解放军护理杂志,2005,22(3):1-3. 书籍著录格式：[序号] 主编.书名[M].版次.出版地:出版社,年:引用页码。第1版可省略版次。→ [2] 梁万年.临床医学研究方法[M].北京:北京科学技术出版社,2002:132-157.","e":""}]},{"key":"2019_10","name":"2019年10月","qs":[{"i":"2019_10_single_1","t":"single","s":"国外护理研究的发展起源于20世纪20年代初期，当时着重于","c":"绪论","sc":1,"o":{"A":"护理教育的研究","B":"医院环境的研究","C":"护理工作程序的研究","D":"护士角色的研究"},"a":"A","e":"20世纪20年代初期早期护理研究大多围绕护理教育方面，侧重如何加强护理教育。"},{"i":"2019_10_single_2","t":"single","s":"如果某研究者仅通过查阅医院病案室的病例来进行资料分析和研究，此时的研究风险级别是","c":"绪论","sc":1,"o":{"A":"永久性伤害的可能","B":"较严重的暂时不适","C":"暂时的不适","D":"无可预见的影响"},"a":"D","e":"仅查阅病案资料、对研究对象无直接干预和接触，对研究对象无可预见的影响。"},{"i":"2019_10_single_3","t":"single","s":"在研究中研究对象有权决定是否参加研究，这体现了研究对象的","c":"绪论","sc":1,"o":{"A":"隐私权","B":"公平治疗的权利","C":"自主决定权","D":"免于遭受伤害的权利"},"a":"C","e":"研究对象有权自主决定是否参加研究，体现自主决定权。"},{"i":"2019_10_single_4","t":"single","s":"下列题目中选题范围过大的是","c":"确立研究问题","sc":1,"o":{"A":"对进行体温测试的时间选择的研究","B":"探讨急诊科患者的心理护理","C":"对密闭式吸痰管更换时间的研究","D":"加味金钱草汤对肾结石患者排石效果的临床研究"},"a":"B","e":"“探讨急诊科患者的心理护理”范围宽泛、涉及面过大，不易深入研究，属选题范围过大。"},{"i":"2019_10_single_5","t":"single","s":"按照文献的级别，教科书属于","c":"医学信息的获取与利用","sc":1,"o":{"A":"一次文献","B":"二次文献","C":"三次文献","D":"零次文献"},"a":"C","e":"教科书、综述、词典、手册、年鉴等是对一次文献进行综合分析后编写的，属三次文献。"},{"i":"2019_10_single_6","t":"single","s":"某护士研究“对同样的患者进行同样内容的健康宣教，应用不同的宣教方法将会产生怎样的健康教育效果”时，其中的自变量是","c":"护理研究的基本程序","sc":1,"o":{"A":"患者知识的变化","B":"各类不同的教学方法","C":"患者能力的变化","D":"研究者宣教时的环境"},"a":"B","e":"研究者主动安排、施加的不同宣教(教学)方法是自变量；健康教育效果(知识、能力变化)是因变量。"},{"i":"2019_10_single_7","t":"single","s":"撰写论文题目时字数一般不超过","c":"护理论文的撰写","sc":1,"o":{"A":"15个汉字","B":"20个汉字","C":"25个汉字","D":"30个汉字"},"a":"B","e":"文题一般不超过20个汉字。"},{"i":"2019_10_single_8","t":"single","s":"某研究者想要查找艾滋病方面的相关文献，已知艾滋病方面的研究是从1981年开始的，该研究者从1981年以后逐年向近期查找文献。这种文献检索方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"顺查法","B":"倒查法","C":"抽查法","D":"追溯法"},"a":"A","e":"顺查法是按时间顺序由远及近、从早期逐年查到近期的检索方法。"},{"i":"2019_10_single_9","t":"single","s":"为了排除与研究无关的干扰因素的影响，突出试验中干预措施的效应，在研究设计中需要","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"随机化","C":"盲法","D":"设立对照"},"a":"D","e":"设立对照的目的就是排除与研究无关的干扰因素、突出干预措施的效应。"},{"i":"2019_10_single_10","t":"single","s":"在类实验性研究设计中一定要有","c":"护理研究设计","sc":1,"o":{"A":"随机化","B":"干预","C":"设立对照","D":"盲法"},"a":"B","e":"类实验性研究对研究对象施加了干预措施，但缺少随机分组或(和)对照，干预是其必备内容。"},{"i":"2019_10_single_11","t":"single","s":"有关癌症晚期患者照顾者的照顾体验的研究属于","c":"护理研究设计","sc":1,"o":{"A":"现象学研究","B":"根基理论研究","C":"人种学研究","D":"纵向研究"},"a":"A","e":"现象学研究旨在探讨特定人群对某现象(如照顾体验)的真实生活经历和体验。"},{"i":"2019_10_single_12","t":"single","s":"研究者没有采取随机抽样的方法，而是先将总体按某种或某些特征分成不同的类别，然后依照每一类中个体数占总体的比例来抽取相应数目的个体构成样本，这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"滚雪球抽样"},"a":"B","e":"定额抽样(配额抽样)先按特征分类，再按各类个体数占总体比例分配并抽取相应数目，属非概率抽样。"},{"i":"2019_10_single_13","t":"single","s":"用一条100mm长的直线表示程度的差异，普遍用于人们对某种经历的感受，目前又设计出脸谱、阶梯等用形象图形表示的形式，这种类型的量表为","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"D","e":"视觉类似物量表(VAS)传统用100mm直线表示程度差异，目前又设计出脸谱、阶梯等形象图形形式。"},{"i":"2019_10_single_14","t":"single","s":"某研究者在参与护理工作中观察护士的活动，是以观察为主，参与为辅。此时观察者与被观察者的关系是","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"B","e":"参与性观察者以观察为主、参与为辅，作为参与者进入观察领域。"},{"i":"2019_10_single_15","t":"single","s":"一般认为研究工具的信度较为理想时需要相关系数高于","c":"研究工具性能的测定","sc":1,"o":{"A":"0.5","B":"0.6","C":"0.7","D":"1.0"},"a":"C","e":"一般认为研究工具的信度系数高于0.7较为理想，翻译量表可接受信效度系数应大于0.7。"},{"i":"2019_10_single_16","t":"single","s":"可以减少抽样误差的方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"采用方便抽样","B":"选择变异程度小的研究指标","C":"采用目的抽样","D":"选择非实验性研究设计"},"a":"B","e":"选择变异程度小的指标、随机抽样和适当样本量可减少抽样误差；方便/目的抽样、研究设计类型不直接减少抽样误差。"},{"i":"2019_10_single_17","t":"single","s":"某研究者采用焦虑自评量表，测量了210名肾移植术后患者的焦虑状况，患者量表得分为正态分布。若要将患者的量表得分与该量表的常模（正常人）比较，可采用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"独立样本t检验","B":"配对t检验","C":"秩和检验","D":"方差分析"},"a":"A","e":"样本(210名患者)与常模(总体)均数比较、且资料正态，应做单样本t检验；卷中未列单样本t检验，所列A独立样本t检验为最接近的均数比较方法。"},{"i":"2019_10_single_18","t":"single","s":"某护士欲用统计图的形式来表示6岁以内儿童身高随年龄的增长情况，应选择的统计图种类是","c":"研究资料的分析方法","sc":1,"o":{"A":"圆图","B":"单式直条图","C":"复式直条图","D":"线图"},"a":"D","e":"线图适用于某指标随另一连续变量(年龄)变化的趋势，适合表示身高随年龄的增长。"},{"i":"2019_10_single_19","t":"single","s":"将书刊资料所刊载的文章的题目、作者、出处以及所论及的主题等进行著录，并按照一定的原则和方法编排而成的检索工具是","c":"医学信息的获取与利用","sc":1,"o":{"A":"目录","B":"题录","C":"索引","D":"文摘"},"a":"C","e":"索引将文章题目、作者、出处及主题等著录并按一定方法编排，指引查阅文献；目录以书刊名称为著录单元，题录不含主题，文摘附内容摘要。"},{"i":"2019_10_single_20","t":"single","s":"下列对护理个案论文的描述，正确的是","c":"护理论文的撰写","sc":1,"o":{"A":"针对个案护理的资料进行研究","B":"是量性研究的一种","C":"研究结果可以大规模推广","D":"不用必须按照护理程序的思路进行撰写"},"a":"A","e":"护理个案论文是针对个案护理资料进行研究总结的论文，属质性研究，结果不宜大规模推广，应按护理程序思路撰写。"},{"i":"2019_10_multi_21","t":"multi","s":"科学研究应遵循的基本原则包括","c":"绪论","sc":2,"o":{"A":"客观性原则","B":"实验原则","C":"多样性原则","D":"可重复性原则","E":"特殊性原则"},"a":"ABD","e":"科学研究应遵循客观性原则、实验原则和可重复性原则。"},{"i":"2019_10_multi_22","t":"multi","s":"下列有关伦理审查委员会（IRB）的描述，正确的是","c":"绪论","sc":2,"o":{"A":"每个IRB都包括至少5名成员","B":"可在大学、医院以及医疗保健中心设立","C":"IRB中至少2人为非研究机构成员","D":"IRB的成员必须具备相似的教育背景","E":"护士可以成为IRB的成员"},"a":"ABE","e":"每个IRB至少5名不同背景成员，其中至少1人为非研究机构成员，可在大学、医院及医疗保健中心设立，护士近年也被纳入；故C、D错误。"},{"i":"2019_10_multi_23","t":"multi","s":"下列属于无序分类变量的是","c":"研究资料的分析方法","sc":2,"o":{"A":"性别（男、女）","B":"疗效（治愈、显效、好转、无效）","C":"血型（O型、A型、B型、AB型）","D":"药物反应（阴性、阳性）","E":"贫血（重度、中度、轻度）"},"a":"ACD","e":"性别、血型、药物反应各水平间无程度顺序，属无序分类；疗效、贫血程度有等级顺序，属等级资料。"},{"i":"2019_10_multi_24","t":"multi","s":"下列有关预试验的描述，正确的是","c":"资料收集的方法","sc":2,"o":{"A":"在正式开始研究工作的第一阶段进行","B":"可以检查研究设计是否切合实际","C":"可以获得研究工具的信度和效度方面的资料","D":"有助于核实样本量的估计是否合适","E":"使参加研究课题的研究人员可以统一方法，减少误差"},"a":"BCDE","e":"预试验是正式研究之前进行的可行性研究，可检查设计是否切合实际、获取工具信效度资料、核实样本量估计、培训并统一方法减少误差；它不是正式研究工作的第一阶段。"},{"i":"2019_10_multi_25","t":"multi","s":"理想的概念框架图应具备的特征是","c":"确立研究问题","sc":2,"o":{"A":"美观性","B":"逻辑性","C":"开放性","D":"指导性","E":"创新性"},"a":"BD","e":"理论/概念框架应具备逻辑性和指导性两个特征。"},{"i":"2019_10_multi_26","t":"multi","s":"实验性研究的优点有","c":"护理研究设计","sc":2,"o":{"A":"是检验因果假设最有说服力的一种研究设计","B":"最大限度地控制了外变量对于依变量的影响","C":"不容易触犯伦理问题","D":"反映研究的科学性和客观性较高","E":"在护理研究领域的应用具有普遍性"},"a":"ABD","e":"实验性研究随机分组、设对照、施加干预，是检验因果假设最有说服力的设计，最大限度控制外变量影响、科学性客观性高；但因伦理和实际条件限制，在护理中应用受限、并非不易触犯伦理。"},{"i":"2019_10_multi_27","t":"multi","s":"信息性偏倚包括","c":"护理研究设计","sc":2,"o":{"A":"回忆偏倚","B":"报告偏倚","C":"诊断怀疑偏倚","D":"测量偏倚","E":"选择性偏倚"},"a":"ABCD","e":"信息性偏倚包括回忆偏倚、报告偏倚、诊断怀疑偏倚和测量偏倚；选择性偏倚属另一大类偏倚。"},{"i":"2019_10_multi_28","t":"multi","s":"在设计收集资料的方案前应考虑的问题有","c":"资料收集的方法","sc":2,"o":{"A":"采用随机还是非随机抽样","B":"采用结构式还是非结构式方法","C":"采用定量还是定性方法","D":"资料是否要求严格的客观性","E":"是否存在霍桑效应的影响"},"a":"BCDE","e":"设计资料收集方案前应考虑：采用结构式还是非结构式方法、定量还是定性方法、资料是否要求严格客观性、是否存在霍桑效应影响；抽样方法的选择属抽样设计而非资料收集方案。"},{"i":"2019_10_multi_29","t":"multi","s":"自设问卷时问卷的用词要求有","c":"资料收集的方法","sc":2,"o":{"A":"清晰","B":"适合被问者的文化程度","C":"不要暗示答案","D":"多使用专业术语","E":"敏感问题应采用第二人称进行询问"},"a":"ABC","e":"问卷用词应清晰、适合被问者文化程度、不暗示答案；应少用专业术语，敏感问题宜用第三人称/投射法询问。"},{"i":"2019_10_multi_30","t":"multi","s":"某研究者计划测量《护理工作满意度问卷》的内在一致性，下面可以用来反映此研究工具内在一致性的方法是","c":"研究工具性能的测定","sc":2,"o":{"A":"折半信度","B":"重测相关系数","C":"KR-20值","D":"Cronbach'α系数","E":"因子载荷系数"},"a":"AD","e":"内在一致性常用折半信度和Cronbach α系数；KR-20仅用于二分制条目，重测相关系数反映稳定性，因子载荷系数属结构效度。"},{"i":"2019_10_multi_31","t":"multi","s":"关于效标关联效度的陈述，正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"反映研究工具与其他测量标准之间的关系","B":"体现研究工具与其所测量概念的相符程度","C":"可以判断研究工具是否包括足够的项目","D":"可以判断研究工具所包含内容的分配比例","E":"分为同时效度和预测效度"},"a":"AE","e":"效标关联效度反映研究工具与其他测量标准(效标)之间的关系，按效标收集时间分为同时效度和预测效度；判断项目是否足够、内容分配比例属内容效度。"},{"i":"2019_10_multi_32","t":"multi","s":"某研究者欲比较某市两家医院护理人员学历构成（中专、大专、本科）情况有无差别，可以考虑使用的统计学分析方法有","c":"研究资料的分析方法","sc":2,"o":{"A":"Mann-Whitney U检验","B":"Wilcoxon秩和检验","C":"Pearson相关分析","D":"t检验","E":"χ²检验"},"a":"E","e":"学历构成是计数(频数)资料，比较两家医院学历构成比的差别应做χ²检验；Wilcoxon为配对秩和、t检验用于均数、相关用于两变量关系。"},{"i":"2019_10_multi_33","t":"multi","s":"护理综述论文的特征是","c":"护理论文的撰写","sc":2,"o":{"A":"信息性","B":"新颖性","C":"综合性","D":"描述性","E":"客观性"},"a":"ABCE","e":"护理综述论文的特征为信息性、新颖性、综合性、评述性、客观性。"},{"i":"2019_10_term_35","t":"term","s":"比较性研究","c":"护理研究设计","sc":4,"at":"参考答案（要点）：比较性研究是在自然状态下，对两种或两种以上不同事物、现象或人群进行观察、比较，以找出其异同或分析某因素与现象之间关系的研究，包括队列研究、病例对照研究和现况调查等。","e":""},{"i":"2019_10_term_37","t":"term","s":"重测信度","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：重测信度是用同一研究工具，对同一组研究对象间隔一段时间后重复测量，计算两次测量结果的相关系数，用以反映工具的稳定性。","e":""},{"i":"2019_10_term_38","t":"term","s":"计数资料","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：计数资料又称无序分类资料，是将观察单位按互不相容的类别或属性分组，清点各组观察单位数所得的资料；各类别间无程度顺序，如性别、血型、阳性/阴性。","e":""},{"i":"2019_10_term_39","t":"term","s":"研究指标","c":"确立研究问题","sc":4,"at":"参考答案（要点）：研究指标是研究中用来具体测量研究变量、反映研究目的的项目或因素，即研究中观察、测量的具体条目；选择指标应注意其客观性、准确性、灵敏性和可行性。","e":""},{"i":"2019_10_short_40","t":"short","s":"简述医学文献的阅读策略。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：医学文献阅读的“五先五后”策略：①先读文摘后读原文；②先粗读后精读；③先读综合性文献后读专题性文献；④先读现刊后读过刊；⑤先读中文文献后读外文文献。","e":""},{"i":"2019_10_short_41","t":"short","s":"简述整群抽样的优点。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：整群抽样的优点：①抽样方便、易组织，节省人力、物力和时间；②在抽样框难以获得全部个体时易于实施；③群内个体集中，便于现场调查和管理。缺点是群间差异较大时抽样误差较大。","e":""},{"i":"2019_10_short_42","t":"short","s":"简述统计图中纵轴和横轴的绘制要求。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：①纵轴尺度一般以0为起始点，自下而上数值由小到大；横轴一般自左向右数值由小到大；②纵横轴比例一般为5:7或7:5；③刻度应均匀等距并标明数值；④纵横轴都应标明轴的名称及单位；⑤图号和图题写在图的下方中央。","e":""},{"i":"2019_10_short_43","t":"short","s":"简述护理研究论文结果部分撰写的注意事项。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：结果部分撰写应注意：①按研究内容/逻辑层次分小标题，依次报告；②数据准确、真实，与统计方法相符；③多用统计表、统计图直观表达；④只客观报告结果，不加主观议论和分析推断；⑤结果应与研究目的和假设相呼应。","e":""},{"i":"2019_10_application_44","t":"application","s":"某研究者调查了两所医院护士操作考试情况，总结为如下统计表。请指出在统计表的结构与绘制方面存在的问题，并说明如何改正。（表5-1 两所医院护士情况：含组别、总例数、合格例数与合格率、不合格例数与合格率；医院A总例数48，合格42(87.5%)，不合格6(12.5%)；医院B总例数46，合格38(82.5%)，不合格8(17.39%)；合计94，合格80(85.1%)，不合格14(14.89%)。）","c":"研究资料的分析方法","sc":10,"at":"参考答案（要点）：存在问题及改正：①表题不准确：原题“两所医院护士情况”过于笼统，应改为能说明表中心内容的题目，如“两所医院护士操作考试合格情况比较”。②纵标目设置不合理：“不合格”栏下不应再设“合格率(%)”，不合格栏应为“不合格例数(%)”或“不合格率(%)”，且“合格率”与“不合格率”概念混淆。③线条问题：应采用三线表，顶线、底线和纵标目下分隔线，不应有多余竖线和斜线。④数字与小数点：表中各行小数点后位数应保持一致，如合格率87.5、82.5、85.1为一位小数，12.5、17.39、14.89位数不统一，应统一保留位数。⑤标目排列：主语(医院组别)作横标目、统计指标(例数、率)作纵标目，层次应清晰。","e":""}]},{"key":"2020_08","name":"2020年8月","qs":[{"i":"2020_08_single_1","t":"single","s":"世界上第一篇护理研究报告涉及的研究领域是","c":"绪论","sc":1,"o":{"A":"控制医院内的感染","B":"护理教育","C":"改进护理工作的程序","D":"护士的角色"},"a":"A","e":"南丁格尔写出了控制医院内感染的第一篇研究报告，是护理学研究的开始。"},{"i":"2020_08_single_2","t":"single","s":"研究对象和研究者在研究中建立起来的关系不能被研究者滥用。它所遵循的伦理原则是","c":"绪论","sc":1,"o":{"A":"尊重人的尊严","B":"保护隐私权","C":"免于遭受伤害","D":"不被剥削或利用"},"a":"D","e":"不被剥削或利用的权利要求研究对象不应被当作实验工具、研究者不得滥用与研究对象建立的关系谋利。"},{"i":"2020_08_single_3","t":"single","s":"研究者在开始研究前要对研究可能会给研究对象带来的风险进行评估，下列选项属于“暂时不适的风险”的是","c":"绪论","sc":1,"o":{"A":"参加研究使研究对象感到疲劳","B":"研究对象再次经历不安的感受","C":"新药可能对研究对象造成身体损伤","D":"查阅研究对象的病历"},"a":"A","e":"参加研究使研究对象感到疲劳、焦虑属暂时的不适；再次经历不安属较严重的暂时不适，新药致身体损伤属永久性伤害可能，查阅病历属无可预见的影响。"},{"i":"2020_08_single_4","t":"single","s":"某项护理研究中需要判断患者是否发生了泌尿系感染，研究者采用的是尿培养、膀胱刺激症等作指标，而未选用体温和血常规中的白细胞计数。此时研究者考虑的指标特性是","c":"确立研究问题","sc":1,"o":{"A":"客观性","B":"准确性","C":"灵敏性","D":"可行性"},"a":"C","e":"尿培养、膀胱刺激症能更灵敏、直接地反映泌尿系感染，而体温、白细胞计数不够灵敏、非特异，体现了指标的灵敏性。"},{"i":"2020_08_single_5","t":"single","s":"在数据收集完成后，研究者要识别出数据的错误和遗漏，尽可能改正过来。这个步骤是","c":"研究资料的分析方法","sc":1,"o":{"A":"数据分析","B":"数据编码","C":"数据录入","D":"数据编辑"},"a":"D","e":"数据编辑是资料收集后识别错误和遗漏、并尽可能改正的步骤，以保证资料完整准确。"},{"i":"2020_08_single_6","t":"single","s":"来自临床实践经验以确定研究问题的具体步骤是","c":"确立研究问题","sc":1,"o":{"A":"产生想法-进行探讨-回顾文献-确定变量-形成研究问题","B":"回顾文献-产生想法-进行探讨-确定变量-形成研究问题","C":"进行探讨-产生想法-确定变量-回顾文献-形成研究问题","D":"产生想法-进行探讨-确定变量-回顾文献-形成研究问题"},"a":"A","e":"从临床实践经验确定研究问题的步骤为：产生想法—进行探讨—回顾文献—确定变量—形成研究问题。"},{"i":"2020_08_single_7","t":"single","s":"“压疮问题的探讨”这一选题存在的问题是","c":"确立研究问题","sc":1,"o":{"A":"研究问题不可行","B":"选题范围过大","C":"选题没有结合护理专业","D":"需要花费大量的经费"},"a":"B","e":"“压疮问题的探讨”范围宽泛、不够具体，属选题范围过大。"},{"i":"2020_08_single_8","t":"single","s":"MEDLINE中AU这个字段所代表的含义是","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘","B":"著者地址","C":"著者姓名","D":"文献标识"},"a":"C","e":"AU—Author—著者姓名；AD为著者地址。"},{"i":"2020_08_single_9","t":"single","s":"为减少可能的来自于研究者或受试者主观因素所导致的偏倚，可采用","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"随机化","C":"盲法","D":"预试验"},"a":"C","e":"盲法可使研究者或研究对象不知道分组情况，从而减少主观因素造成的信息性偏倚。"},{"i":"2020_08_single_10","t":"single","s":"按照预先设计的研究方案进行研究，通过观察指标获得数据资料，用科学方法来验证模式或理论，用数字资料来描述结果的研究方法是","c":"护理研究设计","sc":1,"o":{"A":"量性研究","B":"现象学研究","C":"根基理论研究","D":"人种学研究"},"a":"A","e":"量性研究按预先设计方案、用数字资料验证理论、描述结果；现象学、根基理论、人种学均为质性研究。"},{"i":"2020_08_single_11","t":"single","s":"某医院护理部欲对该院内30个病房的护理质量进行调查，拟从中抽取15个病房作为研究样本。护理部先把30个病房以任意顺序编号为1-30，并做成签，充分混合后，从中随机抽取15个签，对这15个签所对应的病房进行护理质量调查，这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"单纯随机抽样","B":"系统抽样","C":"分层抽样","D":"整群抽样"},"a":"A","e":"编号、做签、充分混合后随机抽取，每个个体被抽中机会均等，属单纯随机抽样(抽签法)。"},{"i":"2020_08_single_12","t":"single","s":"最大的优点是省钱、省时的资料收集方法是","c":"资料收集的方法","sc":1,"o":{"A":"问卷调查法","B":"访谈法","C":"观察法","D":"测量法"},"a":"A","e":"问卷调查法可同时调查较多对象、省时省力、费用较低，其最大优点是省钱省时。"},{"i":"2020_08_single_13","t":"single","s":"在访谈时如问“下面我将询问您一些有关……的问题，您可在下列答案中选择您的回答”的访谈类型是","c":"资料收集的方法","sc":1,"o":{"A":"非结构式","B":"开放式","C":"半结构式","D":"结构式"},"a":"D","e":"访谈者按预先设计的固定问题和备选答案提问，属结构式访谈。"},{"i":"2020_08_single_14","t":"single","s":"观察者作为参与者进入观察领域，其活动以参与为主，观察为辅。观察者与被观察者的关系是","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"C","e":"观察性参与者以参与为主、观察为辅，作为参与者进入观察领域。"},{"i":"2020_08_single_15","t":"single","s":"关于重测信度的描述，正确的是","c":"研究工具性能的测定","sc":1,"o":{"A":"反映研究工具的内在一致性","B":"反映研究工具的稳定性","C":"反映研究工具的等同性","D":"反映研究概念的期望性"},"a":"B","e":"重测信度反映研究工具的稳定性；内在一致性、等同性为其他信度类型。"},{"i":"2020_08_single_16","t":"single","s":"护士计划用某量表测量痴呆患者家庭照顾者的照顾体验，该问卷共由40个条目4个分量表组成，分别测量角色冲突、经济负担、躯体负担以及社会活动受限4个概念。此护士在报告量表的内在一致性时，应该","c":"研究工具性能的测定","sc":1,"o":{"A":"报告总量表的内在一致性","B":"报告条目最多的分量表的内在一致性","C":"报告内在一致性最高的分量表","D":"分别报告4个分量表的内在一致性"},"a":"D","e":"该量表4个分量表分别测量不同概念，应分别报告各分量表的内在一致性，而非只报告总量表。"},{"i":"2020_08_single_18","t":"single","s":"某护士进行两变量的相关分析时，发现两变量中其一为计量资料，其一为等级资料，可采用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"Spearman相关分析","B":"Kruskal-Wallis秩和检验","C":"Kendall相关分析","D":"多因素方差分析"},"a":"A","e":"两变量中有一为等级(有序)资料时，应采用Spearman等级相关分析。"},{"i":"2020_08_single_19","t":"single","s":"参考文献撰写格式正确的选项是","c":"护理论文的撰写","sc":1,"o":{"A":"姜晓丽,朱京慈,刘玮琳.临床护理专家综合评价指标体系的构建研究.解放军护理杂志,2005,22(3):1-3.","B":"沈美萍,周文艳,周笑君等.40例I型糖尿病儿童心理行为调查分析.中华护理杂志,2006,41(9),810-812.","C":"梁万年.临床医学研究方法.北京科学技术出版社,2002.132-157","D":"肖顺贞.护理学研究.北京:人民卫生出版社,2006.1-24.第3版."},"a":"A","e":"期刊格式应为：作者.文题[J].刊名,年,卷(期):页码。A格式规范；B期后误用逗号、C缺出版地、D版次位置不当。"},{"i":"2020_08_single_20","t":"single","s":"在撰写护理经验论文时，“临床资料与方法”部分通常不包括","c":"护理论文的撰写","sc":1,"o":{"A":"观察对象的基本特征","B":"疾病诊断标准","C":"护理措施","D":"护理效果"},"a":"D","e":"“临床资料与方法”包括观察对象基本特征、诊断标准和护理措施；护理效果属结果部分。"},{"i":"2020_08_multi_21","t":"multi","s":"下列对于伦理审查委员会组成要求的描述，正确的是","c":"绪论","sc":2,"o":{"A":"至少6名成员组成","B":"需要具有特殊领域的专长","C":"至少1人为非研究机构成员","D":"仅在大学设立","E":"由不同文化、经济、教育、性别和种族背景的人组成"},"a":"BCE","e":"IRB至少5名具有不同背景、特殊领域专长的成员，其中至少1人为非研究机构成员，可在大学、医院及医疗保健中心设立。"},{"i":"2020_08_multi_22","t":"multi","s":"在“体重与血压关系的探讨”这一研究中，属于外变量的是","c":"护理研究的基本程序","sc":2,"o":{"A":"研究对象的性别","B":"研究对象的体重","C":"研究对象的血压","D":"研究对象的情绪状态","E":"血压的测量部位"},"a":"ADE","e":"体重是自变量、血压是因变量；性别、情绪状态、血压测量部位是可能影响血压的外变量。"},{"i":"2020_08_multi_23","t":"multi","s":"属于一次文献的是","c":"医学信息的获取与利用","sc":2,"o":{"A":"期刊论文","B":"索引","C":"综述","D":"研究报告","E":"专利说明书"},"a":"ADE","e":"期刊论文、研究报告、专利说明书等以作者本人研究成果为依据创作的原始文献属一次文献；索引为二次文献，综述为三次文献。"},{"i":"2020_08_multi_24","t":"multi","s":"下列对研究假设的特征描述正确的是","c":"确立研究问题","sc":2,"o":{"A":"变量间关系的陈述","B":"可测量性","C":"文献支持或理论基础","D":"具有方向性","E":"简洁、具体且概念清晰"},"a":"ABCE","e":"假设的特征为：变量间关系的陈述、可测量性、有文献支持或理论基础、简洁具体且概念清晰；方向性是假设的分类(有方向/无方向)而非共同特征。"},{"i":"2020_08_multi_25","t":"multi","s":"从文献的内容特征进行检索的途径是","c":"医学信息的获取与利用","sc":2,"o":{"A":"序号途径","B":"关键词途径","C":"主题途径","D":"分类主题途径","E":"分类途径"},"a":"BCE","e":"从文献内容特征检索的途径包括分类途径、主题途径和关键词途径；序号途径属外表特征途径。"},{"i":"2020_08_multi_26","t":"multi","s":"任何实验性研究的设计都必须具备的内容是","c":"护理研究设计","sc":2,"o":{"A":"干预","B":"盲法","C":"设对照组","D":"完全自然状态","E":"随机化"},"a":"ACE","e":"实验性研究的三要素为干预(施加处理)、设对照组和随机化分组；盲法非必备。"},{"i":"2020_08_multi_27","t":"multi","s":"与实验性研究相比，类实验性研究的优点有","c":"护理研究设计","sc":2,"o":{"A":"反映研究的科学性高","B":"反映研究的客观性高","C":"干预时可行性高","D":"较为实用","E":"不易触犯伦理原则"},"a":"CDE","e":"类实验性研究不强调随机分组和对照，在临床中可行性高、较为实用、不易因强行分组而触犯伦理；其科学性、客观性和证据等级低于实验性研究。"},{"i":"2020_08_multi_28","t":"multi","s":"选择性偏倚可能产生在","c":"护理研究设计","sc":2,"o":{"A":"确定研究样本","B":"选择对照组","C":"研究对象的失访","D":"无应答","E":"研究对象记忆失真"},"a":"ABCD","e":"选择性偏倚产生于研究对象选择阶段，包括确定样本、选择对照、失访、无应答等；记忆失真属信息性偏倚。"},{"i":"2020_08_multi_29","t":"multi","s":"档案记录收集法的优点有","c":"资料收集的方法","sc":2,"o":{"A":"经济","B":"无需研究对象合作","C":"无应答偏差","D":"有选择性","E":"不涉及伦理问题"},"a":"ABCE","e":"档案记录法经济、无需研究对象合作、无应答偏差、一般不涉及伦理问题；有选择性、资料不易完全可得是其缺点。"},{"i":"2020_08_multi_30","t":"multi","s":"关于抽样误差的描述正确的是","c":"研究资料的分析方法","sc":2,"o":{"A":"只要是抽样研究，就必然存在抽样误差","B":"抽样误差是可以通过改进抽样方法而避免的","C":"采取随机抽样的方法可以减少抽样误差","D":"增加样本量到适当水平可以减少抽样误差","E":"选择变异程度小的研究指标可以减少抽样误差"},"a":"ACDE","e":"抽样研究必然存在、不可避免的抽样误差，可通过随机抽样、适当样本量、选择变异小的指标来减少。"},{"i":"2020_08_multi_31","t":"multi","s":"关于同时效度，以下描述正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"是评估人根据自己对所要测量的概念的理解进行判断","B":"可以通过因子分析来反映同时效度","C":"被选作标准工具的性能会影响研究工具的同时效度","D":"研究工具与现有标准的相关系数高，表示同时效度高","E":"当同时效度的相关系数大于或等于0.70，说明研究工具质量较好"},"a":"CDE","e":"同时效度是研究工具与同时收集的效标(标准工具)的相关程度，标准工具性能会影响结果，相关系数高则同时效度高，一般相关系数≥0.70说明工具质量较好；据理解判断是表面效度、因子分析反映结构效度。"},{"i":"2020_08_multi_32","t":"multi","s":"某护士进行计量资料的统计，资料为正态分布，计划比较组间差异，可以采用的统计学方法有","c":"研究资料的分析方法","sc":2,"o":{"A":"两个独立样本t检验","B":"Mann-Whitney U检验进行两个独立样本比较","C":"单因素方差分析进行多个独立样本比较","D":"单样本秩和检验进行单样本与总体比较","E":"Pearson相关分析进行组间比较"},"a":"AC","e":"正态分布计量资料比较组间差异：两样本用t检验，多样本用单因素方差分析；秩和检验用于非正态资料，相关分析用于两变量关系而非组间比较。"},{"i":"2020_08_multi_33","t":"multi","s":"下列对综述中引用参考文献的基本原则的描述，正确的是","c":"护理论文的撰写","sc":2,"o":{"A":"选用知名学者发表的文献","B":"尽量引用二次文献","C":"尽量选用核心期刊发表的文献","D":"必须是作者亲自阅读的文献","E":"鼓励引用专科书的资料"},"a":"ACD","e":"综述应引用作者亲自阅读的、知名学者和核心期刊发表的较新文献；不宜引用二次文献和专科书资料。"},{"i":"2020_08_term_36","t":"term","s":"访谈法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：访谈法是研究者通过与研究对象口头交谈、询问，向研究对象收集资料的方法，按结构可分为结构式、半结构式和非结构式访谈；其优点是应答率高、资料完整丰富，缺点是费时、花费大、影响因素多。","e":""},{"i":"2020_08_term_38","t":"term","s":"假设检验","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：假设检验又称显著性检验，是根据研究目的，先对总体的参数或分布作出某种假设，再用样本信息检验该假设是否成立，从而判断样本统计量之间的差异是由抽样误差还是本质差异所致的统计推断方法。","e":""},{"i":"2020_08_term_39","t":"term","s":"摘要","c":"护理论文的撰写","sc":4,"at":"参考答案（要点）：摘要是论文内容高度概括的简短陈述，应概括研究目的、方法、结果和结论，一般200~300字，不加注释、不引用文献，使读者快速了解论文要点。","e":""},{"i":"2020_08_short_40","t":"short","s":"简述阅读医学文献的一般程序。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：阅读医学文献的一般程序：①先读主题内容简介、摘要或序言，了解概况；②再读目录、章节标题，摸清整体结构；③然后逐节阅读正文，抓住核心观点；④重点精读结论、讨论部分；⑤阅读时作笔记、批注，结合思考提出问题。","e":""},{"i":"2020_08_short_41","t":"short","s":"在确定量性研究中的科研设计类型时，研究者可以自我询问哪些问题，以更加明确欲选择的科研设计类型？","c":"护理研究设计","sc":5,"at":"参考答案（要点）：可自我询问：①研究目的是描述现况、分析变量间关系，还是检验因果假设？②是否需要对研究对象施加干预？③研究对象是否随机分组、有无设立对照？④是在自然状态下观察还是实验条件下研究？⑤研究是回顾性还是前瞻性、追踪观察还是一次性调查？据此判断属实验性、类实验性还是非实验性(描述性/比较性)研究。","e":""},{"i":"2020_08_short_42","t":"short","s":"简述线图绘制时的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：线图绘制注意事项：①纵轴表示指标数值、一般以0为起点，横轴表示连续变量(如时间、年龄)；②纵横轴比例一般5:7或7:5；③同一图内不同曲线用不同线型或颜色区分，并附图例；④图号图题写在图下方中央；⑤线图适用于某指标随连续变量变化的趋势。","e":""},{"i":"2020_08_short_43","t":"short","s":"简述护理个案论文的正文写作格式。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：护理个案论文正文一般按护理程序思路撰写，包括：①前言(病例简介、选题理由)；②健康评估(护理体检与评估)；③护理诊断；④护理计划与实施；⑤效果评价；⑥讨论与小结。","e":""},{"i":"2020_08_application_44","t":"application","s":"请根据统计表的绘制原则，指出下面统计表中绘制不正确的地方并重新绘制正确的表格。（表1 某基层医院医师和护士论文发表情况：行：核心期刊(护士例数7、百分比5.8%；医师例数21、百分比17.5%)、非核心期刊(护士例数12、百分比10%；医师例数27、百分比22.5%)；纵标目为期刊类别、护士(例数/百分比)、医师(例数/百分比)。）","c":"研究资料的分析方法","sc":10,"at":"参考答案（要点）：存在问题及改正：①百分比口径错误：各百分比应分别以护士总数、医师总数为分母计算，不能简单并列，原表5.8%、10%、17.5%、22.5%分母不统一，应统一为护士论文总数、医师论文总数分别计算构成比。②标题不规范：应改为能说明表中心内容的题目，如“某基层医院医师与护士核心期刊论文发表构成比较”。③线条：应采用三线表，去除多余竖线和斜线。④纵标目层次：应把“护士”“医师”作为分组，其下再分“例数”“百分比(%)”，层次清晰。⑤小数点后位数应统一。重新绘制：横标目为核心期刊、非核心期刊及合计；纵标目为护士(例数、%)、医师(例数、%)，分别以护士、医师论文总数为分母计算百分比。","e":""}]},{"key":"2020_10","name":"2020年10月","qs":[{"i":"2020_10_single_1","t":"single","s":"美国早期的护理研究大多是关于","c":"绪论","sc":1,"o":{"A":"护理管理方面","B":"临床护理方面","C":"护理教育方面","D":"医院感染控制方面"},"a":"C","e":"早期(20世纪20年代)国外护理研究大多围绕护理教育方面，侧重如何加强护理教育。"},{"i":"2020_10_single_2","t":"single","s":"1920年出版的中国第一本护理专业刊物的名称是","c":"绪论","sc":1,"o":{"A":"护理杂志","B":"中华护士季报","C":"护士季报","D":"中华护理杂志"},"a":"C","e":"1920年1月出版中国第一本护理专业刊物《护士季报》(中英文对照)，后改名《中华护士季报》。"},{"i":"2020_10_single_3","t":"single","s":"IRB的成员数目至少应达到","c":"绪论","sc":1,"o":{"A":"11人","B":"9人","C":"7人","D":"5人"},"a":"D","e":"每个伦理审查委员会(IRB)至少包括5名具有不同背景的成员。"},{"i":"2020_10_single_4","t":"single","s":"按照时间的顺序，由远及近地利用检索系统进行文献信息检索的方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"循环法","B":"顺查法","C":"倒查法","D":"抽查法"},"a":"B","e":"顺查法是按时间顺序由远及近、从早期逐年查到近期的检索方法。"},{"i":"2020_10_single_5","t":"single","s":"王护士在进行一项关于“不同的宣教方法对宣教效果影响”的研究，这个研究中的自变量是","c":"护理研究的基本程序","sc":1,"o":{"A":"宣教方法","B":"宣教效果","C":"宣教环境","D":"宣教时间"},"a":"A","e":"研究者主动安排、施加的不同宣教方法是自变量；宣教效果是因变量。"},{"i":"2020_10_single_6","t":"single","s":"在研究中用血氧饱和度作为观察机体缺氧程度的指标，而不是用呼吸和面色来作为判断标准，这体现了指标的","c":"确立研究问题","sc":1,"o":{"A":"准确性","B":"客观性","C":"灵敏性","D":"可行性"},"a":"C","e":"血氧饱和度比呼吸、面色改变更灵敏地反映缺氧，体现指标的灵敏性。"},{"i":"2020_10_single_7","t":"single","s":"“对两个或两个以上的概念之间所存在的某种关系的阐述”被称为","c":"确立研究问题","sc":1,"o":{"A":"框架","B":"理论","C":"命题","D":"概念模式"},"a":"C","e":"命题是对两个或两个以上概念之间所存在关系的阐述。"},{"i":"2020_10_single_8","t":"single","s":"MEDLINE中AB这一缩写代表的字段含义是","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘","B":"著者地址","C":"著者姓名","D":"文摘标识"},"a":"A","e":"AB—Abstract—文摘。"},{"i":"2020_10_single_9","t":"single","s":"下列关于量性研究和质性研究的描述错误的是","c":"护理研究设计","sc":1,"o":{"A":"两者本质区别在于其各自建立在不同的哲学观和认识事物的方法上","B":"量性研究建立在实证主义的哲学观基础上","C":"质性研究建立在诠释主义或批判主义的哲学观基础上","D":"量性研究者认为对事物的认识只有在特定的情形中才有意义，不是唯一的"},"a":"D","e":"认为对事物的认识只有在特定情形中才有意义、不是唯一的，是质性研究的观点；量性研究追求客观、普遍、唯一的规律。"},{"i":"2020_10_single_10","t":"single","s":"下列的概率抽样方法中最基本的方法是","c":"护理研究设计","sc":1,"o":{"A":"系统抽样","B":"单纯随机抽样","C":"整群抽样","D":"分层抽样"},"a":"B","e":"单纯随机抽样是概率抽样中最基本的方法，其他抽样方法在此基础上发展而来。"},{"i":"2020_10_single_11","t":"single","s":"在研究过程中由于研究对象记忆不完整所导致资料准确性受到影响，此时的偏倚是","c":"护理研究设计","sc":1,"o":{"A":"选择性偏倚","B":"信息性偏倚","C":"混杂性偏倚","D":"无应答偏倚"},"a":"B","e":"研究对象回忆(记忆)不完整导致资料不准确，属信息性偏倚中的回忆偏倚。"},{"i":"2020_10_single_12","t":"single","s":"访谈问题的设计原则是","c":"资料收集的方法","sc":1,"o":{"A":"从广泛、普遍的问题开始，逐步过渡到具体的、敏感的问题","B":"在正式通过会谈法收集资料之前，必须对研究人员进行培训","C":"采用通俗易懂的语言","D":"将研究目的、程序及保密原则向研究对象做适当的解释"},"a":"A","e":"访谈问题应从广泛、普遍、易答的问题开始，逐步过渡到具体、敏感的问题，以利于访谈顺利进行。"},{"i":"2020_10_single_13","t":"single","s":"观察者隔着单面透视玻璃，用录像等方法进行观察。此时观察者的角色为","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"A","e":"局外观察者经介绍进入观察领域但不参与被观察者活动，可隔着单面透视玻璃、用录像观察，可使被观察者行为自然。"},{"i":"2020_10_single_14","t":"single","s":"下列关于收集资料的描述错误的是","c":"资料收集的方法","sc":1,"o":{"A":"资料可来源于现有资料和新收集的资料","B":"某些历史性研究可从现有的资料收集","C":"对现有资料可直接应用，不用评估和分析其价值、准确性","D":"利用现有资料的方法具有省时、省力、经济的特点，但应根据研究目的而定"},"a":"C","e":"对现有资料仍需评估分析其价值和准确性，不能直接套用；其余描述均正确。"},{"i":"2020_10_single_15","t":"single","s":"常用来表示研究工具的稳定性的是","c":"研究工具性能的测定","sc":1,"o":{"A":"同时效度","B":"预测效度","C":"重测信度","D":"折半信度"},"a":"C","e":"重测信度反映研究工具的稳定性；折半信度反映内在一致性。"},{"i":"2020_10_single_16","t":"single","s":"根据理论基础及实践经验来对工具是否包括足够的项目而且有恰当的内容分配比例所做出的判断是","c":"研究工具性能的测定","sc":1,"o":{"A":"表面效度","B":"内容效度","C":"结构效度","D":"校标关联效度"},"a":"B","e":"内容效度判断研究工具是否包括足够的项目、内容分配比例是否恰当，需根据理论和实践经验经专家评议。"},{"i":"2020_10_single_17","t":"single","s":"满意度（非常满意、一般、不满意）属于","c":"研究资料的分析方法","sc":1,"o":{"A":"计量资料","B":"定量资料","C":"计数资料","D":"等级资料"},"a":"D","e":"满意度按程度顺序(非常满意>一般>不满意)分组，属等级(有序分类)资料。"},{"i":"2020_10_single_18","t":"single","s":"适用于3组或3组以上独立样本的均数比较的统计推断方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"t检验","B":"秩和检验","C":"方差分析","D":"关联性分析"},"a":"C","e":"3组及以上独立样本均数比较用单因素方差分析；t检验仅用于两组。"},{"i":"2020_10_single_19","t":"single","s":"张护士正在撰写一篇护理经验论文，她欲介绍“护理效果判断的标准”，这部分内容应属于护理经验论文中的","c":"护理论文的撰写","sc":1,"o":{"A":"前言","B":"临床资料与方法","C":"结果/护理效果","D":"讨论与分析"},"a":"B","e":"护理效果判断的标准属研究方法/评价方法部分，应写入“临床资料与方法”。"},{"i":"2020_10_single_20","t":"single","s":"国内期刊要求文献综述中所引用的近3年发表过的文献应占到引用文献总数的","c":"护理论文的撰写","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"C","e":"国内期刊一般要求综述引用近3年文献占引用文献总数的70%以上。"},{"i":"2020_10_multi_22","t":"multi","s":"《贝尔蒙报告》中强调，以人为研究对象的研究中应遵循的基本伦理原则有","c":"绪论","sc":2,"o":{"A":"有益的原则","B":"风险评估的原则","C":"知情同意的原则","D":"尊重人的尊严的原则","E":"公正的原则"},"a":"ADE","e":"《贝尔蒙报告》强调的三项基本伦理原则为尊重人(尊严)的原则、有益的原则和公正的原则。"},{"i":"2020_10_multi_23","t":"multi","s":"下列选项中属于“暂时的不适”这类研究风险的有","c":"绪论","sc":2,"o":{"A":"因填写问卷造成研究对象疲劳","B":"因回答某些问题造成研究对象窘迫","C":"研究中查阅研究对象的病例","D":"新药对研究对象可能造成的永久的身体上的损伤","E":"质性访谈中使研究对象再次经历恐惧等短时间内难以恢复的感受"},"a":"AB","e":"填写问卷疲劳、回答问题窘迫属暂时的不适；查阅病例属无可预见的影响，新药永久损伤属永久性伤害，再次经历恐惧短时间难恢复属较严重的暂时不适。"},{"i":"2020_10_multi_24","t":"multi","s":"下列研究中选题不恰当的有","c":"确立研究问题","sc":2,"o":{"A":"对综合医院护士长准入标准的探讨","B":"对影响护士在静脉穿刺时手套使用情况的探讨","C":"探讨急诊科患者的心理护理","D":"中西医结合治疗结石病的疗效观察","E":"对进行体温测试的时间选择的研究"},"a":"CD","e":"“探讨急诊科患者的心理护理”范围过大，“中西医结合治疗结石病的疗效观察”不够明确，均为不恰当选题；其余题目具体、范围适当。"},{"i":"2020_10_multi_25","t":"multi","s":"下列对阅读策略的描述，正确的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"先读与主题内容相关的外文文献，后读中文文献","B":"先粗读，再精读","C":"先读现刊文献，再读过刊文献","D":"先读文摘后读原文","E":"先读综合性文献，后读专题性文献"},"a":"BCDE","e":"阅读五先五后：先读文摘后读原文、先粗读后精读、先综合后专题、先现刊后过刊、先中文后外文；A顺序颠倒。"},{"i":"2020_10_multi_26","t":"multi","s":"下列属于回顾性研究的有","c":"护理研究设计","sc":2,"o":{"A":"既往吸烟史与肺癌发病率的研究","B":"既往的饮食方式与食道癌发病率的研究","C":"观察正常老年人的认知功能随年龄的增长而变化的情况","D":"追踪观察不同的生活方式对人群健康的影响","E":"观察不同职业对人群健康的影响"},"a":"AB","e":"回顾既往暴露(吸烟史、饮食方式)与现患疾病关系的研究属回顾性(病例对照)研究；随年龄追踪、追踪生活方式影响属前瞻性队列研究。"},{"i":"2020_10_multi_27","t":"multi","s":"在吸烟与肺癌关系的病例对照研究中，常见的混杂因素有","c":"护理研究设计","sc":2,"o":{"A":"年龄、性别","B":"社会经济状况、婚姻状况","C":"疾病的严重程度","D":"患病的持续时间","E":"药物或治疗的依从性"},"a":"AB","e":"吸烟与肺癌病例对照研究中，年龄、性别、社会经济状况、婚姻状况等与吸烟和肺癌均相关，是常见混杂因素。"},{"i":"2020_10_multi_28","t":"multi","s":"问卷编制时应事先考虑的问题有","c":"资料收集的方法","sc":2,"o":{"A":"指导语","B":"问题的类型","C":"问卷的内容、用词","D":"问卷答案的设计","E":"问卷的发放形式"},"a":"ABCD","e":"编制问卷应事先考虑问题类型、内容与用词、答案设计和指导语等；发放形式属实施环节。"},{"i":"2020_10_multi_29","t":"multi","s":"问卷调查法的优点有","c":"资料收集的方法","sc":2,"o":{"A":"省钱","B":"省时","C":"回收率高","D":"适合于不易被测量的情形","E":"获得深入细致的研究资料"},"a":"AB","e":"问卷调查法省钱、省时；其缺点是回收率较低、资料不够深入；获得深入资料是访谈法的优点。"},{"i":"2020_10_multi_30","t":"multi","s":"下列对研究工具的信效度的描述，正确的有","c":"研究工具性能的测定","sc":2,"o":{"A":"只要研究工具存在，就势必有它的信度和效度","B":"研究工具的信度和效度不是“有”或“无”的问题","C":"研究工具的信度和效度是程度上的“高”或“低”的问题","D":"信度低的工具效度肯定不高","E":"信度高的工具效度肯定高"},"a":"BCD","e":"信度和效度不是有无问题，而是程度高低问题；信度低则效度必低，但信度高效度未必高。"},{"i":"2020_10_multi_31","t":"multi","s":"统计描述常使用的统计指标有","c":"研究资料的分析方法","sc":2,"o":{"A":"均数","B":"中位数","C":"标准差","D":"t检验","E":"卡方检验"},"a":"ABC","e":"均数、中位数、标准差是统计描述指标；t检验、卡方检验属统计推断方法。"},{"i":"2020_10_multi_32","t":"multi","s":"Spearman相关分析的适用条件包括","c":"研究资料的分析方法","sc":2,"o":{"A":"两变量均为计量资料且服从正态分布","B":"两变量中其一为计量资料，其一为等级资料","C":"两变量均为等级资料","D":"两变量均为计数资料","E":"两变量虽为计量资料但不服从正态分布"},"a":"BCE","e":"Spearman等级相关适用于：两变量均为等级资料、或其一为等级另一为计量、或计量资料但不服从正态分布；两计量正态资料用Pearson相关。"},{"i":"2020_10_term_34","t":"term","s":"知识","c":"医学信息的获取与利用","sc":4,"at":"参考答案（要点）：知识是人们在改造世界的实践中所获得的认识和经验的总和，是对客观事物及其规律的反映，包括自然科学知识、社会科学知识和思维科学知识，可通过信息的加工、整理和综合而获得。","e":""},{"i":"2020_10_term_35","t":"term","s":"盲法","c":"护理研究设计","sc":4,"at":"参考答案（要点）：盲法是在研究过程中，使研究对象和(或)资料收集、观察者不知道研究对象的分组情况，以减少主观因素造成信息性偏倚的方法，分单盲、双盲和三盲。","e":""},{"i":"2020_10_term_37","t":"term","s":"内在一致性","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：内在一致性是信度的一种，指研究工具中各条目之间是否测量同一概念、结果是否一致，常用折半信度、Cronbach α系数和KR-20值来反映。","e":""},{"i":"2020_10_term_38","t":"term","s":"直条图","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：直条图是用等宽直条的长短来表示各独立类别指标数值大小的统计图，适用于彼此相互独立的分类资料，分单式直条图和复式直条图。","e":""},{"i":"2020_10_short_40","t":"short","s":"简述知情同意具有的特点。","c":"绪论","sc":5,"at":"参考答案（要点）：知情同意的特点：①知情：研究者应向研究对象充分说明研究的目的、方法、益处、风险及自愿参加、随时退出等；②同意：研究对象在充分理解的基础上自主作出同意的决定；③自愿：同意必须是研究对象自愿作出，不受胁迫或不正当影响；④书面：一般以签署知情同意书的形式固定。","e":""},{"i":"2020_10_short_42","t":"short","s":"简述统计表绘制的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：绘制统计表应注意：①重点突出：一个表以表达一个中心内容为宜；②层次清楚：主语、宾语分别作横标目和纵标目；③简洁明了：采用三线表，文字、数字、线条从简，去除竖线斜线；④数字小数点后位数一致，缺失用“…”、无数字用“——”；⑤表题写在表上方中央，与文字描述结合使用。","e":""},{"i":"2020_10_short_43","t":"short","s":"简述护理个案研究的步骤。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：护理个案研究的步骤：①选定研究对象(有代表性的特殊病例)；②收集个案的全面资料(病史、体检、护理过程等)；③对资料进行整理、分析和解释；④制定和实施护理计划与措施；⑤评价护理效果并进行讨论、得出结论。","e":""},{"i":"2020_10_application_44","t":"application","s":"采用研究者构建的高血压患者健康教育方案对原发性高血压患者进行健康教育研究并评价方案的效果。研究者采用随机分组法，将高血压患者分为实验组、对照组各60例。实验组采用研究者构建的健康教育方案进行健康宣教，对照组采用常规健康教育方法，教育前后对两组患者采用高血压知识问卷调查患者的知识水平。请问：（1）本研究采用的科研设计类型是什么？（2）采用的资料收集方法是什么？（3）研究者推断“健康教育方案对提高病人有关高血压的知识水平是否有效”时，应使用什么统计方法？","c":"护理研究设计","sc":10,"at":"参考答案（要点）：（1）科研设计类型：实验性研究。因为对研究对象随机分组、设立对照组、并施加了研究者构建的健康教育方案这一干预措施。（2）资料收集方法：问卷调查法(采用高血压知识问卷调查两组患者教育前后的知识水平)。（3）统计方法：对两组患者教育前后知识得分(正态分布计量资料)的比较，若比较两组教育后知识得分或两组得分变化值，采用两独立样本t检验；若同时考虑教育前后及组间的交互作用，可采用两因素(重复测量)方差分析。","e":""}]},{"key":"2021_4","name":"2021年4月","qs":[{"i":"2021_4_single_1","t":"single","s":"判断研究是否符合道德伦理的第一标准是","c":"绪论","sc":1,"o":{"A":"知情同意","B":"利益评估","C":"风险评估","D":"保密"},"a":"A","e":"知情同意已成为判断研究是否符合道德伦理的第一标准，其源于1946年《纽伦堡法典》。"},{"i":"2021_4_single_2","t":"single","s":"在研究中被研究者需要花费额外的时间来参加研究，此时的研究风险是","c":"绪论","sc":1,"o":{"A":"无可预见的影响","B":"暂时的不适","C":"较严重的暂时不适","D":"永久性伤害的可能"},"a":"B","e":"要求研究对象填写问卷、参与面谈或花费额外时间精力，所造成的疲劳、焦虑等随研究结束即消失，属最小风险，为暂时的不适。"},{"i":"2021_4_single_3","t":"single","s":"在体重与血压关系的研究中，体重是","c":"护理研究的基本程序","sc":1,"o":{"A":"因变量","B":"外变量","C":"无关变量","D":"自变量"},"a":"D","e":"体重是研究者拟探讨其变化是否影响血压的因素，是研究问题的“因”，即自变量；血压为因变量。"},{"i":"2021_4_single_5","t":"single","s":"美国早期的护理研究大多关注","c":"绪论","sc":1,"o":{"A":"护理教育","B":"护患关系","C":"护理人员安排","D":"护士的角色"},"a":"A","e":"20世纪20年代初期美国早期护理研究大多是关于护理教育方面，侧重如何加强护理教育。"},{"i":"2021_4_single_6","t":"single","s":"下列对于伦理审查委员会构成特点的描述正确的是","c":"绪论","sc":1,"o":{"A":"需要包括至少7名成员","B":"所有成员必须来自研究机构","C":"成员需要具有特殊领域的专长","D":"伦理委员会仅限于在大学和医院设立"},"a":"C","e":"IRB至少由5名具有不同背景成员组成，至少1人为非研究机构成员，成员需具有特殊领域专长，可在大学、医院及医疗保健中心设立。"},{"i":"2021_4_single_8","t":"single","s":"在MEDLINE数据库中代表著者地址的字段缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AU","B":"AD","C":"TI","D":"AB"},"a":"B","e":"AD—Address of Author—著者地址；AU为著者姓名，TI为篇名，AB为文摘。"},{"i":"2021_4_single_9","t":"single","s":"在“糖尿病同伴教育对于糖尿病患者足部护理行为的影响”的研究中，“同伴教育”是一个","c":"护理研究设计","sc":1,"o":{"A":"对照","B":"干预","C":"随机","D":"盲法"},"a":"B","e":"同伴教育是研究者人为施加的处理因素（自变量），即干预措施；足部护理行为是随干预变化的因变量。"},{"i":"2021_4_single_10","t":"single","s":"在一个特定的领域获得研究对象有关特征的研究是","c":"护理研究设计","sc":1,"o":{"A":"描述性研究","B":"相关性研究","C":"类实验性研究","D":"实验性研究"},"a":"A","e":"描述性研究是在特定领域获得研究对象特征的研究，常见现况调查和纵向研究。"},{"i":"2021_4_single_11","t":"single","s":"研究者根据自己的专业知识和经验以及对调查总体的了解，有意识地选择某些研究对象，这是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"理论抽样"},"a":"C","e":"目的抽样（立意抽样）是凭研究者专业知识、经验和对总体的了解，有意识地选择对问题非常了解或典型的对象。"},{"i":"2021_4_single_12","t":"single","s":"主要评定人们对某一概念（如目前的护理模式、患者的情感等）的态度，一般由两个反义词形容，5-7个等级组成的量表是","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"C","e":"语义差异量表由Osgood等于1957年设计，由两个反义形容词、5～7个等级组成，要求被评者指出目前所处位置。"},{"i":"2021_4_single_13","t":"single","s":"邮寄法问卷发放的范围较广，但回收率较低，一般认为较为满意的回收率在","c":"资料收集的方法","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"B","e":"邮寄问卷一般回收率60%以上较满意，低于60%时需慎重考虑研究的有效性。"},{"i":"2021_4_single_14","t":"single","s":"根据不同人群的健康状况特点，护士会对一些疾病进行调查和随访，并记录相关资料，这是","c":"资料收集的方法","sc":1,"o":{"A":"疾病报告","B":"医疗、护理服务工作记录","C":"健康检查资料","D":"专题疾病的调查"},"a":"D","e":"专题疾病的调查指如对老年人高血压、心脏病、糖尿病等按人群特点进行的追踪调查。"},{"i":"2021_4_single_15","t":"single","s":"重测信度反映研究工具的","c":"研究工具性能的测定","sc":1,"o":{"A":"内在一致性","B":"等同性","C":"内在属性","D":"稳定性"},"a":"D","e":"重测信度即用同一工具两次或多次测定同一研究对象，反映工具的稳定性。"},{"i":"2021_4_single_16","t":"single","s":"关于同时效度，下列描述正确的是","c":"研究工具性能的测定","sc":1,"o":{"A":"是校标关联效度的一种","B":"指测量工具作为未来情况预测指标的有效程度","C":"由评估人根据自己对所要测量概念的理解进行判断","D":"指工具与其所依据理论或概念框架的相结合程度"},"a":"A","e":"同时效度是效标关联效度的一种，指工具与现有标准之间的相关；B为预测效度，C为表面效度，D为结构效度。"},{"i":"2021_4_single_17","t":"single","s":"某研究资料将职业分为工人、农民、干部、其他，此资料属于","c":"研究资料的分析方法","sc":1,"o":{"A":"有序分类资料","B":"定量资料","C":"无序分类资料","D":"半定量资料"},"a":"C","e":"职业（工人/农民/干部）为互不相容、无程度顺序的类别，构成计数资料，即无序分类资料。"},{"i":"2021_4_single_18","t":"single","s":"在统计表中，缺失数字的表示方式是","c":"研究资料的分析方法","sc":1,"o":{"A":"…","B":"—","C":"/","D":"X"},"a":"A","e":"统计表中数字一律用阿拉伯数字，数值为0记“0”、缺失用“…”、无数字用“——”。"},{"i":"2021_4_single_19","t":"single","s":"护理研究论文基本属性中最重要的特征是","c":"护理论文的撰写","sc":1,"o":{"A":"思想性","B":"创新性","C":"可读性","D":"科学性"},"a":"D","e":"科学性指科技成果客观、真实与严密的程度，是护理研究论文基本属性中最重要的，是科研论文的根本和生命。"},{"i":"2021_4_single_20","t":"single","s":"下列对护理个案论文的描述正确的是","c":"护理论文的撰写","sc":1,"o":{"A":"属于质性研究的一种","B":"针对一组护理案例的资料进行研究","C":"不用必须按照护理程序的思路撰写","D":"研究结果可以大规模推广"},"a":"A","e":"个案研究是针对个案护理资料进行研究，属质性研究的一种；须按护理程序思路撰写，针对少量样本深入分析，结果较难大规模推广。"},{"i":"2021_4_multi_21","t":"multi","s":"护理研究的实施阶段要完成的研究步骤包括","c":"护理研究的基本程序","sc":2,"o":{"A":"形成假设","B":"预试验","C":"资料收集与处理","D":"资料分析","E":"论文撰写"},"a":"BCD","e":"实施阶段要完成预试验、资料收集与处理、资料分析；形成假设属准备阶段，论文撰写属结果交流与传播阶段。"},{"i":"2021_4_multi_22","t":"multi","s":"下列选项中选题范围过大的题目有","c":"确立研究问题","sc":2,"o":{"A":"压疮问题的探讨","B":"探讨高血压患者的心理护理","C":"病情观察的探讨","D":"社会支持与癌症患者生活质量的相关性研究","E":"昏迷患者压疮发生率与翻身次数关系的探讨"},"a":"ABC","e":"“压疮问题的探讨”“病情观察的探讨”过于宽泛，“高血压患者的心理护理”范围偏大；D、E对象目的具体明确。"},{"i":"2021_4_multi_23","t":"multi","s":"下列有关研究假设的描述正确的有","c":"确立研究问题","sc":2,"o":{"A":"假设是关于两个变量之间关系的陈述","B":"每个研究都一定会有假设","C":"研究假设可以分为有方向性假设和无方向性假设","D":"无效假设也叫统计学假设","E":"假设的形成一定要有文献支持或理论基础"},"a":"ACDE","e":"探索性、描述性研究及质性研究多采用研究问题而不用假设，故B错；其余各项均为研究假设的正确描述。"},{"i":"2021_4_multi_24","t":"multi","s":"下列选项中属于一次文献的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"综述","B":"期刊论文","C":"学位论文","D":"年鉴","E":"教科书"},"a":"BC","e":"一次文献即原始文献，如期刊论文、学位论文、会议论文、研究报告；综述、教科书、年鉴属三次文献。"},{"i":"2021_4_multi_25","t":"multi","s":"下列有关阅读文献策略的描述中不正确的选项有","c":"医学信息的获取与利用","sc":2,"o":{"A":"先读原文，后读文摘","B":"先粗读，后精读","C":"先读现刊文献，后读过刊文献","D":"先读专题性文献，后读综合性文献","E":"先读主题内容相同的英文文献，后读中文文献"},"a":"ADE","e":"阅读五先五后策略：先读文摘后读原文、先粗读后精读、先读综合性文献后读专题性文献、先读现刊后读过刊、先读中文文献后读外文文献。故A、D、E不正确。"},{"i":"2021_4_multi_26","t":"multi","s":"任何实验性研究中都必须具备","c":"护理研究设计","sc":2,"o":{"A":"干预","B":"双盲","C":"单盲","D":"设立对照","E":"随机化"},"a":"ADE","e":"任何实验性研究都必须具备干预、设立对照、随机化三项基本内容；盲法不是必备条件。"},{"i":"2021_4_multi_27","t":"multi","s":"根据研究目的，可以将比较性研究分为","c":"护理研究设计","sc":2,"o":{"A":"病例对照研究","B":"相关性研究","C":"描述性研究","D":"队列研究","E":"现况调查"},"a":"AD","e":"比较性研究分病例对照研究（回顾性，由果查因）和队列研究（前瞻性，按暴露追踪结局）。"},{"i":"2021_4_multi_28","t":"multi","s":"在自设问卷时，问卷的用词要求包括","c":"资料收集的方法","sc":2,"o":{"A":"清晰","B":"适合被问者的文化程度","C":"增加提示语","D":"尽量减少偏差","E":"处理敏感问题和个人资料的关系"},"a":"ABDE","e":"问卷用词要求：清晰、适合被问者文化程度、尽量减少偏差、处理好敏感问题和个人资料；“增加提示语”非用词要求。"},{"i":"2021_4_multi_29","t":"multi","s":"访谈法的优点有","c":"资料收集的方法","sc":2,"o":{"A":"应答率较高","B":"节省时间","C":"花费较小","D":"适合于不能填写问卷的研究对象","E":"所获资料较为完整、丰富"},"a":"ADE","e":"访谈法优点为应答率较高、适合不能填写问卷者、所获资料较完整丰富；缺点是费时、花费大。"},{"i":"2021_4_multi_30","t":"multi","s":"能够表示某一研究工具真正反映它所期望研究的概念的程度的有","c":"研究工具性能的测定","sc":2,"o":{"A":"表面效度","B":"折半信度","C":"内容效度","D":"重测信度","E":"结构效度"},"a":"ACE","e":"效度指工具真正反映其所期望研究概念的程度，表达形式有表面效度、内容效度、效标关联效度、结构效度；折半信度、重测信度属信度。"},{"i":"2021_4_multi_31","t":"multi","s":"关于抽样误差，下列描述正确的有","c":"研究资料的分析方法","sc":2,"o":{"A":"由于样本的偶然性而出现的样本指标与总体指标之间的差异","B":"增加样本量到适当水平可以减少抽样误差","C":"选择变异程度大的研究指标可以减少抽样误差","D":"尽可能采取随机抽样的方法可以减少抽样误差","E":"抽样研究可以通过适当的方法避免抽样误差"},"a":"ABD","e":"降低抽样误差应采取随机抽样、增加样本量到适当水平、选择变异程度小的指标；抽样误差无法避免，故C、E错。"},{"i":"2021_4_multi_32","t":"multi","s":"某研究资料为正态分布的计量资料，进行组间差异比较，下列描述正确的有","c":"研究资料的分析方法","sc":2,"o":{"A":"Wilcoxon符号秩和检验进行配对资料的比较","B":"配对t检验进行配对资料的比较","C":"单样本t检验进行单样本与总体的比较","D":"单样本秩和检验进行单样本与总体的比较","E":"Mann-Whitney U检验进行两个独立样本的比较"},"a":"BC","e":"正态分布计量资料均数比较用t检验（单样本、两独立样本、配对）；Wilcoxon符号秩和、Mann-Whitney U等秩和检验适用于偏态或等级资料，故A、D、E错。"},{"i":"2021_4_multi_33","t":"multi","s":"下列有关文题撰写要求的描述正确的有","c":"护理论文的撰写","sc":2,"o":{"A":"文题应新颖","B":"文题中不能使用副标题","C":"文题中的医学名词要规范","D":"文题不能太长，一般不超过20个汉字为宜","E":"文题中尽量使用简称和缩写"},"a":"ACD","e":"文题要求新颖、切题、简明（一般不超过20个汉字）、规范；必须长时可用破折号加副标题，尽量不用简称缩写，故B、E错。"},{"i":"2021_4_term_36","t":"term","s":"结构式观察法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：结构式观察法是指有已设计好的正式记录格式，事先确定观察样本和观察项目、设计记录表格，并对观察内容准确分类、记录编码的观察方法。","e":""},{"i":"2021_4_short_40","t":"short","s":"简述研究问题的来源。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：研究问题主要来自理论、实践、文献或他人建议。①主要从护理实践和日常工作中发现问题（临床实践经验）；②来自对科研文献的审慎评价、弥补文献的缺陷；③来自研究者个人兴趣及对未经验证理论的兴趣；④可受他人研究的启发；⑤来自目前或未来需要探讨的问题。","e":""},{"i":"2021_4_short_41","t":"short","s":"简述类实验性研究的优点和局限性。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：优点：进行人群干预研究时可行性高、较为实用，不易触犯伦理原则。局限性：有时无法随机取样分组，已知和未知干扰因素不能像实验性研究那样随机均衡分布；无对照组的设计（自身前后对照、时间连续性设计）效果更难完全归因于干预，结果可信度不如实验性研究。","e":""},{"i":"2021_4_short_42","t":"short","s":"简述统计表中线条绘制的要求。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：统计表线条应从简。简单表一般只画三条线：顶线、底线以及标目与数字之间的分界线；组合表可另加分层线，必要时可有合计线；不应画竖线、斜线和多余的横线（即三线表）。","e":""},{"i":"2021_4_short_43","t":"short","s":"简述在撰写护理综述论文时引用文献的基本原则。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：①必须是作者亲自阅读的较新、较有价值的参考文献；②尽量选用权威性文献，如核心期刊发表的文献；③尽量引用一次性（原始）文献，不选用未公开发表的文献，避免引用或少引用教材或专科书等二次文献，尤其避免大量间接引用综述；④选用权威、知名学者发表的文献。","e":""},{"i":"2021_4_application_44","t":"application","s":"在有关“健康教育对哮喘患者服药依从性的影响”的研究中，如果采用自身对照，研究者应该如何设计？","c":"护理研究设计","sc":10,"at":"参考答案（要点）：自身对照指对照组和实验组的数据均来自同一组样本，即将研究对象自身在干预前后的情况进行比较。设计要点：①选择一组哮喘患者作为研究对象（不另设平行对照组）；②在实施健康教育（干预）前，先测量并记录该组患者的服药依从性水平作为基线（前测/对照值）；③对该组患者实施健康教育干预措施（如健康教育处方、定期宣教等），并保证干预期间其他治疗护理条件不变；④干预结束后，在相同条件下再次测量该组患者的服药依从性水平（后测）；⑤将同一组患者干预前后的服药依从性进行比较，判断健康教育的效果。自身对照的优点是消除研究对象自身各种干扰因素的影响、节省样本量，但应注意前测不能完全替代对照组功能，解释结果切忌绝对，必要时可改进为时间连续性设计进行多次观测。","e":""}]},{"key":"2021_10","name":"2021年10月","qs":[{"i":"2021_10_single_1","t":"single","s":"标志着护理研究开始的第一篇研究报告所涉及的研究领域是","c":"绪论","sc":1,"o":{"A":"控制医院内感染","B":"护理教育","C":"护理时间管理","D":"护理程序的应用"},"a":"A","e":"南丁格尔通过观察记录改善护理工作，写出了控制医院内感染的第一篇研究报告，这就是护理学研究的开始。"},{"i":"2021_10_single_2","t":"single","s":"1978年由美国生物医学和行为科学研究委员会制定并通过的伦理规范文件是","c":"绪论","sc":1,"o":{"A":"《赫尔辛基宣言》","B":"《纽伦堡法典》","C":"《贝尔蒙报告》","D":"《患者权利法案》"},"a":"C","e":"1978年美国生物医学和行为科学研究委员会制定的《贝尔蒙报告》提出有益、尊重人的尊严、公正三项基本伦理原则。"},{"i":"2021_10_single_3","t":"single","s":"研究者在研究设计时应努力通过改变研究目的和/或干预方法来最大限度地增大利益和降低风险，这是","c":"绪论","sc":1,"o":{"A":"利益风险比","B":"知情同意","C":"保密","D":"平等"},"a":"A","e":"利益风险比即研究者应通过改变研究目的和/或干预方法，最大限度地增大研究利益、降低研究风险。"},{"i":"2021_10_single_4","t":"single","s":"在“音乐对机械通气患者血压的影响”的研究中，自变量是","c":"护理研究的基本程序","sc":1,"o":{"A":"音乐","B":"血压","C":"机械通气患者","D":"测量血压的仪器"},"a":"A","e":"音乐是研究者人为施加、操纵控制的处理因素（自变量）；血压是随音乐变化的因变量。"},{"i":"2021_10_single_5","t":"single","s":"研究者在进行研究时将血氧饱和度作为观察机体缺氧程度的指标，而不是选择呼吸频率来进行监测，这种选择所考虑的指标特点是","c":"护理研究的基本程序","sc":1,"o":{"A":"可行性","B":"客观性","C":"准确性","D":"灵敏性"},"a":"D","e":"选择观察指标应注意准确性与特异性、客观性、灵敏性、可行性；血氧饱和度较呼吸频率更能灵敏地反映缺氧程度，体现指标的灵敏性。"},{"i":"2021_10_single_6","t":"single","s":"下列对研究假设的描述错误的是","c":"确立研究问题","sc":1,"o":{"A":"假设是关于两个或更多变量之间关系的陈述","B":"依据假设可以确定分析数据资料的方向","C":"假设可以使理论的形成更加完整","D":"假设需要在研究实施过程中形成"},"a":"D","e":"研究假设需要在研究实施前形成，可为收集、分析和解释结果提供方向，故D错误；其余各项均为假设的正确描述。"},{"i":"2021_10_single_7","t":"single","s":"下列不属于从文献的外表特征进行检索的途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"书名途径","B":"著者途径","C":"序号途径","D":"主题途径"},"a":"D","e":"外表特征检索途径包括书名、著者、序号途径；主题途径属内容特征检索途径。"},{"i":"2021_10_single_8","t":"single","s":"某研究者在MEDLINE数据库中欲查找某位著者的地址，他应选择的检索字段是","c":"医学信息的获取与利用","sc":1,"o":{"A":"TI","B":"AB","C":"AD","D":"PY"},"a":"C","e":"AD—Address of Author—著者地址；TI为篇名，AB为文摘，PY为出版年。"},{"i":"2021_10_single_9","t":"single","s":"下列属于非实验性研究设计的是","c":"护理研究设计","sc":1,"o":{"A":"实验前后对照设计","B":"时间连续性设计","C":"不对等对照组设计","D":"病例对照设计"},"a":"D","e":"实验前后对照设计属实验性研究；时间连续性设计、不对等对照组设计属类实验性研究；病例对照设计属非实验性的比较性研究。"},{"i":"2021_10_single_10","t":"single","s":"某研究团队对居住在英国的注册医师就吸烟与医师肺癌的关系进行研究，按照有无吸烟习惯分为暴露组和非暴露组，在随后的20年观察期内，了解两组医师肺癌的发生及死亡情况。这一研究采用的研究设计是","c":"护理研究设计","sc":1,"o":{"A":"相关性研究","B":"前瞻性研究","C":"描述性研究","D":"回顾性研究"},"a":"B","e":"按暴露与否分组、从现存状况随时间追踪结局的队列研究，属前瞻性研究。"},{"i":"2021_10_single_11","t":"single","s":"某研究者通过深入到云南少数民族地区产后妇女的家庭中，采用观察法、会谈法、记录现场日记等形式了解妇女产后的健康照顾行为，分析影响这些行为的因素。研究者采用的研究方法是","c":"护理研究设计","sc":1,"o":{"A":"现象学研究","B":"现况调查","C":"人种学研究","D":"纵向研究"},"a":"C","e":"人种学研究通过深入某种文化群体的自然生活，用观察、会谈、档案等探讨其健康信念与行为，最适合如少数民族地区妇女产后健康照顾行为的研究。"},{"i":"2021_10_single_12","t":"single","s":"由Osgood, Suci & Tannenbaum于1957年设计，主要评定人们对某一概念的态度。一般由两个反义词形容、5～7个等级组成，要求被评者指出他目前所处的位置。此量表为","c":"资料收集的方法","sc":1,"o":{"A":"语义差异量表","B":"Likert量表","C":"视觉类似物量表","D":"评定量表"},"a":"A","e":"语义差异量表由Osgood、Suci和Tannenbaum于1957年设计，由两个反义形容词、5～7个等级组成。"},{"i":"2021_10_single_13","t":"single","s":"在自设问卷中，请研究对象圈出符合他今天感受的词（1.不快，2.主动，3.沉闷，4.萎靡，5.沮丧，6.沉着冷静，7.痛苦，8.阴郁……），这样的问题属于","c":"资料收集的方法","sc":1,"o":{"A":"等级式问题","B":"多选式问题","C":"检核表问题","D":"开放式问题"},"a":"C","e":"检核表问题(checklist)是给出一组无先后顺序的词或项目，由研究对象从中圈出符合自己情况者，符合本题形式。"},{"i":"2021_10_single_14","t":"single","s":"研究者在特殊的实验环境下观察调查对象对特定刺激的反应。这种观察法是","c":"资料收集的方法","sc":1,"o":{"A":"结构式观察法","B":"自然观察法","C":"非结构式观察法","D":"标准情形观察法"},"a":"D","e":"标准情形观察法(standard observation)指在特殊实验环境下观察对象对特定刺激的反应，预先设计、按程序进行。"},{"i":"2021_10_single_15","t":"single","s":"常用来表示研究工具的稳定性的大小的信度类型是","c":"研究工具性能的测定","sc":1,"o":{"A":"重测信度","B":"折半信度","C":"复本信度","D":"评定者间信度"},"a":"A","e":"重测信度反映工具的稳定性；折半信度、Cronbach'α反映内在一致性；复本信度、评定者间信度反映等同性。"},{"i":"2021_10_single_16","t":"single","s":"由评估人根据自己对所要测量的概念的理解，尽其判断能力之所及来判定工具是否适当的是","c":"研究工具性能的测定","sc":1,"o":{"A":"结构效度","B":"效标关联效度","C":"内容效度","D":"表面效度"},"a":"D","e":"表面效度即由评估人根据自己对所测概念的理解、尽其判断能力断定工具是否适当，是停留在问卷表面的测定。"},{"i":"2021_10_single_17","t":"single","s":"收集到各组的例数如性别（男/女）、职业（工人/农民/干部）的资料为","c":"研究资料的分析方法","sc":1,"o":{"A":"计量资料","B":"计数资料","C":"等级资料","D":"定量资料"},"a":"B","e":"性别、职业按互不相容的类别分组计数各组例数，属计数资料（无序分类资料）。"},{"i":"2021_10_single_18","t":"single","s":"反映一组数据的平均离散水平的指标是","c":"研究资料的分析方法","sc":1,"o":{"A":"均数","B":"中位数","C":"标准差","D":"四分位数间距"},"a":"C","e":"标准差反映一组数据的平均离散水平，标准差越大个体间变异越大；均数、中位数反映平均水平。"},{"i":"2021_10_single_19","t":"single","s":"护理综述论文所引用的文献一般是近3～5年内发表的，其中近3年发表过的文献应占到的比例是","c":"护理论文的撰写","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"C","e":"综述引用文献一般为近3～5年发表，其中国内期刊一般要求20～30篇，近3年发表的应占70%以上。"},{"i":"2021_10_single_20","t":"single","s":"撰写论文时的英文文题中英文实词一般不宜超过","c":"护理论文的撰写","sc":1,"o":{"A":"8个","B":"10个","C":"12个","D":"14个"},"a":"B","e":"文题一般不超过20个汉字，英文题目不超过10个实词。"},{"i":"2021_10_multi_21","t":"multi","s":"下列对研究选题的描述正确的有","c":"确立研究问题","sc":2,"o":{"A":"研究选题可来源于个人实践","B":"选题是护理研究中较容易的一个环节","C":"研究者个人的兴趣可以作为选题的来源","D":"未来需要探讨的问题可以成为选题来源","E":"研究选题可来自于受他人研究的启发"},"a":"ACDE","e":"研究问题可来自个人实践、他人研究启发、目前或未来需探讨的问题、研究者个人兴趣；选题和确立问题是科研关键性的第一步，并非容易环节，故B错。"},{"i":"2021_10_multi_22","t":"multi","s":"在数据收集完成后，要对其进行处理，数据处理过程主要包括","c":"护理研究的基本程序","sc":2,"o":{"A":"数据编辑","B":"数据编码","C":"数据录入","D":"数据分析","E":"数据讨论"},"a":"ABC","e":"整理（处理）资料包括数据编辑、数据编码、数据录入三步；数据分析、数据讨论属后续分析交流阶段。"},{"i":"2021_10_multi_23","t":"multi","s":"下列选项中属于三次文献的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"学位论文","B":"文摘","C":"教科书","D":"综述","E":"实验记录"},"a":"CD","e":"三次文献如综述、述评、专著、教科书、年鉴；学位论文属一次文献，文摘属二次文献。"},{"i":"2021_10_multi_24","t":"multi","s":"下列关于质性研究与量性研究的区别的描述正确的有","c":"护理研究的基本程序","sc":2,"o":{"A":"质性研究和量性研究以不同的认识论为基础","B":"质性研究在护理研究中的重要性不如量性研究","C":"质性研究使用演绎推理方法得出结论，量性研究运用归纳推理、辩证推理","D":"质性研究中的研究者也是研究工具，量性研究要求研究者与研究环境尽量分开","E":"质性研究资料的分析方法与量性研究不同"},"a":"ADE","e":"质性研究建立在诠释主义哲学观上、量性研究建立在实证主义上；质性研究中研究者本身即研究工具，资料分析方法也不同。B、C错误（两类研究同等重要；质性研究用归纳推理）。"},{"i":"2021_10_multi_25","t":"multi","s":"广义医学文献的阅读方法有","c":"医学信息的获取与利用","sc":2,"o":{"A":"阅读策略","B":"程序","C":"方式和方法","D":"概览","E":"提问"},"a":"ABC","e":"阅读方法分广义和狭义，广义指对多种读物的阅读，包括阅读策略、程序、方式和方法；概览、提问属狭义的五步阅读法步骤。"},{"i":"2021_10_multi_26","t":"multi","s":"下列关于盲法的叙述正确的有","c":"护理研究设计","sc":2,"o":{"A":"减少可能的来自研究者的主观因素导致的偏倚","B":"减少可能的来自受试者的主观因素导致的偏倚","C":"使得研究对象有均等机会进入实验组或对照组","D":"确保样本具有代表性","E":"包括单盲法和双盲法"},"a":"ABE","e":"盲法指在不知道分组情况下进行观测、收集和判断，分单盲和双盲，可减少研究者和受试者主观因素导致的偏倚；C、D描述的是随机化的作用。"},{"i":"2021_10_multi_27","t":"multi","s":"下列关于实验性研究特点的描述正确的有","c":"护理研究设计","sc":2,"o":{"A":"是检验因果假设最有说服力的一种研究设计","B":"最大限度地控制了外变量对于依变量的影响","C":"反映研究的科学性和客观性较高","D":"实用性强，不易触犯伦理原则","E":"在护理问题的研究中被广泛应用"},"a":"ABC","e":"实验性研究检验因果假设最有说服力、最大限度控制外变量、科学性客观性高；但护理研究中尚不能广泛应用，实用性强、不易触犯伦理原则是类实验性研究的优点，故D、E错。"},{"i":"2021_10_multi_28","t":"multi","s":"属于非概率抽样方法的有","c":"护理研究设计","sc":2,"o":{"A":"分层抽样","B":"定额抽样","C":"目的抽样","D":"系统抽样","E":"方便抽样"},"a":"BCE","e":"非概率抽样包括方便抽样、定额抽样、目的抽样、滚雪球抽样、理论抽样；分层抽样、系统抽样属概率抽样。"},{"i":"2021_10_multi_29","t":"multi","s":"采用档案记录法收集资料时资料可来源于","c":"资料收集的方法","sc":2,"o":{"A":"结构式访谈","B":"疾病报告","C":"医疗工作记录","D":"专题疾病的调查","E":"护理工作记录"},"a":"BCDE","e":"档案记录法资料主要来自疾病报告、医疗和护理服务工作记录（含医疗、护理工作记录）、健康检查资料、专题疾病的调查；结构式访谈属访谈法。"},{"i":"2021_10_multi_30","t":"multi","s":"下列可用来反映研究工具的内在一致性这一特征的指标有","c":"研究工具性能的测定","sc":2,"o":{"A":"重测信度","B":"折半信度","C":"Cronbach'α系数","D":"KR-20值","E":"复本信度"},"a":"BCD","e":"折半信度、Cronbach'α系数、KR-20值均反映内在一致性；重测信度反映稳定性，复本信度反映等同性。"},{"i":"2021_10_multi_31","t":"multi","s":"下列对研究工具信度和效度的描述正确的有","c":"研究工具性能的测定","sc":2,"o":{"A":"只要研究工具存在，就势必有它的信度和效度","B":"一个研究工具要想效度高，信度必须高","C":"信度高的工具也仅能说明有效度高的可能性","D":"信度和效度并不是截然孤立的","E":"信度低的工具效度肯定高"},"a":"ABCD","e":"只要工具存在就有信度和效度；信度低效度肯定不高，信度高仅说明有效度高的可能性；二者并不截然孤立。E错（信度低则效度肯定不高）。"},{"i":"2021_10_multi_32","t":"multi","s":"计量资料呈正态分布时可以使用的统计学方法包括","c":"研究资料的分析方法","sc":2,"o":{"A":"单样本t检验","B":"单因素方差分析","C":"Pearson相关分析","D":"单样本秩和检验","E":"Kendall相关分析"},"a":"ABC","e":"正态分布计量资料用t检验（单样本、两独立、配对）、单因素方差分析、Pearson相关分析；秩和检验、Kendall等级相关适用于偏态或等级资料。"},{"i":"2021_10_multi_33","t":"multi","s":"下列对于护理个案论文序言部分内容的描述正确的有","c":"护理论文的撰写","sc":2,"o":{"A":"应提出本文研究问题的依据","B":"描述写论文的目的","C":"对所选定个案的情况进行介绍","D":"需多描述疾病诊断、用药、手术方式等医疗信息","E":"介绍个案的要点不需要和后面护理措施所要解决的问题相对应"},"a":"ABC","e":"个案论文序言包括提出研究问题的依据、写论文的目的及所选个案情况介绍；不过多叙述医师做的事，介绍个案要点应与后面护理计划和措施相呼应，故D、E错。"},{"i":"2021_10_term_34","t":"term","s":"变异","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：各个体之间的差异称为变异。如同一年龄、同一性别的儿童身高、体重各不相同。变异是生物医学数据最显著的特征，统计的任务就是从事物的同质性与变异性出发，通过一定数量的对比分析揭示事物的本质特征和规律。","e":""},{"i":"2021_10_term_35","t":"term","s":"问卷","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：问卷是调查的一种工具，通过受访者回答问题而不是观察行为反应得到研究资料，可应用于各种领域的问题。它是一组经周密设计的问题或表格，由研究对象自行填写（或由调查者按其回答填写）以收集资料。","e":""},{"i":"2021_10_term_37","t":"term","s":"翻译","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：国外量表的翻译是指最好选择两个或多个有经验的翻译者，彼此独立地将源量表翻译成中文，要求翻译者既熟悉源语言及文化背景又有较好汉语功底，然后各翻译者对各自版本进行讨论，形成大家达成共识的中文版本；主张直译与意译相结合，使量表适合中国文化习俗。","e":""},{"i":"2021_10_short_40","t":"short","s":"简述伦理审查委员会的设立要求。","c":"绪论","sc":5,"at":"参考答案（要点）：伦理审查委员会(IRB)可在大学、医院及医疗保健中心设立；每个IRB至少由5名具有不同文化、经济、教育、性别和种族背景的成员组成；成员需具有特殊领域专长，有的属于伦理、法律等科学领域；成员中至少1人为非研究机构成员；国外医院IRB通常由医师、律师、学者、牧师及社区非医学专业人员组成。","e":""},{"i":"2021_10_short_41","t":"short","s":"简述为控制混杂性偏倚进行配对时须注意的事项。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：配对（匹配）是为研究对象选择对照时，使对照针对一个或多个潜在混杂因素与其相同或接近。注意事项：①最常用1:1配对，常匹配性别、年龄、疾病类型等混杂因素；②不能把要研究的因素进行配对；③配对项目不宜过多（配对越多越难找到对照、丢失信息越多）。","e":""},{"i":"2021_10_short_42","t":"short","s":"简述统计表的结构。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：统计表由表题、标目、线条、数字、备注五部分组成。①标题（表号和表题）概括主要内容，写在表上方中央；②标目分横标目和纵标目，说明每行每列数字含义并标明单位；③线条一般三条线（顶线、底线、标目与数字间分界线），无竖线、斜线；④数字一律用阿拉伯数字，同列个位对齐、小数位数一致；⑤需说明处用符号标出、解释写在表下面。","e":""},{"i":"2021_10_short_43","t":"short","s":"简述护理经验论文撰写中临床资料与方法部分的内容组成。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：临床资料与方法部分重点介绍护理实践中的具体方法，包括三方面：①临床资料：观察对象基本特征，如年龄、性别、观察例数、病情介绍、诊断标准；②护理措施：药物护理、心理护理、饮食护理、手术前后护理、仪器使用、健康教育、康复护理等具体方法；③护理效果判断标准。应具体、有的放矢，避免抽象空洞。","e":""},{"i":"2021_10_application_44","t":"application","s":"某研究者要比较城乡6岁男孩的身高有无不同，分别从城乡两地各随机抽取100名6岁男孩，测出其平均身高分别为119.85cm和117.92cm。从数值上看，样本中的城市男孩的平均身高(119.85cm)高于农村男孩(117.92cm)。请问：单凭样本均数的差异不同能直接得出“城市6岁男孩的平均身高高于农村”的结论吗？为什么？具体如何做才能够得到正确的结论？","c":"研究资料的分析方法","sc":10,"at":"参考答案（要点）：①不能直接得出结论。②原因：这是抽样研究，两个样本均数（119.85cm与117.92cm）之间的差异可能是由抽样误差造成的，样本均数高于农村并不能直接推断城乡6岁男孩总体平均身高也存在差异。③正确做法：必须进行假设检验（显著性检验）。该资料为两个独立样本、均为正态分布的计量资料，应选用两独立样本t检验：建立假设H0（两总体均数相同）与H1（两总体均数不同），确定检验水准α=0.05，计算统计量t值，确定P值；若P≤0.05则拒绝H0，认为城乡6岁男孩平均身高差异有统计学意义，方可得出“城市6岁男孩平均身高高于农村”的结论；若P>0.05则认为差异无统计学意义，不能下此结论。","e":""}]},{"key":"2022_4","name":"2022年4月","qs":[{"i":"2022_4_single_1","t":"single","s":"为了保证科学事实的可靠性，防止错误，科学研究强调科学事实的认定必须遵循的原则是","c":"绪论","sc":1,"o":{"A":"客观性原则","B":"可重复性原则","C":"实验原则","D":"伦理原则"},"a":"B","e":"可重复性原则指在不同研究者、实验室、时间和地点都能重复验证的事实才认定为科学事实，用以保证科学事实的可靠性、防止错误。"},{"i":"2022_4_single_2","t":"single","s":"有关性行为虐待儿童、吸毒等敏感问题的研究，可能会给研究对象造成心理伤害，此时的研究风险是","c":"绪论","sc":1,"o":{"A":"无可预见的影响","B":"暂时的不适","C":"较严重的暂时不适","D":"永久性伤害的可能"},"a":"D","e":"有关性行为虐待儿童、吸毒等敏感问题可能给研究对象造成永久性的心理/社会伤害，一旦发生会造成终身影响，属永久性伤害的可能。"},{"i":"2022_4_single_3","t":"single","s":"在静脉进针穿刺角度与疼痛关系的研究中，进针角度是","c":"护理研究的基本程序","sc":1,"o":{"A":"因变量","B":"外变量","C":"应变量","D":"自变量"},"a":"D","e":"进针角度是研究者操纵、有计划变化的处理因素（自变量）；疼痛是随进针角度变化而观测的因变量。"},{"i":"2022_4_single_4","t":"single","s":"已知艾滋病方面的研究是从1981年开始的，查找艾滋病方面的相关文献，从1981年以后逐年向近期查找。此文献检索方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"追溯法","B":"倒查法","C":"顺查法","D":"抽查法"},"a":"C","e":"顺查法即由远及近、从旧到新按时间顺序逐年查找，查全率高，适合要求全面普查的课题。"},{"i":"2022_4_single_5","t":"single","s":"从20世纪开始，早期的护理研究大多关注","c":"绪论","sc":1,"o":{"A":"护理教育","B":"护患关系","C":"护理人员安排","D":"护士的角色"},"a":"A","e":"20世纪20年代初期早期的护理研究大多是关于护理教育方面，侧重如何加强护理教育。"},{"i":"2022_4_single_6","t":"single","s":"下列对于伦理审查委员会构成特点的描述不正确的是","c":"绪论","sc":1,"o":{"A":"需要包括至少7名成员","B":"成员中至少1人为非研究机构成员","C":"成员需要具有特殊领域的专长","D":"可在大学、医院以及医疗保健中心设立"},"a":"A","e":"IRB至少由5名成员组成（而非7名），至少1人为非研究机构成员，成员需具特殊领域专长，可在大学、医院及医疗保健中心设立。"},{"i":"2022_4_single_7","t":"single","s":"下列不属于从文献的内容特征进行检索的途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"书名途径","B":"关键词途径","C":"分类途径","D":"主题途径"},"a":"A","e":"分类、主题、关键词途径属内容特征检索途径；书名途径属外表特征检索途径。"},{"i":"2022_4_single_8","t":"single","s":"在MEDLINE数据库中代表文献来源的字段缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AU","B":"TI","C":"SO","D":"AB"},"a":"C","e":"SO—Source—文献来源；AU为著者姓名，TI为篇名，AB为文摘。"},{"i":"2022_4_single_9","t":"single","s":"研究者在不知道研究对象分组情况的前提下进行研究过程中指标的观测、数据的收集和结论的判断，这是","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"对照","C":"随机","D":"盲法"},"a":"D","e":"盲法(blind method)即在不知道分组情况下进行指标观测、数据收集和结论判断，以减少主观因素导致的偏倚。"},{"i":"2022_4_single_10","t":"single","s":"探索变量之间的关系的研究是","c":"护理研究设计","sc":1,"o":{"A":"描述性研究","B":"相关性研究","C":"比较性研究","D":"实验性研究"},"a":"B","e":"相关性研究即探索变量之间的关系，有较明确的几个观察变量，但有相关关系不能证明因果关系。"},{"i":"2022_4_single_11","t":"single","s":"先将总体按某种或某些特征分成不同的类别，然后依照每一类中个体占总体的比例来抽取相应数目的个体构成样本的方法是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"理论抽样"},"a":"B","e":"定额抽样（配额抽样）先将总体按某些特征分类，再按每类个体数占总体的比例抽取相应数目，是在方便抽样基础上增加分层配额。"},{"i":"2022_4_single_12","t":"single","s":"测量人们的行为、态度等，由一组有序排列的类别答案构成的量表是","c":"资料收集的方法","sc":1,"o":{"A":"视觉类似物量表","B":"语义差异量表","C":"Likert量表","D":"评定量表"},"a":"D","e":"评定量表(rating scale)测量人们行为、态度等，由一组有序排列的类别答案构成。"},{"i":"2022_4_single_13","t":"single","s":"在对国外翻译量表进行检测时，一般来讲，可接受的信效度系数均应大于","c":"研究工具性能的测定","sc":1,"o":{"A":"0.6","B":"0.7","C":"0.8","D":"0.9"},"a":"B","e":"国外量表翻译后检测等同性，一般可接受的信效度系数应大于0.7。"},{"i":"2022_4_single_14","t":"single","s":"观察者作为参与者进入观察领域，其活动以参与为主，观察为辅，这属于","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"C","e":"观察性参与者(participant-as-observer)指观察者作为参与者进入观察领域，活动以参与为主、观察为辅；参与性观察者则以观察为主、参与为辅。"},{"i":"2022_4_single_15","t":"single","s":"结构效度反映研究工具的","c":"研究工具性能的测定","sc":1,"o":{"A":"内部一致性","B":"稳定性","C":"内在属性","D":"等同性"},"a":"C","e":"结构效度重点了解工具的内在属性，反映工具与其所依据理论或概念框架的相结合程度。"},{"i":"2022_4_single_16","t":"single","s":"关于评定者间信度的描述正确的是","c":"研究工具性能的测定","sc":1,"o":{"A":"用于同一工具两次或多次测定同一研究对象","B":"用于不同评定者使用相同工具，同时测量相同对象","C":"用于两个大致相同的研究工具，同时被用于研究对象","D":"用于测量工具与现有标准之间的相关"},"a":"B","e":"评定者间信度指不同评定者使用相同工具同时测量相同对象时计算一致程度；A为重测信度，C为复本信度。"},{"i":"2022_4_single_17","t":"single","s":"某研究资料将治疗效果分为治愈、显效、好转、无效，此资料属于","c":"研究资料的分析方法","sc":1,"o":{"A":"计量资料","B":"无序分类资料","C":"计数资料","D":"有序分类资料"},"a":"D","e":"治疗效果（治愈/显效/好转/无效）按属性程度分等级、有顺序，属有序分类资料（等级资料、半定量资料）。"},{"i":"2022_4_single_18","t":"single","s":"统计图中适宜的纵轴、横轴比例是","c":"研究资料的分析方法","sc":1,"o":{"A":"1:2","B":"2:3","C":"4:5","D":"5:7"},"a":"D","e":"统计图纵轴、横轴的比例以5∶7或7∶5为宜。"},{"i":"2022_4_single_19","t":"single","s":"护理综述论文所引用的文献一般是近3~5年内发表的，其中近3年发表过的文献所占比例应不低于","c":"护理论文的撰写","sc":1,"o":{"A":"80%","B":"70%","C":"60%","D":"50%"},"a":"B","e":"综述引用文献一般为近3～5年发表，其中国内期刊一般要求20～30篇，近3年发表的应占70%以上。"},{"i":"2022_4_single_20","t":"single","s":"撰写论文时文题中的汉字数量一般不超过","c":"护理论文的撰写","sc":1,"o":{"A":"10","B":"20","C":"30","D":"40"},"a":"B","e":"文题应简明，一般不超过20个汉字，英文题目不超过10个实词。"},{"i":"2022_4_multi_21","t":"multi","s":"护理研究在进入实施阶段之前要完成的研究步骤有","c":"护理研究的基本程序","sc":2,"o":{"A":"形成假设","B":"预试验","C":"资料收集与处理","D":"资料分析","E":"确认研究变量"},"a":"AE","e":"准备阶段（进入实施阶段之前）要完成确立研究问题、文献检索与回顾、陈述理论框架、确认研究变量、形成研究假设、科研设计；预试验、资料收集与处理、资料分析属实施阶段。"},{"i":"2022_4_multi_23","t":"multi","s":"下列有关研究假设的描述不正确的有","c":"确立研究问题","sc":2,"o":{"A":"假设是关于两个或更多变量之间关系的陈述","B":"每个研究都一定会有假设","C":"研究假设也常常应用于质性研究中","D":"研究假设的形成提供了研究的焦点","E":"假设的形成一定要有文献支持或理论基础"},"a":"BC","e":"探索性、描述性研究及质性研究一般采用研究问题而不用假设，故“每个研究都一定会有假设”“研究假设常应用于质性研究”均不正确；其余各项正确。"},{"i":"2022_4_multi_25","t":"multi","s":"下列有关阅读文献策略的描述正确的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"先读文摘，后读原文","B":"先粗读，后精读","C":"先读现刊文献，后读过刊文献","D":"先读专题性文献，后读综合性文献","E":"先读主题内容相同的英文文献，后读中文文献"},"a":"ABC","e":"阅读五先五后策略：先读中文文献后读外文、先读文摘后读原文、先粗读后精读、先读综合性文献后读专题性文献、先读现刊后读过刊。故D、E错。"},{"i":"2022_4_multi_27","t":"multi","s":"质性研究一般综合多种资料收集的方法，包括","c":"护理研究设计","sc":2,"o":{"A":"会谈法","B":"测量法","C":"观察法","D":"问卷调查法","E":"档案资料收集法"},"a":"ACE","e":"质性研究一般综合多种资料收集方法，如会谈法、观察法、档案资料收集法等；测量法、问卷调查法主要用于量性研究。"},{"i":"2022_4_multi_29","t":"multi","s":"在生物医学测量法中机体指标的测量有","c":"资料收集的方法","sc":2,"o":{"A":"脉搏","B":"血压","C":"心电图","D":"血气指标","E":"生物活检"},"a":"ABC","e":"机体指标测量(Vivo)通过体检直接从生物体测得，如脉搏、血压、心电图、指尖血氧饱和度；血气分析、活检病理检查属实验指标测量(Vitro)。"},{"i":"2022_4_multi_30","t":"multi","s":"不能用来反映研究工具内在一致性的有","c":"研究工具性能的测定","sc":2,"o":{"A":"内容效度","B":"折半信度","C":"KR-20值","D":"重测信度","E":"结构效度"},"a":"ADE","e":"折半信度、KR-20值（及Cronbach'α）反映内在一致性；重测信度反映稳定性，内容效度、结构效度属效度而非信度的内在一致性。"},{"i":"2022_4_multi_31","t":"multi","s":"通常小概率事件统计学意义的界限有","c":"研究资料的分析方法","sc":2,"o":{"A":"P≤0.07","B":"P≤0.06","C":"P≤0.05","D":"P≤0.03","E":"P≤0.01"},"a":"CE","e":"通常将P≤0.05或P≤0.01称为小概率事件，被看做事物差异有统计学意义的界限。"},{"i":"2022_4_multi_32","t":"multi","s":"某研究者对研究中的计量资料欲进行两个独立样本的比较，下列描述正确的有","c":"研究资料的分析方法","sc":2,"o":{"A":"若为正态分布，可用单因素方差分析","B":"若为偏态分布，可用单样本秩和检验","C":"若为正态分布，可用独立样本t检验","D":"若为偏态分布，可用Mann-Whitney U检验","E":"无论正态分布还是偏态分布，可用Pearson相关分析"},"a":"CD","e":"两个独立样本计量资料比较：正态分布用两独立样本t检验；偏态分布用Mann-Whitney U检验。单因素方差分析用于3组及以上均数比较，单样本秩和检验用于单样本与总体比较，Pearson相关用于两正态计量变量关联而非两组均数比较，故A、B、E错。"},{"i":"2022_4_multi_33","t":"multi","s":"下列对于综述论文中引用文献原则的描述错误的有","c":"护理论文的撰写","sc":2,"o":{"A":"可多引用教材或专科书的资料","B":"可选用未公开发表的文献","C":"选用知名学者发表的文献","D":"可以是作者亲自阅读或者是其他文章中标引的参考文献","E":"尽量选用权威期刊发表的文献"},"a":"ABD","e":"综述引用文献必须是作者亲自阅读的原始文献，不选用未公开发表的文献，避免引用或少引用教材或专科书（二次文献），避免转引其他文章标引的文献；应选用权威期刊、知名学者文献。故A、B、D错误。"},{"i":"2022_4_term_34","t":"term","s":"应用研究","c":"绪论","sc":4,"at":"参考答案（要点）：按研究的目的、任务和方法不同，研究分为基础研究、应用研究和开发研究三类。应用研究是为解决当前护理实践中具体实际问题、直接服务于护理实践而开展的研究，目前大部分护理研究着重应用性研究。","e":""},{"i":"2022_4_short_40","t":"short","s":"简述在准备阶段需要完成的研究过程设计和步骤。","c":"护理研究的基本程序","sc":5,"at":"参考答案（要点）：护理研究准备阶段需完成以下工作：①确立研究问题；②进行文献检索与文献回顾；③陈述理论框架；④确认研究变量（先下抽象性定义再下操作性定义）；⑤形成研究假设；⑥科研设计（包括确定研究对象、选择研究方法、确定研究指标）。","e":""},{"i":"2022_4_short_41","t":"short","s":"简述研究工具信度和效度的关系。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：①只要研究工具存在，就势必有它的信度和效度，二者是程度高低问题而非有无问题；②信度低的工具效度肯定不高；③但信度高的工具也仅能说明有效度高的可能性，并不必然效度高；④信度和效度并不是截然孤立的，而是存在一定关系；⑤良好的研究工具必须同时具备较高的信度和效度。","e":""},{"i":"2022_4_short_42","t":"short","s":"简述制作直条图的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：直条图用等宽直条长短表示几个相互独立组别某指标数值的大小，横轴为独立组别、纵轴为统计指标。注意事项：①纵轴刻度一般从0开始；②各直条宽度应相等；③在复式直条图中，同一组的直条间不留空隙。","e":""},{"i":"2022_4_short_43","t":"short","s":"简述护理个案论文的基本格式要求。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：护理个案论文主要由文题、作者署名、摘要、关键词、正文和参考文献组成，前几项及参考文献要求与护理研究论文一致；正文主要按护理程序思路组织：①序言；②对个案进行评估、提出研究问题（含护理诊断、护理计划与措施）；③护理效果；④评价效果；⑤参考文献。须按护理程序思路撰写，侧重写护士自己的资料。","e":""},{"i":"2022_4_application_44","t":"application","s":"某研究者欲调查大学一年级学生的心理健康状况。该大学共有2000名一年级学生，按系统抽样抽取例数为200的样本。请描述系统抽样的过程。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：系统抽样（等距/机械抽样）过程：①先将2000名一年级学生按某一特征（如学号）顺序统一编号（0001～2000）；②计算抽样间隔H＝总体例数N÷样本例数n＝2000÷200＝10；③在1～10号之间随机确定一个起点k（k＜10）；④从k开始，每隔10个号码抽取一个，即抽取学号为k、k+10、k+20、k+30……的学生，直至抽满200名为止。注意应随机确定起点且间隔不得随意更改，并注意名单有无周期性排列，以免产生偏差。","e":""}]},{"key":"2022_10","name":"2022年10月","qs":[{"i":"2022_10_single_2","t":"single","s":"将大量无序的一次文献进行搜集整理，著录其特征，并按一定的顺序加以编排，以供读者检索形成的文献是","c":"医学信息的获取与利用","sc":1,"o":{"A":"零次文献","B":"原始文献","C":"二次文献","D":"三次文献"},"a":"C","e":"二次文献是把一次文献加工整理、系统化而成的检索工具（如题录、目录、索引、文摘），供读者检索。"},{"i":"2022_10_single_3","t":"single","s":"下列不属于数据处理过程的是","c":"护理研究的基本程序","sc":1,"o":{"A":"数据分析","B":"数据编辑","C":"数据录入","D":"数据编码"},"a":"A","e":"整理（处理）资料三步为数据编辑、数据编码、数据录入；数据分析是处理之后的另一阶段工作。"},{"i":"2022_10_single_4","t":"single","s":"关于选择研究问题的陈述正确的是","c":"确立研究问题","sc":1,"o":{"A":"要选择对临床护理实践有指导意义的问题","B":"选题范围最好涉及面大一些","C":"研究问题不能是部分创新","D":"选择研究预期结果是正效应的研究问题"},"a":"A","e":"选题应选对临床有指导意义、立足于创新的问题；选题范围不可太大（B错），可部分创新但避免完全重复（C错），D无依据。"},{"i":"2022_10_single_5","t":"single","s":"“吸烟会增加肺癌的发生率”这个研究假设是","c":"确立研究问题","sc":1,"o":{"A":"无效假设","B":"无方向性假设","C":"统计学假设","D":"有方向性假设"},"a":"D","e":"该假设明确指出了变量间关系的预期方向（吸烟“增加”肺癌发生率），属有方向性假设。"},{"i":"2022_10_single_6","t":"single","s":"MEDLINE中TI字段的含义是","c":"医学信息的获取与利用","sc":1,"o":{"A":"摘要","B":"作者","C":"篇名","D":"出版年"},"a":"C","e":"MEDLINE字段中TI—Title—篇名；AB为文摘、AU为著者、PY为出版年。"},{"i":"2022_10_single_7","t":"single","s":"在检索医学文献时，研究者已知所需文献的类属关系，需要对某一课题的文献较全面地了解，适用的检索途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"主题词途径","B":"题录号途径","C":"副主题词途径","D":"分类途径"},"a":"D","e":"按学科类属、满足族性检索、较全面了解某课题文献，适用分类途径。"},{"i":"2022_10_single_8","t":"single","s":"根据研究指标选择的灵敏性原则，观察机体缺氧程度时，最为灵敏的指标是","c":"护理研究的基本程序","sc":1,"o":{"A":"呼吸频率","B":"呼吸型态","C":"血氧饱和度","D":"面色"},"a":"C","e":"选择研究指标应注意灵敏性，血氧饱和度能直接、灵敏地反映机体缺氧程度，优于呼吸频率、呼吸型态、面色等间接指标。"},{"i":"2022_10_single_9","t":"single","s":"研究中在不知道研究对象分组情况的前提下进行研究过程中指标的观测、数据的收集和结论的判断，目的是减少可能来自于研究者主观因素所导致的偏倚。这种做法被称为","c":"护理研究设计","sc":1,"o":{"A":"随机化","B":"干预","C":"对照","D":"盲法"},"a":"D","e":"盲法指在不知道分组情况下进行观测、收集资料和判断，以减少主观因素导致的偏倚。"},{"i":"2022_10_single_10","t":"single","s":"某研究者拟调查家庭照顾者在照顾癌症晚期患者过程中的亲身经历和其内心的真实感受，并归纳总结其“真实的体验”。适合的研究方法是","c":"护理研究设计","sc":1,"o":{"A":"前瞻性研究法","B":"人种学研究法","C":"现象学研究法","D":"根基理论研究法"},"a":"C","e":"现象学研究目的在于描述人们亲身的经历，用归纳、描述方法捕捉研究对象某种“真实的体验”。"},{"i":"2022_10_single_11","t":"single","s":"在研究过程中，如果测定方法的程序不统一，以致多个收集资料者之间的收集资料方法不一致，产生的偏倚是","c":"护理研究设计","sc":1,"o":{"A":"测量偏倚","B":"报告偏倚","C":"诊断怀疑偏倚","D":"回忆偏倚"},"a":"A","e":"测定标准或程序不统一、测量者技术或态度不一致所造成的系统误差属测量偏倚（信息性偏倚）。"},{"i":"2022_10_single_12","t":"single","s":"在使用邮寄问卷法收集资料时，较为满意的回收率为","c":"资料收集的方法","sc":1,"o":{"A":"30%以上","B":"40%以上","C":"50%以上","D":"60%以上"},"a":"D","e":"邮寄问卷一般回收率60%以上较满意，低于60%需慎重考虑研究有效性。"},{"i":"2022_10_single_13","t":"single","s":"某研究者进入到养老机构中观察养老护理员和痴呆老人之间的沟通互动情况。她在参与照护活动过程中进行观察，其活动以观察为主，参与为辅。此种情况下，观察者与被观察者的关系类型是","c":"资料收集的方法","sc":1,"o":{"A":"完全参与者","B":"观察性参与者","C":"参与性观察者","D":"局外观察者"},"a":"C","e":"参与性观察者指观察者作为参与者进入观察领域，但活动以观察为主、参与为辅。"},{"i":"2022_10_single_14","t":"single","s":"某护士采用焦虑自评量表，对100名急性期乙型肝炎患者进行焦虑情绪的测评。该组患者的量表得分为35.48±2.31分，呈正态分布。她准备将此得分与焦虑自评量表的常模进行比较，应该采用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"配对t检验","B":"单样本t检验","C":"两独立样本t检验","D":"方差分析"},"a":"B","e":"样本均数与已知总体均数（常模）比较用单样本t检验；资料为计量、正态分布。"},{"i":"2022_10_single_15","t":"single","s":"当研究工具所测量的变量性质不稳定时，下列不适合考虑测评的信度类型是","c":"研究工具性能的测定","sc":1,"o":{"A":"复本信度","B":"评定者间信度","C":"折半信度","D":"重测信度"},"a":"D","e":"重测信度只适用于性质相对稳定的变量；态度、情感等不稳定变量不宜用重测信度，可用折半信度或Cronbach'α。"},{"i":"2022_10_single_16","t":"single","s":"在组织专家委员会对研究工具的内容效度进行评议时，专家人数不应低于","c":"研究工具性能的测定","sc":1,"o":{"A":"3人","B":"5人","C":"7人","D":"10人"},"a":"A","e":"内容效度专家评议，专家人数最低不少于3人、最多不超过10人，5人较合适；“不应低于”即不少于3人。"},{"i":"2022_10_single_17","t":"single","s":"一般认为理想的研究工具的信度是其相关系数应高于","c":"研究工具性能的测定","sc":1,"o":{"A":"0.5","B":"0.6","C":"0.7","D":"0.8"},"a":"C","e":"通常认为相关系数高于0.7时工具信度才理想。"},{"i":"2022_10_single_18","t":"single","s":"撰写护理研究论文时，论著的篇幅一般为","c":"护理论文的撰写","sc":1,"o":{"A":"1000～2000字","B":"3000～5000字","C":"6000～7000字","D":"8000～9000字"},"a":"B","e":"论著篇幅一般3000～5000字、平均4000字左右。"},{"i":"2022_10_single_19","t":"single","s":"个案研究属于","c":"护理论文的撰写","sc":1,"o":{"A":"相关性研究","B":"描述性研究","C":"质性研究","D":"实验性研究"},"a":"C","e":"个案研究是针对个案护理资料进行研究、深入分析的过程，属于质性研究的一种。"},{"i":"2022_10_single_20","t":"single","s":"为了体现护理综述论文的新颖性，国内期刊一般要求参考文献中近3年发表过的文献应达到的比例为","c":"护理论文的撰写","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"C","e":"综述引用文献一般近3～5年，国内期刊一般要求20～30篇，其中近3年发表的应占70%以上。"},{"i":"2022_10_multi_21","t":"multi","s":"科学研究应遵循的基本原则有","c":"绪论","sc":2,"o":{"A":"客观性原则","B":"共性原则","C":"实验原则","D":"普遍性原则","E":"可重复性原则"},"a":"ACE","e":"科学研究应遵循三项基本原则：客观性原则、实验原则、可重复性原则。"},{"i":"2022_10_multi_22","t":"multi","s":"护理研究问题可以来源于","c":"护理研究的基本程序","sc":2,"o":{"A":"个人实践","B":"研究者个人兴趣","C":"受他人研究的启发","D":"研究假设","E":"目前或未来需要探讨的问题"},"a":"ABCE","e":"研究问题主要来自个人实践、受他人研究的启发、目前或未来需要探讨的问题、研究者个人兴趣；研究假设不是问题来源。"},{"i":"2022_10_multi_23","t":"multi","s":"自变量的特征包括","c":"护理研究的基本程序","sc":2,"o":{"A":"它必须是跟随因变量的变化而变化","B":"它的变化会导致研究对象发生反应","C":"它是根据需要，有待观测的因素","D":"它的变化能够被研究者所操纵控制","E":"它的变化是受计划安排，系统性变化的"},"a":"BDE","e":"自变量特征：其变化会导致研究对象发生反应；能被研究者操纵控制；变化受计划安排、系统性变化。A、C为因变量特征。"},{"i":"2022_10_multi_24","t":"multi","s":"理想的理论框架或概念框架图应具备的特征有","c":"确立研究问题","sc":2,"o":{"A":"通识性","B":"全面性","C":"逻辑性","D":"指导性","E":"新颖性"},"a":"CD","e":"理想框架的两个主要特征是逻辑性（反映概念或变量间逻辑关系）和指导性（能指导研究设计）。"},{"i":"2022_10_multi_25","t":"multi","s":"属于文献外表特征的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"著者姓名","B":"题名","C":"学科分类","D":"刊名","E":"文献主题"},"a":"ABD","e":"文献外表特征包括著者姓名、题名、刊名、会议名等；学科分类、文献主题属内容特征。"},{"i":"2022_10_multi_26","t":"multi","s":"任何实验性研究中都必须具备的内容有","c":"护理研究设计","sc":2,"o":{"A":"干预","B":"设对照组","C":"盲法","D":"随机取样和随机分组","E":"大样本"},"a":"ABD","e":"实验性研究必须具备三项基本内容：干预（操纵）、设立对照、随机化（随机取样和随机分组）。盲法、大样本不是必备内容。"},{"i":"2022_10_multi_27","t":"multi","s":"下列对于预试验的描述正确的有","c":"护理研究的基本程序","sc":2,"o":{"A":"检查课题花费是否合理","B":"摸清和熟悉研究条件","C":"核实样本量的估计是否合适","D":"明确收集资料的方法是否可行","E":"预试验的样本量一般为研究设计总样本量的30%～40%"},"a":"BCD","e":"预试验目的包括检查研究设计是否切合实际（含资料收集方法可行性）、核实样本量估计是否合适、摸清熟悉研究条件、统一方法减少误差；预试验样本量约为总样本量10%～20%，E错；A“检查花费是否合理”教材未列为目的。"},{"i":"2022_10_multi_29","t":"multi","s":"下列资料中属于等级资料的有","c":"研究资料的分析方法","sc":2,"o":{"A":"性别（男、女）","B":"满意度（非常满意、一般、不满意）","C":"身高（cm）","D":"文化程度（大专、本科、硕士及以上）","E":"职业（工人、农民、干部）"},"a":"BD","e":"等级资料是按属性不同程度分等级计数各组例数的资料，如满意度、文化程度；性别、职业为计数资料，身高为计量资料。"},{"i":"2022_10_multi_30","t":"multi","s":"研究工具的信度的主要特征包括","c":"研究工具性能的测定","sc":2,"o":{"A":"稳定性","B":"等同性","C":"内在一致性","D":"预测性","E":"关联性"},"a":"ABC","e":"信度的3个主要特征为稳定性、内在一致性、等同性。"},{"i":"2022_10_multi_31","t":"multi","s":"校标关联效度包括","c":"研究工具性能的测定","sc":2,"o":{"A":"同时效度","B":"结构效度","C":"表面效度","D":"预测效度","E":"内容效度"},"a":"AD","e":"效标关联效度分同时效度（工具与现有标准相关）和预测效度（对未来情况的预测），二者主要区别在时间上。"},{"i":"2022_10_multi_32","t":"multi","s":"下列有关问卷内容的排列顺序正确的描述有","c":"资料收集的方法","sc":2,"o":{"A":"问卷应从一般性的问题开始","B":"敏感的问题放在问卷的前面","C":"同一主题的问题应集中在一起","D":"开放式问题放在问卷的最后","E":"对排列时有跳跃的问题应明确标明如何填写"},"a":"ACDE","e":"问卷宜从一般/易答问题开始、逐步过渡到敏感问题（敏感问题靠后，B错）；同一主题问题集中；开放式问题放最后；有跳跃的问题应标明如何填写。"},{"i":"2022_10_multi_33","t":"multi","s":"护理研究论文的文题的写作要求包括","c":"护理论文的撰写","sc":2,"o":{"A":"新颖","B":"切题","C":"简明","D":"规范","E":"尽量有副标题"},"a":"ABCD","e":"文题要求新颖、切题、简明、规范；副标题仅在必须长题时用破折号补充，并非“尽量有”。"},{"i":"2022_10_term_36","t":"term","s":"半结构式访谈","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：半结构式访谈是指按事先准备的访谈大纲进行，研究者只部分控制访谈进展，鼓励研究对象就某一主题自由谈论，当回答表浅时再引导深入。它比结构式访谈可能获得更多信息，又能在一定程度上避免偏题。","e":""},{"i":"2022_10_term_37","t":"term","s":"同时效度","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：同时效度是效标关联效度的一种，指研究工具与现有测量标准（效标）之间的相关程度，如以口温为标准计算腋温与口温的相关。一般认为相关系数≥0.70即工具质量较好、可接受。它与预测效度的主要区别在于时间上的差异。","e":""},{"i":"2022_10_short_40","t":"short","s":"简述文献检索方法中的抽查法。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：抽查法是工具法（常用法）的一种，指针对学科发展兴旺、文献发表集中的某个年代，抽出一段时间重点进行检索。其优点是检索效率高、省时；缺点是必须熟悉该学科发展的历史和特点，否则难以选准文献集中的年代。","e":""},{"i":"2022_10_short_41","t":"short","s":"简述绘制线图时的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：①线图以线段升降表示某事物随另一事物（通常为时间等连续性变量）数值变化的趋势；②横轴通常为时间或连续性变量，纵轴为统计指标，相邻两点用直线连接（不用光滑曲线）；③纵轴为算术尺度时一般以0为起点；④用不同线条或色调代表不同事物时须附图例说明。","e":""},{"i":"2022_10_short_42","t":"short","s":"简述综述论文选题时的注意事项。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：①题目要明确具体，选题范围不宜太大，越具体越容易收集文献、越容易深入；②题目要结合自己的工作，在自己熟悉的工作范围内才能写出切合实际的文章；③要注意客观条件，确定文献来源是否充足、是否有保证；④题目要有创新、有实用价值。","e":""},{"i":"2022_10_short_43","t":"short","s":"简述结构效度反映的内容。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：结构效度重点了解研究工具的内在属性，回答“该工具到底在测量什么”“能否测量出想研究的抽象概念”，反映工具与其所依据的理论或概念框架相结合的程度。概念越抽象越难建立结构效度；结构效度建立最复杂，数字计算应用最多的是因子分析，通过因子分析看条目关系是否体现所测概念或概念框架。","e":""},{"i":"2022_10_application_44","t":"application","s":"某研究者欲调查某医院不同职称护士对心肺复苏术的操作熟悉程度，准备抽取40人的样本进行检测，请你为这位研究者设计定额抽样的具体步骤并解释定额抽样的优点。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：\n一、定额抽样（配额抽样）具体步骤：①先将该医院护士按职称这一特征分成不同类别，如护师、主管护师、副主任护师、主任护师；②统计各类别护士占全院护士总数的比例，例如护师、主管护师、副主任护师、主任护师分别占60%、25%、10%、5%；③按40人样本量和各类别所占比例，分配各类别应抽取的人数：护师40×60%≈24人、主管护师40×25%=10人、副主任护师40×10%=4人、主任护师40×5%=2人；④在每一类别内采用方便抽样的方法就近选取相应人数，最后把各类别抽出的对象合并组成40人的研究样本。\n二、定额抽样的优点：定额抽样是在方便抽样的基础上增加了分层配额的抽样策略，注重样本与总体在结构比例上的一致性，因此其代表性比单纯方便抽样强，且简便易行、节省时间和费用。","e":""}]},{"key":"2023_4","name":"2023年4月","qs":[{"i":"2023_4_single_1","t":"single","s":"伦理审查委员会的成员数不应少于","c":"绪论","sc":1,"o":{"A":"9名","B":"7名","C":"5名","D":"3名"},"a":"C","e":"每个IRB至少由5名具有不同文化、经济、教育、性别和种族背景的成员组成。"},{"i":"2023_4_single_2","t":"single","s":"探讨有关领导方式、护理人员合理配置和人才流动等方面的问题的研究属于","c":"绪论","sc":1,"o":{"A":"护理教育的研究","B":"护理管理的研究","C":"护理学历史的研究","D":"护理理论研究"},"a":"B","e":"护理管理研究涉及护理领导、人员配置、人才流动等管理问题。"},{"i":"2023_4_single_3","t":"single","s":"在研究中，性别（男、女）、药物反应（阴性和阳性）等变量属于","c":"护理研究的基本程序","sc":1,"o":{"A":"数值变量","B":"连续型变量","C":"有序分类变量","D":"无序分类变量"},"a":"D","e":"性别、药物反应（阴/阳）等互不相容、无程度顺序的类别属无序分类变量（二项分类）。"},{"i":"2023_4_single_4","t":"single","s":"对两个或两个以上的概念之间所存在的某种关系的阐述是","c":"确立研究问题","sc":1,"o":{"A":"概念","B":"命题","C":"理论","D":"框架"},"a":"B","e":"命题是对两个或两个以上的概念之间所存在的某种关系的阐述。"},{"i":"2023_4_single_5","t":"single","s":"按照书或刊名的字顺，遵循一定的排列顺序编制而成的目录是","c":"医学信息的获取与利用","sc":1,"o":{"A":"分类目录","B":"书名目录","C":"著者目录","D":"主题目录"},"a":"B","e":"书名目录是利用书刊名称、按字顺查找文献的目录。"},{"i":"2023_4_single_6","t":"single","s":"利用文献的各种代码、数字编制而成的索引来查找文献，这种文献检索途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"书名途径","B":"著者途径","C":"序号途径","D":"分类途径"},"a":"C","e":"序号途径是利用专利号、标准号、国际标准书号等代码数字查找文献的途径。"},{"i":"2023_4_single_7","t":"single","s":"在MEDLINE中，著者姓名的缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AB","B":"AD","C":"AI","D":"AU"},"a":"D","e":"MEDLINE字段AU—Author(s)—著者姓名；AB为文摘、AD为著者地址、AI为文摘标识。"},{"i":"2023_4_single_8","t":"single","s":"进行文献检索的第一步是","c":"医学信息的获取与利用","sc":1,"o":{"A":"分析检索课题，明确检索目的","B":"选择检索工具，确定检索方法","C":"选择检索途径，确定检索标识","D":"查找文献线索"},"a":"A","e":"文献检索基本步骤第一步是分析检索课题、明确检索目的（确定学科范围、文献类型、回溯年限）。"},{"i":"2023_4_single_9","t":"single","s":"无论是实验性研究还是类实验性研究，都必须具备的设计内容是","c":"护理研究设计","sc":1,"o":{"A":"随机分组","B":"干预措施","C":"设立对照","D":"随机抽样"},"a":"B","e":"实验性研究和类实验性研究设计中都一定有对研究对象的护理干预措施；区别在随机分组、设立对照。"},{"i":"2023_4_single_10","t":"single","s":"研究者欲开展两种肢体功能锻炼方法对于老年脑卒中患者偏瘫侧肢体功能恢复效果的研究，将发生脑卒中后3个月的老年患者随机分为两组，对照组采用传统的使用器械的肢体功能锻炼法，实验组采用在水中进行的肢体功能锻炼法。研究开展3个月，然后比较两组老年脑卒中患者偏瘫侧的肢体功能恢复情况。此种对照是","c":"护理研究设计","sc":1,"o":{"A":"组间对照","B":"自身对照","C":"配对对照","D":"历史对照"},"a":"A","e":"相比较的两组数据来自两组不同的受试者、分别接受不同处理后比较，属组间对照。"},{"i":"2023_4_single_11","t":"single","s":"强调通过系统地收集资料同时分析资料进而产生理论的过程，此质性研究方法是","c":"护理研究设计","sc":1,"o":{"A":"人种学研究法","B":"根基理论研究法","C":"现象学研究法","D":"行动研究法"},"a":"B","e":"根基理论研究强调通过系统地收集资料同时分析资料进而产生理论的过程，由具体到抽象建立理论。"},{"i":"2023_4_single_12","t":"single","s":"对于寻找某些特殊总体中的个体时，非常有用的非概率抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"理论抽样","B":"目的抽样","C":"滚雪球抽样","D":"方便抽样"},"a":"C","e":"滚雪球（网络）抽样通过最初研究对象推荐、像滚雪球一样扩大样本，适合总体范围不清、难以寻找的特殊人群。"},{"i":"2023_4_single_13","t":"single","s":"下列对于自设问卷过程中的注意事项的描述正确的是","c":"资料收集的方法","sc":1,"o":{"A":"敏感的问题一般放在问卷的最末","B":"针对儿童的问卷完成时间不应超过20分钟","C":"问卷中的问题应全部是正向提问","D":"问卷中的文字尽量使用专业术语"},"a":"A","e":"敏感问题一般放在问卷后面；儿童问卷完成时间不超过15分钟（B错）；应把部分问题反向提问（C错）；文字应简洁通顺、忌用专业术语（D错）。"},{"i":"2023_4_single_14","t":"single","s":"某研究者欲研究青少年在愤怒和平静状态下的血压变化，他应该采用的资料收集的方法是","c":"资料收集的方法","sc":1,"o":{"A":"档案记录法","B":"访谈法","C":"生物医学测量法","D":"观察法"},"a":"C","e":"生物医学测量法可测量与护理有关的基本生理过程，如愤怒与平静状态下的血压变化。"},{"i":"2023_4_single_15","t":"single","s":"某护士在进行某一研究工具的性能测定时，需计算该研究工具的复本信度的情况是","c":"研究工具性能的测定","sc":1,"o":{"A":"当不同评定者使用相同工具，同时测量相同对象时","B":"当两个大致相同的研究工具同时被用于研究对象时","C":"当判断研究工具是否包括足够的项目时","D":"当了解研究工具的内在属性时"},"a":"B","e":"复本信度指两个大致相同（形式不同、内容相同）的研究工具同时用于研究对象时计算其得分相关。A为评定者间信度。"},{"i":"2023_4_single_16","t":"single","s":"某护士研究用人的应激控制能力来预测其未来的健康状况，表示这个应激控制量表的效度是","c":"研究工具性能的测定","sc":1,"o":{"A":"同时效度","B":"表面效度","C":"预测效度","D":"结构效度"},"a":"C","e":"预测效度指测量工具作为未来情况预测指标的有效程度，如用应激控制能力预测未来健康状况。"},{"i":"2023_4_single_17","t":"single","s":"某护士针对正态分布的计量资料计划进行两个独立样本的比较，使用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"Pearson相关分析","B":"单样本t检验","C":"Kendall相关分析","D":"独立样本t检验"},"a":"D","e":"两个独立样本均数比较、资料为正态分布计量资料时用两独立样本t检验。"},{"i":"2023_4_single_18","t":"single","s":"某护士以60岁为界对调查对象进行分组，分为老年组和非老年组，并计数各组的人数。这样的资料是","c":"研究资料的分析方法","sc":1,"o":{"A":"计数资料","B":"等级资料","C":"计量资料","D":"定量资料"},"a":"A","e":"年龄本是计量资料，以60岁为界分老年组与非老年组并计数人数即转化为计数资料。"},{"i":"2023_4_single_19","t":"single","s":"对护理研究论文文题的要求不包括","c":"护理论文的撰写","sc":1,"o":{"A":"新颖","B":"切题","C":"简明","D":"广泛"},"a":"D","e":"文题要求新颖、切题、简明、规范，一般不超过20个汉字；不要求“广泛”。"},{"i":"2023_4_single_20","t":"single","s":"文献综述所引用的文献一般是近3~5年内发表的文献，这反映的文献综述论文的特征是","c":"护理论文的撰写","sc":1,"o":{"A":"信息性","B":"客观性","C":"新颖性","D":"评述性"},"a":"C","e":"综述的新颖性指引用文献一般是近3～5年内发表的，国内期刊要求近3年占70%以上。"},{"i":"2023_4_multi_21","t":"multi","s":"研究伦理中有益的原则包括","c":"绪论","sc":2,"o":{"A":"免于遭受伤害或不适的权利","B":"充分认知的权利","C":"不被剥削或利用的权利","D":"公平治疗的权利","E":"自主决定权"},"a":"AC","e":"有益的原则包括研究对象免于遭受伤害或不适的权利、不被剥削或利用的权利。B、E属尊重人的尊严原则，D属公正原则。"},{"i":"2023_4_multi_22","t":"multi","s":"在选择研究指标（也称观察项目）过程中，要注意","c":"护理研究的基本程序","sc":2,"o":{"A":"全面性","B":"准确性","C":"客观性","D":"灵敏性","E":"可行性"},"a":"BCDE","e":"选择观察项目应注意准确性与特异性、客观性、灵敏性、可行性，通常选用多个指标。"},{"i":"2023_4_multi_23","t":"multi","s":"研究假设的特征包括","c":"确立研究问题","sc":2,"o":{"A":"变量间关系的陈述","B":"可测量性","C":"文献支持或理论基础","D":"简洁、具体且概念清晰","E":"不容易被验证"},"a":"ABCD","e":"好的假设应具备四个特征：陈述变量间关系、可测量、有文献支持或理论基础、简洁具体且概念清晰。"},{"i":"2023_4_multi_24","t":"multi","s":"理论/概念框架的作用有","c":"确立研究问题","sc":2,"o":{"A":"统领文献知识","B":"提出一个预期性的研究结果","C":"呈现研究相关概念及概念间关系","D":"呈现研究设计方法","E":"作为研究结果整理、分析与解释的依据"},"a":"ACDE","e":"理论/概念框架作用：统领文献知识；呈现研究相关概念及概念间关系；呈现研究设计方法；作为研究结果整理、分析与解释的依据。B是假设的内容。"},{"i":"2023_4_multi_25","t":"multi","s":"按照文献的内容性质将其分为","c":"医学信息的获取与利用","sc":2,"o":{"A":"一次文献","B":"二次文献","C":"三次文献","D":"特种文献","E":"微缩型文献"},"a":"ABC","e":"按内容性质（级别）分为一次、二次、三次文献；特种文献按出版形式分，微缩型按外在物质形态分。"},{"i":"2023_4_multi_26","t":"multi","s":"在选择研究设计类型时，除了要考虑研究的目的之外，还应考虑的因素有","c":"护理研究设计","sc":2,"o":{"A":"研究中是否有护理干预","B":"研究的结果是否需要进行比较","C":"在研究中如何控制外变量","D":"研究小组的人员是否充足","E":"研究过程中需要收集数据的次数"},"a":"ABCE","e":"确定量性研究设计类型时考虑：研究目的、是否有护理干预、结果是否需要比较、如何控制外变量、需收集几次数据。"},{"i":"2023_4_multi_27","t":"multi","s":"下列偏倚类型中属于信息性偏倚的有","c":"护理研究设计","sc":2,"o":{"A":"无应答偏倚","B":"回忆偏倚","C":"入院率偏倚","D":"报告偏倚","E":"测量偏倚"},"a":"BDE","e":"信息性偏倚分回忆偏倚、报告偏倚、诊断怀疑偏倚、测量偏倚4种；无应答偏倚、入院率偏倚属选择性偏倚。"},{"i":"2023_4_multi_28","t":"multi","s":"导致邮寄问卷法回收率较低的主要原因有","c":"资料收集的方法","sc":2,"o":{"A":"研究者与研究对象缺乏直接的沟通","B":"研究对象对问卷内容不感兴趣","C":"未对研究对象提供完成问卷后的礼物","D":"问卷邮寄过程中出现了一些问题","E":"研究对象由于某种原因忽略或忘记填写并寄回问卷"},"a":"ABDE","e":"教材列出回收率低的主要原因：研究者与对象缺乏直接沟通；对象对内容不感兴趣；对象因工作忙等忽略或忘记填写寄回；邮寄过程中出现问题。"},{"i":"2023_4_multi_29","t":"multi","s":"下列属于访谈中的开放性问题的有","c":"资料收集的方法","sc":2,"o":{"A":"您为什么有这种感受？","B":"这么做您还有其他原因吗？","C":"您术后第一次下地活动时困难吗？","D":"您觉得伤口痛吗？","E":"您能举个例子说明一下吗？"},"a":"ABE","e":"开放性问题让对象自由阐述；C“困难吗”、D“痛吗”为是/否式封闭式问题。"},{"i":"2023_4_multi_30","t":"multi","s":"可减少抽样误差的方式包括","c":"研究资料的分析方法","sc":2,"o":{"A":"选择变异程度较大的研究指标","B":"增加样本量到适当水平","C":"选择变异程度较小的研究指标","D":"减少样本量到适当水平","E":"采取随机抽样的方法"},"a":"BCE","e":"降低抽样误差：尽量随机抽样提高代表性；增加样本量到适当水平；选择变异程度小的研究指标。"},{"i":"2023_4_multi_31","t":"multi","s":"对于偏态分布的计量资料，比较组间差异的统计学方法是","c":"研究资料的分析方法","sc":2,"o":{"A":"单样本秩和检验","B":"Mann-Whitney U检验","C":"单因素方差分析","D":"Kruskal-Wallis秩和检验","E":"配对t检验"},"a":"BD","e":"偏态分布计量资料组间比较用秩和检验（非参数）：两独立样本用Mann-Whitney U检验，多个独立样本用Kruskal-Wallis H检验。"},{"i":"2023_4_multi_33","t":"multi","s":"护理经验论文正文部分的基本格式要求包括","c":"护理论文的撰写","sc":2,"o":{"A":"前言","B":"临床资料与方法","C":"个案评估","D":"结果/护理效果","E":"讨论与分析"},"a":"ABDE","e":"护理经验论文正文由前言、临床资料与方法、护理效果、讨论与分析组成；个案评估属个案论文内容。"},{"i":"2023_4_term_34","t":"term","s":"质性研究","c":"护理研究的基本程序","sc":4,"at":"参考答案（要点）：质性研究是研究者凭借研究对象的主观资料，并进入当事人的环境中参与分析资料，观察、记录、分析、解释人类生活过程中不同层次的共同特性和内涵，用文字描述报告结果的研究方法。常用方法有现象学研究、根基理论研究、人种学研究等。","e":""},{"i":"2023_4_term_35","t":"term","s":"系统误差","c":"护理研究设计","sc":4,"at":"参考答案（要点）：系统误差又称偏倚，指研究结果系统地偏离了真实情况，即使增加测量人数也无法降低；它与随机误差不同，是研究中可以克服、也应当努力克服的误差，具有方向性（正偏倚或负偏倚）。","e":""},{"i":"2023_4_term_36","t":"term","s":"参与性观察者","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：参与性观察者指观察者作为参与者进入观察领域，但活动以观察为主、参与为辅。因被观察者知道自己在被观察而可能刻意改变行为，影响结果真实性，需延长观察时间、建立自然互动关系才能获得真实资料。","e":""},{"i":"2023_4_term_38","t":"term","s":"相对比","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：相对比是两个相关指标之比，说明两指标间的比例关系，以倍数或百分数表示，是计数资料常用的描述性相对数指标之一。","e":""},{"i":"2023_4_short_40","t":"short","s":"简述选择研究问题的注意事项。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：①选择对临床有指导意义的问题，要立足于创新，避免完全重复别人的工作；②选题范围不可太大，研究问题要具体明确，一个题目最好集中解决1～2个问题；③研究问题要有可行性，受时间、经费、人力、技术、伦理等条件限制；④最好结合自己熟悉的专业选题，能够掌控、有把握顺利进行。","e":""},{"i":"2023_4_short_41","t":"short","s":"简述档案记录收集法的优缺点。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：优点：经济、无需研究对象合作、无应答偏差。缺点：可收集的资料有一定选择性、可能不够完整；并可能涉及伦理问题——无论资料公开与否，研究者都必须遵守职业道德，尊重、保护当事人的隐私权。","e":""},{"i":"2023_4_short_42","t":"short","s":"简述在使用重测信度时需考虑的事项。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：①两次测量之间的间隔时间：间隔要足够长使第一次测量不影响第二次（避免凭记忆作答），但也不能太长以免客观情况改变，一般建议间隔2～3周以上；②研究工具所测量变量的性质：只适用于个性、价值观、体重等性质相对稳定的变量，态度、行为、情感等不稳定变量不宜用重测信度；③测量环境的一致：保持相同测试者、测量程序、测量时间及相似周围环境，减少外变量干扰。","e":""},{"i":"2023_4_short_43","t":"short","s":"简述撰写护理研究论文中讨论部分需要注意的事项。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：①以结果为基础抓重点、层次分明；②与前人结果比较、分析异同原因、提炼创新点和实践指导意义；③结合相关理论陈述论点；④避免重复描述结果或大量罗列文献而看不出自身观点；⑤结论应慎重，最好不单列结论项而结合在讨论中叙述。","e":""},{"i":"2023_4_application_44","t":"application","s":"请根据统计表的绘制要求指出下面的统计表中格式不当之处。\n表1 某基层医院医师和护士论文发表情况\n（表结构：左上角为斜线对角标目“期刊类别/人员”；纵标目分两层，上层为护士、医师，下层各为例数、百分比；横标目为核心期刊、非核心期刊。数据：核心期刊护士例数12、百分比10%，医师例数27、百分比22.5%；非核心期刊护士例数7、百分比5.8%，医师例数21、百分比17.5%。）","c":"研究资料的分析方法","sc":10,"at":"参考答案（要点）：\n该统计表主要有以下格式不当之处：\n①左上角使用了斜线（对角线）。规范的统计表采用三线表，不应有斜线；\n②表内竖线、横线过多。三线表一般只保留顶线、底线和纵标目与数字之间的分隔线，不应有竖线和多余的横线；\n③百分比单位“%”在每个数据格中重复写出。单位应统一标注在纵标目（如“百分比/%”）中，数字本身不再重复写%；\n④（补充）数字应同一列个位对齐、小数位数一致，表题应写在表上方中央（本题表题位置正确）。","e":""}]},{"key":"2023_10","name":"2023年10月","qs":[{"i":"2023_10_single_1","t":"single","s":"科学精神最根本的一条就是","c":"绪论","sc":1,"o":{"A":"自愿","B":"客观","C":"实事求是","D":"公平合理"},"a":"C","e":"教材明确指出：科学精神最根本的一条就是实事求是。"},{"i":"2023_10_single_2","t":"single","s":"在临床中，对护理技术、特护措施、护患关系等方面的研究属于","c":"绪论","sc":1,"o":{"A":"护理理论研究","B":"护理管理的研究","C":"各专科临床护理研究","D":"护理学历史的研究"},"a":"C","e":"护理技术、特护措施、护患关系等临床实践问题属各专科临床护理研究范畴。"},{"i":"2023_10_single_3","t":"single","s":"在研究中，身高（cm）、体重（kg）、脉搏（次/min）等属于","c":"护理研究的基本程序","sc":1,"o":{"A":"数值变量","B":"定性变量","C":"有序分类变量","D":"无序分类变量"},"a":"A","e":"身高、体重、脉搏等变量值是数值大小、有度量衡单位，属数值变量（定量变量）。"},{"i":"2023_10_single_4","t":"single","s":"反映研究变量及其相互关系的一种逻辑的、抽象的结构是","c":"确立研究问题","sc":1,"o":{"A":"理论","B":"概念","C":"框架","D":"命题"},"a":"C","e":"框架是对研究变量及其相互关系的一种逻辑的、抽象的结构。"},{"i":"2023_10_single_5","t":"single","s":"按照学科内部逻辑次序排列，从总论到各论，从一般到具体，从低级到高级进行编排的目录是","c":"医学信息的获取与利用","sc":1,"o":{"A":"主题目录","B":"著者目录","C":"书名目录","D":"分类目录"},"a":"D","e":"分类目录按学科分类体系、从总论到各论层层展开排列。"},{"i":"2023_10_single_6","t":"single","s":"查找文献最方便的文献检索途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"分类途径","B":"书名途径","C":"序号途径","D":"著者途径"},"a":"B","e":"书名途径是利用书刊名称查找文献，是最方便的检索途径。"},{"i":"2023_10_single_7","t":"single","s":"在MEDLINE中，文摘的缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AU","B":"AI","C":"AD","D":"AB"},"a":"D","e":"MEDLINE字段AB—Abstract—文摘；AU为著者、AI为文摘标识、AD为著者地址。"},{"i":"2023_10_single_8","t":"single","s":"文献检索时的核心步骤是","c":"医学信息的获取与利用","sc":1,"o":{"A":"查找文献线索","B":"获取原始文献","C":"选择检索工具，确定检索方法","D":"分析检索课题，明确检索目的"},"a":"A","e":"文献检索步骤中，查找文献线索是核心步骤。"},{"i":"2023_10_single_9","t":"single","s":"某护士在正式开始研究之前要进行一个预试验，他估算的正式研究中所需的总样本量为200例，根据预试验中样本量确定的原则，他在预试验中可以选择的样本量为","c":"护理研究设计","sc":1,"o":{"A":"10例","B":"15例","C":"25例","D":"50例"},"a":"C","e":"预试验样本量一般为总样本量的10%～20%；200例的10%～20%即20～40例，选项中25例落在此范围。"},{"i":"2023_10_single_10","t":"single","s":"检验因果假设最有说服力的研究设计是","c":"护理研究设计","sc":1,"o":{"A":"类实验性研究","B":"根基理论研究","C":"实验性研究","D":"现象学研究"},"a":"C","e":"实验性研究通过随机和对照最大限度控制外变量，是检验因果假设最有说服力的设计。"},{"i":"2023_10_single_11","t":"single","s":"某护士欲使用概率抽样方法进行研究中的抽样，如果希望抽样误差最小，他应该选择的抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"整群抽样","B":"系统抽样","C":"单纯随机抽样","D":"分层抽样"},"a":"D","e":"四种概率抽样方法抽样误差由小到大依次为：分层抽样＜系统抽样＜单纯随机抽样＜整群抽样。"},{"i":"2023_10_single_12","t":"single","s":"某护士正在进行艾滋病患者自我照护经历的质性研究，她先访问了一位艾滋病患者，然后由该患者推荐，再访问第二人，访问第二人后，由第二位患者推荐，再访问第三人，如此继续下去，最终访谈了11位艾滋病患者。该护士采用的抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"目的抽样","B":"理论抽样","C":"滚雪球抽样","D":"定额抽样"},"a":"C","e":"由最初研究对象推荐、介绍同类对象陆续纳入，像滚雪球一样扩大样本，属滚雪球（网络）抽样。"},{"i":"2023_10_single_13","t":"single","s":"档案记录收集法的缺点是","c":"资料收集的方法","sc":1,"o":{"A":"涉及伦理问题","B":"存在应答偏差","C":"花费较大","D":"需要研究对象合作"},"a":"A","e":"档案记录法优点是经济、无需研究对象合作、无应答偏差；缺点是资料有选择性、可能不完整，并可能涉及伦理问题。"},{"i":"2023_10
