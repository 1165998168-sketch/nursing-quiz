_single_14","t":"single","s":"某护士通过邮寄问卷的方法进行资料的收集，较为满意的问卷回收率至少应达到","c":"资料收集的方法","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"B","e":"邮寄问卷一般回收率60%以上较满意。"},{"i":"2023_10_single_15","t":"single","s":"常用来表示研究工具稳定性的是","c":"研究工具性能的测定","sc":1,"o":{"A":"折半信度","B":"重测信度","C":"复本信度","D":"评定者间信度"},"a":"B","e":"重测信度反映工具的稳定性；折半信度、Cronbach'α反映内在一致性，复本信度、评定者间信度反映等同性。"},{"i":"2023_10_single_16","t":"single","s":"某护士自设哮喘患者自理行为问卷，欲了解该问卷中的条目关系是否体现此问卷所测量的自理行为概念，需测量","c":"研究工具性能的测定","sc":1,"o":{"A":"表面效度","B":"同时效度","C":"结构效度","D":"预测效度"},"a":"C","e":"结构效度重点了解工具内在属性，看条目关系是否体现所测概念或概念框架，常用因子分析。"},{"i":"2023_10_single_17","t":"single","s":"某护士计划针对偏态分布的计量资料进行两变量间相关性分析，应使用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"Kendall相关分析","B":"单样本t检验","C":"Pearson相关分析","D":"独立样本t检验"},"a":"A","e":"偏态/等级资料的相关分析用非参数的等级相关（Spearman/Kendall）；Pearson相关要求两变量均正态分布。"},{"i":"2023_10_single_18","t":"single","s":"某护士在研究中使用焦虑自评量表，根据评分标准，以40分为界，将总分转化为无焦虑和有焦虑，并分别计算两组的例数。这样的资料是","c":"研究资料的分析方法","sc":1,"o":{"A":"计数资料","B":"等级资料","C":"计量资料","D":"定量资料"},"a":"A","e":"焦虑量表总分本是计量资料，以40分为界转化为无焦虑、有焦虑两组并计数例数，即成为计数资料。"},{"i":"2023_10_single_19","t":"single","s":"护理研究论文基本属性中最重要的是","c":"护理论文的撰写","sc":1,"o":{"A":"实用性","B":"科学性","C":"先进性","D":"可读性"},"a":"B","e":"科学性是科研论文基本属性中最重要的，是科研论文的根本和生命。"},{"i":"2023_10_single_20","t":"single","s":"某护理研究者对采用母乳、牛乳、混合乳三种不同方式喂养的268例健康婴儿的头发样品进行微量元素测定，研究论文题目为“对不同喂养方式婴儿头发中微量元素含量的比较”。这个文题反映了护理研究论文的题目所需遵循的原则是","c":"护理论文的撰写","sc":1,"o":{"A":"切题","B":"客观","C":"新颖","D":"广泛"},"a":"A","e":"该题目把三种喂养方式的比较都概括进去，与研究内容相符，体现了文题“切题”（准确概括主要内容、不题不符文）的原则。"},{"i":"2023_10_multi_21","t":"multi","s":"在以人为研究对象的研究中所遵循的尊重人的尊严的伦理原则包括","c":"绪论","sc":2,"o":{"A":"隐私权","B":"自主决定权","C":"公平治疗的权利","D":"充分认知的权利","E":"不被剥削或利用的权利"},"a":"BD","e":"尊重人的尊严原则包括研究对象的自主决定权和充分认知的权利；隐私权、公平治疗权属公正原则，不被剥削属有益原则。"},{"i":"2023_10_multi_22","t":"multi","s":"研究所选指标的准确性是指所选指标能够准确反映研究的内容，且具有特异性。如判断泌尿系感染，下列属于特异性指标的有","c":"护理研究的基本程序","sc":2,"o":{"A":"体温","B":"尿急","C":"尿频","D":"尿痛","E":"血常规"},"a":"BCD","e":"尿急、尿频、尿痛（尿路刺激征）是反映泌尿系感染的特异性指标；体温、血常规为全身性、非特异性指标。"},{"i":"2023_10_multi_24","t":"multi","s":"理想的理论框架或概念框架图应具备的特征包括","c":"确立研究问题","sc":2,"o":{"A":"逻辑性","B":"全面性","C":"唯一性","D":"指导性","E":"普遍性"},"a":"AD","e":"理想框架的两个主要特征是逻辑性和指导性。"},{"i":"2023_10_multi_25","t":"multi","s":"文献的类型按照文献的出版形式可划分为","c":"医学信息的获取与利用","sc":2,"o":{"A":"图书","B":"期刊","C":"报纸","D":"特种文献","E":"微缩型文献"},"a":"ABCD","e":"按出版形式分为图书、期刊、报纸、特种文献；微缩型文献是按外在物质形态划分。"},{"i":"2023_10_multi_26","t":"multi","s":"某护士欲开展一项实验性研究，在其科研设计中必须具备的内容有","c":"护理研究设计","sc":2,"o":{"A":"干预","B":"随机化","C":"盲法","D":"设立对照","E":"分层"},"a":"ABD","e":"实验性研究必须具备干预、设立对照、随机化（随机取样和随机分组）三项基本内容；盲法、分层不是必备。"},{"i":"2023_10_multi_28","t":"multi","s":"下列对自设问卷时的用词要求的描述，正确的有","c":"资料收集的方法","sc":2,"o":{"A":"清晰","B":"考虑教育程度较高者是否能理解","C":"不要暗示答案","D":"敏感性问题可以用第一人称进行询问","E":"问题应无倾向性"},"a":"ACE","e":"问卷用词要求清晰、适合被问者文化程度（应考虑文化程度最低者，B错）、不暗示答案、问题无倾向性；敏感问题宜用第三人称表述（D错）。"},{"i":"2023_10_multi_30","t":"multi","s":"关于预测效度，下列陈述正确的有","c":"研究工具性能的测定","sc":2,"o":{"A":"是由评估人根据自己对所要测量的概念的理解来判断工具是否适当","B":"是指测量工具作为未来情况预测指标的有效程度","C":"是指研究工具与现有标准之间的相关","D":"重点是了解工具的内在属性","E":"属于校标关联效度"},"a":"BE","e":"预测效度属效标关联效度，指测量工具作为未来情况预测指标的有效程度；A为表面效度，C为同时效度，D为结构效度。"},{"i":"2023_10_multi_31","t":"multi","s":"对于正态分布的计量资料，比较组间差异的统计学方法有","c":"研究资料的分析方法","sc":2,"o":{"A":"单样本秩和检验","B":"Mann-Whitney U检验","C":"单因素方差分析","D":"Kruskal-Wallis秩和检验","E":"配对t检验"},"a":"CE","e":"正态分布计量资料组间比较用参数法：配对设计用配对t检验，3组及以上独立样本均数比较用单因素方差分析；秩和检验用于偏态/等级资料。"},{"i":"2023_10_multi_32","t":"multi","s":"护理研究者引进国外量表的步骤包括","c":"研究工具性能的测定","sc":2,"o":{"A":"翻译","B":"回译","C":"专家咨询","D":"等同性检验","E":"预试验"},"a":"ABD","e":"国外量表翻译应用的基本步骤为：翻译→回译→检测原量表与中文版之间的等同性。"},{"i":"2023_10_multi_33","t":"multi","s":"护理综述论文的特征包括","c":"护理论文的撰写","sc":2,"o":{"A":"信息性","B":"新颖性","C":"主观性","D":"综合性","E":"评述性"},"a":"ABDE","e":"综述论文特征为信息性、新颖性、综合性、评述性、客观性；“主观性”错误。"},{"i":"2023_10_term_34","t":"term","s":"外变量","c":"护理研究的基本程序","sc":4,"at":"参考答案（要点）：外变量指除研究者操纵的自变量外，另外一些能引起研究对象因变量变化的其他影响因素，它使研究者无法做出正确判断与解释，故也称干扰变量（如研究对象的性别、年龄、情绪等），科研设计中应尽量控制。","e":""},{"i":"2023_10_term_35","t":"term","s":"非实验性研究","c":"护理研究设计","sc":4,"at":"参考答案（要点）：非实验性研究指研究设计内容对研究对象不施加任何护理干预和处理的研究方法，常在完全自然状态下进行，适用于对所研究问题了解不多或该问题情况较复杂时选用。","e":""},{"i":"2023_10_term_37","t":"term","s":"样本","c":"护理研究设计","sc":4,"at":"参考答案（要点）：样本是从总体中随机抽取的部分观察单位，是实际测量值的集合，用样本信息推断总体特征。抽样时应遵循随机化原则并保证足够样本量以对总体具有代表性。","e":""},{"i":"2023_10_term_39","t":"term","s":"评定量表","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：评定量表是测量人们行为、态度等的量表形式，由一组有序排列的类别答案构成，调查对象根据填表要求选择符合情况的选项。","e":""},{"i":"2023_10_short_40","t":"short","s":"简述研究中的研究假设的作用。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：①研究假设的形成提供了研究的焦点，依据假设确定研究中自变量和因变量的种类、数目及其关系，从而确定研究方向和具体目标；②依据假设确定收集资料的方向、范围和方法；③依据假设确定处理与分析数据资料的方向、范围，以便验证假设；④研究假设可以使理论的形成更加完整，帮助填补知识体系的不足。","e":""},{"i":"2023_10_short_41","t":"short","s":"简述结构式访谈适用的情况。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：结构式访谈严格按事先准备好的书面程序进行，详细列出程序和具体内容，访谈中研究者严格控制进展。它适用于已有大量系统文献、只对规定内容感兴趣、需要严格控制访谈的情况；其结果规范但灵活性差。","e":""},{"i":"2023_10_application_44","t":"application","s":"某护理研究者欲探讨家庭康复指导对脑卒中患者日常生活能力的影响。将60例脑卒中出院患者分为两组，各30例。干预组定期家访，提供家庭康复指导；对照组不进行家访。3个月后，采用日常生活能力量表（ADL）对两组患者进行测评。结果：干预组患者ADL得分为30.45±4.82分，对照组为37.58±5.89分。计划分析家庭康复指导对改善患者日常生活能力是否有效。请回答：\n（1）本研究要分析的变量“ADL得分”是哪类资料？\n（2）两组的ADL得分均为正态分布，计划进行两组ADL得分的比较，选用的统计学方法是什么？选择此种统计学方法的依据是什么？\n（3）使用此统计学方法进行统计分析的具体步骤是什么？","c":"研究资料的分析方法","sc":10,"at":"参考答案（要点）：\n（1）ADL得分为量表总分，有具体数值和度量（分值），属于计量资料（定量资料）。\n（2）选用两独立样本t检验。依据：资料为计量资料；干预组与对照组为两个独立样本；两组ADL得分均呈正态分布；研究目的是比较两样本均数（干预组与对照组ADL得分）是否存在差异。\n（3）假设检验的具体步骤：①建立假设——H0为两总体均数相同（无差异），H1为两总体均数不同（有差异）；②确定检验水准α，通常取0.05；③计算统计量——根据资料类型计算t值；④确定P值（查t界值表或由统计软件给出）；⑤作出统计推断——若P＞α，不拒绝H0，认为差异无统计学意义；若P≤α，拒绝H0、接受H1，认为差异有统计学意义。","e":""}]},{"key":"2024_4","name":"2024年4月","qs":[{"i":"2024_4_single_2","t":"single","s":"某护士在研究中查阅了未经发表、未经系统加工整理的癌症患者的私人笔记，此类文献是","c":"医学信息的获取与利用","sc":1,"o":{"A":"零次文献","B":"一次文献","C":"二次文献","D":"三次文献"},"a":"A","e":"零次文献指未经发表或未进入社会交流、未经系统加工整理的最原始文献，如书信、手稿、私人笔记、实验记录等。"},{"i":"2024_4_single_3","t":"single","s":"关于自变量的特征，描述不正确的是","c":"护理研究的基本程序","sc":1,"o":{"A":"它的变化会导致研究对象发生反应","B":"它的变化能够被研究者所操纵控制","C":"它的变化是受结果影响的","D":"它的变化是受计划安排，系统性变化的"},"a":"C","e":"自变量不受结果影响，却可导致结果产生或影响结果；其变化受计划安排、可被研究者操纵控制。说它“受结果影响”不正确。"},{"i":"2024_4_single_4","t":"single","s":"某护士的研究假设是“饮酒对心血管病的发生率有影响”，这个假设是","c":"确立研究问题","sc":1,"o":{"A":"无效假设","B":"有方向性假设","C":"统计学假设","D":"无方向性假设"},"a":"D","e":"该假设明确变量间有关系但未指出方向（是升高还是降低），属于无方向性假设。无效假设即统计学假设，指出两变量间没有关系。"},{"i":"2024_4_single_5","t":"single","s":"某护士进行“体重对血压的影响”的研究，“血压”是","c":"护理研究的基本程序","sc":1,"o":{"A":"自变量","B":"因变量","C":"外变量","D":"干扰变量"},"a":"B","e":"体重是研究者操纵、观察其影响的自变量；血压随体重变化而变化，是拟观测的因变量（依变量）。"},{"i":"2024_4_single_6","t":"single","s":"MEDLINE数据库中AI是指","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘标识","B":"文摘","C":"著者姓名","D":"评论"},"a":"A","e":"MEDLINE字段中，AI—Abstract Indicator—文摘标识；AB—Abstract—文摘；AU—Author—著者姓名；CM—Comments—评论。"},{"i":"2024_4_single_7","t":"single","s":"某护士计划进行关于新生儿黄疸的相关研究，选择“黄疸”进行文献检索。该研究者采用的检索途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"分类途径","B":"主题途径","C":"关键词途径","D":"分类主题途径"},"a":"C","e":"关键词途径是直接从文献篇名或内容中抽取有实质意义、起关键作用的自然语言词进行检索，未经过主题词表规范化；直接选“黄疸”一词检索即关键词途径。"},{"i":"2024_4_single_8","t":"single","s":"与质性研究相比，量性研究运用的推理方法是","c":"护理研究设计","sc":1,"o":{"A":"类比推理","B":"演绎推理","C":"归纳推理","D":"辩证推理"},"a":"B","e":"量性研究建立在实证主义基础上，先有理论/假设再通过数据验证，主要运用演绎推理；质性研究多从资料中归纳产生理论，运用归纳推理。"},{"i":"2024_4_single_9","t":"single","s":"在研究正式开始之前进行预试验，其样本量一般为设计的总样本量的","c":"护理研究设计","sc":1,"o":{"A":"1%～5%","B":"10%～20%","C":"25%～30%","D":"30%～40%"},"a":"B","e":"预试验（pilot study）是正式研究前按设计做的小规模试验，样本量可为总样本量的10%～20%。"},{"i":"2024_4_single_10","t":"single","s":"在类实验性研究设计中一定有","c":"护理研究设计","sc":1,"o":{"A":"对照组","B":"随机取样","C":"干预","D":"盲法"},"a":"C","e":"类实验性研究与实验性研究相似，设计中一定有对研究对象的护理干预措施；不同之处是缺少随机分组，或没有设对照组，或两者都不具备。"},{"i":"2024_4_single_11","t":"single","s":"如果要研究有关癌症晚期患者照顾者的照顾体验，所选用的最适宜的研究方法是","c":"护理研究设计","sc":1,"o":{"A":"现象学研究","B":"根基理论研究","C":"人种学研究","D":"行动研究"},"a":"A","e":"现象学研究目的在于描述人们亲身的经历、捕捉研究对象的“真实体验”，适合探讨照顾体验等难以量化的主观经历；行动研究非本课程质性研究三类之一。"},{"i":"2024_4_single_13","t":"single","s":"访谈法的主要优点是","c":"资料收集的方法","sc":1,"o":{"A":"节约时间","B":"省钱","C":"应答率较高","D":"影响因素较少"},"a":"C","e":"访谈法优点包括应答率较高、适合不能填写问卷者、资料较完整丰富；缺点是费时、花费大、受人际互动影响因素较多。"},{"i":"2024_4_single_14","t":"single","s":"如欲研究青少年在愤怒和平静状态下的血压变化，应采用","c":"资料收集的方法","sc":1,"o":{"A":"问卷调查法","B":"观察法","C":"访谈法","D":"测量法"},"a":"D","e":"血压是借助仪器设备测得的客观生理指标，属于生物医学测量法（机体指标测量）。"},{"i":"2024_4_single_15","t":"single","s":"一位研究者欲检验其所构建的护理学生评判性思维能力量表的效度。她使用毕业护生的评判性思维能力来预测这些护生毕业后一年的临床护理能力。此时，她选择的效度类型是","c":"研究工具性能的测定","sc":1,"o":{"A":"内容效度","B":"表面效度","C":"同时效度","D":"预测效度"},"a":"D","e":"预测效度指测量工具作为未来情况预测指标的有效程度，即现在测得的结果与未来一段时间后的实际结果相比较；同时效度是与现有标准之间的同期相关。"},{"i":"2024_4_single_16","t":"single","s":"根据研究目的而确定的同质观察单位的全体是","c":"研究资料的分析方法","sc":1,"o":{"A":"样本","B":"抽样","C":"总体","D":"变异"},"a":"C","e":"总体是根据研究目的而确定的同质观察单位的全体；样本是从总体中随机抽取的部分观察单位。"},{"i":"2024_4_single_18","t":"single","s":"某护理部对医院中护理教师的学历进行了调查，欲使用统计图的形式进行学历构成比展示，最适宜的统计图是","c":"研究资料的分析方法","sc":1,"o":{"A":"线图","B":"圆图","C":"单式直条图","D":"复式直条图"},"a":"B","e":"圆图适用于构成比资料，以圆的总面积为100%，分割成若干扇面表示事物内部各部分所占比例。"},{"i":"2024_4_single_19","t":"single","s":"某研究者在进行国外量表的汉化，他请语言功底好、对原量表不知情的一位翻译者将翻译成中文的量表再翻译回去。这一过程被称为","c":"研究工具性能的测定","sc":1,"o":{"A":"授权","B":"翻译","C":"回译","D":"等同性检测"},"a":"C","e":"回译（back-translation）指请语言功底好、对原量表不知情的翻译者把中文量表再翻译回原语言，由双语专家与源量表比较并修改，反复直至一致。"},{"i":"2024_4_single_20","t":"single","s":"撰写论文的文题时，英文题目所包含的英文实词一般不超过","c":"护理论文的撰写","sc":1,"o":{"A":"10个","B":"15个","C":"20个","D":"25个"},"a":"A","e":"文题要求简明，中文文题一般不超过20个汉字，英文题目不超过10个实词。"},{"i":"2024_4_multi_21","t":"multi","s":"根据研究工作的目的、任务和方法的不同，研究通常被划分为","c":"绪论","sc":2,"o":{"A":"基础研究","B":"自然研究","C":"应用研究","D":"创新研究","E":"发展研究"},"a":"ACE","e":"按目的、任务和方法不同，研究分为基础研究、应用研究、开发（发展）研究三类。"},{"i":"2024_4_multi_22","t":"multi","s":"理想的理论框架或概念框架应该具备的主要特征包括","c":"确立研究问题","sc":2,"o":{"A":"原则性","B":"逻辑性","C":"指导性","D":"全面性","E":"针对性"},"a":"BC","e":"理想框架的两个主要特征是逻辑性（能反映概念或变量间的逻辑关系）和指导性（能指导研究方案设计、资料收集与结果解释）。"},{"i":"2024_4_multi_23","t":"multi","s":"研究指标应具有的特征包括","c":"护理研究的基本程序","sc":2,"o":{"A":"准确性","B":"客观性","C":"灵敏性","D":"唯一性","E":"可行性"},"a":"ABCE","e":"选择研究指标应注意准确性与特异性、客观性、灵敏性、可行性，通常选用多个指标；“唯一性”不是指标要求。"},{"i":"2024_4_multi_25","t":"multi","s":"关于操作性定义的描述，正确的有","c":"护理研究的基本程序","sc":2,"o":{"A":"对变量的界定清楚明确","B":"便于对变量的测量","C":"对变量共同本质的概括","D":"便于对变量的操纵","E":"具有排他性"},"a":"ABDE","e":"操作性定义对变量的界定清楚明确，便于操纵和测量，但往往只涉及变量少数特征、具有明显排他性；“对变量共同本质的概括”是抽象性定义的作用。"},{"i":"2024_4_multi_26","t":"multi","s":"非实验性研究的设计类型主要包括","c":"护理研究设计","sc":2,"o":{"A":"描述性研究","B":"时间连续性设计","C":"索罗门四组设计","D":"相关性研究","E":"比较性研究"},"a":"ADE","e":"非实验性研究设计类型包括描述性研究（现况调查、纵向研究）、相关性研究、比较性研究（病例对照、队列研究）；时间连续性设计属类实验性研究，索罗门四组设计属实验性研究。"},{"i":"2024_4_multi_28","t":"multi","s":"研究者在编制问卷时，问卷的用词要求有","c":"资料收集的方法","sc":2,"o":{"A":"清晰","B":"专业性强","C":"尽量减少偏差","D":"适合被问者的文化程度","E":"对敏感问题的措辞应具鼓励性并有礼貌"},"a":"ACDE","e":"问卷用词要求清晰、适合被问者文化程度（对非专业人士避免专业术语）、尽量减少偏差不暗示答案、敏感问题措辞鼓励有礼貌；“专业性强”与避免专业术语相悖。"},{"i":"2024_4_multi_29","t":"multi","s":"通过互联网发放调查问卷与传统的邮寄方式相比，网络问卷调查更为","c":"资料收集的方法","sc":2,"o":{"A":"快捷","B":"经济","C":"真实","D":"可靠","E":"易接受"},"a":"AB","e":"网络问卷比传统邮寄更快捷、更经济，可与传统邮寄结合；真实性、可靠性与是否易接受并非其相对邮寄方式的主要优势。"},{"i":"2024_4_multi_30","t":"multi","s":"当计量资料呈正态分布时，可以使用的统计学方法有","c":"研究资料的分析方法","sc":2,"o":{"A":"均数","B":"标准差","C":"t检验","D":"方差分析","E":"中位数"},"a":"ABCD","e":"正态分布计量资料用均数±标准差描述，组间比较用t检验或方差分析；中位数、四分位数间距用于偏态分布资料。"},{"i":"2024_4_multi_31","t":"multi","s":"下列有关统计表的描述正确的有","c":"研究资料的分析方法","sc":2,"o":{"A":"分为简单表和组合表","B":"表中不应有竖线、斜线和多余的横线","C":"一个统计表以表达一个中心内容为宜","D":"统计表与文字描述不能结合使用","E":"表的下面可以有备注以对表中数字进行解释或说明"},"a":"ABCE","e":"统计表分简单表和组合表，采用三线表（无竖线、斜线和多余横线），一表一个中心内容，表下可加备注解释数字；统计表应与文字描述结合而不简单重复表中数字，D错误。"},{"i":"2024_4_multi_32","t":"multi","s":"护理研究论文中的正文包括","c":"护理论文的撰写","sc":2,"o":{"A":"前言","B":"材料与方法","C":"结果","D":"讨论","E":"摘要"},"a":"ABCD","e":"正文（IMRAD）包括前言、材料与方法、结果、讨论四部分；摘要位于正文之前，不属于正文。"},{"i":"2024_4_multi_33","t":"multi","s":"在撰写护理经验论文时，“临床资料与方法”部分的内容主要包括","c":"护理论文的撰写","sc":2,"o":{"A":"撰写目的","B":"临床资料","C":"护理措施","D":"护理效果判断的标准","E":"护理效果"},"a":"BCD","e":"护理经验论文“临床资料与方法”重点介绍护理实践中的具体方法，包括临床资料、护理措施、护理效果判断标准；撰写目的属前言，护理效果属结果部分。"},{"i":"2024_4_term_35","t":"term","s":"回顾性研究","c":"护理研究设计","sc":4,"at":"参考答案（要点）：回顾性研究是从目前观察到的现象（结果）向过去追溯，始于因变量、回溯查找可能原因的研究。其优点是省时、省钱；缺点是资料为既往记录、偏差较大、较粗糙，如病例对照研究。","e":""},{"i":"2024_4_term_36","t":"term","s":"观察法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：观察法是研究者通过对事物或现象仔细观看和认真考察，以获得第一手资料的方法。可观察个人特征与情形、活动形态、语言性与非语言性沟通行为、护理技术熟练程度、环境特征等，适合不容易测量的情形；按观察情形分自然观察法和标准情形观察法，按观察结构分结构式与非结构式观察法。","e":""},{"i":"2024_4_term_37","t":"term","s":"理论抽样","c":"护理研究设计","sc":4,"at":"参考答案（要点）：理论抽样是根基理论（扎根理论）研究中特有的抽样方法，发生在资料收集与分析的连续过程中，研究者根据已形成的初步理论框架，为进一步形成和完善所发现的理论而决定下一步收集何种样本、选取何种研究对象。","e":""},{"i":"2024_4_short_40","t":"short","s":"简述形成理论框架/概念框架的方法和步骤。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：①选择与研究现象相关的概念，并对概念进行界定（从文献找恰当定义，找不到则自行界定）；②陈述概念之间的相互关系（通过命题将概念、变量连接，先用简单句子陈述）；③形成概念之间相互关系的层次结构（按因果发生的序列排列概念间关系陈述）；④构建理论或概念框架图（按因果或影响—被影响关系从左到右排列，用方框框起、线条连接、箭头表示方向）；⑤选择合适的理论作为研究框架的依据（根据研究问题与变量慎选理论模式）；⑥检查研究理论/概念框架（是否涵盖研究问题与假设、概念是否均已界定、箭头是否清楚、框架是否精简）。","e":""},{"i":"2024_4_short_41","t":"short","s":"简述生物医学测量法的优缺点。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：优点：所获结果客观、精确、可信度高，应重视应用以提高护理研究水平和深度。缺点：①不适用于收集研究对象心理、社会方面的资料；②涉及专科基础，受仪器功能和精确度影响，应用时往往需该领域专业人员合作；③需考虑经费、人员培训、测量有创或无创、仪器安全性能、敏感度及使用熟练程度等。","e":""},{"i":"2024_4_short_43","t":"short","s":"简述KR-20值的特点。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：KR-20值是反映研究工具内在一致性（同质性）的指标之一，是Cronbach's α系数的特殊形式。其特点：①适用于回答“是/否”“正确/错误”的二分制（二分类）研究工具；②计算工具中所有题目间的平均相关程度；③与折半信度相比，避免了不同折半方法导致不同结果的缺点；④一般多用SPSS等统计软件计算，相关系数高于0.7时工具信度较理想。","e":""},{"i":"2024_4_application_44","t":"application","s":"某研究者拟探讨老年痴呆患者家庭照顾者在照顾痴呆老人的过程中其健康状况每隔半年的变化情况。如果你是这位研究者，你会选用哪种类型的研究设计？为什么？你会如何设计这一研究？","c":"护理研究设计","sc":10,"at":"参考答案（要点）：\n（1）研究设计类型：选用非实验性研究中的描述性研究——纵向研究（前瞻性随访研究）。理由：本研究不对照顾者施加任何护理干预，只是在自然状态下观察同一批家庭照顾者健康状况随照顾时间推移的动态变化；“每隔半年”对特定人群定期随访、多次现况调查，符合纵向研究的特征。\n（2）设计要点：①确定研究问题与变量：自变量为照顾时间/照顾进程，因变量为照顾者健康状况（如生理指标、心理健康、照顾负担等），外变量包括照顾者年龄、性别、文化程度、与患者关系、家庭经济状况、患者病情等；②研究对象：选取正在照顾老年痴呆患者的家庭照顾者作为一组固定队列，明确纳入与排除标准，保证样本代表性和足够样本量；③资料收集：在基线及每隔半年用统一、经过信效度检验的测量工具（问卷/量表、客观生理测量）反复测量同一组照顾者的健康状况，随访多个时间点；④控制外变量：记录可能影响健康状况的外变量，资料分析时可分层或多因素分析加以控制；⑤资料分析：描述各时间点健康状况的变化趋势，比较不同随访时点的差异。","e":""}]},{"key":"2024_10","name":"2024年10月","qs":[{"i":"2024_10_single_1","t":"single","s":"某护士在研究中查阅了相关研究的“专利说明书”，此类文献属于","c":"医学信息的获取与利用","sc":1,"o":{"A":"零次文献","B":"一次文献","C":"二次文献","D":"三次文献"},"a":"B","e":"专利说明书、期刊论文、学位论文、会议论文、研究报告等是以作者本人研究为依据生产的原始文献，属一次文献。"},{"i":"2024_10_single_2","t":"single","s":"由近及远，从新到旧，逆着时间的顺序利用检索工具进行文献检索，这种文献检索的方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"顺查法","B":"抽查法","C":"倒查法","D":"追溯法"},"a":"C","e":"倒查法是由近及远、从新到旧逆时间查找，重点获取近期最新文献，省时，适合时间紧迫、要求查准甚至查全的课题。"},{"i":"2024_10_single_3","t":"single","s":"某护士研究对同类疾病的患者进行同样内容的健康宣教，应用不同的宣教方法将会产生怎样的健康教育效果时，“各类不同的宣教方法”是","c":"护理研究的基本程序","sc":1,"o":{"A":"自变量","B":"因变量","C":"应变量","D":"外变量"},"a":"A","e":"各类不同的宣教方法是研究者人为安排、操纵施加的处理因素，其变化可导致研究对象反应，属自变量；健康教育效果是随其变化的因变量。"},{"i":"2024_10_single_4","t":"single","s":"心理学家给饥饿下了一个操作性定义：“饥饿”是指连续24小时没进食物的状态。这个方法是","c":"护理研究的基本程序","sc":1,"o":{"A":"自行定义法","B":"指标描述法","C":"行为描述法","D":"条件描述法"},"a":"D","e":"条件描述法通过规定某种条件、观察产生的状态来界定变量，如将“饥饿”操作定义为“连续24小时没进食物的状态”。"},{"i":"2024_10_single_5","t":"single","s":"某护士在研究中判断泌尿系感染，采用尿培养结果作为研究指标，而未采用白细胞计数作为研究指标。这反映了研究指标选择的","c":"护理研究的基本程序","sc":1,"o":{"A":"客观性","B":"可行性","C":"准确性","D":"灵敏性"},"a":"C","e":"研究指标应注意准确性与特异性，即指标能准确、特异地反映所研究的问题；尿培养诊断泌尿系感染比白细胞计数更准确特异。"},{"i":"2024_10_single_6","t":"single","s":"某研究的假设是：饮酒对心血管病的发生率的影响。这个假设是","c":"确立研究问题","sc":1,"o":{"A":"无方向性假设","B":"无效假设","C":"有方向性假设","D":"统计学假设"},"a":"A","e":"该假设明确饮酒与心血管病发生率之间有关系，但未指出方向（升高或降低），属无方向性假设；无效假设即统计学假设，认为两变量间没有关系。"},{"i":"2024_10_single_7","t":"single","s":"MEDLINE中常用字段AU的含义是","c":"医学信息的获取与利用","sc":1,"o":{"A":"著者地址","B":"文摘","C":"著者姓名","D":"评论"},"a":"C","e":"MEDLINE字段中，AU—Author(s)—著者姓名；AD—Address of Author—著者地址；AB—Abstract—文摘；CM—Comments—评论。"},{"i":"2024_10_single_8","t":"single","s":"将书刊资料所刊载的文章的题目、作者、出处以及所论及的主题等进行著录，并按一定的原则和方法编排而成的检索工具。此文献检索工具是","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘","B":"题录","C":"目录","D":"索引"},"a":"D","e":"索引著录文章题目、作者、出处及主题，揭示出版物内涵，比目录更深；题录只著录外部特征，目录以一种书/刊为著录单位。"},{"i":"2024_10_single_9","t":"single","s":"在实验性研究中可以没有","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"盲法","C":"设对照组","D":"随机分组"},"a":"B","e":"任何实验性研究都必须具备干预、设立对照、随机化（随机取样和随机分组）三项基本内容；盲法是减少主观偏倚的措施，并非必备。"},{"i":"2024_10_single_10","t":"single","s":"类实验性研究与实验性研究的共同之处是研究设计内容均有","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"设对照组","C":"随机分组","D":"方便取样"},"a":"A","e":"类实验性研究与实验性研究方法基本相似，设计中都一定有对研究对象的护理干预措施；类实验性研究缺少随机分组或对照组。"},{"i":"2024_10_single_11","t":"single","s":"Kubler-Ross博士对临终患者的心理特点进行研究，研究结果将心理反应过程分为了5个阶段，分别为否认期、愤怒期、商讨期、抑郁期和接受期。其所选用的研究方法是","c":"护理研究设计","sc":1,"o":{"A":"现象学研究法","B":"根基理论研究法","C":"人种学研究法","D":"行动研究法"},"a":"B","e":"根基理论研究强调系统收集资料同时分析资料进而产生理论，典型案例即Kubler-Ross对临终患者心理五阶段（否认、愤怒、商讨、抑郁、接受）的研究。"},{"i":"2024_10_single_12","t":"single","s":"疼痛测量图普遍用于人们对疼痛的感受，这种量表是","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"语义差异量表","C":"Likert量表","D":"视觉类似物量表"},"a":"D","e":"视觉类似物量表（VAS）普遍用于人们对疼痛、乏力、恶心、呼吸困难等经历的感受，传统形式为一条100mm长直线，也有脸谱、阶梯等图形形式。"},{"i":"2024_10_single_14","t":"single","s":"若研究心脏外科手术患者术后3种体位对血气分析结果的影响，应采用的资料收集方法是","c":"资料收集的方法","sc":1,"o":{"A":"访谈法","B":"观察法","C":"测量法","D":"问卷调查法"},"a":"C","e":"血气分析属于抽取标本后通过实验室检验测得的实验指标测量，是生物医学测量法的应用（评价不同体位对血气结果的影响）。"},{"i":"2024_10_single_15","t":"single","s":"代表事物差异有统计学意义的P值是","c":"研究资料的分析方法","sc":1,"o":{"A":"0.10","B":"0.08","C":"0.06","D":"0.04"},"a":"D","e":"通常将P≤0.05或P≤0.01称为小概率事件，作为差异有统计学意义的界限；0.04≤0.05，故差异有统计学意义。"},{"i":"2024_10_single_16","t":"single","s":"下列资料中属于计量资料的是","c":"研究资料的分析方法","sc":1,"o":{"A":"身高（cm）","B":"文化程度（小学、初中、高中）","C":"性别（男/女）","D":"护理满意度（非常满意、一般、不满意）"},"a":"A","e":"计量资料是用定量方法测定指标量大小所得、有度量衡单位的资料，如身高（cm）；性别为计数资料，文化程度、满意度为等级资料。"},{"i":"2024_10_single_17","t":"single","s":"某社区护士进行社区糖尿病患者自我管理能力的调查，当数据收集完成后，经计算发现该样本的年龄呈偏态分布。下列适用于描述年龄的平均水平的统计学指标是","c":"研究资料的分析方法","sc":1,"o":{"A":"均数","B":"中位数","C":"标准差","D":"卡方值"},"a":"B","e":"数据呈偏态分布时用中位数反映平均水平，用四分位数间距描述离散趋势；均数、标准差适用于正态分布资料。"},{"i":"2024_10_single_18","t":"single","s":"某护士欲比较两组患者病程之间的差异。两组患者的病程均呈现为偏态分布，此时可选择的分析方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"t检验","B":"卡方检验","C":"方差分析","D":"Mann-Whitney U检验"},"a":"D","e":"两组独立样本、偏态分布计量资料的组间比较应用非参数的秩和检验，即Wilcoxon秩和检验/Mann-Whitney U检验；t检验、方差分析要求正态分布。"},{"i":"2024_10_single_19","t":"single","s":"某社区护士欲以统计图的形式展示该社区内6岁以下儿童身高随年龄的增长情况，最适宜的统计图类型是","c":"研究资料的分析方法","sc":1,"o":{"A":"圆图","B":"线图","C":"单式直条图","D":"复式直条图"},"a":"B","e":"线图以线段升降表示某事物随另一连续性变量（年龄）变化的趋势，适合展示身高随年龄的增长情况。"},{"i":"2024_10_single_20","t":"single","s":"下列对于护理经验论文特征的描述，不正确的是","c":"护理论文的撰写","sc":1,"o":{"A":"撰写形式固定","B":"边叙边议","C":"改变“以医代护”的旧模式","D":"经验要具体"},"a":"A","e":"护理经验论文撰写形式灵活、不受固定格式约束，篇幅可长可短；边叙边议、改变“以医代护”、经验要具体有针对性均为其特征。"},{"i":"2024_10_multi_21","t":"multi","s":"科学研究应遵循的基本原则是","c":"绪论","sc":2,"o":{"A":"客观性原则","B":"实用性原则","C":"实验原则","D":"可重复性原则","E":"创新原则"},"a":"ACD","e":"科学研究应遵循三项基本原则：客观性原则、实验原则、可重复性原则。"},{"i":"2024_10_multi_22","t":"multi","s":"护理学研究中研究者除应遵守基本的伦理原则外，还应遵循的相关伦理准则为","c":"绪论","sc":2,"o":{"A":"真实性","B":"诚实性","C":"合作性","D":"全面性","E":"平等性"},"a":"ABCE","e":"除三项基本伦理原则外，研究者还应遵循客观性、真实性、诚实性、合作性、平等性、效率性等伦理准则。"},{"i":"2024_10_multi_24","t":"multi","s":"属于文献内容特征的有","c":"医学信息的获取与利用","sc":2,"o":{"A":"文献主题","B":"刊名","C":"学科分类","D":"题名","E":"著者姓名"},"a":"AC","e":"文献内容特征包括各种学科分类和文献主题；刊名、题名、著者姓名属于外表特征。"},{"i":"2024_10_multi_25","t":"multi","s":"质性研究的目的包括","c":"护理研究设计","sc":2,"o":{"A":"预测","B":"描述","C":"理解","D":"控制","E":"演绎"},"a":"BC","e":"质性研究深入探索事物内涵和实质，目的在于描述研究对象的真实经历、理解其主观体验；预测、控制、演绎是量性研究的目的取向。"},{"i":"2024_10_multi_27","t":"multi","s":"非概率抽样方法包括","c":"护理研究设计","sc":2,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"整群抽样","E":"滚雪球抽样"},"a":"ABCE","e":"非概率抽样包括方便抽样、定额（配额）抽样、目的抽样、滚雪球抽样及理论抽样；整群抽样属于概率抽样。"},{"i":"2024_10_multi_28","t":"multi","s":"一般情况下，国外量表的翻译步骤应包括","c":"研究工具性能的测定","sc":2,"o":{"A":"翻译","B":"回译","C":"访谈","D":"检测","E":"分析"},"a":"ABD","e":"国外量表翻译应用过程分三步：翻译（独立翻译后讨论形成共识中文版）、回译（再译回原语言与源量表比较修改）、检测（双语样本作答比较或中文版预试验测信效度）。"},{"i":"2024_10_multi_29","t":"multi","s":"根据研究目的、所需研究资料的特点以及研究对象的参与能力等因素，访谈法分为","c":"资料收集的方法","sc":2,"o":{"A":"结构式访谈","B":"半结构式访谈","C":"小组访谈","D":"非结构式访谈","E":"深度访谈"},"a":"ABD","e":"按访谈的控制程度分为结构式访谈、半结构式访谈、非结构式访谈三类。"},{"i":"2024_10_multi_30","t":"multi","s":"下列资料中是计数资料的有","c":"研究资料的分析方法","sc":2,"o":{"A":"治疗效果（治愈、显效、好转、无效）","B":"职业（工人、农民、干部）","C":"职称（讲师、副教授、教授）","D":"疾病严重程度（轻度、中度、重度）","E":"认知功能（正常、异常）"},"a":"BE","e":"计数资料是无序分类资料，各类别间无程度顺序，如职业（工人/农民/干部）、认知功能（正常/异常）；治疗效果、职称、疾病严重程度均有程度顺序，属等级资料。"},{"i":"2024_10_multi_31","t":"multi","s":"下列有关统计表的描述，正确的有","c":"研究资料的分析方法","sc":2,"o":{"A":"统计表应有相应的表号和表题，写在表的上方中央","B":"统计表中可以有斜线","C":"无数字时用“0”表示","D":"缺失数字用“…”表示","E":"同一列数字应个位对齐"},"a":"ADE","e":"表号表题写在表上方中央；统计表为三线表，不应有竖线、斜线和多余横线；数值为0记“0”、缺失用“…”、无数字用“——”；同一列数字个位对齐、小数位数一致。"},{"i":"2024_10_multi_32","t":"multi","s":"确定文题是护理研究论文写作的第一步，应遵循的原则为","c":"护理论文的撰写","sc":2,"o":{"A":"新颖","B":"切题","C":"艺术","D":"规范","E":"简明"},"a":"ABDE","e":"护理研究论文文题要求新颖、切题、简明（一般不超过20个汉字）、规范；“艺术”是个案论文文题可带的特点，非研究论文文题四原则。"},{"i":"2024_10_multi_33","t":"multi","s":"下列有关“关键词”的描述，正确的有","c":"护理论文的撰写","sc":2,"o":{"A":"一般一篇文章选择1～2个关键词","B":"关键词反映文章的主要内容","C":"关键词不能用缩写词","D":"多个关键词之间采用空一格或用分号隔开","E":"关键词无须为规范化语言，只要可以表达文章主题即可"},"a":"BCD","e":"关键词一般每篇选3～5个，反映文章主要内容，用原形词、不用缩写词，尽量用规范化语言，词间空一格或用分号隔开、末词后不加标点。"},{"i":"2024_10_term_35","t":"term","s":"前瞻性研究","c":"护理研究设计","sc":4,"at":"参考答案（要点）：前瞻性研究是从现存状况出发，随时间推移对研究对象进行追踪，始于自变量（暴露/处理）观察其对因变量影响的研究。其资料完整、结果可信、较有说服力，但耗时较长，如队列研究。","e":""},{"i":"2024_10_term_36","t":"term","s":"自然观察法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：自然观察法是在日常工作或生活情形中观察研究对象行为的观察方法。其可观察的行为范围较广，但需花费较多时间接触（如观察临床护士行为至少连续1周、必要时1个月），要求观察者有较深刻的洞察力。","e":""},{"i":"2024_10_short_40","t":"short","s":"简述理想的理论框架或概念框架应该具备的特征。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：理想的理论框架或概念框架应具备两个主要特征：①逻辑性：框架必须能反映概念或变量之间的逻辑关系，概念间关系结构清晰；②指导性：框架必须能指导研究方案的设计，包括指导资料收集方法的选择、研究工具的设计、研究结果的解释等。","e":""},{"i":"2024_10_short_41","t":"short","s":"简述完全参与者的特点。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：完全参与者（complete participant）指观察者完全以参与者身份进入观察领域，本身就是观察群体中的一员。其特点：①可获得局外人不能获得的、深入真实的资料；②但也可能因身处其境、习以为常而忽视某些现象；③或因本身就是群体一员，难以保持客观分析，易受主观立场影响。","e":""},{"i":"2024_10_short_42","t":"short","s":"简述减少抽样误差的方法。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：抽样误差由抽样偶然性造成，无法完全避免，但可通过以下方法减少：①尽可能采取随机抽样的方法，提高样本对总体的代表性；②增加样本量到适当水平；③选择变异程度小的研究指标。","e":""},{"i":"2024_10_short_43","t":"short","s":"简述综述撰写时阅读文献的目的。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：阅读文献是撰写综述的基础，其目的：①在可能范围内广泛收集中外文文献，围绕中心内容越多越全越好，先看近期（近2～3年）后看远期；②对收集到的文献去粗取精、深入阅读代表性文章，必须找到原文阅读、对权威文献细读；③做好读书卡片或笔记，为归纳、总结、对比、分析和评价文献中的护理问题进展、提出自己观点做准备，避免写成“剪贴”式文章。","e":""},{"i":"2024_10_application_44","t":"application","s":"某研究者拟在社区中探讨“健康教育对高血压患者服药依从性的影响”，使用自身对照的方法。请解释什么是自身对照？应该如何设计？在这个研究中采用自身对照法的优点是什么？","c":"护理研究设计","sc":10,"at":"参考答案（要点）：\n（1）自身对照的概念：自身对照指对照组和实验组的数据均来自同一组样本，即将研究对象自身在干预前后的情况进行比较。\n（2）设计要点：①在社区中选取一组符合纳入标准的高血压患者作为研究对象；②先进行干预前（基线）测量，用统一、经过信效度检验的量表或问卷测量其服药依从性及相关外变量（年龄、文化程度、血压控制情况、病程等）；③对该组患者实施健康教育干预（如健康讲座、用药指导、随访等），持续一段时间；④干预结束后，用相同工具、相同方法再次测量同一组患者的服药依从性；⑤比较同一组患者干预前与干预后服药依从性的差异，判断健康教育的效果。\n（3）优点：自身对照消除了研究对象自身各种干扰因素（个体差异）对结果的影响，且节省样本量，在护理研究中较常采用。","e":""}]},{"key":"2025_4","name":"2025年4月","qs":[{"i":"2025_4_single_1","t":"single","s":"科学精神最根本的一条是","c":"绪论","sc":1,"o":{"A":"自愿","B":"客观","C":"实事求是","D":"公平合理"},"a":"C","e":"教材指出科学精神最根本的一条就是实事求是。"},{"i":"2025_4_single_2","t":"single","s":"在研究对象本人不具备或者丧失了正常的知情同意能力时，正常代行人排序中位于第一位的是","c":"绪论","sc":1,"o":{"A":"配偶","B":"子女","C":"父母","D":"兄弟姐妹"},"a":"A","e":"正常的代行顺序应为配偶—子女—父母—兄弟姐妹，配偶位于第一位。"},{"i":"2025_4_single_3","t":"single","s":"研究“对同样的患者采用不同的护理措施，将会产生怎样的护理效果”时，“不同的护理措施”是","c":"护理研究设计","sc":1,"o":{"A":"自变量","B":"因变量","C":"外变量","D":"有序分类变量"},"a":"A","e":"研究者主动操纵、施加的护理措施为自变量，护理效果为随自变量变化的因变量。"},{"i":"2025_4_single_4","t":"single","s":"下列属于研究中第一手资料来源的是","c":"资料收集的方法","sc":1,"o":{"A":"图书馆","B":"问卷调查","C":"在线数据库","D":"国际互联网"},"a":"B","e":"问卷调查法是研究者通过书面形式直接从研究对象处获取研究资料，属第一手资料；图书馆、在线数据库、互联网属二手资料来源。"},{"i":"2025_4_single_5","t":"single","s":"研究者对研究预期目的，即各变量之间的关系，进行初步的、带有假定意义的理论解释，这称为","c":"确立研究问题","sc":1,"o":{"A":"研究目的","B":"研究设计","C":"研究假设","D":"研究变量"},"a":"C","e":"研究假设是对研究预期目的即各变量之间关系所作的初步的、带有假定意义的理论解释。"},{"i":"2025_4_single_6","t":"single","s":"解释现象，陈述命题，反映哲理的一系列抽象的、相关的结构称为","c":"确立研究问题","sc":1,"o":{"A":"理论","B":"框架","C":"理论框架","D":"概念模式"},"a":"D","e":"教材明确：概念模式是解释现象、陈述命题、反映哲理的一系列抽象的、相关的结构。"},{"i":"2025_4_single_7","t":"single","s":"从文献的外表特征进行文献检索有不同的途径，其中利用文献的各种代码、数字编制而成的索引查找文献的途径是","c":"医学信息的获取与利用","sc":1,"o":{"A":"书名途径","B":"著者途径","C":"序号途径","D":"分类途径"},"a":"C","e":"序号途径是利用文献的各种代码、数字编制而成的索引查找文献的途径。"},{"i":"2025_4_single_8","t":"single","s":"MEDLINE中TI这一缩写的含义是","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘","B":"评论","C":"语种","D":"篇名"},"a":"D","e":"MEDLINE中TI为Title的缩写，指篇名。"},{"i":"2025_4_single_9","t":"single","s":"量性研究和质性研究的本质区别是","c":"护理研究设计","sc":1,"o":{"A":"科研设计类型不同","B":"收集资料的方法不同","C":"数据分析方法不同","D":"哲学观和认识事物的方法不同"},"a":"D","e":"量性与质性研究的本质区别在于各自建立在不同的哲学观和认识事物的方法上。"},{"i":"2025_4_single_10","t":"single","s":"某护士计划开展“录像磁带干预对促进正性母婴互动的效果分析”的研究，首先，母亲们被随机分到实验组或对照组，实验组接受特殊的指导，即利用录像磁带将母婴互动进行拍摄、观看和接受护士指导，而对照组则没有该干预方法。干预后测量母婴的互动情况并分析组间差异。此研究设计是","c":"护理研究设计","sc":1,"o":{"A":"实验前后对照设计","B":"单纯实验后对照设计","C":"索罗门四组设计","D":"不对等对照组设计"},"a":"B","e":"研究将对象随机分组、施加干预后仅作干预后测量并比较组间差异，未做干预前基线测量，属单纯实验后对照设计。"},{"i":"2025_4_single_11","t":"single","s":"某护士欲研究某市社区护士的职业态度，该市社区护士中本科学历的护士占5%，大专学历的护士占30%，中专学历的护士占65%。假如欲从中抽取100人的样本，则从本科、大专、中专的护士中分别随机抽取5人、30人、65人，合起来组成所需的样本。这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"系统抽样","B":"整群抽样","C":"分层抽样","D":"方便抽样"},"a":"C","e":"先按学历将总体分层，再按比例从各层内随机抽取，合起来组成样本，属分层抽样。"},{"i":"2025_4_single_12","t":"single","s":"某护士发现按照研究设计，某研究对象应接受调查，但该对象由于健康状况不佳没有按要求回答调查内容，由此造成的偏倚是","c":"护理研究设计","sc":1,"o":{"A":"入院率偏倚","B":"诊断性偏倚","C":"无应答偏倚","D":"分组偏倚"},"a":"C","e":"符合条件的研究对象因种种原因未按要求应答、未参加调查而造成的偏倚为无应答偏倚。"},{"i":"2025_4_single_13","t":"single","s":"由一组句子组成，测量人们对某一主题的看法，并呈现按程度轻重排列的评定标准。这类量表是","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"B","e":"Likert量表由一组句子组成，测量人们对某一主题的看法，并呈现按程度轻重排列的评定标准。"},{"i":"2025_4_single_14","t":"single","s":"属于观察法的优点的是","c":"资料收集的方法","sc":1,"o":{"A":"可能出现霍桑效应","B":"适合用于不易被测量的情形","C":"所获得的资料主观性较强","D":"可能涉及的伦理问题较多且复杂"},"a":"B","e":"观察法的优点之一是适合于不易被测量的情形，如对行为、活动及现象的研究；其余选项均为缺点。"},{"i":"2025_4_single_15","t":"single","s":"下列可以减少研究中的抽样误差的方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"选择变异程度小的研究指标","B":"选择类实验性研究设计","C":"采用目的抽样","D":"采用滚雪球抽样"},"a":"A","e":"减少抽样误差的方法包括：尽可能随机抽样、适当增加样本量、选择变异程度小的研究指标。"},{"i":"2025_4_single_16","t":"single","s":"当研究工具的信度被认为较为理想时，其信度值一般应高于","c":"研究工具性能的测定","sc":1,"o":{"A":"0.8","B":"0.7","C":"0.6","D":"0.5"},"a":"B","e":"教材指出研究工具的相关系数高于0.7时其信度才理想。"},{"i":"2025_4_single_17","t":"single","s":"某研究者采用抑郁自评量表，测量了200名剖腹产后一个月的产妇的抑郁状况，产妇的量表得分为正态分布。若要将产妇的量表得分与该量表的常模（正常人）比较，可采用的统计学方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"单样本t检验","B":"秩和检验","C":"独立样本t检验","D":"配对t检验"},"a":"A","e":"样本均数与已知总体均数（常模）比较、且资料呈正态分布时，采用单样本t检验，与教材例题一致。"},{"i":"2025_4_single_18","t":"single","s":"撰写文献综述时，所引用的近3年发表的文献应占到引用文献总数的","c":"护理论文的撰写","sc":1,"o":{"A":"40%以上","B":"50%以上","C":"60%以上","D":"70%以上"},"a":"D","e":"教材指出文献综述参考文献一般20~30篇，其中近3年发表的文献应占到70%以上。"},{"i":"2025_4_single_19","t":"single","s":"李护士正在撰写一篇护理经验论文，她欲解释说明“护理效果产生的原因和机制”，这部分内容应属于护理经验论文中的","c":"护理论文的撰写","sc":1,"o":{"A":"讨论与分析","B":"结果/护理效果","C":"临床资料与方法","D":"前言"},"a":"A","e":"护理经验论文的讨论与分析部分主要分析和解释产生护理效果的原因和作用机制。"},{"i":"2025_4_single_20","t":"single","s":"某护士欲用统计图的形式来表示60岁以上老年人的骨密度随年龄增长而变化的情况，应选择的统计图种类是","c":"研究资料的分析方法","sc":1,"o":{"A":"单式直条图","B":"复式直条图","C":"圆图","D":"线图"},"a":"D","e":"线图以线段升降表示某事物随另一连续事物数值变化的趋势，适合表示骨密度随年龄增长的变化。"},{"i":"2025_4_multi_21","t":"multi","s":"护理研究遵循的伦理原则中要求尊重人的尊严，即研究对象有","c":"绪论","sc":2,"o":{"A":"免受伤害或不适的权利","B":"不被剥削或利用的权利","C":"自主决定权","D":"充分认知的权利","E":"公平治疗的权利"},"a":"CD","e":"尊重人的尊严原则包括研究对象的自主决定权和充分认知的权利；A、B属有益原则，E属公正原则。"},{"i":"2025_4_multi_22","t":"multi","s":"研究伦理审查委员会对研究项目进行审查的内容包括","c":"绪论","sc":2,"o":{"A":"研究的意义","B":"研究的创新","C":"研究的科学性","D":"研究的重复性","E":"研究的伦理原则"},"a":"CE","e":"IRB审查内容包括①研究的科学性、②研究的伦理原则（含知情同意、利益风险比、保密等）。"},{"i":"2025_4_multi_23","t":"multi","s":"下列属于数值变量的有","c":"研究资料的分析方法","sc":2,"o":{"A":"身高（cm）","B":"体重（kg）","C":"血压（mmHg）","D":"性别（男、女）","E":"脉搏（次/min）"},"a":"ABCE","e":"身高、体重、血压、脉搏均为数值变量（计量资料）；性别为互不相容的类别，属分类（计数）变量。"},{"i":"2025_4_multi_24","t":"multi","s":"选择研究问题的注意事项包括","c":"确立研究问题","sc":2,"o":{"A":"选择有临床指导意义的问题","B":"选题范围不可过大","C":"研究问题具有可行性","D":"最好能结合自己熟悉的专业","E":"选择有突破性意义的问题"},"a":"ABCD","e":"选题注意事项：①选对临床有指导意义、立足创新的问题；②范围不可太大；③研究问题要有可行性；④最好结合自己熟悉的专业。E“突破性”并非教材所列注意事项。"},{"i":"2025_4_multi_25","t":"multi","s":"文献检索的方法包括","c":"医学信息的获取与利用","sc":2,"o":{"A":"常用法","B":"回顾法","C":"追溯法","D":"循环法","E":"顺查法"},"a":"ACD","e":"文献检索方法包括常用法（工具法）、追溯法、循环法（分段法/综合法）三种；顺查法属常用法的细分，回顾法不是独立方法。"},{"i":"2025_4_multi_26","t":"multi","s":"在研究设计中采用随机化的目的包括","c":"护理研究设计","sc":2,"o":{"A":"保证研究工作能按照设计内容进行","B":"减少研究者主观因素所导致的偏倚","C":"减少受试者主观因素所导致的偏倚","D":"确保每一个研究对象都有均等的机会被选中","E":"使研究对象有均等的机会进入实验组或对照组"},"a":"DE","e":"随机化（随机取样+随机分组）的目的是使每个研究对象有均等机会被选中、有均等机会进入实验组或对照组；B、C属盲法的作用，A属预试验的目的。"},{"i":"2025_4_multi_27","t":"multi","s":"属于非概率抽样的有","c":"护理研究设计","sc":2,"o":{"A":"配额抽样","B":"系统抽样","C":"分层抽样","D":"目的抽样","E":"整群抽样"},"a":"AD","e":"非概率抽样包括方便抽样、定额（配额）抽样、目的抽样、滚雪球抽样；系统、分层、整群抽样均属概率抽样。"},{"i":"2025_4_multi_28","t":"multi","s":"控制选择性偏倚的方法包括","c":"护理研究设计","sc":2,"o":{"A":"采用盲法收集资料","B":"设立多组对照","C":"科研设计严谨","D":"尽量使用客观的指标","E":"提高应答率，减少失访率"},"a":"BCE","e":"选择性偏倚的控制：①科研设计严谨、严格掌握纳入排除标准；②设立多组对照；③提高应答率、减少失访率。A盲法、D使用客观指标属信息性偏倚的控制。"},{"i":"2025_4_multi_29","t":"multi","s":"非结构式观察法的特点有","c":"资料收集的方法","sc":2,"o":{"A":"研究者的观察在自然情形下进行","B":"研究者先确定观察样本和观察项目","C":"不对研究情形施加任何干预","D":"研究者设计记录观察结果的表格","E":"观察和记录人们的行为和经历的自然发生、发展过程"},"a":"ACE","e":"非结构式观察法是在自然情形下进行、不对研究情形施加任何干预，以观察和记录人们行为和经历的自然发生、发展过程；B、D为结构式观察法的特点。"},{"i":"2025_4_multi_30","t":"multi","s":"关于效标关联效度的陈述，正确的有","c":"研究工具性能的测定","sc":2,"o":{"A":"分为同时效度和预测效度","B":"可以判断研究工具是否包括足够的项目","C":"体现研究工具与其所测量概念的相符程度","D":"反映研究工具与其他测量标准之间的关系","E":"可以判断研究工具所包含内容的分配比例"},"a":"AD","e":"效标关联效度侧重反映研究工具与其他测量标准之间的关系，可分为同时效度和预测效度；B、E属内容效度，C属结构效度。"},{"i":"2025_4_multi_31","t":"multi","s":"某研究者计划测量某评估工具的等同性，下面可以用来反映研究工具等同性的方法有","c":"研究工具性能的测定","sc":2,"o":{"A":"折半信度","B":"复本信度","C":"KR-20值","D":"Cronbach’α系数","E":"评定者间信度"},"a":"BE","e":"等同性用复本信度和评定者间信度反映；折半信度、KR-20、Cronbach’s α均反映内在一致性。"},{"i":"2025_4_multi_32","t":"multi","s":"护理综述论文的特征有","c":"护理论文的撰写","sc":2,"o":{"A":"前瞻性","B":"描述性","C":"综合性","D":"新颖性","E":"信息性"},"a":"CDE","e":"护理综述论文的特征有信息性、新颖性、综合性、评述性、客观性；综述为回顾性，不具前瞻性。"},{"i":"2025_4_multi_33","t":"multi","s":"某研究者欲比较某市两家医院护理人员职称构成（护师、主管护师、副主任护师、主任护师）情况有无差别，可以考虑使用的统计学分析方法有","c":"研究资料的分析方法","sc":2,"o":{"A":"χ²检验","B":"t检验","C":"Mann-Whitney U检验","D":"Pearson相关分析","E":"Wilcoxon秩和检验"},"a":"CE","e":"职称为有序（等级）资料，两家医院为两个独立样本，比较构成/等级差异时采用两独立样本秩和检验，即Wilcoxon秩和检验或Mann-Whitney U检验（与教材例8-13同构）。"},{"i":"2025_4_term_35","t":"term","s":"无效假设","c":"确立研究问题","sc":4,"at":"参考答案（要点）：无效假设也叫统计学假设，是指假设指出自变量和因变量之间没有关系。它是科学界的习惯；假如无效假设被证明为假，则研究假设将被视为真。","e":""},{"i":"2025_4_short_40","t":"short","s":"简述文献阅读的技巧。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：①先读主题内容相同的中文文献，后读外文文献，以助理解专有名词、加快阅读速度；②先读文摘后读原文，据文摘信息决定是否索取原文，节省时间精力；③先粗读、后精读，这是最关键的策略，先读标题、目次、文摘、浏览图表，确有必要再精读原文；④先读综合性文献，后读专题性文献；⑤先读现刊文献，后读过刊文献，以了解最新动态。","e":""},{"i":"2025_4_short_41","t":"short","s":"简述档案记录收集法的概念以及资料的来源。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：概念——档案记录收集法是指通过查阅有关记录和档案而获得研究资料的一种方法。资料来源——可来源于医院、学校、行政管理部门等机构的有关记录和档案，主要包括：①疾病报告（法定传染病及慢性病登记报告）；②医疗、护理服务工作记录（一、二、三级预防服务记录）；③健康检查资料；④专题疾病的调查与随访资料。研究者须在得到相关部门许可后查阅。","e":""},{"i":"2025_4_short_43","t":"short","s":"简述统计表中标题的绘制要求。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：统计表的标题即表号和表题，用以概括表的主要内容；每个表均应有相应的表号和表题，并写在表的上方中央位置。","e":""},{"i":"2025_4_application_44","t":"application","s":"某研究者计划进行一项研究，探讨关于某措施对于改善糖尿病患者服药依从性的效果，拟采用自身实验前后对照设计，样本量为50例。请：（1）陈述此设计的具体步骤；（2）分析此研究设计的优缺点。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：（1）具体步骤：①按研究对象入选标准选择符合条件的糖尿病患者50例（只有实验组一组，不另设对照组、不随机分组）；②在实施干预前，先测定（基线测量）该组患者在一段时间内的服药依从性；③对全部研究对象施加待评价的护理/干预措施；④干预完成后，间隔一定时间再次测量同一组患者的服药依从性；⑤将干预后的依从性与干预前基线进行比较，分析该措施对改善服药依从性有无效果。（2）优点：是类实验性研究中最简单、较常用且合乎逻辑的设计方法；同一组对象自身前后比较，所需样本量小、可行性高、较实用，不易触犯伦理原则。缺点：没有对照组、也没有随机分组，仅有实验组一组；实验前测量不能替代对照组的功能，已知和未知干扰因素无法像实验性研究那样随机均衡分布，干预效果很难完全归因于该措施，不能很科学地解释结果，结果可信度不如实验性研究，解释时切忌过于绝对。","e":"教材例5-4与本题高度同构（探讨某措施改善高血压患者服药依从性、50例、自身前后对照）。"}]},{"key":"2025_10","name":"2025年10月","qs":[{"i":"2025_10_single_1","t":"single","s":"《贝尔蒙报告》强调了在以人为研究对象的研究中所遵循的基本伦理原则，下列体现“有益的原则”的是","c":"绪论","sc":1,"o":{"A":"自主决定权","B":"公平治疗的权利","C":"充分认知的权利","D":"免于遭受伤害或不适的权利"},"a":"D","e":"有益的原则指研究者有责任将研究对象伤害减至最低、益处最大，包括研究对象免于遭受伤害或不适的权利、不被剥削或利用的权利；自主决定权和充分认知权利属尊重人的尊严原则，公平治疗权利属公正原则。"},{"i":"2025_10_single_3","t":"single","s":"某护理研究者计划全面了解艾滋病相关研究的全过程，将艾滋病相关研究的开始时间1981年作为起点，从1981年以后逐年向近期查找文献，这种文献检索的方式是","c":"医学信息的获取与利用","sc":1,"o":{"A":"追溯法","B":"顺查法","C":"抽查法","D":"倒查法"},"a":"B","e":"顺查法是由远及近、从旧到新按时间顺序逐年查找，查全率高，适合要求全面普查、了解全过程的课题。"},{"i":"2025_10_single_4","t":"single","s":"某研究将变量“疗效”按治愈、显效、好转、无效分类，此变量属于","c":"护理研究的基本程序","sc":1,"o":{"A":"有序分类变量","B":"数值变量","C":"无序分类变量","D":"连续型变量"},"a":"A","e":"疗效各等级（治愈、显效、好转、无效）之间有程度差别，属有序分类变量，构成等级资料。"},{"i":"2025_10_single_5","t":"single","s":"某研究假设为“吸烟会增加肺癌的发生率”，此假设为","c":"确立研究问题","sc":1,"o":{"A":"有方向性假设","B":"无效假设","C":"无方向性假设","D":"统计学假设"},"a":"A","e":"该假设不仅明确吸烟与肺癌发生率有关，还指出方向（增加），属有方向性假设。"},{"i":"2025_10_single_6","t":"single","s":"在文献检索中，将书刊资料所刊载的文章的题目、作者、出处以及所论及的主题等进行著录，并按一定的原则和方法编排而成的检索工具，称为","c":"医学信息的获取与利用","sc":1,"o":{"A":"目录","B":"索引","C":"题录","D":"文摘"},"a":"B","e":"索引著录文章题目、作者、出处及主题，揭示出版物内涵；题录只著录外部特征，目录以一种书/刊为著录单位，文摘是对原始文献的简明摘录。"},{"i":"2025_10_single_7","t":"single","s":"医学文献检索数据库MEDLINE中“著者姓名”的缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AB","B":"AD","C":"AI","D":"AU"},"a":"D","e":"MEDLINE字段中AU—Author(s)—著者姓名；AB—文摘；AD—著者地址；AI—文摘标识。"},{"i":"2025_10_single_8","t":"single","s":"以下属于量性研究的结果报告的是","c":"护理研究的基本程序","sc":1,"o":{"A":"数字结果报告","B":"评论","C":"叙述性文字","D":"故事"},"a":"A","e":"量性研究通过观察指标获得数字资料、用统计学方法分析，以数字资料描述结果；叙述性文字、故事等是质性研究的结果报告方式。"},{"i":"2025_10_single_9","t":"single","s":"在研究两种不同的产后宣教方法对于产后母乳喂养的影响的研究中，可选取同年龄组（年龄相差5岁以内）、同文化程度、同分娩方式的产妇一对一入组后分别进行不同方法的健康宣教，并在宣教后对母乳喂养情况进行对照观察。此种设对照的方法是","c":"护理研究设计","sc":1,"o":{"A":"自身对照","B":"组间对照","C":"配对对照","D":"多组对照"},"a":"C","e":"配对对照是将研究对象按某些特征（如同年龄、同文化程度、同分娩方式）配成对子，每遇一对分别给予不同处理，可减少每对内部实验误差。"},{"i":"2025_10_single_10","t":"single","s":"检验因果假设最有说服力的研究设计类型是","c":"护理研究设计","sc":1,"o":{"A":"非实验性研究","B":"质性研究","C":"类实验性研究","D":"实验性研究"},"a":"D","e":"实验性研究通过随机分组、设立对照和干预，能最准确解释自变量与因变量间的因果关系，检验因果假设最有说服力。"},{"i":"2025_10_single_11","t":"single","s":"某研究者对某高中的学生的近视率进行调查，该高中共有20个班，每班均有40人。研究者采用以“班”为单位，使用抽签的方法随机抽取5个班，然后对抽到的5个班的所有学生进行调查。这种抽样方法为","c":"护理研究设计","sc":1,"o":{"A":"单纯随机抽样","B":"分层抽样","C":"整群抽样","D":"系统抽样"},"a":"C","e":"整群抽样先把个体聚集成群（如班级），随机抽取其中几个群，对被抽到群内所有个体组成样本全部调查。"},{"i":"2025_10_single_13","t":"single","s":"某研究者对吸毒者的健康状况进行调查，他先访问他能接触到的一位吸毒者，然后由被访问者推荐，再访问第二人，访问第二人后，由第二人推荐，再访问第三人，如此继续下去，逐渐增加样本量，最终达到研究目的。研究者所使用的这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"目的抽样","B":"滚雪球抽样","C":"理论抽样","D":"方便抽样"},"a":"B","e":"滚雪球（网络）抽样先访问有代表性的某人，再由其推荐访问下一人，像滚雪球一样增加样本，适合总体范围不清、难以寻找的特殊人群如吸毒者。"},{"i":"2025_10_single_14","t":"single","s":"研究者采用邮寄问卷的方法进行资料收集时，问卷回收率应尽可能达到","c":"资料收集的方法","sc":1,"o":{"A":"50%以上","B":"60%以上","C":"70%以上","D":"80%以上"},"a":"B","e":"邮寄问卷发放范围广但回收率较低，一般回收率60%以上较满意，回收率低于60%需慎重考虑研究有效性。"},{"i":"2025_10_single_15","t":"single","s":"描述随机事件发生可能性大小的一个度量，统计学上用符号P表示，称为","c":"研究资料的分析方法","sc":1,"o":{"A":"变异","B":"假设检验","C":"概率","D":"抽样误差"},"a":"C","e":"概率是描述随机事件发生可能性大小的度量，用符号P表示，P值范围在0～1之间。"},{"i":"2025_10_single_16","t":"single","s":"反映某一事物内部各组成部分所占的比重或分布的指标是","c":"研究资料的分析方法","sc":1,"o":{"A":"率","B":"均数","C":"相对比","D":"构成比"},"a":"D","e":"构成比反映某一事物内部各构成部分所占的比重或分布；率反映某现象发生的频率。"},{"i":"2025_10_single_17","t":"single","s":"用同一工具两次或多次测定同一研究对象，所得结果的一致程度是指研究工具的","c":"研究工具性能的测定","sc":1,"o":{"A":"重测信度","B":"折半信度","C":"复本信度","D":"评定者间信度"},"a":"A","e":"重测信度反映工具的稳定性，即用同一工具两次或多次测定同一研究对象，计算两次结果的相关系数。"},{"i":"2025_10_single_18","t":"single","s":"护理论著的篇幅一般为","c":"护理论文的撰写","sc":1,"o":{"A":"1000~2000字","B":"3000~5000字","C":"6000~7000字","D":"8000~9000字"},"a":"B","e":"护理论著篇幅一般3000～5000字、平均4000字左右。"},{"i":"2025_10_single_19","t":"single","s":"有系统地针对个人、家庭、社会及各专科住院患者等护理工作进行总结和深入探讨分析的论文是","c":"护理论文的撰写","sc":1,"o":{"A":"护理个案论文","B":"护理经验论文","C":"护理研究论文","D":"护理综述论文"},"a":"A","e":"护理个案论文是有系统地针对个人、家庭、社会及各专科住院患者等护理工作进行总结和深入探讨分析的临床护理论文。"},{"i":"2025_10_single_20","t":"single","s":"为体现护理综述论文的新颖性，作者引用近3年发表过的文献应占到总引用文献的","c":"护理论文的撰写","sc":1,"o":{"A":"40%以上","B":"50%以上","C":"60%以上","D":"70%以上"},"a":"D","e":"综述引用文献一般为近3～5年发表，国内期刊一般要求20～30篇，其中近3年发表的应占70%以上。"},{"i":"2025_10_multi_21","t":"multi","s":"以下属于护理研究中研究者应遵循的伦理准则的是","c":"绪论","sc":2,"o":{"A":"客观性","B":"真实性","C":"诚实性","D":"包容性","E":"平等性"},"a":"ABCE","e":"研究者除三项基本伦理原则外，还应遵循客观性、真实性、诚实性、合作性、平等性、效率性等伦理准则。"},{"i":"2025_10_multi_22","t":"multi","s":"按照文献的级别，属于一次文献的是","c":"医学信息的获取与利用","sc":2,"o":{"A":"期刊论文","B":"实验记录","C":"学位论文","D":"百科全书","E":"专利说明书"},"a":"ACE","e":"一次文献即原始文献，如期刊论文、学位论文、会议论文、研究报告、专利说明书；实验记录属零次文献，百科全书属三次文献。"},{"i":"2025_10_multi_23","t":"multi","s":"某研究者计划应用不同的宣教方法对高血压患者进行同样内容的健康宣教，分析其所产生的不同的健康教育效果。在此研究中，可能的因变量是","c":"护理研究的基本程序","sc":2,"o":{"A":"患者的知识变化","B":"研究者的倾向性","C":"宣教内容","D":"宣教的环境因素","E":"患者的疾病管理能力变化"},"a":"AE","e":"因变量是随自变量（宣教方法）变化、拟观测的健康教育效果，如患者知识变化、疾病管理能力变化；宣教内容/方法是自变量，研究者倾向性、宣教环境因素是外变量。"},{"i":"2025_10_multi_24","t":"multi","s":"从文献的外表特征进行检索的途径有","c":"医学信息的获取与利用","sc":2,"o":{"A":"分类途径","B":"书名途径","C":"主题途径","D":"关键词途径","E":"著者途径"},"a":"BE","e":"按外表特征的检索途径有书名途径、著者途径、序号途径；分类途径、主题途径、关键词途径属按内容特征的检索途径。"},{"i":"2025_10_multi_25","t":"multi","s":"关于质性研究的描述正确的是","c":"护理研究设计","sc":2,"o":{"A":"以人道主义和自然主义为哲学基础","B":"要求从参与者的观点来看待问题","C":"以实验经验论或实证论为基础","D":"运用的是归纳推理","E":"目的是预测和控制"},"a":"ABD","e":"质性研究建立在诠释主义/批判主义（人道主义、自然主义）哲学观上，要求从参与者观点看问题，运用归纳推理从资料中产生理论；实证论、预测和控制是量性研究的特征。"},{"i":"2025_10_multi_28","t":"multi","s":"下列有关质性研究设计特点的描述不正确的有","c":"护理研究设计","sc":2,"o":{"A":"质性研究要求研究人员深入研究情景","B":"质性研究的资料分析是在收集资料之后","C":"质性研究具有整体性","D":"质性研究的资料收集方法比较单一","E":"质性研究常首选概率抽样法进行抽样"},"a":"BDE","e":"质性研究资料收集与分析同步进行而非收集后才分析；一般综合多种资料收集方法而非单一；常采用立意（目的）抽样而非首选概率抽样。深入研究情景、具有整体性是其正确特点。"},{"i":"2025_10_multi_30","t":"multi","s":"在使用重测信度时，需要考虑的问题有","c":"研究工具性能的测定","sc":2,"o":{"A":"两次测量之间的相隔时间","B":"研究工具的内在一致性","C":"研究工具所测量变量的性质","D":"测量环境的一致","E":"测量样本的不同来源"},"a":"ACD","e":"使用重测信度需考虑：两次测量间隔时间、所测变量性质（只适用于相对稳定变量）、测量环境的一致；内在一致性由折半信度/Cronbach's α反映。"},{"i":"2025_10_multi_32","t":"multi","s":"下列属于计数资料的有","c":"研究资料的分析方法","sc":2,"o":{"A":"年龄（岁）","B":"病程(年)","C":"性别（男/女）","D":"职业（工人/农民/干部）","E":"满意度（非常满意、一般、不满意）"},"a":"CD","e":"计数资料是无序分类资料，如性别（男/女）、职业（工人/农民/干部）；年龄、病程为计量资料，满意度为等级资料。"},{"i":"2025_10_multi_33","t":"multi","s":"统计表绘制的注意事项有","c":"研究资料的分析方法","sc":2,"o":{"A":"重点突出","B":"简洁、明了","C":"层次清楚","D":"统计表与文字描述结合使用","E":"用相同宽度的直条长短"},"a":"ABCD","e":"绘制统计表应重点突出（一表一个中心）、层次清楚、简洁明了，并与文字描述结合而不简单重复表中数字；“相同宽度直条长短”是直条图的要求。"},{"i":"2025_10_term_39","t":"term","s":"单纯随机抽样","c":"护理研究设计","sc":4,"at":"参考答案（要点）：单纯随机抽样是最基本的概率抽样方法，先将总体中全部个体统一编号，再用抽签法或查随机数字表法随机抽取，使每个个体被选中的机会完全相等。其优点是简便易行、计算抽样误差方便，缺点是大规模调查逐一编号困难费时。","e":""},{"i":"2025_10_short_40","t":"short","s":"简述理论/概念框架的作用。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：①统领文献知识：是研究者提出研究的理论依据，为研究提出思路、确立范围，把片段知识放在更大理论框架中利于理解整合；②呈现研究相关概念及概念间关系：指导研究者总结组织出有序的研究结构，可用图表示，使概念与假设更清楚；③呈现研究设计方法：从概念间关系结构可看出研究属于何种性质的设计方式；④作为研究结果整理、分析与解释的依据：帮助理解现象本质、认识原因、预测趋势，使结果不致成为零散无组织的报告。","e":""},{"i":"2025_10_short_41","t":"short","s":"简述护理研究设计中设立对照组的目的。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：设立对照组是为了排除与研究无关的干扰因素（外变量）的影响，突出试验中干预措施的效应。通过对照使与试验无关的因素均匀地分布到实验组和对照组，使两组除干预措施不同外其他因素分布尽可能均衡，从而把观察到的差异归因于干预。护理研究中对照组应继续接受常规护理，不能不给予任何护理。","e":""},{"i":"2025_10_short_42","t":"short","s":"简述评定者间信度和复本信度常在何种情况下考虑。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：二者均反映研究工具的等同性。①评定者间信度：当不同评定者使用相同工具同时测量相同对象时，需计算评定者间一致程度（观察结果为分类时用一致项目数比例估算，为数字时计算结果间相关系数）。②复本信度：当两个大致相同的研究工具（复本）同时用于研究对象时，需计算复本信度（如两份形式不同但考核内容相同的试卷，随机确定作答先后后计算得分相关系数），护理研究中较少见。","e":""},{"i":"2025_10_short_43","t":"short","s":"简述检测原量表与中文版量表之间等同性的做法。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：寻找一定数量既懂中文又懂原语言的双语样本，让其对两种语言版本分别作答，比较两版本总分及各项目得分的相关性，相关程度越高等同性越好；若获取双语样本困难，也可选取一定数量只懂中文的样本进行预试验，了解中文版文字是否通俗易懂、是否符合中国人表达习惯，同时进行信度检测（如间隔两周再测重测信度、做因子分析看结构是否与原量表一致）。","e":""},{"i":"2025_10_application_44","t":"application","s":"某护理论文题目为“一例羊水栓塞致心脏骤停20分钟及多器官功能衰竭的抢救与护理”，此题目有什么问题？如何修改？修改后达到什么目的？","c":"护理论文的撰写","sc":10,"at":"参考答案（要点）：\n（1）存在的问题：该题目过长（达28字），超过文题一般不超过20个汉字的要求，且同时包含“心脏骤停20分钟”和“多器官功能衰竭”两个并列重点，题目不突出、不简明。\n（2）修改方法：按论文实际侧重，二选一精简——如侧重心脏骤停抢救改为“一例羊水栓塞致心脏骤停20分钟的抢救与护理”；如侧重多器官功能衰竭护理改为“一例羊水栓塞致多器官功能衰竭的抢救与护理”。确需长题时可用破折号加副标题补充。\n（3）修改后达到的目的：使文题符合简明、切题、规范的要求，突出论文最核心、最有特点的内容，便于读者迅速把握论文主题，也利于文献索引和检索。","e":""}]}]},{"id":"management","name":"护理管理学","code":"03006","color":"#c77a2e","icon":"📊","wrongKey":"nursing_management_wrong_v1","papers":[{"key":"2016_10","name":"2016年10月","qs":[{"i":"2016_10_single_1","t":"single","s":"管理者在复杂环境中找出关键性的影响因素，属于","c":"领导","sc":1,"o":{"A":"专业技能","B":"人际技能","C":"概念技能","D":"创造技能"},"a":"C","e":"概念技能指纵观全局、洞察复杂环境并找出关键影响因素的能力；专业技能对应专业技术，人际技能对应处理人际关系。"},{"i":"2016_10_single_2","t":"single","s":"在管理方格理论中，贫乏管理的领导方式是","c":"领导","sc":1,"o":{"A":"1.1型管理","B":"1.9型管理","C":"9.9型管理","D":"9.1型管理"},"a":"A","e":"1.1型为贫乏型管理，对业绩和对人关心都很少；1.9为乡村俱乐部型，9.9为团队型，9.1为权威型。"},{"i":"2016_10_single_3","t":"single","s":"根据领导四分图理论，对新上岗的护士最适宜采取的领导方式是","c":"领导","sc":1,"o":{"A":"高任务、高关系","B":"低任务、低关系","C":"低任务、高关系","D":"高任务、低关系"},"a":"D","e":"新上岗护士工作成熟度低、需明确指导，对应高任务（抓组织）、低关系（低关心人）的命令式领导方式。"},{"i":"2016_10_single_4","t":"single","s":"下列属于前馈控制的是","c":"控制","sc":1,"o":{"A":"实行护士资格准入","B":"护士自我控制","C":"患者满意度调查","D":"护理人员绩效考核"},"a":"A","e":"护士资格准入是在系统输入阶段进行的预防性控制，属前馈控制；自我控制属现场/同期控制，满意度调查与绩效考核属反馈控制。"},{"i":"2016_10_single_5","t":"single","s":"下列属于控制主体的是","c":"控制","sc":1,"o":{"A":"作业","B":"偏差测量机构","C":"组织的总体绩效","D":"信息"},"a":"B","e":"施控系统即控制主体，由偏差测量机构、决策机构和执行机构组成；作业、信息、组织总体绩效属受控客体。"},{"i":"2016_10_single_6","t":"single","s":"管理职能的前提是","c":"计划","sc":1,"o":{"A":"控制","B":"计划","C":"决策","D":"领导"},"a":"B","e":"从管理职能的作用看，计划是前提，周密详细的计划是有效管理活动的重要前提，组织、领导、控制均围绕计划展开。"},{"i":"2016_10_single_7","t":"single","s":"护理人员的资质、能力、品格应与所担负的工作职责相对应，体现了护理人员编配的","c":"护理人力资源管理","sc":1,"o":{"A":"功能需要原则","B":"能级对应原则","C":"结构合理原则","D":"成本效率原则"},"a":"B","e":"能级对应原则指按人员能力大小安排相应岗位，使资质、能力、品格与所担负工作职责相对应。"},{"i":"2016_10_single_8","t":"single","s":"护理人员绩效考核中的下属评价，需主要注意的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"考核前评价者应接受必要的培训","B":"护士应具有较高的成熟度","C":"应对评价者的姓名保密，并保护评价者","D":"应将考核结果公开"},"a":"C","e":"下属评价时担心实事求是评价上级遭报复，故需对评价者姓名保密以获得真实结果，并保护评价者。"},{"i":"2016_10_single_9","t":"single","s":"寻找问题并制定改进措施，属于PDCA循环中的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"C","e":"教材明确检查阶段（C）即对照计划检查实际情况，对比分析实际效果与预期目标，寻找计划执行中的问题并进行改进。"},{"i":"2016_10_single_10","t":"single","s":"对发生的风险事件进行分析、总结并制定整改措施，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险前控制","B":"风险中控制","C":"风险后控制","D":"风险评估"},"a":"C","e":"风险后控制指控制风险事件、处理紧急情况后进入善后重建阶段，重点在于检讨改进、分析总结并修订常规办法。"},{"i":"2016_10_single_11","t":"single","s":"定期进行护理安全隐患报告，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险评估","C":"风险控制","D":"风险监察"},"a":"D","e":"风险监察指风险管理组织和个人定期或不定期监察护理风险，包括临床监督与考核、不安全事件及安全隐患报告、安全查房等。"},{"i":"2016_10_single_12","t":"single","s":"管理的难度在于准确地把握人性，体现了管理中的","c":"管理理念","sc":1,"o":{"A":"对立统一观","B":"法制观","C":"人本主义观","D":"伦理观"},"a":"C","e":"管理的主体是人，人的复杂性决定了管理的复杂性，管理的难度在于准确把握人性，体现管理中的人本主义观。"},{"i":"2016_10_single_13","t":"single","s":"属于社区健康教育评价指标的是","c":"社区护理管理","sc":1,"o":{"A":"护理服务满意率","B":"卫生知识达标率","C":"差错事故发生率","D":"慢性病患者访视率"},"a":"B","e":"卫生知识达标率属反映人群卫生知识水平的健康教育评价指标；护理服务满意率、差错事故发生率、慢性病患者访视率属社区护理质量评价指标。"},{"i":"2016_10_single_14","t":"single","s":"“霍桑实验”的主持者是","c":"管理理论","sc":1,"o":{"A":"梅奥","B":"法约尔","C":"泰罗","D":"麦格雷戈"},"a":"A","e":"梅奥主持霍桑实验，据此提出人际关系理论，发现企业内部存在非正式组织。"},{"i":"2016_10_single_15","t":"single","s":"提出“法约尔跳板原理”的管理理论是","c":"管理理论","sc":1,"o":{"A":"科学管理理论","B":"一般管理理论","C":"行政组织理论","D":"人际关系理论"},"a":"B","e":"法约尔是一般管理理论（管理过程理论）的代表，跳板（法约尔桥）原理是其提出的横向沟通原则。"},{"i":"2016_10_single_16","t":"single","s":"管理应具有伸缩性，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"弹性原则","B":"整分合原则","C":"反馈原则","D":"能级原则"},"a":"A","e":"弹性原则指管理应具有伸缩性，决策和处理问题留有余地，以适应内外部环境变化和突发情况。"},{"i":"2016_10_single_17","t":"single","s":"中国卫生事业发展规划属于","c":"计划","sc":1,"o":{"A":"高层计划","B":"中层计划","C":"底层计划","D":"作业计划"},"a":"A","e":"中国卫生事业发展规划是由高层制定的、涉及全局的长远战略性计划，属高层计划。"},{"i":"2016_10_single_18","t":"single","s":"“组织的共同愿景是所有创造性个体的共同理想”，该组织类型是","c":"组织","sc":1,"o":{"A":"官僚制组织","B":"非正式组织","C":"学习型组织","D":"网络组织"},"a":"C","e":"学习型组织首要特征是组织成员拥有共同愿景，共同愿景是所有创造性个体的共同理想。"},{"i":"2016_10_single_19","t":"single","s":"属于组织文化制度层的是","c":"组织","sc":1,"o":{"A":"组织的职业道德","B":"组织的风俗习惯","C":"组织的企业标志","D":"组织的工作环境"},"a":"B","e":"教材指出制度层主要指组织成员共同活动中应遵循的行为准则及风俗习惯；职业道德属精神层，企业标志、工作环境属物质层。"},{"i":"2016_10_single_20","t":"single","s":"非正式组织的特点是","c":"组织","sc":1,"o":{"A":"领导者具有新角色","B":"组织成员职务稳定","C":"高度的流动性和灵活性","D":"社会距离感消失"},"a":"D","e":"非正式组织中成员背景相同、感情融洽，彼此间社会距离感缩短甚至消失；其稳定性弱，成员职务并不固定。"},{"i":"2016_10_multi_21","t":"multi","s":"泰罗科学管理理论的主要内容有","c":"管理理论","sc":2,"o":{"A":"劳动方法标准化","B":"建立参谋机构","C":"培训工人科学化","D":"差别计件工资制","E":"管理职能专业化"},"a":"ACDE","e":"泰罗科学管理包括劳动方法标准化、科学培训工人、差别计件工资制、计划与执行分离（管理职能专业化）；建立参谋机构属法约尔一般管理理论。"},{"i":"2016_10_multi_22","t":"multi","s":"下列关于目标管理的叙述，正确的有","c":"计划","sc":2,"o":{"A":"目标管理是一种管理方法","B":"管理者和组织成员共同制定目标","C":"根据对每个成员的预期结果来规定他们的主要职责范围","D":"强调自我管理","E":"强调上级评价"},"a":"ABCD","e":"目标管理是一种由管理者与成员共同制定目标、按预期结果规定职责、强调自我控制和自我评价的管理方法；E错误，目标管理强调自我（自我评价）而非上级评价。"},{"i":"2016_10_multi_23","t":"multi","s":"根据双因素理论，属于激励因素的有","c":"领导","sc":2,"o":{"A":"工作物质条件","B":"成就","C":"责任感","D":"提升","E":"地位"},"a":"BCD","e":"激励因素多与工作内容和成果有关，如成就、责任感、提升（认可）；工作物质条件、地位（工资、人际关系等）属保健因素。"},{"i":"2016_10_multi_24","t":"multi","s":"关于护理人员职业生涯规划早期阶段的描述，正确的有","c":"护理人力资源管理","sc":2,"o":{"A":"发生在从业5～10年","B":"职业要求是熟悉业务、积累经验","C":"主要问题是没有时间进行自我反省，易忽视自我发展","D":"管理者应引导护士进行自我评估和准确定位","E":"应培养护士的管理能力，提高护理科研能力"},"a":"ABD","e":"早期阶段指从业5~10年（22~30岁），要求熟悉业务积累经验，管理策略为引导自我评估准确定位；C“没有时间自我反省、忽视自我发展”属中期阶段问题，E“培养管理与科研能力”属中期阶段策略。"},{"i":"2016_10_multi_25","t":"multi","s":"临床路径的特点包括","c":"护理质量管理","sc":2,"o":{"A":"强调时效性","B":"强调有效性","C":"关注实践性","D":"强调完整性和合作性","E":"强调合理费用"},"a":"ABCDE","e":"临床路径特点：用工作流程图表示的设计好的计划；强调时效性、有效性，关注实践性，强调完整性和合作性，强调合理费用。"},{"i":"2016_10_term_26","t":"term","s":"反馈原则","c":"现代管理的基本原则","sc":3,"at":"参考答案（要点）：指在管理中要随时注意收集反馈信息，并与管理目的进行比较，当行动偏离目的时及时进行调整，以达到预期管理目的；通过反馈使管理不断进步完善，促使计划不脱离实际又保证计划贯彻落实，PDCA循环即反馈原则的应用。","e":""},{"i":"2016_10_term_27","t":"term","s":"组织结构","c":"组织","sc":3,"at":"参考答案（要点）：指表现组织各部分顺序、空间位置、聚集状态、联系方式以及各要素之间相互关系的一种模式，是组织中各部门、机构及成员之间权责关系的结合方式；既包括组织内部的指挥系统和沟通网络，也包括成员在不同层级、部门的责任、权利及相互关系，本质是组织职位、职权、职责的分配和分割。","e":""},{"i":"2016_10_term_28","t":"term","s":"医疗过失行为","c":"护理质量管理","sc":3,"at":"参考答案（要点）：指医务人员在医疗活动中，因违反医疗卫生管理法律、行政法规、部门规章制度和诊疗护理常规，不是主观故意但客观上有过失而造成患者损害的医疗行为。","e":""},{"i":"2016_10_term_29","t":"term","s":"护理成本","c":"控制","sc":3,"at":"参考答案（要点）：指在为患者提供诊疗、监护、防治、基础护理技术及服务过程中物化劳动和活化劳动的消耗；物化劳动指物质资料消耗，活化劳动指脑力和体力劳动消耗，其成果价值用货币表示，包括人员工资、福利、设备仪器、供应物品、教育培训经费等。","e":""},{"i":"2016_10_term_30","t":"term","s":"领导","c":"领导","sc":3,"at":"参考答案（要点）：领导是一种影响力，是对人们实施影响的科学与艺术并存的管理过程；好的领导能使人们心甘情愿、积极主动地为实现组织或群体目标而努力。其本质是一种影响力，是一个管理过程，根本目的是引导人们实现组织目标。","e":""},{"i":"2016_10_short_31","t":"short","s":"简述能级原则在护理管理中的应用。","c":"现代管理的基本原则","sc":5,"at":"参考答案（要点）：①准确全面掌握下属的能力结构和特长，按其特长安排工作，知人善任、用人所长，根据不同岗位对能力组合的要求安排适宜人员；②注重对护士能力的培养，为其创造学术交流、继续教育等学习机会，并按不同学历、职称、科室护士的能力缺陷有所侧重地培养；③注意能级的动态对应，当护士能力提高时可调换到较高职级岗位，同时注意优秀护士未必胜任更高管理岗位，必要时向下调整，并考虑体力精力变化对能力发挥的影响。","e":""},{"i":"2016_10_short_32","t":"short","s":"简述组织变革的内部环境因素。","c":"组织","sc":5,"at":"参考答案（要点）：①组织战略目标的调整，战略变化必然带来组织结构更新；②组织技术条件的变化，技术及技术设备水平影响职务设置、部门划分和结构形式；③组织人员条件的变化，知识员工看重自主、内在需要向高层次发展，要求改进工作设计与内容；④组织本身成长的要求，组织活动内容日趋复杂、人数增多、规模扩大，组织结构须随之调整。","e":""},{"i":"2016_10_short_33","t":"short","s":"简述护理人员排班的方法。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①周排班法：以每周为一个排班周期，由护士长或护理组长根据患者数量及病情危重程度安排，周期短、可动态调整，但费时费力、班次轮转频繁，我国绝大多数医院采用；②周期性排班法（循环排班）：以2~4周为周期依次循环，模式相对固定、省时省力，适用于人员结构稳定、患者数量和危重程度变化不大、年轻护士需业余学习的病房；③自我排班法：班次固定，由护理人员根据个人需要选择具体班次，适用于整体成熟度较高、素质较好的病房，我国因夜班薪酬差距小较难推广。","e":""},{"i":"2016_10_short_34","t":"short","s":"简述评价护理人员培训效果的常用方法。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①用书面调查表评价课堂理论培训效果；②以讨论形式让护理人员自己讲述学习收获和对培训的合理化建议；③学习后测验；④让护理人员自己定出行动计划，用行动证明学习结果；⑤观察受训护理人员的工作情况及在实际工作中运用新知识新技能的情况（如新业务开展率、操作合格率、差错减少率、患者满意率、成本消耗下降率等）；⑥比较护理人员培训前后的工作表现；⑦考察培训后护士能掌握的专业技术等。","e":""},{"i":"2016_10_short_35","t":"short","s":"简述在执行计划中领导与管理的区别。","c":"领导","sc":5,"at":"参考答案（要点）：在执行计划阶段，管理表现为控制、解决问题——相当详细地监督计划完成情况，发现偏差即制订计划、组织人员解决问题，重在维持秩序、按计划交货；领导表现为激励和鼓舞——通过唤起人们通常未得到满足的最基本需求，激励人们战胜变革过程中遇到的政治、官僚和资源方面的主要障碍，引起变革。简言之，管理是执行并维持秩序，领导是激励鼓舞、推动变革。","e":""},{"i":"2016_10_short_36","t":"short","s":"简述护理教学查房的意义。","c":"护理临床教学管理","sc":5,"at":"参考答案（要点）：①有利于培养学生的综合能力，通过设置问题、展开讨论调动学习兴趣，培养分析和解决问题的能力及语言表达、心理应激能力；②能强化理论联系实践，通过引证、分析、讨论加深对理论的理解、强化记忆，达到学以致用；③能全面观察学生的知识掌握程度和应用知识的能力，有利于培养创造性护理人才；④有助于提高带教老师的教学水平。","e":""},{"i":"2016_10_short_37","t":"short","s":"简述社区传染病预防管理的评价内容。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①护士对传染病报告卡的登记情况；②执行免疫接种工作的护士对免疫接种卡的管理情况及是否按相关要求进行免疫接种；③护士对常见传染病预防和控制知识的掌握情况（如传染病传染机制、消毒隔离目的和自我防护措施等）；④护士对传染病患者的健康教育情况；⑤护士对清洁区、半污染区和污染区的管理情况。","e":""},{"i":"2016_10_essay_38","t":"essay","s":"试述时间管理在护理管理中的应用。","c":"计划","sc":10,"at":"参考答案（要点）：护理工作具有责任重大、不确定因素多、需与有关方面密切配合等特点，运用时间管理方法对提高计划效果和管理效能有重要作用。具体做法：①养成每天记录的习惯，记录每天所做事情及其消耗的时间，对自己的时间消耗做到心中有数；②通过记录分析寻找时间浪费的原因，找出不必做的事情、可以委托或授权做的事情等；③根据合理安排时间的方法做好时间计划，保持时间利用的相对连续性，以避免时间浪费；④合理安排时间时还应学会授权，保证时间上的弹性管理。可结合时间“四象限”法和ABC分类法：把事务按重要与紧急程度分类，对紧急且重要的事务优先亲自处理、平时关注重要但不紧急的事务以避免其演变为紧急事务，对紧急但不重要的事务合理委托授权，对不紧急也不重要的事务尽力放弃，从而抓住主要问题、保证重点工作、有效利用时间。","e":""},{"i":"2016_10_essay_39","t":"essay","s":"试述护理管理工作的控制对象。","c":"控制","sc":10,"at":"参考答案（要点）：控制对象也称控制的内容，罗宾斯将其归纳为人员、财务、作业、信息和组织总体绩效五个方面。①对人员的控制：护理管理者控制对象包括各级护理管理者（护士长、总护士长、护理部正副主任及护理副院长等）、各级各类护理人员（护理员至主任护师）及护理专业学生（见习生、实习生、进修生），常用方法为直接巡视和系统化绩效评估；②对财务的控制：护理管理者主要进行护理预算和护理成本控制；③对作业的控制：作业指护士为患者提供各项护理服务的过程，常用护理技术控制、护理质量控制、材料及药品购买控制、库存控制等，以提高护理服务的效率和效果；④对信息的控制：建立护理管理信息系统，包括护理业务管理、行政管理、科研教学三个信息系统，及时为管理者提供充分可靠的信息；⑤对组织绩效（组织效率）的控制：科学评估、衡量组织绩效，反映组织目标的达成情况。","e":""}]},{"key":"2018_10","name":"2018年10月","qs":[{"i":"2018_10_single_1","t":"single","s":"管理者在处理与组织成员和其他利益相关者关系时所扮的角色是","c":"领导","sc":1,"o":{"A":"人际角色","B":"信息角色","C":"决策角色","D":"监督角色"},"a":"A","e":"人际角色（挂名首脑、领导者、联络者）处理的是与组织成员及利益相关者的关系；信息角色负责信息传递，决策角色负责决策。"},{"i":"2018_10_single_2","t":"single","s":"根据权变领导理论，对比较成熟的护士最适宜采取的领导方式是","c":"领导","sc":1,"o":{"A":"命令式","B":"说服式","C":"参与式","D":"授权式"},"a":"C","e":"情境领导第三象限参与式适用于下属比较成熟、基本能胜任工作又不愿被过多约束的情况，采取低任务高关系风格。"},{"i":"2018_10_single_3","t":"single","s":"下级只能执行上级决定，不能参与决策的领导方式是","c":"领导","sc":1,"o":{"A":"专制型","B":"民主型","C":"放任型","D":"参与型"},"a":"A","e":"专制型（独裁式）领导由个人单独作出决策、下级只能执行，不允许下级参与决策；民主型、参与型鼓励下级参与。"},{"i":"2018_10_single_4","t":"single","s":"下列属于控制对象的是","c":"控制","sc":1,"o":{"A":"偏差测量机构","B":"决策机构","C":"执行机构","D":"组织的总体绩效"},"a":"D","e":"偏差测量机构、决策机构、执行机构属施控系统（控制主体）；组织的总体绩效属受控客体即控制对象。"},{"i":"2018_10_single_5","t":"single","s":"下列属于组织文化精神层的内容是","c":"组织","sc":1,"o":{"A":"组织的最高目标","B":"组织的领导体制","C":"组织的规章制度","D":"组织的工作环境"},"a":"A","e":"精神层包括组织精神、最高目标、宗旨等；领导体制、规章制度属制度层；工作环境属物质层。"},{"i":"2018_10_single_6","t":"single","s":"根据控制的方式不同，可将控制分为","c":"控制","sc":1,"o":{"A":"生产控制、质量控制、成本控制和资金控制","B":"局部控制和全面控制","C":"正式组织控制、群体控制和自我控制","D":"内部控制和外部控制"},"a":"C","e":"教材明确按控制的方式不同分为正式组织控制、群体控制和自我控制；A按业务内容、B按全面性、D按来源划分。"},{"i":"2018_10_single_7","t":"single","s":"在护理人员排班方法中，周期性排班的特点是","c":"护理人力资源管理","sc":1,"o":{"A":"排班费时费力","B":"护理人员可以根据个人需要选择工作班次","C":"在实际工作中很难推广","D":"护士对自己未来一段时间的班次心中有数"},"a":"D","e":"周期性（循环）排班模式相对固定，每位护士对未来较长一段时间班次心中有数、可提前安排；A为周排班缺点，B、C为自我排班特点。"},{"i":"2018_10_single_8","t":"single","s":"护理人员培训实施阶段的内容是","c":"护理人力资源管理","sc":1,"o":{"A":"分析培训需求","B":"确立培训目标","C":"设计培训课程","D":"确定评价标准"},"a":"C","e":"分析培训需求、确立培训目标属准备阶段；设计培训课程、选择培训教师属实施阶段；确定评价标准属评价阶段。"},{"i":"2018_10_single_9","t":"single","s":"护理人员在职业生涯中期阶段的特点是","c":"护理人力资源管理","sc":1,"o":{"A":"安于现状，照顾家庭成为最大需求","B":"职业能力提高，责任心增强","C":"精力旺盛，争强好胜","D":"工作绩效不明显，稳定性低"},"a":"B","e":"中期阶段（10~25年）个人职业能力稳步提高、责任心增强，已成为工作骨干；A属后期，C、D属早期阶段特征。"},{"i":"2018_10_single_10","t":"single","s":"按照预定计划，认真执行各项措施属于PDCA循环的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"B","e":"实施阶段（D）即按照预定计划认真执行各项措施，并结合实际不断修正。"},{"i":"2018_10_single_11","t":"single","s":"下列关于临床路径的描述，错误的是","c":"护理质量管理","sc":1,"o":{"A":"在疾病的诊疗过程中应严格遵守纳入标准","B":"对不符合路径治疗的患者不应纳入路径","C":"进入路径的患者不得以任何理由终止路径","D":"临床路径对服务成本花费有严格的限定和控制"},"a":"C","e":"临床路径允许患者出现变异并依情况终止/退出路径，故“不得以任何理由终止”错误；其余三项均符合临床路径要求。"},{"i":"2018_10_single_12","t":"single","s":"“黑猫白猫抓住耗子就是好猫”体现了管理中的","c":"管理理念","sc":1,"o":{"A":"普遍联系观","B":"文化观","C":"质变观","D":"实践检验真理观"},"a":"D","e":"教材在阐述管理中“实践检验真理”观时引用邓小平“黑猫白猫抓住耗子就是好猫”，强调以实践结果检验管理成效。"},{"i":"2018_10_single_13","t":"single","s":"在社区健康教育评价中，反映人群健康水平的指标是","c":"社区护理管理","sc":1,"o":{"A":"患病率","B":"健康教育覆盖率","C":"个体保健活动参与率","D":"疫苗自愿接种率"},"a":"A","e":"反映人群健康水平的指标包括发病率、患病率、死亡率、平均期望寿命等；健康教育覆盖率、保健活动参与率、疫苗接种率属反映健康教育/保健服务的指标。"},{"i":"2018_10_single_14","t":"single","s":"管理例外原理的提出者是","c":"管理理论","sc":1,"o":{"A":"泰罗","B":"马斯洛","C":"麦格雷戈","D":"韦伯"},"a":"A","e":"例外原则（原理）由科学管理之父泰罗提出，主张管理者只处理例外的、超出常规的重要事项。"},{"i":"2018_10_single_15","t":"single","s":"法约尔的一般管理理论着重研究","c":"管理理论","sc":1,"o":{"A":"生产中工人的劳动效率","B":"管理过程和管理组织","C":"生产过程中的人际关系","D":"理想的行政组织理论"},"a":"B","e":"法约尔一般管理理论着重研究管理过程和管理组织（管理职能与原则）；A属泰罗科学管理，C属人际关系理论，D属韦伯行政组织理论。"},{"i":"2018_10_single_16","t":"single","s":"为实现组织目标，运用物质及精神鼓励来激发员工的潜力，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"整分合原则","B":"动力原则","C":"反馈原则","D":"能级原则"},"a":"B","e":"动力原则强调运用物质动力、精神动力和信息动力调动人的积极性、激发潜能，物质与精神鼓励即动力原则的运用。"},{"i":"2018_10_single_17","t":"single","s":"依据时间“四象限”进行分类，组织抢救病人属于","c":"计划","sc":1,"o":{"A":"紧急且重要的事务","B":"紧急但不重要的事务","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"A","e":"抢救病人时间紧迫又关系患者生命安全，属紧急且重要的事务，须立即优先亲自处理。"},{"i":"2018_10_single_18","t":"single","s":"科室“三基三严”培训计划属于","c":"计划","sc":1,"o":{"A":"战术计划","B":"战略计划","C":"作业计划","D":"中层计划"},"a":"C","e":"教材以护理人员急救技能培训计划、护理人员“三基三严”培训计划作为底层计划（作业计划）的实例，属具体业务活动的执行性计划。"},{"i":"2018_10_single_19","t":"single","s":"下列关于组织特征的描述，正确的是","c":"组织","sc":1,"o":{"A":"所有的组织都存在于特定的社会环境之中","B":"组织是由单一要素组成的系统","C":"组织是人们无意识建立起来的团体","D":"组织一旦形成是不会改变的"},"a":"A","e":"组织存在于特定社会环境中并与之相互作用；组织是多要素组成的开放系统、是人们为共同目标有意识建立的、并随环境变化而变革，故B、C、D错误。"},{"i":"2018_10_single_20","t":"single","s":"下列属于职能制组织结构缺点的是","c":"组织","sc":1,"o":{"A":"容易产生专制","B":"部门领导之间相互推卸责任","C":"实行多头领导，不利于组织的统一指挥","D":"适用于小型组织"},"a":"C","e":"职能制组织结构中各级行政单位除主管外还设职能机构，实行多头领导，妨碍统一指挥，不利于明确职责。"},{"i":"2018_10_multi_21","t":"multi","s":"关于护理人员绩效评价方法的描述，正确的包括","c":"护理人力资源管理","sc":2,"o":{"A":"绩效评价表法容易测量，易于推广","B":"目标管理法的缺点是耗时较长","C":"描述法侧重于描述护理人员在工作中的突出行为","D":"目标管理法带有主观成分，难以区分被评人员之间的差距","E":"关键事件法只记录对组织工作产生积极影响的重大行为"},"a":"ABC","e":"绩效评价表法易测量易推广(A对)；目标管理法需上下级共同讨论目标值、耗时较长(B对)；描述法侧重描述突出行为(C对)。D错误，带主观成分、难区分差距是描述法而非目标管理法；E错误，关键事件法同时记录有效行为和无效/错误（积极和消极）行为。"},{"i":"2018_10_multi_22","t":"multi","s":"影响护理人员编配的因素包括","c":"护理人力资源管理","sc":2,"o":{"A":"床位使用率","B":"护理人员素质","C":"医院的自然条件","D":"护理管理水平","E":"服务对象的经济条件"},"a":"ABCDE","e":"影响编配因素包括工作任务（含床位使用率等）、人员素质、工作环境（含医院自然条件）、管理水平、国家政策法规及社会因素（含服务对象经济条件），五项均属之。"},{"i":"2018_10_multi_23","t":"multi","s":"情境领导理论认为下属的成熟度包括","c":"领导","sc":2,"o":{"A":"生理成熟度","B":"心理成熟度","C":"年龄成熟度","D":"技能成熟度","E":"工作成熟度"},"a":"BE","e":"情境（生命周期）领导理论中，下属成熟度由工作成熟度（完成任务的能力、知识技能）和心理成熟度（承担责任的意愿、动机）两方面构成。"},{"i":"2018_10_multi_24","t":"multi","s":"护理人力资源管理的基本职能包括","c":"护理人力资源管理","sc":2,"o":{"A":"护理人员的招聘与录用","B":"护理人员的薪酬管理","C":"护理人员的劳动保护","D":"护理人员的档案管理","E":"护理人力资源规划"},"a":"ABCDE","e":"护理人力资源管理主要任务包括制定人力资源规划、招聘与录用、使用与培训、考核与开发、薪酬管理及劳动保护、护理档案管理及职业生涯规划管理，五项均属之。"},{"i":"2018_10_multi_25","t":"multi","s":"医疗过失行为责任程度可分为","c":"护理质量管理","sc":2,"o":{"A":"完全责任","B":"主要责任","C":"次要责任","D":"轻微责任","E":"医疗意外"},"a":"ABCD","e":"医疗过失行为责任程度分为完全责任、主要责任、次要责任、轻微责任四级；医疗意外属与医疗过失并列的概念，不属责任程度分级。"},{"i":"2018_10_term_26","t":"term","s":"非正式组织","c":"组织","sc":3,"at":"参考答案（要点）：指正式组织内的成员由于生活接触、感情交流、情趣相近、利害一致，未经人为设计而产生的交互行为，并由此形成的自然的人际关系；它既无法定地位，也缺乏固定形式和特定目的，对正式组织目标的达成会有促进、限制或阻碍作用。","e":""},{"i":"2018_10_term_27","t":"term","s":"授权","c":"领导","sc":3,"at":"参考答案（要点）：授权是激励员工的重要方法，指让员工自行设定工作目标、制定决策以及在一定的责任和权力范围内解决问题；它是一个宽泛的概念，包括但不限于工作本身。","e":""},{"i":"2018_10_term_28","t":"term","s":"职业生涯","c":"护理人力资源管理","sc":3,"at":"参考答案（要点）：指一个人在一生中所承担工作的相继历程，主要指专业或终身工作的历程；护理人员职业生涯即护理人员从事护理专业工作的行为历程。","e":""},{"i":"2018_10_term_29","t":"term","s":"风险评估","c":"护理质量管理","sc":3,"at":"参考答案（要点）：指对易出现风险的护理项目进行程度（低、中、高）和频率（低、中、高）的评估；评估时常借助相应评估工具，如用《Morse患者跌倒危险度评估表》评估跌倒风险、用量表评估压疮风险等，据以进行风险分级。","e":""},{"i":"2018_10_term_30","t":"term","s":"护理安全","c":"护理质量管理","sc":3,"at":"参考答案（要点）：指在实施护理活动的全过程中，患者不发生法律和法定的规章制度允许范围以外的心理、机体结构或功能上的损害、障碍、缺陷或死亡；其主体是护理服务对象（患者）。","e":""},{"i":"2018_10_short_31","t":"short","s":"简述科学管理理论的主要内容。","c":"管理理论","sc":5,"at":"参考答案（要点）：①劳动方法标准化（对操作动作进行科学研究，制定标准操作方法）；②科学地选择并培训工人（使工人能力与工作相匹配）；③实行差别计件工资制（刺激性报酬制度）；④计划与执行职能分离、管理职能专业化（设立专门计划部门，管理人员与工人分工）。","e":""},{"i":"2018_10_short_32","t":"short","s":"简述应用ABC分类法安排工作时间的步骤。","c":"计划","sc":5,"at":"参考答案（要点）：①每天工作开始时列出全天工作日程清单；②对清单上的工作按ABC等级（A最重要最迫切、B重要一般迫切、C无关紧要不迫切）进行分类及排序；③依据ABC类事务的特征及管理要点进行各项工作的时间安排；④按ABC三个等级逐一开展工作，首先全力投入A类工作，完成后进行B类工作，大量减少C类工作，记录各项工作实际完成时间；⑤每日总结分析，将计划时间安排与实际使用时间对比，分析时间运用效率，以便重新调整时间安排。","e":""},{"i":"2018_10_short_33","t":"short","s":"简述学习型组织的特征。","c":"组织","sc":5,"at":"参考答案（要点）：①组织成员拥有一个共同的愿景；②善于不断学习（本质特征，强调终身学习、全员学习、全过程学习、团体学习）；③组织结构扁平化（横向的组织结构）；④领导者扮演新角色（设计师、仆人和教师）；⑤授权的员工，强调自主管理；⑥组织的边界将被重新界定；⑦注重员工家庭与事业的平衡。","e":""},{"i":"2018_10_short_34","t":"short","s":"简述管理者使用直觉决策的常见情况。","c":"领导","sc":5,"at":"参考答案（要点）：管理者最有可能使用直觉决策的情况有：①不确定水平很高时；②没有先例可循时；③难以科学地预测时；④当需要从几个可行方案中选择一个、而每个方案的评价都很接近时；⑤时间有限且紧迫时。","e":""},{"i":"2018_10_short_35","t":"short","s":"简述护理人力资源规划的主要工作内容。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：护理人力资源规划是人力资源管理的基础性工作，包括三方面：①评价现有的护理人力资源；②预估将来需要的护理人力资源；③制定满足未来护理人力资源需要的行动方案。即明确哪些岗位需要护理人员、这些岗位人员应具备的基本素质、如何聘用到足够数量且最符合岗位要求的护理人员，以维持护理工作正常运行。","e":""},{"i":"2018_10_short_36","t":"short","s":"简述护理教学查房的形式。","c":"护理临床教学管理","sc":5,"at":"参考答案（要点）：按组织者不同可分为：①由教学组长或带教老师组织的教学查房（每周或隔周一次，按教学大纲、循序渐进安排病例）；②由科护士长或护士长组织的教学查房（每月一次，选病情复杂或新技术新业务病例）；③由护理部组织的教学查房（每2~3个月一次，选跨学科护理问题病例，起示范作用）。按组织方式不同还可分为：④预告式教学查房（事先通知、充分准备，临床最常采用）；⑤随机式教学查房（以临时遇到的有教学意义的个案边查边问边讲）。","e":""},{"i":"2018_10_short_37","t":"short","s":"简述社区护士应具备的基本条件。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①具有国家护士职业资格并经注册；②通过地（市）以上卫生行政部门规定的社区护士岗位培训；③独立从事家庭访视护理工作的社区护士，应具有在医疗机构从事临床护理工作5年以上的工作经历。","e":""},{"i":"2018_10_essay_38","t":"essay","s":"试述精神鼓励的方法。","c":"现代管理的基本原则","sc":10,"at":"参考答案（要点）：精神鼓励是人们的行为受到社会承认后给予的各种精神激励，属于动力原则中的精神动力，必须坚持实事求是的原则。常用方法：①正强化：恰当地设计人们的工作环境，并对完成的工作加以表扬，从而激发其积极性；②让员工参与管理：鼓励下属参与一些可给予他们管理的事务，提高下属的主人翁责任感；③使职务具有挑战性和富有意义，大胆启用胸有成竹、有胆识、有魄力、能胜任高一级职务的人；④管理者应及时、准确掌握下属的工作情况、精神状态和工作热情，采取适当有效的鼓励，如表扬、嘉奖、评先进、树立榜样，把消极态度转变为积极态度；同时还应对上级表示理解支持、对同级善于激励支持，将上、下、左、右的激励结合起来，形成完善的激励。","e":""},{"i":"2018_10_essay_39","t":"essay","s":"试述控制过程的主要步骤。","c":"控制","sc":10,"at":"参考答案（要点）：控制过程包括三个关键步骤——确立标准、衡量绩效、评价并纠正偏差。①确立标准：是控制的基础，包括确定控制对象（选择对实现组织目标有重大影响的因素重点控制）、选择控制的关键点（重要操作事项、能在重大损失前显示差异的事项、反映主要绩效水平的时空均衡控制点；护理管理关键点包括核心制度落实、重点护理人员、重点患者、器材设备药品、特殊科室、关键时间）、分解目标并确立控制标准（分定量与定性标准）。②衡量工作绩效：对照标准衡量实际工作绩效，目的是取得控制对象的有关信息，包括确定衡量项目、衡量方法（观察、报表报告、抽样调查、召开会议、通过现象推断）、衡量频度、衡量主体，并建立有效的信息反馈系统（信息及时、可靠、实用）。③评价并纠正偏差：将实际绩效与标准比较，判断偏差及其程度，分析偏差原因，对无偏差的继续控制，对有偏差的采取纠正措施，必要时修订标准或改进工作。","e":""}]},{"key":"2019_4","name":"2019年4月","qs":[{"i":"2019_4_single_1","t":"single","s":"对于高层管理者最重要的技能是","c":"领导","sc":1,"o":{"A":"专业技能","B":"人际技能","C":"概念技能","D":"创造技能"},"a":"C","e":"层次越高，越需纵观全局、洞察环境、作出战略判断，概念技能对高层管理者最为重要；专业技能对基层更重要。"},{"i":"2019_4_single_2","t":"single","s":"在管理方格理论中，最有效的领导方式是","c":"领导","sc":1,"o":{"A":"1.1型管理","B":"1.9型管理","C":"9.9型管理","D":"9.1型管理"},"a":"C","e":"9.9型团队型管理对工作和对人都极为关心，是最理想、最有效的领导方式。"},{"i":"2019_4_single_3","t":"single","s":"根据权变领导理论，对高度成熟的护士最适宜采取的领导方式是","c":"领导","sc":1,"o":{"A":"命令式","B":"说服式","C":"参与式","D":"授权式"},"a":"D","e":"第四象限授权式适用于下属高度成熟、既有能力又有热情的情况，赋予其权力让其自行决策、自我负责。"},{"i":"2019_4_single_4","t":"single","s":"选择控制的关键点属于控制过程中的","c":"控制","sc":1,"o":{"A":"确立标准","B":"衡量工作绩效","C":"评价偏差","D":"采取纠正措施"},"a":"A","e":"确立标准阶段包括确定控制对象、选择控制的关键点、分解目标并确立控制标准三个环节。"},{"i":"2019_4_single_5","t":"single","s":"从管理职能的作用看，控制是","c":"控制","sc":1,"o":{"A":"保证","B":"前提","C":"关键","D":"手段"},"a":"D","e":"教材明确：从管理职能作用看，计划是前提，组织是保证，领导和决策是关键，控制是手段。"},{"i":"2019_4_single_6","t":"single","s":"选择影响全局的关键环节进行控制，体现了控制的","c":"控制","sc":1,"o":{"A":"客观性原则","B":"重点性原则","C":"灵活性原则","D":"目的性原则"},"a":"B","e":"重点性原则要求选择对实现组织目标有重大影响的关键环节和重点对象进行控制，而非面面俱到。"},{"i":"2019_4_single_7","t":"single","s":"培养护士观察问题、分析问题和解决问题能力的最好方法是","c":"护理临床教学管理","sc":1,"o":{"A":"讲授法","B":"演示法","C":"研讨会","D":"案例分析法"},"a":"D","e":"案例分析法通过对实际病例的分析讨论，最能培养护士观察、分析和解决问题的能力；讲授法以系统灌输知识为主。"},{"i":"2019_4_single_8","t":"single","s":"护理绩效考核中，自我评价的优点是","c":"护理人力资源管理","sc":1,"o":{"A":"直接观察下属的工作表现和业绩","B":"工作成员因相互了解能准确地作出评价","C":"真实反映领导者的业绩","D":"护理人员随时对自己的工作进行反思"},"a":"D","e":"自我评价由护理人员对照标准评价自己，其优点是可随时对自己工作进行反思、利于自我控制；A为上级评价特点，B为同事评价特点。"},{"i":"2019_4_single_9","t":"single","s":"护士在职业生涯后期存在的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"稳定性较低，容易迷失自我","B":"没有足够的时间和精力进行自我反省","C":"面临极大的竞争压力","D":"整体职业能力呈现下降趋势"},"a":"D","e":"后期阶段（25年以上）护士各方面能力呈下降趋势、精力体力减退，安于现状；A属早期，B、C属中期问题。"},{"i":"2019_4_single_10","t":"single","s":"下列属于护理技术质量标准的是","c":"护理质量管理","sc":1,"o":{"A":"护师职责","B":"病区环境管理质量标准","C":"物理降温法操作规范","D":"药品管理制度"},"a":"C","e":"护理技术质量标准是对护理技术操作的规范要求，如物理降温法操作规范；护师职责、药品管理制度属管理标准，病区环境管理质量标准属地理/环境质量标准。"},{"i":"2019_4_single_11","t":"single","s":"对护士进行安全知识的培训属于","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险评估","C":"风险控制","D":"风险监察"},"a":"C","e":"对护士进行业务与安全知识培训、提高其素质是风险前控制的重要措施，属风险控制环节；风险鉴别是识别风险来源，风险监察是监督检查。"},{"i":"2019_4_single_12","t":"single","s":"提出“劳动方法标准化”的理论是","c":"管理理论","sc":1,"o":{"A":"人际关系理论","B":"一般管理理论","C":"科学管理理论","D":"行政组织理论"},"a":"C","e":"泰罗科学管理理论主张对操作动作进行科学研究、实现劳动方法标准化。"},{"i":"2019_4_single_13","t":"single","s":"下列属于社区健康教育评价指标的是","c":"社区护理管理","sc":1,"o":{"A":"护理服务满意率","B":"卫生知识达标率","C":"差错事故发生率","D":"慢性病患者访视率"},"a":"B","e":"卫生知识达标率属反映人群卫生知识水平的健康教育评价指标；护理服务满意率、差错事故发生率、慢性病患者访视率属社区护理质量评价指标。"},{"i":"2019_4_single_14","t":"single","s":"“需求层次理论”的创建者是","c":"领导","sc":1,"o":{"A":"马斯洛","B":"泰罗","C":"麦格雷戈","D":"赫茨伯格"},"a":"A","e":"需要层次理论由马斯洛提出，将人的需要由低到高分为生理、安全、社交、尊重、自我实现五个层次。"},{"i":"2019_4_single_15","t":"single","s":"根据护士的能力安排相应岗位，做到人尽其才，体现的是","c":"现代管理的基本原则","sc":1,"o":{"A":"整分合原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"D","e":"能级原则指按人的能力大小分级、与相应岗位层级对应，使人尽其才、各尽所能。"},{"i":"2019_4_single_16","t":"single","s":"护理小组根据工作任务制定多种备选方案，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"弹性原则","B":"整分合原则","C":"反馈原则","D":"动力原则"},"a":"A","e":"弹性原则要求管理留有余地、制定可调节的备选方案，以适应环境变化和突发情况。"},{"i":"2019_4_single_17","t":"single","s":"医院护理人才队伍建设规划属于","c":"计划","sc":1,"o":{"A":"战术计划","B":"战略计划","C":"作业计划","D":"中层计划"},"a":"B","e":"教材以医院护理人才队伍建设规划作为高层计划（战略计划）的实例，具有长远性、全局性。"},{"i":"2019_4_single_18","t":"single","s":"根据客观环境的变化，对计划进行修订和调整，体现了计划的","c":"计划","sc":1,"o":{"A":"目的性","B":"适应性","C":"普遍性","D":"经济性"},"a":"B","e":"计划的适应性指计划应随客观环境变化适时修订调整，保持对内外环境的适应。"},{"i":"2019_4_single_19","t":"single","s":"组织分工过程层层进行，每个人只从事有限任务的组织类型是","c":"组织","sc":1,"o":{"A":"官僚制组织","B":"非正式组织","C":"学习型组织","D":"网络组织"},"a":"A","e":"官僚制组织强调明确的职位等级结构和高度专业化分工，分工层层进行、每人只从事有限任务；学习型组织则是扁平、授权、团队式的。"},{"i":"2019_4_single_20","t":"single","s":"直线制组织结构的优点是","c":"组织","sc":1,"o":{"A":"能解决组织结构相对稳定与管理任务多变之间的矛盾","B":"指挥统一，权责分明","C":"增强组织的灵活性和适应性","D":"有利于加强各职能部门的协调与配合"},"a":"B","e":"直线制组织结构简单、权力集中、指挥统一、权责分明；A、D为矩阵制特点，C非直线制优点。"},{"i":"2019_4_multi_21","t":"multi","s":"现代管理的理念包括","c":"管理理念","sc":2,"o":{"A":"“对立统一”观","B":"“普遍联系”观","C":"“发展”观","D":"“度和量变、质变”观","E":"“实践检验真理”观"},"a":"ABCDE","e":"现代管理理念包括对立统一观、普遍联系观、发展观、度和量变质变观、实践检验真理观以及人本主义观，选项五项均属之。"},{"i":"2019_4_multi_22","t":"multi","s":"依据整分合原则，科学的系统分解应符合的要求包括","c":"现代管理的基本原则","sc":2,"o":{"A":"分解要适度","B":"分解要完全","C":"分解不能出现多余部分和环节","D":"分解后各部分的比例要合理","E":"分解要配套"},"a":"ABCDE","e":"科学的系统分解主要要求：分解要适度、分解要完全、分解不能出现多余部分和环节、分解后各部分比例要合理、分解要配套，五项均属之。"},{"i":"2019_4_multi_23","t":"multi","s":"依据时间“四象限”法分类，下列属于重要但不紧急的工作有","c":"计划","sc":2,"o":{"A":"人事危机","B":"人员培训","C":"制定未来工作计划","D":"建立人际关系","E":"客户投诉"},"a":"BCD","e":"人员培训、制定未来工作计划、建立人际关系属重要但不紧急的事务，应平时重点投入、避免演变为紧急事务；人事危机、客户投诉属紧急且重要的事务。"},{"i":"2019_4_multi_24","t":"multi","s":"关于授权原则的描述，正确的包括","c":"领导","sc":2,"o":{"A":"权力向下延伸时必须有诚意","B":"应保持授权政策的一贯性","C":"可先在几个领域象征性授权","D":"应做到系统和耐心","E":"应培训员工，使其具备行使权力的能力"},"a":"ABDE","e":"授权原则包括：权力向下延伸必须有诚意（不能只在少数领域象征性授权，故C错）、保持授权政策一贯性、授权要系统和耐心、并准备增加培训投入使员工具备行权能力。"},{"i":"2019_4_multi_25","t":"multi","s":"下列关于目标的叙述，正确的包括","c":"计划","sc":2,"o":{"A":"目标要有重点","B":"目标应具体，具有可测量性","C":"制定目标时应考虑组织的发展，而不应考虑个人的发展","D":"相互关联的部门之间应制定共同目标","E":"制定目标要考虑各方面关系的协调性"},"a":"ABDE","e":"目标应明确、重点突出、具体可测量，相互关联部门应制定共同目标，并兼顾组织与个人发展及各方关系协调；C错误，制定目标应同时考虑组织和个人的发展。"},{"i":"2019_4_term_26","t":"term","s":"时间管理","c":"计划","sc":3,"at":"参考答案（要点）：指在同样的时间消耗情况下，为提高时间的利用率和有效率而进行的一系列管理活动（包括对时间进行计划和分配），以保证重要工作顺利完成，并留出足够余地处理突发事件或紧急变化。","e":""},{"i":"2019_4_term_27","t":"term","s":"组织变革","c":"组织","sc":3,"at":"参考答案（要点）：指组织为达成组织目标，根据外部环境变化和内部情况变动，不断对组织成员、技术、制度、理念和行为方式进行有意识的调整、创新和发展，以适应内外环境、技术特征和组织任务等方面的变化及未来组织发展的需要。","e":""},{"i":"2019_4_term_29","t":"term","s":"变异","c":"护理质量管理","sc":3,"at":"参考答案（要点）：指某事物的性质、状态或情绪发生了变更或变化，因而表现出与以前有所不同或有差别；在临床路径中指个别患者偏离标准临床路径预定设置、接受医疗护理过程中出现偏差的现象，分正性变异（缩短住院时间）和负性变异（延缓住院、造成资源浪费）。","e":""},{"i":"2019_4_term_30","t":"term","s":"护理质量缺陷","c":"护理质量管理","sc":3,"at":"参考答案（要点）：指由于各种原因导致的一切不符合护理质量标准的现象和结果；这种现象和结果使患者产生不满意或给患者造成损害，分为患者不满意、医疗纠纷和医疗事故三种。","e":""},{"i":"2019_4_short_31","t":"short","s":"简述行政组织理论的主要内容。","c":"管理理论","sc":5,"at":"参考答案（要点）：韦伯行政组织理论的主要内容：①每个组织均应确定明确的职位等级结构，每个职位明确规定其权力和职责；②只有最高领导者可获得掌权位置，其余各层次管理者均应采取委任制或合同制；③各层次管理者应具有一定文凭，且必须经过考核方能任用；④被委任的管理者必须将职位当作其唯一职业并努力完成任务；⑤组织机构中应将生产资料的所有权与对其的管理权彻底分开。","e":""},{"i":"2019_4_short_32","t":"short","s":"简述制定计划的步骤。","c":"计划","sc":5,"at":"参考答案（要点）：①分析资料、调查环境（评估环境与机会）；②确定目标；③考虑计划的前提条件（估量机会、确定前提）；④确定备选方案；⑤评价备选方案；⑥选定最佳方案；⑦制定派生（分）计划；⑧编制预算使计划数字化。","e":""},{"i":"2019_4_short_33","t":"short","s":"简述组织设计中管理宽度与管理层次的关系。","c":"组织","sc":5,"at":"参考答案（要点）：管理宽度（管理幅度）指一名领导者直接领导的下级人员人数；管理层次指组织纵向垂直层级数，即从最高一级到最低一级的层次数。两者密切相关：当组织规模一定时，管理幅度与管理层次呈反比关系——管理幅度越宽，管理层次越少；反之，管理幅度越窄，管理层次越多。管理者应根据组织工作量和规模合理处理二者关系，力求减少管理层次、配备精干人员。","e":""},{"i":"2019_4_short_34","t":"short","s":"简述控制的内容。","c":"控制","sc":5,"at":"参考答案（要点）：控制对象（内容）归纳为五方面：①对人员的控制（巡视与绩效评估，护理对象包括各级管理者、各层次护理人员及实习进修护士）；②对财务的控制（护理预算与护理成本控制）；③对作业的控制（护理技术、护理质量、材料药品购买与库存控制等）；④对信息的控制（建立护理管理信息系统，及时提供可靠信息）；⑤对组织总体绩效（组织效率）的控制。","e":""},{"i":"2019_4_short_35","t":"short","s":"简述护理人员的培训原则。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①按需施教、学用一致原则：结合知识、能力、年龄结构和岗位实际需要设置内容，培训结果转化为实际工作效果；②个人发展与医院战略目标相适应原则：从组织战略出发，兼顾护士个人需求；③全员培训和重点培养相结合原则：全员“三基”培训与业务骨干、护理管理人员重点培养相结合；④整体素养与专业素质培训相结合原则；⑤当前需要与长远发展相结合原则。","e":""},{"i":"2019_4_short_36","t":"short","s":"简述护理教学查房的基本要求。","c":"护理临床教学管理","sc":5,"at":"参考答案（要点）：①查房前要充分做好准备，教师先熟悉病情并指导学生复习相关知识、查阅资料；②按教学大纲要求选择病例，由浅入深、循序渐进，突出重点；③以学生为主体、教师为主导，采用启发式、讨论式教学；④教师应具备扎实理论、丰富临床经验和教学管理能力，仪表端庄、态度认真；⑤查房中理论联系实际，培养学生观察、分析、解决问题及语言表达能力。","e":""},{"i":"2019_4_short_37","t":"short","s":"简述对社区护理人员传染病预防管理质量的考核内容。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①护士对传染病报告卡的登记情况；②执行免疫接种工作的护士对免疫接种卡的管理情况及是否按要求免疫接种；③护士对常见传染病预防和控制知识的掌握情况；④护士对传染病患者的健康教育情况；⑤护士对清洁区、半污染区和污染区的管理情况。","e":""},{"i":"2019_4_essay_38","t":"essay","s":"试述动力原则在护理管理中的应用。","c":"现代管理的基本原则","sc":10,"at":"参考答案（要点）：动力原则指管理必须正确运用物质动力、精神动力和信息动力，激发人的积极性。在护理管理中应：①综合协调地运用三种动力。不同对象三种动力比重不同，不能单一运用物质或精神动力；应坚持以物质动力为基础，特别重视发挥精神动力和信息动力的作用，对日常护理工作中的好人好事及时表扬奖励，发挥整体效能。②正确处理科室动力与个人动力。科室与个人不可分割、相互影响，应以科室动力为基础，充分发挥护理人员个人动力的作用，以获得最佳管理效果。③正确掌握刺激量。任何一种动力刺激量过小起不到激励作用，过大则产生抑制或干扰；应根据本地区社会环境、经济基础、文化发展水平及部门和个人具体情况，掌握各种动力的高效量，发挥最大激励作用。","e":""},{"i":"2019_4_essay_39","t":"essay","s":"试述沟通的技巧。","c":"领导","sc":10,"at":"参考答案（要点）：管理沟通本质上是人的交际活动，领导者应掌握以下沟通技巧：①注意语言和非语言技巧：语言要明晰、简明扼要，避免易引起误解的表达；同时注意肢体语言、面部表情和空间感，如拍肩传达鼓励、握手传达信任。②恰当的自我表露：领导对下属适当表露生活细节可减低其紧张感、融洽气氛，有意识透露某些层面信息可增加下属信任感。③合理的立场：与下属沟通时必须尊重下属，但要坚持领导的原则立场和要求，不能无原则妥协。④积极的倾听和同感理解：在尤其带感情色彩的交流中要善于倾听，有时听比滔滔不绝更有效；要善于发现对方表达的思想和情绪并给予真情理解，以增进信任。","e":""}]},{"key":"2019_10","name":"2019年10月","qs":[{"i":"2019_10_single_1","t":"single","s":"对于各层次管理者都非常重要的技能是","c":"领导","sc":1,"o":{"A":"专业技能","B":"人际技能","C":"概念技能","D":"创造技能"},"a":"B","e":"人际技能（处理人际关系的能力）对各层次管理者都非常重要；专业技能对基层更重要，概念技能对高层更重要。"},{"i":"2019_10_single_2","t":"single","s":"决策过程的首要步骤是","c":"领导","sc":1,"o":{"A":"诊断问题","B":"识别问题","C":"确定决策目标","D":"制定备选方案"},"a":"B","e":"决策过程的开始（首要）步骤是识别问题/机遇，即找出决策究竟为解决问题还是抓住机遇。"},{"i":"2019_10_single_3","t":"single","s":"美国行为科学家赫茨伯格提出的理论是","c":"领导","sc":1,"o":{"A":"双因素理论","B":"管理方格理论","C":"需要层次理论","D":"情境领导理论"},"a":"A","e":"赫茨伯格提出双因素（激励—保健）理论；管理方格理论由布莱克和穆顿提出，需要层次理论由马斯洛提出。"},{"i":"2019_10_single_4","t":"single","s":"控制过程的首要环节是","c":"控制","sc":1,"o":{"A":"确立标准","B":"收集信息","C":"衡量成效","D":"找出偏差"},"a":"A","e":"控制过程三步骤为确立标准、衡量绩效、评价并纠正偏差，确立标准是首要（第一步）环节。"},{"i":"2019_10_single_5","t":"single","s":"属于现场控制的重点工作是","c":"控制","sc":1,"o":{"A":"检查医疗护理材料的质量","B":"患者满意度调查","C":"护理人员绩效考核","D":"护士自我控制"},"a":"D","e":"现场控制重点在于不间断的过程，如护士自我控制、护理部到临床科室督查；A检查材料质量属前馈控制，B、C属反馈控制。"},{"i":"2019_10_single_6","t":"single","s":"根据业务范围分类，可将控制分为","c":"控制","sc":1,"o":{"A":"现场控制、前馈控制和反馈控制","B":"局部控制和全面控制","C":"生产控制、质量控制、成本控制和资金控制","D":"内部控制和外部控制"},"a":"C","e":"按业务范围（业务内容）可分为生产控制、质量控制、成本控制和资金控制；A按控制点位置、B按全面性、D按来源划分。"},{"i":"2019_10_single_7","t":"single","s":"护理人员职业生涯规划中，属于内外环境分析的内容是","c":"护理人力资源管理","sc":1,"o":{"A":"个人职业发展定位","B":"护理人员升迁政策","C":"职业发展途径选择","D":"个人职业发展优势"},"a":"B","e":"内外环境分析包括组织环境评估、组织发展战略、人力资源需求、成员结构、护理人员升迁政策等；个人发展定位与优势属自我评估，途径选择属另一环节。"},{"i":"2019_10_single_8","t":"single","s":"要求护理人员数量、质量及整体结构满足患者的护理需要，体现护理人员编配的","c":"护理人力资源管理","sc":1,"o":{"A":"成本效率原则","B":"能级对应原则","C":"结构合理原则","D":"功能需要原则"},"a":"D","e":"功能需要原则要求编配以满足护理功能（患者护理需要）为中心，人员数量、质量及整体结构满足护理工作需要。"},{"i":"2019_10_single_9","t":"single","s":"下列关于绩效评价方法的描述，正确的是","c":"护理人力资源管理","sc":1,"o":{"A":"强迫选择比例法需要记录护士工作中的有效行为和错误行为","B":"目标管理法的优点是护理人员可直接参与目标值的制定","C":"绩效评价表法侧重描述护理人员工作中的突出行为","D":"关键事件法是对护理人员绩效进行评定并划分等级"},"a":"B","e":"目标管理法由管理者与护理人员共同制定业绩目标，护理人员可直接参与目标值制定(B对)。A错，记录有效与错误行为是关键事件法；C错，侧重突出行为的是描述法；D错，按比例评定划分等级是强迫选择比例法。"},{"i":"2019_10_single_10","t":"single","s":"护理部定期组织护理安全查房，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险前控制","B":"风险中控制","C":"风险后控制","D":"风险监察"},"a":"D","e":"风险监察包括临床监督与考核、不安全事件及安全隐患报告、召开安全会议、组织并实施安全查房等，护理部定期组织安全查房属风险监察。"},{"i":"2019_10_single_11","t":"single","s":"根据计划要求，对比分析实际效果与预期目标，寻找计划执行中的问题并进行改进，属于PDCA循环的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"C","e":"教材原文：检查阶段（C）即根据计划要求对实际情况进行检查，对比分析实际效果与预期目标，寻找计划执行中的问题并进行改进。"},{"i":"2019_10_single_14","t":"single","s":"属于护理人员培训准备阶段的工作是","c":"护理人力资源管理","sc":1,"o":{"A":"确立培训目标","B":"选择培训教师","C":"选择培训方式","D":"确定评价标准"},"a":"A","e":"培训准备阶段包括分析培训需求、确立培训目标；选择培训教师和培训方式属实施阶段，确定评价标准属评价阶段。"},{"i":"2019_10_single_15","t":"single","s":"人际关系理论认为提高劳动生产效率的最重要因素是","c":"管理理论","sc":1,"o":{"A":"生产中工人的劳动报酬","B":"管理过程和管理组织","C":"理想的工作条件","D":"生产中工人的劳动士气"},"a":"D","e":"霍桑实验后梅奥人际关系理论认为，生产效率主要取决于工人的工作情绪即“士气”，以及人与人的关系。"},{"i":"2019_10_single_16","t":"single","s":"对不同职位的人员赋予不同的权力和责任，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"动力原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"D","e":"能级原则指按人的能力大小分级，不同能级（职位）授予相应权力和责任，使人与岗位能级对应。"},{"i":"2019_10_single_19","t":"single","s":"下列关于民主型领导者的描述，正确的是","c":"领导","sc":1,"o":{"A":"领导者大权在握","B":"能够发挥下属的积极作用","C":"下级充分享有自由","D":"不允许下级参与决策"},"a":"B","e":"民主型领导者鼓励下属参与决策、能发挥下属的积极作用；大权在握、不允许下级参与决策属专制型，下级充分享有自由属放任型。"},{"i":"2019_10_single_20","t":"single","s":"官僚制组织的特点是","c":"组织","sc":1,"o":{"A":"权力分层，职务分等","B":"横向的组织结构","C":"善于不断学习","D":"高度的流动性和灵活性"},"a":"A","e":"官僚制组织强调明确的职位等级结构、权力分层、职务分等；横向结构、善于不断学习属学习型组织特点。"},{"i":"2019_10_multi_21","t":"multi","s":"泰罗科学管理理论的主要内容包括","c":"管理理论","sc":2,"o":{"A":"劳动方法标准化","B":"建立参谋机构","C":"培训工人科学化","D":"差别计件工资制","E":"管理职能专业化"},"a":"ACDE","e":"泰罗科学管理包括劳动方法标准化、科学培训工人、差别计件工资制、计划与执行分离（管理职能专业化）；建立参谋机构属法约尔一般管理理论。"},{"i":"2019_10_multi_22","t":"multi","s":"组织机构按职能分级可划分为","c":"现代管理的基本原则","sc":2,"o":{"A":"决策层","B":"领导层","C":"管理层","D":"基层","E":"操作、执行层"},"a":"ACE","e":"现代管理学把组织机构按职能分级划分为三层：决策层（最高层）、管理层（中间职能层）、操作（执行）层（基层）。"},{"i":"2019_10_multi_23","t":"multi","s":"下列关于领导的描述，正确的包括","c":"领导","sc":2,"o":{"A":"领导的本质是一种影响力","B":"领导是某一个体","C":"领导是一个管理的过程","D":"领导的目的是实现组织目标","E":"领导独立于管理之外"},"a":"ACD","e":"领导的本质是一种影响力、是对人们实施影响的科学与艺术并存的管理过程，其目的是引导人们实现组织目标；B错误（领导是过程/影响力而非某一个体），E错误（领导是管理职能之一，并非独立于管理之外）。"},{"i":"2019_10_multi_24","t":"multi","s":"护理质量管理的基本任务包括","c":"护理质量管理","sc":2,"o":{"A":"建立质量管理体系","B":"进行质量教育","C":"制定护理质量标准","D":"创建组织文化","E":"持续改进护理质量"},"a":"ABCE","e":"护理质量管理基本任务：建立质量管理体系、进行质量教育、制定护理质量标准、进行全面质量控制、持续改进护理质量；创建组织文化不属质量管理基本任务。"},{"i":"2019_10_multi_25","t":"multi","s":"诱发护理风险的因素包括","c":"护理质量管理","sc":2,"o":{"A":"患者对疾病的认识及承受力","B":"护理人员服务态度","C":"护理人员技术水平","D":"患者的经济情况","E":"护理人员配置情况"},"a":"ABCDE","e":"诱发护理风险因素包括患者因素（对疾病认识及承受力）、护理人员素质因素（服务态度）、技术因素（技术水平）、物质因素、环境因素（含社会环境及患者经济状况）、管理因素（护理人员配置），五项均属之。"},{"i":"2019_10_term_26","t":"term","s":"弹性原则","c":"现代管理的基本原则","sc":3,"at":"参考答案（要点）：管理的弹性原则指管理应具有伸缩性，要求决策和处理问题时留有余地，组织结构设计上应富有弹性，以适应内外部环境变化和突发情况；临床护理中因各病区工作量差异大、忙闲不均及突发事件，常需采用弹性原则排班。","e":""},{"i":"2019_10_term_27","t":"term","s":"控制","c":"控制","sc":3,"at":"参考答案（要点）：指管理者在动态变化的环境中，为确保实现既定目标而进行的检查、监督、纠偏等管理活动；是通过不断接受和交换内外部信息来规范组织行为，使其与组织计划、目标和预期绩效标准一致的系统行动过程。包括三层含义：是一个系统过程、通过监督和纠偏实现、目的是保证组织实现目标。","e":""},{"i":"2019_10_term_29","t":"term","s":"护理风险","c":"护理质量管理","sc":3,"at":"参考答案（要点）：是一种职业风险，指从事护理服务的职业具有一定发生频率并由该职业者承受的危险，包括经济风险、政治风险、法律风险和人身风险；其主体是护理工作的从业者（护理人员）。","e":""},{"i":"2019_10_short_31","t":"short","s":"简述临床路径的特点。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：临床路径是用工作流程图表示的设计好的计划；其特点包括：强调时效性、强调有效性、关注实践性、强调完整性和合作性、强调合理费用（对服务成本花费有严格限定和控制）。","e":""},{"i":"2019_10_short_32","t":"short","s":"简述非正式组织的特点。","c":"组织","sc":5,"at":"参考答案（要点）：①顺乎自然（人们自愿结合、无人强迫或刻意安排）；②较强的内生凝聚力（共同情感是维系纽带）；③社会距离感消失（成员间社会距离缩短）；④形式灵活，稳定性弱；⑤覆盖面广，信息沟通顺畅（成员交往频繁、信息传播迅速）；⑥领袖人物作用大（领袖自然涌现、具有很强号召力）。","e":""},{"i":"2019_10_short_33","t":"short","s":"简述决策实施中的主要工作。","c":"领导","sc":5,"at":"参考答案（要点）：决策方案选定后即进入实施和监控，主要工作：①制定实施的具体计划和措施；②确定实施所需的各种资源及其配置；③分配实施中所包含的具体任务；④建立实施工作报告制度并及时报告；⑤做好跟踪决策和实施调整。同时须对实施情况进行监控，出现偏差即采取纠偏行动，环境条件变化则作出跟踪决策以修正目标和行动方案。","e":""},{"i":"2019_10_short_34","t":"short","s":"简述职业生涯规划的基本原则。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①个人特长和组织需要相结合原则：把个人优势发挥到组织和社会需要的岗位上；②长期目标和短期目标相结合原则：长期目标是方向，短期目标是实现长期目标的保证；③稳定性与动态性相结合原则：职业发展需一定稳定性，内外环境变化时应动态调整；④动机与方法相结合原则：有了明确目标和动机，还须结合环境和自身条件选择科学合理的发展途径。","e":""},{"i":"2019_10_short_35","t":"short","s":"简述PDCA循环的基本要求。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：①PDCA循环周期制度化：明确规定循环周期（一般以月为宜），并按周期运行，不可随意搁置停顿；②实行PDCA循环管理责任制：责任到人，明确主持人及所有参与人员的职责；③制定循环管理的有关标准，定期进行循环管理成绩考核；④实现PDCA循环运作的程序化。","e":""},{"i":"2019_10_short_37","t":"short","s":"简述计划在护理管理中的意义。","c":"计划","sc":5,"at":"参考答案（要点）：①为护理组织活动提供方向和目的，有利于组织目标的实现；②促进护理活动的协调，有利于合理使用资源；③有利于控制工作（计划为控制提供目标、措施、步骤和检查标准）；④有利于提高护理工作质量（使各部门工作协调统一、井然有序）；⑤能弥补情况变化所造成的损失（预测未来变化、建立应急预案，将突发情况损失减至最少）。","e":""},{"i":"2019_10_essay_38","t":"essay","s":"试述目标管理在护理管理中的应用。","c":"计划","sc":10,"at":"参考答案（要点）：护理管理以人为中心，以提高护理质量和工作效率为主要目的，引入目标管理有利于提高护理管理效能。具体活动：①护理部根据内、外部环境因素确定护理工作的总目标；②建立实现总目标的目标分解体系，包括各部门、各护理单元以及护理人员的目标、工作标准、职责分工、工作期限等，将总目标层层分解落实到人；③在实施过程中进行检查指导、给予必要的资源支持，并定期按目标进行业绩考评。护理中可设定可测量的具体目标，如基础护理合格率100%、护理计划合格率100%、护理记录合格率≥95%、急救物品完好率100%、年褥疮发生次数为0等，并配套现场抽查、病历检查等效果评价方法。通过目标管理使各级护理人员参与目标制定、明确职责、自我控制，从而提升护理质量与效率。","e":""}]},{"key":"2020_10","name":"2020年10月","qs":[{"i":"2020_10_single_1","t":"single","s":"对于基层管理者最重要的技能是","c":"领导","sc":1,"o":{"A":"专业技能","B":"人际技能","C":"概念技能","D":"创造技能"},"a":"A","e":"基层管理者直接从事一线业务，专业（技术）技能最重要；概念技能对高层更重要，人际技能对各层次都重要。"},{"i":"2020_10_single_2","t":"single","s":"以最少的成本投入获得最大的收益产出，体现了计划的","c":"计划","sc":1,"o":{"A":"目的性","B":"适应性","C":"普遍性","D":"经济性"},"a":"D","e":"计划的经济性指以最少的成本投入获得最大的收益产出，讲求资源的合理利用和效益。"},{"i":"2020_10_single_3","t":"single","s":"权变领导理论认为，适宜采取授权式领导方式的员工类型是","c":"领导","sc":1,"o":{"A":"成熟度低","B":"较为不成熟","C":"比较成熟","D":"高度成熟"},"a":"D","e":"授权式适用于下属高度成熟（既有能力又有热情）的情况，赋予其权力让其自行决策、自我负责。"},{"i":"2020_10_single_4","t":"single","s":"护理管理者对护理工作效果和效率承担责任，所扮演的角色是","c":"领导","sc":1,"o":{"A":"代表人角色","B":"发言人角色","C":"领导者角色","D":"监督者角色"},"a":"C","e":"领导者角色负责对下属进行领导、人员配备、培训与激励，对本单位工作的效果和效率承担责任；代表人是象征性首脑，发言人负责对外传递信息。"},{"i":"2020_10_single_5","t":"single","s":"依据控制采用的手段不同，可以把控制分为","c":"控制","sc":1,"o":{"A":"预防性控制和更正性控制","B":"直接控制和间接控制","C":"正式组织控制、群体控制和自我控制","D":"反馈控制和前馈控制"},"a":"B","e":"教材明确按控制采用的手段不同，可分为直接控制和间接控制；C按控制方式、D按控制点位置划分。"},{"i":"2020_10_single_6","t":"single","s":"某三甲医院只招聘有护士执业证书且身体健康的本科毕业生作为员工，体现的控制类型是","c":"控制","sc":1,"o":{"A":"前馈控制","B":"现场控制","C":"反馈控制","D":"事后控制"},"a":"A","e":"招聘时设定资格门槛、在系统输入阶段进行预防性筛选，属前馈控制（事前控制）。"},{"i":"2020_10_single_7","t":"single","s":"下列关于三级医院护理人员编制标准的描述，正确的是","c":"护理人力资源管理","sc":1,"o":{"A":"护理人员与医技人员之比为5:1","B":"病床与病房护理人员之比为1:0.4","C":"医师与护理人员之比为1:1","D":"护师级以上业务职称人员比例大于10%"},"a":"B","e":"三级医院标准：病床与病房护理人员之比为1:0.4(B对)；医师与护理人员之比为1:2，护师级以上业务职称人员比例≥30%，故C、D错；护理人员与医技人员之比并非5:1，故A错。"},{"i":"2020_10_single_9","t":"single","s":"护理人员在职业生涯早期阶段存在的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"没有足够的精力进行自我反省","B":"面临极大的竞争压力","C":"稳定性较低，容易迷失自我","D":"安于现状"},"a":"C","e":"早期阶段工作绩效不明显、稳定性较低、容易迷失自我；A、B属中期阶段问题，D属后期阶段特点。"},{"i":"2020_10_single_10","t":"single","s":"分析质量现状，找出影响因素，制定工作计划和改进措施，属于PDCA的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"A","e":"分析现状找问题、分析影响因素、找出主要因素、制订工作计划和改进措施，均属PDCA计划阶段（P）的步骤。"},{"i":"2020_10_single_12","t":"single","s":"协调组织长期发展与短期利益之间的关系，体现管理中的","c":"管理理念","sc":1,"o":{"A":"对立统一观","B":"发展观","C":"人本主义观","D":"伦理观"},"a":"A","e":"教材以组织长期发展与短期利益等不同发展过程中的矛盾为例，说明管理中应坚持对立统一观，协调矛盾双方。"},{"i":"2020_10_single_14","t":"single","s":"科学管理理论的创始人是","c":"管理理论","sc":1,"o":{"A":"法约尔","B":"泰罗","C":"麦格雷戈","D":"韦伯"},"a":"B","e":"泰罗是科学管理之父；法约尔创立一般管理理论，韦伯创立行政组织理论，麦格雷戈提出X-Y理论。"},{"i":"2020_10_single_15","t":"single","s":"在护理人员排班方法中，周排班的特点是","c":"护理人力资源管理","sc":1,"o":{"A":"排班模式相对固定","B":"适用于护理人员相对稳定的科室","C":"较好地满足了护理人员的个人需求","D":"护理人员班次轮转较频繁"},"a":"D","e":"周排班以每周为周期，班次轮转较频繁、费时费力；A、B为周期性排班特点，C为自我排班特点。"},{"i":"2020_10_single_16","t":"single","s":"强调管理在处理问题时应留有余地，体现管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"整分合原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"B","e":"弹性原则指管理应具有伸缩性，决策和处理问题时留有余地，以适应环境变化和突发情况。"},{"i":"2020_10_single_17","t":"single","s":"依据时间“四象限”法进行分类，患者投诉属于","c":"计划","sc":1,"o":{"A":"紧急且重要的事务","B":"紧急但不重要的事务","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"A","e":"患者投诉需立即处理、关系医疗安全与服务质量，属紧急且重要的事务。"},{"i":"2020_10_single_18","t":"single","s":"属于组织文化精神层的是","c":"组织","sc":1,"o":{"A":"组织的工作环境","B":"组织的行为准则","C":"组织的风俗习惯","D":"组织的价值标准"},"a":"D","e":"精神层包括组织的价值标准、经营哲学、最高目标、宗旨等；行为准则、风俗习惯属制度层，工作环境属物质层。"},{"i":"2020_10_single_20","t":"single","s":"属于直线制组织结构的特点是","c":"组织","sc":1,"o":{"A":"过分强调下级服从上级","B":"有多个指令源","C":"职权难以区分","D":"适用于组织面临突发事件时"},"a":"A","e":"直线制权力集中、命令统一，但容易过分强调下级服从上级、管理者事必躬亲；多个指令源属职能制特点。"},{"i":"2020_10_multi_21","t":"multi","s":"人际关系理论的主要内容包括","c":"管理理论","sc":2,"o":{"A":"跳板原理","B":"企业内部存在非正式组织","C":"人是社会人，受社会、心理因素的影响","D":"有效领导应提高员工的社会满足感","E":"理想的行政组织是最合理的管理手段"},"a":"BCD","e":"梅奥人际关系理论：工人是“社会人”、企业中存在非正式组织、新型领导在于提高员工的社会满足感（士气）；跳板原理属法约尔一般管理理论，理想行政组织属韦伯理论。"},{"i":"2020_10_multi_22","t":"multi","s":"现代管理理念包括","c":"管理理念","sc":2,"o":{"A":"“集权”观","B":"“普遍联系”观","C":"“发展”观","D":"“度和量变、质变”观","E":"“实践检验真理”观"},"a":"BCDE","e":"现代管理理念包括对立统一观、普遍联系观、发展观、度和量变质变观、实践检验真理观及人本主义观；“集权”观不在其列。"},{"i":"2020_10_multi_23","t":"multi","s":"关于领导定义的描述，正确的包括","c":"领导","sc":2,"o":{"A":"领导的本质是一种影响力","B":"领导是一个管理过程","C":"领导的作用是合理安排护理人员","D":"领导的功能是限制偏差累积","E":"领导的根本目的是领导人们实现目标"},"a":"ABE","e":"领导的本质是一种影响力，是对人们实施影响的科学与艺术并存的管理过程，根本目的是引导人们实现组织目标；C、D描述的是计划/控制等其他管理职能而非领导定义。"},{"i":"2020_10_multi_24","t":"multi","s":"评价护理人员培训效果的方法包括","c":"护理人力资源管理","sc":2,"o":{"A":"书面调查表","B":"讨论","C":"学习后测验","D":"观察工作情况","E":"比较培训前后的工作表现"},"a":"ABCDE","e":"培训效果评价方法包括：书面调查表、讨论（让护士谈收获建议）、学习后测验、观察受训护士工作及运用新知识技能情况、比较培训前后工作表现等，五项均属之。"},{"i":"2020_10_multi_25","t":"multi","s":"下列关于护理风险的描述，正确的包括","c":"护理质量管理","sc":2,"o":{"A":"是一种职业风险","B":"护理风险的主体是护理服务对象","C":"护理人员因为从事了护理职业，即相应地承担了这份风险","D":"诱发护理风险的因素既有人为因素又有管理因素","E":"任何护理人员在工作中都可能遇到护理风险"},"a":"ACDE","e":"护理风险是一种职业风险，主体是护理人员（非护理服务对象，故B错）；护理人员从事护理职业即承担相应风险，诱发因素既有人为因素也有管理等因素，任何护理人员在工作中都可能遇到。"},{"i":"2020_10_term_26","t":"term","s":"动力原则","c":"现代管理的基本原则","sc":3,"at":"参考答案（要点）：指管理必须正确运用动力（推动力、拉动力、内驱力），以促使各种管理要素发挥作用、产生强大合力，使管理活动持续有效地进行；管理动力包括物质动力、精神动力和信息动力。","e":""},{"i":"2020_10_term_27","t":"term","s":"组织（名词）","c":"组织","sc":3,"at":"参考答案（要点）：指人们为了实现共同目标，按一定形式和任务进行分工合作而构成的人的集合（协作系统）；是两个或两个以上的人为实现共同目标、在分工合作基础上组成的、有明确权责关系和结构的系统。","e":""},{"i":"2020_10_term_28","t":"term","s":"PDCA循环","c":"护理质量管理","sc":3,"at":"参考答案（要点）：又称戴明循环法，是美国质量管理专家戴明于1954年根据信息反馈原理提出的；PDCA是英文Plan（计划）、Do（执行/实施）、Check（检查）、Action（处理）四个词的缩写，即按照计划、实施、检查、处理四个阶段进行质量管理的循环方法，具有大环套小环、互相促进、螺旋式上升的特点。","e":""},{"i":"2020_10_short_31","t":"short","s":"简述科学分解的主要要求。","c":"现代管理的基本原则","sc":5,"at":"参考答案（要点）：科学的系统分解主要要求：①分解要适度（分工有合理界限，过粗过细都降低效益）；②分解要完全（各部分功能能有机整合为系统整体功能，不出现空白或断口）；③分解不能出现多余部分和环节（避免内部浪费）；④分解后各部分的比例要合理（不出现某些部分过重或不足）；⑤分解要配套（分出部门、委以职责，相应权力和条件配套分解下去）。","e":""},{"i":"2020_10_short_32","t":"short","s":"简述影响组织变革的内部环境因素。","c":"组织","sc":5,"at":"参考答案（要点）：①组织战略目标的调整；②组织技术条件的变化；③组织人员条件的变化（知识员工看重自主、内在需要向高层次发展，要求改进工作设计与内容）；④组织本身成长的要求（活动内容日趋复杂、人数增多、规模扩大，结构须随之调整）。","e":""},{"i":"2020_10_short_33","t":"short","s":"简述建设性冲突的特点。","c":"领导","sc":5,"at":"参考答案（要点）：建设性冲突的特点为：①双方对实现组织的目标更为关切；②双方乐于了解对方的观点、意见；③双方以争论问题为主，有妥协思想；④互相交换信息和直接沟通在不断增加。（与之相对，破坏性冲突则对赢得冲突势在必得、不愿听对方意见、由争论转为人身攻击、信息沟通减少。）","e":""},{"i":"2020_10_short_34","t":"short","s":"简述护理人员培训的原则。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①按需施教、学用一致原则；②个人发展与医院战略目标相适应原则；③全员培训和重点培养相结合原则；④整体素养与专业素质培训相结合原则；⑤当前需要与长远发展相结合原则。","e":""},{"i":"2020_10_short_35","t":"short","s":"简述医疗过失行为责任程度的分类。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：医疗过失行为责任程度分为：①完全责任：医疗事故损害后果完全由医疗过失行为
