"A":"缩宫素","B":"甲氨蝶呤","C":"硫酸镁","D":"米非司酮"},"a":"B","e":"药物治疗异位妊娠首选甲氨蝶呤(MTX)，抑制滋养细胞、破坏绒毛。"},{"i":"2021_10_single_24","t":"single","s":"分娩时正常子宫收缩的起始部位是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"子宫底","B":"子宫体","C":"子宫角","D":"子宫颈"},"a":"C","e":"正常子宫收缩起自两侧子宫角(起搏点)，先向宫底集中再向下扩散。"},{"i":"2021_10_single_25","t":"single","s":"支气管哮喘患者合并急性闭角型青光眼时禁止使用的降眼压药物是","c":"眼科急症患者的护理","sc":1,"o":{"A":"缩瞳剂","B":"β-肾上腺素受体阻滞剂","C":"碳酸酐酶抑制剂","D":"高渗剂"},"a":"B","e":"β-肾上腺素受体阻滞剂(如噻吗洛尔)可诱发支气管痉挛，哮喘患者禁用。"},{"i":"2021_10_single_26","t":"single","s":"喉阻塞的主要症状是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"吸气性呼吸困难","B":"呼气性呼吸困难","C":"混合性呼吸困难","D":"中枢性呼吸困难"},"a":"A","e":"喉阻塞的主要症状是吸气性呼吸困难，伴吸气性喉喘鸣及四凹征。"},{"i":"2021_10_single_27","t":"single","s":"中暑各分型中，最严重的类型是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"先兆中暑","B":"热痉挛","C":"热衰竭","D":"热射病"},"a":"D","e":"热射病是最严重的中暑类型，高热、无汗、意识障碍，病死率高。"},{"i":"2021_10_single_28","t":"single","s":"吩噻嗪类药物急性中毒时最常见的临床表现是","c":"急性中毒患者的护理","sc":1,"o":{"A":"肝肾损害","B":"直立性低血压","C":"震颤麻痹","D":"体温调节紊乱"},"a":"C","e":"吩噻嗪类(氯丙嗪)急性中毒最常见锥体外系反应，包括震颤麻痹综合征、静坐不能、急性肌张力障碍。"},{"i":"2021_10_single_29","t":"single","s":"CO中毒时发生损伤最明显的系统是","c":"急性中毒患者的护理","sc":1,"o":{"A":"中枢神经系统","B":"呼吸系统","C":"循环系统","D":"消化系统"},"a":"A","e":"中枢神经系统对缺氧最敏感，CO中毒以脑(中枢神经系统)损害最明显。"},{"i":"2021_10_single_30","t":"single","s":"可解除酒精中毒患者中枢抑制的药物是","c":"急性中毒患者的护理","sc":1,"o":{"A":"胺碘酮","B":"纳洛酮","C":"黄体酮","D":"丙酸睾丸酮"},"a":"B","e":"纳洛酮为阿片受体拮抗剂，可促醒、解除酒精中毒所致中枢抑制。"},{"i":"2021_10_multi_31","t":"multi","s":"下列有关室性期前收缩心电图特点的描述，正确的是","c":"心血管系统急症患者的护理","sc":2,"o":{"A":"QRS波群前没有相关的P波","B":"QRS波群提前出现","C":"QRS波群时限＜0.08秒","D":"T波常与主波方向相反","E":"代偿间歇完全"},"a":"ABDE","e":"室早为提前出现的宽大畸形QRS(时限>0.12s)、前无相关P波、T波与主波相反、代偿间歇完全；C错误。"},{"i":"2021_10_multi_32","t":"multi","s":"按照病因分类，肠梗阻分为","c":"消化系统急症患者的护理","sc":2,"o":{"A":"单纯性","B":"机械性","C":"动力性","D":"绞窄性","E":"血运性"},"a":"BCE","e":"按病因分为机械性、动力性、血运性肠梗阻；单纯性、绞窄性是按肠壁血循环分类。"},{"i":"2021_10_multi_33","t":"multi","s":"下列关于精索扭转的说法，正确的是","c":"泌尿系统急症患者的护理","sc":2,"o":{"A":"多发生在青少年","B":"剧烈运动可诱发","C":"分为鞘膜内型、鞘膜中型和鞘膜外型","D":"延误诊治可导致睾丸坏死","E":"手法复位后即不再复发"},"a":"ABD","e":"精索扭转多见于青少年，剧烈运动可诱发，延误诊治致睾丸坏死；分鞘膜内、外两型(无鞘膜中型)，手法复位后仍可能复发需择期手术。"},{"i":"2021_10_multi_34","t":"multi","s":"2型糖尿病患者发生酮症酸中毒的常见诱因包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"急性感染","B":"胰岛素治疗中断","C":"食物摄入不足","D":"手术","E":"妊娠"},"a":"ABDE","e":"DKA常见诱因有急性感染、胰岛素不适当减量或突然中断、饮食不当、手术创伤、妊娠分娩、精神刺激等；食物摄入不足更易致低血糖。"},{"i":"2021_10_multi_35","t":"multi","s":"下列属于毒蕈碱样症状的表现有","c":"急性中毒患者的护理","sc":2,"o":{"A":"瞳孔散大","B":"唾液分泌亢进","C":"大小便失禁","D":"肌束颤动","E":"腹痛"},"a":"BCE","e":"毒蕈碱样(M样)症状为腺体分泌亢进和平滑肌痉挛：流涎、多汗、腹痛腹泻、大小便失禁、瞳孔缩小；肌束颤动为烟碱样(N样)症状。"},{"i":"2021_10_short_36","t":"short","s":"简述SOAP急诊分诊法。","c":"急诊分诊","sc":5,"at":"参考答案（要点）：S(subjective，主观/主诉)：收集患者的主诉和现病史；O(objective，观察)：观察患者的现有症状；A(assess，评估)：评估患者的生命体征、阳性体征及化验检查指标；P(plan，计划)：计划安排患者的就诊位置及顺序。","e":""},{"i":"2021_10_short_37","t":"short","s":"简述根据临床症状评估急性上消化道出血患者出血量的方法。","c":"消化系统急症患者的护理","sc":5,"at":"参考答案（要点）：①大便隐血试验阳性提示出血量5～50ml；出现黑便提示50～100ml以上；呕血伴柏油样便提示500ml以上。②出血量少于400ml多无自觉症状；400ml以上可出现头晕、心慌、冷汗、乏力、口干；1200ml以上可有晕厥、四肢冰凉、尿少、烦躁等休克表现；2000ml以上可出现气短、无尿。③结合脉搏、血压及休克指数动态判断失血程度。","e":""},{"i":"2021_10_short_38","t":"short","s":"简述甲状腺危象的急救治疗原则。","c":"内分泌系统急症患者的护理","sc":5,"at":"参考答案（要点）：①抑制甲状腺激素合成(首选丙硫氧嘧啶)；②抑制甲状腺激素释放(复方碘溶液)；③降低周围组织对甲状腺激素的反应(β受体阻滞剂如普萘洛尔)；④应用糖皮质激素；⑤镇静、降温、给氧、补液等全身支持治疗；⑥积极控制诱因(感染等)，防治并发症。","e":""},{"i":"2021_10_short_39","t":"short","s":"简述急性闭角型青光眼患者健康指导的要点。","c":"眼科急症患者的护理","sc":5,"at":"参考答案（要点）：①避免情绪激动、过度疲劳；②避免久留暗室及长时间近距离用眼；③保持大便通畅，避免低头屏气；④遵医嘱按时用降眼压药，不可随意停用或改用缩瞳剂/β阻滞剂等；⑤一旦出现眼痛、虹视、视物模糊、同侧偏头痛等应立即就诊；⑥定期复查眼压和视野。","e":""},{"i":"2021_10_essay_40","t":"essay","s":"试述出血性脑卒中患者的急救护理要点。","c":"神经系统急症患者的护理","sc":10,"at":"参考答案（要点）：①体位与休息：急性期绝对卧床，取半卧位、床头抬高15°～30°，减少不必要搬动，翻身动作轻柔；②血压管理：根据血压谨慎降压(收缩压>180mmHg可用静脉降压药，目标约160/90mmHg)，每5～15min监测血压；③降低颅内压：遵医嘱快速静滴甘露醇等脱水药，监测肾功能、电解质和尿量；④保持呼吸道通畅、吸氧，观察意识、瞳孔、生命体征及神经功能变化；⑤保持大小便通畅，避免用力、屏气和情绪激动，烦躁者遵医嘱镇静镇痛；⑥高热量高维生素高纤维素饮食，做好术前准备及用药护理，防治再出血、脑疝等并发症。","e":""},{"i":"2021_10_case_41","t":"case","s":"患者，男性，23岁，既往体健，参加夏季马拉松比赛，当日天气炎热。患者比赛途中感头晕被紧急送至急诊。查体：T 38.6℃，P 120次/分，R 30次/分，BP 120/80mmHg，神清，烦躁，颜面潮红，大汗淋漓，呼吸浅速。\n请写出：\n（1）该患者头晕最可能的原因；\n（2）对该患者分诊评估的要点。","c":"物理与环境因素所致的急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能原因：热衰竭(中暑衰竭)。依据：高温环境剧烈运动史；T 38.6℃、大汗淋漓、颜面潮红、脉搏呼吸增快、烦躁，而血压尚正常、无意识障碍，符合热衰竭(大量出汗致有效循环血量不足/脱水)。(2)分诊评估要点：①测量并记录体温(必要时肛温)、脉搏、呼吸、血压、SpO2；②评估意识状态、皮肤色泽温度及出汗情况、有无脱水征；③评估暴露/运动史、既往病史及用药；④评估尿量、有无肌肉痉挛、恶心呕吐；⑤按病情分级分诊，警惕进展为热射病，迅速转移至阴凉通风处并补液、降温。","e":""},{"i":"2021_10_case_42","t":"case","s":"患者，女性，52岁，主因“发作性呼吸困难4年，加重1天”入院。患者4年前秋游后出现伴有哮鸣音的呼吸困难，经肺功能检查确诊为支气管哮喘，后规律吸入糖皮质激素，控制良好。今年至外地女儿家居住后，自行停药2周出现气促，稍动即喘，吸入支气管舒张剂缓解不明显。昨日凌晨呼吸困难加重，不能平卧，仅可单字交流，伴大汗、烦躁。查体：神清，急性病容，T 36.4℃，P 126次/分，R 32次/分，BP 160/90mmHg，口唇发绀，双肺满布哮鸣音，SpO₂ 86%。\n请写出：\n（1）该患者目前的诊断及诊断依据；\n（2）该患者还应重点评估的检查；\n（3）针对该患者的主要急救措施。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)诊断：支气管哮喘急性重度发作(危重哮喘/哮喘持续状态)。依据：①哮喘病史，自行停用吸入激素为诱因；②呼吸困难加重、不能平卧、仅单字交流、大汗烦躁；③R 32次/分、P 126次/分、口唇发绀、双肺满布哮鸣音、SpO₂ 86%。(2)重点检查：①动脉血气分析(判断缺氧及酸碱失衡)；②肺功能(PEF/FEV1)；③胸部X线；④血常规、电解质；⑤心电图。(3)急救措施：①立即吸氧，保持呼吸道通畅；②重复吸入速效β2受体激动剂联合抗胆碱能药；③静脉滴注糖皮质激素，必要时用氨茶碱；④严密监测生命体征、SpO2及血气；⑤病情无改善、出现寂静胸/意识障碍时做好气管插管机械通气准备。","e":""}]},{"key":"2022_04","name":"2022年4月","qs":[{"i":"2022_04_single_1","t":"single","s":"理想的院前急救反应时间是","c":"绪论","sc":1,"o":{"A":"1～2分钟","B":"4～5分钟","C":"8～10分钟","D":"15～20分钟"},"a":"B","e":"教材指出现场急救理想的反应时间是4～5min。"},{"i":"2022_04_single_3","t":"single","s":"下列属于病情可能随时危及生命、需立即进行救治的是","c":"急诊分诊","sc":1,"o":{"A":"胸痛疑似急性心肌梗死者","B":"急性意识障碍、无反应者","C":"呼吸困难明显血氧饱和度93%者","D":"急性尿潴留患者"},"a":"B","e":"急性意识障碍、无反应者属濒危(I级)病例，需立即抢救。"},{"i":"2022_04_single_4","t":"single","s":"静息状态下人体腋窝温度正常值不超过","c":"常见急性症状的评估","sc":1,"o":{"A":"36.5℃","B":"37℃","C":"37.2℃","D":"37.6℃"},"a":"B","e":"静息状态下口腔温度不超过37.2℃、直肠不超过37.6℃、腋窝温度不超过37℃。"},{"i":"2022_04_single_5","t":"single","s":"心绞痛患者疼痛的特点是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"压榨样疼痛","B":"刺痛","C":"撕裂样疼痛","D":"隐痛"},"a":"A","e":"心绞痛的性质为压榨样疼痛或压迫感、窒息感。"},{"i":"2022_04_single_6","t":"single","s":"心肺复苏时所采取的系列急救措施中，能够转复心律的措施主要是","c":"心肺复苏","sc":1,"o":{"A":"胸外按压","B":"开放气道","C":"人工呼吸","D":"电击除颤"},"a":"D","e":"胸外按压、开放气道、人工呼吸维持循环和氧合，电击除颤是终止室颤、转复心律的关键措施。"},{"i":"2022_04_single_7","t":"single","s":"关于电解质钾的描述，正确的是","c":"危重症患者的护理","sc":1,"o":{"A":"钾离子是细胞内的主要阳离子","B":"血清钾浓度的正常值是2.5～4.5mmol/L","C":"肾的生理功能是保钾排钠","D":"酸中毒时可能会引发低钾血症"},"a":"A","e":"钾是细胞内液的主要阳离子；血清钾正常3.5～5.5mmol/L；酸中毒时H+入细胞内K+移出可致高钾血症。"},{"i":"2022_04_single_8","t":"single","s":"关于休克治疗中补充血容量的说法，不正确的是","c":"危重症患者的护理","sc":1,"o":{"A":"应遵循“需要多少补多少”的原则","B":"补液种类应先晶体液后胶体液","C":"补液速度应先快后慢","D":"尿量＞20ml/h提示血容量已补足"},"a":"D","e":"尿量>30ml/h才提示休克改善、血容量基本补足；>20ml/h不正确。"},{"i":"2022_04_single_9","t":"single","s":"下列情况中常导致等渗性缺水的是","c":"危重症患者的护理","sc":1,"o":{"A":"消化液的急性丢失","B":"大创面的慢性渗液","C":"高热患者大量出汗","D":"危重患者给水不足"},"a":"A","e":"消化液急性丢失(大量呕吐、腹泻、肠瘘)是等渗性缺水常见病因；慢性渗液致低渗性、高热出汗及给水不足致高渗性。"},{"i":"2022_04_single_10","t":"single","s":"MODS治疗的关键是","c":"危重症患者的护理","sc":1,"o":{"A":"病情监测","B":"抗生素的应用","C":"祛除诱因控制原发病","D":"代谢支持"},"a":"C","e":"祛除诱因、控制原发病是MODS治疗的关键。"},{"i":"2022_04_single_11","t":"single","s":"气管插管气囊的压力一般保持在","c":"危重症患者的护理","sc":1,"o":{"A":"15～20mmHg","B":"15～20cmH₂O","C":"25～30mmHg","D":"25～30cmH₂O"},"a":"D","e":"气管插管气囊压力一般保持在25～30cmH₂O。"},{"i":"2022_04_single_12","t":"single","s":"在急性肺血栓栓塞症患者的健康教育措施中，旨在降低血液高凝状态的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"积极治疗高脂血症","B":"术后患者抬高患肢","C":"避免长时间静坐","D":"长期卧床者应用间歇序贯加压充气泵"},"a":"A","e":"积极治疗高脂血症可改善血液高凝状态；抬高患肢、避免久站久坐、序贯加压充气泵主要是促进静脉回流、预防DVT。"},{"i":"2022_04_single_13","t":"single","s":"下列体征中，提示患者出现急性右心衰的是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"肺部啰音","B":"舒张期奔马律","C":"粉红色泡沫痰","D":"肝颈回流征阳性"},"a":"D","e":"肝颈静脉回流征阳性是右心衰竭的典型体征；肺部啰音、粉红色泡沫痰、舒张期奔马律多见于左心衰。"},{"i":"2022_04_single_14","t":"single","s":"恶性高血压是指患者病情急骤发展，舒张压持续大于等于","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"150mmHg","B":"130mmHg","C":"110mmHg","D":"90mmHg"},"a":"B","e":"恶性高血压指病情急骤发展，舒张压持续≥130mmHg，伴眼底出血渗出、视盘水肿及肾损害。"},{"i":"2022_04_single_15","t":"single","s":"我国急性胰腺炎最常见的病因是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"胆道疾病","B":"胰管梗阻","C":"酗酒和暴饮暴食","D":"手术损伤"},"a":"A","e":"我国急性胰腺炎最常见的病因是胆道疾病(胆源性)。"},{"i":"2022_04_single_16","t":"single","s":"急性胰腺炎患者血清脂肪酶开始升高的时间多在起病后","c":"消化系统急症患者的护理","sc":1,"o":{"A":"2～3h","B":"6～12h","C":"24～72h","D":"3～5天"},"a":"C","e":"血清脂肪酶常在病后24～72h开始升高，持续7～10天。"},{"i":"2022_04_single_17","t":"single","s":"高位肠梗阻患者一般不会出现的电解质紊乱是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"低钾血症","B":"低氯血症","C":"代谢性碱中毒","D":"代谢性酸中毒"},"a":"D","e":"高位梗阻呕吐大量胃酸致低钾、低氯及代谢性碱中毒；代谢性酸中毒多见于低位肠梗阻。"},{"i":"2022_04_single_18","t":"single","s":"下列引发急性尿潴留的各类原因中属于动力性梗阻的是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"尿道狭窄","B":"服用阿托品","C":"前列腺增生","D":"盆腔肿瘤压迫"},"a":"B","e":"服用阿托品等药物致膀胱逼尿肌松弛属动力性梗阻；尿道狭窄、前列腺增生、肿瘤压迫属机械性梗阻。"},{"i":"2022_04_single_19","t":"single","s":"糖尿病患者出现尿量减少、皮肤黏膜干燥、眼球凹陷等症状，提示患者","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"肾功能损伤","B":"失水严重","C":"低血糖","D":"电解质紊乱"},"a":"B","e":"尿量减少、皮肤黏膜干燥、眼球凹陷是严重失水(脱水)的表现。"},{"i":"2022_04_single_20","t":"single","s":"尿毒症患者胰岛素治疗中容易出现低血糖，其原因是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖漏出过多","B":"胰岛素清除率降低","C":"食物摄入不规律","D":"机体营养不良"},"a":"B","e":"肾脏是胰岛素灭活的主要器官，尿毒症时胰岛素清除率降低、作用时间延长，易发生低血糖。"},{"i":"2022_04_single_21","t":"single","s":"糖尿病酮症酸中毒的主要表现不包括","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"多食","B":"烦渴多饮","C":"多尿","D":"乏力"},"a":"A","e":"DKA时呈多饮、多尿、乏力，随病情进展出现食欲减退、恶心呕吐，而非多食。"},{"i":"2022_04_single_22","t":"single","s":"脑出血最常见的病因是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"颅内肿瘤","B":"动静脉畸形","C":"颅内动脉瘤破裂","D":"高血压"},"a":"D","e":"高血压合并小动脉硬化是脑出血最常见的病因。"},{"i":"2022_04_single_23","t":"single","s":"烧伤患者进行暴露疗法时，室温一般维持在","c":"损伤急症患者的护理","sc":1,"o":{"A":"15～17℃","B":"18～20℃","C":"30～32℃","D":"36～38℃"},"a":"C","e":"烧伤暴露疗法时室温一般维持在30～32℃。"},{"i":"2022_04_single_24","t":"single","s":"狂犬病患者的特殊症状是","c":"损伤急症患者的护理","sc":1,"o":{"A":"吞咽困难","B":"四肢瘫痪","C":"肌束震颤","D":"恐水怕风"},"a":"D","e":"恐水、怕风是狂犬病(恐水症)的特征性特殊症状。"},{"i":"2022_04_single_25","t":"single","s":"下列不属于正常子宫收缩特点的是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"节律性","B":"对称性","C":"剧烈性","D":"极性"},"a":"C","e":"正常子宫收缩具有节律性、对称性、极性和缩复作用，不包括剧烈性。"},{"i":"2022_04_single_26","t":"single","s":"急性闭角型青光眼患者使用β-肾上腺素受体阻滞剂后应注意观察患者的","c":"眼科急症患者的护理","sc":1,"o":{"A":"体温","B":"心率","C":"呼吸","D":"氧饱和度"},"a":"B","e":"β-肾上腺素受体阻滞剂(噻吗洛尔)可减慢心率，使用时应注意观察心率、脉率，异常及时停药报告。"},{"i":"2022_04_single_27","t":"single","s":"小儿急性喉炎的治疗关键是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"止咳化痰","B":"营养支持","C":"防止高热脱水","D":"解除喉阻塞"},"a":"D","e":"小儿急性喉炎易发生喉阻塞，治疗关键是及时解除喉阻塞、保持呼吸道通畅。"},{"i":"2022_04_single_28","t":"single","s":"某环卫工人于室外作业时出现头晕、恶心、呕吐，休息后不缓解，遂至急诊。查体：神志清楚，大汗淋漓、面色苍白、皮肤湿冷，脉细速，R 20次/分，BP 80/50mmHg，判断该患者的中暑类型为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"先兆中暑","B":"轻症中暑","C":"热衰竭","D":"热射病"},"a":"C","e":"大汗、面色苍白、皮肤湿冷、脉细速、血压降低而神志清楚，符合热衰竭(中暑衰竭)。"},{"i":"2022_04_single_29","t":"single","s":"镇静催眠药中毒患者洗胃最有效的时间范围是中毒后","c":"急性中毒患者的护理","sc":1,"o":{"A":"6h内","B":"8h内","C":"10h内","D":"12h内"},"a":"A","e":"洗胃一般在服毒后6h内最有效。"},{"i":"2022_04_single_30","t":"single","s":"有机磷农药中毒患者体内大量蓄积的物质是","c":"急性中毒患者的护理","sc":1,"o":{"A":"胆固醇","B":"儿茶酚胺","C":"乙酰胆碱","D":"多巴胺"},"a":"C","e":"有机磷抑制胆碱酯酶，致乙酰胆碱在体内大量蓄积，产生M样和N样症状。"},{"i":"2022_04_multi_31","t":"multi","s":"关于成人胸外按压的操作，正确的是","c":"心肺复苏","sc":2,"o":{"A":"按压频率100～120次/分","B":"按压深度3～4cm","C":"放松时手掌抬离胸壁","D":"按压通气比为15:2","E":"换人按压中断时间＜5秒"},"a":"AE","e":"成人按压频率100～120次/分、深度5～6cm、按压通气比30:2、掌根不离开胸壁、换人中断<5s；B、C、D错误。"},{"i":"2022_04_multi_32","t":"multi","s":"低钙血症患者的急救护理措施包括","c":"危重症患者的护理","sc":2,"o":{"A":"静脉注射10%葡萄糖酸钙","B":"严密监测病情","C":"使用维生素D促进钙的吸收","D":"做好气管切开的准备","E":"在1h内大量输注生理盐水"},"a":"ABCD","e":"低钙血症需静注10%葡萄糖酸钙、严密监测、补充维生素D促钙吸收，严重者累及呼吸肌应做好气管切开准备；大量输生理盐水是高钙血症的处理。"},{"i":"2022_04_multi_33","t":"multi","s":"急性冠脉综合征包括","c":"心血管系统急症患者的护理","sc":2,"o":{"A":"稳定型心绞痛","B":"不稳定型心绞痛","C":"急性心肌梗死","D":"缺血性心肌病","E":"隐匿性冠心病"},"a":"BC","e":"急性冠脉综合征(ACS)包括不稳定型心绞痛、非ST段抬高型心肌梗死和ST段抬高型心肌梗死。"},{"i":"2022_04_multi_34","t":"multi","s":"高渗性非酮症糖尿病昏迷患者血液检查的主要改变包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"血糖升高","B":"血酮体升高","C":"血浆渗透压升高","D":"血淀粉酶升高","E":"血pH值降低"},"a":"AC","e":"高渗高血糖综合征以血糖显著升高、血浆渗透压升高为特点，血酮体不高、无明显酸中毒；B、E不符合，D与本病无关。"},{"i":"2022_04_multi_35","t":"multi","s":"中暑治疗中药物降温的作用包括","c":"物理与环境因素所致的急症患者的护理","sc":2,"o":{"A":"防止肌肉震颤","B":"扩张周围血管","C":"调节体温中枢","D":"促进汗腺分泌","E":"降低机体氧耗"},"a":"BCE","e":"氯丙嗪等药物降温具有调节体温中枢、扩张血管、松弛肌肉、降低氧耗的作用。"},{"i":"2022_04_short_36","t":"short","s":"简述Wells评分对肺血栓栓塞症患者进行初筛的主要参数。","c":"呼吸系统急症患者的护理","sc":5,"at":"参考答案（要点）：①既往有PTE或DVT病史；②近期有手术史或制动；③肿瘤；④咯血；⑤心率>100次/分；⑥临床有DVT表现；⑦认为PTE的可能性大于其他诊断。按积分判断低、中、高度可能。","e":""},{"i":"2022_04_short_37","t":"short","s":"简述急性胰腺炎患者腹痛的特点。","c":"消化系统急症患者的护理","sc":5,"at":"参考答案（要点）：①常于酗酒或暴饮暴食后突发；②多位于上腹正中或左上腹，呈持续性剧痛；③疼痛常向左腰背部(肩腰部)放射；④进食后加重；⑤取弯腰、屈膝侧卧位可稍减轻；⑥疼痛程度与病情严重程度相关。","e":""},{"i":"2022_04_short_38","t":"short","s":"简述对脑卒中患者“FAST”判断法的主要内容。","c":"神经系统急症患者的护理","sc":5,"at":"参考答案（要点）：F(Face脸)：让患者笑一下，观察双侧口角是否对称、能否正常微笑；A(Arm胳膊)：让患者举起双手，观察有无一侧肢体麻木无力、下垂；S(Speech言语)：让患者重复一句话，观察是否言语表达困难、口齿不清；T(Time时间)：明确记录发病时间，为溶栓等救治争取时间。","e":""},{"i":"2022_04_short_39","t":"short","s":"简述喉烫伤患者的急救护理措施。","c":"耳鼻喉科急症患者的护理","sc":5,"at":"参考答案（要点）：①局部处理：热液烫伤口含冰块、冰水漱口、颈部冷敷；酸碱灼伤立即清水冲洗并予中和(强酸给牛奶蛋清、强碱给食醋)；②保持呼吸道通畅，分泌物多、有窒息危险者及早气管切开；③建立静脉通路补液、维持水电解质平衡，雾化吸入抗生素或糖皮质激素，解痉；④留置胃管鼻饲营养、防止食管瘢痕狭窄；⑤做好口腔护理、止痛及预防感染。","e":""},{"i":"2022_04_essay_40","t":"essay","s":"论述气胸患者行胸腔闭式引流的护理要点。","c":"呼吸系统急症患者的护理","sc":10,"at":"参考答案（要点）：①妥善固定引流管，保持密闭通畅，水封瓶长管浸入液面下2～4cm并保持直立；②水封瓶置于胸腔引流口以下约60cm，防止液体反流；③严格无菌操作，定时更换引流瓶，穿刺口敷料渗湿及时更换；④观察引流是否通畅，注意长管水柱波动及气体/液体引流情况，记录引流液色质量；⑤鼓励患者咳嗽、深呼吸以利肺复张；⑥防止脱管，患者搬动时双钳夹管；⑦胸片示肺复张后可夹管观察24～48h，无异常再拔管，拔管后以凡士林纱布密封伤口并观察有无胸闷、呼吸困难。","e":""},{"i":"2022_04_case_41","t":"case","s":"患者，男性，69岁，吸烟30余年，20年前出现慢性咳嗽、咳痰，每年冬春季发病连续3个月以上，近5年来病情明显加重，常年发病，伴有喘息和呼吸困难，活动后加剧。3天前受凉后出现发热、剧咳、咳多量黄脓痰，不易咳出，气急、呼吸困难加重，伴发绀，自服“消炎药”并自行低流量吸氧，症状未减轻，急诊入院。查体：T 38.2℃，P 120次/分，R 30次/分，BP 130/80mmHg，半卧位，神清，唇颊发绀，球结膜水肿，皮肤湿暖；桶状胸，双侧语颤对称减弱，叩诊呈过清音，两肺呼吸音减弱，呼气延长，闻及中等量干、湿性啰音，心音遥远，律齐，未闻及明显杂音。肝脾肋下未及，双下肢不肿。患者血气分析结果回报：pH 7.34，PaO₂ 52mmHg，PaCO₂ 54mmHg。\n请写出：\n（1）该患者呼吸困难的最可能原因；\n（2）对该患者分诊评估的要点；\n（3）按照四级病情分级标准该患者病情目前的等级。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：(1)最可能原因：慢性阻塞性肺疾病(COPD)急性加重并发II型呼吸衰竭。依据：长期吸烟、慢性咳嗽咳痰每年连续3个月以上；桶状胸、过清音、呼气延长等肺气肿体征；受凉后黄脓痰、发热、呼吸困难加重；血气pH 7.34、PaO₂ 52mmHg、PaCO₂ 54mmHg，符合II型(高碳酸性)呼衰。(2)分诊评估要点：评估呼吸困难程度、呼吸频率节律及辅助呼吸肌运动；监测SpO₂、发绀、意识状态；评估咳嗽咳痰性状及发热；结合既往COPD/肺心病史和用药；完善动脉血气。(3)四级病情分级：该患者有明显发绀、R 30次/分、II型呼吸衰竭，属II级(危重)，应在10分钟内处置。","e":""},{"i":"2022_04_case_42","t":"case","s":"患者，男性，27岁，因“交通意外致全身多发伤半小时”急诊就诊。查体：T 36.9℃，R 32次/分，HR 116次/分，BP 78/50mmHg。头皮软组织瘀血肿胀，左胸第4～7肋内凹畸形伴压痛，左上腹压痛明显。\n请写出：\n（1）该患者的急救原则；\n（2）运用VIPCO程序针对该患者实施救护的措施。（注：V：ventilation，I：infusion，P：pulsation，C：control bleeding，O：operation）","c":"损伤急症患者的护理","sc":15,"at":"参考答案（要点）：(1)急救原则：先抢救生命后处理创伤，快速评估与处置气道、呼吸、循环；积极抗休克、控制活动性出血；警惕张力性气胸、连枷胸及腹腔内(脾)破裂出血，尽快术前准备、急诊手术。(2)VIPCO程序：V(ventilation保持气道通畅)：清除口腔异物，维持气道通畅，给氧，必要时气管插管；I(infusion输液抗休克)：迅速建立两条以上大口径静脉通路，快速补液、交叉配血输血；P(pulsation监测循环)：监测脉搏、血压、心电及意识、尿量；C(control bleeding控制出血)：对外出血加压包扎止血，警惕并处理胸腔/腹腔内出血；O(operation手术)：尽快做好术前准备，急诊手术探查止血。","e":""}]},{"key":"2022_10","name":"2022年10月","qs":[{"i":"2022_10_single_1","t":"single","s":"急救护理始于","c":"绪论","sc":1,"o":{"A":"文艺复兴时期","B":"20世纪60年代","C":"南丁格尔时代","D":"20世纪80年代"},"a":"C","e":"教材明确记载急救护理始于南丁格尔时代，20世纪60年代后进入有抢救设备的新阶段。"},{"i":"2022_10_single_2","t":"single","s":"当患者呼之不应时，分诊护士首先要检查患者的","c":"急诊分诊","sc":1,"o":{"A":"呼吸情况","B":"瞳孔情况","C":"血压情况","D":"血氧饱和度"},"a":"A","e":"急诊分诊初级评估遵循ABC原则，呼之不应时首先检查气道与呼吸情况。"},{"i":"2022_10_single_3","t":"single","s":"铁锈色痰多见于","c":"常见急性症状的评估","sc":1,"o":{"A":"大叶性肺炎","B":"克雷伯菌肺炎","C":"病毒性肺炎","D":"急性左心衰"},"a":"A","e":"教材记载铁锈色痰多见于大叶性肺炎及肺吸虫病；砖红色胶冻样痰多见于克雷伯菌肺炎。"},{"i":"2022_10_single_4","t":"single","s":"胸外按压过程中，因下列操作而中断按压的时间符合美国心脏协会要求的是","c":"心肺复苏","sc":1,"o":{"A":"换人4秒","B":"除颤15秒","C":"2次吹气18秒","D":"插管25秒"},"a":"A","e":"AHA要求换人<5s，除颤可暂停5s，2次吹气<10s，插管可暂停10~15s。换人4秒符合<5s要求。"},{"i":"2022_10_single_5","t":"single","s":"为保证胸外按压质量，胸外按压分数（CCF）至少应大于","c":"心肺复苏","sc":1,"o":{"A":"20%","B":"40%","C":"60%","D":"80%"},"a":"C","e":"教材明确指出胸外按压分数（CCF）为了避免按压中断，应>60%。"},{"i":"2022_10_single_6","t":"single","s":"下列血气指标中用于反映氧合状态的指标是","c":"危重症患者的护理","sc":1,"o":{"A":"SB","B":"PaO₂","C":"pH","D":"BE"},"a":"B","e":"PaO₂（动脉血氧分压）直接反映机体氧合状态；SB、pH、BE主要反映酸碱平衡。"},{"i":"2022_10_single_7","t":"single","s":"低渗性缺水患者血清钠水平在130～135mmol/L，其缺钠程度为","c":"危重症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"极重度"},"a":"A","e":"教材记载轻度缺钠血清钠在130~135mmol/L，中度为120~129mmol/L，重度在120mmol/L以下。"},{"i":"2022_10_single_8","t":"single","s":"抗休克最基本的措施是","c":"危重症患者的护理","sc":1,"o":{"A":"安置体位","B":"气道管理","C":"处理并发症","D":"补充血容量"},"a":"D","e":"教材明确指出补充血容量是抗休克最基本也是最首要的措施之一。"},{"i":"2022_10_single_9","t":"single","s":"胸外心脏非同步直流电除颤时，APEX手柄电极应放置的位置是","c":"心肺复苏","sc":1,"o":{"A":"右腋中线第5肋间","B":"左腋中线第5肋间","C":"右锁骨中线第2肋间","D":"左锁骨中线第2肋间"},"a":"B","e":"教材记载卧位时右手持APEX手柄电极置于患者左腋中线第5肋间，STERNUM电极置于右锁骨中线第2肋间。"},{"i":"2022_10_single_10","t":"single","s":"某哮喘患者急性发作时，不能讲话，并出现胸腹反常运动，判断该患者病情严重程度分级为","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"危重"},"a":"D","e":"教材记载危重哮喘患者出现胸腹反常运动、寂静胸、脉率变慢或不规则等表现，提示呼吸肌疲劳。"},{"i":"2022_10_single_11","t":"single","s":"急性心肌梗死患者行溶栓治疗后，提示血管再通的征象不包括","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"2小时内胸痛基本消失","B":"2小时内出现再灌注心律失常","C":"2小时内抬高的ST段回落＞50%","D":"2小时内血清淀粉酶峰值提前出现"},"a":"D","e":"血管再通征象包括ST段2小时内回落>50%、胸痛2小时内基本消失、2小时内出现再灌注心律失常、14小时内血清CK-MB酶峰值提前出现。选项D为血清淀粉酶，应为CK-MB，故不包括。"},{"i":"2022_10_single_12","t":"single","s":"下列心律失常的发生属于冲动传导异常的是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"心房颤动","B":"期前收缩","C":"窦性心动过缓","D":"预激综合征"},"a":"D","e":"教材记载冲动传导异常包括房室传导途径异常如预激综合征；心房颤动和期前收缩属于冲动形成异常。"},{"i":"2022_10_single_13","t":"single","s":"高血压脑病患者开始降压的1小时内，平均动脉压的降低幅度不超过治疗前水平的","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"45%","B":"35%","C":"25%","D":"15%"},"a":"C","e":"教材明确记载开始降压的1小时内，平均动脉压的降低幅度不超过治疗前水平的25%。"},{"i":"2022_10_single_14","t":"single","s":"大便不变黑，但大便隐血试验阳性提示患者的出血量为","c":"消化系统急症患者的护理","sc":1,"o":{"A":"＜50ml","B":"50～100ml","C":"200～500ml","D":"＞500ml"},"a":"A","e":"教材记载出血量5~50ml时大便一般不变黑，但隐血试验可阳性；50~100ml以上出现黑便。"},{"i":"2022_10_single_15","t":"single","s":"尿石症患者预防结石复发的措施不包括","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"大量饮水","B":"调节饮食","C":"定期导尿","D":"合理用药"},"a":"C","e":"教材记载尿石症健康教育包括饮水防石、饮食指导、药物预防，不包括定期导尿。"},{"i":"2022_10_single_16","t":"single","s":"精索扭转多发生在","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"肾结石患者","B":"老年人","C":"糖尿病患者","D":"青少年"},"a":"D","e":"教材明确记载精索扭转又称睾丸扭转，多发生在青少年。"},{"i":"2022_10_single_17","t":"single","s":"解除急性尿潴留最直接有效的方法是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"手术切开尿道口狭窄部位","B":"协助患者调整排尿体位和姿势","C":"实施导尿术","D":"行耻骨上膀胱造瘘"},"a":"C","e":"教材明确记载导尿是解除急性尿潴留最直接有效的方法。"},{"i":"2022_10_single_18","t":"single","s":"输注胰岛素过程中最常见的并发症是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"低血糖","B":"局部脂肪增生","C":"静脉炎","D":"皮肤过敏"},"a":"A","e":"教材明确记载低血糖是输注胰岛素过程中最常见的并发症。"},{"i":"2022_10_single_19","t":"single","s":"抢救糖尿病酮症酸中毒的关键措施是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"补液","B":"补钾","C":"补充胰岛素","D":"抗感染"},"a":"A","e":"教材明确记载补液是抢救DKA首要的关键措施，只有组织灌注改善后胰岛素生物效能才能充分发挥。"},{"i":"2022_10_single_20","t":"single","s":"甲状腺危象的病因不包括","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"感染","B":"使用抗甲状腺药物","C":"应激","D":"接受甲状腺手术"},"a":"B","e":"教材记载甲状腺危象诱因包括感染或甲状腺手术、应激下儿茶酚胺活性增强等。使用抗甲状腺药物是治疗措施而非病因。"},{"i":"2022_10_single_21","t":"single","s":"癫痫发作时的护理措施中不正确的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"边抢救边呼叫，切勿离开患者","B":"头转向一侧，保持呼吸道通畅","C":"将缠有纱布的压舌板置于上下门齿之间，以免舌咬伤","D":"抽搐时勿用力按压抽搐肢体，以免骨折"},"a":"C","e":"教材记载应将缠有纱布的压舌板置于上下臼齿之间（而非门齿之间），以免舌咬伤。"},{"i":"2022_10_single_22","t":"single","s":"按照新九分法，双上肢烧伤的患者烧伤面积为","c":"损伤急症患者的护理","sc":1,"o":{"A":"9%","B":"18%","C":"27%","D":"36%"},"a":"B","e":"新九分法中双上肢占体表面积的9×2=18%。"},{"i":"2022_10_single_23","t":"single","s":"临床上最常见的宫外孕类型是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"卵巢妊娠","B":"输卵管妊娠","C":"腹腔妊娠","D":"阔韧带妊娠"},"a":"B","e":"输卵管妊娠是最常见的异位妊娠（宫外孕）类型。"},{"i":"2022_10_single_24","t":"single","s":"下列关于机械性眼外伤患者的护理措施中，不妥的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"眼睑水肿者早期局部冷敷","B":"用无菌纱布遮盖伤眼","C":"取异物术后遵医嘱使用抗生素","D":"取异物术前冲洗结膜囊"},"a":"D","e":"教材明确记载进行眼内异物取出手术前禁忌结膜囊冲洗，防止增加眼球压力和感染机会。"},{"i":"2022_10_single_25","t":"single","s":"对鼻出血患者实施指压止血法时，患者应采取的体位为","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"平卧位","B":"俯卧位","C":"坐位","D":"头低脚高位"},"a":"C","e":"教材记载指压止血法时患者取坐位，头部略前倾，用手指按压出血侧鼻翼或捏紧双侧鼻翼。"},{"i":"2022_10_single_26","t":"single","s":"下列临床表现提示为小儿急性喉炎的是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"咯血","B":"心悸","C":"铁锈色痰","D":"犬吠样咳嗽"},"a":"D","e":"教材记载小儿急性喉炎早期表现为阵发性犬吠样咳嗽或呼吸困难。"},{"i":"2022_10_single_27","t":"single","s":"下列因素中，易致中暑的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"甲状腺功能减退","B":"环境湿度过高","C":"久坐","D":"消瘦"},"a":"B","e":"教材明确记载气温高、湿度大、高热辐射是中暑产生的基础。"},{"i":"2022_10_single_28","t":"single","s":"严重冻僵时，患者的体温一般低于","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"35℃","B":"32℃","C":"30℃","D":"28℃"},"a":"D","e":"教材记载轻度冻僵体温35~32℃，中度冻僵体温28~32℃，严重冻僵体温<28℃。"},{"i":"2022_10_single_29","t":"single","s":"淡水淹溺者的实验室检查结果，不可能出现的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"高钠","B":"低氯","C":"溶血","D":"低蛋白血症"},"a":"A","e":"淡水淹溺时血液被稀释，可出现低钠、低氯、溶血、低蛋白血症，需补充氯化钠溶液，故高钠不可能出现。"},{"i":"2022_10_single_30","t":"single","s":"有机磷农药中毒患者最早出现的症状是","c":"急性中毒患者的护理","sc":1,"o":{"A":"烟碱样症状","B":"毒蕈碱样症状","C":"中枢神经系统症状","D":"反跳症状"},"a":"B","e":"教材明确记载毒蕈碱（M）样症状最早出现，主要为副交感神经兴奋所致的平滑肌痉挛和腺体分泌增多。"},{"i":"2022_10_multi_31","t":"multi","s":"\"SOAP\"急诊分诊法的内容包括","c":"急诊分诊","sc":2,"o":{"A":"主诉","B":"观察","C":"评估","D":"计划","E":"评价"},"a":"ABCD","e":"SOAP分诊法：S(subjective)主诉、O(objective)观察、A(assess)评估、P(plan)计划，不包括评价(E)。"},{"i":"2022_10_multi_32","t":"multi","s":"下列关于口咽通气道置入技术的说法中正确的有","c":"急救技术","sc":2,"o":{"A":"是一种辅助通气技术","B":"癫痫发作的患者适用","C":"口咽通气道内口置于气管分叉处","D":"置入后妥善固定，避免脱出","E":"置入期间做好口腔护理，避免痰痂堵塞"},"a":"ABDE","e":"口咽通气道是辅助通气设备，适应证包括癫痫发作或痉挛抽搐患者；置入后应妥善固定避免脱出，保持通畅湿化防止痰痂堵塞。其内口位于上咽部而非气管分叉处，故C错误。"},{"i":"2022_10_multi_33","t":"multi","s":"上尿路结石患者可出现的典型临床表现包括","c":"泌尿系统急症患者的护理","sc":2,"o":{"A":"疼痛","B":"血尿","C":"点滴状排尿","D":"恶心、呕吐","E":"膀胱刺激症状"},"a":"ABD","e":"上尿路结石主要症状为疼痛和血尿，输尿管结石梗阻时可伴恶心呕吐。点滴状排尿为尿道结石（下尿路）表现；膀胱刺激症状仅在结石伴感染或输尿管膀胱壁段结石时出现，非典型表现。"},{"i":"2022_10_multi_34","t":"multi","s":"甲亢危象患者的常见死因包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"感染","B":"休克","C":"心力衰竭","D":"肝功能衰竭","E":"肾功能衰竭"},"a":"BC","e":"教材明确记载甲亢危象患者常死于休克、心力衰竭。感染为常见诱因而非直接死因。"},{"i":"2022_10_multi_35","t":"multi","s":"椎-基底动脉梗死的典型表现包括","c":"神经系统急症患者的护理","sc":2,"o":{"A":"眩晕","B":"眼震","C":"失语","D":"共济失调","E":"偏身感觉障碍"},"a":"ABD","e":"教材记载椎-基底动脉系统（后循环）梗死典型表现为眩晕、恶心、呕吐、眼震、吞咽困难及共济失调。失语和偏身感觉障碍为颈内动脉系统（前循环）梗死表现。"},{"i":"2022_10_short_36","t":"short","s":"简述AED除颤的操作步骤。","c":"心肺复苏","sc":5,"at":"参考答案（要点）：①患者仰卧，解开上衣，暴露胸部，擦干皮肤；②开机，将电极片分别贴于右上胸（锁骨下方）和左乳头外侧（左腋中线第5肋间）；③AED自动分析心律，所有人不得接触患者；④如建议除颤，确保无人接触患者后按下除颤键；⑤除颤后立即继续胸外按压，按提示重复分析。","e":""},{"i":"2022_10_short_37","t":"short","s":"简述低钾血症的补钾原则。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：①尽量口服补钾，不能口服者静脉补钾；②静脉补钾浓度不超过0.3%（40mmol/L）；③补钾速度不宜过快，成人每小时不超过20mmol；④见尿补钾，尿量>40ml/h或>500ml/d时方可补钾；⑤总量限制，每日补钾量40~80mmol；⑥监测血钾和心电图，避免高钾血症。","e":""},{"i":"2022_10_short_38","t":"short","s":"简述为外伤患者实施包扎的注意事项。","c":"急救技术","sc":5,"at":"参考答案（要点）：①包扎动作轻巧，避免碰撞伤口，不触碰伤口内创面；②包扎松紧适宜，过紧影响血液循环，过松易脱落；③包扎方向自远心端向近心端，残肢外露；④打结避开伤口和受压部位；⑤四肢包扎应露出指（趾）端，观察末梢循环；⑥包扎后妥善固定，记录时间。","e":""},{"i":"2022_10_short_39","t":"short","s":"简述低血糖危象患者升血糖治疗的急救护理措施。","c":"内分泌系统急症患者的护理","sc":5,"at":"参考答案（要点）：①立即卧床休息，保持呼吸道通畅；②清醒者口服葡萄糖水或含糖食物；③意识不清者遵医嘱静脉推注50%葡萄糖20~40ml；④必要时遵医嘱静脉滴注葡萄糖或使用胰高血糖素；⑤每1~2小时监测血糖，直至血糖稳定；⑥观察意识、生命体征变化，记录出入量；⑦寻找并去除诱因。","e":""},{"i":"2022_10_essay_40","t":"essay","s":"论述颅脑损伤患者病情评估的要点。","c":"神经系统急症患者的护理","sc":10,"at":"参考答案（要点）：①意识状态评估：采用GCS评分，评估睁眼、语言、运动反应，意识障碍进行性加重提示颅内血肿；②生命体征监测：血压升高、脉压增大、呼吸深慢、心率减慢（Cushing反应）提示颅内压增高；③瞳孔变化：双侧瞳孔不等大、对光反射异常提示脑疝；④神经系统体征：肢体肌力、肌张力、病理反射，定位体征提示损伤部位；⑤头痛与呕吐：剧烈头痛、频繁喷射性呕吐提示颅内压增高；⑥其他：有无脑脊液漏、耳鼻出血、癫痫发作等。动态评估，及时发现病情恶化。","e":""},{"i":"2022_10_case_41","t":"case","s":"患者，男性，46岁，因饱餐后出现剧烈上腹痛、阵发性加重半小时来诊。患者神志清楚，痛苦面容，肥胖体态，疼痛位于右腹部，呈绞痛，程度剧烈且阵发性加重，无放射，无明显转移痛，蹲位疼痛有所减轻，伴恶心、呕吐、大汗，呕吐2次，均为胃内容物，腹部平坦，右上腹压痛及反跳痛（+），Murphy征（+）。既往有胆囊炎、胆石症病史2年。请按照腹痛的\"PQRST\"分诊法对该患者的疼痛情况进行分析，并逐一说明。","c":"急诊分诊","sc":15,"at":"参考答案（要点）：P(provokes)诱因：饱餐后诱发，蹲位疼痛减轻；Q(quality)性质：绞痛，阵发性加剧；R(radiate)放射：无放射痛，无明显转移痛，疼痛位于右腹部/右上腹；S(severity)程度：程度剧烈，伴大汗、呕吐，痛苦面容；T(time)时间：餐后半小时发作，持续约半小时，阵发性加重。结合既往胆囊炎、胆石症病史及Murphy征(+)，考虑急性胆囊炎/胆绞痛发作。","e":""},{"i":"2022_10_case_42","t":"case","s":"患者，男性，64岁，主因\"持续胸痛1小时\"就诊。患者晨起突感胸骨后剧烈疼痛，伴有大汗、恶心，自服硝酸甘油30分钟后疼痛仍不缓解。近1月无明显诱因多次出现心前区憋闷，每次持续约20～30分钟，休息不能完全缓解。查体：神清，痛苦面容，T37.4℃，P96次/分，R18次/分，BP120/80mmHg。心电图示：V₁-V₅导联ST段弓背向上抬高。患者既往高血压病史10余年，目前无活动性出血。初步诊断为急性冠脉综合征，拟行急诊经皮冠状动脉介入治疗。请写出：（1）该患者初步诊断为急性冠脉综合征的依据；（2）为进一步明确诊断，该患者必做的一项实验室检查；（3）针对该患者目前状况的主要急救护理措施。","c":"心血管系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）诊断依据：①持续性胸骨后剧烈疼痛1小时，硝酸甘油不缓解；②近期反复心前区憋闷，休息不能完全缓解；③心电图V₁~V₅导联ST段弓背向上抬高；④伴大汗、恶心等症状；⑤高血压病史。（2）必做实验室检查：心肌损伤标志物（肌钙蛋白cTnI/cTnT或CK-MB）。（3）主要急救护理措施：①立即卧床休息，心电监护，吸氧；②建立静脉通路，遵医嘱镇痛（吗啡）、抗血小板（阿司匹林+氯吡格雷）、抗凝治疗；③监测心电图变化，注意再灌注心律失常；④做好急诊PCI术前准备（备皮、皮试、抽血、告知）；⑤持续监测生命体征、胸痛变化；⑥做好心理护理，缓解焦虑。","e":""}]},{"key":"2023_04","name":"2023年4月","qs":[{"i":"2023_04_single_2","t":"single","s":"对于疑似诺如病毒感染者应采用的隔离技术是","c":"急诊分诊","sc":1,"o":{"A":"飞沫传播疾病隔离","B":"空气传播疾病隔离","C":"血液体液传播疾病隔离","D":"接触传播疾病隔离"},"a":"D","e":"教材明确记载诺如病毒属于接触传播疾病隔离的适用范围。"},{"i":"2023_04_single_3","t":"single","s":"急诊分诊护士定期接受急救技能再培训的时间间隔原则上不超过","c":"急诊分诊","sc":1,"o":{"A":"1年","B":"2年","C":"3年","D":"4年"},"a":"B","e":"教材记载急救技能再培训间隔原则上不超过2年。"},{"i":"2023_04_single_4","t":"single","s":"患儿，女性，7岁，进食过程中突发呼吸困难，吸气时出现\"三凹征\"伴有高调吸气性哮鸣音，其原因最可能的是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"慢性阻塞性肺疾病","B":"支气管哮喘","C":"大量胸水","D":"上呼吸道异物"},"a":"D","e":"教材记载吸气性呼吸困难表现为三凹征伴高调吸气性哮鸣音，为上气道狭窄或梗阻特征，见于上呼吸道异物等。进食时突发更支持异物。"},{"i":"2023_04_single_5","t":"single","s":"低渗性缺水的患者不可能出现的症状为","c":"危重症患者的护理","sc":1,"o":{"A":"口渴","B":"疲乏","C":"尿比重降低","D":"腱反射减弱"},"a":"A","e":"低渗性缺水时细胞外液呈低渗状态，患者无口渴感；口渴为高渗性缺水表现。"},{"i":"2023_04_single_6","t":"single","s":"院外心搏骤停急救生存链的首个环节是","c":"心肺复苏","sc":1,"o":{"A":"快速除颤","B":"监测和预防","C":"识别和启动应急反应系统","D":"及时高质量心肺复苏"},"a":"C","e":"院外心搏骤停急救生存链第一环为识别心搏骤停并启动应急反应系统。"},{"i":"2023_04_single_7","t":"single","s":"休克治疗中补充血容量应遵循","c":"危重症患者的护理","sc":1,"o":{"A":"先晶体液后胶体液，先快后慢","B":"先胶体液后晶体液，先快后慢","C":"先晶体液后胶体液，先慢后快","D":"先胶体液后晶体液，先慢后快"},"a":"A","e":"休克补液遵循先晶后胶、先快后慢、见尿补钾的原则。"},{"i":"2023_04_single_8","t":"single","s":"为颈椎损伤患者开放气道应采用","c":"心肺复苏","sc":1,"o":{"A":"仰头提颏法","B":"反转法","C":"推举下颌法","D":"背负法"},"a":"C","e":"教材明确记载怀疑颈椎损伤的患者采用推举下颌法（托下颌法）开放气道。"},{"i":"2023_04_single_9","t":"single","s":"机械通气时吸气与呼气的时间比一般设置为","c":"危重症患者的护理","sc":1,"o":{"A":"1∶1","B":"1∶2","C":"1∶3","D":"1∶4"},"a":"B","e":"教材记载机械通气吸气与呼气时间比一般设置为I:E=1:2。"},{"i":"2023_04_single_10","t":"single","s":"患者，男性，35岁，因自发性气胸行胸腔闭式引流术，术后活动时不慎将引流管扯脱，此时护士首先应该","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"让患者立即平卧","B":"将脱落的引流管重新插回胸腔","C":"用无菌敷料封闭伤口","D":"用粗针头行胸膜穿刺抽气"},"a":"C","e":"胸腔闭式引流管脱落后应立即用无菌敷料封闭伤口，防止开放性气胸，再通知医生处理。"},{"i":"2023_04_single_11","t":"single","s":"主动脉夹层患者的胸痛常表现为","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"间断绞窄性剧烈疼痛","B":"突发触电样轻微灼痛","C":"阵发性压榨样隐痛","D":"突发撕裂样剧烈疼痛"},"a":"D","e":"教材明确记载主动脉夹层疼痛性质为撕裂样疼痛，程度剧烈，呈持续性。"},{"i":"2023_04_single_12","t":"single","s":"上消化道出血的特征性表现是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"腹痛和腹胀","B":"恶心和呕吐","C":"呕血和黑便","D":"腹部压痛和反跳痛"},"a":"C","e":"呕血和黑便是上消化道出血的特征性表现。"},{"i":"2023_04_single_13","t":"single","s":"急性胰腺炎在我国最常见的病因是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"胰管梗阻","B":"暴饮暴食","C":"酗酒","D":"胆道疾病"},"a":"D","e":"教材明确记载我国以胆道疾病为急性胰腺炎最常见病因，占50%~80%；西方国家以大量饮酒为常见病因。"},{"i":"2023_04_single_14","t":"single","s":"急性胰腺炎患者为减轻腹痛首选的体位是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"平卧位","B":"屈膝侧卧位","C":"俯卧位","D":"仰卧中凹位"},"a":"B","e":"急性胰腺炎患者取屈膝侧卧位可减轻腹壁张力，缓解疼痛。"},{"i":"2023_04_single_15","t":"single","s":"尿尿酸结石患者应避免进食","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"动物内脏","B":"浓茶咖啡","C":"高糖水果","D":"豆制品"},"a":"A","e":"教材记载尿酸结石者应避免嘌呤高的食物，如动物内脏等。"},{"i":"2023_04_single_16","t":"single","s":"影响低血糖症状发生和严重程度的因素不包括","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血糖下降程度","B":"血糖下降速度","C":"机体反应性","D":"患者意识状态"},"a":"D","e":"低血糖症状与血糖下降程度、速度及机体反应性有关，患者意识状态是低血糖的结果而非影响因素。"},{"i":"2023_04_single_17","t":"single","s":"下列关于短暂性脑缺血发作的临床特点的描述，正确的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"房颤患者高发","B":"临床症状多持续10-15min","C":"多遗留神经功能缺损","D":"影像学检查可见责任病灶"},"a":"A","e":"TIE症状持续数分钟至数小时（24h内完全恢复），不留神经功能缺损，影像学无责任病灶；房颤是心源性栓子的重要来源。"},{"i":"2023_04_single_18","t":"single","s":"确诊脑出血首选的检查是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"头颅CT","B":"脑血管造影","C":"经颅多普勒超声","D":"头颅MRI"},"a":"A","e":"头颅CT是确诊脑出血的首选检查，可快速显示高密度出血灶。"},{"i":"2023_04_single_19","t":"single","s":"脑栓塞最常见的栓子来源是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"癌栓","B":"菌栓","C":"脂肪栓","D":"房颤附壁血栓"},"a":"D","e":"脑栓塞栓子中心脏内附壁血栓（尤其房颤时）最常见，占心源性栓子的大多数。"},{"i":"2023_04_single_20","t":"single","s":"患者，女性，30岁，主因\"车祸致颅脑损伤半小时\"来诊，急诊行颅内血肿清除术。术后8h护士发现患者的引流液颜色变深，呈鲜红色，引流量较前增加。患者最可能出现的问题是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"脑室感染","B":"脑脊液漏","C":"颅内活动性出血","D":"脑水肿"},"a":"C","e":"术后引流液颜色突然变鲜红、量增加提示颅内活动性出血，需立即报告医生。"},{"i":"2023_04_single_21","t":"single","s":"下列指标中，提示成人烧伤患者液体复苏有效的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"尿量17ml/h","B":"脉率92次/分","C":"收缩压86mmHg","D":"中心静脉压3cmH₂O"},"a":"B","e":"烧伤液体复苏有效指标：尿量>30ml/h，收缩压>90mmHg，脉率<120次/分，CVP 5~12cmH₂O。脉率92次/分在有效范围内。"},{"i":"2023_04_single_22","t":"single","s":"患者，男性，26岁，因左上肢烧伤急诊就医。烧伤处局部肿胀，表皮棕黄色，间或有较大水疱，感觉迟钝，拔毛痛，温度较低。该患者的烧伤深度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"一度烧伤","B":"浅二度烧伤","C":"深二度烧伤","D":"三度烧伤"},"a":"C","e":"教材明确记载深二度烧伤表现为局部肿胀，表皮较白或棕黄，间或有较大水疱，感觉迟钝，温度较低，拔毛痛。"},{"i":"2023_04_single_23","t":"single","s":"急产对母体的影响一般不包括","c":"妇产科急症患者的护理","sc":1,"o":{"A":"子宫破裂","B":"腹腔内大出血","C":"软产道撕裂","D":"子宫肌纤维缩复不良"},"a":"B","e":"教材记载急产对母体的影响包括软产道撕裂、子宫收缩不良产后出血等，过强宫缩可致子宫破裂；腹腔内大出血不是急产的典型母体影响。"},{"i":"2023_04_single_24","t":"single","s":"急产儿肌注维生素K₁是为了预防","c":"妇产科急症患者的护理","sc":1,"o":{"A":"维生素缺乏","B":"佝偻病","C":"新生儿感染","D":"颅内出血"},"a":"D","e":"教材明确记载急产儿按高危儿加强护理，肌注维生素K₁，以预防新生儿颅内出血。"},{"i":"2023_04_single_25","t":"single","s":"患者，女性，53岁，主因\"右眼胀痛，恶心呕吐，视物模糊3小时\"来诊，诊断为急性闭角型青光眼。患者既往有哮喘病史，因此降眼压时禁用","c":"眼科急症患者的护理","sc":1,"o":{"A":"β-肾上腺素受体阻滞剂","B":"缩瞳剂","C":"碳酸酐酶抑制剂","D":"高渗剂"},"a":"A","e":"β-肾上腺素受体阻滞剂（如噻吗洛尔）可诱发支气管痉挛，哮喘患者禁用。"},{"i":"2023_04_single_26","t":"single","s":"下列关于鼻骨骨折的急救护理措施中，正确的是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"持续冰敷72小时","B":"用力按压鼻背部止血","C":"擤鼻以尽快排出鼻腔血液","D":"肿胀消退后复位"},"a":"D","e":"鼻骨骨折复位应待局部肿胀消退后进行，以免影响复位效果。早期冷敷但不应持续72小时，禁止用力按压和擤鼻。"},{"i":"2023_04_single_27","t":"single","s":"下列因素中不易引起中暑的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"甲状腺功能减低","B":"高湿度","C":"高热辐射","D":"过度肥胖"},"a":"A","e":"甲状腺功能减退患者代谢率低、产热少，不易中暑；高湿度、高热辐射、过度肥胖均为中暑易感因素。"},{"i":"2023_04_single_28","t":"single","s":"下列临床表现提示为轻度冻僵的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"寒战","B":"昏迷","C":"关节僵硬","D":"心搏停止"},"a":"A","e":"轻度冻僵时机体通过寒战增加产热；昏迷、关节僵硬为中度冻僵表现，心搏停止为严重冻僵表现。"},{"i":"2023_04_single_29","t":"single","s":"关于有机磷农药中毒患者的急救护理措施，描述正确的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"尽快用热水冲洗染毒皮肤","B":"首次洗胃需彻底","C":"中毒超过6小时者禁止洗胃","D":"鼓励患者洗胃后尽早进食"},"a":"B","e":"有机磷中毒首次洗胃需彻底，以彻底清除胃内毒物。禁用热水冲洗（可加速毒物吸收）；中毒超过6h仍应洗胃；洗胃后应禁食。"},{"i":"2023_04_single_30","t":"single","s":"有机磷农药中毒患者的临床表现中，属于烟碱样症状的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"瞳孔缩小","B":"视物模糊","C":"四肢肌束颤动","D":"腺体分泌亢进"},"a":"C","e":"烟碱样（N样）症状表现为肌束颤动、牙关紧闭、抽搐等；瞳孔缩小、视物模糊、腺体分泌亢进为毒蕈碱样（M样）症状。"},{"i":"2023_04_multi_31","t":"multi","s":"慢性心衰患者出现下列表现，提示可能出现了洋地黄中毒的有","c":"心血管系统急症患者的护理","sc":2,"o":{"A":"室性期前收缩","B":"视觉异常","C":"呼吸困难","D":"尿比重降低","E":"恶心、呕吐"},"a":"ABE","e":"洋地黄中毒表现：①胃肠道症状（厌食、恶心、呕吐）；②心脏表现（各类心律失常，以室性期前收缩最常见）；③神经精神症状（视觉异常、定向力障碍等）。呼吸困难和尿比重降低不是洋地黄中毒的典型表现。"},{"i":"2023_04_multi_32","t":"multi","s":"急性胰腺炎减少胰酶分泌的治疗措施包括","c":"消化系统急症患者的护理","sc":2,"o":{"A":"禁食","B":"胃肠减压","C":"哌替啶治疗","D":"生长抑素治疗","E":"奥美拉唑治疗"},"a":"ABD","e":"禁食和胃肠减压可减少胃酸和食物刺激胰液分泌；生长抑素（如奥曲肽）可抑制胰液分泌。哌替啶为镇痛药，奥美拉唑为抑酸药，均不直接减少胰酶分泌。"},{"i":"2023_04_multi_33","t":"multi","s":"甲状腺危象患者血液甲状腺功能指标中，明显增高的包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"总T₃","B":"游离T₃","C":"总T₄","D":"游离T₄","E":"TSH"},"a":"ABCD","e":"甲状腺危象时血浆总T₃、总T₄、游离T₃、游离T₄明显增高，TSH降低。"},{"i":"2023_04_multi_34","t":"multi","s":"符合癫痫患者强直阵挛发作表现的有","c":"神经系统急症患者的护理","sc":2,"o":{"A":"意识丧失","B":"跌倒","C":"全身骨骼肌持续收缩","D":"呼吸停止","E":"唾液及其他分泌物减少"},"a":"ABCD","e":"强直阵挛发作表现为意识突然丧失、跌倒、全身骨骼肌持续收缩（强直期）、呼吸暂停、发绀；发作时唾液及其他分泌物增多而非减少。"},{"i":"2023_04_multi_35","t":"multi","s":"热射病\"三联征\"的典型表现有","c":"物理与环境因素所致的急症患者的护理","sc":2,"o":{"A":"肌痉挛","B":"意识障碍","C":"高热","D":"恶心呕吐","E":"无汗"},"a":"BCE","e":"教材明确记载热射病典型表现为高热、无汗、意识障碍三联征。肌痉挛为热痉挛表现。"},{"i":"2023_04_short_36","t":"short","s":"简述急危重症患者转运前安全性评估的基本内容。","c":"绪论","sc":5,"at":"参考答案（要点）：①气道是否通畅，有无气管插管/切开；②呼吸状况：呼吸频率、节律、血氧饱和度、呼吸机参数；③循环状况：血压、心率、心律、末梢循环、输液通路；④意识状态、瞳孔变化；⑤各引流管固定是否通畅；⑥用药情况及生命体征趋势；⑦转运设备与药物准备是否齐全。","e":""},{"i":"2023_04_short_37","t":"short","s":"简述昏迷患者病情危重的指征。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：①深度昏迷，对各种刺激无反应；②瞳孔散大或不等大、对光反射消失；③呼吸不规则或呼吸暂停；④血压下降、休克；⑤心率缓慢或心律失常；⑥腱反射消失、病理反射引出；⑦出现脑疝体征。","e":""},{"i":"2023_04_short_38","t":"short","s":"简述全身炎症反应综合征（SIRS）的判断指标。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：SIRS诊断标准具备以下两项或两项以上：①体温>38℃或<36℃；②心率>90次/分；③呼吸频率>20次/分或PaCO₂<32mmHg；④白细胞计数>12×10⁹/L或<4×10⁹/L，或未成熟粒细胞>10%。","e":""},{"i":"2023_04_short_39","t":"short","s":"简述急性会厌炎急救时行气管切开的指征。","c":"耳鼻喉科急症患者的护理","sc":5,"at":"参考答案（要点）：①起病急骤，病情迅速进展；②明显呼吸困难，三凹征明显；③咽喉部严重肿胀，会厌明显红肿；④经药物治疗后呼吸困难无改善或加重；⑤出现烦躁不安、发绀、意识障碍等缺氧表现。","e":""},{"i":"2023_04_essay_40","t":"essay","s":"试述糖尿病酮症酸中毒常见并发症的预防与处理。","c":"内分泌系统急症患者的护理","sc":10,"at":"参考答案（要点）：①低血糖：预防——补液速度先快后慢，胰岛素剂量个体化，每1~2h监测血糖；处理——一旦出现低血糖症状立即口服或静脉补糖。②低钾血症：预防——见尿补钾，监测血钾和心电图；处理——根据血钾水平口服或静脉补钾。③低血容量性休克/心力衰竭：预防——精确记录出入量，控制补液速度；处理——休克时加快补液，心衰时减慢速度并遵医嘱利尿、强心。④脑水肿：预防——避免血糖下降过快，避免血渗透压快速下降；处理——遵医嘱使用脱水剂。⑤感染：预防——严格无菌操作，加强口腔和皮肤护理；处理——遵医嘱使用抗生素。","e":""},{"i":"2023_04_case_41","t":"case","s":"患者，女性，65岁，因疲乏、心前区疼痛不适1周，由女儿陪同就诊。既往有\"三度房室传导阻滞\"病史。请写出：（1）急诊护士分诊评估的内容；（2）四级病情分级标准及该患者的病情分类。","c":"急诊分诊","sc":15,"at":"参考答案（要点）：（1）分诊评估内容：①收集主观资料（主诉、现病史、既往史）；②客观评估（生命体征、意识、瞳孔、心肺听诊、心电图）；③判断病情急重危程度；④决定就诊顺序和科室。（2）四级病情分级：Ⅰ级（急危症）——立即救治；Ⅱ级（急重症）——10分钟内处置；Ⅲ级（急症）——30分钟内处置；Ⅳ级（非急症）——可等待就诊。该患者有三度房室传导阻滞病史，伴心前区疼痛，属高危患者，至少为Ⅱ级（急重症），需立即心电监护并尽快就诊。","e":""},{"i":"2023_04_case_42","t":"case","s":"患者，男性，56岁，高血压病史15年，未规律诊治，血压维持在160/100mmHg。2小时前与家人争吵后突然出现头痛、言语不利、继而倒地、呼之不应、二便失禁，由家人送至急诊。查体：T36.6℃，P88次/分，R20次/分，血压180/110mmHg，昏迷，双侧瞳孔等大，颈软，巴宾斯基征阳性。急查头颅CT示右侧基底节区高密度影，边界清楚。医嘱给予静脉滴注甘露醇脱水、硝普钠降压治疗。请写出：（1）该患者最可能的卒中类型及判断依据；（2）目前该患者的急救护理要点。","c":"神经系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）最可能为脑出血（基底节区出血）。判断依据：①高血压病史15年；②情绪激动后急性起病；③头痛、言语不利、迅速昏迷；④血压显著升高180/110mmHg；⑤巴宾斯基征阳性；⑥头颅CT示右侧基底节区高密度影。（2）急救护理要点：①绝对卧床，抬高床头15°~30°，减少搬动；②保持呼吸道通畅，头偏向一侧，吸氧；③快速建立静脉通路，遵医嘱输注甘露醇脱水降颅压；④遵医嘱使用硝普钠控制性降压，监测血压；⑤心电监护，监测生命体征、瞳孔、意识变化；⑥观察有无脑疝先兆；⑦做好口腔、皮肤护理，预防并发症；⑧心理护理。","e":""}]},{"key":"2023_10","name":"2023年10月","qs":[{"i":"2023_10_single_1","t":"single","s":"急诊患者的心理特点一般不包括","c":"急诊分诊","sc":1,"o":{"A":"恐惧感","B":"优先感","C":"熟悉感","D":"无助感"},"a":"C","e":"急诊患者常见心理特点包括恐惧感、优先感、无助感、抑郁等，不包括熟悉感。"},{"i":"2023_10_single_2","t":"single","s":"急诊分诊的重点是","c":"急诊分诊","sc":1,"o":{"A":"识别主要症状和体征","B":"病情分诊和学科分诊","C":"快速启动呼救和抢救","D":"节约急诊资源"},"a":"B","e":"急诊分诊的重点是病情分诊和学科分诊，即判断病情轻重缓急和所属科室。"},{"i":"2023_10_single_3","t":"single","s":"吸气时出现\"三凹征\"、同时伴有高调吸气性哮鸣音见于","c":"常见急性症状的评估","sc":1,"o":{"A":"急性支气管炎","B":"支气管哮喘","C":"上呼吸道异物","D":"严重肺部感染"},"a":"C","e":"教材记载吸气性呼吸困难表现为三凹征伴高调吸气性哮鸣音，为上气道狭窄或梗阻特征，见于上呼吸道异物等。"},{"i":"2023_10_single_4","t":"single","s":"患者，男性，58岁，主诉胸痛2小时就诊。疼痛程度剧烈，呈烧灼样，沿左侧背部及腋下7～8肋间走行，局部皮肤感觉过敏，可见大小不等成群水疱，呈带状分布。该患者胸痛的可能病因是","c":"常见急性症状的评估","sc":1,"o":{"A":"冠心病","B":"胸膜炎","C":"带状疱疹","D":"主动脉夹层动脉瘤"},"a":"C","e":"烧灼样胸痛沿肋间神经分布，局部皮肤感觉过敏伴成簇水疱呈带状分布，为带状疱疹的典型表现。"},{"i":"2023_10_single_5","t":"single","s":"关于心肺复苏人工通气的操作，正确的是","c":"心肺复苏","sc":1,"o":{"A":"通气量600～800ml/次","B":"吹气时间要＜1秒","C":"抢救者应深吸气后吹气","D":"应保证胸廓有起伏"},"a":"D","e":"人工通气应保证胸廓有起伏；通气量约500~600ml/次，吹气时间>1秒，抢救者不必深吸气。"},{"i":"2023_10_single_6","t":"single","s":"下列关于成人胸外按压方法，错误的是","c":"心肺复苏","sc":1,"o":{"A":"手掌根置于两乳头连线与胸骨交界处","B":"按压的双臂伸直，肩肘腕处于同一轴线","C":"按压与放松时间比为1∶1","D":"按压深度＞6cm"},"a":"D","e":"成人胸外按压深度为5~6cm，不是>6cm；按压频率100~120次/分，按压与放松时间比1:1。"},{"i":"2023_10_single_7","t":"single","s":"下列最可能出现代谢性酸中毒的是","c":"危重症患者的护理","sc":1,"o":{"A":"血糖22.9mmol/L的糖尿病患者","B":"大量呕吐的急性胃肠炎患者","C":"应用呋塞米利尿的水肿患者","D":"焦虑的库欣综合征患者"},"a":"A","e":"血糖显著升高的糖尿病患者易发生糖尿病酮症酸中毒，导致代谢性酸中毒。大量呕吐导致代谢性碱中毒。"},{"i":"2023_10_single_8","t":"single","s":"高钾血症时使用10%葡萄糖酸钙缓慢静脉注射的最主要目的是","c":"危重症患者的护理","sc":1,"o":{"A":"促进钾的排出","B":"促进钾离子转入细胞内","C":"补充机体能量供应","D":"缓解钾对心肌的毒性作用"},"a":"D","e":"葡萄糖酸钙可对抗钾对心肌的毒性作用，稳定心肌细胞膜，为高钾血症急救的首要措施。"},{"i":"2023_10_single_9","t":"single","s":"下列各种病因中可引发高钙血症的是","c":"危重症患者的护理","sc":1,"o":{"A":"克罗恩病","B":"急性胰腺炎","C":"甲状旁腺功能减退","D":"维生素D口服过量"},"a":"D","e":"维生素D过量可促进肠道钙吸收，导致高钙血症。甲状旁腺功能减退导致低钙血症。"},{"i":"2023_10_single_10","t":"single","s":"为中毒患者洗胃时，洗胃液的温度应控制在","c":"急救技术","sc":1,"o":{"A":"22～26℃","B":"27～31℃","C":"32～36℃","D":"37～40℃"},"a":"C","e":"教材明确记载洗胃液温度控制在32~36℃。温度过低刺激肠蠕动导致肠痉挛，过高加速毒物吸收。"},{"i":"2023_10_single_11","t":"single","s":"下列措施中，主要用于防止急性肺血栓栓塞症患者血液淤滞的是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"适当增加液体摄入","B":"积极治疗高脂血症","C":"遵医嘱使用抗凝剂","D":"穿加压弹力抗栓袜"},"a":"D","e":"穿加压弹力抗栓袜可促进静脉回流，防止血液淤滞。增加液体摄入和抗凝剂主要针对高凝状态，治疗高脂血症针对血管壁因素。"},{"i":"2023_10_single_12","t":"single","s":"由迷走神经高张力状态所致的心律失常一般不包括","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"心房颤动","B":"心脏停搏","C":"窦性心动过缓","D":"二度Ⅰ型房室传导阻滞"},"a":"A","e":"迷走神经高张力可致窦性心动过缓、房室传导阻滞、心脏停搏；心房颤动多与交感神经兴奋或心房异位兴奋灶有关。"},{"i":"2023_10_single_13","t":"single","s":"消化道出血患者出现头晕、心慌，但血压仍在正常范围，常提示其出血量约","c":"消化系统急症患者的护理","sc":1,"o":{"A":"50ml～100ml","B":"200ml～400ml","C":"400ml～600ml","D":"＞1000ml"},"a":"C","e":"出血量>400~500ml时出现头晕、心慌等全身症状，但血压可正常；>1000ml时出现周围循环衰竭、血压下降。"},{"i":"2023_10_single_14","t":"single","s":"Grey-Turner征主要见于","c":"消化系统急症患者的护理","sc":1,"o":{"A":"重症胰腺炎","B":"绞窄性肠梗阻","C":"上消化道大量出血","D":"血小板减少性紫癜"},"a":"A","e":"教材明确记载少数重型胰腺炎患者，胰液沿组织间隙到达皮下，导致腰部前下腹壁皮肤青紫，称为Grey-Turner征。"},{"i":"2023_10_single_15","t":"single","s":"尿石症患者疼痛时适宜采取的体位是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"头低脚高位","B":"俯卧位","C":"膀胱截石位","D":"屈膝侧卧位"},"a":"D","e":"屈膝侧卧位可放松腹部肌肉、减轻腹壁张力，缓解肾绞痛。"},{"i":"2023_10_single_16","t":"single","s":"尿道结石的典型症状是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"血尿","B":"尿频","C":"点滴状排尿","D":"排尿突然中断"},"a":"C","e":"尿道结石典型表现为点滴状排尿、排尿困难伴尿痛。排尿突然中断为膀胱结石典型表现。"},{"i":"2023_10_single_17","t":"single","s":"典型膀胱刺激症状不包括","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"血尿","B":"尿频","C":"尿急","D":"尿痛"},"a":"A","e":"膀胱刺激征包括尿频、尿急、尿痛，不包括血尿。"},{"i":"2023_10_single_18","t":"single","s":"非糖尿病患者低血糖的诊断标准为血糖水平低于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"1.1mmol/L","B":"2.2mmol/L","C":"2.8mmol/L","D":"3.9mmol/L"},"a":"C","e":"教材明确记载Whipple三联征：发作时血糖低于2.8mmol/L，伴低血糖症状，供糖后缓解。"},{"i":"2023_10_single_19","t":"single","s":"甲亢危象降温治疗中禁用","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"降温毯","B":"氯丙嗪","C":"水杨酸类解热药","D":"冰袋"},"a":"C","e":"水杨酸类药物可竞争甲状腺激素结合蛋白，使游离甲状腺激素增多，加重甲亢危象，故禁用。"},{"i":"2023_10_single_20","t":"single","s":"某癫痫患者于行走时突然停步、发呆，手中物体落地，呼之不应，数秒后恢复，对刚才的过程不能回忆，该患者的癫痫发作类型为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"失张力发作","B":"失神发作","C":"局灶性发作","D":"强直阵挛发作"},"a":"B","e":"失神发作典型表现为突然意识丧失、动作中断、凝视，持续数秒后恢复，事后不能回忆。"},{"i":"2023_10_single_21","t":"single","s":"腹部损伤中实质性脏器破裂的主要临床表现为","c":"损伤急症患者的护理","sc":1,"o":{"A":"内出血","B":"腹部压痛","C":"腹肌紧张","D":"反跳痛"},"a":"A","e":"实质性脏器（肝、脾等）破裂主要表现为内出血；腹膜刺激征（压痛、反跳痛、肌紧张）为空腔脏器破裂表现。"},{"i":"2023_10_single_22","t":"single","s":"某患者前臂被开水烫伤，局部红肿明显，有大小不一的水疱，疼痛剧烈。该患者的烧伤深度是","c":"损伤急症患者的护理","sc":1,"o":{"A":"一度","B":"浅二度","C":"深二度","D":"三度"},"a":"B","e":"浅二度烧伤表现为局部红肿明显，大小不一的水疱形成，内含淡黄色澄清液体，疼痛剧烈。"},{"i":"2023_10_single_23","t":"single","s":"治疗蛇咬伤的首选特效药是","c":"损伤急症患者的护理","sc":1,"o":{"A":"抗蛇毒血清","B":"蛇药片","C":"3%硼酸","D":"33%硫酸镁"},"a":"A","e":"抗蛇毒血清是治疗蛇咬伤的首选特效药，可中和游离蛇毒。"},{"i":"2023_10_single_24","t":"single","s":"按照狂犬病暴露程度分级，完好的皮肤被患畜舔舐的暴露程度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"0级","B":"Ⅰ级","C":"Ⅱ级","D":"Ⅲ级"},"a":"B","e":"I级暴露为接触或喂养动物，完好的皮肤被舔；II级为裸露皮肤被轻咬或无出血轻微抓伤；III级为单处或多处贯穿性咬伤。"},{"i":"2023_10_single_25","t":"single","s":"急产的总产程不超过","c":"妇产科急症患者的护理","sc":1,"o":{"A":"3小时","B":"5小时","C":"10小时","D":"12小时"},"a":"A","e":"教材明确记载急产指总产程不超过3小时的异常分娩。"},{"i":"2023_10_single_26","t":"single","s":"急性闭角型青光眼患者使用β-肾上腺素受体阻滞剂后出现何种情况时需要停药？","c":"眼科急症患者的护理","sc":1,"o":{"A":"体温36.1℃","B":"脉率55次/分","C":"呼吸22次/分","D":"脉搏血氧饱和度95%"},"a":"B","e":"β-受体阻滞剂可减慢心率，脉率低于60次/分（尤其<55次/分）时需停药或减量，以防心动过缓。"},{"i":"2023_10_single_27","t":"single","s":"急性喉炎喉阻塞患儿，安静时无呼吸困难，哭闹时有轻度吸气性呼吸困难。该患儿的病情程度为","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"Ⅰ度","B":"Ⅱ度","C":"Ⅲ度","D":"Ⅳ度"},"a":"A","e":"I度喉阻塞：安静时无呼吸困难，活动或哭闹时有轻度吸气性呼吸困难。"},{"i":"2023_10_single_28","t":"single","s":"关于高压电引起的损伤，描述正确的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"口大底小，外浅内深","B":"口小底大，外浅内深","C":"口大底小，外深内浅","D":"口小底大，外深内浅"},"a":"B","e":"高压电烧伤特点为口小底大、外浅内深，入口处小而深部组织损伤广泛。"},{"i":"2023_10_single_29","t":"single","s":"有机磷农药中毒患者阿托品化的表现不包括","c":"急性中毒患者的护理","sc":1,"o":{"A":"颜面潮红","B":"皮肤干燥","C":"心率加快","D":"谵妄"},"a":"D","e":"阿托品化表现为瞳孔散大、口干、皮肤干燥、颜面潮红、心率加快。谵妄为阿托品中毒表现。"},{"i":"2023_10_single_30","t":"single","s":"有机磷农药中毒的发病机制是","c":"急性中毒患者的护理","sc":1,"o":{"A":"乙酰胆碱数量减少","B":"乙酰胆碱酯酶活力受抑制","C":"中枢神经系统受抑制","D":"交感神经受抑制"},"a":"B","e":"有机磷农药抑制胆碱酯酶活力，使乙酰胆碱在体内大量蓄积，引起中毒症状。"},{"i":"2023_10_multi_31","t":"multi","s":"Glasgow昏迷量表主要的评估内容包括","c":"常见急性症状的评估","sc":2,"o":{"A":"睁眼反应","B":"瞳孔反射","C":"语言对答","D":"情绪反应","E":"运动反应"},"a":"ACE","e":"GCS评估内容包括睁眼反应（E）、语言对答（V）、运动反应（M）三项，不包括瞳孔反射和情绪反应。"},{"i":"2023_10_multi_32","t":"multi","s":"环甲膜穿刺术的适应证包括","c":"急救技术","sc":2,"o":{"A":"急性上呼吸道梗阻","B":"全麻手术","C":"喉源性呼吸困难","D":"头面部严重外伤","E":"无法气管插管但需尽快开放气道者"},"a":"ACDE","e":"教材记载环甲膜穿刺适应证：①急性上呼吸道梗阻；②喉源性呼吸困难（如白喉、喉头水肿）；③头面部严重外伤；④气管插管有禁忌证或病情紧急来不及气管插管需尽快开放气道时。全麻手术不是其适应证。"},{"i":"2023_10_multi_33","t":"multi","s":"糖尿病酮症酸中毒患者血液检查的主要改变包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"血糖升高","B":"血酮体升高","C":"血pH值降低","D":"血钾降低","E":"血尿素氮降低"},"a":"ABC","e":"DKA典型血液改变：血糖升高（16.7~33.3mmol/L）、血酮体升高（>4.8mmol/L）、血pH降低（<7.35）。血钾初期可正常或偏高，治疗后降低；血尿素氮常升高而非降低。"},{"i":"2023_10_multi_34","t":"multi","s":"下列各项观察指标，提示成人烧伤患者液体复苏有效的是","c":"损伤急症患者的护理","sc":2,"o":{"A":"尿量22ml/h","B":"烦躁不安","C":"脉率103次/分","D":"血压96/57mmHg","E":"中心静脉压7cmH₂O"},"a":"CDE","e":"有效指标：尿量>30ml/h、脉率<120次/分、收缩压>90mmHg、CVP 5~12cmH₂O。A尿量22ml/h不足，B烦躁不安提示脑灌注不足。"},{"i":"2023_10_multi_35","t":"multi","s":"正常子宫收缩的特点包括","c":"妇产科急症患者的护理","sc":2,"o":{"A":"节律性","B":"持续性","C":"剧烈性","D":"对称性","E":"极性"},"a":"ADE","e":"正常子宫收缩具有节律性、对称性和极性三个特点。"},{"i":"2023_10_short_36","t":"short","s":"简述灾难医学的主要任务。","c":"绪论","sc":5,"at":"参考答案（要点）：①研究自然和人为灾难的发生规律及对人体健康的危害；②实施灾难现场的医学救援，包括现场急救、伤病员分拣与转运；③灾难后的卫生防疫与疾病控制；④灾难医学的组织管理与教育培训；⑤开展灾难医学的科学研究。","e":""},{"i":"2023_10_short_37","t":"short","s":"简述休克急救中使用血管活性药的注意事项。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：①从低浓度、慢速度开始，根据血压调整滴速；②开始用药时每5~10分钟测一次血压，稳定后按规定监测；③避免药物外渗，防止局部组织坏死；④小剂量、低浓度开始，逐次加量；⑤停药时逐渐减量，不可骤停；⑥注意保暖，防止低血压。","e":""},{"i":"2023_10_short_38","t":"short","s":"简述心律失常患者病情危重的指标。","c":"心血管系统急症患者的护理","sc":5,"at":"参考答案（要点）：①频发多源性室性期前收缩、R-on-T现象；②室性心动过速；③心室颤动；④三度房室传导阻滞；⑤心率<40次/分或>160次/分；⑥伴低血压、休克、晕厥、心绞痛等症状。","e":""},{"i":"2023_10_short_39","t":"short","s":"简述上尿路结石的临床表现。","c":"泌尿系统急症患者的护理","sc":5,"at":"参考答案（要点）：①疼痛：肾区疼痛伴肋脊角叩痛，活动后或可诱发的肾绞痛，呈阵发性剧烈难忍；②血尿：可为镜下或肉眼血尿；③恶心、呕吐：输尿管梗阻时；④膀胱刺激症状：结石伴感染或输尿管膀胱壁段结石时；⑤并发症表现：继发急性肾盂肾炎或肾积脓时可有发热、寒战等。","e":""},{"i":"2023_10_essay_40","t":"essay","s":"试述急诊分诊的感染控制流程。","c":"急诊分诊","sc":10,"at":"参考答案（要点）：①预检分诊处识别感染高危患者：询问发热、呼吸道症状、流行病学史等；②对疑似传染病患者立即引导至隔离诊室或隔离区域，避免与其他患者接触；③根据传播途径采取相应隔离：飞沫传播、空气传播、接触传播隔离；④医务人员做好个人防护：口罩、手套、隔离衣、手卫生；⑤环境消毒：诊疗区域定时通风、消毒，医疗器械按规范处理；⑥正确转运患者：转运时做好防护，告知接收科室；⑦医疗废物按规范分类处理。","e":""},{"i":"2023_10_case_41","t":"case","s":"某老年女性清晨在公园散步时突然倒地，意识丧失，叹气样呼吸。护士小张下夜班经过，目睹此场景。请写出：（1）该患者最可能出现的健康问题及判断依据；（2）针对该患者情况，小张应立即采取的急救措施。","c":"心肺复苏","sc":15,"at":"参考答案（要点）：（1）最可能为心搏骤停。判断依据：①突然倒地、意识丧失；②叹气样呼吸（濒死呼吸）；③老年患者，清晨为心血管事件高发时段。（2）立即采取的急救措施：①轻拍呼喊判断意识；②检查呼吸和脉搏（5~10秒）；③立即呼救，拨打120，取AED；④摆放仰卧位，开始胸外按压（两乳头连线中点，深度5~6cm，频率100~120次/分）；③按压30次后开放气道，人工呼吸2次；⑥持续CPR直至AED到达或专业急救人员接手；⑦AED到达后按提示分析心律并除颤。","e":""},{"i":"2023_10_case_42","t":"case","s":"患者，男性，56岁，科研工作者，主因\"头痛、言语不利伴意识障碍1小时\"急诊入院。患者近2个月忙于课题攻关，于加班时突然出现头痛、言语不利，随即倒地、伴小便失禁。查体：T36.7℃，P110次/分，R25次/分，血压185/110mmHg。昏迷，两侧瞳孔等大，颈软，右侧巴宾斯基征阳性。临床考虑\"脑卒中\"，急诊给予静脉滴注甘露醇脱水、硝普钠降压治疗。请写出：（1）为明确该患者卒中类型首选的检查；（2）静脉滴注甘露醇和硝普钠的用药护理。","c":"神经系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）首选检查：头颅CT平扫，可快速区分脑出血（高密度灶）与脑梗死（低密度灶）。（2）甘露醇用药护理：①选用较粗静脉，确保针头在血管内；②快速滴注（15~30分钟内输完250ml）；③观察有无液体外渗，防止组织坏死；④监测尿量、肾功能、电解质；⑤注意观察有无颅内压反跳。硝普钠用药护理：①现配现用，避光输注；②使用输液泵精确控制滴速；③开始时每5~10分钟测一次血压，根据血压调整；④连续使用不超过24~48小时，防止氰化物中毒；⑤监测血压变化，避免降压过快过低。","e":""}]},{"key":"2024_04","name":"2024年4月","qs":[{"i":"2024_04_single_1","t":"single","s":"急诊患者就诊过程中常常会产生优先感，其原因可能是","c":"急诊分诊","sc":1,"o":{"A":"拥挤嘈杂的环境导致","B":"认为自己病情最重","C":"会诊和检查的项目多","D":"等候时间过长"},"a":"B","e":"优先感指许多急诊患者及家属往往认为自己的疾病最重，要优先处理。"},{"i":"2024_04_single_2","t":"single","s":"急诊分诊护士应至少具备的急诊临床护理工作经验年限是","c":"急诊分诊","sc":1,"o":{"A":"2年","B":"3年","C":"4年","D":"5年"},"a":"B","e":"急诊分诊护士应当具有3年以上急诊临床护理工作经验。"},{"i":"2024_04_single_3","t":"single","s":"急诊分诊中对于疑似传染病患者的处理，不正确的是","c":"急诊分诊","sc":1,"o":{"A":"直接转入感染性疾病科","B":"消毒接诊室","C":"直接进入急诊诊治流程","D":"加强患者的宣教"},"a":"C","e":"明确或疑似传染病患者应分诊转入感染性疾病科或隔离就诊室，并采取隔离措施、消毒接诊室及宣教；直接进入急诊诊治流程是普通急诊患者的做法。"},{"i":"2024_04_single_4","t":"single","s":"胸膜炎患者胸痛加剧的常见诱因是","c":"常见急性症状的评估","sc":1,"o":{"A":"咳嗽","B":"情绪激动","C":"劳累","D":"翻身"},"a":"A","e":"胸膜炎、自发性气胸、心包炎的胸痛常因咳嗽或深呼吸而加剧，停止胸廓运动则缓解。"},{"i":"2024_04_single_5","t":"single","s":"患者，男性，34岁，2小时前无明显诱因突然出现腹部疼痛，疼痛位于右侧腰部，沿输尿管向下放射至会阴部。患者面色苍白，痛苦不安，伴大汗。尿常规示红细胞满视野。该患者腹痛最可能的病因是","c":"常见急性症状的评估","sc":1,"o":{"A":"急性阑尾炎","B":"急性胆囊炎","C":"泌尿系结石","D":"急性胰腺炎"},"a":"C","e":"肾、输尿管结石表现为腰部绞痛沿输尿管向下放射至会阴部，伴血尿，患者痛苦不安、面色苍白、大汗。"},{"i":"2024_04_single_7","t":"single","s":"直接参与机体酸碱平衡调节的组织或器官不包括","c":"危重症患者的护理","sc":1,"o":{"A":"肺脏","B":"血液","C":"肾脏","D":"肝脏"},"a":"D","e":"机体通过肺、肾和血液缓冲系统维持酸碱平衡，肝脏不直接参与酸碱平衡调节。"},{"i":"2024_04_single_8","t":"single","s":"血清钾浓度的正常值为","c":"危重症患者的护理","sc":1,"o":{"A":"1.4～3.4mmol/L","B":"3.5～5.5mmol/L","C":"5.6～7.6mmol/L","D":"7.7～9.7mmol/L"},"a":"B","e":"血清钾正常值为3.5~5.5mmol/L。"},{"i":"2024_04_single_9","t":"single","s":"死亡率最高的休克类型是","c":"危重症患者的护理","sc":1,"o":{"A":"低血容量性休克","B":"心源性休克","C":"梗阻性休克","D":"分布性休克"},"a":"B","e":"心源性休克在4种类型休克中死亡率最高，死亡率为75%。"},{"i":"2024_04_single_10","t":"single","s":"胸外心脏非同步直流电除颤时，双相波除颤仪的除颤电量一般选择","c":"急救技术","sc":1,"o":{"A":"100J","B":"150J","C":"200J","D":"250J"},"a":"C","e":"胸外心脏非同步直流电除颤时，单向波除颤仪选择360J，双相波除颤仪选择200J。"},{"i":"2024_04_single_11","t":"single","s":"使用止血带止血时，扎止血带的时间一般应小于","c":"急救技术","sc":1,"o":{"A":"15min","B":"30min","C":"1h","D":"4h"},"a":"C","e":"扎止血带时间一般<1h为宜，必须延长时则应在1h左右放松。"},{"i":"2024_04_single_12","t":"single","s":"海平面静息状态下呼吸空气时，提示为Ⅱ型呼吸衰竭的动脉血气分析结果是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"PaO₂ 55mmHg，PaCO₂ 30mmHg","B":"PaO₂ 55mmHg，PaCO₂ 40mmHg","C":"PaO₂ 50mmHg，PaCO₂ 45mmHg","D":"PaO₂ 50mmHg，PaCO₂ 60mmHg"},"a":"D","e":"Ⅱ型呼吸衰竭为PaO₂<60mmHg、PaCO₂>50mmHg，D项符合。"},{"i":"2024_04_single_13","t":"single","s":"心力衰竭患者心源性猝死发生率明显增加的左心室射血分数（LVEF）界值是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"55%","B":"45%","C":"35%","D":"25%"},"a":"C","e":"LVEF<35%的患者SCD（心源性猝死）的发生率明显增加。"},{"i":"2024_04_single_14","t":"single","s":"上消化道出血病因诊断的首选方法是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"胃镜检查","B":"X线钡剂造影","C":"选择性动脉造影","D":"放射性核素扫描"},"a":"A","e":"胃镜检查是目前诊断上消化道出血病因的首选方法，诊断正确率达80%~90%。"},{"i":"2024_04_single_16","t":"single","s":"糖尿病酮症酸中毒患者少见但可致命的并发症是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"低血糖","B":"低血钾","C":"代谢性酸中毒","D":"脑水肿"},"a":"D","e":"脑水肿是DKA患者非常少见但可致命的并发症。"},{"i":"2024_04_single_17","t":"single","s":"低血糖昏迷患者升血糖治疗不宜采用","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"静脉注射50%葡萄糖","B":"静脉输注10%葡萄糖液","C":"皮下注射胰高血糖素","D":"口服补充葡萄糖液"},"a":"D","e":"低血糖昏迷患者意识障碍，不能口服补充葡萄糖液，应静脉注射50%葡萄糖或静脉输注10%葡萄糖液，必要时皮下注射胰高血糖素。"},{"i":"2024_04_single_19","t":"single","s":"椎基底动脉系统梗死患者的典型表现为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"失语","B":"眩晕","C":"对侧偏瘫","D":"同向性偏盲"},"a":"B","e":"椎-基底动脉系统（后循环）梗死典型表现为眩晕、恶心、呕吐、眼震、吞咽困难及共济失调等。"},{"i":"2024_04_single_20","t":"single","s":"提示脑卒中患者出现脑疝的典型临床表现是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"头痛","B":"恶心呕吐","C":"呼吸减慢","D":"双侧瞳孔不等大"},"a":"D","e":"患者出现头痛、呕吐、生命体征改变提示颅内压增高有脑疝危险，病情进一步发展出现双侧瞳孔不等大提示发生脑疝。"},{"i":"2024_04_single_21","t":"single","s":"头颅CT发现边界清楚的椭圆形高密度影提示","c":"神经系统急症患者的护理","sc":1,"o":{"A":"脑栓塞","B":"脑血栓形成","C":"脑出血","D":"蛛网膜下腔出血"},"a":"C","e":"脑出血早期血肿在CT上表现为圆形或椭圆形的高密度影、边界清楚。"},{"i":"2024_04_single_22","t":"single","s":"根据新九分法，总面积在10%～29%的二度烧伤，其严重度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"轻度烧伤","B":"中度烧伤","C":"重度烧伤","D":"特重度烧伤"},"a":"B","e":"中度烧伤为总面积在10%~29%的二度烧伤，或面积在9%以下的三度烧伤。"},{"i":"2024_04_single_23","t":"single","s":"决定分娩是否顺利的主要因素不包括","c":"妇产科急症患者的护理","sc":1,"o":{"A":"年龄","B":"产力","C":"产道","D":"胎儿"},"a":"A","e":"产力、产道和胎儿是决定分娩是否顺利的主要因素，年龄不是主要因素。"},{"i":"2024_04_single_24","t":"single","s":"按照损伤部位，眼球穿通伤中最常见的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"角膜穿通伤","B":"角巩膜穿通伤","C":"巩膜穿通伤","D":"眼球壁穿通伤"},"a":"A","e":"眼球穿通伤按损伤部位可分为角膜穿通伤、角巩膜穿通伤、巩膜穿通伤，以角膜穿通伤最为常见。"},{"i":"2024_04_single_25","t":"single","s":"某患者因生石灰溅入右眼3小时来就诊，查体可见右眼角膜缘组织缺血坏死，呈瓷白色混浊，视力严重下降。该患者的病情程度为","c":"眼科急症患者的护理","sc":1,"o":{"A":"轻度损伤","B":"中度损伤","C":"重度损伤","D":"极重度损伤"},"a":"C","e":"重度损伤者角膜缘组织缺血坏死、角膜呈瓷白色混浊、视力严重下降，常见于强碱烧伤。"},{"i":"2024_04_single_26","t":"single","s":"人体最常见的骨折是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"颅骨骨折","B":"鼻骨骨折","C":"颈椎骨折","D":"胫骨骨折"},"a":"B","e":"鼻骨骨折是人体中最为常见的骨折。"},{"i":"2024_04_single_27","t":"single","s":"热射病的三联征表现为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"高热、无汗、意识障碍","B":"低热、无汗、血压下降","C":"高热、大汗、血压下降","D":"低热、大汗、意识障碍"},"a":"A","e":"热射病出现高热、无汗、意识障碍三联征的典型表现。"},{"i":"2024_04_single_28","t":"single","s":"发生冻僵时，机体中心体温应一般低于","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"35℃","B":"34℃","C":"33℃","D":"32℃"},"a":"A","e":"冻僵（意外低体温）是指机体中心体温<35℃并伴有神经和心血管系统损伤为主要表现的严重全身性疾病。"},{"i":"2024_04_single_29","t":"single","s":"CO中毒患者频繁抽搐时首选的治疗药物是","c":"急性中毒患者的护理","sc":1,"o":{"A":"纳洛酮","B":"地高辛","C":"地西泮","D":"阿托品"},"a":"C","e":"CO中毒患者如有频繁抽搐，目前首选药是地西泮，抽搐停止后改为苯妥英钠。"},{"i":"2024_04_single_30","t":"single","s":"急性酒精中毒患者，出现动作笨拙、步态不稳、语无伦次，提示该患者处于","c":"急性中毒患者的护理","sc":1,"o":{"A":"兴奋期","B":"共济失调期","C":"昏睡期","D":"昏迷期"},"a":"B","e":"共济失调期血中乙醇含量100~200mg/dl，患者出现共济失调、动作笨拙、步态不稳、语无伦次。"},{"i":"2024_04_multi_31","t":"multi","s":"使用自动体外除颤器对心搏骤停患者进行除颤时，正确的操作是","c":"心肺复苏","sc":2,"o":{"A":"首先应打开开关","B":"按语音提示贴电极片","C":"自动分析心律时不可中断按压","D":"按下除颤按钮前，应提示大家离开患者","E":"除颤后立即给予5轮CPR"},"a":"ABDE","e":"AED操作：打开开关按语音提示粘贴电极片，停止按压等待自动分析心律，若为可除颤心律按提示除颤（指示大家离开患者、按下除颤按钮），除颤后立即给予5轮CPR。自动分析心律时应停止按压，故C错误。"},{"i":"2024_04_multi_32","t":"multi","s":"下列可导致代谢性碱中毒的病因有","c":"危重症患者的护理","sc":2,"o":{"A":"严重腹泻","B":"大量呕吐","C":"大量使用呋塞米利尿","D":"肾上腺皮质激素过多","E":"呼吸中枢抑制"},"a":"BCD","e":"代谢性碱中毒病因：酸性物质丢失过多（大量呕吐、持续胃肠减压）；应用噻嗪类和髓袢利尿剂（如呋塞米）形成低氯性碱中毒；肾上腺皮质激素过多致低钾性碱中毒；碱性药物摄入过多。严重腹泻致代谢性酸中毒，呼吸中枢抑制致呼吸性酸中毒。"},{"i":"2024_04_multi_33","t":"multi","s":"肠梗阻的典型症状包括","c":"消化系统急症患者的护理","sc":2,"o":{"A":"腹痛","B":"呕吐","C":"腹胀","D":"排便、排气停止","E":"寒战高热"},"a":"ABCD","e":"肠梗阻典型症状为腹痛、呕吐、腹胀、排便排气停止及肠鸣音亢进或消失。"},{"i":"2024_04_multi_35","t":"multi","s":"脑栓塞常见的栓子来源有","c":"神经系统急症患者的护理","sc":2,"o":{"A":"心房附壁血栓","B":"癌栓","C":"下肢静脉血栓","D":"脂肪栓","E":"动脉粥样硬化斑块"},"a":"ABDE","e":"脑栓塞栓子来源：心源性（最常见，如心房纤颤时心房附壁血栓）；非心源性（动脉粥样硬化斑块、脂肪栓、气栓、菌栓、癌栓等）。下肢静脉血栓脱落主要导致肺栓塞。"},{"i":"2024_04_short_36","t":"short","s":"简述稽留热的特点及常见原因。","c":"常见急性症状的评估","sc":5,"at":"参考答案（要点）：①特点：体温持续在39~40℃或更高，可保持数日或数周，体温每日波动在1℃以内。②常见原因：大叶性肺炎、伤寒等。","e":""},{"i":"2024_04_short_37","t":"short","s":"简述高质量胸外按压的标准。","c":"心肺复苏","sc":5,"at":"参考答案（要点）：①按压部位：胸骨下半部（两乳头连线与胸骨交界处）；②按压频率：100~120次/分；③按压深度：5~6cm；④按压与放松时间比1:1，放松时手掌不离开胸壁，每次按压后胸廓充分回弹；⑤按压-通气比为30:2；⑥尽量减少按压中断，胸外按压分数应>60%。","e":""},{"i":"2024_04_short_38","t":"short","s":"简述洋地黄中毒的临床表现及处理。","c":"心血管系统急症患者的护理","sc":5,"at":"参考答案（要点）：临床表现：①心律失常——期前收缩、自主性室性心律失常和传导阻滞；②胃肠道症状——厌食、恶心、呕吐；③神经精神症状——视觉异常、定向力障碍、昏睡及精神错乱。处理：①立即停药是关键；②低钾低镁患者积极补充钾盐和镁盐；③快速室性心律失常可用利多卡因缓慢静脉推注，一般禁忌电复律；④缓慢性心律失常若心室率<40次/分可用阿托品静脉注射，伴血流动力学障碍者可安置临时起搏器。","e":""},{"i":"2024_04_short_39","t":"short","s":"简述癫痫发作的共性特征。","c":"神经系统急症患者的护理","sc":5,"at":"参考答案（要点）：所有癫痫发作都有的共性特征包括发作性、短暂性、重复性、刻板性。①发作性：癫痫突然发生，持续一段时间后迅速恢复，间歇期正常；②短暂性：发作持续时间非常短，通常数秒、数分钟，除癫痫持续状态外很少超过5min；③重复性：癫痫都有反复发作的特征；④刻板性：就某一患者而言，多次发作的临床表现几乎一致。","e":""},{"i":"2024_04_essay_40","t":"essay","s":"试述损伤急救中止血的方法及适应证。","c":"急救技术","sc":10,"at":"参考答案（要点）：①指压法：为止血的短暂应急措施，用手指、手掌或拳头压迫伤口近心端，使动脉压迫闭合于骨骼表面阻断血流，适用于中等或较大动脉出血及较大范围静脉和毛细血管出血。②加压包扎法：适用于四肢、头颈、躯干等体表血管伤时的出血，用无菌纱布覆盖伤口后绷带加压包扎，力量以能止血而肢体远端仍有血液循环为度。③填塞止血法：适用于颈部、臀部或其他较大而深难以包扎的伤口，以及实质性脏器广泛渗血，先将无菌纱布塞入伤口内再用绷带包扎固定。④止血带止血法：适用于腘动脉和肱动脉损伤引起的大出血，用加压包扎或其他方法不能有效止血而有生命危险时采用；上臂大出血扎在上臂上1/3处，前臂或手外伤大出血扎在上臂下1/3处，下肢大出血扎在股骨中下1/3交界处。⑤钳夹止血法：在伤口内用止血钳夹住出血的大血管断端，连止血钳一起包扎在伤口内。","e":""},{"i":"2024_04_case_41","t":"case","s":"某急性心肌梗死患者拟行急诊冠状动脉支架成形术（PCI），在送往导管室途中，患者突然出现双眼凝视、全身抽搐，心电示波如题41图所示（图示为形态、频率、振幅均明显不规则的室颤波形）。请写出：（1）该患者双眼凝视和全身抽搐最可能的原因；（2）现场2名医务人员应立即采取的急救措施。","c":"心肺复苏","sc":15,"at":"参考答案（要点）：（1）该患者双眼凝视和全身抽搐最可能的原因是发生了心室颤动（心搏骤停），心电图示波为形态、频率、振幅均明显不规则的心室颤动波形，因心输出量突然中断导致脑缺血缺氧而出现阿-斯综合征表现（双眼凝视、全身抽搐）。（2）现场2名医务人员应立即采取的急救措施：①立即识别心搏骤停，启动应急反应系统，呼救；②立即进行心肺复苏：按C-A-B程序，先行胸外按压（胸骨下半部，频率100~120次/分，深度5~6cm，按压通气比30:2），两人操作每5个循环交换按压者；③尽早使用AED/除颤仪除颤：心电确认室颤后，双相波选择200J，电极片贴于前-侧位，按下除颤按钮前确认所有人离开患者；④除颤后立即继续5轮（约2分钟）CPR后再评估心律；⑤开放气道、人工通气（球囊面罩通气，每次1s见胸廓起伏）；⑥建立静脉通路，遵医嘱给予肾上腺素、胺碘酮等复苏药物；⑦持续心电监护，记录抢救时间和过程。","e":""},{"i":"2024_04_case_42","t":"case","s":"患者，男性，28岁，消化性溃疡病史3年。今日晨起出现呕吐咖啡色胃内容物，量约400ml，解柏油样大便4次，量约700克，感头晕、大汗，立即被送来医院。体格检查：T 37.8℃ P128次/分 R 24次/分 BP 85/50mmHg，神清合作，面色苍白，皮肤巩膜无黄染，未见肝掌、蜘蛛痣，双肺呼吸音清晰，心界不大，心率128次/分，节律齐，未闻及杂音，腹软，剑突下压痛，无反跳痛，肝、脾未扪及。肠鸣音18次/分，移动性浊音阴性。四肢冷，膝反射正常。实验室检查：血常规Hb 65g/L，WBC 9.0×10⁹/L。请写出：（1）该患者可能出现的消化性溃疡的并发症；（2）针对该患者应立即采取的急救护理措施。","c":"消化系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）该患者可能出现的消化性溃疡并发症：上消化道大出血（呕咖啡样胃内容物、柏油样黑便）并失血性休克（BP 85/50mmHg、P128次/分、四肢冷、面色苍白、Hb 65g/L提示重度贫血）。（2）立即采取的急救护理措施：①体位与休息：绝对卧床休息，取平卧位并将下肢略抬高，呕吐时头偏向一侧防止误吸，保持呼吸道通畅；②迅速建立两条静脉通路，尽快补充血容量：立即交叉配血，快速输注生理盐水或平衡盐液，根据血压、心率、尿量调整输液速度，必要时输全血或红细胞，纠正失血性休克；③吸氧：保持呼吸道通畅，给予氧气吸入；④病情监测：严密监测生命体征（血压、脉搏、呼吸、体温）、神志、尿量、皮肤色泽和温度，观察呕吐物和大便的颜色、性状、量，记录出入量；⑤饮食护理：暂禁食，出血停止后逐步改为温凉流质饮食；⑥用药护理：遵医嘱给予止血药物（如质子泵抑制剂、H₂受体拮抗剂）、生长抑素等，观察药物疗效；⑦做好急诊胃镜检查或手术治疗的准备；⑧心理护理：安抚患者，缓解紧张恐惧情绪。","e":""}]},{"key":"2024_10","name":"2024年10月","qs":[{"i":"2024_10_single_1","t":"single","s":"院前急救理想的半径是","c":"急救医疗服务体系","sc":1,"o":{"A":"1～3km","B":"5～7km","C":"8～10km","D":"11～13km"},"a":"B","e":"急救半径是指急救单位执行院外急救服务所覆盖的区域半径，理想的半径是5~7km。"},{"i":"2024_10_single_2","t":"single","s":"急诊科感染管理中针对医院所有患者和医务人员采取的预防感染措施是","c":"急诊分诊","sc":1,"o":{"A":"标准预防","B":"接触隔离","C":"终末消毒","D":"飞沫隔离"},"a":"A","e":"标准预防基于血液、体液、分泌物、非完整皮肤和黏膜均可能含有感染性因子，是针对医院所有患者和医务人员采取的一组预防感染措施。"},{"i":"2024_10_single_3","t":"single","s":"按照分诊程序，护士对急诊患者完成简单、系统护理评估的时间要求是在患者到达后","c":"急诊分诊","sc":1,"o":{"A":"15min之内","B":"10min之内","C":"5min之内","D":"1min之内"},"a":"C","e":"分诊护士应在患者到达后5分钟内完成简单、系统的护理评估。"},{"i":"2024_10_single_4","t":"single","s":"患者，女性，34岁，主诉发热不适急诊就诊，测体温为38.1℃，其发热程度为","c":"常见急性症状的评估","sc":1,"o":{"A":"低热","B":"中等热","C":"高热","D":"超高热"},"a":"B","e":"中等热为38.1~39.0℃。"},{"i":"2024_10_single_5","t":"single","s":"高级心血管生命支持首选的给药途径是","c":"心肺复苏","sc":1,"o":{"A":"口服给药","B":"气管内给药","C":"骨髓腔给药","D":"静脉给药"},"a":"D","e":"ACLS给药途径首选静脉给药（外周静脉、中心静脉），其次骨髓腔给药，再次气管内给药。"},{"i":"2024_10_single_6","t":"single","s":"心肺复苏时，建立高级气道后的通气频率为","c":"心肺复苏","sc":1,"o":{"A":"10次/分","B":"15次/分","C":"20次/分","D":"25次/分"},"a":"A","e":"建立高级气道后每6s送气一次，即每分钟10次。"},{"i":"2024_10_single_7","t":"single","s":"下列测得的血钠数值中，应报危急值的是","c":"危重症患者的护理","sc":1,"o":{"A":"125mmol/L","B":"145mmol/L","C":"155mmol/L","D":"165mmol/L"},"a":"D","e":"血钠低于120mmol/L或高于160mmol/L为血钠危急值，165mmol/L>160mmol/L。"},{"i":"2024_10_single_8","t":"single","s":"对休克患者病情监测指标的描述，错误的是","c":"危重症患者的护理","sc":1,"o":{"A":"血压是反映休克程度最敏感的指标","B":"皮肤黏膜是体表灌注情况的标志","C":"休克早期脉率加快","D":"尿量是反映肾血流灌注情况的重要指标"},"a":"A","e":"血压并不是反映休克程度最敏感的指标，在代偿期血压可基本正常。脉率、皮肤黏膜、尿量等更敏感。"},{"i":"2024_10_single_9","t":"single","s":"环甲膜穿刺术穿刺针头的留置时间一般不超过","c":"急救技术","sc":1,"o":{"A":"4h","B":"12h","C":"24h","D":"48h"},"a":"C","e":"环甲膜穿刺针头留置时间不宜过长，一般不超过24h。"},{"i":"2024_10_single_10","t":"single","s":"成年女性经口气管导管的插入深度应为","c":"急救技术","sc":1,"o":{"A":"15～18cm","B":"20～22cm","C":"25～28cm","D":"30～32cm"},"a":"B","e":"成人经口插管深度男性22~24cm、女性20~22cm。"},{"i":"2024_10_single_11","t":"single","s":"行气管插管术时患者的体位应为","c":"急救技术","sc":1,"o":{"A":"右侧卧位","B":"左侧卧位","C":"半坐卧位","D":"去枕仰卧位"},"a":"D","e":"气管插管时患者取去枕仰卧位、松解领口、使口咽喉呈一直线。"},{"i":"2024_10_single_12","t":"single","s":"患者，女性，27岁，因车祸伤急诊就诊。查体可见伤口处有暗红色血液缓慢流出，出血量逐渐增多。该患者的出血部位为","c":"急救技术","sc":1,"o":{"A":"内出血","B":"动脉出血","C":"静脉出血","D":"毛细血管出血"},"a":"C","e":"静脉出血为暗红色血液缓慢流出，出血量逐渐增多。"},{"i":"2024_10_single_13","t":"single","s":"患者，女性，59岁，反复咳嗽咳痰11年，伴心悸、气促、下肢水肿2年。本次因受凉后发热、咳嗽加重，咳黄脓痰来急诊救治。入院后护士发现患者性格改变，狂躁易怒，有扑翼样震颤。此时该患者最可能出现的问题是","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"颅内出血","B":"酸中毒","C":"低钾血症","D":"肺性脑病"},"a":"D","e":"COPD患者出现性格改变、狂躁易怒、扑翼样震颤是肺性脑病（CO₂潴留导致神经精神症状）的典型表现。"},{"i":"2024_10_single_14","t":"single","s":"下列心电图所示的心律失常为心房颤动的是（图题：A为窄QRS规则心律；B为宽QRS规则心动过速；C为RR间期绝对不齐、无P波、窄QRS；D为正弦波样室颤波形）","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"图A","B":"图B","C":"图C","D":"图D"},"a":"C","e":"心房颤动心电图特点：P波消失、代之以f波、RR间期绝对不齐、QRS波形态正常。图C符合。"},{"i":"2024_10_single_15","t":"single","s":"主动脉夹层患者降压治疗首选的药物是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"呋塞米","B":"硝普钠","C":"硝酸甘油","D":"β受体阻滞剂"},"a":"B","e":"主动脉夹层降压治疗首选硝普钠，初始剂量0.25μg/(kg·min)，根据需要逐渐增加至10μg/(kg·min)，同时联合β受体阻滞剂控制心率。"},{"i":"2024_10_single_16","t":"single","s":"出血坏死型急性胰腺炎的临床特点不包括","c":"消化系统急症患者的护理","sc":1,"o":{"A":"腹痛进行性加重","B":"体温持续在39～40℃","C":"严重脱水、电解质紊乱","D":"血清淀粉酶进行性升高"},"a":"D","e":"淀粉酶的高低不一定反映病情轻重，出血坏死型胰腺炎血清淀粉酶值可正常或低于正常，故血清淀粉酶进行性升高不是其特点。"},{"i":"2024_10_single_17","t":"single","s":"尿路结石患者行体外冲击波治疗的适应证是结石直径小于","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"1.5cm","B":"2cm","C":"2.5cm","D":"3cm"},"a":"C","e":"体外冲击波碎石主要适用于结石直径小于2.5cm、结石以下输尿管通畅、肾功能良好、未发生感染的上尿路结石患者。"},{"i":"2024_10_single_18","t":"single","s":"上尿路结石的主要症状是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"疼痛和血尿","B":"恶心、呕吐","C":"排尿突然中断","D":"排尿困难"},"a":"A","e":"上尿路结石（肾、输尿管结石）的主要症状是疼痛和血尿。"},{"i":"2024_10_single_19","t":"single","s":"机体脑细胞所需的能量几乎完全直接来自于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"血酮体","B":"血短链脂肪酸","C":"血氨基酸","D":"血糖"},"a":"D","e":"脑细胞本身没有糖原储备，脑细胞所需的能量几乎完全直接来自血糖。"},{"i":"2024_10_single_20","t":"single","s":"意识清醒的低血糖患者首选的升血糖治疗是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"口服糖类食品","B":"静脉注射葡萄糖","C":"肌肉注射胰高血糖素","D":"皮下注射胰岛素"},"a":"A","e":"意识清醒的低血糖患者首选口服糖类食品升血糖；昏迷患者才需静脉注射葡萄糖或肌注胰高血糖素。"},{"i":"2024_10_single_22","t":"single","s":"某癫痫患者于行走时突然发呆，手中物体落地，呼之不应，数秒后恢复，但对刚才的过程不能回忆。该患者癫痫发作的类型为","c":"神经系统急症患者的护理","sc":1,"o":{"A":"局灶性发作","B":"强直阵挛发作","C":"失张力发作","D":"失神发作"},"a":"D","e":"失神发作表现为意识短暂中断（数秒）、呼之不应、持物落地、发作后对发作过程不能回忆。"},{"i":"2024_10_single_23","t":"single","s":"患者，女性，32岁，烧伤总面积为28%，烧伤深度为二度烧伤。根据新九分法，其病情程度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"轻度烧伤","B":"中度烧伤","C":"重度烧伤","D":"特重度烧伤"},"a":"B","e":"中度烧伤为总面积在10%~29%的二度烧伤。"},{"i":"2024_10_single_24","t":"single","s":"患者，女性，25岁，主因停经44天、间断下腹痛3天、加重2小时来诊，经专科检查确诊为异位妊娠。首选的治疗药物是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"环磷酰胺","B":"甲氨蝶呤","C":"环孢素","D":"甲硫氧嘧啶"},"a":"B","e":"用于治疗异位妊娠的药物以甲氨蝶呤(MTX)为首选，抑制滋养细胞增生、破坏绒毛。"},{"i":"2024_10_single_25","t":"single","s":"眼部化学伤患者局部滴用胶原抑制剂的目的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"缓解疼痛","B":"预防感染","C":"防止角膜溃疡","D":"减轻视力损害"},"a":"C","e":"眼部化学伤患者局部滴用胶原抑制剂防止角膜溃疡。"},{"i":"2024_10_single_26","t":"single","s":"患儿，女性，3岁，因喉部异物、呼吸困难1小时急诊就诊。查体：患儿吸气性呼吸困难明显，喉喘鸣声较响，吸气性胸廓周围软组织凹陷显著，烦躁不安，脉搏加快。该患儿的喉阻塞程度为","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"I度","B":"II度","C":"III度","D":"IV度"},"a":"C","e":"III度喉阻塞：吸气性呼吸困难明显、喉喘鸣声较响、吸气性胸廓周围软组织凹陷显著，并出现缺氧症状如烦躁不安、脉搏加快等。"},{"i":"2024_10_single_27","t":"single","s":"各类型中暑，最严重的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"先兆中暑","B":"热痉挛","C":"热衰竭","D":"热射病"},"a":"D","e":"热射病是最严重的中暑类型，表现为高热、无汗、意识障碍三联征，病死率高。"},{"i":"2024_10_single_28","t":"single","s":"对重症中暑的患者进行降温护理，在1h内其适宜的直肠温度是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"36℃","B":"37℃","C":"38℃","D":"39℃"},"a":"C","e":"重症中暑降温应在1h内使直肠温度降至37.8~38.9℃为宜。"},{"i":"2024_10_single_29","t":"single","s":"关于海水淹溺的描述，错误的是","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"患者有口渴感","B":"可出现迟发型肺水肿","C":"可出现高钠血症","D":"血容量偏低，应及时补充液体"},"a":"A","e":"海水为高渗液，吸入后大量体液渗入肺组织导致血液浓缩、血容量偏低、高钠血症，需及时补充液体（葡萄糖溶液、低分子右旋糖酐、血浆，严格控制氯化钠输入）；急性淹溺患者以呼吸系统症状（呼吸困难、发绀、咳粉红色泡沫痰）为主要表现，口渴感不是其典型临床表现。"},{"i":"2024_10_single_30","t":"single","s":"可用于急性酒精中毒患者的促酒精代谢药物是","c":"急性中毒患者的护理","sc":1,"o":{"A":"纳洛酮","B":"美他多辛","C":"解磷定","D":"氟马西尼"},"a":"B","e":"美他多辛是乙醛脱氢酶激活剂，能加速乙醇及其代谢产物乙醛和酮体经尿液排泄，属于促酒精代谢药。"},{"i":"2024_10_multi_31","t":"multi","s":"患者，男性，24岁，因误食毒蘑菇拟行洗胃术。置入胃管后，护士判断胃管在患者胃内的方法有","c":"急救技术","sc":2,"o":{"A":"用注射器可抽出胃液","B":"将胃管末端置入温水中，有气泡逸出","C":"快速注入10ml空气后，用听诊器可听到气过水声","D":"患者呼吸时胃管中有白雾出现","E":"快速注入10ml清水，患者有呛咳"},"a":"AC","e":"判断胃管在胃内的三种方法：抽（能抽出胃液）、看（胃管末端置入温水无气泡逸出）、听（剑突下听气过水声）。B有气泡逸出说明在气管内；D呼吸时有白雾说明在气管内；E注入清水呛咳也说明在气管内。"},{"i":"2024_10_multi_32","t":"multi","s":"肺血栓栓塞症三联征的临床表现包括","c":"呼吸系统急症患者的护理","sc":2,"o":{"A":"呼吸困难","B":"咳嗽","C":"晕厥","D":"胸痛","E":"咯血"},"a":"ADE","e":"肺血栓栓塞症(PTE)三联征为呼吸困难、胸痛、咯血。"},{"i":"2024_10_multi_33","t":"multi","s":"急性冠脉综合征患者应用β受体阻滞剂的禁忌证包括","c":"心血管系统急症患者的护理","sc":2,"o":{"A":"心率＜60次/分","B":"收缩压＞120mmHg","C":"三度房室传导阻滞","D":"合并哮喘","E":"末梢灌注不良"},"a":"ACDE","e":"β受体阻滞剂禁忌证为心率<60次/分、收缩压<100mmHg、二/三度房室传导阻滞或PR间期>0.24秒、慢性阻塞性肺疾病或哮喘患者、末梢灌注不良者。收缩压>120mmHg不是禁忌。"},{"i":"2024_10_multi_35","t":"multi","s":"上尿路结石包括","c":"泌尿系统急症患者的护理","sc":2,"o":{"A":"肾盂结石","B":"输尿管结石","C":"肾盏结石","D":"尿道结石","E":"膀胱结石"},"a":"ABC","e":"上尿路结石指肾（肾盂、肾盏）和输尿管结石；下尿路结石指膀胱结石和尿道结石。"},{"i":"2024_10_short_36","t":"short","s":"简述简易呼吸器通气操作要点。","c":"急救技术","sc":5,"at":"参考答案（要点）：①患者仰卧去枕，解开衣扣松腰带，清理口腔异物、摘除活动性义齿；②用仰头提颏法开放气道（怀疑颈椎损伤者用托下颌法），必要时插入口咽通气道；③术者站于患者头侧，将面罩贴紧扣在口鼻处（尖端朝头部、宽端朝足部），拇指示指形成\"C\"形固定面罩保持密闭，中指环指小指紧拉下颌骨性部分形成\"E\"形保持气道开放（E-C手法）；④另一手挤压呼吸囊送气，送气时间不小于1s，观察胸廓起伏，成人每次送气量500~600ml，频率10~12次/分（建立高级人工气道后8~10次/分）；⑤观察通气有效指征：面色口唇甲床由发绀转为红润、血氧饱和度上升；⑥储氧袋连接氧源，氧流量>10L/min。","e":""},{"i":"2024_10_short_37","t":"short","s":"请列出洗胃过程中的监测要点。","c":"急救技术","sc":5,"at":"参考答案（要点）：①监测患者意识状态、生命体征、面色、瞳孔变化；②观察洗出液的颜色、气味、性质、量，若洗出液呈血性应立即停止洗胃；③观察洗胃机运转是否正常；④观察患者有无呕吐、寒战、腹胀、出入液量不平衡等情况，及时报告医师；⑤待洗出液澄清无味后停止洗胃。","e":""},{"i":"2024_10_short_38","t":"short","s":"简述洋地黄中毒的处理。","c":"心血管系统急症患者的护理","sc":5,"at":"参考答案（要点）：①立即停用洋地黄类药物是关键；②低钾低镁患者积极补充钾盐和镁盐；③快速室性心律失常可用利多卡因缓慢静脉推注，一般禁忌电复律；④缓慢性心律失常若心室率<40次/分可用阿托品静脉注射，伴血流动力学障碍者可安置临时起搏器。","e":""},{"i":"2024_10_short_39","t":"short","s":"简述脑卒中患者症状评估的\"FAST\"判断法。","c":"神经系统急症患者的护理","sc":5,"at":"参考答案（要点）：F即Face（脸）——要求患者笑一下，观察嘴角是否对称，脑卒中患者面部不对称、无法正常露出微笑；A即Arm（胳膊）——要求患者举起双手，观察是否有肢体麻木无力；S即Speech（言语）——请患者重复说一句话，观察是否言语表达困难或口齿不清；T即Time（时间）——明确记下发病时间，为溶栓治疗争取时间窗。","e":""},{"i":"2024_10_essay_40","t":"essay","s":"试述高钾血症患者的病情评估及降钾急救护理措施。","c":"危重症患者的护理","sc":10,"at":"参考答案（要点）：一、病情评估：①病史评估：有无钾摄入过多（口服或静脉补钾过多、输注大量库存血）、钾排出减少（肾衰竭最常见、长期使用保钾利尿剂、醛固酮减少症）、细胞内钾外逸（酸中毒、高血糖合并胰岛素不足、组织损伤如挤压综合征）等诱因。②辅助检查：血清钾>5.5mmol/L提示血钾升高，>6.2mmol/L为高钾危急值；心电图早期T波高尖、Q-T间期延长，随后QRS增宽、P-R间期延长。③病情监测：神志、生命体征、肾功能、血清钾动态监测、心电图变化、24小时出入量。二、降钾急救护理措施：①禁钾——暂停静脉含钾溶液、控制口服钾剂、严格限钾饮食，输注血制品时尽量用新鲜血制品；②抗钾——10%葡萄糖酸钙10~20ml加等量葡萄糖溶液缓慢静脉注射，直接缓解过量钾对心肌的毒性作用，必要时可重复推注；③转钾——使用碳酸氢钠溶液或葡萄糖溶液加胰岛素（每4g葡萄糖加1U胰岛素），使K⁺转入细胞内；④排钾——肾功能良好者使用排钾利尿剂，肾功能损害者用阳离子交换树脂口服（3~4次/日、15g/d）并同服山梨醇或甘露醇导泻，无法降低血钾或严重高钾者采用床旁透析治疗；⑤积极治疗原发病，控制诱发因素；⑥安全护理：循序渐进的活动计划，预防跌倒。","e":""},{"i":"2024_10_case_41","t":"case","s":"患者，男性，78岁，既往COPD病史16年。3天前受凉后出现咳嗽加重，咳黄脓痰，并不易排出。今晨患者呼吸困难加重，动辄气喘来诊。查体：T37.6℃，P96次/分，R22次/分，BP130/80mmHg，神清，皮肤粘膜发绀，桶状胸，触觉语颤减弱，叩诊过清音，听诊呼吸低，双下肺可闻及湿啰音。急查血气：pH7.28，PaO₂ 54mmHg，PaCO₂ 60mmHg，SaO₂ 75%。临床诊断为急性呼吸衰竭。请写出：（1）急性呼吸衰竭的救治原则；（2）该患者急救护理中气道管理的措施。","c":"呼吸系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）急性呼吸衰竭的救治原则：保持呼吸道通畅，迅速纠正缺氧、CO₂潴留、酸碱失衡和代谢紊乱，防治多器官功能受损，积极治疗原发病，消除诱因，防治并发症。（2）气道管理措施：①保持呼吸道通畅是纠正缺氧和CO₂潴留最重要的措施——清除呼吸道内分泌物及异物（痰液黏稠时予以叩背排痰，必要时化痰药雾化吸入、负压吸引吸痰）；②缓解支气管痉挛（应用支气管扩张药，必要时给予糖皮质激素，静脉用药）；③建立人工气道（上述方法效果不佳时，采用简易人工气道、气管插管或气管切开建立人工气道，以方便吸痰和机械通气治疗）；④氧疗——该患者为Ⅱ型呼吸衰竭（PaO₂<60mmHg、PaCO₂>50mmHg），应持续低浓度(<35%)、低流量(1~2L/min)吸氧，避免高浓度吸氧加重CO₂潴留；⑤增加通气量改善CO₂潴留——呼吸兴奋剂（尼可刹米等）须在保证气道通畅前提下使用；必要时机械通气；⑥积极控制感染（呼吸道感染是呼吸衰竭最常见的诱因）；⑦纠正酸碱失衡（pH<7.2时补充碳酸氢钠）。","e":""},{"i":"2024_10_case_42","t":"case","s":"患者，女性，29岁，因多饮、多尿2月，加重伴恶心呕吐5天，伴神志不清1天就诊。查体：T36.8℃，P110次/分，R26次/分，BP120/70mmHg，身高165cm，体重42kg，神志不清，呼之不应。皮肤弹性差，呼气有烂苹果味，双肺呼吸音粗，双肺底有湿啰音，心率110次/分，律齐无杂音。实验室检查：尿糖(++++)，尿酮体(++++)。请写出：（1）该患者昏迷最可能的原因；（2）应立即开展的进一步检查；（3）目前应立即采取的急救护理措施。","c":"内分泌系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）该患者昏迷最可能的原因是糖尿病酮症酸中毒(DKA)昏迷：年轻女性、多饮多尿病史、恶心呕吐、神志不清、皮肤弹性差（脱水）、呼气有烂苹果味（酮味）、尿糖(++++)、尿酮体(++++)，符合DKA诊断。（2）应立即开展的进一步检查：①即刻血糖、血酮体测定；②动脉血气分析（评估酸中毒程度）；③电解质（血钾、血钠、血氯）、肾功能、血常规；④必要时查血渗透压、心电图。（3）立即采取的急救护理措施：①恢复血容量——补液是抢救DKA首要的关键措施，迅速开放两条静脉通路，第1小时输注生理盐水1000~1500ml，补液速度先快后慢；②降低血糖——小剂量胰岛素静脉治疗，负荷量0.1U/kg短效胰岛素静脉注射，维持量0.1U/(kg·h)静脉输注，降糖速度不宜过快；③补钾及纠正酸中毒——治疗前血钾不能反映真实缺钾程度，血钾正常高值时即应遵医嘱补钾并监测肾功能和心电图；重度酸中毒（pH<6.9）静脉补充碳酸氢钠；④保持呼吸道通畅、吸氧，患者神志不清取侧卧位防止呕吐误吸；⑤严密监测生命体征、意识、血糖、血钾、血气、出入量；⑥防治并发症（低血糖、低血钾、脑水肿等）；⑦做好口腔护理和皮肤护理。","e":""}]},{"key":"2025_04","name":"2025年4月","qs":[{"i":"2025_04_single_3","t":"single","s":"\"SOAP\"急诊分诊法中，P是指","c":"急诊分诊","sc":1,"o":{"A":"收集患者的主诉","B":"观察患者的现有症状","C":"评估患者的生命体征","D":"计划安排患者的就诊位置及顺序"},"a":"D","e":"S(subjective)主诉——收集患者主诉和现病史；O(objective)观察——观察现有症状；A(assess)评估——评估生命体征；P(plan)计划——计划安排患者的就诊位置及顺序。"},{"i":"2025_04_single_4","t":"single","s":"腹内某脏器遭受刺激后却在体表产生远离病变脏器部位的疼痛，称为","c":"常见急性症状的评估","sc":1,"o":{"A":"真性腹痛","B":"假性腹痛","C":"牵涉痛","D":"类似内脏痛"},"a":"C","e":"牵涉性腹痛指腹内某脏器遭受刺激后却在体表产生远离病变脏器部位的疼痛，疼痛部位不明确、无固定压痛点。"},{"i":"2025_04_single_5","t":"single","s":"院内心搏骤停生存链的第一环是","c":"心肺复苏","sc":1,"o":{"A":"心搏骤停的监测和预防","B":"即时高质量心肺复苏","C":"快速除颤","D":"高级生命维持"},"a":"A","e":"院内心搏骤停患者的生存主要取决于第一环——心搏骤停的监测和预防。"},{"i":"2025_04_single_6","t":"single","s":"使用仰头抬颏法开放气道时，下颌角与耳垂的连线与地面形成的夹角应为","c":"心肺复苏","sc":1,"o":{"A":"45°","B":"75°","C":"90°","D":"120°"},"a":"C","e":"仰头抬颏法使下颌角与耳垂连线与地面呈90°角。"},{"i":"2025_04_single_7","t":"single","s":"为心搏骤停患者实施高级心血管生命支持时，气道管理的\"金标准\"是","c":"心肺复苏","sc":1,"o":{"A":"口咽通气道","B":"喉罩","C":"环甲膜穿刺","D":"气管插管"},"a":"D","e":"气管插管是心搏骤停患者气道管理的\"金标准\"，具有保护气道、辅助有效通气、确保高浓度给氧、便于气道内吸引等优势。"},{"i":"2025_04_single_8","t":"single","s":"血清钙浓度的正常值为","c":"危重症患者的护理","sc":1,"o":{"A":"2.25～2.75mmol/L","B":"3.5～5.5mmol/L","C":"22～27mmol/L","D":"130～150mmol/L"},"a":"A","e":"血清钙正常值为2.25~2.75mmol/L；3.5~5.5mmol/L为血钾正常值；130~150mmol/L为血钠正常值。"},{"i":"2025_04_single_9","t":"single","s":"高钠血症患者的补液量计算时一般不应包含","c":"危重症患者的护理","sc":1,"o":{"A":"生理需要量","B":"已经损失量","C":"继续损失量","D":"预估损失量"},"a":"D","e":"补液量遵循定量原则：每日补液量=生理需要量（成人2000~2500ml/d）+额外补液量（已经损失量+继续损失量），不包含预估损失量。"},{"i":"2025_04_single_10","t":"single","s":"动脉血气分析各指标中，反映代谢性因素的是","c":"危重症患者的护理","sc":1,"o":{"A":"血液酸碱度","B":"标准碳酸氢盐","C":"血氧饱和度","D":"动脉血二氧化碳分压"},"a":"B","e":"标准碳酸氢盐(SB)正常22~27mmol/L，反映代谢性因素；PaCO₂反映呼吸性因素；pH反映综合酸碱状态。"},{"i":"2025_04_single_11","t":"single","s":"为卧位患者除颤时，关于操作者APEX手柄使用及位置的说法正确的是","c":"急救技术","sc":1,"o":{"A":"左手持手柄电极，置于患者右腋中线第2肋间","B":"左手持手柄电极，置于患者左腋中线第2肋间","C":"右手持手柄电极，置于患者右腋中线第5肋间","D":"右手持手柄电极，置于患者左腋中线第5肋间"},"a":"D","e":"卧位除颤：右手持APEX手柄电极置于患者左腋中线第5肋间，左手持STERNUM手柄电极置于右锁骨中线第2肋间。"},{"i":"2025_04_single_12","t":"single","s":"患者，男性，19岁，瘦高体型，既往体健。今日在宿舍抬举重物后突然胸痛、呼吸困难，伴刺激性咳嗽，急诊就诊。该患者最可能出现了","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"哮喘急性发作","B":"自发性气胸","C":"急性肺炎","D":"肺栓塞"},"a":"B","e":"自发性气胸好发于20~40岁瘦高体型年轻男性，诱因可为抬举重物、咳嗽、喷嚏、屏气等，表现为突发一侧胸痛、呼吸困难、刺激性咳嗽。"},{"i":"2025_04_single_13","t":"single","s":"鉴别不稳定型心绞痛和非ST段抬高型心肌梗死的主要标准是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"心电图","B":"超声心动图","C":"血清心肌损伤标志物","D":"脑钠肽"},"a":"C","e":"血清心肌损伤标志物检查是鉴别UA和NSTEMI的主要标准，UA时心肌损伤标志物一般无异常增高，cTnT或cTnI增高提示心肌坏死。"},{"i":"2025_04_single_14","t":"single","s":"急性肺水肿患者镇静时，首选的药物是","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"毛花苷C","B":"呋塞米","C":"硝普钠","D":"吗啡"},"a":"D","e":"急性肺水肿患者镇静首选吗啡，吗啡不仅有镇静作用，还可扩张小血管减轻心脏负荷。"},{"i":"2025_04_single_15","t":"single","s":"主动脉夹层患者后背及腹部疼痛强烈，提示夹层形成部位为","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"近端升主动脉","B":"主动脉弓","C":"降主动脉","D":"腹主动脉"},"a":"D","e":"后背、腹部及下肢疼痛强烈提示腹主动脉夹层形成；前胸疼痛提示近端升主动脉；肩胛部位疼痛提示降主动脉。"},{"i":"2025_04_single_16","t":"single","s":"麻痹性肠梗阻的临床特点是","c":"消化系统急症患者的护理","sc":1,"o":{"A":"阵发性剧烈绞痛","B":"持续性刀割样腹痛","C":"持续性腹部胀痛不适","D":"进行性加剧的腹绞痛"},"a":"C","e":"麻痹性肠梗阻表现为持续性腹部胀痛不适，肠鸣音减弱或消失；阵发性剧烈绞痛见于机械性肠梗阻。"},{"i":"2025_04_single_17","t":"single","s":"有助于增加尿中草酸溶解度的药物是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"氧化镁","B":"山莨菪碱","C":"碳酸氢钠","D":"维生素B₆"},"a":"A","e":"氧化镁可以增加尿中草酸溶解度，有助于预防含钙结石复发。"},{"i":"2025_04_single_18","t":"single","s":"饮水预防尿路结石，效果较好的饮水时间是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"睡前","B":"清晨","C":"餐前","D":"餐后"},"a":"A","e":"每天饮水3000ml以上，尤其睡前及半夜饮水效果更好。"},{"i":"2025_04_single_19","t":"single","s":"活动后镜下血尿常见于","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"膀胱结石","B":"尿道结石","C":"肾结石","D":"尿路完全梗阻"},"a":"C","e":"有时活动后出现镜下血尿是上尿路结石（肾结石）的唯一临床表现。"},{"i":"2025_04_single_20","t":"single","s":"精索扭转救治成功的关键是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"迅速恢复睾丸血流","B":"早期发现明确诊断","C":"早期手术探查","D":"合理镇痛"},"a":"A","e":"精索扭转治疗目的是挽救睾丸，成功的关键是迅速恢复睾丸血流。"},{"i":"2025_04_single_21","t":"single","s":"糖尿病酮症酸中毒患者治疗中最常见的电解质紊乱是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"高钾血症","B":"低钾血症","C":"高钙血症","D":"低钙血症"},"a":"B","e":"低血钾是DKA治疗中最常见的电解质紊乱，应严密观察血钾改变并及时补钾。"},{"i":"2025_04_single_22","t":"single","s":"对于糖尿病患者，低血糖的诊断标准是血糖水平不高于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"6.1mmol/L","B":"3.9mmol/L","C":"2.8mmol/L","D":"2.1mmol/L"},"a":"B","e":"接受药物治疗的糖尿病患者只要血糖水平≤3.9mmol/L即可认为是血糖降低。"},{"i":"2025_04_single_23","t":"single","s":"目前治疗缺血性脑卒中最重要的恢复血流措施是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"介入治疗","B":"脱水治疗","C":"溶栓治疗","D":"降压治疗"},"a":"C","e":"溶栓治疗是目前最重要的恢复血流措施，有效抢救半暗带组织的时间窗为4.5h内或6h内。"},{"i":"2025_04_single_24","t":"single","s":"狂犬病患者最特殊的临床表现是","c":"损伤急症患者的护理","sc":1,"o":{"A":"恐水","B":"畏光","C":"失眠","D":"易怒"},"a":"A","e":"恐水、怕风是狂犬病的特殊症状，典型患者见水、闻及水声、饮水或仅提及饮水时均可引起严重的喉肌痉挛。"},{"i":"2025_04_single_25","t":"single","s":"新生儿复苏暖台的温度应为","c":"妇产科急症患者的护理","sc":1,"o":{"A":"20～26℃","B":"28～34℃","C":"36～40℃","D":"42～46℃"},"a":"B","e":"打开新生儿复苏暖台开关，调节温度至28~34℃。"},{"i":"2025_04_single_26","t":"single","s":"患者，女性，54岁，主因右眼胀痛，恶心呕吐，视物模糊4小时来诊，诊断为急性闭角型青光眼。医生开具了20%甘露醇250ml静脉滴注，护士向患者解释使用该药的目的是","c":"眼科急症患者的护理","sc":1,"o":{"A":"降低颅内压","B":"降低眼压","C":"利尿","D":"减轻水肿"},"a":"B","e":"急性闭角型青光眼使用20%甘露醇静脉滴注的目的是降低眼压。"},{"i":"2025_04_single_27","t":"single","s":"急性闭角型青光眼患者停止使用β-肾上腺素受体阻滞剂的指征是","c":"眼科急症患者的护理","sc":1,"o":{"A":"脉率＜120次/分","B":"脉率＜100次/分","C":"脉率＜80次/分","D":"脉率＜60次/分"},"a":"D","e":"β-肾上腺素受体阻滞剂使用时注意观察心率、脉率，脉率小于60次/分应停止使用。"},{"i":"2025_04_single_28","t":"single","s":"患儿，男性，3岁，主因发热、咳嗽2日，呼吸困难伴喉鸣3小时来诊。患儿极度呼吸困难，声音嘶哑，阵发性犬吠样咳嗽。查体：鼻翼扇动，口唇发绀，咽喉红肿，吸气性喉鸣伴三凹征。该患儿最可能出现的问题是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"喉部异物","B":"急性喉炎","C":"急性支气管炎","D":"大叶性肺炎"},"a":"B","e":"小儿急性喉炎起病急、进展快，典型表现为发热、声音嘶哑、犬吠样咳嗽、吸气性喉鸣和三凹征，严重者出现吸气性呼吸困难。"},{"i":"2025_04_single_29","t":"single","s":"某环卫工人于夏季室外作业时出现头晕、恶心、呕吐，休息后不缓解，遂至急诊。查体：神志清楚，大汗淋漓、面色苍白、皮肤湿冷，脉搏细数，呼吸22次/分，血压90/60mmHg。判断该患者的中暑类型为","c":"物理与环境因素所致的急症患者的护理","sc":1,"o":{"A":"轻症中暑","B":"热痉挛","C":"热衰竭","D":"热射病"},"a":"C","e":"热衰竭表现为多汗、疲乏、恶心呕吐、头痛、皮肤湿冷、面色苍白、脉搏细数、血压偏低，体温轻度升高或正常。"},{"i":"2025_04_single_30","t":"single","s":"下列症状提示阿托品中毒的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"颜面潮红","B":"瞳孔扩大","C":"心率102次/分","D":"体温40.3℃"},"a":"D","e":"阿托品中毒表现为高热>40℃、谵妄躁动、瞳孔极度散大、皮肤紫红干燥、心动过速甚至室颤。颜面潮红、瞳孔扩大、心率加快均为阿托品化表现。"},{"i":"2025_04_multi_31","t":"multi","s":"腹膜刺激征表现为","c":"常见急性症状的评估","sc":2,"o":{"A":"腹部压痛","B":"腹部反跳痛","C":"腹壁肌卫","D":"移动性浊音阳性","E":"排便排气停止"},"a":"ABC","e":"腹膜刺激征表现为腹部压痛、反跳痛及腹壁肌卫，常见于急腹症。"},{"i":"2025_04_multi_32","t":"multi","s":"下列提示心肺复苏有效的指标包括","c":"心肺复苏","sc":2,"o":{"A":"肌张力丧失","B":"有眼球活动","C":"自主呼吸恢复","D":"意识部分恢复","E":"上肢收缩压达45mmHg"},"a":"BCD","e":"CPR有效指标：患者有反应、自主呼吸恢复、可触摸到颈动脉搏动；面色由发绀转为红润；瞳孔由大变小并有对光反射甚至有眼球活动；意识完全恢复或部分恢复；上肢收缩压达到60mmHg以上。肌张力丧失提示脑功能恶化，收缩压45mmHg未达60mmHg标准。"},{"i":"2025_04_multi_33","t":"multi","s":"休克患者的输血指征包括","c":"危重症患者的护理","sc":2,"o":{"A":"血红蛋白＜70g/L","B":"收缩压＜90mmHg","C":"中心静脉压12cmH₂O","D":"红细胞压积＜0.25","E":"尿量＞30ml/h"},"a":"AD","e":"输血指征为血红蛋白(Hb)<70g/L或红细胞压积(HCT)<0.25时。"},{"i":"2025_04_multi_34","t":"multi","s":"大量气胸患者可出现的体征包括","c":"呼吸系统急症患者的护理","sc":2,"o":{"A":"呼吸运动减弱","B":"胸部膨隆","C":"气管向患侧移位","D":"语颤减弱","E":"肋间隙变窄"},"a":"ABD","e":"大量气胸时出现呼吸增快、呼吸运动减弱、患侧胸部膨隆；气管向健侧移位（非患侧），肋间隙增宽（非变窄），语颤减弱；叩诊过清音或鼓音，呼吸音减弱或消失。"},{"i":"2025_04_multi_35","t":"multi","s":"小脑出血的典型临床表现包括","c":"神经系统急症患者的护理","sc":2,"o":{"A":"头痛","B":"眩晕","C":"呕吐","D":"构音障碍","E":"肢体瘫痪"},"a":"ABCD","e":"小脑出血典型表现为突发眩晕、频繁呕吐、剧烈头痛（后枕部）、构音障碍、共济失调，一般无明显肢体瘫痪。"},{"i":"2025_04_short_37","t":"short","s":"简述安置临时起搏器患者的护理。","c":"心血管系统急症患者的护理","sc":5,"at":"参考答案（要点）：①术后卧床休息，术侧肢体避免过度活动；②持续心电监护，观察起搏信号是否正常、心率是否与起搏频率一致；③观察穿刺部位有无出血、血肿、感染，保持敷料干燥；④观察有无起搏器并发症（心律失常、心肌穿孔、导管移位、感染等）；⑤指导患者避免强电磁环境，教会患者自测脉搏；⑥做好心理护理和健康教育。","e":""},{"i":"2025_04_short_38","t":"short","s":"简述急性上消化道出血患者出血量的评估方法。","c":"消化系统急症患者的护理","sc":5,"at":"参考答案（要点）：①大便隐血试验阳性提示每日出血量>5~10ml；②黑便提示每日出血量>50~100ml；③呕血提示胃内积血>250~300ml；④出现头晕、心悸、乏力等全身症状提示出血量>400~500ml；⑤出现体位性低血压、晕厥等周围循环衰竭表现提示出血量>1000ml；⑥根据收缩压估算失血量：收缩压降至90~100mmHg约失血20%，降至80mmHg约失血30%，降至60mmHg约失血50%。","e":""},{"i":"2025_04_short_39","t":"short","s":"简述甲状腺危象患者病史评估的内容。","c":"内分泌系统急症患者的护理","sc":5,"at":"参考答案（要点）：①评估有无甲状腺功能亢进病史及治疗经过；②评估发病前有无明显诱因（如感染、手术、创伤、精神刺激、不适当停用抗甲状腺药物等）；③评估起病时间、起病急缓、主要症状及特点；④评估既往用药史、过敏史；⑤评估患者意识状态、生命体征（体温、心率、血压、呼吸）；⑥评估患者及家属对疾病的认知程度和心理状态。","e":""},{"i":"2025_04_essay_40","t":"essay","s":"试述癫痫发作时的急救护理措施。","c":"神经系统急症患者的护理","sc":10,"at":"参考答案（要点）：①立即让患者就地平卧，解开衣领、裤带，取下义齿和眼镜；②保持呼吸道通畅：将患者头偏向一侧，及时清理口鼻腔分泌物和呕吐物，防止窒息；③防止外伤：移开周围尖锐物体，用压舌板或筷子裹纱布置于患者上下臼齿之间防止舌咬伤（牙关紧闭时不可强行撬开），抽搐时不可用力按压肢体以免骨折；④给氧：给予氧气吸入，改善缺氧；⑤病情观察：观察发作类型、持续时间、频率，观察意识、瞳孔、生命体征变化，记录发作过程；⑥用药护理：遵医嘱给予抗癫痫药物，地西泮是控制癫痫持续状态的首选药，静脉注射时速度要慢；⑦发作后护理：发作停止后让患者安静休息，监测生命体征和意识状态；⑧癫痫持续状态者按危重患者护理，备好抢救物品；⑨健康教育：指导患者避免诱因（疲劳、饥饿、饮酒、情绪激动等），按时服药，随身携带疾病信息卡。","e":""},{"i":"2025_04_case_41","t":"case","s":"患者，男性，58岁，因突发胸痛2小时呼叫120。转运途中患者突然全身抽搐、意识丧失，心电图显示（图示为形态、振幅不规则、频率快速的室颤波形）。请写出：（1）该患者意识丧失可能的原因及心律失常类型；（2）现场人员应立即采取的急救措施。","c":"心肺复苏","sc":15,"at":"参考答案（要点）：（1）该患者因急性心肌梗死（突发胸痛2小时）在转运途中发生心搏骤停，心电图示波为形态、振幅均不规则的心室颤动波形，全身抽搐、意识丧失为阿-斯综合征表现，即心肌梗死并发心室颤动导致心输出量突然中断、脑缺血缺氧。（2）现场人员应立即采取的急救措施：①立即识别心搏骤停，启动应急反应系统；②立即进行心肺复苏：按C-A-B程序，先行胸外按压（胸骨下半部，频率100~120次/分，深度5~6cm，按压通气比30:2）；③尽早使用AED/除颤仪除颤：心电确认室颤后，双相波选择200J，电极片贴于前-侧位，按下除颤按钮前确认所有人离开患者；④除颤后立即继续5轮（约2分钟）CPR后再评估心律；⑤开放气道、人工通气（球囊面罩通气，每次1s见胸廓起伏）；⑥持续心电监护，记录抢救时间和过程；⑦尽快转运至医院行进一步抢救。","e":""},{"i":"2025_04_case_42","t":"case","s":"患者，男性，34岁，因大面积烧伤急诊就医。患者全身烧伤总面积为48%，其中18%为三度烧伤，30%为二度烧伤。查体：T35.9℃，BP82/50mmHg，R34次/分，HR132次/分。请写出：（1）根据新九分法，该患者的烧伤病情程度；（2）使用暴露疗法时该患者的创面护理措施。","c":"损伤急症患者的护理","sc":15,"at":"参考答案（要点）：（1）根据新九分法，该患者烧伤总面积48%（二度30%+三度18%），属于重度烧伤（总面积在30%~49%，或面积在10%~19%的三度烧伤）。患者同时有低血容量性休克表现（BP82/50mmHg、HR132次/分、体温偏低），病情危重。（2）暴露疗法的创面护理措施：①将患者置于经过消毒的床单上，使创面充分暴露，避免受压；②病室要求：室温28~32℃、湿度40%左右，严格消毒隔离，限制探视；③创面处理：常规进行创面消毒，涂用磺胺嘧啶银等外用药物，保持创面干燥，促进结痂；④定时翻身，避免创面长时间受压，使用翻身床或气垫床；⑤密切观察创面情况：观察创面颜色、渗液、气味、焦痂变化，注意有无感染迹象（脓性分泌物、异味、创面加深等）；⑥严格无菌操作，接触创面前后洗手，换药器械严格消毒；⑦做好口腔、会阴部等基础护理，防止继发感染；⑧营养支持：给予高蛋白、高热量、高维生素饮食，必要时肠内或肠外营养支持。","e":""}]},{"key":"2025_10","name":"2025年10月","qs":[{"i":"2025_10_single_1","t":"single","s":"急诊患者留院观察的标准为","c":"急救医疗服务体系","sc":1,"o":{"A":"宜严不宜宽","B":"先留观再明确诊断","C":"宜宽不宜严","D":"先明确诊断再留观"},"a":"C","e":"留观标准\"宜宽不宜严\"，以防止具有隐匿的致命性疾病患者发生意外，留观时间原则上不超过72小时。"},{"i":"2025_10_single_2","t":"single","s":"分诊护士发现某患者有急性症状和急诊问题，但目前明确没有危及生命或致残危险，根据原卫生部发布的我国首部《医院急诊科规范化流程》中的急诊患者四级病情分级标准，其病情分类为","c":"急诊分诊","sc":1,"o":{"A":"A类(濒危患者)","B":"B类(危重患者)","C":"C类(急症患者)","D":"D类(非急症患者)"},"a":"C","e":"四级分级中3级——C类(急症患者)：有急性症状和急诊问题，但目前明确没有危及生命或致残危险，应在一定时间段内安排就诊。"},{"i":"2025_10_single_3","t":"single","s":"患者,男性，58岁，既往冠心病病史6年。1小时前与家人吵架后突发胸骨后压榨性疼痛，服用硝酸甘油不能缓解，伴大汗，呕吐胃内容物2次。生命体征：T37.1℃，HR106次/分，R24次/分，BP98/60mmHg。按照急诊五级病情分级标准，该患者的分级为","c":"急诊分诊","sc":1,"o":{"A":"I级（危急）","B":"II级（危重）","C":"IV级（急症）","D":"V级（非紧急）"},"a":"B","e":"五级分级中II级(危重)：有潜在危及生命可能，如胸痛疑为急性心肌梗死，需在10~15min内给予紧急处理与严密观察。患者有冠心病史，突发胸骨后压榨性疼痛、硝酸甘油不缓解，符合II级危重标准。"},{"i":"2025_10_single_4","t":"single","s":"下列发热病因中常引起中枢神经性发热的是","c":"常见急性症状的评估","sc":1,"o":{"A":"原发性肝癌","B":"中暑","C":"类风湿关节炎","D":"甲亢"},"a":"B","e":"中枢神经性发热见于中暑、脑出血、脑震荡、颅骨骨折及中毒性脑病等。"},{"i":"2025_10_single_5","t":"single","s":"化脓性感染患者典型的热型是","c":"常见急性症状的评估","sc":1,"o":{"A":"弛张热","B":"稽留热","C":"间歇热","D":"回归热"},"a":"A","e":"弛张热表现为持续高热39℃以上，每日波动2℃以上，最低体温不降至正常，见于化脓性感染、脓毒症、结核病等。"},{"i":"2025_10_single_6","t":"single","s":"患者，男性，43岁，平素体健，近期工作压力大，生活不规律。1小时前无明确诱因突发胸骨后压榨性疼痛，向左肩背部及左上肢放射，休息后疼痛不缓解。心电图示动态心肌缺血表现，心肌损伤标志物正常。该患者胸痛最可能的原因为","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"自发性气胸","B":"肺梗死","C":"急性冠状动脉综合征","D":"主动脉夹层"},"a":"C","e":"胸骨后压榨性疼痛向左肩背部及左上肢放射、休息不缓解、心电图动态心肌缺血表现、心肌损伤标志物正常，符合不稳定型心绞痛(UA)即急性冠状动脉综合征的表现。"},{"i":"2025_10_single_7","t":"single","s":"患者，男性，54岁，吸烟史30年，30支/日，既往体健。主诉咯血伴呛咳1天就诊。根据该患者的病史应高度警惕的问题是","c":"常见急性症状的评估","sc":1,"o":{"A":"肺梗死","B":"支气管肺癌","C":"肺结核","D":"支气管扩张症"},"a":"B","e":"40岁以上长期大量吸烟者出现咯血伴呛咳应高度警惕支气管肺癌。"},{"i":"2025_10_single_8","t":"single","s":"非专业人员对心搏骤停患者进行评估时一般不推荐评估的表现是","c":"心肺复苏","sc":1,"o":{"A":"意识丧失","B":"呼吸停止","C":"叹气样呼吸","D":"颈动脉搏动消失"},"a":"D","e":"非专业人员由于判断大动脉搏动难度大、准确性低，可根据患者意识丧失、呼吸停止来判断心搏骤停，不推荐评估颈动脉搏动。"},{"i":"2025_10_single_9","t":"single","s":"高钙血症患者可使用的药物不包括","c":"危重症患者的护理","sc":1,"o":{"A":"氢氯噻嗪","B":"降钙素","C":"阿司匹林","D":"双膦酸盐"},"a":"A","e":"高钙血症治疗应停止噻嗪类利尿剂(氢氯噻嗪)，改用促进钙排出的利尿剂；可使用降钙素、双膦酸盐、前列腺素合成酶抑制剂(阿司匹林)抑制钙的重吸收。"},{"i":"2025_10_single_10","t":"single","s":"下列急性呼吸性碱中毒患者的急救护理措施中不正确的是","c":"危重症患者的护理","sc":1,"o":{"A":"嘱患者反复屏气","B":"将塑料袋套于患者口鼻上","C":"5%CO₂混合气体吸入","D":"应用呼吸兴奋剂"},"a":"D","e":"急性呼吸性碱中毒应去除过度通气原因，可吸入5%CO₂混合气体、反复屏气或塑料袋套口鼻回吸CO₂；应用呼吸兴奋剂会加重过度通气，是不正确的。"},{"i":"2025_10_single_11","t":"single","s":"患者，男性，42岁，以阵发性腹痛、反复呕吐伴腹胀1日来诊，急查电解质：血清钠130mmol/L，初步判断其水钠代谢紊乱的类型为","c":"危重症患者的护理","sc":1,"o":{"A":"等渗性缺水","B":"低渗性缺水","C":"高渗性缺水","D":"水中毒"},"a":"B","e":"血清钠正常值135~145mmol/L，患者血清钠130mmol/L低于正常，伴反复呕吐丢失钠，符合低渗性缺水。"},{"i":"2025_10_single_12","t":"single","s":"口咽通气道置入长度的正确测量方法是测量患者","c":"急救技术","sc":1,"o":{"A":"门齿到下颏的距离","B":"鼻尖到门齿的距离","C":"鼻尖到耳垂的距离","D":"门齿到下颌角的距离"},"a":"D","e":"口咽通气道置入前应测量门齿到下颌角或耳垂的距离，选择长度合适的通气道。"},{"i":"2025_10_single_13","t":"single","s":"II型呼吸衰竭患者适宜的吸氧流量为","c":"呼吸系统急症患者的护理","sc":1,"o":{"A":"1～2L/min","B":"4～6L/min","C":"7～8L/min","D":"9～10L/min"},"a":"A","e":"II型呼吸衰竭应给予持续低流量吸氧，流量1~2L/min，防止缺氧纠正过快抑制呼吸驱动。"},{"i":"2025_10_single_14","t":"single","s":"根据Killip分级标准，急性心肌梗死患者肺底部可闻及湿啰音时，其心功能为","c":"心血管系统急症患者的护理","sc":1,"o":{"A":"I级","B":"II级","C":"III级","D":"IV级"},"a":"B","e":"Killip II级为轻、中度心衰，主要表现为肺底湿啰音(<50%的肺野)、第三心音及X线胸片上肺淤血的表现。"},{"i":"2025_10_single_15","t":"single","s":"急性胰腺炎患者血清淀粉酶开始升高的时间一般是发病后","c":"消化系统急症患者的护理","sc":1,"o":{"A":"即刻","B":"1～2h","C":"6～12h","D":"48h"},"a":"C","e":"血清淀粉酶一般在起病后6~12h开始升高、48h开始下降、持续3~5天。"},{"i":"2025_10_single_17","t":"single","s":"肾结石的主要症状是","c":"泌尿系统急症患者的护理","sc":1,"o":{"A":"肾积水","B":"膀胱刺激症","C":"疼痛和血尿","D":"排尿中断"},"a":"C","e":"上尿路结石(肾结石、输尿管结石)的主要表现为与活动有关的疼痛和血尿。"},{"i":"2025_10_single_18","t":"single","s":"糖尿病酮症酸中毒患者降低血糖治疗首选的药物是","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"短效胰岛素","B":"中效胰岛素","C":"长效胰岛素","D":"磺脲类降糖药"},"a":"A","e":"DKA治疗首选小剂量短效(普通)胰岛素持续静脉滴注，可简便、安全、有效控制血糖。"},{"i":"2025_10_single_19","t":"single","s":"对于非糖尿病患者，低血糖的诊断标准是血糖水平低于","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"6.1mmol/L","B":"3.9mmol/L","C":"2.8mmol/L","D":"2.1mmol/L"},"a":"C","e":"非糖尿病患者血糖≤2.8mmol/L即可诊断低血糖；糖尿病患者血糖≤3.9mmol/L即为低血糖。"},{"i":"2025_10_single_20","t":"single","s":"甲状腺危象患者降温治疗时应禁用","c":"内分泌系统急症患者的护理","sc":1,"o":{"A":"冰生理盐水灌肠","B":"水杨酸类解热药","C":"氯丙嗪","D":"降温毯"},"a":"B","e":"甲状腺危象降温禁用水杨酸类解热药，因该药可取代T₃/T₄与甲状腺素结合球蛋白结合，使游离T₃、T₄增加，加重甲亢症状。"},{"i":"2025_10_single_21","t":"single","s":"下列属于椎-基底动脉梗死的典型表现的是","c":"神经系统急症患者的护理","sc":1,"o":{"A":"眩晕","B":"对侧偏瘫","C":"同向性偏盲","D":"失语"},"a":"A","e":"椎-基底动脉系统(后循环)梗死典型表现为眩晕、恶心、呕吐、眼震、吞咽困难及共济失调；对侧偏瘫、同向偏盲、失语为颈内动脉系统(前循环)梗死表现。"},{"i":"2025_10_single_23","t":"single","s":"患者，女性，33岁，主因车祸致颅脑损伤半小时来诊。患者在车祸后曾有短暂昏迷15分钟，醒后主诉有轻微头昏、恶心、晕眩，有近事遗忘，远期记忆正常。查体：生命体征无明显异常，神经系统体征正常。该患者的颅脑损伤严重程度为","c":"损伤急症患者的护理","sc":1,"o":{"A":"轻型","B":"中型","C":"重型","D":"特重型"},"a":"A","e":"轻型颅脑伤(GCS 13~15分)：原发性昏迷在半小时以内，常有近事遗忘(逆行性遗忘)，无明显神经系统阳性体征，符合脑震荡表现。"},{"i":"2025_10_single_24","t":"single","s":"患者，男性，22岁，因匕首刺伤腹部急诊就诊。查体：T36.0℃，HR122次/分，R26次/分，BP78/52mmHg。面色苍白，神志淡漠，腹部压痛、反跳痛不明显。患者最可能发生的损伤是","c":"损伤急症患者的护理","sc":1,"o":{"A":"胃破裂","B":"肠破裂","C":"胆总管破裂","D":"脾破裂"},"a":"D","e":"腹部刺伤后出现休克征象(BP78/52mmHg、HR122次/分、面色苍白、神志淡漠)而腹膜刺激征不明显，提示实质性脏器(脾)破裂导致的内出血。"},{"i":"2025_10_single_25","t":"single","s":"最常见的异位妊娠是","c":"妇产科急症患者的护理","sc":1,"o":{"A":"输卵管妊娠","B":"宫颈妊娠","C":"卵巢妊娠","D":"腹腔妊娠"},"a":"A","e":"输卵管妊娠占异位妊娠的95%左右，是最常见的异位妊娠类型。"},{"i":"2025_10_single_26","t":"single","s":"患者，男性，48岁，主因石灰溅入右眼内2小时来诊。查体：右上眼睑皮肤起疱、糜烂，右眼结膜水肿，局限性坏死，角膜雾状浑浊，上皮全部脱落，角膜浅层基质受累。判断该患者的病情程度为","c":"眼科急症患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"极重度"},"a":"B","e":"中度眼化学伤表现为皮肤起泡、糜烂，结膜水肿、局限性坏死，角膜雾状混浊、上皮全部脱落、角膜浅层基质受累，愈后留有云翳或斑翳。"},{"i":"2025_10_single_27","t":"single","s":"患儿，男性，3岁，主因发热、咳嗽3日，呼吸困难伴喉鸣2小时来诊。查体：烦躁不安，鼻翼扇动，口唇发绀，吸气性喉鸣伴三凹征。SpO₂ 88%，HR110次/分。此时应采取的紧急处理措施是","c":"耳鼻喉科急症患者的护理","sc":1,"o":{"A":"鼻导管吸氧","B":"雾化吸入","C":"解痉平喘","D":"气管切开"},"a":"D","e":"患儿出现三度喉梗阻表现(发绀、三凹征、SpO₂ 88%、烦躁不安)，应立即行气管切开解除梗阻。"},{"i":"2025_10_single_28","t":"single","s":"下列对高压电引起的损伤描述正确的是","c":"损伤急症患者的护理","sc":1,"o":{"A":"口小底大，外深内浅","B":"口大底小，外深内浅","C":"口小底大，外浅内深","D":"口大底小，外浅内深"},"a":"C","e":"高压电引起的损伤面积不大但可深达肌肉、血管、神经和骨骼，有\"口小底大，外浅内深\"的特征。"},{"i":"2025_10_single_29","t":"single","s":"患者，男性，41岁，6小时前因与家人吵架，服用大量镇静催眠药后由家人送至急诊。下列急救护理措施中能够促进已吸收毒物排出的是","c":"急性中毒患者的护理","sc":1,"o":{"A":"催吐","B":"洗胃","C":"灌入药用活性炭","D":"血液净化"},"a":"D","e":"催吐、洗胃、灌入药用活性炭均为清除未吸收毒物的措施；血液净化(透析、血液灌流等)可促进已吸收毒物从血液中排出。"},{"i":"2025_10_single_30","t":"single","s":"患者，女性，32岁，因有机磷农药中毒急诊入院。入院后查血胆碱酯酶活力为58%，患者主诉头痛、头晕、乏力、恶心、胸闷、多汗、视物模糊，查体可见瞳孔缩小。该患者的中毒程度为","c":"急性中毒患者的护理","sc":1,"o":{"A":"轻度","B":"中度","C":"重度","D":"危重"},"a":"A","e":"轻度有机磷中毒：血胆碱酯酶活力为50%~70%，表现为头痛、头晕、乏力、恶心、呕吐、胸闷、多汗、视物模糊、瞳孔缩小。"},{"i":"2025_10_multi_31","t":"multi","s":"上消化道出血最常见的临床表现有","c":"消化系统急症患者的护理","sc":2,"o":{"A":"恶心","B":"腹痛","C":"呕血","D":"腹泻","E":"黑便"},"a":"CE","e":"呕血和黑便是上消化道出血的特征性表现。呕血多为棕褐色、咖啡渣样；黑便呈柏油样，黏稠而发亮。"},{"i":"2025_10_multi_32","t":"multi","s":"胃、十二指肠穿孔的临床特点包括","c":"常见急性症状的评估","sc":2,"o":{"A":"有溃疡病史","B":"突发上腹部剧烈持续疼痛","C":"上腹部压痛和反跳痛","D":"腹肌紧张可呈板状腹","E":"墨菲征阳性"},"a":"ABCD","e":"胃十二指肠穿孔表现为有溃疡病史、突发上腹部剧烈持续疼痛、上腹部压痛和反跳痛、腹肌紧张可呈板状腹、膈下游离气体；墨菲征阳性见于急性胆囊炎。"},{"i":"2025_10_multi_33","t":"multi","s":"尿路结石形成的主要因素包括","c":"泌尿系统急症患者的护理","sc":2,"o":{"A":"尿中盐类呈超饱和状态","B":"抑制晶体形成物不足","C":"核基质的存在","D":"血管内皮细胞损伤","E":"血管舒缩功能异常"},"a":"ABC","e":"尿中形成结石的盐类呈超饱和状态、抑制晶体形成物不足和核基质的存在是结石形成的三大主要因素。"},{"i":"2025_10_multi_34","t":"multi","s":"低血糖危象的常见病因包括","c":"内分泌系统急症患者的护理","sc":2,"o":{"A":"胰岛素使用过量","B":"口服降糖药物过量","C":"食物摄入过量","D":"运动过量","E":"饮酒过量"},"a":"ABDE","e":"低血糖常见病因包括胰岛
