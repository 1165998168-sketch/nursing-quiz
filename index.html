人角色行为缺如","D":"病人角色行为冲突"},"a":"D","e":"病人角色行为冲突多见于由常态社会角色转向病人角色时,一般男性、A型性格及在工作生活中占主导地位的人容易出现。"},{"i":"2024_4_single_13","t":"single","s":"护士在执行医嘱过程中,对医嘱内容有怀疑时,正确的做法是","c":"护理伦理与法律","sc":1,"o":{"A":"拒绝执行","B":"自行改为正确后再执行","C":"向开医嘱的医生询问以证实医嘱的准确性再执行","D":"按医嘱执行"},"a":"C","e":"护士对医嘱内容有疑问时,应向开医嘱的医生询问、核实无误后再执行,不得擅自更改或盲目执行。"},{"i":"2024_4_single_14","t":"single","s":"根据马斯洛的人类基本需要理论,最高层次的需要是","c":"护理相关理论及模式","sc":1,"o":{"A":"尊重的需要","B":"安全的需要","C":"自我实现的需要","D":"爱与归属的需要"},"a":"C","e":"马斯洛需要层次由低到高为生理、安全、爱与归属、尊重、自我实现,最高层次为自我实现的需要。"},{"i":"2024_4_single_16","t":"single","s":"根据艾瑞克森的心理社会发展学说,幼儿期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"主动对内疚","B":"勤奋对自卑","C":"自主对羞愧或疑虑","D":"自我统一对角色混乱"},"a":"C","e":"幼儿期(18个月~3岁)发展的危机是自主对羞愧或疑虑;主动对内疚属学龄前期,勤奋对自卑属学龄期,自我统一对角色混乱属青春期。"},{"i":"2024_4_single_17","t":"single","s":"沟通双方同时充当信息发送者和接收者的角色,积极互动,体现了人际沟通的","c":"护患关系与人际沟通","sc":1,"o":{"A":"双向性","B":"情景性","C":"统一性","D":"整体性"},"a":"A","e":"人际沟通的双向性指沟通双方既作为信息发出者、也作为接收者,相互积极互动。"},{"i":"2024_4_single_18","t":"single","s":"两人非常信任,交往较频繁,可进行推心置腹的交流,其心理距离是","c":"护患关系与人际沟通","sc":1,"o":{"A":"负一级","B":"正一级","C":"正二级","D":"正三级"},"a":"D","e":"心理距离正三级关系比作好友,双方非常信任、交往较频繁、交流推心置腹,可袒露部分隐私。"},{"i":"2024_4_single_19","t":"single","s":"下列关于文化休克影响因素的描述正确的是","c":"文化和护理","sc":1,"o":{"A":"文化休克程度与文化差异的大小成反比","B":"年龄越大,越容易适应新的文化模式","C":"身心健康的人应对能力强于身心衰弱的个体","D":"儿童应对文化休克的困难较多"},"a":"C","e":"身心健康者应对文化冲突的能力强于身心衰弱者;文化休克程度与文化差异成正比,年龄越大越难适应,儿童适应较快、困难较少。"},{"i":"2024_4_multi_22","t":"multi","s":"下列属于文化休克临床表现的有","c":"文化和护理","sc":2,"o":{"A":"坐立不安、失眠、疲乏","B":"缺乏自信、忧虑","C":"思维过于活跃","D":"躲避、注意力和控制缺陷","E":"胃肠功能减退"},"a":"ABDE","e":"坐立不安失眠疲乏为焦虑生理表现,缺乏自信忧虑为焦虑情感表现,躲避注意力和控制缺陷为恐惧表现,胃肠功能减退为沮丧生理表现;文化休克时认知表现为思想不能集中而非思维过于活跃。"},{"i":"2024_4_multi_24","t":"multi","s":"影响个体自理活动能力的因素有","c":"护理专业理论及模式","sc":2,"o":{"A":"年龄","B":"发展状态","C":"习俗","D":"生活方式","E":"健康状况"},"a":"ABCDE","e":"影响个体自理活动和能力的因素除年龄、发展状态和健康状况外,还包括家庭和社会的文化、信仰、习俗、生活方式等。"},{"i":"2024_4_fill_26","t":"fill","s":"南丁格尔于______年,在英国伦敦的圣多马医院开办了第一所护士学校。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案:1860。","e":""},{"i":"2024_4_fill_27","t":"fill","s":"法律的核心范畴是权力、______和义务。","c":"护理伦理与法律","sc":1,"at":"参考答案:权利。","e":""},{"i":"2024_4_fill_29","t":"fill","s":"沟通的初级阶段是______。","c":"护患关系与人际沟通","sc":1,"at":"参考答案:礼节性沟通。","e":""},{"i":"2024_4_fill_30","t":"fill","s":"文化现象包括物质文化、精神文化和______。","c":"文化和护理","sc":1,"at":"参考答案:方式文化。","e":""},{"i":"2024_4_fill_31","t":"fill","s":"临床护理决策的模式包括服务对象决策模式、护理人员决策模式和______。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案:共同决策模式。","e":""},{"i":"2024_4_fill_32","t":"fill","s":"纽曼认为机体的防御功能包括基本结构、______、正常防御线和应变防御线。","c":"护理专业理论及模式","sc":1,"at":"参考答案:抵抗线(抵抗防御线)。","e":""},{"i":"2024_4_fill_33","t":"fill","s":"健康教育的干预策略一般可分为教育策略、社会策略、环境策略和______。","c":"健康教育","sc":1,"at":"参考答案:资源策略。","e":""},{"i":"2024_4_fill_34","t":"fill","s":"1964年______通过对悲哀过程的研究,提出了悲哀三阶段学说。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案:恩格尔(Engel)。","e":""},{"i":"2024_4_fill_35","t":"fill","s":"脑死亡包括大脑、中脑、小脑和______的不可逆死亡。","c":"临终关怀","sc":1,"at":"参考答案:脑干。","e":""},{"i":"2024_4_term_36","t":"term","s":"合作性护理功能","c":"护理学的发展及基本概念","sc":3,"at":"参考答案(要点):合作性护理功能(interdependent function)指护理人员必须与医疗小组其他人员密切配合及协作才能完成的护理功能,如与医师配合对服务对象进行诊断治疗、与营养师配合进行饮食指导、与理疗师配合指导康复训练等。","e":""},{"i":"2024_4_term_37","t":"term","s":"健康促进","c":"健康与疾病","sc":3,"at":"参考答案(要点):健康促进(health promotion)是指以健康教育为手段,促进人们控制和改善自身健康的过程,是促使人们维护和提高自身健康的过程;它不仅限于疾病预防,而是直接作用于影响健康的各种因素,运用多学科多手段增进人群健康,是连接健康教育与环境支持的综合策略。","e":""},{"i":"2024_4_term_38","t":"term","s":"成熟","c":"护理相关理论及模式","sc":3,"at":"参考答案(要点):成熟(maturation)指个体由遗传基因所决定、随年龄增长自然出现的身体结构和功能上的成长与发展过程,是成长发展的生理基础,受遗传因素制约,也受环境、学习及训练的影响;成熟与生长、发展共同构成个体成长发展的概念体系。","e":""},{"i":"2024_4_term_40","t":"term","s":"思维","c":"科学思维方法与临床护理决策","sc":3,"at":"参考答案(要点):思维(thinking)是人脑对客观事物间接的、概括的反映,是认识的高级阶段;它借助语言、表象或动作实现,能揭示事物的本质特征和内部联系,具有概括性、间接性、逻辑性和物质属性等基本特征。","e":""},{"i":"2024_4_short_41","t":"short","s":"简述奥瑞姆自理理论的主要内容。","c":"护理专业理论及模式","sc":5,"at":"参考答案(要点):奥瑞姆(Orem)自理理论由三部分组成:①自理学说:人都有自理需要,自理是人为维持生命、健康和完好状态而采取的有目的的活动,包括普遍性自理需要、发展性自理需要和健康不佳时的自理需要;②自理缺陷学说:当个体无法或不能独立完成自理时即存在自理缺陷,此时需要护理;③护理系统学说:根据自理缺陷程度分别采用完全补偿系统、部分补偿系统和支持-教育系统三种护理系统。","e":""},{"i":"2024_4_short_42","t":"short","s":"简述制定健康教育计划的步骤。","c":"健康教育","sc":5,"at":"参考答案(要点):制定健康教育计划一般包括:①评估需求(了解目标人群的健康状况、知识水平、学习需求及影响因素);②确定优先项目和明确问题(为什么要制订该计划、对影响健康的因素做出诊断);③确定健康教育目标(总目标和具体、可测量的行为目标);④制定干预策略和方法(教育、社会、环境、资源策略);⑤安排具体活动、时间、人员及资源预算;⑥实施计划并进行监测与评价,根据反馈不断修订。","e":""},{"i":"2024_4_short_43","t":"short","s":"简述护理程序的特征。","c":"护理程序","sc":5,"at":"参考答案(要点):护理程序具有7个特征:①目标性:以解决服务对象健康问题、促进健康为目标;②个体性:根据每位服务对象的具体情况制订护理措施;③系统性:是有组织、有计划的系统活动;④科学性:以护理学科及相关科学理论为基础;⑤动态性:随服务对象情况变化而不断调整;⑥互动性:护士与服务对象及其他医务人员密切合作;⑦普遍性:适用于各类服务对象和各种护理场景。","e":""},{"i":"2024_4_essay_46","t":"essay","s":"试述护理诊断排序时应遵循的原则。","c":"护理程序","sc":10,"at":"参考答案(要点):排列护理诊断顺序就是将所列出的护理诊断按重要性和紧迫性排出主次,一般分为首优、中优、次优问题,排序时应遵循以下原则:\n①按照马斯洛人类基本需要层次论排列:未满足的生理需要问题首先解决,将对生理功能平衡威胁最大的问题排在最前面,如对氧气的需要优先于对水的需要,对水的需要优先于对食物的需要。\n②注重服务对象的主观感受:在与治疗护理原则无冲突时,根据服务对象的价值观、生活方式及对健康问题的观点感受,与其协商,按其意愿优先解决其身心需要。\n③一般先解决现存问题:现存问题应优先解决;但潜在的和需协同处理的问题并非都不是首优问题,有时后者比前者更重要,如大面积烧伤休克期\"有体液不足的危险\"若不及时预防会危及生命,应列为首优问题。\n④护理诊断的先后顺序不是固定不变的,随病情变化而动态调整,威胁生命的问题解决、生理需要得到一定满足后,中优或次优问题可上升为首优问题;护士应结合理论知识和临床经验全面评估。","e":""},{"i":"2024_4_case_47","t":"case","s":"吴先生,男,65岁,新加坡华侨。在中国旅游期间因病就医,对住院过程很不适应,表现为孤独、退缩、多疑,甚至发怒。\n问题1:作为吴先生的责任护士,你认为他出现了哪种问题?\n问题2:为了提供更有效的跨文化护理措施,你需要提出哪些问题来评估患者的文化背景?","c":"文化和护理","sc":10,"at":"参考答案(要点):\n问题1:吴先生作为长期在异国文化中生活的华侨,到陌生的就医环境后出现孤独、退缩、多疑、发怒等表现,属于文化休克(culture shock),即生活在不同文化环境中的人,由于其文化背景与新环境差异较大而产生的紧张、焦虑及被剥夺感等精神综合征。\n问题2:评估患者文化背景可询问的问题包括:①您的国籍、民族及母语是什么?②您的文化传统、生活习惯和饮食禁忌有哪些?③您的宗教信仰是什么,有无特殊的宗教仪礼或饮食规定?④在就医、护理方面,您文化中对性别、年龄有何要求(如是否希望同性护士护理)?⑤您对疾病、治疗和护理有何看法和期望?⑥您在家中由谁做决定、有哪些主要亲属可参与照护?⑦您能否用汉语/英语沟通,有无翻译需求?⑧您对医院环境、作息制度有哪些不适应之处?据此提供与文化相适应的护理,必要时采取文化关怀保存、文化关怀调适或文化关怀重建措施。","e":""}]},{"key":"2024_10","name":"2024年10月","qs":[{"i":"2024_10_single_1","t":"single","s":"护理人员按照医师的医嘱对服务对象实施的护理,属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"独立性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"依赖性护理功能"},"a":"D","e":"按医师处方或医嘱实施的护理(如遵医嘱给药)属依赖性护理功能。"},{"i":"2024_10_single_2","t":"single","s":"莱宁格「日出模式」第四层的主要含义是","c":"文化和护理","sc":1,"o":{"A":"显示不同文化背景和环境下的文化关怀形态以及文化关怀表达方式","B":"描述了文化关怀、世界观与文化社会结构及其组成因素","C":"揭示了护理关怀的决策和行为","D":"阐述了个体、家庭、群体、社区或机构的不同健康系统及其相互影响"},"a":"C","e":"日出模式Ⅳ级为护理关怀决策和行为层,通过文化关怀保存、调适、重建展开。"},{"i":"2024_10_single_3","t":"single","s":"下列关于西方礼仪文化的描述正确的是","c":"文化和护理","sc":1,"o":{"A":"崇尚群体本位的价值理念","B":"保持和谐,不走极端","C":"主张谦虚,以和为贵","D":"鼓励个人欲望的满足和个性张扬"},"a":"D","e":"西方文化崇尚个人本位,鼓励个人欲望满足和个性张扬;A、B、C属中国传统文化特征。"},{"i":"2024_10_single_4","t":"single","s":"下列关于文化休克发展过程的描述正确的是","c":"文化和护理","sc":1,"o":{"A":"兴奋期是文化休克表现最重的一期","B":"兴奋期一般会持续几个星期到数月","C":"意识期表现为有很强的愿望接受当地的生活习惯","D":"在接受期回到旧环境不会出现文化休克"},"a":"B","e":"兴奋期(蜜月期)一般持续几星期到数月;意识期才是表现最重、最难度过的一期;回到旧环境反而会重新经历文化休克。"},{"i":"2024_10_single_5","t":"single","s":"不同组织部位的炎症表现大都有红、肿、热、痛、功能障碍的病理改变,这个特征体现了思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"概括性","B":"间接性","C":"逻辑性","D":"物质性"},"a":"A","e":"思维的概括性是指把同一类事物的共同特征和本质属性抽取出来加以概括,从不同部位炎症的共同表现得出一般规律即概括性。"},{"i":"2024_10_single_6","t":"single","s":"对护理对象健康感知与健康管理型态的评估属于护理评估内容中的","c":"护理程序","sc":1,"o":{"A":"一般资料","B":"生活状况及自理程度","C":"健康检查","D":"心理社会方面的资料"},"a":"B","e":"按教材,生活状况及自理程度包括饮食、睡眠休息、排泄、健康感知与管理、活动与运动型态。"},{"i":"2024_10_single_7","t":"single","s":"下列关于护理诊断的描述正确的是","c":"护理程序","sc":1,"o":{"A":"护理诊断描述的是人类的健康问题或生命过程中的反应","B":"护理诊断是对个体病理生理变化的一种临床判断","C":"一般情况下每个护理对象只有一个护理诊断","D":"护理诊断的决策者是医生和护士"},"a":"A","e":"护理诊断是关于个人、家庭或社区对现存或潜在健康问题/生命过程反应的临床判断,由护士独立决策;B描述的是医疗诊断,C、D错误。"},{"i":"2024_10_single_8","t":"single","s":"根据纽曼保健系统理论,在进行二级预防时,护理人员应","c":"护理专业理论及模式","sc":1,"o":{"A":"采取措施避免压力的打击","B":"积极处理出现的症状,增强抵抗防线","C":"使系统重获稳定状态","D":"增强应变防线的抵抗能力"},"a":"B","e":"二级预防适用于压力源已穿过正常防御线、出现症状时,重点是早期发现、早期治疗、增强抵抗防线。"},{"i":"2024_10_single_9","t":"single","s":"根据护理理论着重点的不同,奥瑞姆(Orem)的自理理论属于","c":"护理专业理论及模式","sc":1,"o":{"A":"以需要及问题为中心的护理理论","B":"以系统为中心的护理理论","C":"以护患关系为中心的护理理论","D":"以能量源为中心的护理理论"},"a":"A","e":"奥瑞姆自理理论以护理程序为中心研究如何满足自理需要、解决问题,属以需要及问题为中心的理论。"},{"i":"2024_10_single_10","t":"single","s":"人觉察到自身有某种疾病而去寻求科学可靠的医疗帮助的行为属于","c":"健康与疾病","sc":1,"o":{"A":"保健行为","B":"预警行为","C":"求医行为","D":"遵医行为"},"a":"C","e":"察觉到患病后主动寻求医疗帮助属求医行为。"},{"i":"2024_10_single_13","t":"single","s":"悲哀在认知方面的反应,可表现为","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"痛苦、愤怒、焦虑","B":"头疼、失眠","C":"心不在焉、健忘","D":"睹物思情、行为怪异"},"a":"C","e":"认知方面表现为神不守舍、心不在焉、健忘、思维不能集中;A属情感,B属生理,D属行为。"},{"i":"2024_10_single_14","t":"single","s":"皮亚杰把人的智力发育分为4个阶段,10~12岁儿童处于","c":"护理相关理论及模式","sc":1,"o":{"A":"感觉运动期","B":"前运思期","C":"具体运思期","D":"形式运思期"},"a":"D","e":"形式运思期为10~12岁以后,从具体思维转向抽象思维。"},{"i":"2024_10_single_15","t":"single","s":"自卑的产生,源于下列某一种需要没有得到满足,这种需要指的是","c":"护理相关理论及模式","sc":1,"o":{"A":"生理的需要","B":"自尊的需要","C":"安全的需要","D":"情绪的需要"},"a":"B","e":"自卑是对自己缺乏认可,源于尊重(自尊)的需要未得到满足。"},{"i":"2024_10_single_16","t":"single","s":"一般住院病人最先应被满足的生理需要是","c":"护理相关理论及模式","sc":1,"o":{"A":"水分","B":"睡眠","C":"营养","D":"氧气"},"a":"D","e":"氧气是最先应满足的生理需要,尤其危重病人须迅速评估缺氧原因并立即处理。"},{"i":"2024_10_single_17","t":"single","s":"病人说:「我伤口疼,是不是感染了?」属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"礼节性沟通","B":"陈述性沟通","C":"分享性沟通","D":"情感性沟通"},"a":"C","e":"除陈述事实外还交流个人想法和判断(担心是否感染),属分享性沟通。"},{"i":"2024_10_single_18","t":"single","s":"个体对他人的心理状态、行为动机和意向做出的推测与判断的过程,称为","c":"护患关系与人际沟通","sc":1,"o":{"A":"社会认知","B":"社会推断","C":"社会评价","D":"人际判断"},"a":"A","e":"社会认知是个体对他人的心理状态、行为动机和意向做出推测与判断的过程。"},{"i":"2024_10_single_19","t":"single","s":"人际关系的双方相互间的赞同与接纳,获得心理上的愉快及满足感,此种吸引称为","c":"护患关系与人际沟通","sc":1,"o":{"A":"相近吸引","B":"相悦吸引","C":"相容吸引","D":"相补吸引"},"a":"B","e":"相悦吸引指双方相互赞同接纳、彼此欣赏,获得心理上的愉快与满足。"},{"i":"2024_10_single_20","t":"single","s":"护士对已确诊为癌症的病人讲:「不要担心,现在的医学很发达,你的病是可以治好的。」此护士的沟通错误是","c":"护患关系与人际沟通","sc":1,"o":{"A":"突然改变话题","B":"主观说教","C":"言行不一","D":"虚假的保证"},"a":"D","e":"对已确诊癌症病人轻描淡写说「可以治好」,是不切实际的虚假保证,使病人感到不被理解。"},{"i":"2024_10_multi_21","t":"multi","s":"指导-合作型护患关系模式的特点有","c":"护患关系与人际沟通","sc":2,"o":{"A":"护患双方有同等的主动性和权力","B":"护患双方存在微弱的心理差位","C":"护理人员在护患关系中占主导地位","D":"护士教会患者做什么","E":"以生物医学模式及疾病的护理为主导思想"},"a":"BCD","e":"指导-合作型:护士主导、病人主动配合,心理微弱差位,特征是「护士教会病人做什么」;A是共同参与型,E是主动-被动型。"},{"i":"2024_10_multi_23","t":"multi","s":"健康教育专题讲座的优点包括","c":"健康教育","sc":2,"o":{"A":"容易组织","B":"适用面广","C":"有利于学习者主动学习","D":"有利于态度和行为的改变","E":"能在有效的时间内传递大量、系统的知识"},"a":"ABE","e":"专题讲座优点是易组织、适用面广、能在有限时间传递大量系统知识;C、D是讨论法的优点。"},{"i":"2024_10_fill_26","t":"fill","s":"健康教育的程序包括健康教育评估、健康教育计划、______和健康教育评价四个步骤。","c":"健康教育","sc":1,"at":"参考答案:健康教育干预(实施)。","e":""},{"i":"2024_10_fill_27","t":"fill","s":"医疗过失行为责任依其程度可分为______、主要责任、次要责任和轻微责任。","c":"护理伦理与法律","sc":1,"at":"参考答案:完全责任。","e":""},{"i":"2024_10_fill_28","t":"fill","s":"疾病不仅是体内的病理过程,而且是______适应的失败。","c":"健康与疾病","sc":1,"at":"参考答案:内外环境(机体与外界环境)。","e":""},{"i":"2024_10_fill_29","t":"fill","s":"认知形成过程的三个主要成分包括认知者、______及交往的情景。","c":"护患关系与人际沟通","sc":1,"at":"参考答案:认知对象。","e":""},{"i":"2024_10_fill_30","t":"fill","s":"文化现象包括人们活动的______、精神产品以及活动方式本身。","c":"文化和护理","sc":1,"at":"参考答案:物质产品(物质文化)。","e":""},{"i":"2024_10_fill_32","t":"fill","s":"罗伊创立的适应理论由输入、控制、______、输出和反馈5部分组成。","c":"护理专业理论及模式","sc":1,"at":"参考答案:效应器。","e":""},{"i":"2024_10_fill_33","t":"fill","s":"科尔伯格提出了三级六段的______理论。","c":"护理相关理论及模式","sc":1,"at":"参考答案:道德发展。","e":""},{"i":"2024_10_fill_34","t":"fill","s":"悲哀主要分为两大类,即习俗性悲哀和______。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案:预感性悲哀。","e":""},{"i":"2024_10_fill_35","t":"fill","s":"非逻辑思维包括______和直觉思维。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案:形象思维。","e":""},{"i":"2024_10_term_37","t":"term","s":"护理道德","c":"护理伦理与法律","sc":3,"at":"参考答案(要点):护理道德是一种职业道德,是护理人员在执业过程中应遵循的、根据护理工作特殊性、以善恶为标准、用以调节护理人员与其他人员及社会之间关系的行为规范和道德意识的总和。","e":""},{"i":"2024_10_term_39","t":"term","s":"心理方位","c":"护患关系与人际沟通","sc":3,"at":"参考答案(要点):心理方位(psychological position)是人际交往双方在互动过程中产生的心理上的主导性及权威性的差异,是评价及衡量人际关系的基本指标之一,包括心理差位关系和心理等位关系两种状态。","e":""},{"i":"2024_10_short_41","t":"short","s":"希望作为一种精神动力,具有哪些特征?","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案(要点):德佛特及马妥琦尔认为希望有六方面特征:①情感性(情意性):包含感觉和情绪成分;②认知性:涉及感知、思维、想象、判断等认知过程;③行为性:为实现希望所付诸的行动;④依附性:期望融入集体、获得归属感;⑤时空性:所希望事件在时间和空间上的属性;⑥情景性:与个人生活背景或经历息息相关,常衍生于曾经或正在经历的丧失。","e":""},{"i":"2024_10_short_42","t":"short","s":"简述评判性思维的核心认知技能。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案(要点):评判性思维的核心认知技能包括六种:①解释:分类、解析意义、阐明意义;②分析:检查不同观点、确认争论、分析争论;③评估:评估主张、评估争议;④推论:循证、推测可能性、作结论;⑤说明(陈述):陈述结论、证实步骤、叙述争议;⑥自我调控:自我检查、自我矫正。","e":""},{"i":"2024_10_short_43","t":"short","s":"简述常见的病人角色适应不良问题。","c":"健康与疾病","sc":5,"at":"参考答案(要点):常见类型有:①角色行为冲突:意识到有病却不能接受病人角色,愤怒焦虑;②角色行为强化:安于病人角色、退缩依赖、害怕出院,多见于恢复期;③角色行为缺如:不承认自己有病,是心理防御;④角色行为异常:久病重病者悲观、厌倦甚至自杀;⑤角色行为消退:已适应病人角色后又重新承担原有其他角色。","e":""},{"i":"2024_10_case_47","t":"case","s":"患者张先生,男,40岁,平素性情急躁,嗜好吸烟、高盐高脂饮食,三年前被诊断为高血压,此次张先生与儿子生气后,意识不清,急诊入院,测血压220/110mmHg,医生给予静点降压药物,要求患者绝对卧床休息。问题:根据奥瑞姆的自理理论及患者的病情,护士应如何为张先生选择护理系统?","c":"护理专业理论及模式","sc":10,"at":"参考答案(要点):奥瑞姆提出三种护理系统:①完全补偿系统:适用于服务对象没有自理能力、所有自理需要完全依靠护士满足的情况,又分身心完全不能自理、身体不能自理但有意识、心理精神活动不能满足生命需要三种;②部分补偿系统:适用于服务对象有部分自理能力,但需护士提供不同程度帮助才能满足基本需要;③支持教育系统:适用于服务对象有自理能力,但需护士指导、教育或提供最佳环境才能达到自理最佳水平。\n结合本病例:张先生高血压急症、意识不清、需绝对卧床、静点降压药,目前无能力满足进食、排泄、活动、安全等治疗性自理需要,应首先选择完全补偿系统,由护士全面满足其氧气、血压监测、用药、皮肤护理、排泄、饮食等自理需要;待意识转清、病情稳定、可床上活动后,转为部分补偿系统,由护士与患者共同完成部分自理活动;出院前及恢复期,通过健康教育改变其急躁性格、吸烟、高盐高脂饮食等不良生活方式,指导其自我监测血压、服药与康复,过渡到支持教育系统,提高其自我护理能力。","e":""}]},{"key":"2025_4","name":"2025年4月","qs":[{"i":"2025_4_single_1","t":"single","s":"根据西方对护理学知识体系的认识,护理艺术、技能或护理行为方面的知识称为","c":"护理学的发展及基本概念","sc":1,"o":{"A":"伦理学知识","B":"科学知识","C":"直感知识","D":"美学知识"},"a":"D","e":"美学知识(esthetics)即护理艺术、技能或护理行为方面的知识;科学知识来自实验方法,伦理学知识研究职业道德,直感知识来自个人直觉。"},{"i":"2025_4_single_3","t":"single","s":"根据马斯洛的人类基本需要理论,下列应首先得到满足的需要是","c":"护理相关理论及模式","sc":1,"o":{"A":"尊重的需要","B":"安全的需要","C":"自我实现的需要","D":"爱与归属的需要"},"a":"B","e":"需要层次由低到高为生理、安全、爱与归属、尊重、自我实现;备选项中最低、应首先满足的是安全的需要。"},{"i":"2025_4_single_5","t":"single","s":"根据艾瑞克森的心理社会发展学说,中年期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"完美无憾对悲观绝望","B":"亲密对孤独","C":"创造对停滞","D":"自我统一对角色混乱"},"a":"C","e":"中年期(35~65岁)发展的危机是创造对停滞;完美无憾对悲观绝望属老年期,亲密对孤独属成年早期,自我统一对角色混乱属青春期。"},{"i":"2025_4_single_7","t":"single","s":"某病人由于过敏性休克而急诊入院,在入院初期应采用的护患关系模式是","c":"护患关系与人际沟通","sc":1,"o":{"A":"主动-被动型","B":"指导-合作型","C":"共同参与型","D":"服务-指导型"},"a":"A","e":"主动-被动型主要适用于昏迷、休克、全身麻醉、严重创伤及精神病等无自主意识的服务对象;过敏性休克入院初期病人意识障碍,适用该模式。"},{"i":"2025_4_single_8","t":"single","s":"护士对一位病人说:\"你得病是事实,焦虑会影响疾病康复,我要是你,现在会积极配合医生治病。\"此护士的沟通错误是","c":"护患关系与人际沟通","sc":1,"o":{"A":"突然改变话题","B":"主观说教","C":"言行不一","D":"急于做出结论"},"a":"B","e":"以\"如果我是你\"的方式对病人进行评判、说教,使病人难以表达真实情感,属主观判断(说教)性沟通错误。"},{"i":"2025_4_single_9","t":"single","s":"佛教中国化体现了中国文化的","c":"文化和护理","sc":1,"o":{"A":"多样性","B":"包容性","C":"连续性","D":"统一性"},"a":"B","e":"中国文化能以博大胸怀对待外来文化、兼收并蓄,佛教中国化及儒释道合流正体现了中国文化的包容性。"},{"i":"2025_4_single_10","t":"single","s":"莱宁格\"日出模式\"第三层的主要含义是","c":"文化和护理","sc":1,"o":{"A":"显示不同文化背景和环境下的文化关怀型态以及文化关怀表达方式","B":"描述了文化关怀、世界观与文化社会结构及其组成因素","C":"阐述了个体、家庭、群体、社区或机构的不同健康系统及其相互影响","D":"解释了护理关怀的决策和行为"},"a":"C","e":"日出模式Ⅲ级(第三层)为健康系统层,阐述个体、家庭、群体、社区或机构的不同健康系统及其相互影响;B为Ⅰ级,A为Ⅱ级,D为Ⅳ级。"},{"i":"2025_4_single_11","t":"single","s":"证据来自于专家个人意见,属于循证护理证据分级中的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"Ⅱ级","B":"Ⅲ级","C":"Ⅳ级","D":"Ⅴ级"},"a":"D","e":"循证护理证据按论证强度由Ⅰ级至Ⅴ级递减,Ⅴ级证据为专家个人意见、个例报告。"},{"i":"2025_4_single_12","t":"single","s":"护理人员与护理对象、其他医务人员密切合作,以全面满足护理对象的需求,体现了护理程序的","c":"护理程序","sc":1,"o":{"A":"互动性","B":"系统性","C":"科学性","D":"普遍性"},"a":"A","e":"护理程序的特征包括目标性、个体性、系统性、科学性、动态性、互动性、普遍性;护士与服务对象及其他医务人员密切协作体现互动性。"},{"i":"2025_4_single_13","t":"single","s":"下列关于护理诊断的叙述,正确的是","c":"护理程序","sc":1,"o":{"A":"护理诊断描述的是人类的健康问题或生命过程中的反应","B":"护理诊断是护理人员为达到预期结果选择的护理措施","C":"护理诊断描述的健康问题必须通过医护配合才能得到解决","D":"护理诊断所描述的必须是护理对象现存的护理问题"},"a":"A","e":"护理诊断描述的是人类的健康问题或生命过程中的反应;护理措施是计划部分,需医护配合才能解决的是合作性问题,护理诊断还包括潜在的、健康的等类型。"},{"i":"2025_4_single_14","t":"single","s":"根据护理理论的着重点不同,罗杰斯的护理理论属于","c":"护理专业理论及模式","sc":1,"o":{"A":"以需要及问题为中心的护理理论","B":"以护患关系为中心的护理理论","C":"以系统为中心的护理理论","D":"以能量源为中心的护理理论"},"a":"D","e":"以能量源为中心的理论认为人是一个能量源或能量系统,代表人物包括罗杰斯(Rogers)。"},{"i":"2025_4_single_15","t":"single","s":"下列符合奥瑞姆对自理概念的阐述的是","c":"护理专业理论及模式","sc":1,"o":{"A":"自理是指进食、沐浴卫生、如厕、修饰等日常生活活动","B":"自理是有目的、有意识的活动","C":"自理能力是人天生就具备的","D":"自理能力具有稳定性,不易受其他因素影响"},"a":"B","e":"奥瑞姆认为自理活动是个体为满足自身需要而采取的有目的行动,是有目的、有意识的活动;自理能力随生命阶段和健康状况变化、经实践学习发展,并非天生稳定不变。"},{"i":"2025_4_single_16","t":"single","s":"护理系统属于","c":"护理程序","sc":1,"o":{"A":"自然系统","B":"社会系统","C":"封闭系统","D":"开放系统"},"a":"D","e":"护理程序作为一个开放系统,通过输入、输出、反馈与周围环境不断相互作用。"},{"i":"2025_4_single_19","t":"single","s":"护理人员观察到病人呼吸浅快、呼气延长、发绀,判断出病人存在呼吸困难,这个过程体现了思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"概括性","B":"间接性","C":"逻辑性","D":"物质性"},"a":"B","e":"思维的间接性指人借助已有知识经验或媒介对客观事物进行间接认识;临床上护士依据体征判断病情主要依靠思维的间接性。"},{"i":"2025_4_multi_22","t":"multi","s":"下列关于需要的描述,正确的有","c":"护理相关理论及模式","sc":2,"o":{"A":"需要是由未满足的要求引起的内部紧张状态","B":"需要是人对某种目标的渴求或欲望","C":"需要是个体行为的动力性源泉","D":"需要能够维持生命的延续","E":"需要能够提高物质和精神生活水平"},"a":"ABCDE","e":"需要是客观需求在人脑中的反映、是个体心理活动与行为的基本动力(动力性源泉),由未满足引起内部紧张,表现为对目标的渴求或欲望,并具有维持生命延续、促进生长和提高物质精神生活水平的作用。"},{"i":"2025_4_fill_26","t":"fill","s":"社区护理的工作重点是社区卫生、心理卫生以及与______有关的活动。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案:预防保健。","e":""},{"i":"2025_4_fill_27","t":"fill","s":"健康不但是没有疾病和身体缺陷,还要有完整的生理、心理状态和______。","c":"健康与疾病","sc":1,"at":"参考答案:良好的社会适应能力。","e":""},{"i":"2025_4_fill_28","t":"fill","s":"医疗过失责任依其程度可分为______、主要责任、次要责任和轻微责任。","c":"护理伦理与法律","sc":1,"at":"参考答案:完全责任。","e":""},{"i":"2025_4_fill_29","t":"fill","s":"被誉为跨文化护理和人类关怀理论创始人的是______。","c":"文化和护理","sc":1,"at":"参考答案:莱宁格(莱林格,Leininger)。","e":""},{"i":"2025_4_fill_30","t":"fill","s":"护理计划的过程包括排列护理计划顺序、______、制订护理措施及书写护理计划。","c":"护理程序","sc":1,"at":"参考答案:确定预期目标。","e":""},{"i":"2025_4_fill_32","t":"fill","s":"健康教育的发展可分为医学阶段、______和社会环境阶段。","c":"健康教育","sc":1,"at":"参考答案:行为阶段。","e":""},{"i":"2025_4_fill_33","t":"fill","s":"丧失按时限可分为暂时性丧失和______。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案:永久性丧失。","e":""},{"i":"2025_4_fill_34","t":"fill","s":"心理学家罗斯博士将临终病人的心理活动划分为否认期、愤怒期、______、沮丧期、接受期五个发展阶段。","c":"临终关怀","sc":1,"at":"参考答案:磋商期(协议期/讨价还价期)。","e":""},{"i":"2025_4_fill_35","t":"fill","s":"道德的三要素是道德意识、______和道德活动。","c":"护理伦理与法律","sc":1,"at":"参考答案:道德关系。","e":""},{"i":"2025_4_term_39","t":"term","s":"逻辑思维","c":"科学思维方法与临床护理决策","sc":3,"at":"参考答案(要点):逻辑思维是在感性认识基础上,运用概念、判断、推理等形式对客观事物间接、概括的反映,是科学思维最普通、最基本的形式,遵循形式逻辑和辩证逻辑规律。","e":""},{"i":"2025_4_short_41","t":"short","s":"在循证护理实践中,如何评价证据?","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案(要点):评价证据一般从三方面进行:①科学性(真实性):研究设计是否合理、样本是否充分、分组是否随机、统计方法是否正确、结果是否可靠;②可行性:该证据在当前护理场景、人力、物力及服务对象条件下是否能够实施;③适宜性和临床意义:证据是否适合本服务对象的具体情况、是否有临床应用价值和重要性。据此对证据的真实性、可靠性和实用性进行综合评判,决定是否用于指导护理实践。","e":""},{"i":"2025_4_short_43","t":"short","s":"简述健康教育的相关理论。","c":"健康教育","sc":5,"at":"参考答案(要点):健康教育常用相关理论包括:①知信行模式(KABP):将行为改变分为获取知识、产生信念、形成行为三个连续过程;②健康信念模式(HBM):认为个体是否采取健康行为取决于对疾病易感性和严重性的认知、对行为获益与障碍的认知及自我效能;③健康促进模式(Pender):强调个体认知、行为特定因素及人际因素对健康行为的影响;此外还有格林模式(PRECEDE-PROCEED)等,用于指导健康教育诊断、计划与评价。","e":""},{"i":"2025_4_short_44","t":"short","s":"简述临终病人家属的需要。","c":"临终关怀","sc":5,"at":"参考答案(要点):临终病人家属的主要需要包括:①了解病情及预后、获得相关照护知识和技能的需要;②获得情感支持、减轻内疚和悲哀情绪的需要;③维持家庭正常生活、解决实际困难的需要;④陪伴和照顾病人、尽到责任的需要;⑤丧亲后得到安慰和帮助、顺利度过居丧期的需要。护理人员应给予家属信息、情感和实际支持。","e":""},{"i":"2025_4_short_45","t":"short","s":"在临床工作中,哪些情况不属于医疗事故?","c":"护理伦理与法律","sc":5,"at":"参考答案(要点):根据《医疗事故处理条例》,下列情况不属于医疗事故:①在紧急情况下为抢救垂危病人生命而采取紧急医学措施造成不良后果的;②在医疗活动中由于病人病情异常或体质特殊而发生医疗意外的;③在现有医学科学技术条件下,发生无法预料或不能防范的不良后果的;④无过错输血感染造成不良后果的;⑤因病方原因延误诊疗导致不良后果的;⑥因不可抗力造成不良后果的。","e":""},{"i":"2025_4_essay_46","t":"essay","s":"试述护理诊断与合作性问题及医疗诊断的区别。","c":"护理程序","sc":10,"at":"参考答案(要点):\n①护理诊断与合作性问题的区别:护理诊断是护理人员独立采取措施能够解决的问题;合作性问题是需要护士与其他健康保健人员尤其是医生共同合作干预解决的问题,其陈述方式为\"潜在并发症:××\";对合作性问题,护士主要是监测病情、配合医生处理,而不能独立预防和解决。\n②护理诊断与医疗诊断的区别:①决策者不同:护理诊断由护士作出,医疗诊断由医生作出;②描述对象不同:护理诊断描述的是人类对健康问题或生命过程的反应,医疗诊断描述的是疾病本身的病理变化;③职责范围不同:护理诊断在护理职能范围内可通过护理措施解决或缓解,医疗诊断对应治疗方案、需医护配合;④数目和变化不同:护理诊断可随病人反应动态变化、可有多个,医疗诊断在疾病过程中相对稳定;⑤预期结果不同:护理诊断指向护理目标和病人反应的改变,医疗诊断指向疾病的治愈或转归。\n三者共同构成对病人健康问题的全面判断,护士应明确各自范畴、不混淆、不越权。","e":""},{"i":"2025_4_case_47","t":"case","s":"吴女士,55岁,美籍华人。在中国出差期间因肺炎就医,对住院过程很不适应,表现为坐立不安、失眠、忧虑,甚至发怒。作为吴女士的责任护士,你认为她出现了哪种问题?为了更有效地提供跨文化护理措施,你可以提出哪些问题来正确评估患者的文化背景?","c":"文化和护理","sc":10,"at":"参考答案(要点):\n一、判断问题:吴女士长期生活在异国文化环境中,到陌生的就医环境后出现坐立不安、失眠、忧虑、发怒等表现,属于文化休克(culture shock),即由熟悉文化环境进入陌生文化环境后因文化差异而产生的紧张、焦虑、适应障碍综合征。\n二、评估患者文化背景可提出的问题:①您的国籍、民族、母语是什么,是否需要翻译?②您的宗教信仰如何,有无饮食禁忌、礼拜或特殊仪礼?③您的生活习惯、饮食偏好有哪些?④您对性别、年龄有无要求(如希望同性护士护理)?⑤您如何看待疾病、就医和治疗,有何期望?⑥在您家中由谁做医疗决定,有哪些主要亲属可参与照护?⑦您对医院作息、探视制度有哪些不适应?⑧您对目前的治疗护理有哪些顾虑?\n据此采取与文化相适应的护理措施(文化关怀保存、调适或重建),缓解其文化休克。","e":""}]},{"key":"2025_10","name":"2025年10月","qs":[{"i":"2025_10_single_1","t":"single","s":"护理人员应用自己的专业知识及技能来决定护理措施及护理服务,属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"独立性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"依赖性护理功能"},"a":"A","e":"护理人员用专业知识技能自行决定护理措施属独立性护理功能。"},{"i":"2025_10_single_2","t":"single","s":"健康系统层属于日出模式的","c":"文化和护理","sc":1,"o":{"A":"Ⅰ级","B":"Ⅱ级","C":"Ⅲ级","D":"Ⅳ级"},"a":"C","e":"日出模式Ⅲ级为健康系统层,阐述一般关怀系统和专业关怀系统及其相互影响。"},{"i":"2025_10_single_4","t":"single","s":"用护理常规引出对某一位具体服务对象的护理措施,这种科学思维的方法是","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"观察","B":"归纳","C":"演绎","D":"分析"},"a":"C","e":"演绎是从一般性知识引出特殊或个别性知识,如用妇产科护理常规引出对某具体病人的护理方法。"},{"i":"2025_10_single_5","t":"single","s":"关于护理目标的叙述,正确的是","c":"护理程序","sc":1,"o":{"A":"护理目标的主语可以是护理对象的生理功能和机体的一部分","B":"每个护理目标都必须含有条件状语","C":"叙述护理目标时,不可以省略主语","D":"护理目标制定得越高越好"},"a":"A","e":"护理目标逻辑主语是服务对象,但语法主语可以是病人生理功能或机体一部分(如「病人体温3天内恢复正常」);条件状语、主语可省,目标应切实可行。"},{"i":"2025_10_single_6","t":"single","s":"下列关于潜在的护理诊断的描述,正确的是","c":"护理程序","sc":1,"o":{"A":"知识缺乏","B":"潜在并发症:压疮","C":"有感染的危险","D":"母乳喂养有效"},"a":"C","e":"潜在的护理诊断用「有……的危险」描述,如有感染的危险;A是现存诊断,B不是规范NANDA诊断,D是健康的护理诊断。"},{"i":"2025_10_single_7","t":"single","s":"纽曼保健系统理论认为","c":"护理专业理论及模式","sc":1,"o":{"A":"机体抵抗线的完整与否是判断机体处于健康还是疾病的标志","B":"护理是护士与患者在护理情景中分享感知而进行的行动、反应和互动过程","C":"护理可以通过改变环境而促进机体的修复","D":"护理活动是控制压力源或增强人体各种防卫系统的功能"},"a":"D","e":"纽曼认为护理是帮助人减少压力源、扭转压力影响,通过三级预防控制压力源或增强防卫系统功能。"},{"i":"2025_10_single_8","t":"single","s":"在对护理学生进行护患沟通教育时,最好的教育方法是","c":"健康教育","sc":1,"o":{"A":"角色扮演法","B":"团体讨论法","C":"专题讲座法","D":"视听教材的应用"},"a":"A","e":"角色扮演法通过行为模仿使学生在扮演、观察、体验中设身处地学习沟通技巧,最适于护患沟通技能训练。"},{"i":"2025_10_single_9","t":"single","s":"个体逐步以理智面对丧失,组织悼念活动,内心恢复平静,属于悲哀过程的","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"震惊阶段","B":"修复重建阶段","C":"逐步认知阶段","D":"抑郁接受阶段"},"a":"B","e":"恩格尔悲哀三阶段中,修复重建阶段个体以理智面对丧失、参加悼念活动、内心逐渐恢复平静。"},{"i":"2025_10_single_10","t":"single","s":"下列属于失望行为表现的是","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"个体对未来的预见能力提高","B":"重新建立目标","C":"对自己及他人失去信心","D":"继续努力,争取实现目标"},"a":"C","e":"失望时个体表现为对自己及他人失去信心、行为退缩;A、B、D均为希望或积极应对表现。"},{"i":"2025_10_single_11","t":"single","s":"下列关于死亡过程的描述,正确的是","c":"临终关怀","sc":1,"o":{"A":"濒死期生命处于不可逆阶段","B":"生物学死亡期是死亡过程的最后阶段","C":"临床死亡期大脑已发生不可逆的变化","D":"尸斑是最先发生的尸体现象"},"a":"B","e":"死亡过程分濒死期、临床死亡期、生物学死亡期三期,生物学死亡期是最后阶段;濒死期生命尚可逆,临床死亡期大脑尚未不可逆变化,尸冷是最先发生的尸体现象。"},{"i":"2025_10_single_12","t":"single","s":"一癌症病人,不愿意承认自己的病情,仍坚持工作,这种情况属于","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"D","e":"不愿承认患病、不进入病人角色,是病人角色行为缺如,属心理防御表现。"},{"i":"2025_10_single_13","t":"single","s":"某护士未严格执行查对制度,误将青霉素当成链霉素注入病人体内,但未造成严重后果,这种过失属于","c":"护理伦理与法律","sc":1,"o":{"A":"医疗意外","B":"护理差错","C":"医疗责任事故","D":"医疗技术事故"},"a":"B","e":"护理差错指在护理工作中因责任心不强、违反操作规程等发生一般性错误,未造成严重不良后果;构成医疗事故须有法定人身损害后果。"},{"i":"2025_10_single_14","t":"single","s":"三级预防中最有效的预防是","c":"健康与疾病","sc":1,"o":{"A":"一级预防","B":"二级预防","C":"三级预防","D":"临床前期预防"},"a":"A","e":"一级预防(病因预防)是在疾病尚未发生时针对病因采取措施,是最积极、最有效的预防。"},{"i":"2025_10_single_15","t":"single","s":"病人在手术前要了解手术的有关注意事项,属于","c":"护理相关理论及模式","sc":1,"o":{"A":"安全的需要","B":"生理的需要","C":"自尊的需要","D":"刺激的需要"},"a":"A","e":"提供恰当的疾病及诊疗信息、耐心解答疑虑,以获得安全感,属安全的需要。"},{"i":"2025_10_single_17","t":"single","s":"恢复期的慢性病人,护患关系的基本模式应是","c":"护患关系与人际沟通","sc":1,"o":{"A":"主动-被动型","B":"指导-合作型","C":"共同参与型","D":"服务-指导型"},"a":"C","e":"共同参与型适用于慢性病且有一定文化知识者,双方有同等主动性和权利,病人是合作者、参与者和决策者。"},{"i":"2025_10_single_18","t":"single","s":"根据弗洛伊德的观点,下列性心理发展时期如果发展不顺利会造成强迫性人格的是","c":"护理相关理论及模式","sc":1,"o":{"A":"口欲期","B":"肛欲期","C":"性蕾期","D":"潜伏期"},"a":"B","e":"肛欲期(1~3岁)若排便训练过严或过松,人格发展固结,易形成吝啬、固执、整洁有序等强迫性人格特征。"},{"i":"2025_10_single_19","t":"single","s":"由于护士对服务对象的提问缺乏耐心,而引起的护患冲突,其原因属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"角色不明","B":"责任冲突","C":"权益差异","D":"理解分歧"},"a":"D","e":"护士缺乏耐心、回答过简,使病人对信息理解不一致,属理解分歧。"},{"i":"2025_10_multi_21","t":"multi","s":"下列属于健康测量指标的有","c":"健康与疾病","sc":2,"o":{"A":"医院设备的使用情况","B":"人均住房面积","C":"各种卫生服务利用情况","D":"生存质量","E":"出生率"},"a":"BCDE","e":"人均住房面积属社会经济指标,卫生服务利用属预防性卫生服务指标,出生率属健康状况指标,生存质量是综合指标;医院设备使用情况不是规范健康测量指标。"},{"i":"2025_10_multi_22","t":"multi","s":"关于需要各层次之间关系,下列描述正确的有","c":"护理相关理论及模式","sc":2,"o":{"A":"各种需要层次满足的顺序是固定的","B":"有些需要必须立即并持续地予以满足","C":"低层次需要的满足是高层次需要产生的基础","D":"当较低层次的需要基本得到满足后,高层次的需要才会出现","E":"层次越高的需要,其满足方式差异越大"},"a":"BCDE","e":"需要满足顺序并非固定不变;其余各项均为马斯洛需要层次之间关系的正确描述。"},{"i":"2025_10_multi_23","t":"multi","s":"超越式文化关怀理论的主要内容有","c":"文化和护理","sc":2,"o":{"A":"在护理人员与病人之间灌输忠诚于希望的理念对促进健康有积极意义","B":"加强通过接纳和认可他人这一理念的构建以达到自我实现目的","C":"护理人员必须识别和评价与病人的疾病和健康相关的环境状况","D":"赋予和延伸个人的意义,形成利他为乐的人生价值体系","E":"将关怀与治疗统一起来"},"a":"ABCD","e":"瓦森超越式文化关怀理论10因素中包括赋予延伸个人意义形成利他价值体系、灌输忠诚希望理念、接纳认可他人达自我实现、识别评价病人环境状况等;该理论主张将关怀与治疗区分开而非统一。"},{"i":"2025_10_fill_27","t":"fill","s":"法律的基本构成要素包括______、法律原则和法律概念。","c":"护理伦理与法律","sc":1,"at":"参考答案:法律规范(法律规则)。","e":""},{"i":"2025_10_fill_28","t":"fill","s":"护理计划的类型可分为______、住院护理计划和出院护理计划。","c":"护理程序","sc":1,"at":"参考答案:入院护理计划。","e":""},{"i":"2025_10_fill_30","t":"fill","s":"护理诊断由名称、定义、诊断依据和______四个部分组成。","c":"护理程序","sc":1,"at":"参考答案:相关因素。","e":""},{"i":"2025_10_fill_31","t":"fill","s":"护理评估的主要方法有交谈、______、体格检查、阅读资料等方法。","c":"护理程序","sc":1,"at":"参考答案:观察。","e":""},{"i":"2025_10_fill_32","t":"fill","s":"自理总需要包括一般性的自理需要、______及健康不佳时的自理需要。","c":"护理专业理论及模式","sc":1,"at":"参考答案:成长发展的自理需要。","e":""},{"i":"2025_10_fill_33","t":"fill","s":"护理理念的发展分为禁欲主义阶段、浪漫主义阶段、______和人本存在主义阶段。","c":"护理专业理论及模式","sc":1,"at":"参考答案:实用主义阶段。","e":""},{"i":"2025_10_fill_34","t":"fill","s":"保健教育过程模式由评估阶段、______和评价阶段组成。","c":"健康教育","sc":1,"at":"参考答案:执行(实施)阶段。","e":""},{"i":"2025_10_fill_35","t":"fill","s":"对大多数人来说,人生所面临的最大丧失可能是______。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案:至亲的死亡(痛失至亲)。","e":""},{"i":"2025_10_term_37","t":"term","s":"护理评价","c":"护理程序","sc":3,"at":"参考答案(要点):护理评价是将护理对象的健康状态与护理计划中预期目标进行比较并作出判断的过程,是护理程序的最后一步,可发现新问题、修订计划,使护理过程呈动态循环。","e":""},{"i":"2025_10_term_38","t":"term","s":"理论","c":"护理专业理论及模式","sc":3,"at":"参考答案(要点):理论是对自然、社会现象,按已知事实与知识,经由归纳、演绎或推理等方法,系统推论其相互关系、因果法则及原理的有组织、有系统的理性认识,由概念、定义、命题及现象间的关系组成。","e":""},{"i":"2025_10_short_41","t":"short","s":"简述个体面对压力源时产生的情绪反应。","c":"护理相关理论及模式","sc":5,"at":"参考答案(要点):个体面对压力源时主要产生情绪性反应:①焦虑:是最常见的情绪反应,表现为紧张、不安、急躁、担忧、手颤、出汗等;②恐惧:有明确来源的惧怕,表现为躲避、惊慌;③抑郁:情绪低落、悲观失望、兴趣减退;④愤怒:急躁、易激惹、攻击;⑤敌意、孤独、无助等;长期强烈情绪反应可损害神经、内分泌及免疫功能,导致心身疾病。","e":""},{"i":"2025_10_short_42","t":"short","s":"简述文化关怀的特点。","c":"文化和护理","sc":5,"at":"参考答案(要点):文化关怀具有多样性和统一性两方面特点:①多样性:同一文化内部或不同文化之间,关怀信念、关怀模式、价值观和关怀方式存在差异;②统一性:人类在关怀的意义、价值、标志和方式上具有相似性或共性。跨文化护理就是用符合文化、能被接受认可的价值观、信念和表达方式提供文化相适应的综合性帮助支持。","e":""},{"i":"2025_10_short_45","t":"short","s":"简述护理法规的基本内容。","c":"护理伦理与法律","sc":5,"at":"参考答案(要点):护理法规基本内容包括四部分:①总纲:阐明护理法的法律地位、立法根本目标、立法程序、护理工作宗旨;②护理教育部分:教育种类、专业设置、审批程序、办学标准、护生入学条件、学习考试程序;③护士注册部分:注册种类、机构、程序、授予资格;④护理服务部分:护理人员分类、职责范围、权利义务、管理系统、各专业工作规范及违规处理程序标准。","e":""},{"i":"2025_10_case_47","t":"case","s":"下列是某患者住院后护理评估收集到的资料:腹痛、心率120次/分、手术前精神紧张、希望有亲友来探望、对医院环境不熟悉、走路易摔倒、患者说「你们应该征求我意见」、患者担心住院影响工作。请根据马斯洛的需要层次理论对以上护理问题进行分类。","c":"护理相关理论及模式","sc":10,"at":"参考答案(要点):按马斯洛人类基本需要五层次分类:\n①生理的需要:腹痛(舒适度异常)、心率120次/分(生命体征异常),反映生理功能失衡,属最基本的生理需要未被满足。\n②安全的需要:对医院环境不熟悉、走路易摔倒(有受伤危险),反映病人对住院环境缺乏安全感,需提供安全环境、入院介绍、防跌倒措施。\n③爱与归属感的需要:希望有亲友来探望,反映病人渴望被关心、接纳和情感支持,需鼓励家属探视、建立良好护患关系。\n④尊重的需要:患者说「你们应该征求我意见」,反映病人希望被尊重、参与决策,需使用礼貌称呼、重视其意见、维护其自主权。\n⑤自我实现的需要:患者担心住院影响工作,反映其潜能发挥、理想实现受到疾病干扰,需在病情允许下帮助其继续学习/工作、为康复和重返工作创造条件。\n此外,手术前精神紧张属于心理应激,可跨安全及爱与归属等层次,护理时应整体评估、优先满足生理和安全需要,再逐层向上满足。","e":""}]}]},{"id":"research","name":"护理学研究","code":"03008","color":"#8b4aa8","icon":"🔬","wrongKey":"nursing_research_wrong_v1","papers":[{"key":"2016_10","name":"2016年10月","qs":[{"i":"2016_10_single_1","t":"single","s":"在进行问卷调查过程中被调查者可能会由于回答问卷时间长而产生疲劳感，此时研究带来的风险是","c":"绪论","sc":1,"o":{"A":"暂时的不适","B":"较严重的不适","C":"永久性伤害的可能","D":"无可预见的影响"},"a":"A","e":"要求填写问卷、参与面谈或花费额外时间精力所造成的疲劳、焦虑等随研究结束即消失，属最小风险，即暂时的不适。"},{"i":"2016_10_single_2","t":"single","s":"下列不属于知情同意的要素的是","c":"绪论","sc":1,"o":{"A":"信息的解释","B":"家属的知晓","C":"同意的能力","D":"信息的告知"},"a":"B","e":"知情同意的要素包括信息的告知、信息的解释、同意的能力及自愿同意；家属的知晓不是知情同意的必备要素。"},{"i":"2016_10_single_3","t":"single","s":"伦理审查委员会的人数不能少于","c":"绪论","sc":1,"o":{"A":"7","B":"6","C":"5","D":"4"},"a":"C","e":"伦理审查委员会(IRB)至少由5名具有不同文化、经济、教育、性别和种族背景的成员组成。"},{"i":"2016_10_single_4","t":"single","s":"硕士研究生论文属于的文献级别是","c":"医学信息的获取与利用","sc":1,"o":{"A":"一次文献","B":"二次文献","C":"三次文献","D":"零次文献"},"a":"A","e":"一次文献即原始文献，如期刊论文、学位论文、会议论文、研究报告等；硕士研究生论文属学位论文，为一次文献。"},{"i":"2016_10_single_5","t":"single","s":"在MEDLINE中检索文献时，欲查找某著者的地址，应该在MEDLINE中选择的字段是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AB","B":"AD","C":"TI","D":"PY"},"a":"B","e":"AD—Address of Author—著者地址；AB为文摘，TI为篇名，PY为出版年。"},{"i":"2016_10_single_6","t":"single","s":"在“两种不同的宣教方法对高血压患者健康宣教效果的比较研究”中，因变量是","c":"护理研究的基本程序","sc":1,"o":{"A":"健康宣教效果","B":"宣教方法","C":"高血压患者","D":"宣教环境"},"a":"A","e":"健康宣教效果是随宣教方法(自变量)变化而变化、拟观测的结果，即因变量；宣教方法为自变量。"},{"i":"2016_10_single_7","t":"single","s":"某护士进行了一个有关“肿瘤科护士对临终患者照顾体验”的研究，这一研究类型是","c":"护理研究设计","sc":1,"o":{"A":"质性研究","B":"纵向研究","C":"量性研究","D":"描述性研究"},"a":"A","e":"探讨照顾“体验”等主观感受、意义与经历，以语言文字深入诠释现象，属质性研究（如现象学研究）。"},{"i":"2016_10_single_8","t":"single","s":"下列属于理想的理论框架的主要特征的是","c":"确立研究问题","sc":1,"o":{"A":"验证性","B":"指导性","C":"简明性","D":"普适性"},"a":"B","e":"理想的理论框架或概念框架应具备逻辑性和指导性两个主要特征，指导性即能指导研究方案的设计。"},{"i":"2016_10_single_9","t":"single","s":"问卷调查法的问卷回收率应高于","c":"资料收集的方法","sc":1,"o":{"A":"80％","B":"70％","C":"60％","D":"50％"},"a":"C","e":"邮寄问卷一般回收率60%以上较为满意，低于60%时需慎重考虑研究的有效性。"},{"i":"2016_10_single_10","t":"single","s":"在某护校学生近视率的调查中，该校共20个班，每班均有30人。采用以“班”为单位，使用随机数字表的方法随机抽取5个班，然后对抽到的5个班的所有学生进行调查。这样的抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"分层抽样","B":"理论抽样","C":"整群抽样","D":"定额抽样"},"a":"C","e":"整群抽样是先按某种属性将总体分为若干群体(如班)，再随机抽取部分群体并对群体内全部个体调查，以“班”为群抽样即整群抽样。"},{"i":"2016_10_single_11","t":"single","s":"属于选择性偏倚的是","c":"护理研究设计","sc":1,"o":{"A":"报告偏倚","B":"混杂性偏倚","C":"测量偏倚","D":"无应答偏倚"},"a":"D","e":"选择性偏倚包括入院率偏倚、诊断性偏倚、无应答偏倚和分组偏倚；报告偏倚、测量偏倚属信息性偏倚。"},{"i":"2016_10_single_12","t":"single","s":"某研究对高血压患者进行干预前每一个月测定一次他们的服药依从性，连续测定3次，干预后再连续测定3次，每个月测定1次。通过对各个阶段服药依从性的比较，分析干预措施的有效性。这种研究设计为","c":"护理研究设计","sc":1,"o":{"A":"不对等对照组设计","B":"自身实验前后对照设计","C":"时间连续性设计","D":"队列研究设计"},"a":"C","e":"时间连续性设计是自身前后对照的扩展，即干预前后进行一系列(多次)连续观测，通过各阶段变化判断干预效果。"},{"i":"2016_10_single_13","t":"single","s":"邮寄问卷的特点是","c":"资料收集的方法","sc":1,"o":{"A":"范围广泛但回收率低","B":"效率高","C":"回收率在50％以上为较为满意","D":"花费时间少"},"a":"A","e":"邮寄法问卷发放范围较广，但回收率较低，一般认为回收率60%以上较满意。"},{"i":"2016_10_single_14","t":"single","s":"某研究中，观察者作为参与者进入研究领域，其活动以参与为主，观察为辅。观察者与被观察者的关系是","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"C","e":"观察性参与者(participant-as-observer)指观察者作为参与者进入领域，活动以参与为主、观察为辅。"},{"i":"2016_10_single_15","t":"single","s":"由评估人根据自己对所要测量的概念的理解，尽其判断能力之所及来判定工具是否适当，这是指研究工具的","c":"研究工具性能的测定","sc":1,"o":{"A":"结构效度","B":"内在一致性信度","C":"评定者间信度","D":"表面效度"},"a":"D","e":"表面效度是由评估人根据自己对所测概念的理解，尽其判断能力之所及来判定工具是否适当，停留在“表面”。"},{"i":"2016_10_single_16","t":"single","s":"在统计学中，同一年龄、同一性别的儿童身高、体重各不相同，这就是个体的","c":"研究资料的分析方法","sc":1,"o":{"A":"误差","B":"变异","C":"特征","D":"差别"},"a":"B","e":"同性别同年龄个体的身高、体重各有差异，这种个体间的差异在统计学上称为变异。"},{"i":"2016_10_single_17","t":"single","s":"在统计学中，反映一组数据的平均离散水平的是","c":"研究资料的分析方法","sc":1,"o":{"A":"均数","B":"中位数","C":"标准差","D":"四分位数间距"},"a":"C","e":"标准差反映正态分布计量资料的平均离散(变异)程度；均数、中位数反映集中趋势，四分位数间距反映偏态资料离散趋势。"},{"i":"2016_10_single_18","t":"single","s":"两个或多个样本率／构成比的比较通常采用","c":"研究资料的分析方法","sc":1,"o":{"A":"t检验","B":"χ²检验","C":"相关分析","D":"统计描述"},"a":"B","e":"两个或多个样本率、构成比的比较属计数资料，通常采用χ²(卡方)检验；t检验用于计量资料均数比较。"},{"i":"2016_10_single_19","t":"single","s":"下列有关护理研究论文文题撰写要求的描述，不正确的是","c":"护理论文的撰写","sc":1,"o":{"A":"切题","B":"新颖","C":"复杂","D":"规范"},"a":"C","e":"文题应新颖、切题、简明、规范，不能冗长复杂；“复杂”不符合文题简明的要求。"},{"i":"2016_10_single_20","t":"single","s":"护理人员将其对某一护理问题通过长期的护理实践积累而总结出的体会与做法总结成专业文章，此种文章的类型是","c":"护理论文的撰写","sc":1,"o":{"A":"护理研究论文","B":"护理经验论文","C":"护理个案论文","D":"护理综述论文"},"a":"B","e":"护理经验论文是护理人员将对某一护理问题经长期护理实践积累总结出的经验和体会写成的专业文章。"},{"i":"2016_10_multi_21","t":"multi","s":"下列有关护理研究特点的描述，正确的是","c":"绪论","sc":2,"o":{"A":"护理研究是使用科学方法进行探究的过程","B":"护理研究的结果都是直接地指导护理实践","C":"护理研究就是针对现存的护理相关问题进行探究","D":"通过研究可以使得患者得到更加安全有效的护理","E":"验证护理理论也是护理研究的目的之一"},"a":"ADE","e":"护理研究是用科学方法系统探究现存或产生新知识、直接或间接指导护理实践的过程；B“都是直接”、C“就是针对现存”过于绝对，均不正确。"},{"i":"2016_10_multi_22","t":"multi","s":"下列符合选题原则的科研选题是","c":"确立研究问题","sc":2,"o":{"A":"“应届护理毕业生就业现状调查”","B":"“对密闭式吸痰管更换时间的研究”","C":"“探讨急诊科患者的心理护理”","D":"“中西医结合治疗结石病的疗效观察”","E":"“急诊洗胃中两种置胃管方法效果比较及护理”"},"a":"ABE","e":"选题应具体、明确、范围适当并属护理范畴；C范围过大，D超出护理研究范畴；A、B、E对象与目的具体明确。"},{"i":"2016_10_multi_23","t":"multi","s":"下列属于连续型变量的是","c":"护理研究的基本程序","sc":2,"o":{"A":"体重","B":"职称","C":"身高","D":"血压","E":"皮试结果"},"a":"ACD","e":"体重、身高、血压可取区间内任意数值，属连续型变量；职称为分类变量，皮试结果为二项分类变量。"},{"i":"2016_10_multi_24","t":"multi","s":"在有关泌尿系统感染的相关研究中，下列属于特异性指标的是","c":"确立研究问题","sc":2,"o":{"A":"尿频","B":"体温升高","C":"白细胞计数增多","D":"尿急","E":"尿痛"},"a":"ADE","e":"尿频、尿急、尿痛是泌尿系统感染特有的尿路刺激症状，属特异性指标；体温升高、白细胞增多为非特异性全身炎症表现。"},{"i":"2016_10_multi_25","t":"multi","s":"下列属于观察法的优点的选项是","c":"资料收集的方法","sc":2,"o":{"A":"适于对行为和活动的研究","B":"不易触犯伦理问题","C":"客观性强","D":"结果偏差小","E":"可获得更深入的资料"},"a":"AE","e":"观察法适合对行为、活动等不易测量情形的研究，并可获得更深入的资料；其缺点是伦理问题多、结果易偏差、主观性强。"},{"i":"2016_10_multi_26","t":"multi","s":"下列属于从文献的内容特征进行检索的途径是","c":"医学信息的获取与利用","sc":2,"o":{"A":"序号途径","B":"主题途径","C":"著者途径","D":"关键词途径","E":"分类途径"},"a":"BDE","e":"主题、关键词、分类途径属内容特征检索途径；序号、著者途径属外表特征检索途径。"},{"i":"2016_10_multi_27","t":"multi","s":"属于非概率抽样的方法是","c":"护理研究设计","sc":2,"o":{"A":"方便抽样","B":"系统抽样","C":"定额抽样","D":"目的抽样","E":"分层抽样"},"a":"ACD","e":"非概率抽样包括方便抽样、定额抽样、目的(立意)抽样、理论抽样；系统抽样、分层抽样属概率抽样。"},{"i":"2016_10_multi_28","t":"multi","s":"语义差异量表的特点是","c":"资料收集的方法","sc":2,"o":{"A":"用直线表示程度的差异","B":"由两个反义词形容对某一概念的态度","C":"用形象图形表示程度的差异","D":"由一组有序排列的类别答案构成","E":"一般由5-7个等级组成"},"a":"BE","e":"语义差异量表由两个反义形容词、5～7个等级组成；A、C为视觉类似物量表特点，D为Likert量表特点。"},{"i":"2016_10_multi_29","t":"multi","s":"控制混杂性偏倚的方法有","c":"护理研究设计","sc":2,"o":{"A":"随机化","B":"分层","C":"多组对照","D":"匹配","E":"提高应答率"},"a":"ABD","e":"控制混杂性偏倚常用随机化、匹配、分层及多因素分析；设立多组对照、提高应答率属控制选择性偏倚的方法。"},{"i":"2016_10_multi_30","t":"multi","s":"在使用重测信度时，需考虑的问题包括","c":"研究工具性能的测定","sc":2,"o":{"A":"两次测量之间的间隔时间","B":"使用工具后所测得的结果","C":"测量指标的有效程度","D":"研究工具所测量的变量的性质","E":"测量环境的一致"},"a":"ADE","e":"使用重测信度需考虑：两次测量间隔时间、所测变量的性质(应较稳定)、测量环境一致(相同测试者、程序、时间)；B、C与重测信度无直接关系。"},{"i":"2016_10_multi_31","t":"multi","s":"效标关联效度可分为","c":"研究工具性能的测定","sc":2,"o":{"A":"表面效度","B":"同时效度","C":"预测效度","D":"结构效度","E":"专家效度"},"a":"BC","e":"效标关联效度可分为同时效度和预测效度；表面效度、内容效度、结构效度为效度的其他表达形式。"},{"i":"2016_10_multi_32","t":"multi","s":"绘制统计表的注意事项包括","c":"研究资料的分析方法","sc":2,"o":{"A":"重点突出","B":"逻辑性强","C":"层次清楚","D":"简洁明了","E":"统计表与文字描述结合使用"},"a":"ACDE","e":"绘制统计表应注意重点突出、层次清楚、简洁明了，并与文字描述结合使用；“逻辑性强”非教材所列注意事项。"},{"i":"2016_10_multi_33","t":"multi","s":"下列有关综述中应用参考文献的基本原则包括","c":"护理论文的撰写","sc":2,"o":{"A":"参考文献应该为30篇以上","B":"必须是作者亲自阅读的文献","C":"尽量多引用一次和二次文献","D":"尽量选用核心期刊上发表的文献","E":"选用权威或知名学者发表的文献"},"a":"BDE","e":"综述引用文献应是作者亲自阅读、较新有价值的文献，尽量选核心期刊及权威、知名学者文献，尽量引用原始(一次)文献、少用二次文献；A无30篇以上要求，C多引二次文献错误。"},{"i":"2016_10_term_34","t":"term","s":"信息","c":"医学信息的获取与利用","sc":4,"at":"参考答案（要点）：信息是具有新内容、新知识的消息，是客观事物状态和运动特征的一种普遍形式，是经过加工处理、对客观世界产生影响的数据；在医学文献中，信息是文献的内核，是经过选择、综合、整理的数据。","e":""},{"i":"2016_10_term_35","t":"term","s":"实验性研究","c":"护理研究设计","sc":4,"at":"参考答案（要点）：实验性研究(experimental study)是研究者根据研究目的，对研究对象主动施加某种干预措施，然后追踪观察其结果，以验证干预措施与结果之间因果关系的研究。任何实验性研究都必须具备干预、设立对照和随机化三项基本内容。","e":""},{"i":"2016_10_term_36","t":"term","s":"测量法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：测量法是指研究者借助特别的仪器设备和技术，精确地收集研究对象的客观资料的方法，包括机体指标的测量和实验指标的测量两类，所获结果客观、精确、可信度高，但不适用于收集心理、社会方面的资料。","e":""},{"i":"2016_10_term_37","t":"term","s":"等级资料","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：等级资料又称有序分类资料，是将观察单位按某现象的不同程度或等级顺序分组，清点各组观察单位数所得的资料；各类别间有程度上的顺序、但相邻等级间差值不相等，如疗效(治愈/显效/好转/无效)、满意度等。","e":""},{"i":"2016_10_term_38","t":"term","s":"回译","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：回译(back-translation)指请语言功底好、对源量表不知情的翻译者，将已译成中文的量表再翻译回原语言(源语言)，由双语专家比较源量表与回译量表，找出不同并修改中文版，反复回译直至两量表在内容、语义、格式和应用上一致，以保证翻译质量。","e":""},{"i":"2016_10_term_39","t":"term","s":"关键词","c":"医学信息的获取与利用","sc":4,"at":"参考答案（要点）：关键词是从文章标题、摘要或正文中抽出的、能够表达文献主题内容的单词或术语，是为了文献标引工作从论文中选取的、用以表示全文主题内容信息款目的单词或术语；每篇论文一般选取3～8个关键词，置于摘要之后。","e":""},{"i":"2016_10_short_40","t":"short","s":"简述研究假设的作用。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：研究假设是研究者对所研究问题的预想答案，其作用：①为研究指明方向，指导研究设计和资料收集方案的制定；②是提出研究问题、确立研究变量之间关系的依据；③可使研究者能根据假设去观察和测量变量，并判断研究结果是否支持假设；④是理论的前奏，可通过验证假设发展或完善护理理论。","e":""},{"i":"2016_10_short_41","t":"short","s":"简述文献检索的基本步骤。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：文献检索的基本步骤为：①分析检索课题，明确检索要求与检索目的；②选择检索工具(数据库)；③选择检索途径和检索方法，确定检索词；④查找文献线索；⑤索取原文，获取并阅读文献；⑥根据检索结果调整检索策略，直至查全查准。","e":""},{"i":"2016_10_short_42","t":"short","s":"简述配对t检验适用的资料种类和设计情形。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：配对t检验适用于正态分布的计量(定量)资料，且研究设计为配对(成对)设计的情形：①同一受试对象处理(干预)前后的比较；②同一受试对象分别接受两种处理；③配成对子的两个受试对象分别接受两种处理。即用于配对设计资料两相关样本均数的比较。","e":""},{"i":"2016_10_short_43","t":"short","s":"简述研究中选题的来源。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：研究问题主要来自：①护理实践和日常工作，从临床实践经验中发现问题；②对科研文献的审慎评价，弥补文献的缺陷；③研究者个人兴趣及对未经验证理论的兴趣；④受他人研究的启发；⑤来自目前或未来需要探讨的问题。","e":""},{"i":"2016_10_application_44","t":"application","s":"某研究者计划研究“社区健康教育干预对糖尿病患者运动方式的影响”，将采用实验前后对照设计进行研究。请陈述实验前后对照设计的定义，并为此研究者设计具体研究方案。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：实验前后对照设计(quasi-experimental pretest-posttest design)是将研究对象随机分为实验组和对照组两组，两组均在干预前测量一次(前测)，然后对实验组实施健康教育干预、对照组不施加该干预(常规处理)，干预结束后两组再同时测量一次(后测)，比较两组前后差值以判断干预效果。具体方案：①随机抽取符合纳入标准的社区糖尿病患者，随机分为实验组与对照组；②干预前用统一问卷/量表测量两组患者的运动方式(运动频率、时长、类型等)作为基线(前测)；③对实验组实施社区健康教育干预(如健康讲座、运动处方、定期随访指导)，对照组维持常规处理；④干预一段时期后，在相同条件下再次测量两组运动方式(后测)；⑤分别计算两组前后测差值并进行比较(计量资料用t检验)，判断社区健康教育干预对糖尿病患者运动方式的影响。该设计优点为可控制组间干扰、通过随机分组均衡已知和未知因素，因果推断强度较高。","e":""}]},{"key":"2017_4","name":"2017年4月","qs":[{"i":"2017_4_single_1","t":"single","s":"某研究欲探索“卧床对人的影响”，要求研究对象卧床10天，从而导致研究对象较长时间感到肌肉无力、关节疼痛、嗜睡等。此研究的风险评估是","c":"绪论","sc":1,"o":{"A":"无可预见的影响","B":"暂时的不适","C":"较严重的暂时不适","D":"永久性伤害的可能"},"a":"C","e":"较长时间的肌肉无力、关节疼痛、嗜睡等较明显但随研究结束可恢复的不适，属较严重的暂时不适。"},{"i":"2017_4_single_2","t":"single","s":"未经发表或未进入社会交流、未经系统加工整理的最原始的文献，称为","c":"医学信息的获取与利用","sc":1,"o":{"A":"一次文献","B":"二次文献","C":"三次文献","D":"零次文献"},"a":"D","e":"零次文献指未经发表、未进入社会交流、未系统加工整理的最原始文献，如书信、手稿、草稿、实验记录等。"},{"i":"2017_4_single_3","t":"single","s":"某研究假设为“饮酒对心血管病的发生率有影响”，此假设为","c":"确立研究问题","sc":1,"o":{"A":"无效假设","B":"无方向性假设","C":"统计学假设","D":"有方向性假设"},"a":"B","e":"“有影响”只陈述两变量有关系而未指明方向(升高或降低)，属无方向性假设。"},{"i":"2017_4_single_4","t":"single","s":"研究中自变量的特点是","c":"护理研究的基本程序","sc":1,"o":{"A":"由研究者安排的因素","B":"研究者打算观测的变化因素","C":"随因变量变化的因素","D":"能以某种反应参数来表征的可测量因素"},"a":"A","e":"自变量是研究者人为操纵、选择或安排的因素(“因”)；B、D描述的是因变量，C颠倒了因果关系。"},{"i":"2017_4_single_5","t":"single","s":"根据研究对象和要解决问题的性质，“应届护理毕业生就业现状调查”这一研究中的研究问题的类别是","c":"确立研究问题","sc":1,"o":{"A":"实验观察","B":"调查研究","C":"资料分析","D":"经验体会"},"a":"B","e":"通过问卷/访谈对就业现状进行调查收集资料，属调查研究类问题。"},{"i":"2017_4_single_6","t":"single","s":"按照变量值的性质，某研究中“药物反应(阴性和阳性)”变量为","c":"护理研究的基本程序","sc":1,"o":{"A":"数值变量","B":"二项分类变量","C":"连续型变量","D":"多项分类变量"},"a":"B","e":"药物反应只有阴性、阳性两个互斥类别，属二项分类变量。"},{"i":"2017_4_single_7","t":"single","s":"在使用创造性阅读法阅读医学文献后，把对有关内容的理解和认识返回对同一文献的再阅读之前，以指导和影响再阅读过程。这样的文献阅读方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"比较法","B":"质疑法","C":"反馈法","D":"推测法"},"a":"C","e":"反馈法是在阅读后把对内容的理解和认识(阅读结果)返回、用以指导和影响对同一文献的再阅读。"},{"i":"2017_4_single_8","t":"single","s":"在研究设计中互相比较的两组数据来自两组不同的受试者，这种对照方法是","c":"护理研究设计","sc":1,"o":{"A":"自身对照","B":"随机对照","C":"组间对照","D":"配对对照"},"a":"C","e":"组间对照即相比较的两组数据来自两组不同的受试者；自身对照两组数据来自同一组样本。"},{"i":"2017_4_single_9","t":"single","s":"在不知道研究对象分组情况的前提下进行研究过程中指标的观测、数据的收集和结论的判断，此种方法称为","c":"护理研究设计","sc":1,"o":{"A":"干预","B":"盲法","C":"随机化","D":"预试验"},"a":"B","e":"盲法指研究对象或(和)资料收集、分析者不知道分组情况，以减少主观因素造成的信息性偏倚。"},{"i":"2017_4_single_10","t":"single","s":"先将总体按某种或某些特征分成不同的类别，然后依照每一类中个体数占总体的比例来抽取相应数目的个体构成样本的方法是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"理论抽样"},"a":"B","e":"定额(配额)抽样即先按特征分类，再按各类占总体比例分配样本数，在各类内用方便抽样选取对象。"},{"i":"2017_4_single_11","t":"single","s":"在测量人们的行为、态度时，由一组有序排列的类别答案构成的量表称为","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"B","e":"Likert量表用于测量人们的行为、态度等，由一组按程度轻重有序排列的类别答案(如非常同意～非常不同意)构成。"},{"i":"2017_4_single_12","t":"single","s":"问卷调查法的最大优点是","c":"资料收集的方法","sc":1,"o":{"A":"真实可靠","B":"省钱省时","C":"回收率较高","D":"不涉及伦理"},"a":"B","e":"问卷调查法可同时调查较多对象，省时、省钱、省力，是其最大优点；邮寄问卷回收率较低。"},{"i":"2017_4_single_13","t":"single","s":"观察者作为参与者进入观察领域，但其活动以观察为主，参与为辅，其被称为","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"B","e":"参与性观察者(observer-as-participant)指观察者作为参与者进入领域，活动以观察为主、参与为辅。"},{"i":"2017_4_single_14","t":"single","s":"根据不同人群的健康状况特点，护士会重点针对一些疾病进行调查和随访，并记录相关资料，这是档案记录收集法中的","c":"资料收集的方法","sc":1,"o":{"A":"疾病报告","B":"医疗、护理服务记录","C":"健康检查资料","D":"专题疾病的调查"},"a":"D","e":"专题疾病的调查指如对老年人高血压、心脏病、糖尿病等按人群健康状况特点进行的追踪调查和随访记录。"},{"i":"2017_4_single_15","t":"single","s":"下列不属于研究工具的信度特征的是","c":"研究工具性能的测定","sc":1,"o":{"A":"结构性","B":"等同性","C":"稳定性","D":"内在一致性"},"a":"A","e":"信度的三个特征是稳定性、内在一致性和等同性；“结构性”不是信度特征。"},{"i":"2017_4_single_16","t":"single","s":"对二分制的研究工具进行其内在一致性的信度特征的检验时，最适于采用的方法是","c":"研究工具性能的测定","sc":1,"o":{"A":"折半信度","B":"Cronbach'α系数","C":"KR-20值","D":"重测相关系数"},"a":"C","e":"KR-20值是Cronbach α的特殊形式，专门适用于回答“是/否”“正确/错误”的二分制研究工具。"},{"i":"2017_4_single_17","t":"single","s":"下列属于计数资料的是","c":"研究资料的分析方法","sc":1,"o":{"A":"满意／不满意","B":"治疗效果(痊愈／显效／好转)","C":"身高(cm)","D":"学历(小学／初中／高中)"},"a":"A","e":"满意/不满意为互不相容、无程度顺序的二项类别，属计数(无序分类)资料；B、D为等级(有序分类)资料，C为计量资料。"},{"i":"2017_4_single_18","t":"single","s":"某护士采用焦虑自评量表，对50名肾移植术后患者进行测评。结果：该组患者量表得分为31．63±9．21分，已知该量表的常模(正常人)得分为29．78+10．07分。如果研究者欲探讨肾移植术后患者焦虑平均得分与常模是否有差异，应该采用的统计学分析方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"单样本t检验","B":"两独立样本t检验","C":"方差分析","D":"卡方检验"},"a":"A","e":"一组样本均数与已知总体均数(常模)的比较，属正态计量资料，用单样本t检验。"},{"i":"2017_4_single_19","t":"single","s":"下列统计图中可以表示一个事物随另一个事物数值变化的趋势的是","c":"研究资料的分析方法","sc":1,"o":{"A":"圆图","B":"线图","C":"单式直条图","D":"复式直条图"},"a":"B","e":"线图以线段升降表示一个事物随另一连续变量(如时间)数值变化的趋势。"},{"i":"2017_4_single_20","t":"single","s":"在护理研究论文的文题中，文字的数量一般不超过","c":"护理论文的撰写","sc":1,"o":{"A":"10个汉字","B":"10个英文实词","C":"15个汉字","D":"15个英文实词"},"a":"B","e":"文题一般不超过20个汉字，英文题目一般不超过10个英文实词；备选项中与教材一致的为10个英文实词。"},{"i":"2017_4_multi_21","t":"multi","s":"护理研究中基本的伦理原则有","c":"绪论","sc":2,"o":{"A":"有益的原则","B":"客观性原则","C":"公正的原则","D":"可重复性原则","E":"尊重人的尊严的原则"},"a":"ACE","e":"护理研究的基本伦理原则为有益(无害)原则、公正原则和尊重人的尊严原则；客观性、可重复性属科学研究原则而非伦理原则。"},{"i":"2017_4_multi_22","t":"multi","s":"称为“工具法”的文献检索方法有","c":"医学信息的获取与利用","sc":2,"o":{"A":"追溯法","B":"顺查法","C":"循环法","D":"倒查法","E":"抽查法"},"a":"BDE","e":"工具法(常用法)是利用检索工具查找文献的方法，包括顺查法、倒查法和抽查法；追溯法、循环法(分段法)为其他检索方法。"},{"i":"2017_4_multi_23","t":"multi","s":"量性研究的研究目的是","c":"护理研究设计","sc":2,"o":{"A":"预测","B":"控制","C":"描述","D":"理解","E":"验证理论"},"a":"ABE","e":"量性研究的目的是预测和控制变量间关系、决定因果关系，常用于验证理论；描述和理解是质性研究的目的。"},{"i":"2017_4_multi_24","t":"multi","s":"文献检索工具按照其编著方式的不同，分为","c":"医学信息的获取与利用","sc":2,"o":{"A":"目录","B":"题录","C":"索引","D":"文摘","E":"数据库"},"a":"ABCD","e":"检索工具按编著方式可分为目录、题录、索引和文摘；数据库是按载体/电子化形式划分，不属于编著方式。"},{"i":"2017_4_multi_25","t":"multi","s":"回顾性研究的优点包括","c":"护理研究设计","sc":2,"o":{"A":"省时","B":"省钱","C":"省人力","D":"偏差小","E":"数据误差小"},"a":"ABC","e":"回顾性(病例对照)研究省时、省钱、省人力，可用于少见病研究；缺点是易产生回忆偏倚、数据误差较大。"},{"i":"2017_4_multi_26","t":"multi","s":"常用的设对照的方法有","c":"护理研究设计","sc":2,"o":{"A":"自身对照","B":"组间对照","C":"随机对照","D":"配对对照","E":"非随机对照"},"a":"ABD","e":"常用设对照方法有自身对照、组间对照、配对对照；随机对照、非随机对照属分组(抽样)方式而非设对照方法。"},{"i":"2017_4_multi_27","t":"multi","s":"设计收集资料的方案前应考虑的问题有","c":"资料收集的方法","sc":2,"o":{"A":"采用结构式还是非结构式方法","B":"采用定量还是定性方法","C":"资料是否要求严格的客观性","D":"是否明确研究目的","E":"是否存在霍桑效应"},"a":"ABCE","e":"设计收集资料方案前应考虑：结构式还是非结构式、定量还是定性、资料是否要求严格客观性、是否存在霍桑效应；D非所列内容。"},{"i":"2017_4_multi_28","t":"multi","s":"生物医学测量法的优点有","c":"资料收集的方法","sc":2,"o":{"A":"结果客观","B":"结果精确","C":"结果可信度高","D":"适用于收集心理资料","E":"适用于收集社会方面的资料"},"a":"ABC","e":"生物医学测量法所获结果客观、精确、可信度高；其缺点是不适用于收集心理、社会方面的资料。"},{"i":"2017_4_multi_29","t":"multi","s":"在使用重测信度时，需要考虑的问题是","c":"研究工具性能的测定","sc":2,"o":{"A":"两次测量之间的间隔时间","B":"保持相同的测试者","C":"研究工具所测量的变量性质","D":"两次测量时的周围环境尽量有所变化","E":"保持相同的测量程序"},"a":"ABCE","e":"重测信度需考虑间隔时间、所测变量性质(应较稳定)，并保持相同测试者、相同测量程序、相同测量环境；D应保持环境一致而非变化。"},{"i":"2017_4_multi_30","t":"multi","s":"下列有关统计表绘制的描述中，正确的是","c":"研究资料的分析方法","sc":2,"o":{"A":"统计表与文字描述不能同时使用","B":"一个统计表尽量表达一个中心内容","C":"统计表要层次清楚","D":"统计表中同一列数字可以不对齐","E":"简单表一般是由三条线组成"},"a":"BCE","e":"统计表应重点突出(一个表一个中心内容)、层次清楚，简单表一般画顶线、底线、分隔线三条线；统计表可与文字结合使用，同列数字应对齐，故A、D错。"},{"i":"2017_4_multi_31","t":"multi","s":"下列有关研究工具内容效度的描述正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"对工具是否包括足够的项目做出的判断","B":"建立在大量文献查阅、工作经验以及综合分析、判断的基础之上","C":"两次评议时间最好间隔10—14天","D":"评定的专家人数最低不少于5人","E":"专家的选择与研究工具所涉及的领域相关"},"a":"ABCE","e":"内容效度是对工具是否包括足够项目、内容分配是否恰当的判断，建立在文献查阅与经验之上；专家选择应与所涉领域相关，两次评议间隔最好10～14天；专家人数最低不少于3人(最多10人，5人较合适)，故D错。"},{"i":"2017_4_multi_32","t":"multi","s":"下列用于统计描述的指标是","c":"研究资料的分析方法","sc":2,"o":{"A":"均数","B":"t值","C":"标准差","D":"F值","E":"构成比"},"a":"ACE","e":"均数、标准差、构成比用于统计描述；t值、F值是假设检验(统计推断)中的检验统计量。"},{"i":"2017_4_multi_33","t":"multi","s":"下列对于综述选题注意事项的描述，正确的是","c":"护理论文的撰写","sc":2,"o":{"A":"题目明确具体","B":"选题范围要大","C":"题目要有实用价值","D":"可在自己工作范围外的领域选题","E":"题目要有创新"},"a":"ACE","e":"综述选题应明确具体、范围不宜过大、有实用价值、有创新，并应结合自己工作范围；B、D错误。"},{"i":"2017_4_term_34","t":"term","s":"护理研究","c":"绪论","sc":4,"at":"参考答案（要点）：护理研究是指通过科学的方法有系统地探究现存的或产生新的知识，从而直接或间接地指导护理实践的活动过程，即应用科学方法反复探索护理领域问题并用以指导护理实践的过程。","e":""},{"i":"2017_4_term_35","t":"term","s":"变量","c":"护理研究的基本程序","sc":4,"at":"参考答案（要点）：变量是指研究中能够被具体测量或操纵的因素、特征或概念，即随着条件或情景的改变在质或量上可以变化的任何因素；如性别、年龄、血压、疗效等。研究中常分为自变量、因变量和外变量。","e":""},{"i":"2017_4_term_36","t":"term","s":"分组偏倚","c":"护理研究设计","sc":4,"at":"参考答案（要点）：分组偏倚是选择性偏倚的一种，指在研究分组时，由于分组方法不当或未严格随机，使实验组与对照组在除研究因素外的其他基线特征上不均衡、不可比，从而导致结果产生的系统误差。","e":""},{"i":"2017_4_term_37","t":"term","s":"结构式访谈","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：结构式访谈是指研究者按照事先设计好的、有固定结构的统一问卷或访谈提纲，以相同的措辞和顺序向研究对象逐一询问相同问题并记录答案的访谈方法，所获资料便于统计分析，但不够灵活深入。","e":""},{"i":"2017_4_term_38","t":"term","s":"预测效度","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：预测效度是效标关联效度的一种，指测量工具作为未来情况预测指标的有效程度，即用工具测得的结果与将来(一段时间后)校标(效标)之间的相关程度；相关越高，预测效度越好。","e":""},{"i":"2017_4_term_39","t":"term","s":"个案研究","c":"护理论文的撰写","sc":4,"at":"参考答案（要点）：个案研究是针对个别患者(个案)的护理问题或现象，广泛深入地收集资料进行深入研究的方法，属质性研究的一种；须按护理程序的思路撰写，样本量小、研究深入，结果较难大规模推广。","e":""},{"i":"2017_4_short_40","t":"short","s":"简述形成研究的理论框架或概念框架的基本过程。","c":"确立研究问题","sc":5,"at":"参考答案（要点）：形成理论/概念框架的基本过程：①选择与研究命题相关的概念；②界定概念并对各概念下操作性定义；③陈述概念之间的相互关系，形成命题；④通过命题构成概念间关系网络；⑤将各概念及关系用框架图(理论/概念框架图)表达出来。","e":""},{"i":"2017_4_short_41","t":"short","s":"简述测量偏倚产生的原因。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：测量偏倚是在测量研究对象某些指标时所产生的系统误差，主要原因：①研究者技术不熟练；②所使用的仪器、设备校正不准确；③测定方法的标准或程序不统一，多个资料收集者方法不一致；④研究者对实验组与对照组对象的态度、询问方式不同；⑤调查表设计不科学、记录不完整、调查人员认真程度与收集资料技巧不足。","e":""},{"i":"2017_4_short_42","t":"short","s":"简述观察法的分类。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：观察法按事先是否设计好观察项目和记录格式，分为：①结构式观察法：事先设计好正式记录格式、观察样本和项目，对观察内容准确分类、记录编码；②非结构式观察法：无事先设计的固定记录格式，较灵活、深入，常用于质性研究。此外按观察者与被观察者关系可分为局外观察者、参与性观察者、观察性参与者和完全参与者。","e":""},{"i":"2017_4_short_43","t":"short","s":"简述量表回译的过程。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：量表回译过程：①先由双语人员将源量表翻译为中文；②请语言功底好、对源量表不知情的翻译者将已译中文量表再翻译回源语言(回译)；③由双语专家比较源量表与回译量表，找出内容、语义差异；④根据差异修改中文版；⑤反复回译、修改，直至两量表在内容、语义、格式和应用上一致，以保证翻译等价性。","e":""},{"i":"2017_4_application_44","t":"application","s":"如欲研究某市社区护士的职业态度，该市社区护士中本科学历的护士占5％，大专学历的占30％，中专学历的占65％。假如从中抽取一个200人的样本，采用分层抽样，请问什么是分层抽样?各学历的护士分别为多少人?","c":"护理研究设计","sc":10,"at":"参考答案（要点）：分层抽样是先按某些特征(如学历)将总体分为若干层，然后在每一层内按一定比例随机抽取样本，各层抽取的样本数可按层内个体数占总体的比例分配，最后合成样本。其优点是层内同质、层间异质，抽样误差小、代表性好。计算：样本量200人。本科学历：200×5%=10人；大专学历：200×30%=60人；中专学历：200×65%=130人（合计10+60+130=200人）。","e":""}]},{"key":"2017_10","name":"2017年10月","qs":[{"i":"2017_10_single_1","t":"single","s":"下列研究对象的权利属于护理研究中的“公正原则”的是","c":"绪论","sc":1,"o":{"A":"隐私权","B":"充分认知的权利","C":"自主决定权","D":"不被剥削或利用的权利"},"a":"A","e":"公正的原则包括研究对象公平治疗的权利和隐私权；充分认知权、自主决定权属尊重人的尊严原则，不被剥削或利用的权利属有益的原则。"},{"i":"2017_10_single_2","t":"single","s":"按照文献的级别，期刊论文属于","c":"医学信息的获取与利用","sc":1,"o":{"A":"一次文献","B":"二次文献","C":"三次文献","D":"零次文献"},"a":"A","e":"期刊论文是作者以本人研究为依据创作的原始文献，属一次文献。"},{"i":"2017_10_single_3","t":"single","s":"按照变量值的性质，身高、体重属于","c":"护理研究的基本程序","sc":1,"o":{"A":"二项分类变量","B":"有序分类变量","C":"多项分类变量","D":"连续型变量"},"a":"D","e":"身高、体重可取一定区间内任意数值，属连续型变量。"},{"i":"2017_10_single_4","t":"single","s":"根据研究的对象和要解决问题的性质，“唐山市市区及区级以上医院护理人员死因资料的减寿分析”的研究中研究问题的类别为","c":"确立研究问题","sc":1,"o":{"A":"调查研究","B":"实验观察","C":"资料分析","D":"经验体会"},"a":"C","e":"利用已有的护理人员死因资料进行减寿分析，属资料分析类研究问题。"},{"i":"2017_10_single_5","t":"single","s":"某研究的研究假设为“吸烟会增加肺癌的发生率”，此研究假设为","c":"确立研究问题","sc":1,"o":{"A":"有方向性假设","B":"无效假设","C":"无方向性假设","D":"统计学假设"},"a":"A","e":"“增加”明确指出了两变量关系的方向，属有方向性假设。"},{"i":"2017_10_single_6","t":"single","s":"量性研究的结果陈述形式是","c":"护理研究设计","sc":1,"o":{"A":"引述","B":"评论","C":"数字","D":"故事"},"a":"C","e":"量性研究用数字量化资料并以统计数据陈述结果；引述、评论、故事是质性研究的陈述形式。"},{"i":"2017_10_single_7","t":"single","s":"在进行医学文献创造性阅读过程中，在某个地方有意识地停顿下来，以已经阅读的内容为基础，设想以后的内容，再与文献中后面的内容对比，检验自己的想象力、判断力和创造力。这种文献阅读方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"质疑法","B":"推测法","C":"比较法","D":"反馈法"},"a":"B","e":"推测法指在阅读中有意识停顿，以已读内容为基础设想以后内容，再与文献后续内容对比检验。"},{"i":"2017_10_single_8","t":"single","s":"实验性研究和非实验性研究的根本区别在于","c":"护理研究设计","sc":1,"o":{"A":"是否设立对照组","B":"是否有干扰因素","C":"是否随机抽样","D":"有无干预"},"a":"D","e":"实验性研究的根本特征是研究者对研究对象主动施加干预措施；有无干预是其与非实验性研究的根本区别。"},{"i":"2017_10_single_9","t":"single","s":"在研究设计时将研究对象自身在干预前后的情况进行比较的方法是","c":"护理研究设计","sc":1,"o":{"A":"随机对照","B":"自身对照","C":"组间对照","D":"配对对照"},"a":"B","e":"自身对照指对照组和实验组数据均来自同一组样本，即将研究对象自身干预前后的情况进行比较。"},{"i":"2017_10_single_10","t":"single","s":"从总体中随机抽取的部分观察单位是","c":"研究资料的分析方法","sc":1,"o":{"A":"抽样","B":"总体","C":"样本","D":"随机"},"a":"C","e":"样本是从总体中随机抽取的、作为研究对象的部分观察单位。"},{"i":"2017_10_single_11","t":"single","s":"入院率偏倚属于","c":"护理研究设计","sc":1,"o":{"A":"选择性偏倚","B":"报告偏倚","C":"测量偏倚","D":"回忆偏倚"},"a":"A","e":"入院率偏倚(伯克森偏倚)是选择性偏倚的一种，因入院率不同导致；报告、测量、回忆偏倚属信息性偏倚。"},{"i":"2017_10_single_12","t":"single","s":"研究者通过与研究对象进行面对面的、有目的的会谈，直接从研究对象处获取资料的方法是","c":"资料收集的方法","sc":1,"o":{"A":"调查法","B":"访谈法","C":"问卷法","D":"观察法"},"a":"B","e":"访谈法是研究者通过与研究对象面对面、有目的的会谈直接获取资料的方法。"},{"i":"2017_10_single_13","t":"single","s":"生物测量法的缺点是","c":"资料收集的方法","sc":1,"o":{"A":"结果主观性高","B":"结果不够精确","C":"测量仪器的安全性能难把握","D":"不适用收集研究对象的心理、社会方面的资料"},"a":"D","e":"生物医学测量法结果客观精确，但其缺点是不适用于收集研究对象心理、社会方面的资料。"},{"i":"2017_10_single_14","t":"single","s":"档案记录法的缺点是","c":"资料收集的方法","sc":1,"o":{"A":"涉及伦理问题","B":"有应答偏差","C":"没有选择性","D":"不经济"},"a":"A","e":"档案记录收集法经济、无需对象合作、无应答偏差，但其缺点是有选择性、资料可能不完整，并可能涉及伦理(隐私)问题。"},{"i":"2017_10_single_15","t":"single","s":"重测信度越趋近于下列哪个数值时意味着重测信度就越高?","c":"研究工具性能的测定","sc":1,"o":{"A":"0.01","B":"0.05","C":"0.08","D":"1.00"},"a":"D","e":"重测信度用两次测量得分的相关系数表示，相关系数越接近1，信度越高。"},{"i":"2017_10_single_16","t":"single","s":"下列有关表面效度的描述，错误的是","c":"研究工具性能的测定","sc":1,"o":{"A":"是停留在问卷表面的测定","B":"对效度的评价是用“有或无”来反映的","C":"可以作为工具质量的有力证据","D":"用于研究工具效度测定的开始阶段"},"a":"C","e":"表面效度停留在表面、用“有/无”反映、用于效度测定开始阶段，一般不作为工具质量的有力证据，故C错。"},{"i":"2017_10_single_17","t":"single","s":"下列属于计量资料的是","c":"研究资料的分析方法","sc":1,"o":{"A":"血压(mmHg)","B":"学历(小学／中学／大学)","C":"性别(男／女)","D":"职称(护士／护师／主管护师)"},"a":"A","e":"血压用数值度量、有计量单位，属计量(定量)资料；学历、职称是有序分类(等级)资料，性别是无序分类资料。"},{"i":"2017_10_single_18","t":"single","s":"某研究采用自身对照的方法，对20例脑卒中患者提供家庭康复指导，分别在指导前和指导后3个月，采用日常生活能力量表进行测评。研究者欲了解家庭康复指导后，患者日常生活能力是否有改善。此时研究者应该使用的统计学分析方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"两独立样本t检验","B":"单样本t检验","C":"配对t检验","D":"方差分析"},"a":"C","e":"同一组患者指导前后成对测量，属配对设计计量资料，均数比较用配对t检验。"},{"i":"2017_10_single_19","t":"single","s":"在进行四格表卡方检验时，如果发现研究样本的总例数少于40例，此时应该选择的卡方检验的具体方法是","c":"研究资料的分析方法","sc":1,"o":{"A":"四格表专用公式","B":"四格表校正公式","C":"Fisher确切概率法","D":"配对卡方检验公式"},"a":"C","e":"四格表资料n<40或理论频数T<1时，应采用Fisher确切概率法；n≥40且T≥5用专用公式，n≥40但1≤T<5用校正公式。"},{"i":"2017_10_single_20","t":"single","s":"下列选项中不属于护理研究论文的四段式撰写内容的是","c":"护理论文的撰写","sc":1,"o":{"A":"摘要","B":"前言","C":"材料与方法","D":"结果"},"a":"A","e":"护理研究论文正文四段式为前言、材料与方法、结果、讨论；摘要另置于文题之后，不属四段式正文内容。"},{"i":"2017_10_multi_21","t":"multi","s":"科学研究应遵循的原则是","c":"绪论","sc":2,"o":{"A":"客观性原则","B":"个性原则","C":"通用性原则","D":"实验原则","E":"可重复性原则"},"a":"ADE","e":"科学研究应遵循客观性原则、实验原则和可重复性原则；个性原则、通用性原则不是科学研究基本原则。"},{"i":"2017_10_multi_22","t":"multi","s":"因变量的特征有","c":"护理研究的基本程序","sc":2,"o":{"A":"其变化能够被研究者操纵控制","B":"是根据需要有待观测的因素","C":"随自变量的变化而变化","D":"其变化导致研究对象发生反应","E":"是能够以某种反应参数来表征的可测量因素"},"a":"BCE","e":"因变量是随自变量变化而变化、有待观测、能够以反应参数表征的可测量因素；A是自变量特征，D表述不当。"},{"i":"2017_10_multi_23","t":"multi","s":"研究指标应具备的特征是","c":"确立研究问题","sc":2,"o":{"A":"特异性","B":"准确性","C":"客观性","D":"灵敏性","E":"可行性"},"a":"BCDE","e":"研究指标应具备准确性、客观性、灵敏性和可行性；其中准确性即指标能准确反映研究内容且具有特异性，特异性已含于准确性之中。"},{"i":"2017_10_multi_24","t":"multi","s":"研究问题的描述内容主要包括","c":"确立研究问题","sc":2,"o":{"A":"立题依据","B":"研究的目的","C":"研究的背景","D":"研究的方法","E":"研究的意义"},"a":"ABC","e":"研究问题的描述主要包括确立研究问题的背景和预期目的，即描述立题依据或理由及研究预期达到的目的。"},{"i":"2017_10_multi_25","t":"multi","s":"质性研究主要包括","c":"护理研究设计","sc":2,"o":{"A":"现象学研究法","B":"根基理论研究法","C":"人种学研究法","D":"实验性研究法","E":"类实验性研究法"},"a":"ABC","e":"质性研究主要包括现象学研究法、根基理论(扎根理论)研究法和人种学研究法；实验性、类实验性研究属量性研究。"},{"i":"2017_10_multi_26","t":"multi","s":"最为常用的概率抽样方法有","c":"护理研究设计","sc":2,"o":{"A":"定额抽样","B":"单纯随机抽样","C":"系统抽样","D":"分层抽样","E":"整群抽样"},"a":"BCDE","e":"概率抽样包括单纯随机抽样、系统抽样、分层抽样和整群抽样；定额抽样属非概率抽样。"},{"i":"2017_10_multi_27","t":"multi","s":"使用问卷调查法收集资料的形式包括","c":"资料收集的方法","sc":2,"o":{"A":"邮寄问卷","B":"非结构式访谈","C":"现场发放","D":"半结构式访谈","E":"通过电话访谈完成问卷调查"},"a":"ACE","e":"问卷调查法的形式包括邮寄问卷、现场发放(填写)以及通过电话访谈完成问卷；非结构式、半结构式访谈属访谈法。"},{"i":"2017_10_multi_28","t":"multi","s":"常见的档案资料来源包括","c":"资料收集的方法","sc":2,"o":{"A":"疾病报告","B":"医疗、护理服务工作记录","C":"健康检查资料","D":"访谈资料","E":"专题疾病的调查"},"a":"ABCE","e":"档案资料来源包括疾病报告、医疗护理服务工作记录、健康检查资料和专题疾病的调查；访谈资料属访谈法而非档案记录。"},{"i":"2017_10_multi_29","t":"multi","s":"下列可以用来反映研究工具的内在一致性这一特征的方法包括","c":"研究工具性能的测定","sc":2,"o":{"A":"折半信度","B":"KR-20值","C":"评定者间信度","D":"复本信度","E":"Cronbach's系数"},"a":"ABE","e":"折半信度、Cronbach α系数和KR-20值反映内在一致性；评定者间信度、复本信度反映等同性。"},{"i":"2017_10_multi_30","t":"multi","s":"下列有关抽样误差的描述正确的是","c":"研究资料的分析方法","sc":2,"o":{"A":"只要是抽样研究，就必然存在抽样误差","B":"尽可能多地增加样本量可以降低抽样误差","C":"选择变异程度大的研究指标可降低抽样误差","D":"尽可能采取随机抽样的方法降低抽样误差","E":"抽样误差是由于抽样的偶然性导致的"},"a":"ADE","e":"抽样研究必然存在由抽样偶然性导致的抽样误差，可通过随机抽样、增加样本量到适当水平、选择变异程度小的指标来降低；B“尽可能多”、C“变异大”错误。"},{"i":"2017_10_multi_31","t":"multi","s":"下列用于统计推断的指标是","c":"研究资料的分析方法","sc":2,"o":{"A":"构成比","B":"卡方值","C":"t值","D":"中位数","E":"最大值"},"a":"BC","e":"卡方值、t值是假设检验(统计推断)的检验统计量；构成比、中位数、最大值属统计描述指标。"},{"i":"2017_10_multi_32","t":"multi","s":"下列有关研究工具的信度与效度关系的描述，正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"不是所有的研究工具都有信度和效度","B":"信度和效度是截然孤立的","C":"信度低的工具效度肯定不高","D":"信度高的工具效度可能低","E":"研究工具的信度和效度是程度上“高”或“低”的问题"},"a":"CDE","e":"信度是效度的基础，二者并非截然孤立；信度低则效度必低，信度高效度却不一定高；信度和效度都是程度上“高/低”的问题而非“有/无”。"},{"i":"2017_10_multi_33","t":"multi","s":"下列属于等级资料的是","c":"研究资料的分析方法","sc":2,"o":{"A":"病程(年)","B":"职业(工人／农民／干部)","C":"满意度(非常满意／一般／不满意)","D":"行为发生(总是／经常／偶尔)","E":"关系(配偶／子女／兄弟姐妹)"},"a":"CD","e":"满意度、行为发生频率均按程度/频率顺序分组，属有序分类(等级)资料；A为计量资料，B、E为无序分类(计数)资料。"},{"i":"2017_10_term_34","t":"term","s":"假设","c":"确立研究问题","sc":4,"at":"参考答案（要点）：假设是研究者对所研究的问题预先赋予的、暂时性的待验证的答案或推测，是关于两个或多个变量之间关系的陈述；它来自研究问题、文献回顾和理论框架，可分为有方向性假设和无方向性假设，也包括无效(统计学)假设。","e":""},{"i":"2017_10_term_35","t":"term","s":"理论框架","c":"确立研究问题","sc":4,"at":"参考答案（要点）：理论框架是利用已有的理论对各研究变量或概念之间的相互关系进行系统说明而形成的框架；它为研究中各变量建立系统、逻辑、精确的关系，是良好科研设计的前提与基础。","e":""},{"i":"2017_10_term_36","t":"term","s":"混杂性偏倚","c":"护理研究设计","sc":4,"at":"参考答案（要点）：混杂性偏倚是指在研究中，由于一个或多个外来因素(称混杂因素)的存在，歪曲(掩盖或夸大)了暴露因素与研究结果之间的真实联系而产生的系统误差；常用随机化、匹配、分层、多因素分析等方法控制。","e":""},{"i":"2017_10_term_37","t":"term","s":"观察性参与者","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：观察性参与者(participant-as-observer)指观察者作为参与者进入观察领域，其活动以参与为主、观察为辅；通过参与活动使观察尽量维持自然情景，被观察者表现出真实状况，但因观察者仍是“外来者”，需延长观察时间、充分进入情景以获得真实资料。","e":""},{"i":"2017_10_term_38","t":"term","s":"内容效度","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：内容效度是根据理论基础及实践经验，对研究工具是否包括足够的项目、且有恰当的内容分配比例所做出的判断；多由有关专家委员会评议，专家选择应与所涉领域相关，两次评议最好间隔10～14天。","e":""},{"i":"2017_10_term_39","t":"term","s":"护理经验论文","c":"护理论文的撰写","sc":4,"at":"参考答案（要点）：护理经验论文是护理期刊中较常见的论文形式，指护理人员将其对某一护理问题通过长期护理实践积累而总结出来的护理经验和体会汇成文字写成的专业文章，主要来自长期护理实践中日常资料的积累和临床护理工作的经验体会。","e":""},{"i":"2017_10_short_40","t":"short","s":"简述文献检索和文献回顾的目的。","c":"医学信息的获取与利用","sc":5,"at":"参考答案（要点）：文献检索和文献回顾的目的：①了解研究课题的背景和立题依据，掌握相关领域已有研究的状况；②避免重复研究，找出尚未解决的问题和空白；③为研究提供理论依据和研究方法、研究工具上的借鉴；④启发研究思路、形成研究假设和理论框架。","e":""},{"i":"2017_10_short_41","t":"short","s":"简述生物医学测量法的目的。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：生物医学测量法的目的：①测量与护理有关的基本生理过程；②选择护理干预方法；③评价护理干预效果；④改进标本采集方法；⑤测量患者的生理功能。","e":""},{"i":"2017_10_short_42","t":"short","s":"简述直条图的定义以及绘制时的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：直条图是用相同宽度直条的长短，表示几个相互独立组别的某指标数值大小的统计图，横轴为独立组别、纵轴为统计指标，分单式和复式直条图。绘制注意事项：①纵轴刻度一般从0开始；②各直条宽度应相等；③复式直条图中同一组的直条间不留空隙；④直条一般按高矮顺序排列。","e":""},{"i":"2017_10_short_43","t":"short","s":"简述综述中引用文献的基本原则。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：①必须是作者亲自阅读的较新、较有价值的参考文献；②尽量选用权威性文献，如核心期刊发表的文献；③尽量引用一次性(原始)文献，不选用未公开发表文献，少用教材或专科书等二次文献，尤其避免大量间接引用综述；④选用权威、知名学者发表的文献。","e":""},{"i":"2017_10_application_44","t":"application","s":"请分析在“社区护理干预对糖尿病患者运动方式的影响”研究中，研究对象是谁?为了排除与研究无关的干扰因素的影响，突出实验中干预措施的效应，研究者应该采用什么类型的研究设计?请具体描述研究设计的内容。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：研究对象是社区中符合纳入标准的糖尿病患者。为排除无关干扰因素、突出干预效应，应采用实验性研究(实验前后对照设计)。设计内容：①按纳入标准选择社区糖尿病患者，随机分为实验组和对照组；②干预前两组均用统一问卷/量表测量运动方式(频率、时长、类型)作为基线(前测)；③对实验组实施社区护理干预(健康教育、运动处方、随访指导)，对照组维持常规护理、不施加该干预；④干预一段时期后，在相同条件下对两组再次测量运动方式(后测)；⑤分别计算两组前后测差值并作比较(t检验)，判断社区护理干预对糖尿病患者运动方式的影响。随机分组和设对照可使各组除干预外其他特征均衡，排除外变量干扰。","e":""}]},{"key":"2018_4","name":"2018年4月","qs":[{"i":"2018_4_single_1","t":"single","s":"下列有关研究对象权利的描述中属于“有益的原则”的是","c":"绪论","sc":1,"o":{"A":"自主决定的权利","B":"公平治疗的权利","C":"充分认知的权利","D":"不被剥削或利用的权利"},"a":"D","e":"有益的原则包括研究对象免于遭受伤害或不适的权利和不被剥削或利用的权利；自主决定权、充分认知权属尊重人的尊严原则，公平治疗权属公正原则。"},{"i":"2018_4_single_2","t":"single","s":"下列关于护理研究中“知情同意”的叙述，不正确的是","c":"绪论","sc":1,"o":{"A":"同意是知情的前提和条件","B":"研究对象的同意必须是自愿的","C":"知情同意具有自主性","D":"同意必须由有行为能力的人做出"},"a":"A","e":"知情是同意的前提和条件，先知情后同意；A颠倒了二者关系。同意须自愿、由有行为能力者做出，知情同意具有自主性。"},{"i":"2018_4_single_3","t":"single","s":"在某护理研究中，疗效按治愈、显效、好转、无效分类，此变量类型为","c":"护理研究的基本程序","sc":1,"o":{"A":"无序分类变量","B":"连续型变量","C":"有序分类变量","D":"非连续型变量"},"a":"C","e":"疗效按治愈、显效、好转、无效排列，类别间有程度上的顺序，属有序分类变量。"},{"i":"2018_4_single_4","t":"single","s":"关于研究假设，下列叙述正确的是","c":"确立研究问题","sc":1,"o":{"A":"只能陈述两个变量间的关系","B":"需要在研究过程中形成","C":"不一定具有可测量性","D":"并不是每个研究都一定会有假设"},"a":"D","e":"探索性、描述性及质性研究常采用研究问题而不用假设，故并非每个研究都一定有假设；假设可陈述两个或多个变量关系、应在研究前形成并具有可测量性。"},{"i":"2018_4_single_5","t":"single","s":"每个伦理审查委员会都包括具有不同文化、经济、教育、性别和种族背景的成员，其人员数至少为","c":"绪论","sc":1,"o":{"A":"3人","B":"5人","C":"7人","D":"9人"},"a":"B","e":"伦理审查委员会至少由5名具有不同背景的成员组成。"},{"i":"2018_4_single_6","t":"single","s":"在MEDLINE光盘数据库中，AU指的是","c":"医学信息的获取与利用","sc":1,"o":{"A":"文摘标识","B":"文摘","C":"著者姓名","D":"评论"},"a":"C","e":"AU—Author—著者姓名。"},{"i":"2018_4_single_7","t":"single","s":"在阅读文献过程中，通过对内容的设疑、解疑完成对文献的理解。此阅读方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"质疑法","B":"比较法","C":"反馈法","D":"推测法"},"a":"A","e":"质疑法即通过对内容的设疑、解疑完成对文献理解的创造性阅读方法。"},{"i":"2018_4_single_8","t":"single","s":"预试验时选择研究对象的例数可为研究设计总样本量的","c":"护理研究设计","sc":1,"o":{"A":"10％—20％","B":"30％—40％","C":"50％—60％","D":"70％—80％"},"a":"A","e":"预试验选择少量研究对象，可为研究设计总样本量的10%～20%。"},{"i":"2018_4_single_9","t":"single","s":"先规定收集资料的方式，通过数字资料或其他方式的量化方法来研究现象间的关系的研究为","c":"护理研究设计","sc":1,"o":{"A":"质性研究","B":"量性研究","C":"现象学研究","D":"行动研究"},"a":"B","e":"量性研究先规定资料收集方式，用数字量化资料来研究现象间关系，强调客观、测量和统计控制。"},{"i":"2018_4_single_10","t":"single","s":"对一个特定人群进行定期随访，观察疾病或某种特征在该人群及个体中的动态变化，这种研究是","c":"护理研究设计","sc":1,"o":{"A":"现况调查","B":"纵向研究","C":"相关性研究","D":"比较性研究"},"a":"B","e":"纵向研究是对特定人群定期随访、观察疾病或特征在人群及个体中动态变化的描述性研究。"},{"i":"2018_4_single_11","t":"single","s":"从总体中选择最容易找到的人或物作为研究对象，这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"定额抽样","C":"目的抽样","D":"理论抽样"},"a":"A","e":"方便抽样是从总体中选择最容易找到、最方便获得的人或物作为研究对象。"},{"i":"2018_4_single_12","t":"single","s":"评定人们对某一概念的态度，一般由两个反义词形容、5～7个等级组成，要求被评者指出他目前所处的位置的量表是","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"C","e":"语义差异量表由两个反义形容词、5～7个等级组成，要求被评者指出目前所处位置。"},{"i":"2018_4_single_13","t":"single","s":"对于翻译的量表要进行检测，一般来讲，可接受的信效度系数均应大于","c":"研究工具性能的测定","sc":1,"o":{"A":"0.5","B":"0.6","C":"0.7","D":"0.8"},"a":"C","e":"翻译量表检测时，一般可接受的信效度系数均应大于0.7，相关系数高于0.7时工具信度才理想。"},{"i":"2018_4_single_14","t":"single","s":"档案记录收集法的主要缺点是","c":"资料收集的方法","sc":1,"o":{"A":"结果偏差","B":"主观性","C":"涉及伦理问题","D":"需要研究对象合作"},"a":"C","e":"档案记录收集法经济、无需对象合作、无应答偏差，但有选择性、资料可能不完整，并可能涉及伦理(隐私)问题。"},{"i":"2018_4_single_15","t":"single","s":"重测信度所反映的研究工具的信度特征是","c":"研究工具性能的测定","sc":1,"o":{"A":"稳定性","B":"内在一致性","C":"等同性","D":"预测性"},"a":"A","e":"重测信度用同一工具两次测定同一对象，反映工具的稳定性。"},{"i":"2018_4_single_16","t":"single","s":"在调查表格中所得到的有关“性别”的资料数据属于","c":"研究资料的分析方法","sc":1,"o":{"A":"计量资料","B":"计数资料","C":"等级资料","D":"有序分类资料"},"a":"B","e":"性别(男/女)为互不相容、无程度顺序的二项类别，属计数(无序分类)资料。"},{"i":"2018_4_single_17","t":"single","s":"某研究采用自身对照的方法，对20例脑卒中患者提供家庭康复指导，分别在指导前和指导后3个月，采用日常生活能力量表进行测评。研究结束后，研究者对数据进行统计学分析，下列可以说明在经过家庭康复指导后患者的日常生活能力是有改善的P值是","c":"研究资料的分析方法","sc":1,"o":{"A":"0.10","B":"0.08","C":"0.06","D":"0.04"},"a":"D","e":"P<0.05时认为差异有统计学意义，可说明干预后有改善；0.04<0.05，其余均大于0.05。"},{"i":"2018_4_single_18","t":"single","s":"下列不属于论文摘要的内容是","c":"护理论文的撰写","sc":1,"o":{"A":"研究目的","B":"研究方法","C":"研究结果","D":"研究的局限性"},"a":"D","e":"摘要一般包括研究目的、方法、结果和结论四要素；研究的局限性一般不在摘要中叙述。"},{"i":"2018_4_single_19","t":"single","s":"护理人员将其对某一护理问题通过长期的护理实践积累而总结出来的护理经验和体会进行撰写，所形成的专业文章是","c":"护理论文的撰写","sc":1,"o":{"A":"护理个案论文","B":"护理经验论文","C":"护理综述论文","D":"护理研究论文"},"a":"B","e":"护理经验论文是护理人员将长期护理实践积累的经验和体会写成的专业文章。"},{"i":"2018_4_single_20","t":"single","s":"下列有关统计表的绘制要求，描述不正确的是","c":"研究资料的分析方法","sc":1,"o":{"A":"每个表都要有表号和表题","B":"表中无数字时用“…”表示","C":"简单表一般是三条线","D":"表中数字的小数点后位数要保持一致"},"a":"B","e":"统计表中缺失数字用“…”表示，无数字用“——”表示；B把二者颠倒，故不正确。"},{"i":"2018_4_multi_21","t":"multi","s":"按照研究工作的目的、任务和方法的不同，研究通常可被划分为","c":"护理研究的基本程序","sc":2,"o":{"A":"基础研究","B":"前瞻研究","C":"应用研究","D":"质性研究","E":"开发研究"},"a":"ACE","e":"按研究目的、任务和方法，研究可分为基础研究、应用研究和开发研究；前瞻研究、质性研究是按其他标准划分。"},{"i":"2018_4_multi_22","t":"multi","s":"理想的理论框架或概念框架应具备的特征是","c":"确立研究问题","sc":2,"o":{"A":"完整性","B":"逻辑性","C":"客观性","D":"灵活性","E":"指导性"},"a":"BE","e":"理想的理论/概念框架应具备逻辑性和指导性两个主要特征。"},{"i":"2018_4_multi_23","t":"multi","s":"护理研究中的研究问题可以来源于","c":"确立研究问题","sc":2,"o":{"A":"想象中的有争议问题","B":"个人实践遇到的问题","C":"受他人研究的启发","D":"目前或未来需要探讨的问题","E":"研究者的个人兴趣"},"a":"BCDE","e":"研究问题可来自个人实践遇到的问题、受他人研究启发、目前或未来需探讨的问题及研究者个人兴趣；想象中的有争议问题不是可靠来源。"},{"i":"2018_4_multi_24","t":"multi","s":"理论／概念框架的作用包括","c":"确立研究问题","sc":2,"o":{"A":"统领文献知识","B":"呈现研究相关概念及概念间的关系","C":"呈现研究设计方法","D":"提供了研究的焦点和具体目标","E":"作为整理、分析与解释研究结果的依据"},"a":"ABCE","e":"理论/概念框架的作用为：统领文献知识、呈现研究相关概念及概念间关系、呈现研究设计方法、作为整理分析解释研究结果的依据。"},{"i":"2018_4_multi_25","t":"multi","s":"实验性研究中常用的研究设计类型包括","c":"护理研究设计","sc":2,"o":{"A":"实验前后对照设计","B":"单纯实验后对照设计","C":"描述性研究","D":"相关性研究","E":"索罗门四组设计"},"a":"ABE","e":"实验性研究常用设计有实验前后对照设计、单纯实验后对照设计和索罗门四组设计；描述性、相关性研究属非实验性研究。"},{"i":"2018_4_multi_26","t":"multi","s":"下列抽样方法中属于非概率抽样方法的是","c":"护理研究设计","sc":2,"o":{"A":"目的抽样","B":"网络抽样","C":"系统抽样","D":"理论抽样","E":"分层抽样"},"a":"ABD","e":"非概率抽样包括方便、定额、目的、理论(滚雪球/网络)抽样；系统抽样、分层抽样属概率抽样。"},{"i":"2018_4_multi_27","t":"multi","s":"选择性偏倚的控制方法包括","c":"护理研究设计","sc":2,"o":{"A":"科研设计严谨","B":"设立多组对照","C":"尽量使用客观指标","D":"采用盲法收集资料","E":"提高应答率，减少失访率"},"a":"ABE","e":"选择性偏倚的控制包括科研设计严谨(严格纳入排除标准、随机抽样分组)、设立多组对照、提高应答率减少失访；客观指标、盲法收集资料属控制信息性偏倚。"},{"i":"2018_4_multi_28","t":"multi","s":"问卷调查法的缺点包括","c":"资料收集的方法","sc":2,"o":{"A":"回收率相对较低","B":"未提供真实的资料","C":"花费大","D":"费时","E":"影响因素较多"},"a":"AB","e":"问卷调查法缺点为回收率相对较低，且研究对象可能反复斟酌、掩饰观点而未提供真实资料；花费大、费时是访谈法的缺点。"},{"i":"2018_4_multi_29","t":"multi","s":"下列有关研究工具效度的相关描述，正确的选项是","c":"研究工具性能的测定","sc":2,"o":{"A":"指某一研究工具能真正反映它所期望研究的概念的程度","B":"判断一个研究工具的效度是“有”或“无”的问题","C":"不是所有的研究工具的效度都可以用数字来表示","D":"表面效度一般不作为工具质量的有效证据","E":"研究工具的信度高，效度也会高"},"a":"ACD","e":"效度指工具真正反映所期望概念的程度，是“高/低”的程度问题而非“有/无”，且并非都能用数字表示；表面效度一般不作工具质量有力证据；信度高效度不一定高，故B、E错。"},{"i":"2018_4_multi_30","t":"multi","s":"下列数据中可以用“均数”这一统计学指标来表示其分布形态的是","c":"研究资料的分析方法","sc":2,"o":{"A":"年龄","B":"工作年限","C":"职称","D":"血压值","E":"婚姻状况"},"a":"ABD","e":"均数适用于正态分布的计量资料；年龄、工作年限、血压值为计量资料；职称、婚姻状况为分类资料。"},{"i":"2018_4_multi_31","t":"multi","s":"在绘制统计图时，纵轴和横轴适宜的比例是","c":"研究资料的分析方法","sc":2,"o":{"A":"5：6","B":"5：7","C":"6：7","D":"7：6","E":"7：5"},"a":"BE","e":"统计图纵轴、横轴的比例以5:7或7:5为宜。"},{"i":"2018_4_multi_32","t":"multi","s":"下列有关参考文献书写要求的描述正确的是","c":"护理论文的撰写","sc":2,"o":{"A":"最好以近来3—5年内的最新文献为主","B":"可引用期刊、书籍，不能引用内部刊物","C":"期刊文章作者超过3人者要将作者名字全部写出","D":"正文中标注参考文献的格式为文字最后的右上角，用方括号标注数字","E":"若参考的书籍为第1版，则在文献书写时可不必标明版次"},"a":"ABDE","e":"参考文献以近3～5年最新文献为主，常引期刊、书籍而内部刊物等不列入；正文右上角用方括号角码标注；书籍第1版可不标版次；期刊作者不超过3人全部写出、超过者只写前3位加“等”，故C错。"},{"i":"2018_4_multi_33","t":"multi","s":"下列数据中可以说明所计算的两个变量间的相关是本质存在的，而不是由于抽样误差所致的是","c":"研究资料的分析方法","sc":2,"o":{"A":"r=0.127，P>0.05","B":"r=0.238，P<0.05","C":"r=-0.546，P<0.05","D":"r=-0.105，P>0.05","E":"r=0.346，P<0.01"},"a":"BCE","e":"当P<0.05(或P<0.01)时，认为相关有统计学意义，说明相关是本质存在而非抽样误差所致；P>0.05时不能认为相关存在。"},{"i":"2018_4_term_34","t":"term","s":"有方向性假设","c":"确立研究问题","sc":4,"at":"参考答案（要点）：有方向性假设是指明确指出两个(或多个)变量之间关系方向的研究假设，如指出两变量呈正相关或负相关、某因素使某指标升高或降低等；与之相对的是无方向性假设。","e":""},{"i":"2018_4_term_35","t":"term","s":"文献检索","c":"医学信息的获取与利用","sc":4,"at":"参考答案（要点）：文献检索是指根据文献的外表特征或内容特征，按照一定的方式编排并储存在一定的载体上，利用相应的方法、途径或手段，从检索系统中查出特定文献的过程。","e":""},{"i":"2018_4_term_36","t":"term","s":"非结构观察法","c":"资料收集的方法","sc":4,"at":"参考答案（要点）：非结构式观察法是指没有事先设计好正式记录格式、观察项目和记录表格，观察者在现场根据实际情况灵活、深入地进行观察和记录的方法，所获资料深入细致，常用于质性研究。","e":""},{"i":"2018_4_term_38","t":"term","s":"构成比","c":"研究资料的分析方法","sc":4,"at":"参考答案（要点）：构成比表示某事物内部各组成部分所占的比重或分布，常用百分比表示；同一事物各组成部分构成比之和为100%。","e":""},{"i":"2018_4_short_40","t":"short","s":"简述选择访谈类型时需考虑的问题。","c":"资料收集的方法","sc":5,"at":"参考答案（要点）：选择访谈类型(结构式、半结构式、非结构式)时应考虑：①研究目的和资料的性质，是需精确量化还是需深入探索；②研究问题的清晰度，问题已明确具体选结构式，问题不明、需探索选非结构式；③研究对象的特点和数量；④对资料深入程度的要求；⑤时间、人力等条件。一般问题明确、需统计分析用结构式，需深入、灵活用半结构或非结构式。","e":""},{"i":"2018_4_short_41","t":"short","s":"简述非实验性研究的局限性。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：非实验性研究是在完全自然状态下进行，研究者没有人为施加因素(即无护理干预措施)，也无法控制其他变量(外变量)的影响，因此一般情况下无法解释变量之间的因果关系，只能描述、比较现状。","e":""},{"i":"2018_4_short_42","t":"short","s":"简述撰写科研论文中讨论部分的注意事项。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：①以研究结果为基础，抓住重点、层次分明地分析和展开讨论；②与前人研究结果比较，分析异同原因，指出本研究的创新点及对护理实践的指导意义；③结合相关理论陈述论点，用已有理论分析结果；④避免重复描述结果或大量罗列文献而看不出自身解释；⑤结论应慎重，一般不单列结论项，可结合讨论叙述。","e":""},{"i":"2018_4_short_43","t":"short","s":"简述效标关联效度的两种类型。","c":"研究工具性能的测定","sc":5,"at":"参考答案（要点）：效标关联效度侧重反映研究工具与其他测量标准(效标)之间的相关关系，可分为两种：①同时效度(concurrent validity)：指工具与现有标准(同时获得的效标)之间的相关程度；②预测效度(predictive validity)：指工具作为未来情况预测指标的有效程度，即工具得分与将来效标之间的相关。","e":""},{"i":"2018_4_application_44","t":"application","s":"某学校共20个班，每个班均有40人，如要调查学生近视率，研究者计划进行整群抽样。请问什么是整群抽样?具体抽样方法是什么?整群抽样的优点有哪些?","c":"护理研究设计","sc":10,"at":"参考答案（要点）：整群抽样是先按某种属性将总体分为若干个群体(如以“班”为群)，再用随机方法抽取部分群体，对被抽中群体内的全部观察单位进行调查的抽样方法。具体方法：该校共20个班(群体)，先将20个班编号，用随机数字表或抽签法随机抽取若干个班，然后对抽中班内的全部40名学生全部调查近视率。优点：①易于组织实施、节省人力财力和时间；②调查集中、容易控制调查质量；③当群间差异较小、群内变异较大时，仍有较好的代表性和可行性。缺点是抽样误差较大。","e":""}]},{"key":"2018_10","name":"2018年10月","qs":[{"i":"2018_10_single_1","t":"single","s":"世界上第一份护理研究报告是关于","c":"绪论","sc":1,"o":{"A":"控制医院内感染","B":"分析护理教育的缺陷","C":"改进护理工作的程序","D":"对护理人员合理安排"},"a":"A","e":"南丁格尔通过观察记录作为改善护理工作的依据，写出了控制医院内感染的第一篇研究报告，这是护理学研究的开始。"},{"i":"2018_10_single_2","t":"single","s":"在获取研究对象的知情同意时，如需他人代行其知情同意权，正常的代行顺序为","c":"绪论","sc":1,"o":{"A":"子女—配偶—父母","B":"配偶—子女—父母","C":"父母—子女—配偶","D":"配偶—父母—子女"},"a":"B","e":"代行知情同意权的正常顺序一般为配偶—子女—父母—兄弟姐妹—其他亲属—同事等。"},{"i":"2018_10_single_3","t":"single","s":"某研究者根据其所获取到的一篇文献后面所列出的参考文献，逐一进行追查检索，得到原文，然后再从这些原文后所列的参考文献目录逐一扩大文献信息范围。这种文献检索方法是","c":"医学信息的获取与利用","sc":1,"o":{"A":"追溯法","B":"顺查法","C":"倒查法","D":"抽查法"},"a":"A","e":"追溯法(引文追溯法)是根据文献后所列参考文献逐一追查原文、并从原文后参考文献继续扩大检索范围的方法。"},{"i":"2018_10_single_4","t":"single","s":"在“体重与血压关系的探讨”这一研究中，“体重”是","c":"护理研究的基本程序","sc":1,"o":{"A":"自变量","B":"外变量","C":"依变量","D":"干扰变量"},"a":"A","e":"体重是拟探讨其变化是否影响血压的因素，是研究问题的“因”，即自变量；血压为因变量(依变量)。"},{"i":"2018_10_single_5","t":"single","s":"某研究者在选择观察机体缺氧程度的指标时，选择的是血氧饱和度而不是呼吸和面色，这是因为研究者特别考虑到了指标的","c":"确立研究问题","sc":1,"o":{"A":"准确性","B":"客观性","C":"灵敏性","D":"可行性"},"a":"C","e":"用血氧饱和度作为观察缺氧程度的指标，比呼吸和面色改变更为灵敏，体现了指标的灵敏性。"},{"i":"2018_10_single_6","t":"single","s":"在使用四格表专用公式进行χ²检验时，要求四格表中每个格子的理论数T要大于或等于","c":"研究资料的分析方法","sc":1,"o":{"A":"3","B":"4","C":"5","D":"6"},"a":"C","e":"四格表专用公式适用于n≥40且每个格子理论数T≥5；1≤T<5用校正公式，n<40或T<1用Fisher确切概率法。"},{"i":"2018_10_single_7","t":"single","s":"某研究者在MEDLINE数据库中对文献发表年代进行界定后再检索，那么他应该寻找的代表“出版年”的字段是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AU","B":"TI","C":"PT","D":"PY"},"a":"D","e":"PY—Publication Year—出版年；AU为著者，TI为篇名。"},{"i":"2018_10_single_8","t":"single","s":"在不知道研究对象分组情况的前提下进行研究过程中指标的观测、数据的收集和结论的判断，这种方法是","c":"护理研究设计","sc":1,"o":{"A":"随机化","B":"盲法","C":"预试验","D":"设立对照"},"a":"B","e":"盲法指研究对象或(和)资料收集、分析者不知道分组情况，以减少主观因素造成的信息性偏倚。"},{"i":"2018_10_single_9","t":"single","s":"类实验研究设计中一定要有","c":"护理研究设计","sc":1,"o":{"A":"对照组","B":"随机分组","C":"干预措施","D":"随机取样"},"a":"C","e":"类实验性研究对研究对象施加了干预措施，但缺少随机分组或(和)设立对照；干预是其必备内容。"},{"i":"2018_10_single_10","t":"single","s":"对特定人群进行定期随访，观察疾病或某种特征在该人群及个体中的动态变化是","c":"护理研究设计","sc":1,"o":{"A":"普查","B":"抽样调查","C":"现况调查","D":"纵向研究"},"a":"D","e":"纵向研究是对特定人群定期随访、观察疾病或特征在人群及个体中动态变化的描述性研究。"},{"i":"2018_10_single_11","t":"single","s":"通过使用脸谱、阶梯等形象图形，用于测评人们对某种经历的感受，例如疼痛、乏力、恶心、呼吸困难等的测评量表是","c":"资料收集的方法","sc":1,"o":{"A":"评定量表","B":"Likert量表","C":"语义差异量表","D":"视觉类似物量表"},"a":"D","e":"视觉类似物量表(VAS)传统用一条100mm直线表示程度差异，目前又设计出脸谱、阶梯等形象图形形式，用于测评疼痛、乏力等感受。"},{"i":"2018_10_single_12","t":"single","s":"某英国医师从1951年开始对居住在英国的注册医师就吸烟与医师发生肺癌的关系进行长达20年的研究，此研究属于","c":"护理研究设计","sc":1,"o":{"A":"回顾性研究","B":"病例对照研究","C":"队列研究","D":"现况调查"},"a":"C","e":"按暴露(吸烟)与否分组并前瞻随访20年追踪结局(肺癌)，属队列研究。"},{"i":"2018_10_single_13","t":"single","s":"先把个体聚集成群，然后随机抽取其中的几个群，被抽到的群中所有个体组成样本，这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"单纯随机抽样","B":"系统抽样","C":"分层抽样","D":"整群抽样"},"a":"D","e":"整群抽样是先将个体聚集成群，随机抽取部分群，对抽中群内全部个体组成样本。"},{"i":"2018_10_single_14","t":"single","s":"某研究者欲研究哮喘患者的自我照顾行为，如她选择病房的住院患者作为研究对象，对患者住院前的居家自我照顾行为进行调查，那么就会出现","c":"护理研究设计","sc":1,"o":{"A":"分组偏倚","B":"无应答偏倚","C":"诊断性偏倚","D":"入院率偏倚"},"a":"D","e":"以住院患者为研究对象研究居家行为，因住院率不同，住院患者不能代表全体哮喘患者，属入院率偏倚(Berkson偏倚)。"},{"i":"2018_10_single_15","t":"single","s":"某研究者在研究正式进行前，先对其要使用的人格问卷进行预试验，对10人在使用人格问卷问询后间隔1周再进行第2次测试，获得的2次测试分值的相关系数是0.85，此时研究者测评工具的信度是","c":"研究工具性能的测定","sc":1,"o":{"A":"重测信度","B":"折半信度","C":"内在一致性信度","D":"复本信度"},"a":"A","e":"用同一工具间隔一段时间两次测定同一对象，所得相关系数即重测信度，反映工具的稳定性。"},{"i":"2018_10_single_17","t":"single","s":"对于二分制的研究工具，即回答“是”或“否”，“正确”或“错误”的研究工具，在计算其信度时，最适用的信度类型是","c":"研究工具性能的测定","sc":1,"o":{"A":"折半信度","B":"Cronbach'α相关系数","C":"KR-20值","D":"复本信度"},"a":"C","e":"KR-20值是Cronbach α的特殊形式，专用于回答“是/否”“正确/错误”的二分制研究工具。"},{"i":"2018_10_single_18","t":"single","s":"反映正态分布计量资料的平均水平的指标是","c":"研究资料的分析方法","sc":1,"o":{"A":"标准差","B":"中位数","C":"四分位数间距","D":"均数"},"a":"D","e":"均数反映正态分布计量资料的平均(集中)水平；标准差、四分位数间距反映离散程度，中位数用于偏态资料。"},{"i":"2018_10_single_19","t":"single","s":"下列有关护理经验论文的描述，正确的是","c":"护理论文的撰写","sc":1,"o":{"A":"只可以写成功的经验，不能写失败的教训","B":"只可以写某种疾病的护理方法，不能写护理教学实践的体会","C":"在文中要加强和充实护理内容","D":"撰写形式单一，受固定格式约束"},"a":"C","e":"护理经验论文写作较灵活，应在文中加强和充实护理内容；成功经验与失败教训、疾病护理与教学体会均可写，不受固定格式约束。"},{"i":"2018_10_single_20","t":"single","s":"在撰写论文题目时，英文题目中的实词一般不超过","c":"护理论文的撰写","sc":1,"o":{"A":"10个","B":"15个","C":"20个","D":"25个"},"a":"A","e":"文题一般不超过20个汉字，英文题目一般不超过10个英文实词。"},{"i":"2018_10_multi_21","t":"multi","s":"在“静脉进针穿刺角度的探讨”这一研究中，研究者欲观察不同的进针角度与疼痛感之间的关系。此研究中外变量包括","c":"护理研究的基本程序","sc":2,"o":{"A":"进针角度","B":"穿刺部位","C":"疼痛感","D":"操作者的熟练程度","E":"研究对象对疼痛的耐受性"},"a":"BDE","e":"进针角度是自变量、疼痛感是因变量；穿刺部位、操作者熟练程度、研究对象疼痛耐受性为可能影响结果的外变量。"},{"i":"2018_10_multi_22","t":"multi","s":"下列有关研究假设的描述，正确的是","c":"确立研究问题","sc":2,"o":{"A":"假设是预期性的研究结果","B":"假设是对变量之间关系的暂时性答案","C":"假设无需研究最后进行肯定或否定","D":"假设可以帮助研究者明确研究目的","E":"假设是根据相关的理论和知识进行归纳推理后产生的"},"a":"ABDE","e":"假设是对变量间关系的暂时性、预期性答案，由理论和知识归纳推理产生，可帮助明确研究目的；研究最后应对假设予以肯定或否定，故C错。"},{"i":"2018_10_multi_23","t":"multi","s":"下列有助于提高文献阅读效率的策略是","c":"医学信息的获取与利用","sc":2,"o":{"A":"先读专题文献，后读综合性文献","B":"先粗读，后精读","C":"先读文摘后读原文","D":"先读中文文献，后读外文文献","E":"先读过刊文献，后读现刊文献"},"a":"BCD","e":"阅读五先五后：先读文摘后读原文、先粗读后精读、先读综合性文献后读专题性文献、先读现刊后读过刊、先读中文后读外文。故A、E错误。"},{"i":"2018_10_multi_24","t":"multi","s":"下列有关“理论与概念框架”的描述正确的是","c":"确立研究问题","sc":2,"o":{"A":"理论/概念框架在每一份研究报告中都要呈现","B":"理论/概念框架可以统领文献知识","C":"理论/概念框架具备逻辑性和指导性两个特征","D":"理论/概念框架可呈现研究相关概念及概念间的关系","E":"理论/概念框架是研究设计的基础"},"a":"BCDE","e":"理论/概念框架可统领文献知识、呈现概念及概念间关系，具备逻辑性和指导性，是研究设计的基础；但描述性研究等不一定需要理论框架，故A错。"},{"i":"2018_10_multi_25","t":"multi","s":"设立对照组的目的是","c":"护理研究设计","sc":2,"o":{"A":"排除与研究无关的干扰因素的影响","B":"人为施加干预措施","C":"突出实验中干预的效应","D":"使样本更具代表性","E":"使设计内容顺利进行"},"a":"AC","e":"设对照的目的是排除与研究无关的干扰因素(外变量)的影响，突出实验中干预措施的效应。"},{"i":"2018_10_multi_27","t":"multi","s":"访谈法的缺点包括","c":"资料收集的方法","sc":2,"o":{"A":"费时","B":"花费大","C":"应答率低","D":"所获资料不完整","E":"影响因素较多"},"a":"ABE","e":"访谈法缺点为费时、花费大、影响因素较多；访谈法应答率较高、所获资料较完整丰富，故C、D错。"},{"i":"2018_10_multi_28","t":"multi","s":"某些生理现象无法观察，例如恶心、头晕、乏力等，此时可选择的资料收集方法是","c":"资料收集的方法","sc":2,"o":{"A":"问卷调查法","B":"访谈法","C":"电子仪器监测","D":"录像法","E":"测量法"},"a":"AB","e":"恶心、头晕、乏力等主观症状无法直接观察，宜采用问卷调查法或访谈法由研究对象自陈；录像法属观察法，电子仪器监测、测量法难以获取此类主观症状。"},{"i":"2018_10_multi_29","t":"multi","s":"研究问题可以来自","c":"确立研究问题","sc":2,"o":{"A":"临床实践经验","B":"研究者的灵感","C":"对科研文献的审慎评价","D":"弥补文献的缺陷","E":"验证未经检验的理论的兴趣"},"a":"ACDE","e":"研究问题可来自临床实践经验、对科研文献的审慎评价与弥补文献缺陷、验证未经检验理论的兴趣及个人兴趣；凭空灵感不是可靠来源。"},{"i":"2018_10_multi_30","t":"multi","s":"下列对于研究工具的信度和效度的描述，正确的是","c":"研究工具性能的测定","sc":2,"o":{"A":"信度是指使用某研究工具所获得结果的一致程度或准确程度","B":"效度是指某一研究工具能真正反映它所期望研究的概念的程度","C":"信度和效度都要通过具体数值进行描述","D":"只要研究工具存在，就会有它的信度和效度","E":"信度低的研究工具效度肯定不高"},"a":"ABE","e":"信度指结果的一致或准确程度，效度指工具真正反映所期望概念的程度；信度低则效度必低；但信度效度并非都能用数字表示、也非有工具就必然有，故C、D错。"},{"i":"2018_10_multi_31","t":"multi","s":"下列有关抽样误差的相关描述，正确的是","c":"研究资料的分析方法","sc":2,"o":{"A":"只要是抽样研究，就必然存在抽样误差","B":"抽样误差是可以通过一些方法避免的","C":"由于总体中各个体之间存在差异导致产生抽样误差","D":"选择变异程度大的指标可以减少抽样误差","E":"适当的样本量可以减少抽样误差"},"a":"ACE","e":"抽样研究必然存在由个体差异(抽样偶然性)导致、无法避免的抽样误差，可通过随机抽样、适当样本量、选择变异小的指标来减少；B、D错误。"},{"i":"2018_10_multi_32","t":"multi","s":"下列有关统计图的相关描述，正确的是","c":"研究资料的分析方法","sc":2,"o":{"A":"圆图适用于构成比资料","B":"直条图可以分为单式直条图和复式直条图","C":"统计图的图号和图题写在图的上方","D":"纵轴刻度一般以0为起始点","E":"刻度应均匀等距，标明数值"},"a":"ABDE","e":"圆图适用于构成比资料；直条图分单式和复式；纵轴刻度一般以0为起始点、刻度均匀等距并标明数值；图号图题写在图下方中央，故C错。"},{"i":"2018_10_multi_33","t":"multi","s":"《贝尔蒙报告》中所强调的基本伦理原则包括","c":"绪论","sc":2,"o":{"A":"公正的原则","B":"有益的原则","C":"知情同意的原则","D":"尊重人尊严的原则","E":"评估益处与风险的原则"},"a":"ABD","e":"《贝尔蒙报告》强调的三项基本伦理原则为尊重人(尊严)的原则、有益的原则和公正的原则；知情同意、评估益处与风险是其具体体现而非并列三原则。"},{"i":"2018_10_term_34","t":"term","s":"零次文献","c":"医学信息的获取与利用","sc":4,"at":"参考答案（要点）：零次文献是指未经发表、未进入社会交流、未经系统加工整理的最原始文献，如书信、手稿、草稿、实验原始记录、保密文件等。","e":""},{"i":"2018_10_term_35","t":"term","s":"表面效度","c":"研究工具性能的测定","sc":4,"at":"参考答案（要点）：表面效度是由评估人根据自己对所要测量概念的理解，尽其判断能力之所及来判定研究工具是否适当的效度；它停留在工具表面，用“有/无”反映，一般不作为工具质量的有力证据，常用于效度测定的开始阶段。","e":""},{"i":"2018_10_term_36","t":"term","s":"研究设计","c":"护理研究设计","sc":4,"at":"参考答案（要点）：研究设计是指对整个研究的组织结构、研究方法、抽样、资料收集与分析方案等进行的总体规划和安排，是指导研究具体实施的蓝图，用以保证研究目的的实现。","e":""},{"i":"2018_10_term_39","t":"term","s":"护理研究论文","c":"护理论文的撰写","sc":4,"at":"参考答案（要点）：护理研究论文是护理科研工作者针对护理领域的研究课题，运用科学方法进行研究后写成的、记录和描述科研成果的学术性论文；其基本特征包括科学性、创新性、逻辑性(可读性)等，其中科学性是最重要的。","e":""},{"i":"2018_10_short_40","t":"short","s":"如何根据性质和程度对研究风险进行分类。","c":"绪论","sc":5,"at":"参考答案（要点）：根据风险的性质和程度，研究风险可分为四类：①无可预见的影响；②暂时的不适：如填写问卷、花费时间精力所致疲劳焦虑，随研究结束即消失；③较严重的暂时不适：如较长时间的肌肉无力、关节疼痛、嗜睡等较明显但可恢复的不适；④永久性伤害的可能：可能造成不可逆损害的严重风险。","e":""},{"i":"2018_10_short_41","t":"short","s":"简述混杂性偏倚的控制方法。","c":"护理研究设计","sc":5,"at":"参考答案（要点）：混杂性偏倚的控制方法主要有：①随机化：使各组除研究因素外其他特征均衡分布；②匹配：为观察组研究对象匹配具有相同混杂因素的对照；③分层：按混杂因素分层分析；④多因素分析：用统计方法调整混杂因素的影响。","e":""},{"i":"2018_10_short_42","t":"short","s":"简述绘制统计表的注意事项。","c":"研究资料的分析方法","sc":5,"at":"参考答案（要点）：绘制统计表应注意：①重点突出：一个表以表达一个中心内容为宜；②层次清楚：主语、宾语分别作横标目和纵标目；③简洁明了：表中文字、数字、线条尽量从简；④统计表与文字描述结合使用，可用文字对表格内容总结补充，但不简单重复数字。","e":""},{"i":"2018_10_short_43","t":"short","s":"简述护理综述论文的特征。","c":"护理论文的撰写","sc":5,"at":"参考答案（要点）：护理综述论文的特征：①是就某一专题在一定时期内的研究进展进行归纳、分析和评价的学术论文；②资料全部来自已发表的文献，是对他人研究成果的综合评述；③应反映该专题的新动态、新进展，并有作者的观点和评价；④选题明确具体、有实用价值和创新，引用文献应是作者亲自阅读的较新、较有价值的文献。","e":""},{"i":"2018_10_application_44","t":"application","s":"如某护理研究者使用病例对照研究设计，对已经确诊为2型糖尿病5年的患者按照已经出现并发症和未出现并发症分为两组，对这两组患者进行预防并发症的自我护理行为的比较。请回答病例对照研究的概念和这位护理研究者使用这种方法的研究目的。","c":"护理研究设计","sc":10,"at":"参考答案（要点）：病例对照研究是一种回顾性、由果查因的比较性研究：先按是否患有某病(或出现某结局)分为病例组和对照组，再追溯两组既往暴露于某因素的情况，比较两组暴露率的差异，以推断该暴露因素与疾病(结局)之间的关系。本研究中，以已出现并发症者为病例组、未出现并发症者为对照组，回顾比较两组预防并发症的自我护理行为(暴露)的差异。研究目的：通过比较两组自我护理行为的差异，分析哪些自我护理行为与2型糖尿病并发症的发生有关，从而为指导糖尿病患者采取恰当的自我护理、预防并发症提供依据。","e":""}]},{"key":"2019_4","name":"2019年4月","qs":[{"i":"2019_4_single_1","t":"single","s":"通过科学的方法系统地探究现存的或产生新的知识从而直接或间接地指导护理实践的活动过程，称为","c":"绪论","sc":1,"o":{"A":"护理评估","B":"护理研究","C":"护理计划","D":"护理理论"},"a":"B","e":"护理研究是通过科学方法系统探究现存或产生新知识、并直接或间接指导护理实践的活动过程。"},{"i":"2019_4_single_2","t":"single","s":"研究者应告知研究对象整个研究的所有事宜，研究对象有权决定是否参加研究，并有权决定在任何时候都有权终止参与，并且不受到治疗和护理上的任何惩罚和歧视，这是研究对象的","c":"绪论","sc":1,"o":{"A":"免于遭受伤害或不适的权利","B":"不被剥削或利用的权利","C":"自主决定权","D":"充分认知的权利"},"a":"C","e":"自主决定权指研究对象有权决定是否参加研究、并可在任何时候无条件终止参与而不受惩罚歧视；充分认知权是被告知研究全部事宜。"},{"i":"2019_4_single_3","t":"single","s":"“中西医结合治疗结石病的疗效观察”这一科研选题存在的最主要问题是","c":"确立研究问题","sc":1,"o":{"A":"范围过小","B":"不够明确","C":"过于具体","D":"不够深入"},"a":"B","e":"该题目“中西医结合治疗”指什么、结石病是何部位、疗效如何均不明确，属选题不够明确具体。"},{"i":"2019_4_single_4","t":"single","s":"可经测量取得数值，多有度量衡单位，如身高（cm）、体重（kg）等，此类资料为","c":"研究资料的分析方法","sc":1,"o":{"A":"分类变量","B":"数值变量","C":"计数资料","D":"等级资料"},"a":"B","e":"数值变量(计量资料)是通过测量所得、有度量衡单位的数值资料，如身高、体重。"},{"i":"2019_4_single_5","t":"single","s":"“自杀率与社会凝聚力成反比”这一研究假设的不足是","c":"确立研究问题","sc":1,"o":{"A":"不清晰","B":"不具体","C":"不容易被验证","D":"不可以测量"},"a":"C","e":"该假设清晰、具体，但“社会凝聚力”难以界定和测量，因而不容易被验证。"},{"i":"2019_4_single_6","t":"single","s":"按学科内部逻辑次序排列，从总论到各论，从一般到具体，从低级到高级，从简单到复杂，分门别类进行编排，配有分类号的检索系统是","c":"医学信息的获取与利用","sc":1,"o":{"A":"分类目录","B":"书名目录","C":"著者目录","D":"主题目录"},"a":"A","e":"分类目录按学科逻辑次序、分门别类编排，配分类号检索系统。"},{"i":"2019_4_single_7","t":"single","s":"MEDLINE中著者地址的字段名称缩写是","c":"医学信息的获取与利用","sc":1,"o":{"A":"AB","B":"AD","C":"AI","D":"AN"},"a":"B","e":"AD—Author Address—著者地址。"},{"i":"2019_4_single_8","t":"single","s":"某位研究者欲研究结肠造口患者出院后的自我照顾造口能力的变化情况，研究者分别在出院后的1个月，3个月和6个月收集相关的资料进行分析。这位研究者使用的研究设计类型是","c":"护理研究设计","sc":1,"o":{"A":"实验性研究","B":"类实验性研究","C":"纵向研究","D":"普查"},"a":"C","e":"对同一研究对象在出院后1、3、6个月多次随访、观察造口照顾能力的动态变化，属纵向研究。"},{"i":"2019_4_single_9","t":"single","s":"在概率抽样的四种抽样方法中，抽样误差最小的方法是","c":"护理研究设计","sc":1,"o":{"A":"分层抽样","B":"系统抽样","C":"单纯随机抽样","D":"整群抽样"},"a":"A","e":"分层抽样将总体按重要特征分层后再抽样，层内差异小、代表性好，抽样误差最小。"},{"i":"2019_4_single_10","t":"single","s":"某研究者在其研究中先访问具有代表性的某人，然后由被访问者推荐，再访问第二人，访问第二人后，由第二人推荐，再访问第三人，如此继续下去，逐渐增加样本人数，从而达到研究目的。这种抽样方法是","c":"护理研究设计","sc":1,"o":{"A":"方便抽样","B":"理论抽样","C":"目的抽样","D":"网络抽样"},"a":"D","e":"网络抽样(滚雪球抽样)是通过已有研究对象推荐、逐步扩大样本，适合难以接触的特定人群。"},{"i":"2019_4_single_11","t":"single","s":"下列有关实验性研究和类实验性研究之间比较的描述，正确的是","c":"护理研究设计","sc":1,"o":{"A":"实验性研究的可行性更高","B":"类实验性研究不易触犯伦理原则","C":"实验性研究较为实用","D":"类实验性研究所获得的结果可信度更高"},"a":"B","e":"类实验性研究缺少随机分组或对照，在临床中更易实施、不易因强行分组而触犯伦理；其实验性研究证据等级和可信度更高。"},{"i":"2019_4_single_12","t":"single","s":"下列有关自设问卷的内容排列顺序的描述，错误的是","c":"资料收集的方法","sc":1,"o":{"A":"问卷应从开放式问题开始","B":"同一主题的问题应集中在一起","C":"开放式问题应留出足够空间填写","D":"敏感的问题一般放在问卷的最末"},"a":"A","e":"问卷应从简单、容易回答的封闭式问题开始，开放式问题宜放在后面；故“从开放式问题开始”错误。"},{"i":"2019_4_single_13","t":"single","s":"自设问卷时，针对儿童的问题，完成的时间不应超过","c":"资料收集的方法","sc":1,"o":{"A":"10分钟","B":"15分钟","C":"20分钟","D":"25分钟"},"a":"B","e":"成人问卷完成时间一般不超过30分钟，针对儿童的问卷完成时间不应超过15分钟。"},{"i":"2019_4_single_14","t":"single","s":"在定性研究中使用观察法进行资料收集，为减少人为造成的不自然性并保证观察结果的真实性，研究人员的角色不应该是","c":"资料收集的方法","sc":1,"o":{"A":"局外观察者","B":"参与性观察者","C":"观察性参与者","D":"完全参与者"},"a":"A","e":"为减少人为不自然、保证观察真实，以观察性参与者和完全参与者两种角色较好，定性研究中角色起码应是参与性观察者；故不应是局外观察者。"},{"i":"2019_4_single_15","t":"single","s":"用于反映研究工具的稳定性特征的信度测量方法是","c":"研究工具性能的测定","sc":1,"o":{"A":"内在一致性","B":"评定者间一致性系数","C":"复本信度","D":"重测信度"},"a":"D","e":"重测信度用同一工具间隔一段时间重复测量同一对象，反映工具的稳定性。"},{"i":"2019_4_single_16","t":"single","s":"某研究者的研究工具是评判护理人员对失智症相关知识的了解情况，每个测评条目的选项均为“正确”和“错误”两类，该工具内在一致性的测评方法应选择","c":"研究工具性能的测定","sc":1,"o":{"A":"Cronbach'α","B":"KR-20","C":"折半信度","D":"重测信度"},"a":"B","e":"KR-20值专用于回答“正确/错误”“是/否”的二分制研究工具的内在一致性。"},{"i":"2019_4_single_17","t":"single","s":"选择用作研究的病例时，由于纳入标准和排除标准不统一而引起的偏倚是","c":"护理研究设计","sc":1,"o":{"A":"测量偏倚","B":"混杂性偏倚","C":"回忆偏倚","D":"诊断性偏倚"},"a":"D","e":"诊断性偏倚指选择用作研究的病例时，诊断不准确或纳入、排除标准不统一而引起的偏倚。"},{"i":"2019_4_single_18","t":"single","s":"下列有关统计表绘制要求的描述正确的是","c":"研究资料的分析方法","sc":1,"o":{"A":"统计表中可以有竖线和斜线","B":"统计表中缺失数据时用“-”表示","C":"表题写在表的下方中央","D":"表格中数字的小数点后位数保持一致"},"a":"D","e":"统计表采用三线表，不应有竖线和斜线；缺失数据用“…”、无数字用“——”；表题写在表上方中央；表内数字小数点后位数应保持一致。"},{"i":"2019_4_single_19","t":"single","s":"下列适合于构成比资料，描述各类别所占的构成比的统计图类型是","c":"研究资料的分析方法","sc":1,"o":{"A":"圆图","B":"直条图","C":"线图","D":"散点图"},"a":"A","e":"圆图(百分条图)适用于构成比资料，描述各组成部分所占比例。"},{"i":"2019_4_single_20","t":"single","s":"撰写论文时，文题中的汉字数量一般不要超过","c":"护理论文的撰写","sc":1,"o":{"A":"15","B":"20","C":"25","D":"30"},"a":"B","e":"文题一般不超过20个汉字。"},{"i":"2019_4_multi_21","t":"multi","s":"伦理审查委员会审查的内容包括","c":"绪论","sc":2,"o":{"A":"研究的科学性","B":"研究的可行性","C":"研究的创新性","D":"研究的可操作性","E":"研究的伦理原则"},"a":"AE","e":"伦理审查委员会(IRB)审查内容主要包括研究的科学性和研究的伦理原则(伦理考虑、知情同意、利益风险比、保密原则等)。"},{
