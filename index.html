素或口服降糖药过量、食物摄入不足(非过量)、运动过量、饮酒过量等。"},{"i":"2025_10_multi_35","t":"multi","s":"按照与宿主动物的接触方式进行狂犬病暴露分级，属于II级的有","c":"损伤急症患者的护理","sc":2,"o":{"A":"接触或喂养动物","B":"裸露的皮肤被轻咬","C":"无出血的轻微抓伤","D":"破损皮肤被舔舐","E":"黏膜被患畜唾液污染"},"a":"BC","e":"II级暴露为裸露的皮肤被轻咬、无出血的轻微抓伤擦伤。接触或喂养动物为I级；破损皮肤被舔舐、黏膜被患畜唾液污染为III级。"},{"i":"2025_10_short_36","t":"short","s":"简述采用动脉血气分析判断酸碱平衡紊乱的步骤。","c":"危重症患者的护理","sc":5,"at":"参考答案（要点）：第一步，看pH：pH<7.35为酸中毒，pH>7.45为碱中毒，pH正常为代偿性或无紊乱；第二步，看PaCO₂：PaCO₂>45mmHg提示呼吸性酸中毒，PaCO₂<35mmHg提示呼吸性碱中毒；第三步，看HCO₃⁻(SB/AB)：HCO₃⁻>27mmol/L提示代谢性碱中毒，HCO₃⁻<22mmol/L提示代谢性酸中毒；第四步，判断是单纯性还是混合性紊乱：若pH改变方向与PaCO₂和HCO₃⁻一致，则为单纯性紊乱；若两者变化方向相反，则为混合性紊乱；第五步，计算AG(阴离子间隙)：AG>16mmol/L提示高AG型代谢性酸中毒。","e":""},{"i":"2025_10_short_37","t":"short","s":"简述可引起急性上消化道出血的全身性疾病。","c":"消化系统急症患者的护理","sc":5,"at":"参考答案（要点）：①血管性疾病：过敏性紫癜、遗传性出血性毛细血管扩张症等；②血液系统疾病：白血病、血小板减少性紫癜、血友病、DIC等；③应激相关胃黏膜损伤：严重感染、休克、创伤、手术、脑血管意外等应激状态下发生的急性胃黏膜病变；④结缔组织病：系统性红斑狼疮、结节性多动脉炎等；⑤急性感染：流行性出血热、钩端螺旋体病等；⑥其他：尿毒症、肺源性心脏病、肺气肿合并感染等。","e":""},{"i":"2025_10_short_38","t":"short","s":"简述尿石症患者疼痛护理的措施。","c":"泌尿系统急症患者的护理","sc":5,"at":"参考答案（要点）：①体位护理：嘱患者取屈膝侧卧位，减轻腹部张力从而减轻疼痛；②用药护理：急性剧烈腹痛不能忍受、诊断明确时，遵医嘱给予解痉镇痛药物如山莨菪碱、哌替啶等肌内注射；③用药后观察：注意观察药物不良反应(眩晕、出汗、口干、恶心、呕吐、心动过速及直立性低血压等)，根据药物作用时间评估疼痛变化情况；④分散注意力：指导患者放松、深呼吸，听音乐等分散注意力；⑤病情观察：观察疼痛的部位、性质、程度、持续时间及伴随症状，有无感染、梗阻加重等。","e":""},{"i":"2025_10_short_39","t":"short","s":"简述服用抗癫痫药物的护理要点。","c":"神经系统急症患者的护理","sc":5,"at":"参考答案（要点）：①用药指导：遵医嘱按时、按量服药，不可随意增减药量或停药，停药过程一般需半年至1年以上逐渐减量；②观察疗效：观察癫痫发作的频率、持续时间、程度有无改善；③观察不良反应：常见不良反应有胃肠道反应、嗜睡、眩晕、共济失调、牙龈增生、皮疹等，定期复查血常规、肝肾功能；④安全指导：服药期间避免驾驶、高空作业、游泳等危险活动；⑤健康教育：指导患者及家属了解药物作用和副作用，随身携带疾病信息卡，避免诱因(疲劳、饥饿、饮酒、情绪激动等)。","e":""},{"i":"2025_10_essay_40","t":"essay","s":"试述机械通气时维持足够氧供及通气的护理要点。","c":"急救技术","sc":10,"at":"参考答案（要点）：①正确连接呼吸机：确认呼吸机管道连接紧密无漏气，湿化器温度调节在32~35℃；②选择合适的通气模式和参数：根据患者病情选择控制通气/辅助通气模式，潮气量6~8ml/kg，呼吸频率12~20次/分，吸呼比1:1.5~2，FiO₂根据SpO₂调整维持SpO₂≥90%；③监测气道压力：观察气道峰压、平台压变化，气压过高时检查是否有痰液堵塞、人机对抗、支气管痉挛等；④保持呼吸道通畅：定时吸痰，吸痰前后给予纯氧吸入，每次吸痰时间不超过15s，严格无菌操作；⑤监测血气分析：机械通气后30min复查血气，根据结果调整呼吸机参数；⑥预防人机对抗：必要时遵医嘱使用镇静剂，患者清醒时做好解释取得配合；⑦预防并发症：观察有无呼吸机相关性肺炎、气压伤、氧中毒、呼吸道堵塞等；⑧心理护理：关心患者，做好解释，使用非语言方式与患者交流；⑨拔管护理：病情稳定后逐步撤机，拔管后观察有无喉头水肿、呼吸困难等。","e":""},{"i":"2025_10_case_41","t":"case","s":"某护士于公交站台候车时，目睹一中年男性突然倒地，患者对拍打肩部及呼唤无反应，呼吸停止，颈动脉搏动消失。护士立即请公交站工作人员拨打急救电话并取AED。请写出：（1）该患者最可能出现的问题及判断依据；（2）护士此时应立即实施的心肺复苏技术及其要点。","c":"心肺复苏","sc":15,"at":"参考答案（要点）：（1）该患者最可能为心搏骤停。判断依据：①突然倒地；②对拍打肩部及呼唤无反应(意识丧失)；③呼吸停止；④颈动脉搏动消失。以上为非专业人员判断心搏骤停的依据。（2）护士应立即实施心肺复苏：①体位：患者仰卧于平坦硬地面上，解开衣领裤带；②胸外按压(C)：按压部位为胸骨下半部(两乳头连线与胸骨交界处)，一手掌根放在按压部位，另一手叠放其上，双臂伸直垂直向下按压，按压频率100~120次/分，深度5~6cm，按压与放松时间比1:1，放松时手掌不离开胸壁；③开放气道(A)：采用仰头抬颏法，清除口腔异物和分泌物；④人工通气(B)：口对口人工呼吸，每次吹气1s见胸廓起伏，按压-通气比为30:2，做5个循环(约2分钟)后评估；⑤AED到达后立即使用：按语音提示粘贴电极片，分析心律时停止按压，如为可除颤心律按下除颤按钮，除颤后立即继续CPR；⑥持续进行CPR直到专业急救人员到达接手。","e":""},{"i":"2025_10_case_42","t":"case","s":"患者，男性，68岁，晨起买早点途中突发胸痛，呈撕裂样，剧烈难忍，伴大汗，无明显放射痛，持续5小时未缓解，遂至急诊。查体：神志清楚，急性病容，T36.1℃，HR92次/分，R20次/分，BP右上肢175/80mmHg，左上肢150/65mmHg，心肺腹(-)。心肌损伤标志物及血浆D-二聚体均未见增高。患者既往高血压病史15年，未规律治疗，血压最高达200/150mmHg。请写出：（1）该患者胸痛最可能的原因；（2）针对该患者的急救护理措施。","c":"心血管系统急症患者的护理","sc":15,"at":"参考答案（要点）：（1）该患者最可能的诊断为主动脉夹层。依据：①突发撕裂样剧烈胸痛，持续不缓解；②既往长期高血压病史(最高200/150mmHg)未规律治疗；③双上肢血压不一致(右上肢175/80mmHg vs 左上肢150/65mmHg)；④心肌损伤标志物正常可排除急性心肌梗死；⑤D-二聚体未见增高。（2）急救护理措施：①绝对卧床休息，避免情绪激动和用力，严密监测生命体征、心电、血氧饱和度；②迅速建立静脉通路，遵医嘱给予降压治疗：首选静脉用药将收缩压迅速降至100~120mmHg左右，可使用硝普钠静脉泵入，同时使用β受体阻滞剂(如艾司洛尔)降低心肌收缩力、减慢心率；③镇痛：遵医嘱给予吗啡或哌替啶肌内注射缓解剧烈疼痛；④吸氧：保持呼吸道通畅，给予氧气吸入；⑤严密观察病情：观察胸痛性质、部位变化，监测双侧桡动脉、足背动脉搏动情况，观察有无脏器缺血表现；⑥做好急诊手术或介入治疗的术前准备：备皮、配血、皮试、禁食水等；⑦心理护理：安抚患者情绪，避免紧张加重血压升高；⑧控制血压：将心率控制在60次/分左右，收缩压控制在100~120mmHg。","e":""}]}]},{"id":"intro","name":"护理学导论","code":"03201","color":"#5b6abf","icon":"📖","wrongKey":"nursing_intro_wrong_v1","papers":[{"key":"2017_4","name":"2017年4月","qs":[{"i":"2017_4_single_1","t":"single","s":"以“人的健康为中心”阶段的护理特点是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"以护理理论指导护理实践","B":"护理人员的工作场所在医院","C":"对病人实施责任制护理","D":"服务对象主要为病人"},"a":"A","e":"以人的健康为中心阶段护理学成为独立学科，以护理理论指导护理实践，服务对象扩大到健康人与病人。"},{"i":"2017_4_single_2","t":"single","s":"文化关怀与健康层属于日出模式的","c":"文化和护理","sc":1,"o":{"A":"Ⅰ级","B":"Ⅱ级","C":"Ⅲ级","D":"Ⅳ级"},"a":"B","e":"日出模式Ⅱ级为文化关怀与健康层，显示不同文化背景下的文化关怀形态及表达方式。"},{"i":"2017_4_single_3","t":"single","s":"一位急性肾炎病人痊愈后仍不愿出院，可能出现的角色适应问题是","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"B","e":"安于病人角色、退缩依赖、害怕出院属病人角色行为强化，多发生于恢复期。"},{"i":"2017_4_single_4","t":"single","s":"下列关于文化特征的描述正确的是","c":"文化和护理","sc":1,"o":{"A":"文化的第一要素就在于它对自然界的描述","B":"文化不是对个人的描述，仅仅体现出个人特征的现象不属于文化现象","C":"文化在某一特定的地域发生、发展和成熟，不能被其他地域所接受、吸收和同化","D":"儒家思想成为中华民族的道德意识、精神生活和传统习惯的准则，体现了文化的超个人性"},"a":"D","e":"儒家思想成为中华民族共同的道德意识、精神生活与传统习惯准则，体现文化的超个人性（群体性）。"},{"i":"2017_4_single_5","t":"single","s":"从个别或特殊的知识中概括出一般知识的方法是","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"观察","B":"归纳","C":"演绎","D":"综合"},"a":"B","e":"归纳是从个别或特殊事实中概括出一般原理的思维方法。"},{"i":"2017_4_single_6","t":"single","s":"护士对病人住院环境的管理属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"依赖性护理措施","B":"合作性护理措施","C":"独立性护理措施","D":"授权性护理措施"},"a":"C","e":"护理人员运用专业知识独立决定、实施的措施属独立性护理措施。"},{"i":"2017_4_single_7","t":"single","s":"护理人员与服务对象、其他医务人员密切合作，以全面满足服务对象的需求，体现了护理程序的","c":"护理程序","sc":1,"o":{"A":"互动性","B":"系统性","C":"科学性","D":"普遍性"},"a":"A","e":"护理程序是护士与服务对象及其他人员互动合作的过程，体现互动性。"},{"i":"2017_4_single_8","t":"single","s":"根据护理理论的着重点不同，罗依(Roy)适应理论属于","c":"护理专业理论及模式","sc":1,"o":{"A":"以需要及问题为中心的护理理论","B":"以护患关系为中心的护理理论","C":"以系统为中心的护理理论","D":"以能量源为中心的护理理论"},"a":"C","e":"以系统为中心的理论代表人有Roy、Neuman、Leininger等，认为人是开放系统。"},{"i":"2017_4_single_9","t":"single","s":"奥瑞姆(Orem)自理理论中的护理系统有","c":"护理专业理论及模式","sc":1,"o":{"A":"2个","B":"3个","C":"4个","D":"5个"},"a":"B","e":"Orem护理系统分完全补偿、部分补偿、支持教育三个。"},{"i":"2017_4_single_10","t":"single","s":"对护理对象认知感受型态的评估属于护理评估内容中的","c":"护理程序","sc":1,"o":{"A":"一般资料","B":"生活状况及自理程度","C":"健康检查","D":"心理社会资料"},"a":"D","e":"认知感受型态属心理社会方面的评估资料。"},{"i":"2017_4_single_11","t":"single","s":"在进行健康教育时运用现代技术手段，如影像、照片等生动地展示教学内容，体现了健康教育的","c":"健康教育","sc":1,"o":{"A":"启发性","B":"通俗性","C":"直观性","D":"针对性"},"a":"C","e":"运用影像、照片等直观手段生动展示内容体现直观性。"},{"i":"2017_4_single_12","t":"single","s":"由于战争带来的伤残与死亡，属于影响健康因素中的","c":"健康与疾病","sc":1,"o":{"A":"生物因素","B":"心理因素","C":"文化因素","D":"社会环境因素"},"a":"D","e":"战争属社会环境因素。"},{"i":"2017_4_single_13","t":"single","s":"悲哀在认知方面的反应，可表现为","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"痛苦、愤怒、焦虑","B":"头疼、失眠","C":"心不在焉、健忘","D":"睹物思人、行为怪异"},"a":"C","e":"悲哀在认知方面表现为心不在焉、健忘、幻觉等；痛苦愤怒焦虑属情感，头疼失眠属生理。"},{"i":"2017_4_single_14","t":"single","s":"根据艾瑞克森的心理社会发展理论，青春期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"勤奋对自卑","B":"自我认同对角色混乱","C":"亲密对孤独","D":"精力充沛对颓废迟滞"},"a":"B","e":"青春期(12~18岁)发展危机为自我认同对角色混乱。"},{"i":"2017_4_single_15","t":"single","s":"重症监护病房允许家属每天中午12点有15分钟的探视时间，这主要是为了满足病人的","c":"护理相关理论及模式","sc":1,"o":{"A":"生理的需要","B":"爱与归属的需要","C":"自尊的需要","D":"自我实现的需要"},"a":"B","e":"允许家属探视满足病人爱与归属的需要。"},{"i":"2017_4_single_16","t":"single","s":"下列属于昏迷病人首优护理问题的是","c":"护理程序","sc":1,"o":{"A":"有感染的危险","B":"清理呼吸道无效","C":"皮肤完整性受损","D":"营养失调：低于机体需要量"},"a":"B","e":"昏迷病人首要保证呼吸道通畅，首优问题为清理呼吸道无效。"},{"i":"2017_4_single_17","t":"single","s":"护士为病人进行静脉穿刺应使用的沟通距离是","c":"护患关系与人际沟通","sc":1,"o":{"A":"亲密距离","B":"人际距离","C":"社会距离","D":"公众距离"},"a":"A","e":"静脉穿刺为近距离身体操作，属亲密距离(约15cm以内)。"},{"i":"2017_4_single_18","t":"single","s":"沟通的最低层次是","c":"护患关系与人际沟通","sc":1,"o":{"A":"礼节性沟通","B":"陈述性沟通","C":"分享性沟通","D":"情感性沟通"},"a":"A","e":"鲍威尔沟通层次由低到高：礼节性、陈述性、分享性、情感性、共鸣性；礼节性为最低。"},{"i":"2017_4_single_19","t":"single","s":"病人说：“我伤口疼，是不是感染了？”，这属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"礼节性沟通","B":"陈述性沟通","C":"分享性沟通","D":"情感性沟通"},"a":"C","e":"除陈述事实外还加入个人判断、推测，属分享性沟通。"},{"i":"2017_4_single_20","t":"single","s":"两人初次相识，交往模式如萍水相逢，很少有亲密接触，其心理距离为","c":"护患关系与人际沟通","sc":1,"o":{"A":"正二级","B":"负一级","C":"负二级","D":"正一级"},"a":"B","e":"初次相识、少有亲密接触属心理距离负一级(单极觉知/零接触后初浅交往)。"},{"i":"2017_4_multi_21","t":"multi","s":"指导－合作型护患关系模式的特点有","c":"护患关系与人际沟通","sc":2,"o":{"A":"护患双方有同等的主动性和权力","B":"微弱的心理差位关系","C":"护理人员在护患关系中占主导地位","D":"护士教会病人做什么","E":"以生物医学模式及疾病的护理为主导思想"},"a":"BCDE","e":"指导-合作型：护士主导、心理微弱差位、特征为护士教会病人做什么、以生物医学及疾病护理为主导；双方同等主动为共同参与型。"},{"i":"2017_4_multi_22","t":"multi","s":"风险型临床护理决策的基本条件包括","c":"科学思维方法与临床护理决策","sc":2,"o":{"A":"事件发生的结局尚不能肯定，但其概率可以估计","B":"事件发生的结局尚不能肯定，其概率也不确定","C":"存在两种以上的结局","D":"可以计算出不同结局的收益和损失","E":"决策依赖于临床经验和主观判断"},"a":"ACD","e":"风险型三条件：存在两种以上结局、概率可估计、可计算不同结局收益损失；B、E为不确定型决策特征。"},{"i":"2017_4_multi_23","t":"multi","s":"健康信念模式的组成部分包括","c":"健康教育","sc":2,"o":{"A":"个人认知","B":"行为提示因素","C":"修正因素","D":"感知因素","E":"调节因素"},"a":"ABC","e":"健康信念模式由个人认知、修正因素、行为提示(诱发)因素等组成。"},{"i":"2017_4_multi_24","t":"multi","s":"影响悲哀反应的因素有","c":"希望、失望与丧失、悲哀","sc":2,"o":{"A":"年龄","B":"性别角色","C":"家庭经济状况","D":"丧失的性质","E":"社会支持系统"},"a":"ABDE","e":"影响悲哀反应的因素包括年龄、性别角色、文化背景、家庭经济状况、丧失的性质、社会支持系统等。"},{"i":"2017_4_multi_25","t":"multi","s":"脑死亡的标准有","c":"临终关怀","sc":2,"o":{"A":"没有感受性和反应性","B":"没有运动和呼吸","C":"脑电图平直","D":"没有反射","E":"心跳和呼吸停止"},"a":"ABCD","e":"哈佛脑死亡标准：①无感受性和反应性；②无运动和呼吸；③无反射；④脑电图平直；心跳呼吸停止为传统死亡标准，不列入。"},{"i":"2017_4_fill_26","t":"fill","s":"医疗事故的解决方式包括____________、卫生行政部门处理和法院诉讼。","c":"护理伦理与法律","sc":1,"at":"参考答案：协商处理(医患双方协商解决)。","e":""},{"i":"2017_4_fill_27","t":"fill","s":"护理道德的基本原则是无害、____________、尊重和公正四个原则。","c":"护理伦理与法律","sc":1,"at":"参考答案：有利(有益)。","e":""},{"i":"2017_4_fill_28","t":"fill","s":"疾病不仅是体内的病理过程，而且是____________适应的失败。","c":"健康与疾病","sc":1,"at":"参考答案：内外环境。","e":""},{"i":"2017_4_fill_29","t":"fill","s":"法律的核心范畴是权力、____________和义务。","c":"护理伦理与法律","sc":1,"at":"参考答案：权利。","e":""},{"i":"2017_4_fill_30","t":"fill","s":"文化现象包括人们活动的____________、精神产品以及活动方式本身。","c":"文化和护理","sc":1,"at":"参考答案：物质财富(物质产品)。","e":""},{"i":"2017_4_fill_31","t":"fill","s":"评判性思维的组成主要包括智力因素、____________和情感态度因素。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案：认知技能(认知因素)。","e":""},{"i":"2017_4_fill_32","t":"fill","s":"护理理念的发展分为禁欲主义阶段、浪漫主义阶段、____________和人本存在主义阶段。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案：实用主义阶段。","e":""},{"i":"2017_4_fill_33","t":"fill","s":"健康教育的程序包括健康教育评估、健康教育计划、____________和健康教育评价四个步骤。","c":"健康教育","sc":1,"at":"参考答案：健康教育实施(干预)。","e":""},{"i":"2017_4_fill_34","t":"fill","s":"米勒将失望个体的生理反应总结为：体重减轻、食欲减退、____________和睡眠紊乱。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：疲乏无力(活动减少/精力下降)。","e":""},{"i":"2017_4_fill_35","t":"fill","s":"尸斑通常在死后____________小时出现。","c":"临终关怀","sc":1,"at":"参考答案：2~4。","e":""},{"i":"2017_4_term_36","t":"term","s":"评判性思维","c":"科学思维方法与临床护理决策","sc":3,"at":"参考答案（要点）：指个体在复杂情景中，能主动地、全面地、灵活地运用已有的知识和经验，对问题及解决方法进行选择、识别、假设、在反思的基础上进行分析、推理，作出合理判断和正确取舍的高级思维方法及形式；由智力因素、认知技能与情感态度因素构成。","e":""},{"i":"2017_4_term_37","t":"term","s":"一级预防","c":"健康与疾病","sc":3,"at":"参考答案（要点）：又称病因预防，是在疾病尚未发生时针对病因(危险因素)采取的措施，即增进健康、消除致病危险因素、预防疾病发生，是三级预防中最积极主动的预防。","e":""},{"i":"2017_4_term_38","t":"term","s":"压力源","c":"护理相关理论及模式","sc":3,"at":"参考答案（要点）：又称应激源，指任何能够引起个体产生应激(压力)反应的内外环境刺激；常见有生物性、心理性、社会性和文化性压力源。","e":""},{"i":"2017_4_term_39","t":"term","s":"社会认知","c":"护患关系与人际沟通","sc":3,"at":"参考答案（要点）：指个体对他人的心理状态、行为动机和意向作出推测与判断的过程，即对人与人之间关系的认知；包括对他人、对自己、对人与人之间关系的认知。","e":""},{"i":"2017_4_term_40","t":"term","s":"临终关怀","c":"临终关怀","sc":3,"at":"参考答案（要点）：又称安宁照顾，是指由医护人员、心理学者、社会工作者及家属等组成团队，对临终病人及其家属提供全面的照料，以控制疼痛、缓解心理创伤、维护其尊严、提高生命质量，并给予家属支持的一种综合性卫生服务。","e":""},{"i":"2017_4_short_41","t":"short","s":"简述文化休克的发展过程。","c":"文化和护理","sc":5,"at":"参考答案（要点）：①蜜月期(兴奋期)；②意识期(沮丧/转变期，最严重)；③转变期(调整期)；④接受期(适应期)。","e":""},{"i":"2017_4_short_42","t":"short","s":"简述确定循证护理问题时需要考虑的因素。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①自己当前面临的护理问题是否有普遍性；②该问题对病人健康及生命的影响程度；③是否有现成科学证据可解决；④护士自身及科室资源、病人的价值愿望与实际情况；⑤临床实践与科研证据是否一致。","e":""},{"i":"2017_4_short_43","t":"short","s":"根据纽曼保健系统理论，说明机体的防御功能。","c":"护理专业理论及模式","sc":5,"at":"参考答案（要点）：机体有三种防御机制：①弹性防御线(最外层，保护正常稳定状态)；②正常防御线(代表系统日常稳定状态)；③抵抗线(保护基本结构、维持基本生命)。三线协调抵御压力源、维持系统稳定。","e":""},{"i":"2017_4_short_44","t":"short","s":"简述制定护理计划的目的及意义。","c":"护理程序","sc":5,"at":"参考答案（要点）：①明确护理重点，按优先顺序排列护理诊断；②为护理活动提供依据和蓝图，使护理措施具体化、个体化；③利于医护患合作与沟通；④为护理评价及书写护理记录提供参照；⑤保证护理连续性和质量。","e":""},{"i":"2017_4_short_45","t":"short","s":"护理人员应如何应用希望与失望学说激发病人生活的信心和希望？","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：①评估病人希望水平及失望表现；②认真倾听、陪伴，建立信任关系；③鼓励病人表达感受，宣泄负性情绪；④根据其需要与共同制定切实可行目标，从小成功中获得希望；⑤调动社会支持系统(家属、病友)；⑥引导正确对待疾病，增强可控感与信心。","e":""},{"i":"2017_4_essay_46","t":"essay","s":"试述知信行模式的基本内容，并以预防艾滋病为例，说明该模式在健康教育中的应用。","c":"健康教育","sc":10,"at":"参考答案（要点）：(1)知信行模式(KABP)把人们行为改变分为获取知识、产生信念、形成行为三个连续过程：知识是基础，信念/态度是动力，行为改变是目标。(2)以预防艾滋病为例：①知——向公众普及艾滋病传播途径、窗口期、安全套使用、检测等知识，消除误解；②信——通过宣教促使公众形成“艾滋病可防可控、应主动防护、不应歧视病人”的正确信念与态度，树立自我责任意识；③行——促使高危人群及公众采取正确行为，如正确使用安全套、拒绝不洁针具、主动检测、关怀艾滋病人，从而把知识信念转化为预防行为。","e":""},{"i":"2017_4_case_47","t":"case","s":"某日17时，病人王某接受冠脉介入治疗术后返回病房，夜班护士小张给予术后护理，告知患者穿刺侧下肢制动24小时，以防术区出血。凌晨1:00，王某排便后自述心慌、头晕，手脚冰凉，术区大量出血。小张遵医嘱为其输注浓缩红细胞2单位后，王某生命体征已逐渐平稳。早晨7:00，护士小张根据长期医嘱，为王某注射了抗凝药物。问题：护士小张是否应该为王某注射抗凝药物？为什么？护士应该如何处理该医嘱？","c":"护理伦理与法律","sc":10,"at":"参考答案（要点）：(1)此时不应注射抗凝药物。(2)原因：病人术后刚发生术区大量出血、刚输血纠正，生命体征虽平稳但仍处于出血高风险期；抗凝会加重出血，与当前病情矛盾，属医嘱与病情不符。(3)处理：①护士不应机械执行该长期医嘱，应立即复核医嘱并向医生(值班医生)提出疑问、说明病人凌晨大出血及输血经过；②由医生重新评估、调整或暂停抗凝医嘱，待出血风险控制后再决定；③在未获新医嘱前不得注射，并做好记录、交班、观察出血征象；④若医生仍坚持原医嘱，应报告护士长或上级主管部门，必要时拒绝执行，以病人安全为先。","e":""}]},{"key":"2018_4","name":"2018年4月","qs":[{"i":"2018_4_single_1","t":"single","s":"5月12日国际护士节命名依据是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"南丁格尔的生日","B":"南丁格尔建立的第一所护士学校的日期","C":"南丁格尔逝世的日期","D":"南丁格尔受国际护士会奖励的日期"},"a":"A","e":"为纪念南丁格尔，以其生日5月12日定为国际护士节。"},{"i":"2018_4_single_2","t":"single","s":"某癌症患者，在诊断初期否认自己患病，表现的角色适应问题是","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"D","e":"不承认自己有病、拒绝进入病人角色属病人角色行为缺如。"},{"i":"2018_4_single_3","t":"single","s":"根据艾瑞克森的心理社会发展学说，中年期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"完美无憾对悲观绝望","B":"亲密对孤独","C":"创造对停滞","D":"自我统一对角色混乱"},"a":"C","e":"中年期(35~65岁)发展危机为创造对停滞。"},{"i":"2018_4_single_4","t":"single","s":"某急性心肌梗死病人入院时，首先需要得到满足的是","c":"护理相关理论及模式","sc":1,"o":{"A":"生理的需要","B":"安全的需要","C":"爱与归属的需要","D":"自尊的需要"},"a":"A","e":"按马斯洛需要层次，生理需要(氧气、循环)最优先。"},{"i":"2018_4_single_5","t":"single","s":"人们要求自己的行为符合理想的标准，属于人格结构中的","c":"护理相关理论及模式","sc":1,"o":{"A":"本我","B":"自我","C":"超我","D":"本能"},"a":"C","e":"超我是道德化的自我，遵循至善原则、要求行为符合理想标准。"},{"i":"2018_4_single_6","t":"single","s":"交往双方有了更深层次的情感交流，并期望引起双方的共鸣和关注的阶段属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"定向选择阶段","B":"情感探索阶段","C":"情感交流阶段","D":"稳定交往阶段"},"a":"C","e":"人际关系发展阶段中，情感交流阶段双方有更深层情感交流并期望共鸣关注。"},{"i":"2018_4_single_7","t":"single","s":"沟通双方同时充当信息发送者和接收者的角色，积极互动，体现了人际沟通的","c":"护患关系与人际沟通","sc":1,"o":{"A":"整体性","B":"情景性","C":"统一性","D":"双向性"},"a":"D","e":"双方同时发送与接收信息、积极互动体现沟通的双向性。"},{"i":"2018_4_single_8","t":"single","s":"护理人员能用自己的专业知识及技能决定的护理措施及护理服务，属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"依赖性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"独立性护理功能"},"a":"D","e":"运用专业知识技能独立决定并实施属独立性护理功能。"},{"i":"2018_4_single_9","t":"single","s":"莱宁格“日出模式”第二层的主要含义是","c":"文化和护理","sc":1,"o":{"A":"显示不同文化背景和环境下的文化关怀型态以及文化关怀表达方式","B":"描述了文化关怀、世界观与文化社会结构及其组成因素","C":"阐述了个体、家庭、群体、社区或机构的不同健康系统及其相互影响","D":"解释了护理关怀的决策和行为"},"a":"A","e":"Ⅱ级文化关怀与健康层：显示不同文化背景和环境下的文化关怀型态及表达方式。"},{"i":"2018_4_single_10","t":"single","s":"伽利略用望远镜观察天体，证明和发展了哥白尼的日心说，体现了文化的","c":"文化和护理","sc":1,"o":{"A":"超时代性","B":"继承性","C":"阶级性","D":"地域性"},"a":"B","e":"后人在前人成果基础上继承发展体现文化的继承性。"},{"i":"2018_4_single_11","t":"single","s":"用护理常规引出对某病人的具体护理措施，这种科学思维的方法是","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"观察","B":"归纳","C":"演绎","D":"分析"},"a":"C","e":"由一般原理(护理常规)推出个别(某病人具体措施)属演绎。"},{"i":"2018_4_single_13","t":"single","s":"下列关于护理诊断的叙述，正确的是","c":"护理程序","sc":1,"o":{"A":"护理诊断描述的是人类的健康问题或生命过程中的反应","B":"护理诊断是护理人员为达到预期结果选择的护理措施","C":"护理诊断描述的健康问题必须是通过医护配合能够解决的","D":"护理诊断所描述的必须是护理对象现存的护理问题"},"a":"A","e":"护理诊断描述的是人类的健康问题或生命过程中的反应，由护士判断。"},{"i":"2018_4_single_14","t":"single","s":"社区护士为居民开设有关于糖尿病的健康知识讲座，此时护士的角色是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"护理者","B":"沟通者","C":"教育者","D":"促进康复者"},"a":"C","e":"向居民传播健康知识体现护士的教育者角色。"},{"i":"2018_4_single_15","t":"single","s":"被称为“现代心理学之父”的是","c":"护理相关理论及模式","sc":1,"o":{"A":"艾瑞克森","B":"弗洛伊德","C":"科尔伯格","D":"皮亚杰"},"a":"B","e":"弗洛伊德创立精神分析学派，被称为现代心理学之父。"},{"i":"2018_4_single_16","t":"single","s":"关于纽曼保健系统理论的描述，正确的是","c":"护理专业理论及模式","sc":1,"o":{"A":"护理是帮助人减少压力源，以扭转压力对人造成的影响","B":"护理是帮助人们控制或适应刺激","C":"护理是预防及治疗人的自理缺陷","D":"护理服务是由三级预防保健护理完成的"},"a":"A","e":"纽曼理论认为护理是帮助人减少压力源、扭转压力对人造成的影响、保护正常防御线。"},{"i":"2018_4_single_17","t":"single","s":"提出健康信息模式的著名学者是","c":"健康教育","sc":1,"o":{"A":"格林","B":"霍克巴姆","C":"潘德","D":"克鲁特"},"a":"B","e":"健康信念模式由霍克巴姆(Hochbaum)等提出。"},{"i":"2018_4_single_18","t":"single","s":"期盼现在和将来的生活、学习都能顺利，体现了希望的","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"时空性","B":"认知性","C":"情感性","D":"行为性"},"a":"A","e":"对事件在时间上(现在与将来)属性的期盼体现希望的时空性。"},{"i":"2018_4_single_19","t":"single","s":"当临终病人的病情和预后得到证实时，病人抱怨“为什么是我，这不公平”，体现了罗斯博士对临终病人心理活动发展阶段分期中的","c":"临终关怀","sc":1,"o":{"A":"否认期","B":"愤怒期","C":"磋商期","D":"沮丧期"},"a":"B","e":"抱怨命运不公、愤怒属愤怒期。"},{"i":"2018_4_single_20","t":"single","s":"法律意义上的护士必须具备的条件是","c":"护理伦理与法律","sc":1,"o":{"A":"具有中专或中专以上的文凭","B":"受聘于某个医疗机构","C":"通过护士执业资格考试并经过注册","D":"具有一定的医学知识"},"a":"C","e":"法律意义上的护士须通过护士执业资格考试并经注册。"},{"i":"2018_4_multi_21","t":"multi","s":"皮亚杰将人的智力发育分为","c":"护理相关理论及模式","sc":2,"o":{"A":"感觉运动期","B":"潜伏运思期","C":"前运思期","D":"具体运思期","E":"形式运思期"},"a":"ACDE","e":"皮亚杰四阶段：感觉运动期、前运思期、具体运思期、形式运思期；潜伏运思期属弗洛伊德性心理发展分期。"},{"i":"2018_4_multi_22","t":"multi","s":"在进行护理诊断排序时应遵循的原则有","c":"护理程序","sc":2,"o":{"A":"首先应按重要性和紧迫性排出主次","B":"现存的问题一定要优先解决","C":"应注重护理对象的主观感受","D":"按照马斯洛的需要层次论进行排序","E":"随着病情的变化，护理诊断的排序是可以发生变化的"},"a":"ACDE","e":"按重要性紧迫性排主次、注重主观感受、参照马斯洛需要层次排序、随病情变化调整；现存问题不绝对优先(高危潜在问题可首优)。"},{"i":"2018_4_multi_23","t":"multi","s":"奥瑞姆自理理论中的完全补偿系统适用于","c":"护理专业理论及模式","sc":2,"o":{"A":"高位截瘫病人","B":"精神病人","C":"昏迷病人","D":"婴儿","E":"老年病人"},"a":"ABCD","e":"完全补偿用于无自理能力者：昏迷、高位截瘫(中风)、精神病人、婴儿等；老年病人多有部分自理，用部分补偿或支持教育系统。"},{"i":"2018_4_multi_24","t":"multi","s":"失望的情感表现包括","c":"希望、失望与丧失、悲哀","sc":2,"o":{"A":"无望感","B":"个体对将来的预见能力降低","C":"挫败感","D":"放弃努力","E":"冷漠感"},"a":"ACE","e":"失望情感表现为无望感、挫败感、冷漠感；预见能力降低、放弃努力属行为表现。"},{"i":"2018_4_multi_25","t":"multi","s":"凯文纳夫将病人家属的心理变化过程归纳为","c":"临终关怀","sc":2,"o":{"A":"震惊和不知所措","B":"情绪反复无常","C":"内疚罪恶感","D":"失落与孤独","E":"解脱及重组生活"},"a":"ABCDE","e":"家属心理变化：震惊和不知所措、情绪反复无常、内疚罪恶感、失落与孤独、解脱及重组生活。"},{"i":"2018_4_fill_26","t":"fill","s":"人际沟通中的距离分为亲密距离、人际距离、____________和公众距离四个层次。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：社会距离。","e":""},{"i":"2018_4_fill_27","t":"fill","s":"美国健康教育家格林认为，健康促进是指一切能促使行为和____________向有益于健康方向改变的教育与环境支持的综合体。","c":"健康教育","sc":1,"at":"参考答案：生活条件。","e":""},{"i":"2018_4_fill_28","t":"fill","s":"脑死亡包括大脑、中脑、小脑和____________的不可逆死亡。","c":"临终关怀","sc":1,"at":"参考答案：脑干。","e":""},{"i":"2018_4_fill_29","t":"fill","s":"评判性思维的核心认知技能包括____________、分析、评估、推论、说明和自我调控。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案：解释。","e":""},{"i":"2018_4_fill_30","t":"fill","s":"护理计划的过程包括排列护理诊断的顺序、____________、制订护理措施及书写护理计划。","c":"护理程序","sc":1,"at":"参考答案：确定护理目标(制定预期目标)。","e":""},{"i":"2018_4_fill_31","t":"fill","s":"罗伊的适应理论认为人的内在应对机转包括生理调节和____________。","c":"护理专业理论及模式","sc":1,"at":"参考答案：认知调节。","e":""},{"i":"2018_4_fill_32","t":"fill","s":"保健教育过程模式由评估阶段、____________和评价阶段组成。","c":"健康教育","sc":1,"at":"参考答案：执行(实施)阶段。","e":""},{"i":"2018_4_fill_33","t":"fill","s":"通过对悲哀过程的研究，1964年____________提出了悲哀三阶段学说。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：恩格尔(Engel)。","e":""},{"i":"2018_4_fill_34","t":"fill","s":"初级卫生保健是衡量一个国家的卫生体制是否健全及____________优劣的重要指标。","c":"健康与疾病","sc":1,"at":"参考答案：卫生服务(系统)。","e":""},{"i":"2018_4_fill_35","t":"fill","s":"道德的社会作用主要表现在道德的调节、____________及认识职能。","c":"护理伦理与法律","sc":1,"at":"参考答案：教育。","e":""},{"i":"2018_4_term_36","t":"term","s":"三级预防","c":"健康与疾病","sc":3,"at":"参考答案（要点）：又称临床期预防，即对已患疾病者采取及时有效治疗，防止病情恶化、预防并发症和伤残，促进功能康复、提高生存质量、延长寿命。","e":""},{"i":"2018_4_term_37","t":"term","s":"压力","c":"护理相关理论及模式","sc":3,"at":"参考答案（要点）：又称应激，是个体对刺激(压力源)经认知评价后，认为机体平衡负担过重、超出自身应对能力时所产生的身心紧张状态及适应反应。","e":""},{"i":"2018_4_term_38","t":"term","s":"人际吸引","c":"护患关系与人际沟通","sc":3,"at":"参考答案（要点）：指人与人之间彼此注意、欣赏、倾慕并进而彼此接近以建立感情关系的心理过程；受个人特质、相近性、相似性、相悦性等影响。","e":""},{"i":"2018_4_term_39","t":"term","s":"健康教育","c":"健康教育","sc":3,"at":"参考答案（要点）：是指通过信息传播和行为干预，帮助个人和群体掌握卫生保健知识、树立健康观念、自愿采取有利于健康的行为和生活方式的系统社会教育活动。","e":""},{"i":"2018_4_term_40","t":"term","s":"法律","c":"护理伦理与法律","sc":3,"at":"参考答案（要点）：是由国家制定或认可、由国家强制力保证实施的行为规范体系，通过规定权利与义务来确认、保护和发展有利于统治阶级的社会关系和社会秩序。","e":""},{"i":"2018_4_short_41","t":"short","s":"简述人际关系的功能。","c":"护患关系与人际沟通","sc":5,"at":"参考答案（要点）：①获得信息(沟通信息)的功能；②自知、知人(自我认知)的功能；③协作与互利(社会化/身心保健)的功能；④协调与激励的功能；⑤满足个体心理需要、维护身心健康的功能。","e":""},{"i":"2018_4_short_42","t":"short","s":"简述护理评价的过程。","c":"护理程序","sc":5,"at":"参考答案（要点）：①确立评价标准(以预期目标为准)；②收集服务对象反应的主客观资料并与目标对照；③判断目标完全/部分/未实现；④对部分或未实现者分析原因，做出继续、停止、修改护理诊断或措施的决定；⑤重新进入评估—诊断—计划—实施循环。","e":""},{"i":"2018_4_short_43","t":"short","s":"简述护理人员在健康教育中的作用。","c":"健康教育","sc":5,"at":"参考答案（要点）：①为服务对象提供健康信息；②帮助认识影响健康的因素；③帮助确定存在的健康问题；④指导采纳健康行为；⑤协调健康教育各部门及人际关系。","e":""},{"i":"2018_4_short_44","t":"short","s":"简述临终关怀的意义。","c":"临终关怀","sc":5,"at":"参考答案（要点）：①体现对生命的尊重与人道主义；②提高临终者生命质量、维护尊严；③减轻家庭及社会负担；④是社会文明与医疗保健体系完善的标志；⑤体现护士专业价值。","e":""},{"i":"2018_4_short_45","t":"short","s":"简述护理道德的基本原则。","c":"护理伦理与法律","sc":5,"at":"参考答案（要点）：①无害(不伤害)原则；②有利(有益)原则；③尊重原则；④公正原则。","e":""},{"i":"2018_4_essay_46","t":"essay","s":"试述评判性思维在护理临床实践中的应用。","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案（要点）：①在护理评估中，主动全面收集资料、识别异常、不被表面现象迷惑；②在护理诊断中，分析资料、鉴别问题、区分护理诊断与合作性问题；③在护理计划与决策中，比较方案、估计结局、做出合理选择；④在护理实施中，根据病情变化动态判断、灵活调整；⑤在护理评价中，反思目标达成情况并改进。意义：提高护理决策科学性、避免机械执行、保证护理安全与质量、促进护理专业化。","e":""},{"i":"2018_4_case_47","t":"case","s":"患者对护士说：“我的B超结果出来了，胰腺好像长了一个东西，我真的有些担心。”护士回答说：“噢，原来如此！好吧，你准备一下，我马上帮你输液。”请问护士在与患者沟通中存在什么问题？常用的护患沟通技巧有哪些？","c":"护患关系与人际沟通","sc":10,"at":"参考答案（要点）：(1)存在的问题：护士对患者的担心未予共情与回应，属“改变话题/主观忽视”，未倾听、未给予情感支持，沟通停留在事务性、缺乏治疗性，甚至给人敷衍、冷漠之感。(2)常用护患沟通技巧：①倾听(专注、不打断)；②接受与尊重；③同理心(移情)、安慰与支持；④沉默；④开放/封闭式提问、核实(澄清、复述)；⑤自我暴露、提供信息；⑥触摸、幽默等非语言技巧。","e":""}]},{"key":"2018_10","name":"2018年10月","qs":[{"i":"2018_10_single_1","t":"single","s":"根据西方对护理学知识体系的认识，将护理艺术、技能或护理行为方面的知识称为","c":"护理学的发展及基本概念","sc":1,"o":{"A":"伦理学知识","B":"美学知识","C":"直感知识","D":"科学知识"},"a":"B","e":"护理艺术、技能及护理行为方面的知识属美学知识。"},{"i":"2018_10_single_2","t":"single","s":"一位癌症病人，不愿承认自己的病情，仍坚持工作，这种情况属于","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"D","e":"不承认有病、拒绝进入病人角色属角色行为缺如。"},{"i":"2018_10_single_3","t":"single","s":"下列关于死亡过程的描述，正确的是","c":"临终关怀","sc":1,"o":{"A":"濒死期生命处于不可逆阶段","B":"临床死亡期大脑已发生不可逆的变化","C":"尸斑是最先发生的尸体现象","D":"生物学死亡期是死亡过程的最后阶段"},"a":"D","e":"生物学死亡期是死亡过程最后阶段；濒死期可逆，临床死亡期脑尚未不可逆，尸冷为最先发生的尸体现象。"},{"i":"2018_10_single_4","t":"single","s":"与病人建立良好的护患关系，能够满足病人","c":"护理相关理论及模式","sc":1,"o":{"A":"安全的需要","B":"自我实现的需要","C":"生理的需要","D":"爱与归属的需要"},"a":"D","e":"良好护患关系、病友家属交往可满足爱与归属的需要。"},{"i":"2018_10_single_5","t":"single","s":"下列关于适应的描述，正确的是","c":"护理相关理论及模式","sc":1,"o":{"A":"适应是一个被动地服从或接受压力源的动态过程","B":"人类的适应能力是无限的","C":"适应能力有个体差异，因人而异","D":"适应是人类所特有的、区别于动物的特征"},"a":"C","e":"适应是主动的动态过程、能力有限且有个体差异，是生物共有的生存机制。"},{"i":"2018_10_single_6","t":"single","s":"进行非正式个人交谈时一般采取的人际距离是","c":"护患关系与人际沟通","sc":1,"o":{"A":"15cm","B":"30cm","C":"50cm","D":"80cm"},"a":"C","e":"非正式个人交谈采用人际距离，约50cm。"},{"i":"2018_10_single_7","t":"single","s":"沟通的最高层次是","c":"护患关系与人际沟通","sc":1,"o":{"A":"礼节性沟通","B":"陈述性沟通","C":"共鸣性沟通","D":"情感性沟通"},"a":"C","e":"共鸣性沟通为最高层次。"},{"i":"2018_10_single_8","t":"single","s":"非技术性护患关系中最主要的是","c":"护患关系与人际沟通","sc":1,"o":{"A":"护患价值关系","B":"护患文化关系","C":"护患法律关系","D":"护患道德关系"},"a":"D","e":"道德关系是非技术性护患关系中最主要的内容。"},{"i":"2018_10_single_9","t":"single","s":"莱宁格“日出模式”最外一层描述了","c":"文化和护理","sc":1,"o":{"A":"不同文化背景和环境下的文化关怀形态以及文化关怀表达方式","B":"文化关怀、世界观与文化社会结构及其组成因素","C":"个体、家庭、群体、社区或机构的不同健康系统及其相互影响","D":"护理关怀的决策和行为"},"a":"B","e":"Ⅰ级(最外层)为文化关怀、世界观与文化社会结构及其组成因素。"},{"i":"2018_10_single_10","t":"single","s":"文化一经产生就会被世人模仿及利用，这种现象体现了文化的","c":"文化和护理","sc":1,"o":{"A":"传递性","B":"时代性","C":"变异性","D":"自然性"},"a":"A","e":"文化由一人一地传向他人他地、被模仿利用体现传递性。"},{"i":"2018_10_single_11","t":"single","s":"不同组织部位的炎症表现大都有红、肿、热、痛、功能障碍的病理改变，这个特征体现了思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"概括性","B":"间接性","C":"逻辑性","D":"物质性"},"a":"A","e":"从多个具体现象中概括出共同本质(炎症共性)体现思维的概括性。"},{"i":"2018_10_single_12","t":"single","s":"下列关于潜在的护理诊断的描述正确的是","c":"护理程序","sc":1,"o":{"A":"知识缺乏","B":"清理呼吸道无效","C":"有感染的危险","D":"母乳喂养有效"},"a":"C","e":"潜在(危险)护理诊断用“有……的危险”描述，如有感染的危险。"},{"i":"2018_10_single_13","t":"single","s":"关于病人的主观资料，下列说法正确的是","c":"护理程序","sc":1,"o":{"A":"只能来自于病人本身","B":"指病人对自己健康问题的体验和认识","C":"指护士对病人健康问题的体验和认识","D":"指护士通过观察、会谈、体格检查和实验等方法得到的有关病人健康状态的资料"},"a":"B","e":"主观资料指病人对自己健康问题的体验和认识，来自病人主诉。"},{"i":"2018_10_single_14","t":"single","s":"根据纽曼保健系统理论，在进行二级预防时，护理人员应","c":"护理专业理论及模式","sc":1,"o":{"A":"采取措施避免压力的打击","B":"积极处理出现的症状，增强抵抗防线","C":"使系统重获稳定状态","D":"增强应变防线的抵抗能力"},"a":"B","e":"二级预防为早期发现、处理已出现的症状、增强抵抗防线。"},{"i":"2018_10_single_15","t":"single","s":"根据护理理论着重点的不同，奥瑞姆(Orem)的自理理论属于","c":"护理专业理论及模式","sc":1,"o":{"A":"以需要及问题为中心的护理理论","B":"以系统为中心的护理理论","C":"以护患关系为中心的护理理论","D":"以能量源为中心的护理理论"},"a":"A","e":"Orem自理理论以需要及问题为中心。"},{"i":"2018_10_single_16","t":"single","s":"在对护理专业学生进行护患沟通教育时，最好的教育方法是","c":"健康教育","sc":1,"o":{"A":"角色扮演法","B":"团体讨论法","C":"专题讲座法","D":"视听教材的应用"},"a":"A","e":"角色扮演法最利于训练护患沟通技能。"},{"i":"2018_10_single_17","t":"single","s":"主要针对不良生活方式进行健康教育的阶段属于","c":"健康教育","sc":1,"o":{"A":"医学阶段","B":"行为阶段","C":"社会环境阶段","D":"心理学阶段"},"a":"B","e":"针对不良生活方式、行为改变的教育属行为阶段。"},{"i":"2018_10_single_18","t":"single","s":"下列属于成长发展过程中的丧失的是","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"亲人朋友离去","B":"车祸丧失下肢","C":"贵重物品被盗","D":"女性停经"},"a":"D","e":"女性停经是个体成长发展到一定阶段必然经历的生理性丧失。"},{"i":"2018_10_single_19","t":"single","s":"依据艾瑞克森的心理社会发展学说，中年期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"完美无憾对悲观绝望","B":"亲密对孤独","C":"创造对停滞","D":"自我统一对角色混乱"},"a":"C","e":"中年期发展危机为创造对停滞。"},{"i":"2018_10_single_20","t":"single","s":"护士在处理及执行医嘱时","c":"护理伦理与法律","sc":1,"o":{"A":"不应怀疑医嘱的正确性","B":"即使发现医嘱有明显的错误，也无权拒绝执行","C":"拒绝执行口头医嘱","D":"若对医嘱有疑问，应询问并证实医嘱的准确性"},"a":"D","e":"对医嘱有疑问应询问并核实其准确性后再执行，不可盲目执行或随意拒绝口头医嘱。"},{"i":"2018_10_multi_21","t":"multi","s":"影响健康的社会环境因素有","c":"健康与疾病","sc":2,"o":{"A":"社会立法","B":"空气污染","C":"社会教育制度","D":"生活方式","E":"社会资源分配"},"a":"ACE","e":"社会立法、社会教育制度、社会资源分配属社会环境；空气污染属自然环境，生活方式属行为因素。"},{"i":"2018_10_multi_22","t":"multi","s":"影响需要满足的因素包括","c":"护理相关理论及模式","sc":2,"o":{"A":"情绪因素","B":"个性特点","C":"环境因素","D":"价值观","E":"知识"},"a":"ABCDE","e":"情绪、个性、环境、价值观、知识均可影响需要的满足。"},{"i":"2018_10_multi_23","t":"multi","s":"中国文化的内在特征包括","c":"文化和护理","sc":2,"o":{"A":"突出人本与世俗","B":"直率与坦诚","C":"女士优先","D":"和谐与中庸","E":"追求安土与乐天"},"a":"ADE","e":"突出人本与世俗、和谐与中庸、追求安土与乐天；直率坦诚、女士优先属西方文化特征。"},{"i":"2018_10_multi_24","t":"multi","s":"希望的特征包括","c":"希望、失望与丧失、悲哀","sc":2,"o":{"A":"情感性","B":"情景性","C":"时空性","D":"依附性","E":"认知性"},"a":"ABCDE","e":"希望六特征：情感性、情景性、时空性、依附性、认知性、行为性；本题五选项均属。"},{"i":"2018_10_fill_27","t":"fill","s":"健康不但是没有疾病和身体缺陷，还要有完整的生理、心理状态和良好的____________。","c":"健康与疾病","sc":1,"at":"参考答案：社会适应能力。","e":""},{"i":"2018_10_fill_28","t":"fill","s":"认知偏差主要表现为首因效应、近因效应、____________和社会刻板印象。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：晕轮效应。","e":""},{"i":"2018_10_fill_29","t":"fill","s":"文化现象的三个方面可以称之为物质文化、精神文化和____________。","c":"文化和护理","sc":1,"at":"参考答案：方式文化。","e":""},{"i":"2018_10_fill_30","t":"fill","s":"心理学家罗斯博士将临终病人的心理活动划分为否认期、愤怒期、____________、沮丧期、接受期五个发展阶段。","c":"临终关怀","sc":1,"at":"参考答案：磋商期(协议期)。","e":""},{"i":"2018_10_fill_31","t":"fill","s":"美国护理学者卡利什在生理需要和安全的需要之间增加了一层新的需要，即____________。","c":"护理相关理论及模式","sc":1,"at":"参考答案：刺激的需要。","e":""},{"i":"2018_10_fill_32","t":"fill","s":"健康信念模式由个人认知、____________和行动可能因子组成。","c":"健康教育","sc":1,"at":"参考答案：修正因素。","e":""},{"i":"2018_10_fill_33","t":"fill","s":"与失望有关的护理诊断主要有失望和____________。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：无望(无能为力/hopelessness)。","e":""},{"i":"2018_10_fill_34","t":"fill","s":"南丁格尔于____________年在英国伦敦的圣多马医院开办了第一所护士学校。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案：1860。","e":""},{"i":"2018_10_term_36","t":"term","s":"独立性的护理功能","c":"护理学的发展及基本概念","sc":3,"at":"参考答案（要点）：指护理人员运用自己的专业知识、技能和判断力，独立做出决定并采取的护理措施，不依赖医嘱或他人指示，如病情观察、体位摆放、心理护理、健康教育等。","e":""},{"i":"2018_10_term_37","t":"term","s":"发展","c":"护理相关理论及模式","sc":3,"at":"参考答案（要点）：指个体随年龄增长及经验积累而发生的有顺序、可预期的身心变化，是质的改变，体现为心理、社会、能力等方面的成熟与进步。","e":""},{"i":"2018_10_term_38","t":"term","s":"跨文化护理","c":"文化和护理","sc":3,"at":"参考答案（要点）：指护理人员根据服务对象不同文化背景，了解其文化价值观、健康观、生活方式与需求，提供与其文化相适应的、个体化的护理关怀，以满足其文化照顾需要。","e":""},{"i":"2018_10_term_39","t":"term","s":"科学思维","c":"科学思维方法与临床护理决策","sc":3,"at":"参考答案（要点）：是人类运用正确的思维方法，符合客观规律、逻辑规则地认识事物本质与规律的理性认识活动，包括逻辑思维、非逻辑思维、创造性思维、数理思维、评判性思维等形式。","e":""},{"i":"2018_10_term_40","t":"term","s":"自理","c":"护理专业理论及模式","sc":3,"at":"参考答案（要点）：亦称自护，指个体为维持自身生命、健康和良好状态而自己采取的、有目的的自我照顾活动，受年龄、发展状态、健康状况及社会文化等影响。","e":""},{"i":"2018_10_short_41","t":"short","s":"简述循证护理的实施程序。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①明确需要解决的护理问题；②系统检索相关文献、收集证据；③严格评价证据的真实性、可靠性和实用性；④结合病人具体情况、护士经验及证据，制定并实施护理方案；⑤评价实施效果，反馈改进。","e":""},{"i":"2018_10_short_42","t":"short","s":"简述护理学的四个基本概念。","c":"护理学的发展及基本概念","sc":5,"at":"参考答案（要点）：护理学的四个基本概念是人、环境、健康、护理；四者相互联系，人是护理的服务对象，环境是影响健康的外内因素，健康是护理的目标，护理是实现健康的手段与专业实践。","e":""},{"i":"2018_10_short_43","t":"short","s":"简述护理人员在与患者进行治疗性会谈时的注意事项。","c":"护患关系与人际沟通","sc":5,"at":"参考答案（要点）：①选择合适环境与时间，做好会谈准备；②尊重、真诚、有同理心，注意力集中；③多用倾听、核实、开放式提问，少打断；④紧扣主题、围绕患者需求；⑤会谈结束小结、预约下次、记录。","e":""},{"i":"2018_10_short_44","t":"short","s":"简述丧亲者护理工作的主要内容。","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：①做好尸体护理，体现对死者尊重、对生者抚慰；②鼓励家属宣泄感情，认真倾听；③心理疏导、精神支持，安慰其面对现实；④提供经济、家庭、社会支持等生活指导；⑤通过信件、电话、访视进行丧亲者随访。","e":""},{"i":"2018_10_short_45","t":"short","s":"简述临床工作中不属于医疗事故的情况。","c":"护理伦理与法律","sc":5,"at":"参考答案（要点）：①紧急情况下为抢救垂危病人生命而采取紧急医学措施造成不良后果；②由于病情病人体质特殊而发生的医疗意外；③无过错输血感染造成不良后果；④因病人及其方原因延误诊疗导致不良后果；⑤因不可抗力造成不良后果；⑥在现有医学科学技术下无法预料或不能防范的不良后果。","e":""},{"i":"2018_10_essay_46","t":"essay","s":"试述护理诊断与医疗诊断的区别。","c":"护理程序","sc":10,"at":"参考答案（要点）：①诊断的对象不同：护理诊断研究人对健康问题/生命过程的反应，医疗诊断研究疾病本身；②描述的内容不同：护理诊断描述个体、家庭或社区现存或潜在的健康问题/反应，医疗诊断说明疾病的病因病理；③决策者不同：护理诊断由护士做出，医疗诊断由医师做出；④数目与稳定性不同：护理诊断随病情变化而改变、可多个，医疗诊断相对稳定、在病程中固定；⑤职责范围不同：护理诊断在护理职责范围内处理，医疗诊断在医疗职责范围内处理；⑥预期目标不同：护理诊断以促进健康、改善反应为目标，医疗诊断以治愈疾病为目标。","e":""},{"i":"2018_10_case_47","t":"case","s":"某医院急诊科护士长王某，经常面对高强度的工作压力，产生巨大的工作疲倦感，表现为情绪不稳定、失眠、焦虑，严重地影响了她的身心健康。请问护理人员的工作压力源主要有哪些？护理人员可以采取哪些措施缓解压力？","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案（要点）：(1)压力源主要有：①不良的工作环境；②沉重的工作负荷(高强度、多抢救)；③紧急的工作性质；④复杂的人际关系；⑤高风险的工作。(2)缓解措施：①明确职责、合理安排工作、学会放松与时间管理；②寻求社会支持、与同事沟通交流；③培养积极情绪、适当运动与休息、保持健康生活方式；④学习应对技巧、运用心理防御机制自我调适；⑤必要时寻求专业心理咨询，必要时调整岗位。","e":""}]},{"key":"2019_4","name":"2019年4月","qs":[{"i":"2019_4_single_1","t":"single","s":"社区护士为居民开设有关于高血压的讲座，此时护士的角色是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"护理者","B":"沟通者","C":"促进康复者","D":"教育者"},"a":"D","e":"向居民传播健康知识体现教育者角色。"},{"i":"2019_4_single_2","t":"single","s":"指导妇女自检乳房从而早期发现乳腺癌，属于","c":"健康与疾病","sc":1,"o":{"A":"一级预防","B":"病因预防","C":"二级预防","D":"三级预防"},"a":"C","e":"早发现、早诊断、早治疗属二级预防。"},{"i":"2019_4_single_3","t":"single","s":"影响健康的主要因素是","c":"健康与疾病","sc":1,"o":{"A":"生物因素","B":"心理因素","C":"物理因素","D":"社会因素"},"a":"A","e":"影响健康的主要因素包括生物因素、心理因素、环境因素、行为生活方式等，其中生物因素为最基本主要因素。"},{"i":"2019_4_single_4","t":"single","s":"满足病人自尊的需要，最恰当的方法是","c":"护理相关理论及模式","sc":1,"o":{"A":"入院指导","B":"提供良好的住院环境","C":"关心、重视病人的特性及个人习惯","D":"精湛的护理技术"},"a":"C","e":"关心、重视病人的特性及个人习惯可满足其自尊需要。"},{"i":"2019_4_single_5","t":"single","s":"加拿大生理心理学家席尔提出的学说或模式是","c":"护理相关理论及模式","sc":1,"o":{"A":"压力与适应学说","B":"压力与应对模式","C":"生活变化与疾病关系学说","D":"危机学说"},"a":"A","e":"席尔(Selye)提出应激与适应(一般适应综合征)学说。"},{"i":"2019_4_single_6","t":"single","s":"儿童对自己的性器官感兴趣的时期是","c":"护理相关理论及模式","sc":1,"o":{"A":"潜伏期","B":"肛欲期","C":"口欲期","D":"性蕾期"},"a":"D","e":"弗洛伊德性心理发展中性蕾期(性器期)儿童对性器官感兴趣。"},{"i":"2019_4_single_7","t":"single","s":"在促进人际沟通向纵深发展的技巧中，被称为沟通润滑剂的是","c":"护患关系与人际沟通","sc":1,"o":{"A":"沉默","B":"接纳不同价值观","C":"触摸","D":"幽默"},"a":"D","e":"幽默能化解尴尬、缓和气氛，被称为沟通的润滑剂。"},{"i":"2019_4_single_8","t":"single","s":"根据系统的分类，护理程序属于","c":"护理程序","sc":1,"o":{"A":"自然系统","B":"开放系统","C":"静态系统","D":"思维系统"},"a":"B","e":"护理程序与环境持续交换物质信息，属开放系统。"},{"i":"2019_4_single_9","t":"single","s":"对于昏迷病人，护士应采取的护患关系模式是","c":"护患关系与人际沟通","sc":1,"o":{"A":"主动－被动型","B":"指导－合作型","C":"共同参与型","D":"服务－指导型"},"a":"A","e":"昏迷、无自主意识者适用主动-被动型。"},{"i":"2019_4_single_10","t":"single","s":"人际吸引最重要的影响因素是","c":"护患关系与人际沟通","sc":1,"o":{"A":"个人特质","B":"相近性","C":"相似性","D":"相悦性"},"a":"A","e":"个人特质(真诚、能力、热情等)是人际吸引最重要的因素。"},{"i":"2019_4_single_11","t":"single","s":"在跨文化护理理论中，世界观和文化社会结构层属于日出模式的","c":"文化和护理","sc":1,"o":{"A":"Ⅰ级","B":"Ⅱ级","C":"Ⅲ级","D":"Ⅳ级"},"a":"A","e":"Ⅰ级(最外层)为世界观和文化社会结构层。"},{"i":"2019_4_single_12","t":"single","s":"皮亚杰把人的智力发育分为4个阶段，10～12岁儿童处于的阶段是","c":"护理相关理论及模式","sc":1,"o":{"A":"感觉运动期","B":"前运思期","C":"具体运思期","D":"形式运思期"},"a":"D","e":"11岁以后进入形式运思期。"},{"i":"2019_4_single_13","t":"single","s":"下列关于影响文化休克进程的描述，正确的是","c":"文化和护理","sc":1,"o":{"A":"文化休克程度与文化差异的大小成反比","B":"年龄越大，越容易适应新的文化模式","C":"身心健康的人应对能力强于身心衰弱的个体","D":"儿童应对文化休克的困难较多"},"a":"C","e":"身心健康者应对文化休克能力强于身心衰弱者；程度与文化差异成正比，儿童适应较快。"},{"i":"2019_4_single_14","t":"single","s":"护理人员观察到病人呼吸浅快、呼气延长、发绀，判断出病人存在呼吸困难，这个过程体现了思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"概括性","B":"间接性","C":"逻辑性","D":"物质性"},"a":"B","e":"通过外部症状推断内部疾病本质，体现思维的间接性。"},{"i":"2019_4_single_15","t":"single","s":"下列关于护理诊断的陈述，正确的是","c":"护理程序","sc":1,"o":{"A":"皮肤完整性受损：与护理人员未及时翻身有关","B":"社交障碍：与缺乏道德有关","C":"有受伤的危险：与护理人员未加床档有关","D":"便秘：与活动少、肠蠕动减慢有关"},"a":"D","e":"护理诊断的相关因素应客观描述、不指责护士或他人，如便秘与活动少、肠蠕动减慢有关。"},{"i":"2019_4_single_17","t":"single","s":"下列不属于病人心理社会方面的评估内容的是","c":"护理程序","sc":1,"o":{"A":"认知和感受型态","B":"自我感知与自我概念型态","C":"角色与关系型态","D":"应对与应激耐受型态"},"a":"A","e":"认知和感受型态属认知/生理评估内容；自我感知、角色关系、应对应激属心理社会评估。"},{"i":"2019_4_single_18","t":"single","s":"纽曼保健系统理论不包括","c":"护理专业理论及模式","sc":1,"o":{"A":"效应器","B":"压力源","C":"机体防御","D":"预防性护理措施"},"a":"A","e":"纽曼理论包括压力源、机体防御(弹性/正常/抵抗线)、预防性护理措施；效应器不属于其概念。"},{"i":"2019_4_single_19","t":"single","s":"悲哀在情感方面的反应，可表现为","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"痛苦、愤怒、焦虑","B":"头疼、失眠","C":"心不在焉、健忘","D":"睹物思情、行为怪异"},"a":"A","e":"悲哀情感反应为痛苦、愤怒、焦虑；头疼失眠属生理，心不在焉健忘属认知。"},{"i":"2019_4_single_20","t":"single","s":"造成病人中度残疾的医疗事故属于","c":"护理伦理与法律","sc":1,"o":{"A":"一级医疗事故","B":"二级医疗事故","C":"三级医疗事故","D":"四级医疗事故"},"a":"B","e":"二级医疗事故为造成病人中度残疾、器官组织损伤致严重功能障碍。"},{"i":"2019_4_multi_21","t":"multi","s":"护理工作的主要压力源包括","c":"科学思维方法与临床护理决策","sc":2,"o":{"A":"不良的工作环境","B":"沉重的工作负荷","C":"紧急的工作性质","D":"复杂的人际关系","E":"高风险的工作"},"a":"ABCDE","e":"护理工作压力源：不良工作环境、沉重工作负荷、紧急工作性质、复杂人际关系、高风险工作。"},{"i":"2019_4_multi_22","t":"multi","s":"下列关于中国文化核心精神和特征描述正确的有","c":"文化和护理","sc":2,"o":{"A":"中国文化的核心精神是商周时期产生的中和主义","B":"要做到人际关系融洽，相容相生，和而不同","C":"凡事不走极端，求大同存小异","D":"鼓励个人欲望的满足","E":"弘扬个性张扬"},"a":"ABC","e":"中国文化核心精神是中和主义，主张和而不同、不走极端、求同存异；鼓励个人欲望满足、弘扬个性张扬属西方文化特征。"},{"i":"2019_4_multi_23","t":"multi","s":"护理诊断的组成部分包括","c":"护理程序","sc":2,"o":{"A":"名称","B":"症状","C":"诊断依据","D":"相关因素","E":"定义"},"a":"ACDE","e":"护理诊断由名称、定义、诊断依据、相关因素四部分组成；症状是诊断依据的内容。"},{"i":"2019_4_multi_24","t":"multi","s":"临终病人家属的需要包括","c":"临终关怀","sc":2,"o":{"A":"了解病人病情和照顾等相关问题","B":"参与病人的日常照顾","C":"被关怀与支持","D":"了解病人死后的相关事宜","E":"了解相关的社会资源"},"a":"ABCDE","e":"家属需要：了解病情及照顾问题、参与日常照顾、被关怀与支持、了解病人死后事宜、了解社会资源。"},{" sc":3,"at":"参考答案（要点）：指交往双方已由互不相识的零接触，通过第一次接触、留下表面印象而建立起初步联系，但尚无情感卷入与心理互动的状态。","e":""},{"i":"2019_4_short_41","t":"short","s":"简述护患关系的特征。","c":"护患关系与人际沟通","sc":5,"at":"参考答案（要点）：①是一种专业性的互动关系(以专业活动为中心)；②是治疗性的关系；③是以服务对象为中心的关系；④是一种工作关系、帮助性关系；⑤具有时限性和目的性。","e":""},{"i":"2019_4_short_42","t":"short","s":"简述文化的特征。","c":"文化和护理","sc":5,"at":"参考答案（要点）：①超自然性与超个人性；②地域性与超地域性；③时代性与超时代性；④继承性(传播性)与变异性；⑤文化具有鲜明的民族性。","e":""},{"i":"2019_4_short_43","t":"short","s":"组成评判性思维的情感态度因素有哪些？","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①自信负责；②诚实公正；③好奇执著；④谦虚谨慎；⑤独立思考、有创造性。","e":""},{"i":"2019_4_short_44","t":"short","s":"简述护理措施的分类。","c":"护理程序","sc":5,"at":"参考答案（要点）：①独立性护理措施：护士独立判断决定采取的措施；②依赖性护理措施：遵医嘱执行的措施；③协作性(合作性)护理措施：与其他医务人员合作共同完成的措施。","e":""},{"i":"2019_4_short_45","t":"short","s":"希望作为一种精神动力，具有哪些特征？","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：①情感性；②认知性；③行为性；④依附性；⑤时空性；⑥情景性。","e":""},{"i":"2019_4_essay_46","t":"essay","s":"试述健康教育的程序。","c":"健康教育","sc":10,"at":"参考答案（要点）：①健康教育评估：评估服务对象的学习需要、学习准备、学习能力及影响学习的因素；②健康教育诊断(确定健康问题)；③制定健康教育计划：明确目标、内容、方法、评价方式；④实施健康教育计划：按计划开展教育活动；⑤健康教育评价：对教育过程与效果进行近期、中期、远期评价并反馈改进。","e":""},{"i":"2019_4_case_47","t":"case","s":"下列是某患者住院后护理评估收集到的资料：腹痛、心率120次/分、手术前精神紧张、希望有亲友来探望、对医院环境不熟悉、走路易摔倒、患者希望医护人员操作前征求自己的意见，同时担心住院影响工作。请根据马斯洛的需要层次理论对以上护理问题进行分类。","c":"护理相关理论及模式","sc":10,"at":"参考答案（要点）：按马斯洛需要层次由低到高分类：①生理的需要：腹痛、心率120次/分；②安全的需要：对医院环境不熟悉、走路易摔倒；③爱与归属的需要：希望有亲友来探望；④尊重的需要：希望医护人员操作前征求自己意见；⑤认知/自我实现相关：手术前精神紧张、担心住院影响工作(可归为爱与归属/尊重及心理需要层面)。说明：分类应体现层次顺序与护理优先性。","e":""}]},{"key":"2020_08","name":"2020年8月","qs":[{"i":"2020_08_single_1","t":"single","s":"护理人员观察用药后病人的药物反应及疗效属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"依赖性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"独立性护理功能"},"a":"D","e":"运用专业知识独立观察判断药效属独立性护理功能。"},{"i":"2020_08_single_2","t":"single","s":"人们在车祸发生后进行的自救，属于","c":"健康教育","sc":1,"o":{"A":"预警行为","B":"求医行为","C":"遵医行为","D":"保健行为"},"a":"A","e":"事故发生后正确自救、防范损害扩大属预警行为。"},{"i":"2020_08_single_3","t":"single","s":"被称为“现代心理学之父”的精神分析学派创始人是","c":"护理相关理论及模式","sc":1,"o":{"A":"艾瑞克森","B":"弗洛伊德","C":"科尔伯格","D":"皮亚杰" 一定社会的经济基础决定的，以善恶为评价标准，依靠社会舆论、传统习俗和内心信念来维系，调节人与人、人与社会之间关系的行为规范的总和。","e":""},{"i":"2020_08_short_43","t":"short","s":"简述健康教育的基本原则。","c":"健康教育","sc":5,"at":"参考答案（要点）：①科学性；②规律性(可行性)；③针对性；④启发性；⑤行政性；⑥通俗性(直观性)等。","e":""},{"i":"2020_08_short_44","t":"short","s":"简述对临终患者心理关怀的原则。","c":"临终关怀","sc":5,"at":"参考答案（要点）：①给予充分的照护、陪伴与同情；②尊重其隐私、选择与信仰；③真诚倾听，不欺骗、不强行纠正；④允许适度宣泄悲伤；⑤同时关心支持家属；⑥维护其尊严，提高生命质量。","e":""},{"i":"2020_08_short_45","t":"short","s":"简述护理道德的基本范畴。","c":"护理伦理与法律","sc":5,"at":"参考答案（要点）：主要包括权利与义务、情感与良心、审慎与保密、荣誉与幸福等。","e":""},{"i":"2020_08_essay_46","t":"essay","s":"试述归纳性思维教育模式的主要内容。","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案（要点）：归纳性思维教育模式由美国护理学者提出，强调从具体经验、资料出发归纳出一般结论，含五个阶段：①汇集资料(收集病人主客观资料)；②归纳形成假设/诊断；③计划并实施护理措施；④评价结果；⑤从经验中学习、修正认知。特点是重视临床资料、循序渐进、培养评判性与临床决策能力，体现护理程序的思维过程。","e":""},{"i":"2020_08_case_47","t":"case","s":"吴先生，男，65岁，新加坡华侨。在中国旅游期间因病就医，对住院过程很不适应，表现为孤独、退缩、多疑，甚至发怒。作为吴先生的责任护士，你认为他出现了哪种问题？为了更有效地提供跨文化护理措施，你可以提出哪些问题来正确评估患者的文化背景？","c":"文化和护理","sc":10,"at":"参考答案（要点）：(1)吴先生出现了文化休克(文化震惊)：因身处陌生文化环境、语言与习俗差异，产生孤独、退缩、多疑、易怒等表现。(2)评估文化背景可提出的问题：①其文化背景、民族、宗教信仰及对健康、疾病、就医的看法；②饮食、语言沟通习惯与禁忌；③对护理方式、隐私、性别接触的期望；④家庭支持与社会关系；⑤对疼痛、死亡、治疗方式的态度；⑥希望被如何称呼与照护，以便提供与其文化相适应的护理(文化关怀保存/调适/重建)。","e":""}]},{"key":"2020_10","name":"2020年10月","qs":[{"i":"2020_10_single_1","t":"single","s":"以人的健康为中心阶段的护理特点是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"护理理论指导护理实践","B":"护理人员的工作场所在医院","C":"对病人实施整体护理","D":"护理对象主要为住院病人"},"a":"A","e":"该阶段以护理理论指导护理实践，护理对象扩大到健康人与病人。"},{"i":"2020_10_single_2","t":"single","s":"一位患急性肾炎的病人痊愈后不愿出院，可能出现的角色适应问题是","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"B","e":"安于病人角色、害怕出院属角色行为强化。"},{"i":"2020_10_single_3","t":"single","s":"根据马斯洛的人类基本需要理论，下列应首先得到满足的需要是","c":"护理相关理论及模式","sc":1,"o":{"A":"尊重的需要","B":"安全的需要","C":"自我实现的需要","D":"爱与归属的需要"},"a":"B","e":"所列选项中安全的需要层次最基本，应优先满足。"},{"i":"2020_10_single_4","t":"single","s":"人们要求自己的行为符合理想标准，属于人格结构中的","c":"护理相关理论及模式","sc":1,"o":{"A":"本我","B":"自我","C":"超我","D":"本能"},"a":"C","e":"超我遵循至善原则，要求行为符合道德理想。"},{"i":"2020_10_single_5","t":"single","s":"下列关于压力的说法正确的是","c":"护理相关理论及模式","sc":1,"o":{"A":"日常生活中的压力都会损害人的身体健康","B":"压力是包括刺激、认知评价及反应的三个环节的动态过程","C":"压力与多种疾病都有关系，我们应积极避免一切压力","D":"压力是环境刺激的直接结果"},"a":"B","e":"压力是包括刺激、认知评价及反应三个环节的动态过程。"},{"i":"2020_10_single_6","t":"single","s":"交往关系中的一方尊重对方的意见，但最终会根据自己的主观愿望决定是否照办，这种心理差位关系属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"微弱差位","B":"中强差位","C":"显著差位","D":"超强差位"},"a":"B","e":"尊重对方意见但仍按自己意愿决定属中强差位。"},{"i":"2020_10_single_7","t":"single","s":"交往双方针锋相对，心理上有排斥情绪，其心理距离是","c":"护患关系与人际沟通","sc":1,"o":{"A":"负二级","B":"负一级","C":"正一级","D":"正三级"},"a":"A","e":"针锋相对、相互排斥属负二级心理距离。"},{"i":"2020_10_single_8","t":"single","s":"沟通的人际距离一般是","c":"护患关系与人际沟通","sc":1,"o":{"A":"15cm","B":"30cm","C":"50cm","D":"80cm"},"a":"C","e":"霍尔人际距离约50cm(0.5~1.2m)。"},{"i":"2020_10_single_10","t":"single","s":"佛教的中国化体现了中国文化的","c":"文化和护理","sc":1,"o":{"A":"多样性","B":"包容性","C":"连续性","D":"统一性"},"a":"B","e":"外来文化被吸收融合体现文化的包容性。"},{"i":"2020_10_single_11","t":"single","s":"科学思维最普通、最基本的形式是","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"逻辑思维","B":"创造性思维","C":"数理思维","D":"评判性思维"},"a":"A","e":"逻辑思维是科学思维最普通、最基本的形式。"},{"i":"2020_10_single_12","t":"single","s":"下列属于护理诊断中相关因素的是","c":"护理程序","sc":1,"o":{"A":"疼痛","B":"便秘","C":"活动无耐力","D":"饮食习惯不良"},"a":"D","e":"饮食习惯不良是导致健康问题的原因(相关因素)；疼痛、便秘、活动无耐力为症状或诊断名称。"},{"i":"2020_10_single_13","t":"single","s":"下列关于护理目标的陈述，正确的是","c":"护理程序","sc":1,"o":{"A":"一个预期目标可针对多个护理诊断","B":"目标的主语应该是护理人员","C":"目标应陈述清楚所进行的护理活动","D":"目标是期望护理活动后护理对象能够达到的健康状态"},"a":"D","e":"护理目标是期望护理活动后护理对象能够达到的健康状态。"},{"i":"2020_10_single_14","t":"single","s":"纽曼的保健系统理论认为","c":"护理专业理论及模式","sc":1,"o":{"A":"机体抵抗线的完整是判断机体处于健康状态的标志","B":"护理是护士与患者在护理情景中分享感知而进行的行动、反应和互动过程","C":"护理活动的主要功能是控制压力源或增强人体各种防卫系统的功能","D":"护理可以通过改变环境而促进机体的修复"},"a":"C","e":"纽曼理论认为护理活动的主要功能是控制压力源、增强人体各种防卫(防御)系统的功能。"},{"i":"2020_10_single_15","t":"single","s":"根据罗依适应理论，环境中引起个体反应的直接原因是","c":"护理专业理论及模式","sc":1,"o":{"A":"相关刺激","B":"主要刺激","C":"固有刺激","D":"一般刺激"},"a":"B","e":"主要刺激是当前直接引起个体反应的最主要原因。"},{"i":"2020_10_single_16","t":"single","s":"针对不良生活方式进行的健康教育属于健康教育的","c":"健康教育","sc":1,"o":{"A":"医学阶段","B":"行为阶段","C":"社会环境阶段","D":"心理学阶段"},"a":"B","e":"针对不良生活方式、行为改变属行为阶段。"},{"i":"2020_10_single_17","t":"single","s":"在对护理学生进行护患沟通教育时，最好的教育方法是","c":"健康教育","sc":1,"o":{"A":"角色扮演法","B":"团体讨论法","C":"专题讲座法","D":"视听教材的应用"},"a":"A","e":"角色扮演法最利于训练护患沟通技能。"},{"i":"2020_10_single_18","t":"single","s":"个体逐步以理智面对丧失，组织悼念活动，内心恢复平静，属于悲哀过程的","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"震惊阶段","B":"逐步认知阶段","C":"修复重建阶段","D":"抑郁接受阶段"},"a":"C","e":"以理智面对丧失、组织悼念、内心恢复平静属修复重建阶段。"},{"i":"2020_10_single_20","t":"single","s":"抢救病历必须在多少小时内据实补记？","c":"护理伦理与法律","sc":1,"o":{"A":"6小时","B":"12小时","C":"24小时","D":"36小时"},"a":"A","e":"抢救结束后6小时内据实补记。"},{"i":"2020_10_multi_21","t":"multi","s":"初级卫生保健任务包括","c":"健康与疾病","sc":2,"o":{"A":"疾病预防","B":"健康维护","C":"健康促进","D":"疾病治疗","E":"康复服务"},"a":"ABCDE","e":"初级卫生保健任务涵盖疾病预防、健康维护、健康促进、疾病治疗、康复服务等。"},{"i":"2020_10_multi_22","t":"multi","s":"在护理评估中，生活状态及自理程度的评估内容包括","c":"护理程序","sc":2,"o":{"A":"饮食型态","B":"健康感知与健康管理型态","C":"活动与运动型态","D":"自我感知与自我概念型态","E":"应对与应激耐受型态"},"a":"ABC","e":"生活状态及自理程度含饮食型态、健康感知与健康管理型态、活动与运动型态等；自我感知、应对应激属心理社会评估。"},{"i":"2020_10_multi_23","t":"multi","s":"文化的功能包括","c":"文化和护理","sc":2,"o":{"A":"文化使社会有了系统的行为规范","B":"文化使社会团结有了重要的基础","C":"文化塑造了社会的人","D":"文化满足了人类的需要","E":"文化传递社会经验和信息"},"a":"ABCDE","e":"文化使社会有系统行为规范、使社会团结、塑造社会的人、满足人类需要、传递社会经验信息。"},{"i":"2020_10_fill_26","t":"fill","s":"二级预防中的“三早”是指早期发现、早期诊断和____________。","c":"健康与疾病","sc":1,"at":"参考答案：早期治疗。","e":""},{"i":"2020_10_fill_27","t":"fill","s":"被誉为跨文化护理和人类关怀理论的创始人是____________。","c":"文化和护理","sc":1,"at":"参考答案：莱宁格(格莱宁/Leininger)。","e":""},{"i":"2020_10_fill_28","t":"fill","s":"沟通的最高层次是____________。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：共鸣性沟通。","e":""},{"i":"2020_10_fill_29","t":"fill","s":"中国文化的核心精神是商周时期产生的____________。","c":"文化和护理","sc":1,"at":"参考答案：中和主义。","e":""},{"i":"2020_10_fill_30","t":"fill","s":"护理诊断可分为现存的、潜在的、____________和综合的护理诊断。","c":"护理程序","sc":1,"at":"参考答案：健康的(健康促进的)。","e":""},{"i":"2020_10_fill_33","t":"fill","s":"在现实生活中，丧失的最主要表现形式是____________。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：丧偶(配偶死亡)。","e":""},{"i":"2020_10_fill_35","t":"fill","s":"护理法规的基本内容包括总纲、护理教育、____________和护理服务。","c":"护理伦理与法律","sc":1,"at":"参考答案：护士注册(部分)。","e":""},{"i":"2020_10_term_36","t":"term","s":"患病","c":"健康与疾病","sc":3,"at":"参考答案（要点）：指病人对处于疾病状态的主观感知与心理体验，是个体感觉和判断自己处于不健康状态的过程，受文化、心理及社会因素影响。","e":""},{"i":"2020_10_term_37","t":"term","s":"压力反应","c":"护理相关理论及模式","sc":3,"at":"参考答案（要点）：指个体因压力源刺激经认知评价后产生的生理、心理及行为反应，如全身适应综合征的警戒、抵抗、衰竭表现及焦虑、情绪改变等。","e":""},{"i":"2020_10_term_38","t":"term","s":"文化","c":"文化和护理","sc":3,"at":"参考答案（要点）：是在群族或社会生活中通过学习获得、共享和传播并代代相传的模式化生活方式、价值观、信仰、行为标准和实践活动的总称。","e":""},{"i":"2020_10_term_39","t":"term","s":"决策","c":"科学思维方法与临床护理决策","sc":3,"at":"参考答案（要点）：指从两个或两个以上可供选择的方案中，结合专业知识、经验和客观条件，经过分析判断选择最佳方案的过程。","e":""},{"i":"2020_10_term_40","t":"term","s":"护理理论","c":"护理专业理论及模式","sc":3,"at":"参考答案（要点）：是以护理理念及模式为基础，借鉴其他学科原理，清楚阐明护理现象及其相互间关系、观点概念较具体、能指导解决护理实践中具体问题的知识体系。","e":""},{"i":"2020_10_short_41","t":"short","s":"简述风险型临床护理决策的基本条件。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①事件结局尚不能肯定，但其概率可以估计；②存在两种以上的结局；③可以计算出不同结局的收益和损失。","e":""},{"i":"2020_10_short_42","t":"short","s":"按照护理理论的着重点不同，可将护理理论分为哪些类型？","c":"护理专业理论及模式","sc":5,"at":"参考答案（要点）：①以需要及问题为中心的理论；②以护患关系为中心的理论；③以系统为中心的理论；④以能量源为中心的理论。","e":""},{"i":"2020_10_short_43","t":"short","s":"简述健康信念模式的内容。","c":"健康教育","sc":5,"at":"参考答案（要点）：由个人对疾病易感性、严重后果的认知，以及行为提示因素(诱发事件)、修正因素(人口学、社会因素)等组成；预测并解释个体是否采取健康行为，核心是感知易感性与感知益处/障碍。","e":""},{"i":"2020_10_short_44","t":"short","s":"简述临终病人家属的需求。","c":"临终关怀","sc":5,"at":"参考答案（要点）：①了解病情和照顾等相关问题；②参与病人的日常照顾；③被关怀与支持；④了解病人死后的相关事宜；⑤了解相关社会资源。","e":""},{"i":"2020_10_essay_46","t":"essay","s":"试述系统论与护理程序的关系。","c":"护理程序","sc":10,"at":"参考答案（要点）：①护理程序是一个由评估、诊断、计划、实施、评价组成的开放系统，各环节相互联系、相互作用；②系统论是护理程序的理论基础，把护理对象视为整体系统，与环境持续交换信息、物质与能量；③护理程序作为一个开放系统，通过输入病人资料、经各环节加工、输出护理效果、再经评价反馈形成动态循环，体现系统的整体性、层次性、动态性和目的性；④整体护理、系统思维保证护理决策的连贯与质量。","e":""},{"i":"2020_10_case_47","t":"case","s":"患者对护士说：“我的检查结果出来了，胰腺好像长了一个东西，我真的有些担心。”护士回答说：“噢，原来如此！好吧，你准备一下，我马上帮你输液。”请问：护士在与患者沟通中存在什么问题？日常护患沟通技巧有哪些？","c":"护患关系与人际沟通","sc":10,"at":"参考答案（要点）：(1)存在的问题：护士对患者的担忧未倾听、未共情回应，属改变话题/主观忽视，沟通事务化、缺乏治疗性，使患者感到被敷衍冷漠。(2)日常护患沟通技巧：①专注倾听；②接受与尊重；③同理心、安慰支持；④沉默；⑤开放式提问、核实澄清；⑥自我暴露、提供信息；⑦触摸、幽默等非语言技巧。","e":""}]},{"key":"2021_4","name":"2021年4月","qs":[{"i":"2021_4_single_2","t":"single","s":"莱宁格“日出模式”第四层的主要含义是","c":"文化和护理","sc":1,"o":{"A":"显示不同文化背景和环境下的文化关怀型态以及文化关怀表达方式","B":"描述了文化关怀、世界观与文化社会结构及其组成因素","C":"阐述了个体、家庭、群体、社区或机构的不同健康系统及其相互影响","D":"揭示了护理关怀的决策和行为"},"a":"D","e":"日出模式Ⅳ级（第四层）为护理关怀决策和行为层，揭示护理关怀的决策和行为。A为Ⅱ级，B为Ⅰ级，C为Ⅲ级。"},{"i":"2021_4_single_3","t":"single","s":"护理人员应用自己的专业知识及技能决定的护理措施及护理服务，属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"独立性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"依赖性护理功能"},"a":"A","e":"护理人员运用专业知识及技能独立决定并实施的护理措施属独立性护理功能。"},{"i":"2021_4_single_5","t":"single","s":"不同组织部位的炎症表现大都有红、肿、热、痛、功能障碍的病理改变，这种描述体现了思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"间接性","B":"概括性","C":"逻辑性","D":"物质性"},"a":"B","e":"思维的概括性是将同一类事物共同特征抽取出来加以概括。"},{"i":"2021_4_single_6","t":"single","s":"对服务对象健康感知与健康管理型态的评估属于护理评估内容中的","c":"护理程序","sc":1,"o":{"A":"一般资料","B":"生活状况及自理程度","C":"健康检查","D":"心理社会方面的资料"},"a":"B","e":"健康感知与健康管理型态属生活状况及自理程度的评估内容。"},{"i":"2021_4_single_7","t":"single","s":"在护理诊断陈述的PES公式中，“P”表示的含义是","c":"护理程序","sc":1,"o":{"A":"健康问题","B":"原因","C":"症状或体征","D":"实验室检查"},"a":"A","e":"P为Problem即健康问题，E为相关因素，S为症状体征。"},{"i":"2021_4_single_8","t":"single","s":"交往双方寻求和建立共同情感联系领域的过程，属于人际关系发展阶段中的","c":"护患关系与人际沟通","sc":1,"o":{"A":"定向选择阶段","B":"情感探索阶段","C":"情感交流阶段","D":"稳定交往阶段"},"a":"B","e":"情感探索阶段是交往双方寻求和确立建立共同情感联系领域的过程。"},{"i":"2021_4_single_9","t":"single","s":"下列关于奥瑞姆(Orem)自理理论的描述，正确的是","c":"护理专业理论及模式","sc":1,"o":{"A":"护理是帮助人减少压力源，以扭转压力对人造成的影响","B":"护理是帮助人们控制或适应刺激","C":"护理是预防自理缺陷的发生和发展","D":"护理服务是由三级预防保健护理完成的"},"a":"C","e":"Orem认为护理是帮助服务对象克服自理缺陷，预防自理缺陷的发生和发展。"},{"i":"2021_4_single_10","t":"single","s":"指导－合作型护患关系模式适用于","c":"护患关系与人际沟通","sc":1,"o":{"A":"昏迷病人","B":"急性心肌梗死病人","C":"慢性肾炎病人","D":"精神病病人"},"a":"B","e":"指导-合作型适用于急性病、病情较重但意识清醒的病人，如急性心肌梗死病人。"},{"i":"2021_4_single_11","t":"single","s":"Lawrence Green 和 Marshall Kreuter 提出了","c":"健康教育","sc":1,"o":{"A":"保护动力理论","B":"健康信念模式","C":"知信行模式","D":"保健教育过程模式"},"a":"D","e":"Green与Kreuter提出保健教育过程模式（PRECEDE-PROCEED模式）。"},{"i":"2021_4_single_12","t":"single","s":"一癌症病人，不愿承认自己的病情，仍坚持工作，这种情况属于","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"D","e":"病人未能进入病人角色、不承认自己有病属病人角色行为缺如。"},{"i":"2021_4_single_13","t":"single","s":"个人所感知的期望与自身生活背景或生活经历息息相关，体现了希望的","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"情感性","B":"情景性","C":"依附性","D":"认知性"},"a":"B","e":"希望与个体生活背景、经历及所处情景相关联体现情景特性。"},{"i":"2021_4_single_14","t":"single","s":"根据马斯洛的人类基本需要理论，最高层次的需要是","c":"护理相关理论及模式","sc":1,"o":{"A":"尊重的需要","B":"安全的需要","C":"自我实现的需要","D":"爱与归属的需要"},"a":"C","e":"马斯洛需要层次由低到高最高层为自我实现的需要。"},{"i":"2021_4_single_15","t":"single","s":"根据艾瑞克森的心理社会发展理论，幼儿期发展的危机是","c":"护理相关理论及模式","sc":1,"o":{"A":"主动对内疚","B":"勤奋对自卑","C":"自主对羞愧或疑虑","D":"自我统一对角色混乱"},"a":"C","e":"幼儿期(1~3岁)发展危机为自主对羞愧或疑虑。"},{"i":"2021_4_single_16","t":"single","s":"下列关于适应的描述正确的是","c":"护理相关理论及模式","sc":1,"o":{"A":"适应是一种被动地服从或接受压力源的动态过程","B":"人类的适应能力是无限的","C":"适应是人类所特有的、区别于动物的特征","D":"适应能力有个体差异，因人而异"},"a":"D","e":"适应能力存在个体差异，受个性、应对资源等影响而因人而异。"},{"i":"2021_4_single_18","t":"single","s":"非技术性护患关系中最主要的内容是","c":"护患关系与人际沟通","sc":1,"o":{"A":"价值关系","B":"道德关系","C":"法律关系","D":"文化关系"},"a":"B","e":"护患道德关系是非技术性护患关系中最主要的内容。"},{"i":"2021_4_single_19","t":"single","s":"一位护士对已确诊为癌症的病人讲：“不要担心，现在的医学很发达，你的病是可以治好的。”这体现的护患沟通问题是","c":"护患关系与人际沟通","sc":1,"o":{"A":"突然改变话题","B":"主观说教","C":"言行不一","D":"虚假的保证"},"a":"D","e":"对预后不良病人轻易承诺“能治好”属虚假的保证。"},{"i":"2021_4_single_20","t":"single","s":"伽利略证明和发展了哥白尼的日心说，体现了文化的","c":"文化和护理","sc":1,"o":{"A":"继承性","B":"超时代性","C":"阶级性","D":"地域性"},"a":"A","e":"后人在前人基础上继承发展前人成果体现文化的继承性。"},{"i":"2021_4_multi_21","t":"multi","s":"社会认知的偏差包括","c":"护患关系与人际沟通","sc":2,"o":{"A":"首因效应","B":"近因效应","C":"晕轮效应","D":"装饰效应","E":"社会刻板效应"},"a":"ABCE","e":"社会认知偏差包括首因效应、近因效应、晕轮效应、社会刻板效应等。"},{"i":"2021_4_multi_22","t":"multi","s":"评判性思维的情感态度因素包括","c":"科学思维方法与临床护理决策","sc":2,"o":{"A":"自信负责","B":"诚实公正","C":"好奇执着","D":"独立思考","E":"谦虚谨慎"},"a":"ABCDE","e":"评判性思维的情感态度因素包括自信负责、诚实公正、好奇执着、独立思考、谦虚谨慎等。"},{"i":"2021_4_multi_23","t":"multi","s":"健康教育的基本原则包括","c":"健康教育","sc":2,"o":{"A":"科学性","B":"规律性","C":"启发性","D":"行政性","E":"抽象性"},"a":"ABCD","e":"健康教育原则包括科学性、规律性、针对性、启发性、行政性、通俗性等，抽象性不属于。"},{"i":"2021_4_multi_24","t":"multi","s":"失望的行为表现有","c":"希望、失望与丧失、悲哀","sc":2,"o":{"A":"对将来的预见能力降低","B":"反复遭受失败","C":"对自己及他人失去信心","D":"放弃努力","E":"争取实现目标的能力降低"},"a":"ABCDE","e":"失望的行为表现包括预见能力降低、反复失败、失去信心、放弃努力、争取目标能力降低等。"},{"i":"2021_4_multi_25","t":"multi","s":"下列属于临床死亡期的表现有","c":"临终关怀","sc":2,"o":{"A":"各种反射减弱或迟钝","B":"肌张力减弱或消失","C":"心跳、呼吸完全停止，瞳孔散大","D":"各种组织细胞仍有微弱而短暂的代谢活动","E":"低温条件下，尤其是头部降温脑耗氧降低时，临床死亡期可延长达1小时或更久"},"a":"BCDE","e":"临床死亡期表现为心跳呼吸完全停止、瞳孔散大、肌张力消失、组织细胞仍有微弱短暂代谢；反射减弱属濒死期。"},{"i":"2021_4_fill_26","t":"fill","s":"护理理念的发展分为禁欲主义阶段、浪漫主义阶段、________和人本存在主义阶段。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案：实用主义阶段。","e":""},{"i":"2021_4_fill_27","t":"fill","s":"护理道德的基本原则是无害、________、尊重和公正四个原则。","c":"护理伦理与法律","sc":1,"at":"参考答案：有利（有益）。","e":""},{"i":"2021_4_fill_28","t":"fill","s":"疾病不仅是体内的病理过程，而且是________适应的失败。","c":"健康与疾病","sc":1,"at":"参考答案：内外环境。","e":""},{"i":"2021_4_fill_29","t":"fill","s":"心理学上将社会认知过程中容易选择的________，称为中心特质。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：个性品质（起中心作用的特质）。","e":""},{"i":"2021_4_fill_30","t":"fill","s":"文化现象包括人们活动的________、精神产品以及活动方式本身。","c":"文化和护理","sc":1,"at":"参考答案：物质财富（物质产品）。","e":""},{"i":"2021_4_fill_31","t":"fill","s":"法律的核心范畴是权力、________和义务。","c":"护理伦理与法律","sc":1,"at":"参考答案：权利。","e":""},{"i":"2021_4_fill_32","t":"fill","s":"根据罗依的适应理论，人的内在应对机转包括生理调节和________。","c":"护理专业理论及模式","sc":1,"at":"参考答案：认知调节。","e":""},{"i":"2021_4_fill_33","t":"fill","s":"健康教育的发展可分为医学阶段、________和社会环境阶段。","c":"健康教育","sc":1,"at":"参考答案：行为阶段。","e":""},{"i":"2021_4_fill_34","t":"fill","s":"丧失按时限可分为暂时性丧失和________。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：永久性丧失。","e":""},{"i":"2021_4_fill_35","t":"fill","s":"尸斑通常在死后________小时出现。","c":"临终关怀","sc":1,"at":"参考答案：2~4。","e":""},{"i":"2021_4_term_36","t":"term","s":"初级卫生保健","c":"健康与疾病","sc":3,"at":"参考答案（要点）：是指主要由基层卫生人员提供必需的、基本的、为社会群众和家庭广泛接受的卫生保健服务，是实现“2000年人人享有卫生保健”目标的关键途径，体现社会公正与人人平等原则。","e":""},{"i":"2021_4_term_38","t":"term","s":"零接触状态","c":"护患关系与人际沟通","sc":3,"at":"参考答案（要点）：指交往双方互不相识，相互之间均未注意到对方的存在，彼此完全无关，形如陌路，无任何情感联结，心理距离为零级。","e":""},{"i":"2021_4_term_39","t":"term","s":"移情","c":"护患关系与人际沟通","sc":3,"at":"参考答案（要点）：指人际交往中个体把自身的情感、经历转移到他人他物身上，从而分享他人情感、理解他人处境的一种心理过程；护理中指护士设身处地站在服务对象角度理解其感受。","e":""},{"i":"2021_4_term_40","t":"term","s":"濒死","c":"临终关怀","sc":3,"at":"参考答案（要点）：又称临终，指病人已经接受治疗性和姑息性治疗后，虽意识清楚但病情恶化，机体各重要器官生理功能趋于衰竭，生命活动走向终结的阶段。","e":""},{"i":"2021_4_short_41","t":"short","s":"简述文化休克的临床表现。","c":"文化和护理","sc":5,"at":"参考答案（要点）：①焦虑；②恐惧；③沮丧、绝望；④自卑；⑤孤独、失落感；⑥躯体症状如失眠、食欲下降、疲乏等。（多表现在身心两方面）","e":""},{"i":"2021_4_short_42","t":"short","s":"简述影响临床护理决策的个体因素。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①个人价值观；②知识及经验；③个性特征；④个人的应对方式等（个体因素）。另还有环境因素与情境因素。","e":""},{"i":"2021_4_short_45","t":"short","s":"简述失望的生理及情感表现。","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：生理表现为体重减轻、食欲减退、疲乏无力、睡眠紊乱等；情感表现为无望感、挫败感及冷漠感。","e":""},{"i":"2021_4_essay_46","t":"essay","s":"试述护理人员在处理及执行医嘱时应主要注意的问题。","c":"护理伦理与法律","sc":10,"at":"参考答案（要点）：①医嘱要准确、及时执行，不得擅自更改；②认真核对医嘱，对有疑问的医嘱应核实清楚后再执行；③一般不执行口头医嘱，抢救时口头医嘱须复诵核对、及时补写；④发现医嘱有错误应及时报告医生，必要时拒绝执行并向上级报告；⑤严格执行查对制度和操作规程；⑥观察用药后及治疗效果与不良反应；⑦及时记录执行情况。","e":""},{"i":"2021_4_case_47","t":"case","s":"某医院急诊科室护士长王某，经常面对高强度的工作压力，产生巨大的工作疲惫感，表现为情绪不稳定，失眠、焦虑，严重地影响了她的身心健康。请问：护理人员的工作压力源主要有哪些？护理人员可以采取哪些措施缓解压力？","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案（要点）：(1)工作压力源：①不良的工作环境；②紧急的工作性质；③沉重的工作负荷；④复杂的人际关系；⑤高风险的工作（如担心差错事故）。(2)缓解措施：①加强自我理解与能力培养，正确评价自己；②调整身心状态，合理安排工作与休息，培养业余兴趣；③建立支持性社会网络，寻求他人帮助；④运用放松技巧，学习心理调节；⑤改善工作环境与管理，合理排班。","e":""}]},{"key":"2021_10","name":"2021年10月","qs":[{"i":"2021_10_single_1","t":"single","s":"护理人员需要按照医师的处方及其他医嘱对服务对象实施护理，这种护理功能属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"独立性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"依赖性护理功能"},"a":"D","e":"按医嘱、处方实施护理属依赖性护理功能。"},{"i":"2021_10_single_2","t":"single","s":"战争带来的伤残与死亡，属于健康影响因素中的","c":"健康与疾病","sc":1,"o":{"A":"生物因素","B":"心理因素","C":"社会环境因素","D":"文化因素"},"a":"C","e":"战争属社会环境因素对健康的影响。"},{"i":"2021_10_single_3","t":"single","s":"根据弗洛伊德的观点，发展不顺利会造成强迫性人格的时期为","c":"护理相关理论及模式","sc":1,"o":{"A":"口欲期","B":"肛欲期","C":"性蕾期","D":"潜伏期"},"a":"B","e":"肛欲期固结易形成强迫性（整洁、吝啬、固执）人格。"},{"i":"2021_10_single_4","t":"single","s":"皮亚杰把人的智力发育分为4个阶段，10—12岁儿童应处于","c":"护理相关理论及模式","sc":1,"o":{"A":"感觉运动期","B":"前运思期","C":"具体运思期","D":"形式运思期"},"a":"D","e":"10~12岁进入形式运思期。"},{"i":"2021_10_single_5","t":"single","s":"人际关系双方相互间的赞同与接纳，获得心理上的愉快及满足感，此种吸引称为","c":"护患关系与人际沟通","sc":1,"o":{"A":"相近吸引","B":"相悦吸引","C":"相容吸引","D":"相补吸引"},"a":"B","e":"双方相互赞同接纳、获得心理愉快满足属相悦吸引。"},{"i":"2021_10_single_6","t":"single","s":"两人非常信任，交往较频繁，可进行推心置腹的交流，其心理距离是","c":"护患关系与人际沟通","sc":1,"o":{"A":"负一级","B":"正一级","C":"正二级","D":"正三级"},"a":"D","e":"正三级心理距离很近，关系如好友，交往频繁、推心置腹。"},{"i":"2021_10_single_7","t":"single","s":"某病人由于过敏性休克而急诊入院，在入院初期，护患关系的模式应是","c":"护患关系与人际沟通","sc":1,"o":{"A":"主动－被动型","B":"指导－合作型","C":"共同参与型","D":"服务－指导型"},"a":"A","e":"休克病人意识障碍、危重，适用主动-被动型。"},{"i":"2021_10_single_8","t":"single","s":"下列关于西方礼仪文化描述正确的是","c":"文化和护理","sc":1,"o":{"A":"崇尚群体本位的价值理念","B":"保持和谐，不走极端","C":"主张谦虚，以和为贵","D":"鼓励个人欲望的满足和个性张扬"},"a":"D","e":"西方文化强调个人本位，鼓励个人欲望满足与个性张扬；其余为中国文化特征。"},{"i":"2021_10_single_10","t":"single","s":"自卑的产生，源于下列哪种需要没有得到满足？","c":"护理相关理论及模式","sc":1,"o":{"A":"生理的需要","B":"自尊的需要","C":"安全的需要","D":"情绪的需要"},"a":"B","e":"自尊需要未获满足易产生自卑与自负。"},{"i":"2021_10_single_12","t":"single","s":"下列关于潜在的护理诊断描述正确的是","c":"护理程序","sc":1,"o":{"A":"知识缺乏","B":"潜在并发症：压疮","C":"有感染的危险","D":"母乳喂养有效"},"a":"C","e":"潜在的护理诊断以“有……危险”形式陈述，如“有感染的危险”。"},{"i":"2021_10_single_13","t":"single","s":"关于护理目标的叙述，正确的是","c":"护理程序","sc":1,"o":{"A":"护理目标的主语可以是护理对象的生理功能和机体的一部分","B":"每个护理目标都必须含有条件状语","C":"一个护理目标可以针对两个或两个以上的护理诊断","D":"护理目标制定得越高越好"},"a":"B","e":"护理目标陈述应具体，通常包含主语、谓语、行为标准及条件状语，条件状语说明行为发生的环境条件。"},{"i":"2021_10_single_16","t":"single","s":"根据护理理念的形成和发展，责任制护理的出现始于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"禁欲主义阶段","B":"浪漫主义阶段","C":"实用主义阶段","D":"人本存在主义阶段"},"a":"D","e":"人本存在主义阶段强调以病人为中心，责任制护理兴起。"},{"i":"2021_10_single_17","t":"single","s":"以改变学习者态度为目的的教学方法是","c":"健康教育","sc":1,"o":{"A":"多媒体教学法","B":"视听教学法","C":"讨论法","D":"实地参观法"},"a":"C","e":"讨论法有利于改变学习者态度、培养批判性思维。"},{"i":"2021_10_single_20","t":"single","s":"根据我国目前的法律，如医生开医嘱给病人实行安乐死，护士应该","c":"护理伦理与法律","sc":1,"o":{"A":"执行医嘱","B":"拒绝执行医嘱","C":"在病人及家属签字同意的前提下执行医嘱","D":"在有关上级行政部门批准下执行医嘱"},"a":"B","e":"我国目前法律禁止安乐死，护士应拒绝执行该医嘱。"},{"i":"2021_10_multi_21","t":"multi","s":"社会认知的特征包括","c":"护患关系与人际沟通","sc":2,"o":{"A":"社会认知的准确性","B":"认知过程的互动性","C":"认知形成的一致性","D":"社会认知的评估性","E":"知觉信息的选择性"},"a":"BCE","e":"社会认知特征包括知觉信息的选择性、认知过程的互动性、认知形成的一致性。"},{"i":"2021_10_multi_22","t":"multi","s":"文化休克的临床表现包括","c":"文化和护理","sc":2,"o":{"A":"坐立不安、失眠、疲乏","B":"缺乏自信、忧虑","C":"思维不能集中","D":"躲避、注意力和控制缺陷","E":"胃肠功能减退"},"a":"ABCDE","e":"文化休克可表现为焦虑、失眠疲乏、缺乏自信忧虑、注意力不集中、躲避及躯体胃肠症状等。"},{"i":"2021_10_multi_23","t":"multi","s":"影响临床护理决策的因素有","c":"科学思维方法与临床护理决策","sc":2,"o":{"A":"个人价值观","B":"知识及经验","C":"个性特征","D":"环境因素","E":"情境因素"},"a":"ABCDE","e":"影响临床护理决策的因素包括个体因素（价值观、知识经验、个性）及环境因素、情境因素。"},{"i":"2021_10_multi_24","t":"multi","s":"人的成长发展规律包括","c":"护理相关理论及模式","sc":2,"o":{"A":"以一定的顺序进行","B":"整个过程由加速、减速、等速、再加速等阶段构成","C":"一般规律为由上到下、由复杂到简单、由远到近","D":"各个系统的发育不平衡","E":"具有一定的个体差异"},"a":"ABDE","e":"成长发展为由简单到复杂而非由复杂到简单，C错误；其余均为成长发展规律。"},{"i":"2021_10_fill_26","t":"fill","s":"二级预防中的“三早”是指早期发现、早期诊断和________。","c":"健康与疾病","sc":1,"at":"参考答案：早期治疗（早期处理）。","e":""},{"i":"2021_10_fill_27","t":"fill","s":"导致人际吸引的重要因素是________。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：个人特质。","e":""},{"i":"2021_10_fill_28","t":"fill","s":"人际关系的社会性功能包括营造良好的社会人际气氛和增强________。","c":"护患关系与人际沟通","sc":1,"at":"参考答案：群体凝聚力。","e":""},{"i":"2021_10_fill_29","t":"fill","s":"文化现象的三个方面可以称之为物质文化、精神文化和________。","c":"文化和护理","sc":1,"at":"参考答案：方式文化。","e":""},{"i":"2021_10_fill_30","t":"fill","s":"评判性思维的核心认知技能包含________、解析意义及阐明意义的亚技能。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案：分类（解释）。","e":""},{"i":"2021_10_fill_31","t":"fill","s":"护理程序由________、护理诊断、护理计划、护理实施、护理评价5个步骤组成。","c":"护理程序","sc":1,"at":"参考答案：护理评估（评估）。","e":""},{"i":"2021_10_fill_32","t":"fill","s":"罗伊创立的适应理论由输入、控制、________、输出和反馈5部分组成。","c":"护理专业理论及模式","sc":1,"at":"参考答案：效应器。","e":""},{"i":"2021_10_fill_33","t":"fill","s":"健康教育的干预策略一般可分为教育策略、社会策略、环境策略和________。","c":"健康教育","sc":1,"at":"参考答案：资源策略。","e":""},{"i":"2021_10_fill_34","t":"fill","s":"对大多数人来说，人生所面临的最大丧失可能是________。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：至亲的死亡。","e":""},{"i":"2021_10_term_37","t":"term","s":"文化关怀调适","c":"文化和护理","sc":3,"at":"参考答案（要点）：指护士帮助服务对象在适应其传统价值观、信念与生活方式的同时，对部分与健康不协调的文化成分取其有利、改变不利成分，以适应健康需要的跨文化护理关怀措施。","e":""},{"i":"2021_10_term_38","t":"term","s":"控制论","c":"护理程序","sc":3,"at":"参考答案（要点）：是研究系统各个组成部分之间的控制和通讯的科学，通过信息的传输、反馈与调节，使系统保持稳定状态；护理中用以指导护理程序的反馈与调节。","e":""},{"i":"2021_10_term_39","t":"term","s":"理念","c":"护理学的发展及基本概念","sc":3,"at":"参考答案（要点）：是指个人对事物所持有的价值观及信念，是引导个人行为的比较稳定的思想与认识；护理理念引导护理人员的专业行为与价值取向。","e":""},{"i":"2021_10_term_40","t":"term","s":"悲哀","c":"希望、失望与丧失、悲哀","sc":3,"at":"参考答案（要点）：是指个体面对失落（丧失）时所经历的情感反应与心理调适过程，是一系列主观情感、认知、行为及生理的综合反应。","e":""},{"i":"2021_10_short_41","t":"short","s":"简述患病后病人主要的心理反应。","c":"健康与疾病","sc":5,"at":"参考答案（要点）：①焦虑及恐惧；②依赖性增强；③自尊心增强；④猜疑心加重；⑤主观感觉异常；⑥情绪易激动；⑦孤独感；⑧习惯性心理；⑨害羞与罪恶感；⑩否认和怀疑等。","e":""},{"i":"2021_10_short_42","t":"short","s":"简述循证护理的意义。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①提高护理工作的科学性与有效性；②促进护理经验总结与理论研究；③合理利用护理资源；④提高护理质量、促进病人康复；⑤推动护理人员终身学习与专业发展。","e":""},{"i":"2021_10_short_43","t":"short","s":"简述护理诊断与合作性问题的区别。","c":"护理程序","sc":5,"at":"参考答案（要点）：①护理诊断是护士能够独立采取措施解决的问题，护士可独立负责处理；②合作性问题是需医生与护士共同合作解决的、由各种疾病或治疗所引起的生理并发症，护士只能观察监测并与医生共同干预；③护理诊断描述人类对健康问题的反应，合作性问题侧重潜在并发症。","e":""},{"i":"2021_10_short_45","t":"short","s":"在临床工作中，哪些情况不属于医疗事故？","c":"护理伦理与法律","sc":5,"at":"参考答案（要点）：①紧急抢救垂危病人而采取紧急医学措施造成不良后果的；②在医疗活动中由于病人病情异常或病人体质特殊而发生医疗意外的；③在现有医学科学技术条件下，发生无法预料或不能防范的不良后果的；④无过错输血感染造成不良后果的；⑤因病人及家属原因延误诊疗导致不良后果的；⑥因不可抗力造成不良后果的。","e":""},{"i":"2021_10_essay_46","t":"essay","s":"试述护理人员在健康教育中的作用。","c":"健康教育","sc":10,"at":"参考答案（要点）：①为服务对象提供有关健康的信息；②帮助服务对象认识影响健康的因素；③帮助服务对象确定存在的健康问题；④指导服务对象采纳健康行为、掌握自我护理技能；⑤协调健康教育各部门之间及人际间关系；⑥开展健康教育研究与效果评价。","e":""},{"i":"2021_10_case_47","t":"case","s":"患者张先生，男，40岁，平素性情急躁，嗜好吸烟、高盐高脂饮食，三年前被诊断为高血压，此次张先生与儿子生气后，意识不清，急诊入院，测血压220/110mmHg，医生给予静点降压药物，告知其绝对卧床休息。请问：(1)根据奥瑞姆的自理理论及患者的病情，护士应如何为张先生选择护理系统。(2)奥瑞姆的自理理论中护理系统分哪几类？","c":"护理专业理论及模式","sc":10,"at":"参考答案（要点）：(1)张先生目前高血压急症、意识不清、绝对卧床，完全无法满足其治疗性自理需要，应选择完全补偿系统（全补偿系统），由护士全面替代补偿其自理活动。(2)奥瑞姆将护理系统分为三类：①全补偿系统（完全补偿系统）；②部分补偿系统；③支持-教育系统（辅助-教育系统）。","e":""}]},{"key":"2022_4","name":"2022年4月","qs":[{"i":"2022_4_single_2","t":"single","s":"“日出模式”第三层的主要含义是","c":"文化和护理","sc":1,"o":{"A":"显示不同文化背景和环境下的文化关怀型态以及文化关怀表达方式","B":"描述了文化关怀、世界观与文化社会结构及其组成因素","C":"阐述了个体、家庭、群体、社区或机构的不同健康系统及其相互影响","D":"解释了护理关怀的决策和行为"},"a":"C","e":"日出模式Ⅲ级（第三层）为健康系统层，阐述个体家庭群体社区机构的不同健康系统及其相互影响。"},{"i":"2022_4_single_3","t":"single","s":"文化休克最难渡过的时期是","c":"文化和护理","sc":1,"o":{"A":"兴奋期","B":"意识期","C":"转变期","D":"接受期"},"a":"B","e":"意识期是文化休克表现最明显、最难渡过的时期。"},{"i":"2022_4_single_4","t":"single","s":"皮亚杰把人的智力发育分为4个阶段，10~12岁儿童所处的阶段是","c":"护理相关理论及模式","sc":1,"o":{"A":"感觉运动期","B":"形式运思期","C":"具体运思期","D":"前运思期"},"a":"B","e":"10~12岁进入形式运思期。"},{"i":"2022_4_single_7","t":"single","s":"护理人员与护理对象、其他医务人员密切合作，以全面满足护理对象的需求，体现了护理程序的","c":"护理程序","sc":1,"o":{"A":"互动性","B":"系统性","C":"科学性","D":"普遍性"},"a":"A","e":"护理人员与服务对象及其他人员密切合作体现护理程序的互动性。"},{"i":"2022_4_single_8","t":"single","s":"下列符合奥瑞姆对自理概念阐述的是","c":"护理专业理论及模式","sc":1,"o":{"A":"自理是指进食、沐浴卫生、入厕、修饰等日常生活活动","B":"自理是有目的、有意识的活动","C":"自理能力是人天生就具备的","D":"自理能力具有稳定性，不易受其它因素影响"},"a":"B","e":"Orem认为自理是有目的、有意识地为满足自身需要而进行的活动。"},{"i":"2022_4_single_9","t":"single","s":"纽曼的保健系统理论不包含","c":"护理专业理论及模式","sc":1,"o":{"A":"效应器","B":"压力源","C":"机体防御","D":"预防性护理措施"},"a":"A","e":"纽曼理论涉及压力源、机体防御（弹性/正常/抵抗线）及三级预防措施，效应器属罗依理论。"},{"i":"2022_4_single_10","t":"single","s":"解决医疗事故赔偿等民事责任争议的最终途径是","c":"护理伦理与法律","sc":1,"o":{"A":"协商","B":"卫生行政部门处理","C":"调解","D":"诉讼"},"a":"D","e":"诉讼是解决医疗事故民事赔偿争议的最终途径。"},{"i":"2022_4_single_11","t":"single","s":"实施健康教育时，应根据不同人群的特点，采用不同的教育方法，体现健康教育的","c":"健康教育","sc":1,"o":{"A":"可行性","B":"规律性","C":"针对性","D":"行政性"},"a":"C","e":"根据不同人群特点采取不同方法体现针对性原则。"},{" ③依赖性护理功能：护士按照医生的医嘱及指示实施的护理。","e":""},{"i":"2022_4_short_44","t":"short","s":"简述护理工作中常见的沟通问题。","c":"护患关系与人际沟通","sc":5,"at":"参考答案（要点）：①突然改变话题；②主观判断、说教；③虚假的保证；④快速下结论或提供解决问题的方法；⑤发出不恰当的询问；⑥举止不端、言行不一；⑦信息发出时机不当等。","e":""},{"i":"2022_4_short_45","t":"short","s":"简述希望的特征。","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：希望具有六方面特征：情感性、认知性、行为性、依附性、时空性及情景特性。","e":""},{"i":"2022_4_essay_46","t":"essay","s":"试述评判性思维在护理教学中的应用。","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案（要点）：①护理教学中应创设民主、平等、和谐的氛围，鼓励学生质疑与独立思考；②以问题为中心开展教学，引导学生分析、推理、判断；③运用案例教学、讨论、反思日记等方法培养学生的评判性思维；④教师转变角色，由知识传授者变为引导者、促进者；⑤重视学生的情感态度培养（自信、好奇、谦虚、公正等）；⑥通过形成性评价促进学生评判性思维发展。","e":""},{"i":"2022_4_case_47","t":"case","s":"下列是某病人住院后护理评估收集到的资料：腹痛、心率120次/分，手术前精神紧张，希望有亲友来探望，对医院环境不熟悉，走路易摔倒，病人说“你们应该征求我意见”，担心住院影响工作。请根据马斯洛的需要层次理论对收集到的资料进行分类。","c":"护理相关理论及模式","sc":10,"at":"参考答案（要点）：①生理的需要：腹痛、心率120次/分；②安全的需要：对医院环境不熟悉、走路易摔倒、手术前精神紧张；③爱与归属的需要：希望有亲友来探望；④尊重的需要：病人说“你们应该征求我意见”；⑤自我实现的需要：担心住院影响工作（影响其学习/工作潜能发挥）。","e":""}]},{"key":"2022_10","name":"2022年10月","qs":[{"i":"2022_10_single_1","t":"single","s":"护理人员应用自己的专业知识及技能来决定护理措施及护理服务，属于","c":"护理学的发展及基本概念","sc":1,"o":{"A":"依赖性护理功能","B":"合作性护理功能","C":"指导性护理功能","D":"独立性护理功能"},"a":"D","e":"护士运用专业知识技能独立决定实施护理措施属独立性护理功能。"},{"i":"2022_10_single_2","t":"single","s":"指导妇女自检乳房以早期发现乳腺癌，属于","c":"健康与疾病","sc":1,"o":{"A":"一级预防","B":"二级预防","C":"三级预防","D":"病因预防"},"a":"B","e":"自检乳房早期发现乳腺癌属“三早”，为二级预防。"},{"i":"2022_10_single_3","t":"single","s":"病人在手术前要了解手术的有关注意事项，属于","c":"护理相关理论及模式","sc":1,"o":{"A":"安全的需要","B":"生理的需要","C":"自尊的需要","D":"刺激的需要"},"a":"A","e":"术前了解注意事项、消除不确定感属安全的需要。"},{"i":"2022_10_single_6","t":"single","s":"下列属于共同参与型护患关系模式特点的是","c":"护患关系与人际沟通","sc":1,"o":{"A":"微弱单向性关系","B":"心理方位为等位关系","C":"护士起主导作用","D":"护士教，患者学"},"a":"B","e":"共同参与型双方为心理等位关系，共同参与决策。"},{"i":"2022_10_single_7","t":"single","s":"护患双方在由谁来负责改变服务对象健康状况的问题上发生分歧，属于","c":"护患关系与人际沟通","sc":1,"o":{"A":"角色不明","B":"权益差异","C":"责任冲突","D":"理解分歧"},"a":"C","e":"对谁负责改变健康状况产生分歧属责任冲突。"},{"i":"2022_10_single_10","t":"single","s":"证据来自于专家个人意见，属于循证护理证据分级中的","c":"科学思维方法与临床护 。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案：无望感（无望）。","e":""},{"i":"2022_10_fill_35","t":"fill","s":"法律制裁包括刑事制裁、民事制裁、行政制裁和________。","c":"护理伦理与法律","sc":1,"at":"参考答案：违宪制裁。","e":""},{"i":"2022_10_term_36","t":"term","s":"近因效应","c":"护患关系与人际沟通","sc":3,"at":"参考答案（要点）：指在人际交往中，最近获得的信息对认知他人产生的强烈影响，即最后留下的印象更大程度上左右着总的印象。","e":""},{"i":"2022_10_term_37","t":"term","s":"反文化","c":"文化和护理","sc":3,"at":"参考答案（要点）：指与主流文化相对立、背离或反抗主流文化价值规范的亚文化现象，其价值取向与主导文化存在冲突。","e":""},{"i":"2022_10_term_38","t":"term","s":"护理计划","c":"护理程序","sc":3,"at":"参考答案（要点）：是护理程序的第三步，指护理人员以护理诊断为依据，确定护理目标、制定护理措施及具体方案的过程。","e":""},{"i":"2022_10_short_41","t":"short","s":"促进健康的护理活动包括哪些？","c":"健康与疾病","sc":5,"at":"参考答案（要点）：①帮助人们树立正确的健康观念；②通过健康教育提高人们自我保健能力；③促使人们自觉采纳健康行为与生活方式；④营造有利于健康的环境；⑤帮助服务对象保持和增进健康、预防疾病。","e":""},{"i":"2022_10_short_42","t":"short","s":"简述确定循证护理问题时应具备的条件。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案（要点）：①对服务对象有高度责任心，以服务对象为中心；②熟悉相关业务知识与临床经验；③明确服务对象存在的健康问题；④能够将临床问题转化为可检索、可回答的循证问题；⑤具备提出问题的能力与评判性思维。","e":""},{"i":"2022_10_short_43","t":"short","s":"护理评价应包括哪些步骤？","c":"护理程序","sc":5,"at":"参考答案（要点）：①收集资料，将服务对象反应与护理目标进行比较；②判断目标实现程度（完全实现、部分实现、未实现）；③分析未实现的原因；④修订、调整护理计划。","e":""},{"i":"2022_10_short_44","t":"short","s":"简述针对丧亲者护理工作的主要内容。","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案（要点）：①鼓励丧亲者宣泄情感、表达悲哀；②陪伴、倾听，给予心理支持；③协助解决实际生活困难；④引导丧亲者适应新生活、建立新的人际关系；⑤必要时随访、防止出现复杂悲哀。","e":""},{"i":"2022_10_short_45","t":"short","s":"简述脑死亡的标准。","c":"临终关怀","sc":5,"at":"参考答案（要点）：①无感受性及反应性；②无运动、无呼吸；③无反射；④脑电波平坦。上述标准24小时内反复复查无改变，并排除体温过低及中枢神经抑制剂的影响，即可作出脑死亡诊断。","e":""},{"i":"2022_10_case_47","t":"case","s":"患者李某，45岁，3日前因“肺感染”入院，当询问值班护士疾病相关知识时，护士因工作忙简单回答后即要离开，李某因不满与护士发生争执。问题1：试分析此案例中护患冲突的主要原因。问题2：试述预防和解决此种护患冲突的方法。","c":"护患关系与人际沟通","sc":10,"at":"参考答案（要点）：(1)护患冲突主要原因：①护士方面：缺乏沟通技巧、工作态度生硬、不能满足病人对疾病信息的知情需要、未尊重病人的知情权与自尊；②病人方面：因患病焦虑、对医护期望高，情绪易激动；③属理解分歧与责任/权益方面冲突。(2)预防与解决方法：①护士加强沟通技巧训练，耐心倾听、解答病人疑问；②尊重病人的知情权与自尊，主动提供健康信息；③控制情绪、换位思考，避免与病人争执；④发生冲突时及时冷静处理、向上级报告；⑤改善服务态度、加强医德教育。","e":""}]},{"key":"2023_4","name":"2023年4月","qs":[{"i":"2023_4_single_4","t":"single","s":"下列属于护理诊断相关因素的是","c":"护理程序","sc":1,"o":{"A":"疼痛","B":"便秘","C":"活动无耐力","D":"饮食习惯不良"},"a":"D","e":"疼痛、便秘、活动无耐力属于护理诊断名称,饮食习惯不良是引起健康问题的相关因素。"},{"i":"2023_4_single_5","t":"single","s":"「母乳喂养有效」属于","c":"护理程序","sc":1,"o":{"A":"现存的护理诊断","B":"潜在的护理诊断","C":"健康的护理诊断","D":"综合的护理诊断"},"a":"C","e":"健康的护理诊断是对个体、家庭或社区具有加强健康以达到更高水平健康潜能的判断,如「母乳喂养有效」。"},{"i":"2023_4_single_7","t":"single","s":"关于罗伊适应理论描述正确的是","c":"护理专业理论及模式","sc":1,"o":{"A":"护理可以帮助人减少压力源,扭转压力对人造成的影响","B":"护理可以帮助人们控制或适应刺激","C":"护理可以预防及治疗人的自理缺陷","D":"护理服务是由三级预防保健组成的"},"a":"B","e":"罗伊认为护理是帮助人控制或适应刺激以达到良好适应状态的科学;C为奥瑞姆,D为纽曼。"},{"i":"2023_4_single_8","t":"single","s":"规律的休息和睡眠属于机体防御结构的","c":"护理专业理论及模式","sc":1,"o":{"A":"正常防御线","B":"基本结构","C":"抵抗线","D":"应变防御线"},"a":"D","e":"纽曼模式中应变防御线是处于正常防御线之外的活动性保护性缓冲力量,包括健康生活方式、规律休息睡眠、适量运动等。"},{"i":"2023_4_single_10","t":"single","s":"悲哀在情感方面的反应,可表现为","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"痛苦、愤怒、焦虑","B":"头疼、失眠","C":"心不在焉、健忘","D":"睹物思情、行为怪异"},"a":"A","e":"情感方面表现为极度痛苦、愤怒、内疚、焦虑、孤独等;B属生理反应,C属认知反应,D属行为反应。"},{"i":"2023_4_single_12","t":"single","s":"在初级卫生保健原则中最难贯彻的是","c":"健康与疾病","sc":1,"o":{"A":"公平","B":"可近性","C":"自我决策","D":"文化感受性"},"a":"C","e":"教材明确指出在所有初级卫生保健原则中,自我决策原则是最难贯彻的。"},{"i":"2023_4_single_13","t":"single","s":"抢救病历据实补记的时限必须是在抢救结束的","c":"护理伦理与法律","sc":1,"o":{"A":"6小时内","B":"12小时内","C":"24小时内","D":"36小时内"},"a":"A","e":"因抢救急危病人未能及时书写病历的,应在抢救结束后6小时内据实补记并加以说明。"},{"i":"2023_4_single_14","t":"single","s":"满足病人自尊的需要,最恰当的方法是","c":"护理相关理论及模式","sc":1,"o":{"A":"入院指导","B":"提供良好的住院环境","C":"关心、重视病人的特性及个人习惯","D":"精湛的护理技术"},"a":"C","e":"满足尊重需要要求使用礼貌称呼、重视听取病人意见、尊重其个人习惯和宗教信仰。"},{"i":"2023_4_single_15","t":"single","s":"由于战争带来的伤残与死亡,属于健康影响因素中的","c":"健康与疾病","sc":1,"o":{"A":"生物因素","B":"心理因素","C":"文化因素","D":"社会环境因素"},"a":"D","e":"战争属社会环境因素,通过社会、政治、经济条件影响人群健康。"},{"i":"2023_4_single_17","t":"single","s":"护士对一位病人说:「你得病是事实,焦虑会影响疾病康复,我要是你,现在会积极配合医生治病。」此护士的沟通错误类型是","c":"护患关系与人际沟通","sc":1,"o":{"A":"突然改变话题","B":"主观说教","C":"言行不一","D":"过早的做出结论"},"a":"B","e":"以「如果是我」的方式对病人进行评判、说教,使病人难以表达真实情感,属主观判断或说教。"},{"i":"2023_4_single_19","t":"single","s":"病人术前需了解手术的有关注意事项,这种需求属于","c":"护理相关理论及模式","sc":1,"o":{"A":"安全的需要","B":"生理的需要","C":"自尊的需要","D":"刺激的需要"},"a":"A","e":"提供恰当的疾病及诊疗信息、耐心解答疑虑,以获得安全感,属安全的需要。"},{"i":"2023_4_single_20","t":"single","s":"世界观和文化社会结构层属于日出模式的","c":"文化和护理","sc":1,"o":{"A":"Ⅰ级","B":"Ⅱ级","C":"Ⅲ级","D":"Ⅳ级"},"a":"A","e":"莱宁格日出模式Ⅰ级(最外层)为世界观和文化社会结构层。"},{"i":"2023_4_multi_22","t":"multi","s":"文化休克意识期的表现有","c":"文化和护理","sc":2,"o":{"A":"渴望了解新环境中的风俗习惯和语言行为","B":"个体原有的文化价值观念与其所处新环境的文化价值观念产生冲突","C":"个体会感到孤独,思念熟悉环境中的亲人","D":"个体出现退缩、发怒和沮丧等表现","E":"个体会采取参加日常生活活动或庆祝活动来修复自我"},"a":"BCD","e":"A属兴奋期(蜜月期),E属转变期;意识期表现为文化冲突、孤独思念、退缩发怒沮丧。"},{"i":"2023_4_multi_23","t":"multi","s":"评判性思维的核心认知技能包括","c":"科学思维方法与临床护理决策","sc":2,"o":{"A":"解释","B":"分析","C":"评估","D":"推论","E":"自我调控"},"a":"ABCDE","e":"评判性思维六大核心认知技能为解释、分析、评估、推论、说明、自我调控。"},{"i":"2023_4_multi_25","t":"multi","s":"脑死亡的标准包括","c":"临终关怀","sc":2,"o":{"A":"没有感受性和反应性","B":"没有运动和呼吸","C":"脑电图平直","D":"没有反射","E":"心跳停止"},"a":"ABCD","e":"哈佛脑死亡标准为无感受性反应、无运动呼吸、无反射、脑电图平直;心跳停止是传统死亡标准,非脑死亡标准。"},{"i":"2023_4_fill_26","t":"fill","s":"护理的概念经过了以疾病为中心、以病人为中心和______三个阶段的演变。","c":"护理学的发展及基本概念","sc":1,"at":"参考答案:以人的健康为中心。","e":""},{"i":"2023_4_fill_27","t":"fill","s":"护理法规的基本内容包括总纲、护理教育、______和护理服务。","c":"护理伦理与法律","sc":1,"at":"参考答案:护士注册。","e":""},{"i":"2023_4_fill_28","t":"fill","s":"初级卫生保健包括疾病预防、______、健康促进及康复服务。","c":"健康与疾病","sc":1,"at":"参考答案:健康维护。","e":""},{"i":"2023_4_fill_29","t":"fill","s":"印象装饰是指有意控制他人对自己______的过程。","c":"护患关系与人际沟通","sc":1,"at":"参考答案:形成各种印象。","e":""},{"i":"2023_4_fill_30","t":"fill","s":"医疗事故的解决方式包括______、卫生行政部门处理和法院诉讼。","c":"护理伦理与法律","sc":1,"at":"参考答案:协商处理。","e":""},{"i":"2023_4_fill_31","t":"fill","s":"评判性思维的组成主要包括智力因素、______和情感态度因素。","c":"科学思维方法与临床护理决策","sc":1,"at":"参考答案:认知技能因素。","e":""},{"i":"2023_4_fill_32","t":"fill","s":"奥瑞姆自理理论由自理学说、______及护理系统学说组成。","c":"护理专业理论及模式","sc":1,"at":"参考答案:自理缺陷学说。","e":""},{"i":"2023_4_fill_33","t":"fill","s":"知信行模式将人们的行为改变分为获取知识、______和形成行为三个连续过程。","c":"健康教育","sc":1,"at":"参考答案:产生信念(形成信念)。","e":""},{"i":"2023_4_fill_34","t":"fill","s":"在现实生活中丧失的最主要表现形式是______。","c":"希望、失望与丧失、悲哀","sc":1,"at":"参考答案:临终与死亡。","e":""},{"i":"2023_4_fill_35","t":"fill","s":"尸斑通常在死后______小时出现。","c":"临终关怀","sc":1,"at":"参考答案:2~4(小时)。","e":""},{"i":"2023_4_term_36","t":"term","s":"护理者","c":"护理学的发展及基本概念","sc":3,"at":"参考答案(要点):护理者(caregiver)是专业护理人员最基本的角色,指护理人员用专业知识和技能,全面满足服务对象生理、心理、社会文化及精神方面的需要,帮助其保持和恢复健康、促进健康的角色。","e":""},{"i":"2023_4_term_39","t":"term","s":"文化关怀保存","c":"文化和护理","sc":3,"at":"参考答案(要点):文化关怀保存(culture care preservation/maintenance)是莱宁格跨文化护理方法之一,指通过帮助性、支持性和促进性的专业文化行为或决策,帮助服务对象维持其与健康不相冲突、有利于健康的文化价值观和生活方式。","e":""},{"i":"2023_4_term_40","t":"term","s":"首因效应","c":"护患关系与人际沟通","sc":3,"at":"参考答案(要点):首因效应(primary effect)又称第一印象,指交往双方初次见面时彼此形成的印象,这种最初获得的信息对后继认知有强烈影响;在与陌生人交往中作用尤为重要。","e":""},{"i":"2023_4_short_41","t":"short","s":"根据护理理论的着重点不同,可将护理理论分为哪些类型?","c":"护理专业理论及模式","sc":5,"at":"参考答案(要点):按护理理论的着重点不同可分为4类:①以需要及问题为中心的理论(以护理程序为中心,代表如南丁格尔、Henderson、Orem等);②以护患关系为中心的理论(以沟通交流技巧为中心,代表如Peplau、Orlando等);③以系统为中心的理论(认为人是开放系统,代表如Roy、Neuman、Johnson等);④以能量源为中心的理论(认为人是能量系统,代表如Rogers、Parse等)。","e":""},{"i":"2023_4_short_42","t":"short","s":"简要介绍健康信念模式。","c":"健康教育","sc":5,"at":"参考答案(要点):健康信念模式(HBM)1958年由霍克巴姆提出、后经贝克等完善,是解释个人信念如何影响健康行为改变最常用的模式。认为个体是否采取健康行为取决于:①对疾病易感性和严重程度的认知;②对采取健康行为获益及障碍的认知;③自我效能(对自己能成功采取行为的信心)。模式由三部分组成:个人认知(健康信念)、修正因素(人口学、社会心理、疾病相关因素)、行为提示因素(行动线索)。","e":""},{"i":"2023_4_short_43","t":"short","s":"恩格尔的悲哀三阶段学说主要包括哪些内容?","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案(要点):恩格尔(Engel)1964年提出悲哀三阶段学说:①震惊与猜疑阶段:对丧失事件感到震惊、无法接受,认为「不可能、一定弄错了」,内心忐忑、四处求证;②逐步认知阶段:逐步恢复对丧失事件的认知、开始接受事实,但内心痛苦、悲哀、气愤,情绪不稳、时哭时怒,可自责或迁怒他人;③修复重建阶段:逐步以理智面对丧失,以社会接受的方式表达悲哀(如参加葬礼、悼念活动),追忆往事、寄托哀思,内心逐渐恢复平静。","e":""},{"i":"2023_4_short_45","t":"short","s":"简述医疗事故的分类及等级。","c":"护理伦理与法律","sc":5,"at":"参考答案(要点):医疗事故根据对病人人身造成的损害程度分为四级:①一级医疗事故:造成病人死亡、重度残疾(分甲、乙两等);②二级医疗事故:造成病人中度残疾、器官组织损伤导致严重功能障碍(分甲、乙、丙、丁四等);③三级医疗事故:造成病人轻度残疾、器官组织损伤导致一般功能障碍(分甲、乙、丙、丁、戊五等);④四级医疗事故:造成病人明显人身损害的其他后果。","e":""},{"i":"2023_4_case_47","t":"case","s":"患者李某,45岁,3日前因「肺感染」入院,当询问值班护士疾病相关知识时,护士因工作繁忙,简单回答后即离开。李某对此不满,并与护士发生争执。\n问题1:试分析此案例中护患冲突的主要原因。\n问题2:试述预防和解决此种护患冲突的方法。","c":"护患关系与人际沟通","sc":10,"at":"参考答案(要点):\n问题1:本案例护患冲突的主要原因是:①理解分歧/沟通不足:护士回答过简、未充分解答,导致病人对疾病信息理解不一致;②角色不明与责任冲突:护士未充分履行健康教育、解答咨询的职责,病人期望获得疾病相关知识却未被满足;③忽视病人的知情需要:工作繁忙时简单应付,使病人感到不被重视。\n问题2:预防及解决方法:①消除角色不明的影响:明确护士与病人的角色定位及各自权利义务,入院时即说明分工;②自觉维护服务对象合法权益:准确提供疾病、诊疗信息,维护其知情权和参与权;③加强护患沟通及理解:扩大沟通深度广度,把沟通延伸到心理、社会层面,少用专业术语、必要时通俗解释,用重复、小结减少误解,创造平等交流气氛;④发生冲突时护士应冷静、耐心倾听病人诉求,及时致歉并补充解答,避免争执升级,必要时由护士长或上级协调处理。","e":""}]},{"key":"2023_10","name":"2023年10月","qs":[{"i":"2023_10_single_1","t":"single","s":"社区护士为居民开设有关高血压的讲座,此时护士的角色是","c":"护理学的发展及基本概念","sc":1,"o":{"A":"教育者","B":"沟通者","C":"护理者","D":"促进康复者"},"a":"A","e":"开设健康讲座、向居民传授疾病防治知识,体现了教育者及咨询者角色。"},{"i":"2023_10_single_2","t":"single","s":"因过度悲哀引起的失眠、血压升高,属于影响健康因素中的","c":"健康与疾病","sc":1,"o":{"A":"生物因素","B":"物理因素","C":"心理因素","D":"社会因素"},"a":"C","e":"悲哀等情绪通过心理过程影响神经、内分泌和免疫功能,属于心理因素。"},{"i":"2023_10_single_3","t":"single","s":"一位急性肾炎病人痊愈后仍不愿出院,可能出现的角色适应问题是","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病人角色行为冲突","D":"病人角色行为缺如"},"a":"B","e":"痊愈后仍安于病人角色、退缩依赖、害怕出院,是病人角色行为强化,多见于恢复期。"},{"i":"2023_10_single_4","t":"single","s":"正在读高三的患者因担心住院影响期末考试成绩而不思茶饭,护士鼓励她病情好转后,接受治疗的同时在病房复习功课,这是考虑到了其","c":"护理相关理论及模式","sc":1,"o":{"A":"生理的需要","B":"爱与归属的需要","C":"自尊需要","D":"自我实现的需要"},"a":"D","e":"担心住院影响学习、不能实现自己的理想,属于自我实现需要;护士为其继续学习创造条件即满足该需要。"},{"i":"2023_10_single_7","t":"single","s":"关于正性心理距离的解释,正确的是","c":"护患关系与人际沟通","sc":1,"o":{"A":"情感越疏远,心理距离越远","B":"情感越密切,心理距离越远","C":"情感越密切,心理距离越近","D":"情感越疏远,心理距离越近"},"a":"C","e":"教材明确指出:情感越密切,心理距离越近,称为正性心理距离。"},{"i":"2023_10_single_8","t":"single","s":"护理人员严格按照操作规范进行工作,属于评判性思维的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"基础层次","B":"复杂层次","C":"简单层次","D":"尽职层次"},"a":"A","e":"基础层次建立在一系列规则之上,严格遵循操作规范手册、不能调整步骤,是推理能力发展早期。"},{"i":"2023_10_single_9","t":"single","s":"在促进人际沟通向纵深发展的技巧中,被称为沟通润滑剂的是","c":"护患关系与人际沟通","sc":1,"o":{"A":"沉默","B":"接纳不同价值观","C":"触摸","D":"幽默"},"a":"D","e":"幽默是人际间沟通的润滑剂,能缓解紧张、打破僵局。"},{"i":"2023_10_single_10","t":"single","s":"在对学生进行护患沟通技巧训练时,最好的方法是","c":"健康教育","sc":1,"o":{"A":"视听教学法","B":"团体讨论法","C":"专题讲座法","D":"角色扮演法"},"a":"D","e":"角色扮演法通过行为模仿或替代影响心理过程,使学生在扮演和观察体验中设身处地学习沟通技巧,最适于沟通技能训练。"},{"i":"2023_10_single_11","t":"single","s":"护理关怀决策和行为层属于日出模式的","c":"文化和护理","sc":1,"o":{"A":"Ⅰ级","B":"Ⅱ级","C":"Ⅲ级","D":"Ⅳ级"},"a":"D","e":"莱宁格日出模式Ⅳ级为护理关怀决策和行为层,通过文化关怀保存、调适、重建展开。"},{"i":"2023_10_single_12","t":"single","s":"文化休克引起焦虑的认知表现为","c":"文化和护理","sc":1,"o":{"A":"思想不集中,对周围环境缺乏注意","B":"过度兴奋,容易激动,自责和谴责他人","C":"情绪低落,感情淡漠","D":"尿频、心率增加、血压升高"},"a":"A","e":"焦虑的认知表现为心神不定、注意力不集中、健忘、思维中断;B为情感表现,D为生理表现。"},{"i":"2023_10_single_13","t":"single","s":"下列关于文化特征的描述,正确的是","c":"文化和护理","sc":1,"o":{"A":"文化的第一要素就在于它对自然界的描述","B":"文化不是对个人的描述,仅仅体现出个人特征的现象不属于文化现象","C":"文化在某一特定的地域发生、发展和成熟,不能被其他地域所接受、吸收和同化","D":"儒家思想成为中华民族的道德意识、精神生活和传统习惯的准则,体现了文化的超个人性"},"a":"B","e":"文化具有超个人性,体现群体本质而非个人;A错(文化第一要素是人化),C错(文化有超地域性),D错(儒家思想体现超时代性而非超个人性)。"},{"i":"2023_10_single_14","t":"single","s":"当患者获知患有骨癌将要被截肢时,所体验的悲哀是","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"习俗性悲哀","B":"预感性悲哀","C":"暂时性悲哀","D":"感知性悲哀"},"a":"B","e":"在真正失去(截肢)之前就感到的丧失属预期性(预感性)悲哀。"},{"i":"2023_10_single_15","t":"single","s":"下列护理诊断的陈述,正确的是","c":"护理程序","sc":1,"o":{"A":"皮肤完整性受损:与护理人员未及时翻身有关","B":"社交障碍:与缺乏道德有关","C":"有受伤的危险:与护理人员未加床档有关","D":"便秘:与活动少、肠蠕动减慢有关"},"a":"D","e":"护理诊断相关因素应是引起健康问题的生理、心理、治疗、情景、年龄等因素,不能把责任归咎于护士或用道德判断;D正确。"},{"i":"2023_10_single_17","t":"single","s":"皮亚杰把人的智力发育分为4个阶段,其中10~12岁儿童处于","c":"护理相关理论及模式","sc":1,"o":{"A":"感觉运动期","B":"前运思期","C":"具体运思期","D":"形式运思期"},"a":"D","e":"形式运思期为10~12岁以后,从具体思维转向抽象思维。"},{"i":"2023_10_single_18","t":"single","s":"张先生因冠心病住院治疗,护士小张对其评估后按部分补偿系统原则进行护理,护士运用的理论是","c":"护理专业理论及模式","sc":1,"o":{"A":"适应理论","B":"保健系统理论","C":"临床护理模式","D":"自理理论"},"a":"D","e":"奥瑞姆自理理论提出完全补偿、部分补偿、支持教育三个护理系统;部分补偿系统是其重要内容。"},{"i":"2023_10_single_19","t":"single","s":"丧失对个体的影响取决于","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"丧失的可弥补性","B":"过去成功的经历","C":"情感表达方式","D":"实现目标的途径"},"a":"A","e":"丧失对个体影响大小取决于所丧失人/物的亲密程度与意义、丧失的可弥补性、对生活工作的影响、社会支持系统等。"},{"i":"2023_10_multi_21","t":"multi","s":"弗洛伊德认为,人格的整体包括","c":"护理相关理论及模式","sc":2,"o":{"A":"本我","B":"潜意识","C":"自我","D":"超我","E":"前意识"},"a":"ACD","e":"弗洛伊德人格结构由本我、自我、超我三部分组成;潜意识、前意识属于意识层次。"},{"i":"2023_10_multi_23","t":"multi","s":"护理程序的特点包括","c":"护理程序","sc":2,"o":{"A":"以护理对象为中心","B":"有特定的目标","C":"使用范围广泛","D":"有理论依据","E":"以疾病为中心"},"a":"ABCD","e":"护理程序以护理对象为中心、有特定目标、使用范围广泛、有理论基础、是动态循环过程;以疾病为中心是其对立面。"},{"i":"2023_10_multi_24","t":"multi","s":"临终关怀的基本原则包括","c":"临终关怀","sc":2,"o":{"A":"全面治疗原则","B":"全方位照护原则","C":"舒缓照护为主的原则","D":"延长生存时间原则","E":"人道主义原则"},"a":"BCE","e":"临终关怀原则包括舒缓照护为主、适度治疗、全方位照护、人道主义;不以延长生存时间为主,也非全面治疗。"},{"i":"2023_10_multi_25","t":"multi","s":"职业道德的基本要素包括","c":"护理伦理与法律","sc":2,"o":{"A":"职业理想","B":"职业态度","C":"职业责任","D":"职业纪律","E":"职业荣誉"},"a":"ABCDE","e":"职业道德基本要素包括职业理想、职业态度、职业责任、职业纪律、职业良心、职业荣誉、职业作风等。"},{"i":"2023_10_fill_26","t":"fill","s":"道德健康要求每个社会成员不仅要为自己的健康承担责任,而且也要对______的健康承担社会公德。","c":"健康与疾病","sc":1,"at":"参考答案:社会群体(他人)。","e":""},{"i":"2023_10_fill_27","t":"fill","s":"美国健康教育学家格林认为,健康促进是指一切能促使行为和______向有益于健康方向改变的教育与环境支持的综合体。","c":"健康教育","sc":1,"at":"参考答案:生活条件。","e":""},{"i":"2023_10_fill_28","t":"fill","s":"公众距离是一种大众性的沟通方式,一般距离为______m以上。","c":"护患关系与人际沟通","sc":1,"at":"参考答案:3.7(米)。","e":""},{"i":"2023_10_fill_29","t":"fill","s":"护理诊断可分为现存的、潜在的、______和综合的护理诊断。","c":"护理程序","sc":1,"at":"参考答案:健康的。","e":""},{"i":"2023_10_fill_30","t":"fill","s":"罗伊将刺激分为主要刺激、______和固有刺激。","c":"护理专业理论及模式","sc":1,"at":"参考答案:相关刺激。","e":""},{"i":"2023_10_fill_31","t":"fill","s":"健康教育程序包括健康教育评估、健康教育计划、______和健康教育评价四个步骤。","c":"健康教育","sc":1,"at":"参考答案:健康教育干预(实施)。","e":""},{"i":"2023_10_fill_32","t":"fill","s":"适用于5人以上、15人以下的多种内容的健康教育方法是______。","c":"健康教育","sc":1,"at":"参考答案:讨论法(小组讨论法)。","e":""},{"i":"2023_10_fill_33","t":"fill","s":"护理道德的基本原则是无害、______、尊重和公正。","c":"护理伦理与法律","sc":1,"at":"参考答案:有利。","e":""},{"i":"2023_10_fill_34","t":"fill","s":"临床死亡期一般持续______分钟,超过这个时间,大脑将发生不可逆的变化。","c":"临终关怀","sc":1,"at":"参考答案:5~6(分钟)。","e":""},{"i":"2023_10_term_38","t":"term","s":"护理理念","c":"护理专业理论及模式","sc":3,"at":"参考答案(要点):护理理念是引导护理人员认识及判断护理及其他相关方面的价值观及信念。它将人、健康、环境、护理四个基本概念作为专业理念体系进行研究,用以指导护理研究、教育、实践及管理。","e":""},{"i":"2023_10_short_41","t":"short","s":"简述预防及解决护患冲突的方法。","c":"护患关系与人际沟通","sc":5,"at":"参考答案(要点):①消除角色不明的影响:明确双方角色定位及权利义务,使角色期望一致;②消除责任冲突的影响:共同协商明确健康问题及各自责任,通过健康教育唤醒病人健康责任感;③自觉维护服务对象合法权益:准确提供信息,维护其知情权和参与权;④加强护患沟通及理解:扩大沟通深度广度,少用专业术语,用重复、小结减少误解,创造平等交流气氛。","e":""},{"i":"2023_10_short_42","t":"short","s":"简述文化休克的预防。","c":"文化和护理","sc":5,"at":"参考答案(要点):①认知方面:通过专门学习和系统训练提高跨文化沟通能力,进入新环境前充分了解当地风俗习惯、地理环境和人文知识,以开放心态接受新文化;②感情方面:保持乐观情绪、培养应对能力,主动结交新环境中的人们,缓解孤独焦虑;③沟通方面:主动学习当地语言和非语言沟通方式,积极与当地人交往,减少文化冲突。","e":""},{"i":"2023_10_short_43","t":"short","s":"简述循证护理证据的分级。","c":"科学思维方法与临床护理决策","sc":5,"at":"参考答案(要点):按科学性和可靠程度由强到弱分为五级:Ⅰ级——强有力证据,来自设计严谨的随机对照试验(RCT)的系统评价或大样本RCT/荟萃分析;Ⅱ级——来自适当样本量、合理设计的RCT或高质量队列、病例对照研究;Ⅲ级——来自设计良好但非随机的研究或前后对照实验;Ⅳ级——来自多中心或研究小组设计的非实验性研究(系列病例分析等);Ⅴ级——专家个人意见、个例报告。","e":""},{"i":"2023_10_short_45","t":"short","s":"护理人员如何应用希望与失望学说激发病人生活的信心和希望?","c":"希望、失望与丧失、悲哀","sc":5,"at":"参考答案(要点):①强化依恋情结,重视建立支持性人际关系:帮助病人建立与家人、朋友、同事的亲密依恋关系,调动社会支持系统;②帮助病人在逆境中成长:探索其内心世界,帮助其明白人有独特潜能,学会在逆境中生存;③增强病人及家属的应对能力:教会保健知识和自我护理技能,调动应对资源,避免无助无望感;④重新制定可行的生活目标:根据病情协助制定现实可行的健康或生活目标,随时反馈进展;⑤努力充实自我、丰富精神生活:帮助树立正确人生观,借助文学、音乐等吸收精神食粮,战胜自我、超越自我。","e":""},{"i":"2023_10_essay_46","t":"essay","s":"试述评判性思维在护理管理中的应用。","c":"科学思维方法与临床护理决策","sc":10,"at":"参考答案(要点):①评判性思维的构成:由智力因素、认知技能因素(解释、分析、评估、推论、说明、自我调控)和情感态度因素三部分组成;②在护理管理决策中的应用:护理管理者面对复杂管理问题时,运用评判性思维对收集到的资料进行分析、评估和推论,不盲从经验和权威,能从多种备选方案中权衡利弊、科学决策;③在护理质量管理中的应用:运用评判性思维对护理缺陷、差错进行根因分析,识别系统性问题,而不是简单归咎于个人;④在护理风险管理中的应用:对潜在风险进行预测性评估,质疑常规流程的合理性,发现隐患及时改进;⑤在临床护理带教与科研中的应用:鼓励护士质疑现有实践、开展循证护理,培养独立思考和自我调控能力;⑥要求管理者具备自信负责、诚实公正、好奇执著、谦虚谨慎、独立思考有创造性的情感态度,并在专业信念指导下承担决策责任。","e":""},{"i":"2023_10_case_47","t":"case","s":"患者对护士说:「我的B超结果出来了,胰腺好像长了一个东西,我真的有些担心。」护士回答说:「噢,原来如此!好吧,你准备一下,我马上帮你输液。」请问护士在与患者沟通中存在什么问题?常用的护患沟通技巧有哪些?","c":"护患关系与人际沟通","sc":10,"at":"参考答案(要点):\n存在问题:①护士没有倾听和回应病人的情感表达,病人表达担心时被忽视;②突然改变话题,从病人担忧的病情直接跳到输液操作,阻断了病人宣泄情绪和表达困惑;③使用「噢,原来如此」这类敷衍、虚假的保证,没有真正理解病人;④未运用移情、核实、澄清等技巧,使病人感到不被理解。\n常用护患沟通技巧:①倾听:专心听病人叙述,注意非语言信息;②移情(同理心):设身处地理解病人感受;③核实(澄清、复述):用复述、澄清确认信息;④沉默:给病人思考和宣泄时间;④开放式提问:鼓励病人表达;⑤自我暴露:适度分享相关经验;⑥触摸:在适当时机传递关怀;⑦幽默:缓解紧张;⑧接纳不同价值观:不随意评判;⑨恰当使用语言,少用专业术语,配合非语言沟通(眼神、表情、语调)。","e":""}]},{"key":"2024_4","name":"2024年4月","qs":[{"i":"2024_4_single_1","t":"single","s":"指导妇女自检乳房从而早期发现乳腺癌,属于","c":"健康与疾病","sc":1,"o":{"A":"一级预防","B":"二级预防","C":"三级预防","D":"四级预防"},"a":"B","e":"二级预防又称临床前期预防,关键是早期发现、早期诊断和早期处理健康问题;自检乳房以早期发现乳腺癌属早发现,为二级预防。"},{"i":"2024_4_single_3","t":"single","s":"从个别或特殊的知识中概括出一般性知识的方法属于科学思维中的","c":"科学思维方法与临床护理决策","sc":1,"o":{"A":"观察法","B":"归纳法","C":"演绎法","D":"综合法"},"a":"B","e":"归纳法是从个别或特殊知识中概括出一般性知识的逻辑方法;演绎法则是从一般原理推导出个别结论。"},{"i":"2024_4_single_4","t":"single","s":"护士管理病人的住院环境属于护理功能中的","c":"护理学的发展及基本概念","sc":1,"o":{"A":"依赖性护理功能","B":"协作性护理功能","C":"独立性护理功能","D":"授权性护理功能"},"a":"C","e":"管理住院环境、增进服务对象舒适等护理措施是护士应用专业知识自主决定并实施的,属独立性护理功能。"},{"i":"2024_4_single_6","t":"single","s":"下列关于护理目标的陈述正确的是","c":"护理程序","sc":1,"o":{"A":"一个预期目标可针对多个护理诊断","B":"目标的主语应该是护理人员","C":"目标应陈述清楚护理人员所采取的措施","D":"目标是护理效果评价的标准"},"a":"D","e":"计划阶段确定的预期目标可作为护理效果评价的标准;一个目标只针对一个护理诊断,目标主语应是服务对象而非护士,陈述措施属护理措施部分。"},{"i":"2024_4_single_8","t":"single","s":"根据护理理论的着重点不同,罗依(Roy)适应理论属于","c":"护理专业理论及模式","sc":1,"o":{"A":"以需要及问题为中心的护理理论","B":"以护患关系为中心的护理理论","C":"以系统为中心的护理理论","D":"以能量源为中心的护理理论"},"a":"C","e":"罗伊适应理论认为人是开放系统,属以系统为中心的护理理论。"},{"i":"2024_4_single_9","t":"single","s":"对于昏迷病人,护士应采取的护患关系模式是","c":"护患关系与人际沟通","sc":1,"o":{"A":"主动-被动型","B":"指导-合作型","C":"共同参与型","D":"服务-指导型"},"a":"A","e":"主动-被动型适用于昏迷、休克、全麻、严重创伤及精神病等无自主意识的服务对象。"},{"i":"2024_4_single_10","t":"single","s":"个体期望能吃饱穿暖,属于希望分级中的","c":"希望、失望与丧失、悲哀","sc":1,"o":{"A":"一级水平","B":"二级水平","C":"三级水平","D":"四级水平"},"a":"A","e":"希望一级水平是最低层次的愿望,如人们希望能吃饱穿暖、顺利度过每一天。"},{"i":"2024_4_single_11","t":"single","s":"\"母乳喂养有效\"属于","c":"护理程序","sc":1,"o":{"A":"现存的护理诊断","B":"潜在的护理诊断","C":"综合的护理诊断","D":"健康的护理诊断"},"a":"D","e":"\"母乳喂养有效\"是对个体、家庭或社区具有加强健康以达到更高水平健康潜能的判断,属健康的护理诊断。"},{"i":"2024_4_single_12","t":"single","s":"A型性格病人生病后容易出现的角色适应问题是","c":"健康与疾病","sc":1,"o":{"A":"病人角色行为异常","B":"病人角色行为强化","C":"病
