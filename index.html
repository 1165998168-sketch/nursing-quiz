造成；②主要责任：损害后果主要由医疗过失行为造成，其他因素起次要作用；③次要责任：损害后果主要由其他因素造成，医疗过失行为起次要作用；④轻微责任：损害后果绝大部分由其他因素造成，医疗过失行为起轻微作用。","e":""},{"i":"2020_10_short_36","t":"short","s":"简述护理教学查房的主要形式。","c":"护理临床教学管理","sc":5,"at":"参考答案（要点）：按组织者不同：①由教学组长或带教老师组织的教学查房；②由科护士长或护士长组织的教学查房；③由护理部组织的教学查房。按组织方式不同：④预告式教学查房（事先通知、充分准备，临床最常采用）；⑤随机式教学查房（以临时遇到的有教学意义的个案边查边问边讲）。","e":""},{"i":"2020_10_short_37","t":"short","s":"简述家庭护理管理的内容。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①基础护理技术管理：生命体征测量、患者清洁护理、各种注射穿刺技术、家庭档案记录与管理等；②专科护理技术管理：各系统疾病护理技术、常用家庭消毒隔离技术等；③健康教育与指导管理：患者健康认识、家庭成员照护责任、患者自我护理知识及卫生膳食指导等；④协调与咨询服务管理：提供与患者有关的资料与医疗、咨询（含心理咨询）服务。","e":""},{"i":"2020_10_essay_38","t":"essay","s":"试述计划在护理管理中的作用。","c":"计划","sc":10,"at":"参考答案（要点）：计划作为护理管理最基本职能，作用有：①为护理组织活动提供方向和目的，有利于组织目标的实现——通过确定组织及各部门、成员的长短期目标，把全体成员行动统一到实现总目标上；②促进护理活动的协调，有利于合理使用资源——成员了解目标和各自贡献后自觉协调、互相协作；③有利于控制工作——计划为控制提供目标、措施、步骤和检查标准，便于对照检查、及时调整；④有利于提高护理工作质量——使各部门工作协调统一、井然有序，帮助护士明确目标、保证患者安全；⑤能弥补情况变化所造成的损失——面向未来预测变化、建立应急预案（如护理应急程序、突发公共卫生事件护理应急方案），将突发情况损失减至最少。","e":""},{"i":"2020_10_essay_39","t":"essay","s":"试述控制的内容。","c":"控制","sc":10,"at":"参考答案（要点）：控制对象（内容）归纳为人员、财务、作业、信息、组织总体绩效五方面。①对人员的控制：护理对象包括各级护理管理者和各层次护理人员及实习进修护士，常用直接巡视和系统化绩效评估；②对财务的控制：主要进行护理预算和护理成本控制；③对作业的控制：护理人员为患者提供各项护理服务的过程，常用护理技术控制、护理质量控制、材料药品购买与库存控制；④对信息的控制：建立护理管理信息系统（护理业务管理、行政管理、科研教学三个信息系统），及时提供充分可靠信息；⑤对组织绩效（组织效率）的控制：科学评估衡量组织绩效，反映组织目标达成情况。","e":""}]},{"key":"2021_4","name":"2021年4月","qs":[{"i":"2021_4_single_1","t":"single","s":"发现企业内部存在非正式组织的理论是","c":"管理理论","sc":1,"o":{"A":"科学管理理论","B":"一般管理理论","C":"行政组织理论","D":"人际关系理论"},"a":"D","e":"梅奥通过霍桑试验提出人际关系理论，指出企业内部存在非正式组织。"},{"i":"2021_4_single_2","t":"single","s":"权变领导理论认为，适宜采取参与式领导方式的员工类型是","c":"领导","sc":1,"o":{"A":"成熟度低","B":"较为不成熟","C":"比较成熟","D":"高度成熟"},"a":"C","e":"情境领导理论第三象限参与式适用于下属比较成熟的情况，采取低任务高关系风格。"},{"i":"2021_4_single_3","t":"single","s":"选择对全局影响大的关键环节进行控制，体现控制的","c":"控制","sc":1,"o":{"A":"目的性原则","B":"客观性原则","C":"重点性原则","D":"灵活性原则"},"a":"C","e":"重点性原则要求选择对全局影响大的重点因素、重点部分或关键环节进行控制。"},{"i":"2021_4_single_5","t":"single","s":"护理部制定各种应急预案并组织演练，属于","c":"控制","sc":1,"o":{"A":"现场控制","B":"前馈控制","C":"反馈控制","D":"事后控制"},"a":"B","e":"前馈控制是在系统运行输入阶段进行的预防性控制，制定应急预案并演练属前馈控制。"},{"i":"2021_4_single_6","t":"single","s":"护理人员边工作边接受指导、教育的学习过程，属于","c":"护理人力资源管理","sc":1,"o":{"A":"脱产培训","B":"半脱产培训","C":"岗前培训","D":"在职培训"},"a":"D","e":"在职培训是指护理人员边工作边接受指导、教育的学习过程。"},{"i":"2021_4_single_7","t":"single","s":"属于护理人员培训准备阶段的内容是","c":"护理人力资源管理","sc":1,"o":{"A":"确立培训目标","B":"选择培训教师","C":"设计培训课程","D":"确定评价标准"},"a":"A","e":"培训准备阶段包括培训需求分析、培训前测试和确立培训目标；选择培训教师、设计培训课程属实施阶段，确定评价标准属评价阶段。"},{"i":"2021_4_single_8","t":"single","s":"符合护理人员绩效评价操作标准化原则的是","c":"护理人力资源管理","sc":1,"o":{"A":"评价的间隔时间相同","B":"使用可衡量的指标作为标准","C":"公布绩效评价指标","D":"考核结果作为晋升依据"},"a":"A","e":"操作标准化原则包括同一岗位同一标准方法、评价间隔时间相同、定期反馈面谈、提供正式评价资料；B属指标客观化，C属标准公开化，D属结果区别化。"},{"i":"2021_4_single_9","t":"single","s":"护理单元的各个环节须围绕医院护理服务的总目标，体现PDCA循环的特点是","c":"护理质量管理","sc":1,"o":{"A":"完整性、统一性、连续性","B":"大环套小环，小环保大环，互相连接，互相促进","C":"不断循环，螺旋上升","D":"实用性"},"a":"B","e":"大环套小环、小环保大环反映了PDCA循环中各级护理环节围绕总目标、相互衔接促进的特点。"},{"i":"2021_4_single_10","t":"single","s":"下列关于护理风险的描述，错误的是","c":"护理质量管理","sc":1,"o":{"A":"护理风险的主体是护理服务对象","B":"护理风险是一种职业风险","C":"护理风险具有一定的发生频率","D":"护理风险的诱发因素包括人为因素和管理因素"},"a":"A","e":"护理安全的主体是护理服务对象（患者），护理风险的主体是护理工作的从业者（护理人员），故A错误。"},{"i":"2021_4_single_11","t":"single","s":"护理质量管理的最终目的是","c":"护理质量管理","sc":1,"o":{"A":"建立质量管理体系","B":"制定护理质量标准","C":"持续改进护理质量","D":"进行质量教育"},"a":"C","e":"持续质量改进是质量管理的灵魂，是护理质量管理的最终目的。"},{"i":"2021_4_single_12","t":"single","s":"被称为\"科学管理之父\"的是","c":"管理理论","sc":1,"o":{"A":"梅奥","B":"泰罗","C":"麦格雷戈","D":"韦伯"},"a":"B","e":"泰罗（泰勒）是科学管理理论的创始人，被称为\"科学管理之父\"。"},{"i":"2021_4_single_14","t":"single","s":"整分合原则的前提是","c":"现代管理的基本原则","sc":1,"o":{"A":"分工","B":"综合","C":"整体","D":"协作"},"a":"C","e":"整分合原则中，整体是前提，分工是关键，综合是保证。"},{"i":"2021_4_single_15","t":"single","s":"对日常护理工作中的好人好事给予及时表扬和奖励，体现管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"能级原则","B":"弹性原则","C":"反馈原则","D":"动力原则"},"a":"D","e":"表扬和奖励属精神动力与物质动力的运用，体现动力原则。"},{"i":"2021_4_single_16","t":"single","s":"依据时间\"四象限\"法，对护理人员进行业务考核属于","c":"计划","sc":1,"o":{"A":"紧急且重要的事务","B":"紧急但不重要的事务","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"C","e":"业务考核、人员培训、制定防范措施等属重要但不紧急的事务，应平时投入关注以避免演变为紧急事务。"},{"i":"2021_4_single_17","t":"single","s":"下列关于计划的描述，正确的是","c":"计划","sc":1,"o":{"A":"是为实现组织目标而对未来的行动做出具体的安排","B":"是通过组织设计、资源配置为决策和计划的有效实施创造条件","C":"是通过权责分配和一定的层次结构所构成的人群集合体","D":"是通过监督和纠偏来实现的"},"a":"A","e":"计划是为实现组织目标而对未来行动做出的具体安排；B、C属组织，D属控制。"},{"i":"2021_4_single_18","t":"single","s":"属于学习型组织的特征是","c":"组织","sc":1,"o":{"A":"组织成员有共同的愿景","B":"组织边界模糊","C":"领袖人物作用大","D":"分工专业化"},"a":"A","e":"学习型组织首要特征是组织成员拥有共同愿景；组织边界模糊属网络组织特征，领袖作用大、分工专业化属传统组织特征。"},{"i":"2021_4_single_19","t":"single","s":"属于卫生事业组织的是","c":"组织","sc":1,"o":{"A":"中华医学会","B":"中国红十字会","C":"卫健委","D":"疾病预防控制中心"},"a":"D","e":"疾病预防控制中心属预防服务提供组织，是卫生事业组织；A、B属群众性卫生组织，C属卫生行政组织。"},{"i":"2021_4_multi_21","t":"multi","s":"下列关于目标的描述，正确的包括","c":"计划","sc":2,"o":{"A":"目标要有重点","B":"目标应具有可测量性","C":"目标应高于执行者工作能力","D":"相互关联的部门之间应制定共同目标","E":"制定目标应考虑各方面关系的协调"},"a":"ABDE","e":"制定目标原则：目标要有重点、要适合执行者工作能力经过努力可完成、应具体可测量、考虑各方面关系协调、相互关联部门制定共同目标。C错误，目标应适合而非高于执行者能力。"},{"i":"2021_4_multi_22","t":"multi","s":"引起组织变革的外部环境因素包括","c":"组织","sc":2,"o":{"A":"组织战略目标的调整","B":"经济体制的改变","C":"社会制度及法律政策状况","D":"人们接受健康教育的程度","E":"信息技术的发展"},"a":"BCDE","e":"外部环境包括经济、政治、文化、科学技术、竞争等；组织战略目标调整属内部环境因素。"},{"i":"2021_4_multi_23","t":"multi","s":"行为控制常见的方式包括","c":"控制","sc":2,"o":{"A":"直接监督","B":"间接监督","C":"目标管理","D":"时间管理","E":"行政控制"},"a":"ACE","e":"行为控制包括直接监督、目标管理和行政控制三种方式。"},{"i":"2021_4_multi_24","t":"multi","s":"关于护理人员职业生涯管理早期阶段的描述，正确的包括","c":"护理人力资源管理","sc":2,"o":{"A":"该阶段发生在从业第1年","B":"职业要求是熟悉业务和积累经验","C":"存在问题是工作绩效不明显和稳定性较低","D":"管理者应引导护士进行自我评估和准确定位","E":"管理者应加强护士管理能力的培养"},"a":"BCD","e":"早期阶段指从业5~10年（22~30岁），A错误；职业要求熟悉业务积累经验、问题为绩效不明显稳定性低、管理策略为引导自我评估准确定位；加强管理能力培养属中期阶段策略。"},{"i":"2021_4_multi_25","t":"multi","s":"下列关于结构因素引起冲突的描述，正确的包括","c":"领导","sc":2,"o":{"A":"团体越大，成员的工作越专门化，产生冲突的可能性越小","B":"团体成员流动性越大，产生冲突的可能性越大","C":"组织中各部门的目标越多，冲突的潜在性就越低","D":"组织内部领导风格苛刻，冲突的潜在可能性越大","E":"过分强调下属的参与，也会引起较多的冲突"},"a":"BDE","e":"团体越大、工作越专门化，冲突可能性越大（A错）；成员流动性大冲突可能性大；各部门目标越多冲突潜在性越高（C错）；领导风格独裁苛刻冲突可能性大；过分强调参与也会引起较多冲突。"},{"i":"2021_4_term_27","t":"term","s":"反馈控制","c":"控制","sc":3,"at":"参考答案（要点）：指在计划完成后进行的评价性控制，也称事后控制；通过指出过去的错误来对历史做出评价，以此指导改进未来工作，但损失已经发生。","e":""},{"i":"2021_4_term_28","t":"term","s":"绩效评价","c":"护理人力资源管理","sc":3,"at":"参考答案（要点）：指组织的上级管理人员对其下属员工在规定时间内所完成的工作任务进行考察评定的过程；是管理者结合被评员工岗位要求和个人特点，对绩效水平达不到组织要求者进行调整、培训、转岗、留聘等的管理活动。","e":""},{"i":"2021_4_term_29","t":"term","s":"护理成本控制","c":"控制","sc":3,"at":"参考答案（要点）：指按照成本控制流程，对护理活动进行财务管理的过程；包括编制护理预算并分配资源、开展护理服务成本核算、进行护理成本-效益分析、开发应用护理管理信息系统进行实时动态监测与控制，利用有限资源提高护理服务质量。","e":""},{"i":"2021_4_short_31","t":"short","s":"简述现代管理的特点。","c":"绪论","sc":5,"at":"参考答案（要点）：①强调人的因素；②强调信息的作用；③强调组织的绩效；④强调系统分析方法；⑤强调组织的预测能力；⑥强调变革和创新。","e":""},{"i":"2021_4_short_32","t":"short","s":"简述管理冲突的先兆表现。","c":"领导","sc":5,"at":"参考答案（要点）：①组织中的人际危机；②各种突发事件的出现；③相互误解和相互指责；④情绪对立和紧张不安。","e":""},{"i":"2021_4_short_34","t":"short","s":"简述组织文化的主要功能。","c":"组织","sc":5,"at":"参考答案（要点）：①目标导向功能；②凝聚功能；③激励功能；④约束功能；⑤自我完善的功能。","e":""},{"i":"2021_4_short_35","t":"short","s":"简述控制的功能。","c":"控制","sc":5,"at":"参考答案（要点）：①限制偏差累积：及时获取偏差信息并采取有效措施纠正，防止小偏差由量变到质变造成严重损害；②适应环境变化：帮助管理者预测和识别内外部环境变化，对机会和威胁做出反应，增强组织适应能力。","e":""},{"i":"2021_4_short_36","t":"short","s":"简述护理人员编配的影响因素。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①工作任务（关键因素）；②人员素质；③工作环境；④管理水平；⑤国家的政策法规；⑥社会因素。","e":""},{"i":"2021_4_short_37","t":"short","s":"简述社区健康教育管理的主要措施。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①普及社区卫生保健服务，使社区护士树立现代护理观，实施\"六位一体\"服务模式；②从社区实际出发，举办多种形式的学习和培训，使护士掌握健康教育系统知识与技能；③增加人员设备，减轻社区护士工作负担，使其有时间进行健康教育；④将健康教育视为社区护士工作职责，建立工作计量法与质量考核指标，使劳动与报酬挂钩；⑤增加对健康教育的投入，重视内容和方法研究，规范健康教育内容。","e":""},{"i":"2021_4_essay_38","t":"essay","s":"试述能级原则在护理管理中的应用。","c":"现代管理的基本原则","sc":10,"at":"参考答案（要点）：能级原则指按层次实行管理，不同能级有不同权力、物质利益和精神荣誉。其在护理管理中的应用包括：①准确全面掌握下属的能力结构和特长，并按其特长安排工作：护理管理者不可简单评价护士能力，应知人善任、用人所长，根据不同岗位（如护理部主任、质量监控成员、急诊抢救室护士）对能力组合的不同要求安排适宜人员；②注重对护士能力的培养：人的能力可通过学习和实践提高，应为护士创造会议交流、学术活动、继续教育等学习机会，并根据不同学历、职称、科室、职位护士的能力缺陷和要求有所区别、有所侧重地培养；③注意能级的动态对应：当护士能力随学习实践提高时，可考虑调换到较高职级岗位；同时注意优秀护士未必能胜任更高管理岗位，必要时应向下调整到相应级别，并考虑体力精力变化对能力发挥的影响，使能级动态保持一致。","e":""},{"i":"2021_4_essay_39","t":"essay","s":"试述患者十大安全目标的内容。","c":"护理质量管理","sc":10,"at":"参考答案（要点）：①严格执行查对制度，提高医务人员对患者身份识别的准确性（至少同时使用两种识别方法，推广腕带识别）；②提高用药安全（高危药品单独存放、严格核对程序、注意配伍禁忌、观察不良反应）；③建立与完善在特殊情况下医务人员之间的有效沟通，做到正确执行医嘱（危重抢救时口头医嘱须复述并双重检查事后记录）；④建立临床实验室\"危急值\"报告制度；⑤严格防止手术患者手术部位及术式发生错误（术前标示、交接查核、麻醉手术前\"暂停\"确认）；⑥严格执行手部卫生，符合医院感染控制的基本要求；⑦防范与减少患者跌倒事件的发生；⑧防范与减少压疮发生；⑨鼓励主动报告医疗安全（不良）事件；⑩鼓励患者参与医疗安全。","e":""}]},{"key":"2021_10","name":"2021年10月","qs":[{"i":"2021_10_single_1","t":"single","s":"管理者将上级意图传递给部属，以保证下级掌握必要的信息，所扮演的角色是","c":"绪论","sc":1,"o":{"A":"人际角色","B":"信息角色","C":"决策角色","D":"协调角色"},"a":"B","e":"传播者（把获取的信息传递给组织成员）属信息角色。"},{"i":"2021_10_single_2","t":"single","s":"根据权变领导理论，对新护士最适宜采取的领导方式是","c":"领导","sc":1,"o":{"A":"参与式","B":"说服式","C":"命令式","D":"授权式"},"a":"C","e":"新护士成熟度低，第一象限命令式（高任务低关系）适用。"},{"i":"2021_10_single_3","t":"single","s":"下列属于护理人力资源规划内容的是","c":"护理人力资源管理","sc":1,"o":{"A":"制定满足未来护理人力资源需要的行动方案","B":"将护理人员分配到具体的岗位","C":"吸引和挑选人才到护理组织","D":"引导护士正确认识自我，正视专业，发挥潜能"},"a":"A","e":"人力资源规划包括评价现有、预估未来需要、制定满足未来需要的行动方案；B属使用，C属招聘，D属职业生涯规划。"},{"i":"2021_10_single_4","t":"single","s":"检查工作是否按计划进行的过程，体现了管理的","c":"控制","sc":1,"o":{"A":"控制职能","B":"计划职能","C":"组织职能","D":"领导职能"},"a":"A","e":"控制是监督、检查工作是否按计划进行并纠正偏差的过程。"},{"i":"2021_10_single_5","t":"single","s":"选择控制的关键点，属于控制过程中的","c":"控制","sc":1,"o":{"A":"确立标准","B":"衡量工作绩效","C":"评价偏差","D":"采取纠正措施"},"a":"A","e":"确立标准包括确定控制对象和选择控制的关键点。"},{"i":"2021_10_single_6","t":"single","s":"分析护理差错事故的原因，属于","c":"控制","sc":1,"o":{"A":"现场控制","B":"前馈控制","C":"反馈控制","D":"预防控制"},"a":"C","e":"反馈控制是在计划完成后进行的评价性控制，通过指出过去错误指导改进未来工作。"},{"i":"2021_10_single_7","t":"single","s":"培养护士观察问题、分析问题和解决问题的能力，最好的培训方法是","c":"护理人力资源管理","sc":1,"o":{"A":"讲授法","B":"演示法","C":"研讨会","D":"案例分析法"},"a":"D","e":"案例分析法通过对实际病例的分析讨论，培养观察、分析和解决问题的能力。"},{"i":"2021_10_single_8","t":"single","s":"采用下属评价的方法对护士长进行考核时，需注意的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"考核前评价者应接受必要的培训","B":"护士应具有较高的成熟度","C":"应对评价者的姓名保密","D":"应了解彼此的业绩"},"a":"C","e":"使用下属评价需对评价者姓名保密，以获得真实评价并保护评价者。"},{"i":"2021_10_single_10","t":"single","s":"由于护理人员配置不足引起的护理风险，其诱发因素是","c":"护理质量管理","sc":1,"o":{"A":"人员素质因素","B":"技术因素","C":"环境因素","D":"管理因素"},"a":"D","e":"管理因素包括制度不健全、监控不严、护理人员配置严重不足或配置不合理等。"},{"i":"2021_10_single_11","t":"single","s":"组织护理人员进行风险预案的演练，这种方法属于","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险评估","C":"风险控制","D":"风险监测"},"a":"C","e":"风险控制手段包括制定护理规章制度、护理风险防范预案并进行演练。"},{"i":"2021_10_single_12","t":"single","s":"\"过犹不及\"体现的管理理念是","c":"管理理念","sc":1,"o":{"A":"对立统一观","B":"发展观","C":"度和量变质变观","D":"伦理观"},"a":"C","e":"\"过犹不及\"强调把握适度原则，体现度和量变质变观。"},{"i":"2021_10_single_13","t":"single","s":"社区护理的特点是","c":"社区护理管理","sc":1,"o":{"A":"通过研究解决医疗中的难点，推动医疗发展","B":"中心工作是治病救人","C":"服务场所在医院","D":"服务必须以社区居民的需求为导向"},"a":"D","e":"社区护理以社区居民健康为中心，服务必须以社区居民需求为导向。"},{"i":"2021_10_single_14","t":"single","s":"一般管理理论的研究重点是","c":"管理理论","sc":1,"o":{"A":"劳动方法标准化","B":"管理过程和管理组织","C":"生产过程中的人际关系","D":"理想的行政组织"},"a":"B","e":"法约尔一般管理理论以管理过程和管理组织为研究重点；A为科学管理，C为人际关系理论，D为韦伯行政组织理论。"},{"i":"2021_10_single_15","t":"single","s":"\"搬运铁块试验\"的实施者是","c":"管理理论","sc":1,"o":{"A":"法约尔","B":"泰罗","C":"麦格雷戈","D":"韦伯"},"a":"B","e":"搬运铁块试验是泰罗科学管理的经典试验。"},{"i":"2021_10_single_16","t":"single","s":"根据病人数量及护理工作量的变化来调节护士的排班，所体现的管理原则是","c":"现代管理的基本原则","sc":1,"o":{"A":"弹性原则","B":"整分合原则","C":"反馈原则","D":"动力原则"},"a":"A","e":"弹性原则要求管理具有伸缩性，按工作量变化弹性排班。"},{"i":"2021_10_single_18","t":"single","s":"对组织未来一段时间内总体战略目标、重点的规划，属于","c":"计划","sc":1,"o":{"A":"高层计划","B":"中层计划","C":"底层计划","D":"作业计划"},"a":"A","e":"高层计划由高层管理者制定，涉及组织总体战略目标和重点。"},{"i":"2021_10_single_19","t":"single","s":"属于网络组织的特点是","c":"组织","sc":1,"o":{"A":"组织成员职务稳定","B":"成员协作成本较高","C":"因事设置，专职专人","D":"成员拥有共同愿景"},"a":"B","e":"网络组织具有高度流动性和灵活性、并行作业共享核心能力、高协作成本等特点。"},{"i":"2021_10_single_20","t":"single","s":"属于组织文化物质层的是","c":"组织","sc":1,"o":{"A":"组织的职业道德","B":"组织的风俗习惯","C":"组织的分配制度","D":"组织的工作环境"},"a":"D","e":"物质层指存在于物质产品中的文化，包括组织标志、组织环境（工作环境）；A属精神层，C属制度层。"},{"i":"2021_10_multi_21","t":"multi","s":"组织综合工作的内容主要包括","c":"现代管理的基本原则","sc":2,"o":{"A":"合理确定各部分之间的相互关系","B":"合理调节各部分之间的利益关系","C":"及时实施指挥与控制","D":"始终把握整体目标","E":"从总体目标去统一各部分的行为"},"a":"ABCDE","e":"组织综合包括：合理确定局部间协作联系方式、调节局部及个人与整体利益关系、以信息反馈沟通实施及时指挥控制、始终把握整体目标并从总体目标统一各部分思想行为。"},{"i":"2021_10_multi_22","t":"multi","s":"下列关于目标的叙述，正确的有","c":"计划","sc":2,"o":{"A":"目标要有重点","B":"目标具有可测量性","C":"目标不应超出执行者的工作能力","D":"相互关联的部门之间应制定共同目标","E":"制定目标要考虑各方面关系的协调性"},"a":"ABCDE","e":"制定目标原则：要有重点、要适合执行者工作能力经过努力可完成、应具体可测量、考虑各方面关系协调、相互关联部门制定共同目标。"},{"i":"2021_10_multi_23","t":"multi","s":"管理者授权时，应充分考虑下属的因素，主要包括","c":"领导","sc":2,"o":{"A":"业务能力","B":"性格特点","C":"学历","D":"职务","E":"特长"},"a":"ABE","e":"授权时应根据不同护理人员的业务能力、性格特点及特长适当授予权力。"},{"i":"2021_10_multi_24","t":"multi","s":"下列关于领导者的描述，正确的有","c":"领导","sc":2,"o":{"A":"领导者是由上级指派具有正式职位的人","B":"领导者必须有追随者","C":"领导者的目的是实现组织或群体目标","D":"领导者应具备促进本组织发展的战略思维能力","E":"领导者应具有影响下属的能力"},"a":"BCDE","e":"领导者四含义：必须有追随者、要有影响追随者的能力、根本目的是实现组织或群体目标、应具备促进组织发展的战略思维能力；领导者不一定由上级指派（非正式领导者也存在）。"},{"i":"2021_10_term_28","t":"term","s":"护理人力资源管理","c":"护理人力资源管理","sc":3,"at":"参考答案（要点）：是护理管理的重要职能，指组织根据护理目标和业务范围，对护理人员进行规划、招聘录用、培训使用、绩效考核、薪酬管理及职业生涯规划等，以实现护理组织目标和个人发展的管理过程。","e":""},{"i":"2021_10_term_29","t":"term","s":"护理质量","c":"护理质量管理","sc":3,"at":"参考答案（要点）：是反映护理服务活动符合规定，满足护理服务对象明确与隐含的合理需要的程度。","e":""},{"i":"2021_10_term_30","t":"term","s":"组织文化","c":"组织","sc":3,"at":"参考答案（要点）：是组织在长期发展过程中形成的、为组织成员共同遵守和遵循的价值观念、行为准则、道德规范以及与之相适应的规章制度和组织结构的总和；包括精神层、制度层和物质层。","e":""},{"i":"2021_10_short_32","t":"short","s":"简述分析时间浪费原因的方法。","c":"计划","sc":5,"at":"参考答案（要点）：①找出根本不必做的事情：逐项问\"这件事如果不做会有什么后果\"，若无影响则立刻取消或谢绝；②找出可以由别人代为参加而又不影响效果的活动：通过授权委托他人；③找出浪费别人时间的活动且管理者自己可控制并消除：通过询问下属诊断并改进自身工作方式。","e":""},{"i":"2021_10_short_33","t":"short","s":"简述组织设计的步骤。","c":"组织","sc":5,"at":"参考答案（要点）：①明确组织目标；②工作划分；③建立部门；④决定管理跨度；⑤确定职权关系；⑥在运行中完善组织结构。","e":""},{"i":"2021_10_short_34","t":"short","s":"简述领导者有效沟通的技巧。","c":"领导","sc":5,"at":"参考答案（要点）：①注意语言和非语言技巧：语言简明扼要避免误解，注意肢体语言、面部表情和空间感；②恰当的自我表露：适当表露生活细节以降低部下紧张感、增加信任感；③合理的立场：尊重下属但坚持领导原则立场和要求；④积极的倾听和同感理解：善于倾听，发现对方思想情绪并给予真情理解。","e":""},{"i":"2021_10_short_35","t":"short","s":"简述护理人员排班的基本原则。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①满足患者需要；②全面掌握护理人员状况（老中青、高中低职称、强弱合理搭配）；③熟悉本护理单元的工作规律；④公平对待所有员工；⑤能级对应原则。","e":""},{"i":"2021_10_short_37","t":"short","s":"简述社区慢性病患者自我管理的支持方式。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①建立支持系统：医院、社区、家庭、病友；②激发患者的中心角色作用；③通过讲座、咨询、指导、热线电话、患者俱乐部、媒体、网络等形式增加慢性病患者自我管理的知识和技能。","e":""},{"i":"2021_10_essay_38","t":"essay","s":"试述根据动力原则，给予员工精神鼓励的主要方法。","c":"现代管理的基本原则","sc":10,"at":"参考答案（要点）：动力原则中的精神动力包括对理想信念的追求、精神鼓励和日常思想工作。给予员工精神鼓励的主要方法有：①正强化：恰当地设计人们的工作环境，并对完成的工作加以表扬，从而激发人们的积极性；②让员工参与管理：鼓励下属参与一些可以给予他们管理的事务，以提高下属的主人翁责任感；③使职务具有挑战性和富有意义：大胆启用那些胸有成竹、有胆识、有魄力、能干好高一级职务的人；④管理者应明察秋毫，及时准确掌握下属的工作情况、精神状态、工作热情，采取表扬、嘉奖、评先进、树立榜样等适当有效的鼓励，将消极态度转变为积极态度；⑤将上级对下级、同级之间的激励结合起来；⑥精神鼓励必须坚持实事求是的原则，才能真正起到激励作用。","e":""},{"i":"2021_10_essay_39","t":"essay","s":"试述我国护理管理组织结构的基本要求。","c":"组织","sc":10,"at":"参考答案（要点）：我国护理管理组织架构的基本要求：①300张病床以上的医院设护理部，实行护理部主任、科护士长、病房护士长三级负责制；②300张病床以下的医院实行科护士长、病房护士长二级负责制；③科护士长在护理部主任领导及科主任业务指导下对本辖区护理管理工作全面负责，100张病床以上或3个护理单元以上的大科，以及任务繁重的手术室、急诊科、门诊部设科护士长1名；④各病房护士长在科护士长领导及医生配合下做好本病房护理管理工作。目前我国医院护理管理体制主要有三种：a.在院长领导下，护理副院长—科护士长—病房护士长，实施垂直管理；b.在医疗副院长领导下，护理部主任—科护士长—病区护士长，实施半垂直管理；c.床位不满300张、规模较小的医院，不设护理部主任，只设总护士长。","e":""}]},{"key":"2022_4","name":"2022年4月","qs":[{"i":"2022_4_single_2","t":"single","s":"将复杂问题简单化，抽取主要信息来选择行动方案，体现了决策的","c":"领导","sc":1,"o":{"A":"最优决策原则","B":"满意决策原则","C":"合理性决策原则","D":"直觉决策原则"},"a":"B","e":"西蒙满意决策准则：面对复杂问题时把问题简单化，从信息中抽取主要内容选择行动方案。"},{"i":"2022_4_single_4","t":"single","s":"寻找计划执行中的问题并制定改进措施，属于PDCA循环中的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"D","e":"处置阶段（Action）针对检查发现的问题制定改进措施，标准化成功经验。"},{"i":"2022_4_single_6","t":"single","s":"下列属于卫生事业组织的是","c":"组织","sc":1,"o":{"A":"中华医学会","B":"中国红十字会","C":"国家卫生健康委员会","D":"疾病预防控制中心"},"a":"D","e":"疾病预防控制中心属预防服务提供组织，是卫生事业组织；A、B属群众性卫生组织，C属卫生行政组织。"},{"i":"2022_4_single_8","t":"single","s":"下列属于前馈控制措施的是","c":"控制","sc":1,"o":{"A":"护士自我控制","B":"实行护士资格准入","C":"患者满意度调查","D":"护理人员绩效考核"},"a":"B","e":"护士资格准入是在系统运行输入阶段进行的预防性控制，属前馈控制；C、D属反馈控制。"},{"i":"2022_4_single_10","t":"single","s":"为昏迷病人加床档以防坠床的护理措施属于","c":"护理质量管理","sc":1,"o":{"A":"风险前控制","B":"风险中控制","C":"风险后控制","D":"风险监测"},"a":"A","e":"床档是在风险事件发生前采取的防范措施，属风险前控制。"},{"i":"2022_4_single_11","t":"single","s":"由于值班护士没有及时巡视病房，造成病人输液外渗而引起的护理风险，其诱发因素是","c":"护理质量管理","sc":1,"o":{"A":"护理人员素质因素","B":"技术因素","C":"环境因素","D":"管理因素"},"a":"A","e":"未及时巡视属护理人员责任心不足、不遵守规章制度，是护理人员素质因素。"},{"i":"2022_4_single_13","t":"single","s":"属于社区护理质量管理评价指标的是","c":"社区护理管理","sc":1,"o":{"A":"卫生知识达标率","B":"健康教育活动参与率","C":"儿童生长发育指标","D":"社区护士培训率"},"a":"D","e":"社区护士培训率属社区护理质量评价指标；A、B属健康教育评价指标，C属健康服务指标。"},{"i":"2022_4_single_14","t":"single","s":"行政组织理论的创始人是","c":"管理理论","sc":1,"o":{"A":"韦伯","B":"梅奥","C":"麦格雷戈","D":"法约尔"},"a":"A","e":"韦伯提出理想的行政组织（官僚制）理论。"},{"i":"2022_4_single_15","t":"single","s":"管理者在处理与组织成员和其他利益相关者关系时，所扮演的角色是","c":"绪论","sc":1,"o":{"A":"监督角色","B":"信息角色","C":"决策角色","D":"人际角色"},"a":"D","e":"人际角色包括挂名首脑、领导者、联络者，处理与组织成员和利益相关者的关系。"},{"i":"2022_4_single_16","t":"single","s":"\"按职上岗\"体现了现代管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"能级原则","B":"整分合原则","C":"动力原则","D":"弹性原则"},"a":"A","e":"按职上岗即按职称能级安排相应岗位，体现能级原则。"},{"i":"2022_4_single_17","t":"single","s":"根据环境因素变化来及时调整计划的做法，体现了计划的","c":"计划","sc":1,"o":{"A":"目的性","B":"适应性","C":"普遍性","D":"经济性"},"a":"B","e":"计划的适应性指计划应随环境变化及时调整，保持弹性。"},{"i":"2022_4_single_18","t":"single","s":"科室\"三基三严\"培训计划属于","c":"计划","sc":1,"o":{"A":"战术计划","B":"战略计划","C":"作业计划","D":"指令性计划"},"a":"C","e":"科室具体培训任务属基层作业计划。"},{"i":"2022_4_single_19","t":"single","s":"人们由于彼此了解、产生感情而自然形成的团体，属于","c":"组织","sc":1,"o":{"A":"官僚制组织","B":"非正式组织","C":"学习型组织","D":"网络组织"},"a":"B","e":"非正式组织是人们由于共同兴趣、感情、了解而自然形成的团体。"},{"i":"2022_4_single_20","t":"single","s":"通过调查患者满意度来了解护理质量，体现绩效评价的","c":"护理人力资源管理","sc":1,"o":{"A":"操作标准化原则","B":"标准公开化原则","C":"指标客观化原则","D":"结果区别化原则"},"a":"C","e":"用患者满意度等可衡量、客观的指标进行评价，体现指标客观化原则。"},{"i":"2022_4_multi_21","t":"multi","s":"现代管理理念主要包括","c":"管理理念","sc":2,"o":{"A":"对立统一观","B":"普遍联系观","C":"发展观","D":"度和量变、质变观","E":"实践检验真理观"},"a":"ABCDE","e":"现代管理理念包括对立统一观、普遍联系观、发展观、度和量变质变观、实践检验真理观等。"},{"i":"2022_4_multi_22","t":"multi","s":"科学的系统分解要求主要包括","c":"现代管理的基本原则","sc":2,"o":{"A":"分解要适度","B":"分解要完全","C":"分解后各部分的比例要合理","D":"分解要配套","E":"分解后可有多余部分"},"a":"ABC","e":"科学系统分解要求：分解要适度、分解要完全、分解后各部分比例合理；不应有多余部分。"},{"i":"2022_4_multi_23","t":"multi","s":"控制人力成本的方法，主要包括","c":"控制","sc":2,"o":{"A":"机动调配人员","B":"增加资历浅员工的聘用比例","C":"作业电脑化","D":"实施患者分类","E":"部分工时制"},"a":"ACDE","e":"控制人力成本方法：机动护理人员制度、兼职制或部分工时制、辅助人力运用、作业电脑化、实施患者分类；不能以聘用资历浅者担任专业护理工作为标准，故B错。"},{"i":"2022_4_multi_25","t":"multi","s":"关于授权原则的描述，正确的有","c":"领导","sc":2,"o":{"A":"权力向下延伸时必须有诚意","B":"应保持授权政策的一贯性","C":"可先在几个领域象征性授权","D":"应做到系统和耐心","E":"应培训员工，使其具备行使权力的能力"},"a":"ABDE","e":"授权要求有诚意、政策一贯、系统耐心、培训员工使其具备行权能力；不能只在几个领域象征性授权，故C错。"},{"i":"2022_4_term_26","t":"term","s":"计划(狭义)","c":"计划","sc":3,"at":"参考答案（要点）：狭义的计划是指制订计划，即通过计划的编制，合理安排组织内一切具体的管理活动，有效地利用人力、物力和财力资源，为实现组织目标而对未来的行动做出具体安排，以期达到决策目标的过程。","e":""},{"i":"2022_4_term_27","t":"term","s":"组织设计","c":"组织","sc":3,"at":"参考答案（要点）：指根据组织目标及工作需要，确定组织内各个部门及所属成员的职责范围，明确组织结构，使之更有效地实现组织既定目标的过程；包括职务设置、部门设置、管理层次划分以及责权分配四个方面。","e":""},{"i":"2022_4_short_32","t":"short","s":"简述目标管理的特点。","c":"计划","sc":5,"at":"参考答案（要点）：①强调管理者和被管理者共同参与：由上下级共同制定目标及衡量方法；②强调自我管理：由监控下属转为设定客观标准和目标，靠员工积极性实现；③强调自我评价：定期评价、检查考核，强调员工自我检查并配合奖惩；④强调整体性管理：总目标逐层分解，各部门各成员分目标以总目标为导向。","e":""},{"i":"2022_4_short_33","t":"short","s":"简述领导者的含义。","c":"领导","sc":5,"at":"参考答案（要点）：领导者的含义包括四方面：①领导者必须有追随者；②领导者要有影响追随者的能力，这种能力或力量包括正式赋予的权力，也包括个人影响力；③领导者的根本目的是领导人们实现组织或群体目标，而不是个人目标；④领导者应该具备促进本组织发展的战略思维能力。","e":""},{"i":"2022_4_short_34","t":"short","s":"简述有效控制系统的特征。","c":"控制","sc":5,"at":"参考答案（要点）：①实时控制：及时发现偏差并迅速反应，防止偏差累积；②适度控制：防止控制过多或不足，处理全面控制与重点控制关系；③客观控制：检查测量手段正确反映实际，标准规范符合现时要求；④自我控制：允许员工自我反馈和自我控制，节省时间提高有效性；⑤员工认同：员工对控制系统认同感越高，控制系统推动和激励作用越明显。","e":""},{"i":"2022_4_short_35","t":"short","s":"简述护理人员排班的影响因素。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①护理人员素质：教育程度、工作能力、个人经验、身体及心理素质；②护理工作模式：功能制、小组制、个案护理、整体护理等对人员数量质量要求不同；③部门的需求：手术室、急诊、ICU等特殊部门需弹性排班；④不同的工作时段：白班与夜班、工作日与节假日负荷不同。","e":""},{"i":"2022_4_short_37","t":"short","s":"简述消除组织变革阻力的措施。","c":"组织","sc":5,"at":"参考答案（要点）：①加强与员工的沟通，让员工明白变革的意义，营造危机感，听取员工意见并让员工参与变革；②适当地运用激励手段：提高工资福利待遇，重用关键员工；③注重创新组织文化和创新策略：营造有利于变革的文化氛围，减少心理震荡和组织成本损失；④进行力场分析：分析变革动力和阻力，采取措施消除阻力；⑤争取高层管理部门的支持。","e":""},{"i":"2022_4_essay_38","t":"essay","s":"试述反馈原则在护理管理中的应用。","c":"现代管理的基本原则","sc":10,"at":"参考答案（要点）：反馈原则指在管理中要随时注意收集反馈信息，并与管理目的进行比较，当行动偏离目的时及时调整，以达到预期管理目的；其理论基础是控制论和信息论，PDCA循环实际就是反馈原则的应用。在护理管理中的应用包括：①通过信息反馈途径在护理管理中发现问题和薄弱环节，使之得以及时协调解决、调整目标、制订计划进入下一个PDCA循环（计划、执行、检查、处理），避免护理管理盲目决策造成误导，促进护理质量良性循环；②通过信息反馈制定下一周期的工作措施、业务计划、教学培训等；③通过信息反馈便于总结经验，护士长、护理部把反馈信息记录在册，有利于发现临床护理人才，并为调配、奖惩等提供依据。","e":""},{"i":"2022_4_essay_39","t":"essay","s":"试述冲突的处理方法。","c":"领导","sc":10,"at":"参考答案（要点）：管理冲突发生后，领导者可采用的事中控制方法和技能主要包括：①退避的方法和技能：自我从冲突中退出或躲避冲突；优点是可保持领导解决冲突的权威地位，某些冲突无领导介入解决更快更好；但仅适用于冲突负面影响和组织损害较小时使用；②妥协的方法和技能：冲突双方自愿放弃某些观点和利益，经双方自愿或领导说服各自主动放弃部分利益、接受对方某些观点；要求领导有较高管理和沟通技巧，需周密协调沟通；③裁决或命令的方法和技能：当双方都不愿放弃观点利益、不愿妥协谦让退避时，领导者使用命令方法解决冲突；要求领导有很高的指挥命令技巧。","e":""}]},{"key":"2022_10","name":"2022年10月","qs":[{"i":"2022_10_single_1","t":"single","s":"管理者能激励他人并与他人共事的能力属于","c":"绪论","sc":1,"o":{"A":"专业技能","B":"人际技能","C":"概念技能","D":"监督技能"},"a":"B","e":"人际技能是与他人共事、激励他人、处理人际关系的能力。"},{"i":"2022_10_single_4","t":"single","s":"护理技术控制属于","c":"控制","sc":1,"o":{"A":"人员控制","B":"作业控制","C":"财务控制","D":"信息控制"},"a":"B","e":"作业控制常用方法包括护理技术控制、护理质量控制、材料药品购买控制等。"},{"i":"2022_10_single_5","t":"single","s":"护理人员在职业生涯早期存在的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"没有足够的时间和精力进行自我反省","B":"面临极大的竞争压力","C":"稳定性较低，容易迷失自我","D":"安于现状"},"a":"C","e":"早期阶段（从业5~10年）存在问题是工作绩效不明显、稳定性较低，容易迷失自我；A、B属中期阶段，D属后期阶段。"},{"i":"2022_10_single_6","t":"single","s":"护理人员绩效考核属于","c":"控制","sc":1,"o":{"A":"现场控制","B":"前馈控制","C":"反馈控制","D":"预防控制"},"a":"C","e":"绩效考核是在工作完成后进行的评价性控制，属反馈控制。"},{"i":"2022_10_single_7","t":"single","s":"属于护理人员培训实施阶段内容的是","c":"护理人力资源管理","sc":1,"o":{"A":"分析培训需求","B":"确立培训目标","C":"设计培训课程","D":"确定评价标准"},"a":"C","e":"分析培训需求、确立培训目标属准备阶段；设计培训课程、选择培训教师属实施阶段；确定评价标准属评价阶段。"},{"i":"2022_10_single_9","t":"single","s":"采用患者满意度调查结果来评价护士工作绩效，体现了绩效评价的","c":"护理人力资源管理","sc":1,"o":{"A":"指标客观化原则","B":"标准公开化原则","C":"结果区别化原则","D":"操作标准化原则"},"a":"A","e":"用患者满意度等可衡量、客观的指标进行评价，体现指标客观化原则。"},{"i":"2022_10_single_10","t":"single","s":"要求各个阶段相辅相成且缺一不可，体现PDCA循环的特点是","c":"护理质量管理","sc":1,"o":{"A":"完整性、统一性、连续性","B":"大环套小环，小环保大环","C":"不断循环，螺旋上升","D":"实用性"},"a":"A","e":"P、D、C、A四个阶段相辅相成、缺一不可，体现完整性、统一性、连续性。"},{"i":"2022_10_single_11","t":"single","s":"护理部组织实施护理安全检查，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险前控制","B":"风险中控制","C":"风险后控制","D":"风险监察"},"a":"D","e":"风险监察包括临床监督与考核、不安全事件报告、安全会议、组织并实施安全查房等。"},{"i":"2022_10_single_12","t":"single","s":"\"黑猫白猫抓住耗子就是好猫\"体现了管理中的","c":"管理理念","sc":1,"o":{"A":"普遍联系观","B":"对立统一观","C":"人本主义观","D":"实践检验真理观"},"a":"D","e":"以实践结果（是否抓住耗子）检验好坏，体现实践检验真理观。"},{"i":"2022_10_single_14","t":"single","s":"提出高级管理人员可适当授权下属，自己保留重大事件处理权的理论是","c":"管理理论","sc":1,"o":{"A":"科学管理理论","B":"一般管理理论","C":"行政组织理论","D":"人际关系理论"},"a":"B","e":"法约尔一般管理理论提出集中与分散原则，高级管理人员可适当授权下属而保留重大事件处理权。"},{"i":"2022_10_single_15","t":"single","s":"应重视非正式组织的存在，并将其引向正式组织的目标，提出这一观点的管理学家是","c":"管理理论","sc":1,"o":{"A":"麦格雷戈","B":"西蒙","C":"梅奥","D":"法约尔"},"a":"C","e":"梅奥通过霍桑试验发现非正式组织，主张重视并引导其服务于正式组织目标。"},{"i":"2022_10_single_16","t":"single","s":"整分合原则的关键是","c":"现代管理的基本原则","sc":1,"o":{"A":"分工","B":"综合","C":"整体","D":"协作"},"a":"A","e":"整分合原则中，整体是前提，分工是关键，综合是保证。"},{"i":"2022_10_single_17","t":"single","s":"下列关于ABC时间管理法的描述，正确的是","c":"计划","sc":1,"o":{"A":"A类工作应占工作总量的40%~50%","B":"B类工作不重要且不紧迫","C":"C类工作可委托或授权","D":"C类工作应首先去做"},"a":"C","e":"A类占20%~30%、B类占30%~40%、C类占40%~50%；C类无关紧要不迫切，可委托或授权、不占用工作时间；首先做A类工作。"},{"i":"2022_10_single_20","t":"single","s":"根据权变领导理论，对成熟的护士最适宜采取的领导方式是","c":"领导","sc":1,"o":{"A":"命令式","B":"说服式","C":"参与式","D":"授权式"},"a":"C","e":"比较成熟的下属适用第三象限参与式（低任务高关系）；高度成熟适用授权式。"},{"i":"2022_10_multi_21","t":"multi","s":"现代管理的特点包括","c":"绪论","sc":2,"o":{"A":"强调系统的分析方法","B":"强调信息的作用","C":"强调工人是\"经济人\"","D":"强调组织的绩效","E":"强调组织的预测能力"},"a":"ABDE","e":"现代管理特点：强调人的因素、强调信息的作用、强调组织的绩效、强调系统分析方法、强调组织预测能力、强调变革和创新；\"经济人\"假设属古典管理理论。"},{"i":"2022_10_multi_22","t":"multi","s":"反馈原则的基本要求包括","c":"现代管理的基本原则","sc":2,"o":{"A":"灵敏","B":"分工","C":"准确","D":"综合","E":"有力"},"a":"ACE","e":"反馈的基本要求：灵敏（有收集处理机构和善于捕捉信息的人员）、准确（原始信息和加工处理准确）、有力（把反馈信息转化为指挥中心强有力的行动）。"},{"i":"2022_10_multi_23","t":"multi","s":"构成领导者个人威信的因素包括","c":"领导","sc":2,"o":{"A":"专长力","B":"职位权力","C":"魅力","D":"能力","E":"品质"},"a":"ACDE","e":"个人威信包括专长力和个人感召力（品质、魅力、能力、资历）；职位权力是组织授予的正式权力，不属个人威信。"},{"i":"2022_10_multi_24","t":"multi","s":"护理人员编配的原则包括","c":"护理人力资源管理","sc":2,"o":{"A":"学用一致原则","B":"结构比例合理原则","C":"功能需要原则","D":"成本效率原则","E":"能级对应原则"},"a":"BCDE","e":"护理人员编配原则：功能需要原则、能级对应原则、结构比例合理原则、成本效率原则；学用一致属培训原则。"},{"i":"2022_10_multi_25","t":"multi","s":"医疗过失行为责任程度分为","c":"护理质量管理","sc":2,"o":{"A":"完全责任","B":"主要责任","C":"次要责任","D":"轻微责任","E":"医疗意外"},"a":"ABCD","e":"医疗过失行为责任程度分为完全责任、主要责任、次要责任、轻微责任；医疗意外不属过失责任程度。"},{"i":"2022_10_term_29","t":"term","s":"激励","c":"领导","sc":3,"at":"参考答案（要点）：指影响人们内在需求或动机，从而加强、引导和维持行为的活动或过程；是调动人的积极性、发挥人的潜能，以实现组织目标的过程。","e":""},{"i":"2022_10_short_31","t":"short","s":"简述护理人力资源管理的基本职能。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①护理人力资源规划；②护理人员的招聘与录用；③护理人员的培训与使用；④护理人员的绩效评价；⑤护理人员的薪酬管理及劳动保护；⑥护理档案管理及护理人员职业生涯规划管理。","e":""},{"i":"2022_10_short_32","t":"short","s":"简述组织变革的程序。","c":"组织","sc":5,"at":"参考答案（要点）：①通过组织诊断，发现变革征兆：收集资料数据、进行组织分析、明确问题缺点、制定变革目标；②分析变革因素，制订改革方案：制定多个可行方案、充分论证对比择优、确定指导原则方式策略；③选择正确方案，实施变革计划：科学论证后选择方案、先试点后全面推行、有计划有步骤推行；④评价变革结果，及时进行反馈：检查分析评价改革效果、及时反馈以修正完善和巩固方案。","e":""},{"i":"2022_10_short_33","t":"short","s":"简述编制护理服务标识可追溯性管理程序的主要步骤。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：①明确标识适用范围：包括护理单元与设施标识、设备标识、无菌与非无菌物品标识、药品标识、护理服务过程标识、护理人员标识和清洁卫生用具标识；②明确标识的控制要求：明确各类用物和护理服务标识的方法和控制要求（如胸牌、护士帽横带、签名记录等）；③明确各类人员职责：护士长负责督促检查本单元标识应用与可追溯性实施，护理人员准确使用维护标识和记录；④明确具体工作程序：对护理单元及设施、设备、无菌物品、药品、服务过程、人员等分别规定具体标识程序。","e":""},{"i":"2022_10_short_34","t":"short","s":"简述绩效考核的主要形式。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①直接领导评价：由直接上级（护士长→科护士长→护理部主任）评价下属；②同行评价：小组成员相互评价，适合团队协作程度高的护理工作；③下属评价：由直接下属评价管理者，需对评价者姓名保密；④自我评价：护理人员对照岗位要求和评价标准自我评定；实际工作中常同时采用两种或两种以上复合形式。","e":""},{"i":"2022_10_short_35","t":"short","s":"简述护理质量管理的基本任务。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：①建立质量管理体系：明确每个护理人员在质量工作中的任务、职责和权限；②进行质量教育：提高护理人员质量意识，使其认识自身责任；③制定护理质量标准：作为质量管理基础和规范护士行为的依据；④进行全面质量控制：控制所有影响质量的因素、统计分析、建立质量可追溯机制；⑤持续改进护理质量：以患者为中心，全员参与、预防为主、不断改进。","e":""},{"i":"2022_10_short_37","t":"short","s":"简述社区护士的基本条件。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：根据2002年《卫生部通知》：①具有国家护士职业资格并经注册；②通过地（市）以上卫生行政部门规定的社区护士岗位培训；③独立从事家庭访视护理工作的社区护士，应具有在医疗机构从事临床护理工作5年以上的工作经历。","e":""}]},{"key":"2023_4","name":"2023年4月","qs":[{"i":"2023_4_single_3","t":"single","s":"护理部将质量检查中存在的问题分析总结，提出改进措施并返回给护理单元，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"整分合原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"C","e":"把执行结果返送回输入端并据此纠偏，正是反馈原则的体现。"},{"i":"2023_4_single_4","t":"single","s":"属于结构因素引起冲突的原因是","c":"领导","sc":1,"o":{"A":"语言表达困难","B":"沟通过程中的干扰","C":"过分强调下属参与","D":"个人价值观的差异"},"a":"C","e":"结构因素包括团体规模、专门化程度、领导风格、过分强调下属参与、奖惩制度等；A、B属沟通因素，D属个人因素。"},{"i":"2023_4_single_5","t":"single","s":"由中层管理者制定的局部性、阶段性计划属于","c":"计划","sc":1,"o":{"A":"战术计划","B":"战略计划","C":"作业计划","D":"底层计划"},"a":"A","e":"中层管理者制定的局部性、阶段性计划为战术计划；战略计划由高层制定，作业计划由基层制定。"},{"i":"2023_4_single_6","t":"single","s":"管理者及时掌握专业新动向，开发新业务与新技术，体现的管理角色是","c":"领导","sc":1,"o":{"A":"人际角色","B":"决策角色","C":"信息角色","D":"监督角色"},"a":"B","e":"开发新业务新技术属于企业家角色，是明茨伯格划分的决策角色之一。"},{"i":"2023_4_single_7","t":"single","s":"依据时间“四象限”法进行分类，制定防范措施属于","c":"计划","sc":1,"o":{"A":"紧急但不重要的事务","B":"既紧急又重要的事务","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"C","e":"制定防范措施是事先规划、预防性质的工作，属重要但不紧急的第二象限事务。"},{"i":"2023_4_single_8","t":"single","s":"充分重视人际关系、对业绩关心少的领导方式，属于管理方格理论中的","c":"领导","sc":1,"o":{"A":"乡村俱乐部型","B":"权威型","C":"团队型","D":"贫乏型"},"a":"A","e":"乡村俱乐部型（1,9）高度关心人、很少关心生产（业绩）。"},{"i":"2023_4_single_9","t":"single","s":"根据权变领导理论，适宜采取命令式领导方式的员工类型是","c":"领导","sc":1,"o":{"A":"成熟度低","B":"较为不成熟","C":"比较成熟","D":"高度成熟"},"a":"A","e":"命令式（高工作、低关系）适用于不成熟、成熟度低、既无能力又无意愿的下属。"},{"i":"2023_4_single_10","t":"single","s":"管理者采取各种措施和方法消灭或减少风险事件的发生，属于","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险控制","C":"风险评估","D":"风险监察"},"a":"B","e":"采取措施消灭或减少风险事件发生属风险控制。"},{"i":"2023_4_single_11","t":"single","s":"引起组织变革的内部环境因素是","c":"组织","sc":1,"o":{"A":"经济体制的改变","B":"知识员工的崛起","C":"国家体制的差异","D":"科学技术的发展"},"a":"B","e":"知识员工的崛起属组织内部人员/劳动力结构变化；经济体制、国家体制、科技发展均为外部环境因素。"},{"i":"2023_4_single_12","t":"single","s":"根据控制的方式不同，控制可分为","c":"控制","sc":1,"o":{"A":"生产控制、质量控制、成本控制和资金控制","B":"局部控制和全面控制","C":"正式组织控制、群体控制和自我控制","D":"内部控制和外部控制"},"a":"C","e":"教材明确：按控制方式不同分为正式组织控制、群体控制和自我控制。"},{"i":"2023_4_single_13","t":"single","s":"属于现场控制的是","c":"控制","sc":1,"o":{"A":"检查医疗护理材料的质量","B":"患者满意度调查","C":"护理人员绩效考核","D":"护理部组织的夜间查房"},"a":"D","e":"现场控制作用于正在进行的过程，如护理部到临床科室督查、夜间查房；A为前馈控制，B、C为反馈控制。"},{"i":"2023_4_single_14","t":"single","s":"明确护理人员需求并做出人员需求规划的过程属于","c":"护理人力资源管理","sc":1,"o":{"A":"护理人力资源规划","B":"护理人员的招聘与录用","C":"护理人员的培训与使用","D":"护理人员的绩效评价"},"a":"A","e":"明确人员需求并做需求规划即护理人力资源规划。"},{"i":"2023_4_single_16","t":"single","s":"护理绩效考核形式中，自我评价的优点是","c":"护理人力资源管理","sc":1,"o":{"A":"直接观察下属的工作表现","B":"因相互了解能准确作出评价","C":"真实反映领导者的业绩","D":"随时对个人工作进行反思"},"a":"D","e":"自我评价有利于被考核者随时对自身工作进行反思与改进；A、B分别为上级、同事评价的特点。"},{"i":"2023_4_single_17","t":"single","s":"根据计划要求，对比实际效果与预期目标，寻找计划执行中的问题并进行改进，属于PDCA的","c":"护理质量管理","sc":1,"o":{"A":"计划阶段","B":"实施阶段","C":"检查阶段","D":"处置阶段"},"a":"C","e":"将实际效果与预期目标对比、检查执行偏差，属PDCA的检查（Check）阶段。"},{"i":"2023_4_single_19","t":"single","s":"属于护理管理质量标准的是","c":"护理质量管理","sc":1,"o":{"A":"护理技术操作规范","B":"护理人员职业道德","C":"疾病护理常规","D":"护理诊断标准"},"a":"B","e":"护理管理标准体系中人员管理标准涉及职业道德及服务质量标准；A属护理技术标准，C、D属护理技术管理标准。"},{"i":"2023_4_multi_21","t":"multi","s":"古典管理理论包括","c":"管理理论","sc":2,"o":{"A":"科学管理理论","B":"一般管理理论","C":"行政组织理论","D":"人际关系理论","E":"双因素理论"},"a":"ABC","e":"古典管理理论包括科学管理理论、一般管理理论和行政组织理论；D属行为科学早期理论，E属激励（内容）理论。"},{"i":"2023_4_multi_22","t":"multi","s":"组织的基本特征包括","c":"组织","sc":2,"o":{"A":"有共同的目的","B":"存在分工","C":"应重视正式组织","D":"受环境的影响","E":"组织工作是静态的"},"a":"ABD","e":"组织基本特征包括受环境影响、有共同目的、存在分工等；E错误，组织是运动、变化的团体而非静态。"},{"i":"2023_4_multi_23","t":"multi","s":"控制主体包括","c":"控制","sc":2,"o":{"A":"偏差测量机构","B":"组织绩效","C":"信息","D":"决策机构","E":"执行机构"},"a":"ADE","e":"施控系统（控制主体）由偏差测量机构、决策机构和执行机构组成；组织绩效属控制客体，信息为联系二者的媒介。"},{"i":"2023_4_multi_25","t":"multi","s":"导致护理风险的相关因素包括","c":"护理质量管理","sc":2,"o":{"A":"患者对疾病的认识","B":"护理人员的服务态度","C":"护理人员的技术水平","D":"医院的基础设施","E":"护理人员的配置"},"a":"ABCDE","e":"诱发护理风险因素包括患者因素、护理人员素质（服务态度）因素、技术因素、环境（基础设施）因素、管理（人员配置）因素，五项均属之。"},{"i":"2023_4_term_27","t":"term","s":"管理沟通","c":"领导","sc":3,"at":"参考答案（要点）：管理沟通是指为了实现组织目标，管理者有目的地交流观点、信息、情报、意见和情感的过程；它是领导者履行计划、组织、领导、控制职能的有效方法与手段，是以组织目标为背景的人际交流活动。","e":""},{"i":"2023_4_term_30","t":"term","s":"临床教学","c":"护理临床教学管理","sc":3,"at":"参考答案（要点）：临床教学是指在为患者或服务对象提供健康服务的临床场所中，将专业理论知识与临床实践相结合，使学生获得临床护理技能、成为合格护理人才的教学活动，是护理教育的重要组成部分。","e":""},{"i":"2023_4_short_31","t":"short","s":"简述人际关系理论的主要观点。","c":"管理理论","sc":5,"at":"参考答案（要点）：①工人不仅是“经济人”，还是“社会人”，除金钱外还有心理、社会、安全、交往等多种需要；②企业内部除正式组织外还存在非正式组织，应重视并引导其服务于正式组织目标；③工人的士气（工作情绪）是提高劳动生产效率的最重要因素；④新型领导能力应着力于提高职工的社会满足感，重视人际关系与士气。","e":""},{"i":"2023_4_short_32","t":"short","s":"简述整分合原则中组织综合环节的主要工作。","c":"现代管理的基本原则","sc":5,"at":"参考答案（要点）：①合理确定各局部之间相互协作、联系方式，减少不必要的相互隔绝、脱节和相互牵制；②合理调节各局部、个人利益之间以及它们与系统整体利益之间的关系；③以有效的信息反馈和沟通去实施及时的指挥和控制；④始终把握整体目标，从总体目标去统一各部分的思想和行为。","e":""},{"i":"2023_4_short_33","t":"short","s":"简述制定目标应遵循的原则。","c":"计划","sc":5,"at":"参考答案（要点）：①目标要有重点；②目标要适合执行者的工作能力，经过努力可以完成；③目标应具体，以定量方法表示，具有可测量性；④制定目标要考虑各方面关系的协调；⑤相互关联的部门之间应制定共同目标。","e":""},{"i":"2023_4_short_34","t":"short","s":"简述直线职能制组织结构的优点和缺点。","c":"组织","sc":5,"at":"参考答案（要点）：优点：以直线结构为基础，既有利于统一指挥，又便于发挥专业管理职能的长处。缺点：职能部门之间缺乏沟通，横向联系差；高层管理者高度集权；直线部门与职能部门的职权难以严格区分。","e":""},{"i":"2023_4_short_35","t":"short","s":"简述控制的基本原则。","c":"控制","sc":5,"at":"参考答案（要点）：①目的性原则；②客观性原则（依定量或定性标准客观评价，避免主观干扰）；③重点性原则（抓对全局影响大的重点因素、关键环节）；④灵活性原则；⑤及时性原则（及时发现并及时纠正偏差）。","e":""},{"i":"2023_4_short_36","t":"short","s":"简述激励的内涵。","c":"领导","sc":5,"at":"参考答案（要点）：激励是指组织设计适当的外部奖酬形式和工作环境，确定行为规范和惩罚性措施，通过褒贬和奖惩、借助信息沟通，来激发、引导、保持和规范组织成员的行为，以有效实现组织及其成员个人目标的系统活动。其内涵包括：①通过奖酬与工作环境满足员工外在与内在需要；②奖励与惩罚并举；③贯穿员工工作全过程；④信息沟通贯穿激励始终。","e":""},{"i":"2023_4_short_37","t":"short","s":"简述社区传染病一级预防的护理管理工作内容。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①定期开展传染病基本知识培训，提高护理人员宣教和普及传染病知识的能力；②坚持执行全面性防护原则，防止自身被传染或将疾病传染给他人，并做好医疗废弃物（如注射器针头）的处理；③做好计划免疫管理，定期检查接种卡/证的建立与管理，督促护理人员按要求做好预防接种前、接种中、接种后的工作。","e":""},{"i":"2023_4_essay_38","t":"essay","s":"试述决策的步骤。","c":"领导","sc":10,"at":"参考答案（要点）：①识别问题/机遇：调查研究、收集信息，准确发现并提出问题或机遇，是决策过程的开始；②诊断问题：根据现象和数据分析问题/机遇产生的原因，找出解决办法和可替代行动方案；③确定决策目标：明确决策要达到的效果，目标应尽可能可度量（定性与定量结合）；④制定备选方案：找出多个可相互替代的可行方案，方案越多决策质量越有保障；⑤评价和选择方案：运用可行性分析等方法权衡利弊得失，确定最终方案；⑥实施和监控：制定实施计划与措施、配置资源、分配任务、建立报告制度并跟踪调整，对实施情况进行监控，出现偏差及时纠偏，环境变化时作跟踪决策。","e":""},{"i":"2023_4_essay_39","t":"essay","s":"试述护理管理控制的关键点。","c":"控制","sc":10,"at":"参考答案（要点）：①核心制度的落实：如消毒隔离、查对、抢救、安全管理等制度；②护理人员：护理骨干、新上岗护士、进修护士、实习护士以及近期遭遇重大生活事件的护士；③患者：疑难危重患者、新入院患者、手术后患者、接受特殊检查和治疗的患者、有自杀倾向的患者等；④器材设备和药品：特殊耗材、监护仪器设备、急救器材与药品等；⑤特殊科室：急诊科、手术室、供应室、监护室、婴儿室、待产室、血液透析室等；⑥时间：交接班时间、节假日、午间、夜间、工作繁忙时等。","e":""}]},{"key":"2023_10","name":"2023年10月","qs":[{"i":"2023_10_single_3","t":"single","s":"权变领导理论认为，适宜采取说服式领导方式的员工类型是","c":"领导","sc":1,"o":{"A":"成熟度低","B":"较为不成熟","C":"比较成熟","D":"高度成熟"},"a":"B","e":"说服式（高工作、高关系）适用于较为不成熟、有意愿但缺乏能力的下属。"},{"i":"2023_10_single_4","t":"single","s":"选择对全局影响大的重点因素与关键环节进行控制，体现了控制的","c":"控制","sc":1,"o":{"A":"目的性原则","B":"客观性原则","C":"重点性原则","D":"灵活性原则"},"a":"C","e":"重点性原则要求选择对全局影响大的重点因素、重点部分或关键环节进行控制。"},{"i":"2023_10_single_5","t":"single","s":"被称为“管理过程之父”的是","c":"管理理论","sc":1,"o":{"A":"法约尔","B":"泰罗","C":"麦格雷戈","D":"韦伯"},"a":"A","e":"法约尔首次系统提出管理的五大职能，被称为“管理过程之父”。"},{"i":"2023_10_single_7","t":"single","s":"管理者应尽量使护理人员的资质及能力等与所担负的工作职责相对应，体现了护理人员编配的","c":"护理人力资源管理","sc":1,"o":{"A":"功能需要原则","B":"能级对应原则","C":"结构合理原则","D":"成本效率原则"},"a":"B","e":"能级对应原则要求人的能力（能级）与所任职位、职责相对应，做到人尽其才、才尽其用。"},{"i":"2023_10_single_10","t":"single","s":"护士长积极组织护理人员对坠床病人进行抢救，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险评估","B":"风险前控制","C":"风险中控制","D":"风险后控制"},"a":"C","e":"风险事件（坠床）已发生，迅速掌握情况、解决当前最主要问题、使损害降至最低，属风险中控制（风险处置）。"},{"i":"2023_10_single_11","t":"single","s":"下列关于临床路径中护士职责的描述，错误的是","c":"护理质量管理","sc":1,"o":{"A":"按纳入标准选择进入临床路径的患者","B":"协调医患、护患之间的关系","C":"根据临床路径表完成各项护理任务","D":"负责患者满意度调查"},"a":"A","e":"按纳入标准选择进入临床路径的患者是医师职责；B、C、D均为护士在临床路径中的职责。"},{"i":"2023_10_single_12","t":"single","s":"注意协调组织长期发展与短期利益之间的关系，体现管理中的","c":"管理理念","sc":1,"o":{"A":"对立统一观","B":"发展观","C":"人本主义观","D":"伦理观"},"a":"B","e":"发展观要求用发展的眼光看问题，正确协调组织长期发展与短期利益、眼前与长远的关系。"},{"i":"2023_10_single_14","t":"single","s":"在计划完成后进行的评价性控制，属于","c":"控制","sc":1,"o":{"A":"前馈控制","B":"现场控制","C":"预备控制","D":"反馈控制"},"a":"D","e":"反馈控制是在计划完成后进行的评价性控制，也称事后控制。"},{"i":"2023_10_single_15","t":"single","s":"提出例外原理的管理理论是","c":"管理理论","sc":1,"o":{"A":"科学管理理论","B":"一般管理理论","C":"行政组织理论","D":"人际关系理论"},"a":"A","e":"例外原理由科学管理理论（泰罗）提出。"},{"i":"2023_10_single_16","t":"single","s":"综合考虑具体护理任务、人力配备及工作时段等特点进行合理排班，体现的管理原则是","c":"现代管理的基本原则","sc":1,"o":{"A":"动力原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"B","e":"弹性原则要求管理保持适当弹性、留有余地，根据任务、人力、时段等灵活调整排班，以适应变化。"},{"i":"2023_10_single_17","t":"single","s":"依据时间“四象限”法进行分类，护理人员培训属于","c":"计划","sc":1,"o":{"A":"紧急且重要的事务","B":"紧急但不重要的事务","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"C","e":"护理人员培训着眼于长远能力提升，不具即时紧迫性，属重要但不紧急的第二象限事务。"},{"i":"2023_10_single_20","t":"single","s":"职能制组织结构的特点是","c":"组织","sc":1,"o":{"A":"组织从最高管理层到最低管理层的各级职位按垂直系统排列","B":"组织的领导统一指挥与职能部门参谋、指导相结合","C":"组织各层次管理者负责行使该层次的全部管理工作","D":"组织中每个部门可得到其直接和非直接的上级工作部门下达的指令"},"a":"D","e":"职能制中职能部门在业务范围内有权向下级下达指令，形成多头领导；A为直线制，B为直线职能制。"},{"i":"2023_10_multi_21","t":"multi","s":"梅奥人际关系理论的主要内容包括","c":"管理理论","sc":2,"o":{"A":"两个同级部门之间可互相协调、解决问题","B":"企业内部存在非正式组织","C":"提高劳动生产效率的重要因素是工人的士气","D":"有效领导应提高员工的满足感","E":"对工人进行科学化培训可发挥其工作潜力"},"a":"BCD","e":"梅奥人际关系理论要点：工人是社会人、企业内部存在非正式组织、士气是提高效率的最重要因素、新型领导应提高职工社会满足感；A属矩阵制协调，E属科学管理。"},{"i":"2023_10_multi_22","t":"multi","s":"反馈的类型包括","c":"现代管理的基本原则","sc":2,"o":{"A":"前反馈","B":"中反馈","C":"后反馈","D":"正反馈","E":"负反馈"},"a":"DE","e":"反馈按作用效果分为正反馈和负反馈两类。"},{"i":"2023_10_multi_23","t":"multi","s":"有关激励的描述，正确的有","c":"领导","sc":2,"o":{"A":"激励的目的是实现组织目标","B":"惩罚不属于激励","C":"激励仅应用于行为过程的控制","D":"信息沟通质量直接影响激励效果","E":"可通过设计奖酬形式满足员工的需要"},"a":"ADE","e":"激励以实现组织目标为目的，通过设计奖酬满足员工需要，且奖惩并举、贯穿全过程、依赖信息沟通；B、C错误。"},{"i":"2023_10_term_26","t":"term","s":"整分合原则","c":"现代管理的基本原则","sc":3,"at":"参考答案（要点）：整分合原则是指在管理中把统一领导与分级管理有机结合起来，在整体规划下进行明确的科学分工，又在分工基础上进行有效的组织综合，即“整体把握、科学分解、组织综合”，以实现系统整体目标。","e":""},{"i":"2023_10_term_29","t":"term","s":"护理风险预案","c":"护理质量管理","sc":3,"at":"参考答案（要点）：护理风险预案是在护理缺陷出现之前制定的一系列应急反应程序，明确应急机制中各部门及其人员的组成、具体责任、工作措施以及相互之间的协调关系，并在其针对的情况出现时启动。","e":""},{"i":"2023_10_term_30","t":"term","s":"社区护理管理","c":"社区护理管理","sc":3,"at":"参考答案（要点）：社区护理管理是指运用现代管理理论，研究并发现社区护理工作的特点和规律，对社区护理工作进行计划、组织、协调和控制，以激发社区护士积极性、提高社区护理效率、确保社区护理质量，为社区居民提供高质量护理的过程。","e":""},{"i":"2023_10_short_31","t":"short","s":"简述科学的系统分解的主要要求。","c":"现代管理的基本原则","sc":5,"at":"参考答案（要点）：①分解要适度（分工有合理界限，过粗过细都降低效益）；②分解要完全（各部分功能能有机整合为整体，不留空白或断口）；③分解不能出现多余部分和环节（避免内部浪费）；④分解后各部分的比例要合理（不出现部分过重、过大或不足）；⑤分解要配套（职责与相应的权力、条件配套分解下去）。","e":""},{"i":"2023_10_short_33","t":"short","s":"简述决策实施步骤的主要工作。","c":"领导","sc":5,"at":"参考答案（要点）：①制定实施的具体计划和措施；②确定实施所需的各种资源及其配置；③分配实施中所包含的具体任务；④建立实施工作报告制度并及时报告；⑤做好跟踪决策和实施调整，对实施情况进行监控，出现偏差及时纠偏。","e":""},{"i":"2023_10_short_35","t":"short","s":"简述鼓励患者参与医疗安全的主要措施。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：①针对患者疾病诊疗信息，为患者提供相关健康教育，协助患方理解与选择诊疗方案；②主动邀请患者参与医疗安全管理，尤其在患者接受手术前和药物治疗时；③教育患者就诊时提供真实病情、真实信息，并告知其对诊疗服务质量与安全的重要性；④公开本院接待患者投诉的主要部门、投诉方式及途径。","e":""},{"i":"2023_10_short_36","t":"short","s":"简述护理管理者的主要控制对象。","c":"控制","sc":5,"at":"参考答案（要点）：护理管理者的控制对象主要是人员，包括：①各级护理管理者（护士长、总护士长、护理部正副主任及护理副院长等）；②各级各类护理人员（护理员、护士、护师、主管护师、副主任护师、主任护师）；③护理专业的学生（见习生、实习生、进修生）。（此外还包括财务、作业、信息、组织总体绩效等控制内容。）","e":""},{"i":"2023_10_short_37","t":"short","s":"简述社区护理的特点。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①强调服务场所必须在社区，是社区建设的一部分；②服务目标以社区居民的需求为导向；③服务内容不仅是疾病医疗，而是集防、治、保、健、教、计划生育为一体的全方位服务；④服务必须是居民在经济上能够承担的、实施时使居民感到足够方便的。","e":""},{"i":"2023_10_essay_39","t":"essay","s":"试述护理教学查房的注意事项。","c":"护理临床教学管理","sc":10,"at":"参考答案（要点）：①查房前充分准备：主持教师熟练掌握查房内容并与临床实际结合，学生预先复习相关知识；②时间通常1~2学时，每次选1~2个病例以保证质量；③按教学大纲及本病区病种特点选病例，尽量选临床表现典型的常见病、多发病及学生必须掌握的疾病，查房中注意保护性医疗措施，避免引发医疗纠纷；④重点在于基本知识基本理论的渗透、临床推理的展示和融会贯通应用，各环节体现师生互动和教学内容延伸；⑤学生汇报病史应简明扼要，运用护理程序体现整体护理，语言清晰、重点突出，10~15分钟内完成；⑥教师对汇报适当点评分析，紧扣教学目标、结合病例实际，指明新进展新观点，可指导查阅文献；⑦体现人文关怀和职业道德，查房前自我介绍，操作示范不增加患者痛苦，查房后整理患者衣被并致谢。","e":""}]},{"key":"2024_4","name":"2024年4月","qs":[{"i":"2024_4_single_2","t":"single","s":"依据领导理论，有利于发挥下属积极性的领导作风是","c":"领导","sc":1,"o":{"A":"专制型","B":"民主型","C":"放任型","D":"乡村俱乐部型"},"a":"B","e":"民主型领导发动下属讨论、共同商量、集思广益，有利于发挥下属积极性和主动性。"},{"i":"2024_4_single_3","t":"single","s":"属于控制主体的是","c":"控制","sc":1,"o":{"A":"作业","B":"信息","C":"决策机构","D":"组织效率"},"a":"C","e":"施控系统（控制主体）由偏差测量机构、决策机构和执行机构组成；作业、组织绩效属控制客体，信息为联系二者的媒介。"},{"i":"2024_4_single_4","t":"single","s":"依据定量标准评价工作成果，体现了控制的","c":"控制","sc":1,"o":{"A":"及时性原则","B":"客观性原则","C":"灵活性原则","D":"目的性原则"},"a":"B","e":"客观性原则要求依据相应的定量或定性标准进行控制，以避免主观因素干扰、客观准确地评价工作成果。"},{"i":"2024_4_single_6","t":"single","s":"下列关于医院护理人员编制标准的描述，正确的是","c":"护理人力资源管理","sc":1,"o":{"A":"二级医院的卫生技术人员比例为80%","B":"三级医院病床与病房护理人员之比不少于1:0.4","C":"三级医院医师与护理人员之比为1:2","D":"二级医院护师以上职称人员比例应大于10%"},"a":"C","e":"教材表9-3：三级医院医师与护理人员之比为1:2；二级医院卫技人员为75%、护师以上≥20%，故A、D错；三级医院病床与病房护理人员之比为1:0.4。"},{"i":"2024_4_single_7","t":"single","s":"在护理人员绩效评价中，符合操作标准化原则的是","c":"护理人力资源管理","sc":1,"o":{"A":"评价的间隔时间相同","B":"制定标准时尽量使用可衡量的指标","C":"公布绩效评价指标","D":"考核结果作为晋升和奖惩的依据"},"a":"A","e":"操作标准化原则包括同一岗位用同一标准方法、评价间隔时间相同（每年或每半年一次）等；B属指标客观化，C属标准公开化，D属结果区别化。"},{"i":"2024_4_single_8","t":"single","s":"护理人员边工作边接受指导与教育的学习过程，属于","c":"护理人力资源管理","sc":1,"o":{"A":"脱产培训","B":"半脱产培训","C":"岗前培训","D":"在职培训"},"a":"D","e":"边工作边接受指导与教育属在职培训。"},{"i":"2024_4_single_9","t":"single","s":"下列属于护理管理质量标准的是","c":"护理质量管理","sc":1,"o":{"A":"护理技术操作规范","B":"病区环境管理质量标准","C":"心力衰竭病人护理常规","D":"护理诊断标准"},"a":"B","e":"病区环境管理质量标准属物资、设备管理标准（护理管理标准体系）；A属护理技术标准，C、D属护理技术管理标准。"},{"i":"2024_4_single_10","t":"single","s":"护理单元的各个环节必须围绕着医院护理服务的总体目标，体现了PDCA的","c":"护理质量管理","sc":1,"o":{"A":"完整性、统一性与连续性","B":"大环套小环小环保大环，互相连接互相促进","C":"不断循环，螺旋上升","D":"实行循环运作的非程序化"},"a":"B","e":"教材原文：各护理单元的各个环节必须围绕医院护理服务的方针目标协调行动，大循环是小循环的母体和依据，小循环是大循环的分解和保证，即大环套小环、小环保大环、相互促进。"},{"i":"2024_4_single_11","t":"single","s":"对于易发生风险的护理项目进行程度和频率的评价，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险控制","C":"风险评估","D":"风险监测"},"a":"C","e":"对风险发生的程度、频率（概率）进行分析评价属风险评估。"},{"i":"2024_4_single_14","t":"single","s":"在管理中把统一领导与分级管理有机地结合起来，体现了管理的","c":"现代管理的基本原则","sc":1,"o":{"A":"整分合原则","B":"弹性原则","C":"反馈原则","D":"能级原则"},"a":"A","e":"整分合原则即把统一领导与分级管理有机结合，在整体规划下科学分工、在分工基础上组织综合。"},{"i":"2024_4_single_17","t":"single","s":"培养护士观察问题、分析问题和解决问题能力，最好的方法是","c":"护理临床教学管理","sc":1,"o":{"A":"讲授法","B":"演示法","C":"研讨会","D":"案例分析法"},"a":"D","e":"案例分析法通过对典型病例的分析讨论，能有效培养护士观察、分析和解决问题的能力。"},{"i":"2024_4_single_19","t":"single","s":"职能制组织结构的缺点是","c":"组织","sc":1,"o":{"A":"容易产生专制","B":"适用于小型组织","C":"领导间相互推卸责任","D":"实行多头领导"},"a":"D","e":"职能制中各职能部门在业务范围内都有权向下级下达指令，形成多头领导，妨碍统一指挥。"},{"i":"2024_4_multi_21","t":"multi","s":"依据时间“四象限”法分类，重要但不紧急的事务包括","c":"计划","sc":2,"o":{"A":"人事危机","B":"人员培训","C":"制定工作计划","D":"建立人际关系","E":"客户投诉"},"a":"BCD","e":"人员培训、制定工作计划、建立人际关系着眼长远、不具即时紧迫性，属重要但不紧急事务；人事危机、客户投诉属紧急事务。"},{"i":"2024_4_multi_22","t":"multi","s":"在组织设计中，影响管理宽度的因素包括","c":"组织","sc":2,"o":{"A":"主管与下属双方的素质和能力","B":"授权","C":"管理工作的复杂性和计划性","D":"组织环境","E":"工作条件"},"a":"ABCDE","e":"影响管理宽度的因素包括：主管与下属双方素质能力、管理工作的复杂性与计划性（及下属工作相似性）、授权、组织环境、工作条件，五项均属之。"},{"i":"2024_4_term_27","t":"term","s":"护理风险管理","c":"护理质量管理","sc":3,"at":"参考答案（要点）：护理风险管理是指了解和掌握护理过程中可能出现的风险，拟定防范措施并监控执行情况，尽量减低风险度以提高护理效果的管理过程。","e":""},{"i":"2024_4_term_28","t":"term","s":"目标管理","c":"计划","sc":3,"at":"参考答案（要点）：目标管理（MBO）是由德鲁克提出的一种管理方法，在这种方法中管理者与组织成员共同制定目标，并共同实施、评价目标，强调管理的目标导向和员工的自我控制，以更严格、精确、有效的内部控制取代外部控制。","e":""},{"i":"2024_4_short_33","t":"short","s":"简述目标的作用。","c":"计划","sc":5,"at":"参考答案（要点）：①标准作用：作为组织成员绩效考核的客观依据；②激励作用：通过有挑战性的目标提高成员积极性和绩效；③把每个成员的工作与组织整体发展目标联系起来，增强集体荣誉感和归属感；④明确对每个成员的要求，有助于自我管理；⑤使成员明确自身职业生涯发展方向。","e":""},{"i":"2024_4_short_35","t":"short","s":"简述信息有效性的主要体现。","c":"控制","sc":5,"at":"参考答案（要点）：①信息的及时性（信息收集、加工、检索和传递都要及时）；②信息的可靠性（依靠准确、完整收集传递的可靠信息作出正确决策）；③信息的实用性（针对管理需要提供适宜信息，不加区分地提供信息反而加重负担）。","e":""},{"i":"2024_4_short_36","t":"short","s":"简述绩效评价的方法。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①描述法（行为特征评定法）；②目标管理法；③绩效评价表法（可采用百分制、五分制或ABCD等级制）；④关键事件法；⑤强迫选择比例法。管理者应根据考核对象和目的选择适宜方法。","e":""},{"i":"2024_4_essay_39","t":"essay","s":"试述在特殊情况下，为保证正确执行医嘱，医务人员之间的有效沟通措施。","c":"护理质量管理","sc":10,"at":"参考答案（要点）：①通过诊疗活动中医务人员之间的有效沟通做到正确执行医嘱，一般情况下不得使用口头或电话通知的医嘱或检验数据。②只有在危重患者紧急抢救的特殊情况下，方可使用口头或电话的临时医嘱：对医师下达的口头临时医嘱，护士应向医生重复（复述核对），在执行时实施双重检查，事后应准确记录。③在接获口头或电话通知的患者“危急值”或其他重要检验结果时，接获者必须规范、完整地记录检验结果和报告者的姓名与电话，进行重复确认（读背核对）后方可提供医师使用。④通过以上措施确保医疗安全，保证每一位患者享有最安全的医疗服务。","e":""}]},{"key":"2024_10","name":"2024年10月","qs":[{"i":"2024_10_single_4","t":"single","s":"医院招聘本科学历且有护士执业证书的护士作为员工，属于","c":"控制","sc":1,"o":{"A":"前馈控制","B":"现场控制","C":"反馈控制","D":"事后控制"},"a":"A","e":"实行护士资格准入（按学历、执业证书录用）是在系统运行投入阶段进行的预防性控制，属前馈控制。"},{"i":"2024_10_single_5","t":"single","s":"属于反馈控制的工作是","c":"控制","sc":1,"o":{"A":"调查患者满意度","B":"实行护士资格准入","C":"处理患者投诉","D":"检查护理材料质量"},"a":"A","e":"反馈控制重点在输出，如患者满意度调查、护理人员绩效考核；B、D属前馈控制。"},{"i":"2024_10_single_6","t":"single","s":"为了培养护士的观察问题、分析问题和解决问题能力，最好的培训方法是","c":"护理临床教学管理","sc":1,"o":{"A":"讲授法","B":"演示法","C":"研讨会","D":"案例分析法"},"a":"D","e":"案例分析法通过典型病例的分析讨论，最能培养护士观察、分析和解决问题的能力。"},{"i":"2024_10_single_7","t":"single","s":"下列关于控制的描述，正确的是","c":"控制","sc":1,"o":{"A":"是指为实现组织目标而对未来的行动做出具体的安排","B":"通过组织设计、资源配置为决策和计划的有效实施创造条件","C":"是一种对人们施加影响的管理过程","D":"是通过监督和纠偏来实现组织目标"},"a":"D","e":"控制是通过确立标准、衡量绩效、纠正偏差（监督与纠偏）来保证实际工作与计划目标一致的过程；A为计划，B为组织，C为领导。"},{"i":"2024_10_single_9","t":"single","s":"护士的绩效考核由所在护理单元的护士长进行，护士长的考核由科护士长进行，这种方式属于绩效考核的","c":"护理人力资源管理","sc":1,"o":{"A":"直接领导评价","B":"同行评价","C":"下属评价","D":"自我评价"},"a":"A","e":"由被考核者的直接上级（直接领导）进行考核属直接领导评价。"},{"i":"2024_10_single_10","t":"single","s":"制定各种突发事件的应急预案，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险评估","B":"风险前控制","C":"风险中控制","D":"风险后控制"},"a":"B","e":"事先针对可预期诱发事件制定应变计划并演练，避免风险产生，属风险前控制。"},{"i":"2024_10_single_12","t":"single","s":"“过犹不及”体现的管理理念是","c":"管理理念","sc":1,"o":{"A":"对立统一观","B":"发展观","C":"度和量变、质变观","D":"伦理观"},"a":"C","e":"“过犹不及”强调凡事要有度、宽严适度，体现度和量变、质变观。"},{"i":"2024_10_single_15","t":"single","s":"发现工作士气是影响生产效率最重要因素的理论是","c":"管理理论","sc":1,"o":{"A":"行政组织理论","B":"一般管理理论","C":"人际关系理论","D":"社会系统理论"},"a":"C","e":"梅奥人际关系理论（霍桑试验）提出工作士气是影响劳动生产效率的最重要因素。"},{"i":"2024_10_single_19","t":"single","s":"网络组织的特点是","c":"组织","sc":1,"o":{"A":"组织成员职务稳定","B":"高协作成本","C":"因事设置，专职专人","D":"组织成员有共同的愿景"},"a":"B","e":"网络组织具有组织边界模糊、高协作成本等特点；D为学习型组织特点，C为官僚制组织特点。"},{"i":"2024_10_single_20","t":"single","s":"引起组织变革的外部环境因素是","c":"组织","sc":1,"o":{"A":"战略目标的调整","B":"知识员工的崛起","C":"工作内容的变化","D":"保险制度的改革"},"a":"D","e":"保险制度的改革属外部社会政策环境因素；战略目标调整、知识员工崛起、工作内容变化均为组织内部因素。"},{"i":"2024_10_multi_21","t":"multi","s":"下列属于现代管理理念的有","c":"管理理念","sc":2,"o":{"A":"管理的“文化”观","B":"管理中的“普遍联系”观","C":"管理中的“人本主义”观","D":"管理法制观","E":"管理中的“实践检验真理”观"},"a":"ABCDE","e":"现代管理理念包括对立统一观、普遍联系观、发展观、度和量变质变观、实践检验真理观、文化观和愿景、人本主义观、伦理观、管理法制观，五项均属之。"},{"i":"2024_10_multi_22","t":"multi","s":"下列关于结构因素引起冲突的描述，正确的有","c":"领导","sc":2,"o":{"A":"团体越大，成员的工作越专门化，产生冲突的可能性越小","B":"团体成员流动性越大，产生冲突的可能性越大","C":"组织中各部门的目标越多，冲突的潜在性就越低","D":"组织内部领导风格越苛刻，冲突的潜在可能性越大","E":"过分强调下属的参与，也会引起较多的冲突"},"a":"BDE","e":"结构因素中，团体越大、工作越专门化冲突可能性越大（A错）；成员流动性越大冲突越大（B对）；各部门目标越多冲突潜在性越高（C错）；领导风格越苛刻冲突越大（D对）；过分强调下属参与也会引起较多冲突（E对）。"},{"i":"2024_10_multi_23","t":"multi","s":"管理者授权时，应充分考虑下属的","c":"领导","sc":2,"o":{"A":"业务能力","B":"性格特点","C":"学历","D":"职称","E":"特长"},"a":"ABE","e":"教材要求根据不同护理人员的业务能力、性格特点及特长适当授予权力，以便下属得到锻炼。"},{"i":"2024_10_multi_25","t":"multi","s":"诱发护理风险的环境因素包括","c":"护理质量管理","sc":2,"o":{"A":"管理制度不健全","B":"消毒隔离不严格","C":"医用危险物品使用不当","D":"家庭对患者的关心不足","E":"护理人员责任心不强"},"a":"BCD","e":"环境因素包括医院基础设施、消毒隔离不严导致的交叉感染、医用危险物品管理使用不当、病房治安及社会环境（家庭关心）等；A属管理因素，E属人员素质因素。"},{"i":"2024_10_term_29","t":"term","s":"目标管理法","c":"计划","sc":3,"at":"参考答案（要点）：目标管理法是由德鲁克提出、被广泛使用的绩效考核（管理）方法，它通过管理者与护理人员共同制定业绩目标，并定时按目标完成情况进行考核评价，是一种比较具体和客观的管理与评价方法。","e":""},{"i":"2024_10_short_32","t":"short","s":"简述实施时间管理的步骤。","c":"计划","sc":5,"at":"参考答案（要点）：①评估时间使用情况，记录时间耗用的实际情形；②分析时间浪费的原因；③合理安排工作时间（区分事务轻重缓急、抓住重点、学会授权）。时间管理的本质是有效地运用时间。","e":""},{"i":"2024_10_short_33","t":"short","s":"简述学习型组织的特点。","c":"组织","sc":5,"at":"参考答案（要点）：①组织成员拥有一个共同的愿景；②善于不断学习（强调终身学习、全员学习、全过程学习、团体学习）；③以“基层为主”的扁平（横向）组织结构；④主张组织按学习关系建立上下互动、内外互动的结构，成员充分交流经验得失、互相促进；⑤组织积极适应环境，具有持续学习能力和高于个人绩效总和的综合绩效。","e":""},{"i":"2024_10_essay_39","t":"essay","s":"试述组织文化的功能。","c":"组织","sc":10,"at":"参考答案（要点）：组织文化是组织的灵魂，贯穿于成员日常行为中，是区别于其他组织的根本所在，主要功能有：①目标导向功能：价值观对领导人和员工行为起引导、调控作用，规范成员行为使之与群体目标一致；②凝聚功能：共同的价值和理想形成群体意识，使员工产生归属感、荣誉感和目标服从感，具有内在凝聚力和感召力；③激励功能：强调人自身价值实现，尊重、信任、理解员工，激发工作热情、积极性和创造性；④约束功能：共同价值观向个人价值观渗透内化，利用从众心理促进成员自我控制；⑤自我完善功能：组织文化需长期倡导和精心培育，在不断总结、提炼、修改、提高中持续发展完善。","e":""}]},{"key":"2025_4","name":"2025年4月","qs":[{"i":"2025_4_single_1","t":"single","s":"管理者处理内部矛盾和冲突，体现的管理角色是","c":"领导","sc":1,"o":{"A":"人际角色","B":"信息角色","C":"决策角色","D":"监督角色"},"a":"C","e":"明茨伯格将管理者角色分为人际、信息、决策三类；处理组织内部矛盾和冲突属于决策角色中的“混乱驾驭者（干扰对付者）”。"},{"i":"2025_4_single_2","t":"single","s":"在管理方格理论中，团队型管理的领导方式是","c":"领导","sc":1,"o":{"A":"1.1型管理","B":"1.9型管理","C":"9.9型管理","D":"9.1型管理"},"a":"C","e":"管理方格中9.9型为团队型管理，对生产和人都高度关心，是最理想的领导方式。"},{"i":"2025_4_single_3","t":"single","s":"权力完全交由个人，下级充分享有自由的领导方式是","c":"领导","sc":1,"o":{"A":"放任型","B":"民主型","C":"专制型","D":"参与型"},"a":"A","e":"放任型领导是指行政领导将权力交予下级，任由下级自主决定、自由行动，领导极少运用权力。"},{"i":"2025_4_single_4","t":"single","s":"确定控制对象，属于控制过程中的","c":"控制","sc":1,"o":{"A":"确立目标","B":"衡量工作绩效","C":"评价偏差","D":"采取纠正措施"},"a":"A","e":"控制过程第一步确立标准（目标）首先要解决“控制什么”，即确定控制对象，再选择关键点、分解目标并确立控制标准。"},{"i":"2025_4_single_5","t":"single","s":"根据实施控制的来源不同，将控制分为","c":"控制","sc":1,"o":{"A":"生产控制、质量控制、成本控制和资金控制","B":"局部控制和全面控制","C":"现场控制、前馈控制和反馈控制","D":"内部控制和外部控制"},"a":"D","e":"教材明确：根据实施控制的来源不同，控制有内部控制和外部控制两种类型。"},{"i":"2025_4_single_6","t":"single","s":"护理部组织护士长夜查房，属于","c":"控制","sc":1,"o":{"A":"前馈控制","B":"现场控制","C":"反馈控制","D":"事后控制"},"a":"B","e":"教材举例：护理部组织的午间、夜间及节假日查房均属于现场控制，目的是保证薄弱时段护理工作顺利进行。"},{"i":"2025_4_single_7","t":"single","s":"护理人员在职业生涯后期阶段存在的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"容易出现职业锚不确定","B":"无时间和精力进行自我反省","C":"面临极大的竞争压力","D":"职业能力呈现下降趋势"},"a":"D","e":"职业生涯后期（从业25年以上）各方面能力不可避免衰退，体力、学习能力及整体职业能力均呈下降趋势；A属早期，B、C属中期。"},{"i":"2025_4_single_8","t":"single","s":"由护士对护士长进行评价时，需要注意的问题是","c":"护理人力资源管理","sc":1,"o":{"A":"考核前评价者应接受必要的培训","B":"需要护士具有较高的成熟度","C":"需要对评价者的姓名保密","D":"易利用职权操控评价"},"a":"C","e":"下属评价时下属担心报复不敢客观评价，故需对评价者姓名保密，以获得真实结果并保护评价者。"},{"i":"2025_4_single_9","t":"single","s":"下列属于护理人员培训准备阶段的内容是","c":"护理人力资源管理","sc":1,"o":{"A":"确立培训目标","B":"选择培训教师","C":"选择培训方式","D":"确定评价标准"},"a":"A","e":"培训前准备阶段主要进行培训需求分析、培训前测试和确立培训目标。"},{"i":"2025_4_single_10","t":"single","s":"应用量表对患者发生跌倒的危险程度进行评分，属于","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险评估","C":"风险控制","D":"风险监察"},"a":"B","e":"风险评估是对易出现风险的护理项目进行程度和频率的评估，常借助评估工具如《Morse患者跌倒危险度评估表》。"},{"i":"2025_4_single_12","t":"single","s":"被称为“科学管理之父”的是","c":"管理理论","sc":1,"o":{"A":"法约尔","B":"泰罗","C":"麦格雷戈","D":"韦伯"},"a":"B","e":"泰罗是科学管理的创始人，被称为“科学管理之父”；法约尔为“管理过程之父”，韦伯为“组织理论之父”。"},{"i":"2025_4_single_13","t":"single","s":"直线制组织结构的缺点是","c":"组织","sc":1,"o":{"A":"容易产生专制","B":"多头领导，不利于统一指挥","C":"职权难以区分","D":"部门领导之间相互推卸责任"},"a":"A","e":"直线制过分强调下级服从上级，容易产生专制，阻碍下属工作的主动性和创造性；B属职能制缺点。"},{"i":"2025_4_single_14","t":"single","s":"马斯洛提出的管理理论是","c":"领导","sc":1,"o":{"A":"双因素理论","B":"期望理论","C":"需求层次理论","D":"情境领导理论"},"a":"C","e":"马斯洛提出人类需要层次理论（生理、安全、社交、尊重、自我实现）；双因素理论由赫茨伯格提出。"},{"i":"2025_4_single_15","t":"single","s":"护理人员排班方法中，周排班法的特点是","c":"护理人力资源管理","sc":1,"o":{"A":"护士值班安排周期短","B":"护理人员可以根据个人需要选择工作班次","C":"在实际工作中很难推广","D":"护士对自己未来一段时间的班次心中有数"},"a":"A","e":"周排班法以每周为一个排班周期，特点是对护理人员值班安排周期短；B、C属自我排班法，D属周期性排班法。"},{"i":"2025_4_single_17","t":"single","s":"在制定计划时要全方位考虑，使计划能够灵活的应对客观环境变化，体现了计划的","c":"计划","sc":1,"o":{"A":"目的性","B":"适应性","C":"普遍性","D":"经济性"},"a":"B","e":"计划的适应性要求制订计划时全方位考虑，使计划能灵活地适应客观环境变化，并在实施中及时修订调整。"},{"i":"2025_4_single_18","t":"single","s":"下列关于目标管理的叙述正确的是","c":"计划","sc":1,"o":{"A":"目标管理强调上级评价","B":"目标主要由管理者制定","C":"目标管理强调自我管理","D":"目标管理强调制度管理"},"a":"C","e":"目标管理特点：强调管理者与被管理者共同参与、强调自我管理、强调自我评价、强调整体性管理。"},{"i":"2025_4_single_19","t":"single","s":"下列属于组织文化物质层的是","c":"组织","sc":1,"o":{"A":"组织的职业道德","B":"组织的风俗习惯","C":"组织的分配制度","D":"组织的工作环境"},"a":"D","e":"物质层是组织文化的表层，如企业标志、房屋建筑、工作环境布局、成员服饰等；A属精神层，B、C属制度层。"},{"i":"2025_4_multi_21","t":"multi","s":"为保证病人及医务人员的安全，医务人员必须洗手或进行手消毒的情况包括","c":"护理质量管理","sc":2,"o":{"A":"接触患者前后","B":"摘除手套前","C":"进行侵入性操作前","D":"接触患者体液后","E":"直接接触患者的无生命物体后"},"a":"ACDE","e":"教材列6种须洗手或手消毒情况：接触患者前后、摘除手套后、进行侵入性操作前、接触患者体液排泄物后、从脏部位到干净部位、直接接触患者无生命物体后；B应为“摘除手套后”。"},{"i":"2025_4_multi_22","t":"multi","s":"现代管理的基本原则包括","c":"现代管理的基本原则","sc":2,"o":{"A":"整分合原则","B":"弹性原则","C":"反馈原则","D":"宽泛原则","E":"动力原则"},"a":"ABCE","e":"现代管理基本原则包括整分合原则、弹性原则、反馈原则、动力原则；无“宽泛原则”。"},{"i":"2025_4_multi_23","t":"multi","s":"根据控制措施的作用环节不同，可将控制分为","c":"控制","sc":2,"o":{"A":"生产控制","B":"前馈控制","C":"质量控制","D":"现场控制","E":"反馈控制"},"a":"BDE","e":"根据控制措施作用环节不同，分为现场控制、反馈控制和前馈控制；A、C属按业务范围分类。"},{"i":"2025_4_multi_24","t":"multi","s":"下列关于护理人员绩效评价方法的描述正确的有","c":"护理人力资源管理","sc":2,"o":{"A":"绩效评价表法容易测量，容易推广","B":"目标管理法的缺点是耗时较长","C":"描述法侧重于描述护理人员在工作中的突出行为","D":"目标管理法带有主观成分","E":"关键事件法只记录对组织工作产生积极影响的重大行为"},"a":"ABC","e":"绩效评价表法易测量易推广；目标管理法缺点是耗时较长、较客观；描述法侧重突出行为；带主观成分的是描述法；关键事件法既记积极也记消极重大行为。故D、E错。"},{"i":"2025_4_multi_25","t":"multi","s":"下列关于领导者的描述正确的有","c":"领导","sc":2,"o":{"A":"领导者是由上级指派具有正式职位的人","B":"领导者必须有追随者","C":"领导者的目的是实现组织或群体目标","D":"领导者应具备促进本组织发展的战略思维能力","E":"领导者应具有影响下属的能力"},"a":"BCDE","e":"领导者四含义：必须有追随者；要有影响追随者的能力（含正式权力与个人影响力）；根本目的是实现组织或群体目标；应具备促进本组织发展的战略思维能力。领导者并非必须由上级指派正式职位。"},{"i":"2025_4_term_26","t":"term","s":"计划（广义）","c":"计划","sc":3,"at":"参考答案（要点）：广义的计划是指制订计划、执行计划和检查计划的执行情况等整个工作的全过程（狭义计划仅指制订计划）。","e":""},{"i":"2025_4_term_28","t":"term","s":"成本－效益比","c":"控制","sc":3,"at":"参考答案（要点）：成本-效益比是指管理所投入的成本与其产生的效益之比；一般要求管理成本的效益比应在0.5以下，重点是减少大量成本、允许少许损失。","e":""},{"i":"2025_4_term_29","t":"term","s":"风险前控制","c":"护理质量管理","sc":3,"at":"参考答案（要点）：风险前控制是指对可预期的诱发事件，事先采取防范措施，避免风险产生；对无法预期的事件，准备周详可行的应变策略并事先定期演练，使风险发生时灾害减至最轻。","e":""},{"i":"2025_4_short_32","t":"short","s":"简述应用时间ABC分类法安排工作时间的步骤。","c":"计划","sc":5,"at":"参考答案（要点）：①每天工作开始时列出全天工作日程清单；②对清单上的工作按ABC等级进行分类及排序（A级紧急重要、B级次要、C级一般）；③依据ABC类事务的特征及管理要点进行各项工作的时间安排；④按ABC三个等级逐一开展工作，首先全力投入A类工作，完成后进行B类工作，大量减少C类工作，记录各项工作实际完成的时间；⑤每日总结分析，将计划时间安排与实际使用时间对比，分析时间运用效率，重新调整时间安排。","e":""},{"i":"2025_4_short_33","t":"short","s":"简述组织设计的原则。","c":"组织","sc":5,"at":"参考答案（要点）：①统一指挥原则；②责权一致原则；③分工协作原则；④精干高效原则。组织规模一定时，管理幅度与管理层次成反比。","e":""},{"i":"2025_4_short_34","t":"short","s":"简述护理管理控制的关键点。","c":"控制","sc":5,"at":"参考答案（要点）：①核心制度的落实：消毒隔离、查对、抢救、安全管理等制度；②护理人员：护理骨干、新上岗护士、进修护士、实习护士及近期遭遇重大生活事件的护士；③患者：疑难危重、新入院、手术后、接受特殊检查治疗、有自杀倾向的患者；④器材设备和药品：特殊耗材、监护仪器设备、急救器材与药品；⑤特殊科室：急诊科、手术室、供应室、监护室、婴儿室、待产室、血液透析室等；⑥时间：交接班时间、节假日、午间、夜间、工作繁忙时。","e":""},{"i":"2025_4_short_35","t":"short","s":"简述护理人员编配的原则。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：①功能需要原则（主要原则）：编配的数量、质量、整体结构应保证完成护理工作任务、满足患者护理需要；②能级对应原则：使护理人员资质、能力、品格与所担负工作职责相对应，实现个人能力与岗位要求最佳匹配；③结构比例合理原则：高/中/初级职称、老/中/青年龄、不同资质学历及临床/教学/科研人员等比例合理，形成人才梯队；④成本效率原则：人尽其才、才尽其用，降低人力成本，实现组织高效益。","e":""},{"i":"2025_4_short_37","t":"short","s":"简述社区健康教育常用的评价指标。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①反映个体或人群卫生知识水平的指标：卫生知识及格（满分）率、卫生知识达标率；②反映个体或人群卫生保健工作态度的指标：对某卫生保健行为的支持（反对）率（如对戒烟的支持率）、健康教育活动的自愿参与率；③反映个体或人群卫生习惯或卫生行为形成情况的指标：如个体保健活动参与率；④反映健康教育深度或广度的指标：卫生知识普及率、健康教育覆盖率；⑤反映人群健康水平的指标：发病率、患病率、死亡率、平均期望寿命及儿童生长发育指标。","e":""},{"i":"2025_4_essay_39","t":"essay","s":"试述组织的领导者处理冲突的方法和技能。","c":"领导","sc":10,"at":"参考答案（要点）：（一）管理冲突的事前控制方法和技能：①发现管理冲突的先兆：组织中的人际危机、各种突发事件的出现、相互误解和相互指责、情绪对立和紧张不安；领导者应具有识别冲突先兆的能力，未雨绸缪；②采取预防和化解的措施：预防如将冲突双方暂时分隔、将可能争夺资源利益的双方预先合并成团队或部门；化解如调整组织资源与利益配置，使争夺双方失去深化冲突的理由，在冲突刚露端倪时即化解消除。（二）管理冲突的事中控制方法和技能：①退避的方法和技能：在冲突负面影响较小时自我退出或躲避，保持领导逐级解决的权威地位，但损失较大时不宜使用；②妥协的方法和技能：使冲突双方自愿放弃某些观点和利益，各自主动放弃部分利益并接受对方某些观点，要求领导者有较高的管理和沟通协调技巧；③裁决或命令的方法和技能：当双方均不愿妥协、谦让或退避时，领导者使用命令裁决解决，要求领导者有较高的指挥命令技巧。结合实例展开。","e":""}]},{"key":"2025_10","name":"2025年10月","qs":[{"i":"2025_10_single_2","t":"single","s":"依据吉赛利领导者理论，对领导才能有非常重要价值的特征是","c":"领导","sc":1,"o":{"A":"性别","B":"首创精神","C":"与下属的关系亲近","D":"洞察能力"},"a":"D","e":"吉赛利特征价值表中，洞察能力（价值100）属对领导力非常重要的特征；性别（0）最不重要，首创精神、与下属关系亲近属中等重要。"},{"i":"2025_10_single_8","t":"single","s":"护士的绩效考核中，直接领导评价的优点是","c":"护理人力资源管理","sc":1,"o":{"A":"工作成员因相互了解能准确地做出评价","B":"直接观察下属的工作表现和业绩","C":"真实反映领导者的业绩","D":"护理人员随时对自己的工作进行反思"},"a":"B","e":"直接领导评价的优点是直接领导能最直接地观察其下属的工作表现和业绩；A为同行评价，C为下属评价，D为自我评价。"},{"i":"2025_10_single_9","t":"single","s":"管理者应尽量使护理人员的资质及能力与所担负的工作职责相对应，体现了护理人员编配的","c":"护理人力资源管理","sc":1,"o":{"A":"功能需要原则","B":"成本效率原则","C":"结构合理原则","D":"能级对应原则"},"a":"D","e":"能级对应原则要求管理者尽可能使护理人员的资质、能力、品格等与所担负的工作职责相对应，实现个人能力与岗位要求的最佳匹配。"},{"i":"2025_10_single_11","t":"single","s":"应用《压疮危险度评估表》对患者发生压疮的危险程度进行评分，属于风险管理的","c":"护理质量管理","sc":1,"o":{"A":"风险鉴别","B":"风险评估","C":"风险控制","D":"风险监测"},"a":"B","e":"风险评估是对可出现风险的护理项目进行程度和频率评估，常借助评估工具，如用《Braden压疮危险度评估表》等对压疮风险进行评估。"},{"i":"2025_10_single_14","t":"single","s":"“双因素理论”的提出者是","c":"领导","sc":1,"o":{"A":"梅奥","B":"泰罗","C":"麦格雷戈","D":"赫茨伯格"},"a":"D","e":"双因素理论（激励-保健因素理论）由美国心理学家赫茨伯格提出。"},{"i":"2025_10_single_16","t":"single","s":"对系统“整体把握、科学分解、组织综合”的要求，体现的是","c":"现代管理的基本原则","sc":1,"o":{"A":"弹性原则","B":"整分合原则","C":"反馈原则","D":"动力原则"},"a":"B","e":"整分合原则即从整体上把握系统、科学地进行分工分解、再组织综合，是现代管理的基本原则之一。"},{"i":"2025_10_single_17","t":"single","s":"依据时间“四象限”进行分类，处理患者投诉属于","c":"计划","sc":1,"o":{"A":"紧急且重要的事务","B":"紧急但不重要的事物","C":"重要但不紧急的事务","D":"既不紧急也不重要的事务"},"a":"A","e":"时间四象限法中，既紧急又重要的事务举例包括人事危机、客户投诉、即将到期的任务、财务危机等；患者投诉即客户投诉。"},{"i":"2025_10_single_18","t":"single","s":"在我国卫生组织的分类中，中华护理学会属于","c":"组织","sc":1,"o":{"A":"卫生行政组织","B":"卫生事业组织","C":"群众性卫生组织","D":"预防服务组织"},"a":"C","e":"群众性卫生组织包括由卫生专业人员组成的学术团体，如中华医学会、中华护理学会等。"},{"i":"2025_10_single_19","t":"single","s":"直线制组织结构的特点是","c":"组织","sc":1,"o":{"A":"一个下属只向一个上司报告工作并接受监督","B":"有多个指令源","C":"职权难以区分","D":"适用于组织面临突发事件时"},"a":"A","e":"直线制中各级管理人员对其下属拥有全部指挥权与监督权，一个下属只向一个上司报告工作并接受监督；B为职能制特点。"},{"i":"2025_10_single_20","t":"single","s":"属于护理组织文化物质层的内容是","c":"组织","sc":1,"o":{"A":"护理组织最高目标","B":"护理人员的工作服饰","C":"护理组织宗旨","D":"传染病患者的消毒隔离制度"},"a":"B","e":"物质层为表层，如工作环境、护理人员的工作服饰等；A、C属精神层，D属制度层。"},{"i":"2025_10_multi_21","t":"multi","s":"泰罗科学管理理论的基本内容有","c":"管理理论","sc":2,"o":{"A":"劳动方法标准化","B":"建立参谋机构的思想","C":"培训工人科学化","D":"差别计件工资制","E":"管理职能专业化"},"a":"ACDE","e":"泰罗科学管理理论基本内容：劳动方法标准化、挑选与培训工人科学化、差别计件工资制度、管理职能专业化（计划与执行分开）；建立参谋机构的思想属法约尔/一般管理理论。"},{"i":"2025_10_multi_22","t":"multi","s":"组织机构按职能分级划分为","c":"组织","sc":2,"o":{"A":"决策层","B":"领导层","C":"管理层","D":"基层","E":"执行层"},"a":"ACE","e":"现代管理学把组织机构按职能分级划分为三级：决策层、管理层、操作（执行）层。"},{"i":"2025_10_multi_23","t":"multi","s":"下列关于领导的描述正确的有","c":"领导","sc":2,"o":{"A":"领导的本质是一种影响力","B":"领导是某一个体","C":"领导是一种工作过程","D":"领导的目的是实现组织目标","E":"领导独立于管理之外"},"a":"ACD","e":"领导的本质是一种影响力，是一种对人们施加影响的管理（工作）过程，其根本目的是领导人们实现组织目标；领导是管理工作的重要组成部分，并非独立于管理之外，也不等同于某一个体。"},{"i":"2025_10_multi_24","t":"multi","s":"影响护理人员编配的因素有","c":"护理人力资源管理","sc":2,"o":{"A":"床位使用率","B":"护理人员素质","C":"医院的自然条件","D":"护理管理水平","E":"服务对象的经济条件"},"a":"ABCDE","e":"影响编配因素：工作任务（含床位使用率）、人员素质、工作环境（含医院自然条件）、管理水平（含护理管理水平）、国家政策法规、社会因素（含服务对象经济条件）。五项均属。"},{"i":"2025_10_short_31","t":"short","s":"简述能级划分时应遵守的原则。","c":"现代管理的基本原则","sc":5,"at":"参考答案（要点）：①岗位等级设置合理有序：管理层次必须按能级科学划分，能级稳定而充满活力的组织结构应是多层次的正三角形态（上层经营决策层、中间职能管理层、下层操作执行层），避免倒三角、菱形等不稳定结构；②人员配置时个人能力与级别匹配：使有相应才能的人处在相应能级的岗位上，做到人尽其才，形成稳定结构并持续有效运转。","e":""},{"i":"2025_10_short_32","t":"short","s":"简述组织管理宽度的影响因素。","c":"组织","sc":5,"at":"参考答案（要点）：①主管人员与其下属双方的素质和能力：素质高、能力强、经验丰富，管理宽度可大些，反之减小；②上下级管理工作的复杂性、计划性以及下级人员工作的相似性：高层面对问题复杂，幅度宜小；计划完善、下属工作相似，幅度可增大；③授权：适当授权可减少监督时间精力，增大管理幅度；④组织环境：环境变化快、新问题多，管理幅度越小；⑤工作条件：助手配备、信息手段完备、自动化水平高，管理幅度可大些。","e":""},{"i":"2025_10_short_34","t":"short","s":"简述绩效考核的形式。","c":"护理人力资源管理","sc":5,"at":"参考答案（要点）：绩效考核的形式包括：①直接领导评价；②同行（同事）评价；③下属评价；④自我评价。实际工作中可根据具体情况单独或联合采用，必要时采用复合形式。","e":""},{"i":"2025_10_short_35","t":"short","s":"简述护理管理者处理患者投诉的措施。","c":"护理质量管理","sc":5,"at":"参考答案（要点）：①首先应耐心接待，认真受理并记录；②采取纠正措施，如解释说明、赔礼道歉等；③对投诉问题进行调查、了解原因，评估问题严重性，分清责任，做出适当补偿；④采取纠正措施，防止问题再次发生；⑤跟踪调查。","e":""},{"i":"2025_10_short_37","t":"short","s":"简述社区慢性病自我管理的支持方式。","c":"社区护理管理","sc":5,"at":"参考答案（要点）：①建立支持系统：包括医院、社区、家庭、病友；②激发患者的中心角色作用；③通过讲座、咨询、指导、热线电话、患者俱乐部、媒体、网络等形式，增加慢性病患者自我管理的知识和技能。","e":""}]}]}];

function addWrong(id){ if(!wrongSet[id]){ wrongSet[id]=true; saveWrong(Object.keys(wrongSet)); } }
function removeWrong(id){ if(wrongSet[id]){ delete wrongSet[id]; saveWrong(Object.keys(wrongSet)); } }
function wrongCount(){ return Object.keys(wrongSet).length; }

function el(tag, attrs, html){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(html!=null) e.innerHTML=html;
  return e;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;","&gt;":">",'"':"&quot;"}[c];}); }

function enterSubject(i){
  curSubj=i;
  reloadWrong();
  ALL=[]; QMAP={};
  subj().papers.forEach(function(p){ p.qs.forEach(function(q){ ALL.push(q); QMAP[q.i]=q; }); });
  location.hash="#/home";
}

/* router */
function route(){
  var h=location.hash||"#/pick";
  if(h.indexOf("#/pick")===0){ renderPick(); return; }
  if(h.indexOf("#/home")===0){ renderHome(); return; }
  if(h.indexOf("#/papers")===0){ renderPapers(); return; }
  if(h.indexOf("#/types")===0){ renderTypes(); return; }
  if(h.indexOf("#/quiz")===0){ renderQuiz(); return; }
  if(h.indexOf("#/result")===0){ renderResult(); return; }
  if(h.indexOf("#/wrong")===0){ renderWrong(); return; }
  if(h.indexOf("#/mock")===0){ renderMockChoose(); return; }
  if(h.indexOf("#/mockrun")===0){ renderMockRun(); return; }
  if(h.indexOf("#/about")===0){ renderAbout(); return; }
  renderPick();
}
window.addEventListener("hashchange", route);

function topbar(title, showBack){
  var a=el("div",{class:"topbar"});
  if(showBack){
    var b=el("button",{class:"back"},"&#8592;");
    b.onclick=function(){ history.length>1 ? history.back() : location.hash="#/pick"; };
    a.appendChild(b);
  } else { a.appendChild(el("div",{class:"right"})); }
  a.appendChild(el("div",{class:"title"},title));
  a.appendChild(el("div",{class:"right"}));
  return a;
}

function askOrder(qs, title, cb){
  var app=document.getElementById("app"); app.innerHTML="";
  app.appendChild(topbar("练习设置",true));
  var p=el("div",{class:"picker"});
  p.appendChild(el("h2",null,"共 "+qs.length+" 题 · "+title));
  p.appendChild(el("button",{class:"btn btn-primary"}, "顺序练习")).onclick=function(){ cb("seq", qs, title); };
  p.appendChild(el("button",{class:"btn btn-ghost"}, "随机乱序")).onclick=function(){ cb("shuffle", qs, title); };
  app.appendChild(p);
}

function startSession(qs, title, mode){
  qs=qs.slice();
  if(mode==="shuffle") qs=shuffle(qs);
  S.queue=qs; S.idx=0; S.picked={}; S.graded={}; S.subjState={}; S.mode=mode; S.title=title;
  S.objTotal=0; S.objRight=0; S.subjDone=0; S.subjMaster=0;
  location.hash="#/quiz";
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function currentQ(){ return S.queue[S.idx]; }

/* quiz */
function renderQuiz(){
  var app=document.getElementById("app"); app.innerHTML="";
  if(S.queue.length===0){ app.appendChild(topbar("练习",true)); var e=el("div",{class:"empty"}); e.appendChild(el("div",{class:"big"},"∅")); e.appendChild(el("p",null,"没有题目")); app.appendChild(e); return; }
  app.appendChild(topbar(S.title,false));
  var q=currentQ();
  var body=el("div",{class:"quiz-body"});
  var pw=el("div",{class:"prog-wrap"});
  var pt=el("div",{class:"prog-text"});
  pt.appendChild(el("span",null,"第 "+(S.idx+1)+" / "+S.queue.length+" 题"));
  pt.appendChild(el("span",null,TYPE_NAME[q.t]||q.t));
  pw.appendChild(pt);
  var bar=el("div",{class:"prog-bar"});
  bar.appendChild(el("div",{class:"prog-fill","style":"width:"+Math.round(S.idx/S.queue.length*100)+"%"}));
  pw.appendChild(bar);
  body.appendChild(pw);

  var card=el("div",{class:"qcard"});
  var meta=el("div",{class:"qmeta"});
  meta.appendChild(el("span",{class:"badge "+q.t}, TYPE_NAME[q.t]||q.t));
  if(q.sc) meta.appendChild(el("span",{class:"score-tag"}, q.sc+" 分"));
  if(q.c) meta.appendChild(el("span",{class:"chapter-tag"}, esc(q.c)));
  card.appendChild(meta);
  card.appendChild(el("div",{class:"stem"}, esc(q.s)));

  var graded=S.graded[q.i];
  if(OBJECTIVE[q.t]){
    var opts=el("div",{class:"opts"});
    var letters=Object.keys(q.o).sort();
    letters.forEach(function(L){
      var o=el("button",{class:"opt"});
      o.appendChild(el("span",{class:"ol"},L));
      o.appendChild(el("span",{class:"ot"},esc(q.o[L])));
      var picked=(S.picked[q.i]||[]).indexOf(L)>=0;
      if(picked) o.classList.add("sel");
      if(graded){
        o.classList.add("locked");
        if(q.a.indexOf(L)>=0) o.classList.add("correct");
        else if(picked) o.classList.add("wrong");
        else o.classList.add("dim");
      } else {
        (function(letter, btn){
          btn.onclick=function(){
            var arr=S.picked[q.i]||[];
            if(q.t==="single") arr=[letter];
            else { var pos=arr.indexOf(letter); if(pos>=0) arr.splice(pos,1); else arr.push(letter); }
            S.picked[q.i]=arr.sort();
            renderQuiz();
          };
        })(L,o);
      }
      opts.appendChild(o);
    });
    card.appendChild(opts);
    if(graded){
      var ok=S.picked[q.i].join("")===q.a;
      var fb=el("div",{class:"feedback "+(ok?"ok":"bad")});
      fb.appendChild(el("div",{class:"ans"},(ok?"✓ 正确":"✗ 错误")+"　答案："+q.a));
      if(q.e) fb.appendChild(el("div",{class:"exp"},esc(q.e)));
      card.appendChild(fb);
    }
  } else {
    if(graded){
      var ans=el("div",{class:"subj-ans"});
      ans.appendChild(el("span",{class:"lab"},"参考答案（要点）"));
      ans.appendChild(document.createTextNode(q.at||"（暂无）"));
      card.appendChild(ans);
      var sa=el("div",{class:"self-assess"});
      var mastered=S.subjState[q.i]==="ok";
      var b1=el("button",{class:"btn btn-ok"}, mastered?"已标：我会了":"我会了");
      var b2=el("button",{class:"btn btn-bad"}, !mastered?"还不会":"已标：还不会");
      b1.onclick=function(){ selfAssess(q,"ok"); };
      b2.onclick=function(){ selfAssess(q,"bad"); };
      sa.appendChild(b1); sa.appendChild(b2);
      card.appendChild(sa);
    }
  }
  body.appendChild(card);
  var acts=el("div",{class:"quiz-actions"});
  if(OBJECTIVE[q.t]){
    if(!graded){
      var sub=el("button",{class:"btn btn-primary"},"提交");
      sub.onclick=function(){ gradeObjective(q); };
      acts.appendChild(sub);
    } else acts.appendChild(nextBtn());
  } else {
    if(!graded){
      var show=el("button",{class:"btn btn-primary"},"查看参考答案");
      show.onclick=function(){ S.graded[q.i]=true; renderQuiz(); };
      acts.appendChild(show);
    } else acts.appendChild(nextBtn());
  }
  body.appendChild(acts);
  app.appendChild(body);
}

function nextBtn(){
  var last=S.idx>=S.queue.length-1;
  var b=el("button",{class:"btn btn-primary"}, last?"查看结果":"下一题");
  b.onclick=function(){ if(last) location.hash="#/result"; else { S.idx++; renderQuiz(); } };
  return b;
}
function gradeObjective(q){
  var picked=S.picked[q.i];
  if(!picked||picked.length===0){ alert("请先选择"); return; }
  S.graded[q.i]=true;
  var ok=picked.join("")===q.a;
  S.objTotal++;
  if(ok){ S.objRight++; removeWrong(q.i); } else addWrong(q.i);
  renderQuiz();
}
function selfAssess(q,val){
  S.subjState[q.i]=val;
  S.subjDone++;
  if(val==="ok"){ S.subjMaster++; removeWrong(q.i); } else addWrong(q.i);
  renderQuiz();
}

/* wrong book */
function renderWrong(){
  var app=document.getElementById("app"); app.innerHTML="";
  app.appendChild(topbar(subj().name+" · 错题本",true));
  var ids=Object.keys(wrongSet);
  if(ids.length===0){
    var e=el("div",{class:"empty"});

  }
  var wrap=el("div",{class:"list"});

    foot.appendChild(el("span",{style:"font-size:12px;color:var(--muted)"}, q.c?esc(q.c):""));
    var rm=el("button",{class:"link-btn"},"移出");
    rm.onclick=function(){ removeWrong(id); renderWrong(); };
    foot.appendChild(rm);
    it.appendChild(foot);
    wrap.appendChild(it);
  });
  app.appendChild(wrap);
}

function startMock(p){
  S.queue=p.qs.slice(); S.idx=0; S.mockAnswers={}; S.mockGraded=false;
  S.mockTitle=p.name; S.mockEnd=Date.now()+MOCK_MINUTES*60*1000;
  location.hash="#/mockrun";
}
function fmtTime(ms){ if(ms<0)ms=0; var m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000); return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }

function renderMockRun(){
  var app=document.getElementById("app"); app.innerHTML="";
  if(mockTimerId){ clearInterval(mockTimerId); mockTimerId=null; }
  if(S.mockGraded){ renderMockReview(); return; }

  var a=el("div",{class:"topbar"});
  a.appendChild(el("div",{class:"right"}));
  a.appendChild(el("div",{class:"title"},"模拟考试 · "+S.mockTitle));
  var t=el("div",{class:"timer",id:"mockTimer"});
  t.textContent=fmtTime(S.mockEnd-Date.now());
  a.appendChild(t);
  app.appendChild(a);

  mockTimerId=setInterval(function(){
    var el2=document.getElementById("mockTimer");
    if(!el2){ clearInterval(mockTimerId); return; }
    var remain=S.mockEnd-Date.now();
    el2.textContent=fmtTime(remain);
    if(remain<300000) el2.classList.add("warn");
    if(remain<=0){ clearInterval(mockTimerId); doMockSubmit(); }
  },1000);

  var q=S.queue[S.idx];
  var body=el("div",{class:"quiz-body"});
  var pw=el("div",{class:"prog-wrap"});
  var pt=el("div",{class:"prog-text"});
  pt.appendChild(el("span",null,"第 "+(S.idx+1)+" / "+S.queue.length+" 题"));
  pt.appendChild(el("span",null,TYPE_NAME[q.t]||q.t));
  pw.appendChild(pt);
  var bar=el("div",{class:"prog-bar"});
  bar.appendChild(el("div",{class:"prog-fill","style":"width:"+Math.round(S.idx/S.queue.length*100)+"%"}));
  pw.appendChild(bar);
  body.appendChild(pw);

  var card=el("div",{class:"qcard"});
  var meta=el("div",{class:"qmeta"});
  meta.appendChild(el("span",{class:"badge "+q.t}, TYPE_NAME[q.t]||q.t));
  if(q.sc) meta.appendChild(el("span",{class:"score-tag"}, q.sc+" 分"));
  card.appendChild(meta);
  card.appendChild(el("div",{class:"stem"}, esc(q.s)));

  if(OBJECTIVE[q.t]){
    var opts=el("div",{class:"opts"});
    var letters=Object.keys(q.o).sort();
    var cur=S.mockAnswers[q.i]||[];
    letters.forEach(function(L){
      var o=el("button",{class:"opt"});
      o.appendChild(el("span",{class:"ol"},L));
      o.appendChild(el("span",{class:"ot"},esc(q.o[L])));
      if(cur.indexOf(L)>=0) o.classList.add("sel");
      (function(letter,btn){
        btn.onclick=function(){
          var arr=S.mockAnswers[q.i]||[];
          if(q.t==="single") arr=[letter];
          else { var pos=arr.indexOf(letter); if(pos>=0) arr.splice(pos,1); else arr.push(letter); }
          S.mockAnswers[q.i]=arr.sort();
          renderMockRun();
        };
      })(L,o);
      opts.appendChild(o);
    });
    card.appendChild(opts);
  } else {
    var note=el("div",{class:"mock-subj-note"});
    note.textContent="主观题：交卷后对照答案自评。先在草稿纸上作答。";
    card.appendChild(note);
    if(!S.mockAnswers[q.i]) S.mockAnswers[q.i]=["__seen__"];
  }
  body.appendChild(card);

  var sheet=el("div",{class:"mock-sheet"});
  S.queue.forEach(function(qq,i){
    var cell=el("button",{class:"cell"});
    cell.textContent=(i+1);
    if(S.mockAnswers[qq.i]&&S.mockAnswers[qq.i].length>0) cell.classList.add("answered");
    if(i===S.idx) cell.classList.add("current");
    cell.onclick=function(){ S.idx=i; renderMockRun(); };
    sheet.appendChild(cell);
  });
  body.appendChild(sheet);

  var nav=el("div",{class:"quiz-actions"});
  var row=el("div",{class:"row2"});
  var prev=el("button",{class:"btn btn-ghost"},"上一题");
  prev.onclick=function(){ if(S.idx>0){ S.idx--; renderMockRun(); } };
  var next=el("button",{class:"btn btn-primary"}, S.idx>=S.queue.length-1?"交卷":"下一题");
  next.onclick=function(){ if(S.idx>=S.queue.length-1) doMockSubmit(); else { S.idx++; renderMockRun(); } };
  row.appendChild(prev); row.appendChild(next);
  nav.appendChild(row);
  var sub=el("button",{class:"btn btn-bad"},"提前交卷");
  sub.onclick=function(){ doMockSubmit(); };
  nav.appendChild(sub);
  body.appendChild(nav);
  app.appendChild(body);
}

function doMockSubmit(){
  if(mockTimerId){ clearInterval(mockTimerId); mockTimerId=null; }
  var answered=Object.keys(S.mockAnswers).filter(function(k){
    var a=S.mockAnswers[k]; return a&&a.length>0&&!(a.length===1&&a[0]==="__seen__");
  }).length;
  var totalObj=S.queue.filter(function(q){return OBJECTIVE[q.t];}).length;
  if(!confirm("确定交卷？\n已作答客观题 "+answered+" / "+totalObj+" 题。")) return;
  S.mockGraded=true;
  location.hash="#/mockrun";
}

function renderMockReview(){
  var app=document.getElementById("app"); app.innerHTML="";
  app.appendChild(topbar("模拟考试结果",true));
  var body=el("div",{class:"quiz-body"});
  var objRight=0,objTotal=0;
  S.queue.forEach(function(q){
    if(OBJECTIVE[q.t]){
      objTotal++;
      if((S.mockAnswers[q.i]||[]).join("")===q.a) objRight++;
    }
  });
  var rate=objTotal>0?Math.round(objRight/objTotal*100):0;
  var card=el("div",{class:"score-card"});
  card.appendChild(el("div",{class:"big"},rate+'<small>%</small>'));
  card.appendChild(el("div",{style:"color:var(--muted);font-size:14px;margin-top:4px"},"客观题正确率"));
  var sr=el("div",{class:"score-row"});
  sr.appendChild(box(objRight,"答对"));
  sr.appendChild(box(objTotal-objRight,"答错"));
  sr.appendChild(box(objTotal,"客观总数"));
  card.appendChild(sr);
  body.appendChild(card);

  body.appendChild(el("h2",{style:"font-size:17px;margin:18px 0 10px;color:var(--primary-d)"},"答案回顾"));
  S.queue.forEach(function(q,idx){
    var rc=el("div",{class:"wrong-item"});
    var meta=el("div",{class:"qmeta"});
    meta.appendChild(el("span",{class:"badge "+q.t}, TYPE_NAME[q.t]||q.t));
    if(OBJECTIVE[q.t]){
      var picked=(S.mockAnswers[q.i]||[]).join("")||"未作答";
      var ok=picked===q.a;
      meta.appendChild(el("span",{class:"badge "+(ok?"":"wrong")}, ok?"✓":"✗"));
      rc.appendChild(meta);
      rc.appendChild(el("div",{class:"ws"},(idx+1)+". "+esc(q.s)));
      rc.appendChild(el("div",{style:"font-size:14px;margin:6px 0;color:var(--bad)"},"你的答案："+esc(picked)));
      rc.appendChild(el("div",{style:"font-size:14px;margin:2px 0;color:var(--ok)"},"正确答案："+esc(q.a)));
      if(q.e) rc.appendChild(el("div",{style:"font-size:13px;color:var(--muted);margin-top:4px"},esc(q.e)));
      if(!ok) addWrong(q.i);
    } else {
      meta.appendChild(el("span",{class:"badge short"},"主观"));
      rc.appendChild(meta);
      rc.appendChild(el("div",{class:"ws"},(idx+1)+". "+esc(q.s)));
      var ans=el("div",{class:"subj-ans",style:"margin-top:8px"});
      ans.appendChild(el("span",{class:"lab"},"参考答案（要点）"));
      ans.appendChild(document.createTextNode(q.at||"（暂无）"));
      rc.appendChild(ans);
    }
    body.appendChild(rc);
  });
  body.appendChild(el("button",{class:"btn btn-primary"},"返回科目选择")).onclick=function(){ location.hash="#/pick"; };
  body.appendChild(el("div",{style:"height:20px"}));
  app.appendChild(body);
}

/* about */
function renderAbout(){
  var app=document.getElementById("app"); app.innerHTML="";
  app.appendChild(topbar("关于/来源",true));
  var s=subj();
  var a=el("div",{class:"about"});
  a.appendChild(el("h2",null,"课程信息"));
  a.appendChild(el("p",null,s.name+"（课程代码 "+s.code+"），收录近10年共 "+s.papers.length+" 个场次。"));
  a.appendChild(el("h2",null,"答案说明"));
  a.appendChild(el("p",null,"题目答案与解析为根据教材整理的<b>参考答案</b>，仅供练习对照。主观题请对照要点自评。"));
  a.appendChild(el("h2",null,"添加科目"));
  a.appendChild(el("p",null,"如需增加新科目或新场次，只需在题库 JSON 中追加数据并重新构建即可。错题本按科目分别保存。"));
  var note=el("div",{class:"note"});
  note.appendChild(el("b",null,"数据边界："));
  note.appendChild(document.createTextNode("做题进度与错题本保存在浏览器本地存储中，换设备或清理数据后不会同步。请固定使用同一浏览器。"));
  a.appendChild(note);
  app.appendChild(a);
}

route();
